<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portcullis - Users</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #1e293b; }
    h1 { font-size: 1.5rem; color: #f1f5f9; }
    h1 a { color: #3b82f6; text-decoration: none; }
    .user-badge { background: #1e293b; padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; }
    .user-badge strong { color: #3b82f6; }
    h2 { font-size: 1.25rem; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 0.75rem; overflow: hidden; }
    th { text-align: left; padding: 0.75rem 1rem; background: #263548; color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 0.75rem 1rem; border-top: 1px solid #0f172a; }
    tr:hover td { background: #263548; }
    .btn { display: inline-block; padding: 0.375rem 0.75rem; background: #3b82f6; color: #fff; border-radius: 0.375rem; text-decoration: none; font-size: 0.875rem; transition: background 0.2s; }
    .btn:hover { background: #2563eb; }
    .empty { text-align: center; padding: 3rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="/">Portcullis</a> / Users</h1>
      {{if .User}}
      <div class="user-badge">Authenticated as <strong>{{.User}}</strong></div>
      {{end}}
    </header>

    {{if .Users}}
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>Name</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        {{range .Users}}
        <tr>
          <td><strong>{{.Username}}</strong></td>
          <td>{{.Email}}</td>
          <td>{{.FirstName}} {{.LastName}}</td>
          <td><a class="btn" href="/enroll/{{.Username}}">Enroll YubiKey</a></td>
        </tr>
        {{end}}
      </tbody>
    </table>
    {{else}}
    <div class="empty">
      <p>No users found in the directory.</p>
      <p>Add users in <a href="https://directory.{{.Domain}}" style="color:#3b82f6;">LLDAP</a> first.</p>
    </div>
    {{end}}
  </div>
</body>
</html>
