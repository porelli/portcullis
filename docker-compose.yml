name: portcullis

networks:
  portcullis:
    name: portcullis
  # Shared routing plane (Traefik + app frontends). Fixed IPAM so Traefik
  # has a well-known address: header-auth apps (grafana, firefly-iii, ...)
  # trust X-Forwarded-User / X-WEBAUTH-USER only from PORTCULLIS_TRAEFIK_IP.
  # Dynamic container addresses come from PORTCULLIS_PROXY_IP_RANGE, which
  # must lie inside the subnet and must NOT contain PORTCULLIS_TRAEFIK_IP —
  # so no app container can ever be handed Traefik's address.
  # Docker cannot change IPAM in place: after editing these, the network
  # must be removed and recreated (./portcullis up explains how).
  portcullis-proxy:
    name: portcullis-proxy
    ipam:
      config:
        - subnet: ${PORTCULLIS_PROXY_SUBNET:-172.31.250.0/24}
          ip_range: ${PORTCULLIS_PROXY_IP_RANGE:-172.31.250.128/25}

  # Traefik ↔ Keycloak only. Keycloak trusts proxy headers — including the
  # client certificate Traefik forwards for X.509 login — ONLY from
  # Traefik's fixed address here (--proxy-trusted-addresses). Anything else
  # that reaches Keycloak (the 127.0.0.1:8080 publish, the portcullis
  # network) cannot inject a client certificate. internal: no egress.
  portcullis-auth:
    name: portcullis-auth
    internal: true
    ipam:
      config:
        - subnet: ${PORTCULLIS_AUTH_SUBNET:-172.31.251.0/28}
          ip_range: ${PORTCULLIS_AUTH_IP_RANGE:-172.31.251.8/29}
  # Docker API access (integration contract §6): each client only reaches
  # its own socket proxy, on a network shared with nobody else.
  socket-proxy-traefik:
    internal: true
  socket-proxy-hub:
    internal: true
  # Monitoring profile: Prometheus, Alertmanager, Grafana, exporters. No
  # egress; Prometheus / blackbox also join `portcullis` to reach the
  # targets, Grafana `portcullis-proxy` (Traefik), Alertmanager `alerting`
  # (egress for webhook / SMTP receivers).
  monitoring:
    internal: true
  alerting: {}

# Hardening defaults (see docs/hardening.md for per-service exceptions).
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  # Read-only Docker API for Traefik's docker provider: containers,
  # networks, events, version (+ /_ping). No writes (POST=0).
  socket-proxy-traefik:
    image: ghcr.io/linuxserver/socket-proxy:3.4.7@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    <<: *hardening
    # HAProxy runs as root (the socket is root:docker) and chroots to "/".
    cap_add: [SYS_CHROOT]
    read_only: true
    tmpfs:
      - /run
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      VERSION: "1"
      PING: "1"
      POST: "0"
      DISABLE_IPV6: "1"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-traefik
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped

  # Docker API for the Hub: what `docker compose up/down` and the Hub's
  # Engine API calls need — containers (create/start/stop/rm/inspect/list/
  # logs/exec), images (pull/inspect), networks, volumes, exec, events,
  # info, version, /_ping — with write methods (POST=1 also allows
  # PUT/DELETE on those sections). Denied: build, commit, swarm, nodes,
  # services, tasks, secrets, configs, plugins, system (df/prune), auth,
  # distribution, container archive/export.
  socket-proxy-hub:
    image: ghcr.io/linuxserver/socket-proxy:3.4.7@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    <<: *hardening
    cap_add: [SYS_CHROOT]
    read_only: true
    tmpfs:
      - /run
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      EXEC: "1"
      EVENTS: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      ALLOW_LOGS: "1"
      POST: "1"
      DISABLE_IPV6: "1"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-hub
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped

  traefik:
    image: traefik:v3.7.17@sha256:30ff62491aacdb862ceb8c9edcf2627da638d7deafdd4b6dab32fe34f8aa3e90
    <<: *hardening
    # Runs as root (binds :80/:443, owns the ACME volume) but with no
    # capability except binding low ports; root without CAP_DAC_OVERRIDE
    # can only read files it may read by mode (certs/ are world/group-0
    # readable, see ./portcullis up).
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # Static configuration (env vars are the sole config source)
      TRAEFIK_API_DASHBOARD: "true"
      TRAEFIK_API_INSECURE: "false"
      TRAEFIK_LOG_LEVEL: INFO
      TRAEFIK_ACCESSLOG: "true"
      # Entrypoints
      TRAEFIK_PING: "true"
      # Internal entrypoint for /ping (healthcheck) — not published.
      TRAEFIK_ENTRYPOINTS_TRAEFIK_ADDRESS: ":8080"
      TRAEFIK_ENTRYPOINTS_TRAEFIK_HTTP_ALIASHEADERSSTRATEGY: delete
      # Prometheus metrics on an internal entrypoint (:8082, not published;
      # scraped over the portcullis network by the monitoring profile).
      TRAEFIK_ENTRYPOINTS_METRICS_ADDRESS: ":8082"
      TRAEFIK_ENTRYPOINTS_METRICS_HTTP_ALIASHEADERSSTRATEGY: delete
      TRAEFIK_METRICS_PROMETHEUS: "true"
      TRAEFIK_METRICS_PROMETHEUS_ENTRYPOINT: metrics
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      # Drop header-name aliases (X_Forwarded_Tls_Client_Cert, ...) before
      # routing; the canonical X-Forwarded-* / X-Forwarded-Tls-Client-*
      # headers are always deleted from untrusted clients (no trustedIPs).
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_ALIASHEADERSSTRATEGY: delete
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ALIASHEADERSSTRATEGY: delete
      # Routers without an explicit entrypoint attach to websecure only.
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ASDEFAULT: "true"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: websecure
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: https
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_CERTRESOLVER: letsencrypt
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_DOMAINS_0_MAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_DOMAINS_0_SANS: "*.${PORTCULLIS_DOMAIN:-portcullis.local}"
      # Providers
      TRAEFIK_PROVIDERS_DOCKER: "true"
      # No socket mount: read-only API through its own proxy (contract §6).
      TRAEFIK_PROVIDERS_DOCKER_ENDPOINT: tcp://socket-proxy-traefik:2375
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: portcullis-proxy
      TRAEFIK_PROVIDERS_FILE_DIRECTORY: /etc/traefik/dynamic
      TRAEFIK_PROVIDERS_FILE_WATCH: "true"
      # ACME (Let's Encrypt)
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL:-admin@portcullis.local}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_STORAGE: /acme/acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_CASERVER: ${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_DNSCHALLENGE: "true"
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_DNSCHALLENGE_PROVIDER: ${DNS_PROVIDER:-cloudflare}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_DNSCHALLENGE_RESOLVERS: 1.1.1.1:53,8.8.8.8:53
      # DNS provider credentials
      # Cloudflare
      CF_API_EMAIL: ${CF_API_EMAIL:-}
      CF_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      # Porkbun
      PORKBUN_API_KEY: ${PORKBUN_API_KEY:-}
      PORKBUN_SECRET_API_KEY: ${PORKBUN_SECRET_API_KEY:-}
      # Route53
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID:-}
      # DigitalOcean
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN:-}
      # Hetzner
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}
      # Google Cloud DNS
      GCE_PROJECT: ${GCE_PROJECT:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
      - traefik_acme:/acme
    networks:
      portcullis: {}
      portcullis-proxy:
        ipv4_address: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
      portcullis-auth:
        ipv4_address: ${PORTCULLIS_AUTH_TRAEFIK_IP:-172.31.251.2}
      socket-proxy-traefik: {}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    pids_limit: 512
    depends_on:
      socket-proxy-traefik:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.tls: "true"
      traefik.http.routers.dashboard.tls.certresolver: letsencrypt
      traefik.http.routers.dashboard.tls.domains[0].main: ${PORTCULLIS_DOMAIN:-portcullis.local}
      traefik.http.routers.dashboard.tls.domains[0].sans: "*.${PORTCULLIS_DOMAIN:-portcullis.local}"
      traefik.http.routers.dashboard.tls.options: authaware@file
      traefik.http.routers.dashboard.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.dashboard.service: api@internal
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    <<: *hardening
    # The image's postgres user. /var/lib/postgresql is postgres-owned in
    # the image, so a fresh volume inherits it and the entrypoint needs no
    # chown/su-exec (hence no capabilities).
    user: "70:70"
    read_only: true
    tmpfs:
      - /var/run/postgresql:mode=1777
      - /tmp
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set — run ./portcullis init}
    volumes:
      # Postgres 18+ expects the mount at /var/lib/postgresql (the image stores
      # data under a versioned subdir so pg_upgrade can work without mount
      # boundary issues). Mounting at /var/lib/postgresql/data makes the image
      # refuse to start on a fresh volume.
      - postgres_data:/var/lib/postgresql
    networks:
      - portcullis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1g
    pids_limit: 256
    shm_size: 128m
    restart: unless-stopped

  vault:
    image: hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    <<: *hardening
    # The image's vault user (uid 100, gid 1000). secrets/vault-unseal is
    # group 1000, mode 0750/0640 (./portcullis vault init|up).
    user: "100:1000"
    read_only: true
    tmpfs:
      - /tmp
    # Server mode with raft storage (vault/vault.hcl). The wrapper starts
    # Vault and auto-unseals it on every container start from
    # secrets/vault-unseal/unseal-key (written by ./portcullis vault init).
    entrypoint: ["/bin/sh", "/vault/portcullis/entrypoint.sh"]
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      # disable_mlock = true in vault.hcl (recommended for raft) — no
      # IPC_LOCK capability needed, so skip the image's setcap step.
      SKIP_SETCAP: "true"
    ports:
      # Loopback only: the ./portcullis CLI (pki setup, cert ..., status)
      # uses http://127.0.0.1:8200. The listener is plain HTTP —
      # never expose it on 0.0.0.0.
      - "127.0.0.1:8200:8200"
    volumes:
      # /vault/file: vault-owned in the image (it runs non-root), so the
      # fresh named volume gets the right owner. See vault/vault.hcl.
      - vault_data:/vault/file
      - ./vault:/vault/portcullis:ro
      - ./secrets/vault-unseal:/vault/unseal:ro
    networks:
      - portcullis
    healthcheck:
      # Exit code 0 only when initialised AND unsealed.
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

  lldap:
    # -rootless: runs as lldap (uid 1000), /data is lldap-owned in the image.
    image: lldap/lldap:v0.6.3-alpine-rootless@sha256:ba2c50930ea998eefd5454aa678a7977448019248b1827da87d330df0b71c284
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    environment:
      LLDAP_JWT_SECRET: ${LLDAP_JWT_SECRET:?LLDAP_JWT_SECRET is not set — run ./portcullis init}
      LLDAP_LDAP_USER_PASS: ${LLDAP_ADMIN_PASSWORD:?LLDAP_ADMIN_PASSWORD is not set — run ./portcullis init}
      LLDAP_LDAP_BASE_DN: ${LLDAP_BASE_DN:-dc=portcullis,dc=local}
      LLDAP_LDAP_USER_DN: admin
      LLDAP_LDAP_USER_EMAIL: admin@portcullis.local
      LLDAP_HTTP_URL: https://directory.${PORTCULLIS_DOMAIN:-portcullis.local}
    volumes:
      - lldap_data:/data
    networks:
      - portcullis
    labels:
      # LLDAP web UI — protected tier
      traefik.enable: "true"
      traefik.docker.network: portcullis
      traefik.http.routers.lldap.rule: Host(`directory.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.lldap.entrypoints: websecure
      traefik.http.routers.lldap.tls.options: authaware@file
      traefik.http.routers.lldap.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.lldap.loadbalancer.server.port: "17170"
    healthcheck:
      test: ["CMD", "/app/lldap", "healthcheck", "--config-file", "/data/lldap_config.toml"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    <<: *hardening
    # Not read_only: `start` re-augments the server into /opt/keycloak/lib
    # when build options (the x509 lookup provider) differ from the image's.
    tmpfs:
      - /tmp
    command:
      - start
      - --import-realm
      - --http-enabled=true
      - --http-port=8080
      - --hostname=https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}
      - --proxy-headers=xforwarded
      # Proxy headers (X-Forwarded-*, and the client cert below) are honoured
      # only from Traefik's fixed address on the portcullis-auth network:
      # Quarkus decides "trusted proxy" from the TCP peer of each request and
      # the x509 lookup returns no cert otherwise (so the 127.0.0.1:8080
      # publish below, used by the CLI, cannot be used to forge a cert).
      - --proxy-trusted-addresses=${PORTCULLIS_AUTH_TRAEFIK_IP:-172.31.251.2}
      - --health-enabled=true
      # /metrics on the management port 9000 (not routed by Traefik).
      - --metrics-enabled=true
      # X.509 login: Traefik verifies the client cert (authaware TLS on
      # auth.<domain>) and forwards it PEM-encoded in X-Forwarded-Tls-Client-Cert
      # (client-cert-pem@file); Keycloak's `traefik` lookup provider reads it.
      - --spi-x509cert-lookup--provider=traefik
      # Our CA chain (certs/truststore/, written by ./portcullis pki setup):
      # the X.509 authenticator re-validates the forwarded cert against it.
      - --truststore-paths=/opt/keycloak/conf/truststores/portcullis
      # Re-fetch Vault's CRL at least every 60s (default: until nextUpdate).
      - --spi-crl-storage--infinispan--cache-time=60
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set — run ./portcullis init}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is not set — run ./portcullis init}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./certs/truststore:/opt/keycloak/conf/truststores/portcullis:ro
    networks:
      - portcullis
      - portcullis-auth
    healthcheck:
      test: ["CMD", "bash", "-c", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    pids_limit: 1024
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis-auth
      # All routers on auth.<domain> MUST use the same TLS option (Traefik requirement).
      # authaware@file: a client cert is requested but optional (verified
      # against the CA if given), so YubiKey PIV users can log in with it
      # (X.509) and everyone else with WebAuthn / password.
      # Public OIDC/SAML endpoints — no forward-auth (users need these to log in)
      traefik.http.routers.keycloak.rule: Host(`auth.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.keycloak.entrypoints: websecure
      traefik.http.routers.keycloak.tls.options: authaware@file
      traefik.http.routers.keycloak.middlewares: rate-limit-auth@file,client-cert-pem@file,security-headers@file
      traefik.http.routers.keycloak.priority: "1"
      traefik.http.services.keycloak.loadbalancer.server.port: "8080"
      # Admin console + master realm — protected behind forward-auth + group-gate
      # (auth=lldap_admin). /realms/master is the admin realm's login/token
      # endpoint; it has no business being public. The CLI and the Hub reach
      # the admin API over the internal network (http://keycloak:8080 or the
      # 127.0.0.1:8080 publish), which bypasses Traefik.
      traefik.http.routers.keycloak-admin.rule: Host(`auth.${PORTCULLIS_DOMAIN:-portcullis.local}`) && (PathPrefix(`/admin`) || PathPrefix(`/realms/master`))
      traefik.http.routers.keycloak-admin.entrypoints: websecure
      traefik.http.routers.keycloak-admin.tls.options: authaware@file
      traefik.http.routers.keycloak-admin.middlewares: rate-limit-auth@file,client-cert-pem@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.keycloak-admin.priority: "10"
      traefik.http.routers.keycloak-admin.service: keycloak
    depends_on:
      postgres:
        condition: service_healthy
      lldap:
        condition: service_healthy
    restart: unless-stopped

  forward-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    <<: *hardening
    # distroless, runs as nonroot (65532). No healthcheck: the image has
    # no shell/HTTP client (Traefik and `portcullis status` see it fail).
    read_only: true
    extra_hosts:
      - "auth.${PORTCULLIS_DOMAIN:-portcullis.local}:host-gateway"
    command: ["--alpha-config=/etc/oauth2-proxy/alpha.yaml"]
    volumes:
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
      # provider + upstreams live in alpha config so we can declare
      # loginURLParameters (per-request acr_values passthrough); everything
      # else keeps coming from OAUTH2_PROXY_* env vars below.
      - ./oauth2-proxy/alpha.yaml:/etc/oauth2-proxy/alpha.yaml:ro
    environment:
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      FORWARD_AUTH_CLIENT_SECRET: ${FORWARD_AUTH_CLIENT_SECRET:?FORWARD_AUTH_CLIENT_SECRET is not set — run ./portcullis init}
      OAUTH2_PROXY_COOKIE_SECRET: ${FORWARD_AUTH_COOKIE_SECRET:?FORWARD_AUTH_COOKIE_SECRET is not set — run ./portcullis init}
      OAUTH2_PROXY_COOKIE_DOMAINS: .${PORTCULLIS_DOMAIN:-portcullis.local}
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # Only trust X-Forwarded-* headers from the portcullis network (traefik).
      # Without this, oauth2-proxy treats 0.0.0.0/0 as trusted — spoofable by
      # any container that can reach the forward-auth port directly.
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: "172.16.0.0/12,127.0.0.1/32"
      # Note: header injection (access token, authorization, X-Auth-Request-*)
      # is declared in config/oauth2-proxy/alpha.yaml — when --alpha-config is
      # set, OAUTH2_PROXY_PASS_ACCESS_TOKEN / SET_AUTHORIZATION_HEADER env are
      # silently ignored.
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${PORTCULLIS_DOMAIN:-portcullis.local}
      OAUTH2_PROXY_REDIRECT_URL: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/oauth2/callback
      # Chain Keycloak logout on /oauth2/sign_out so the realm SSO cookie
      # also gets cleared. Without this, Keycloak reuses the SSO session
      # via auth-cookie and the new token has amr=[] — breaking step-up.
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis/protocol/openid-connect/logout?id_token_hint={id_token}
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SSL_UPSTREAM_INSECURE_SKIP_VERIFY: "true"
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    networks:
      - portcullis
    mem_limit: 256m
    pids_limit: 128
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis
      traefik.http.services.forward-auth.loadbalancer.server.port: "4180"
      # Forward auth middleware — Traefik delegates auth checks here
      # Uses /oauth2/start which returns 302→Keycloak for unauth'd users
      # and 202 with user headers for auth'd users (via cookie)
      traefik.http.middlewares.portcullis-auth.forwardauth.address: http://forward-auth:4180
      traefik.http.middlewares.portcullis-auth.forwardauth.trustForwardHeader: "true"
      # Identity headers apps may trust. Every name listed is deleted from the
      # client's request first, so none of them can be spoofed. X-Forwarded-User /
      # X-Auth-Request-User = LLDAP username (never the user-editable email).
      traefik.http.middlewares.portcullis-auth.forwardauth.authResponseHeaders: X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups,X-Auth-Request-Preferred-Username,X-Forwarded-User,X-Forwarded-Email,Authorization,X-Forwarded-Access-Token
      # OAuth2 callback + sign-in routes on auth subdomain
      traefik.http.routers.oauth2-callback.rule: Host(`auth.${PORTCULLIS_DOMAIN:-portcullis.local}`) && PathPrefix(`/oauth2`)
      traefik.http.routers.oauth2-callback.entrypoints: websecure
      traefik.http.routers.oauth2-callback.tls.options: authaware@file
      traefik.http.routers.oauth2-callback.priority: "1000"
      traefik.http.routers.oauth2-callback.service: forward-auth
      # Also handle /oauth2 paths on ANY subdomain (for sign_in redirect)
      traefik.http.routers.oauth2-all.rule: PathPrefix(`/oauth2/`)
      traefik.http.routers.oauth2-all.entrypoints: websecure
      traefik.http.routers.oauth2-all.tls.options: authaware@file
      traefik.http.routers.oauth2-all.priority: "900"
      traefik.http.routers.oauth2-all.service: forward-auth
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy

  group-gate:
    image: python:3.15.2-alpine3.24@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
    <<: *hardening
    # Unprivileged uid with no home: reads only world-readable mounts.
    user: "10003:10003"
    read_only: true
    tmpfs:
      - /tmp
    entrypoint: ["python3", "-u", "/app/group-gate.py"]
    volumes:
      - ./group-gate/group-gate.py:/app/group-gate.py:ro
      - ./group-gate/group-gate-map.conf:/etc/group-gate/map.conf:ro
      # Hub writes per-app auth policies into this volume under group-gate-policy.json
      - hub_data:/hub-data:ro
      # Revoked client-cert serials, written by ./portcullis cert revoke|sync.
      - ./certs/revocation:/etc/group-gate/revocation:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      GATE_POLICY_FILE: /hub-data/group-gate-policy.json
      # Client-cert revocation: requests whose TLS client cert (seen via
      # client-headers@file → X-Forwarded-Tls-Client-Cert-Info) has a
      # revoked serial are denied. Sources: the serial file above (instant)
      # plus Vault's CRL (unauthenticated endpoint, refreshed periodically).
      GATE_REVOKED_FILE: /etc/group-gate/revocation/revoked-serials.txt
      GATE_CRL_URL: http://vault:8200/v1/pki_int/crl
      # Requests whose X-Forwarded-Host is not <label>.<PORTCULLIS_DOMAIN>
      # (after lowercasing / stripping port) are denied.
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
    networks:
      - portcullis
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    pids_limit: 64
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis
      traefik.http.services.group-gate.loadbalancer.server.port: "8080"
      traefik.http.middlewares.portcullis-groups.forwardauth.address: http://group-gate:8080
      traefik.http.middlewares.portcullis-groups.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.portcullis-groups.forwardauth.authResponseHeaders: X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups,X-Forwarded-User,X-Forwarded-Email
      # Same checks minus the subdomain group (any signed-in user): for
      # self-service routes such as enroll.<domain>/self.
      traefik.http.middlewares.portcullis-self.forwardauth.address: http://group-gate:8080/authenticated
      traefik.http.middlewares.portcullis-self.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.portcullis-self.forwardauth.authResponseHeaders: X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups,X-Forwarded-User,X-Forwarded-Email
    restart: unless-stopped

  hub:
    image: ${HUB_IMAGE:-ghcr.io/porelli/portcullis-hub:edge}
    <<: *hardening
    # The image runs as uid/gid 10001; it writes only /data (named volume,
    # 10001-owned in the image), /project/templates (chowned to 10001 by
    # ./portcullis up) and the tmpfs paths below.
    read_only: true
    tmpfs:
      - /tmp
      - /home/hub:uid=10001,gid=10001,mode=0700
    environment:
      PROJECT_DIR: /project
      PROJECT_HOST_DIR: ${PWD:-.}
      HUB_DATA_DIR: /data
      # No socket mount: Engine API + `docker compose` via its proxy (contract §6).
      DOCKER_HOST: tcp://socket-proxy-hub:2375
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      DEFAULT_TEMPLATES_URL: https://github.com/porelli/portcullis-templates.git
      PORTAL_DISPLAY_NAME: ${PORTAL_DISPLAY_NAME:-Portcullis}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is not set — run ./portcullis init}
      # No LLDAP credentials: X-Forwarded-User is already the LLDAP username
      # (the Hub used the LLDAP admin account only to map emails to usernames),
      # and LLDAP admin could put anyone into lldap_admin.
      # Shared secret Traefik sends as X-Portcullis-Proxy-Secret on every
      # request routed to the Hub (hub-proxy-secret middleware below,
      # integration contract §5); the Hub refuses to start without it.
      # Generated by ./portcullis init.
      HUB_PROXY_SECRET: ${HUB_PROXY_SECRET:?HUB_PROXY_SECRET is not set — run ./portcullis init}
    volumes:
      - .:/project:ro
      # Writable overlay: before every `compose up` the Hub copies each app's
      # template dir here, so `./templates/<app>/...` bind mounts in template
      # compose files resolve to real files on the HOST (compose resolves them
      # against --project-directory = this checkout). Generated, gitignored.
      - ./templates:/project/templates:rw
      # The Hub only needs /project/templates, the config file targets and
      # the core variables templates reference. Mask the Vault root token /
      # unseal key (secrets/) and backups (which contain copies of secrets/
      # and .env) with empty tmpfs mounts. Both dirs are tracked via .gitkeep
      # so the mountpoints always exist inside the read-only /project bind.
      - type: tmpfs
        target: /project/secrets
        tmpfs:
          size: 1048576
      - type: tmpfs
        target: /project/backups
        tmpfs:
          size: 1048576
      - hub_data:/data
      # NOT the core .env (it holds every core secret): a generated subset
      # with only what templates may reference (PORTCULLIS_DOMAIN, Traefik's
      # IP, VPN client secrets, HUB_SHARED_ENV). Rewritten in place by
      # ./portcullis up; group 10001, mode 0640.
      - ./secrets/hub/core.env:/project/.env:ro
    networks:
      - portcullis
      - socket-proxy-hub
    mem_limit: 1g
    pids_limit: 512
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis
      traefik.http.routers.hub.rule: Host(`hub.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.hub.entrypoints: websecure
      traefik.http.routers.hub.tls.options: authaware@file
      # hub-proxy-secret is LAST among the request-modifying middlewares, so
      # the secret is never forwarded to the forwardAuth servers.
      traefik.http.routers.hub.middlewares: rate-limit@file,client-headers@file,portcullis-auth@docker,portcullis-groups@docker,hub-proxy-secret@docker,security-headers@file
      traefik.http.middlewares.hub-proxy-secret.headers.customrequestheaders.X-Portcullis-Proxy-Secret: ${HUB_PROXY_SECRET:?HUB_PROXY_SECRET is not set — run ./portcullis init}
      traefik.http.services.hub.loadbalancer.server.port: "8888"
    depends_on:
      keycloak:
        condition: service_started
      socket-proxy-hub:
        condition: service_healthy
    restart: unless-stopped

  enroll:
    build:
      context: ./enroll
    <<: *hardening
    # USER 10002 in enroll/Dockerfile; secrets/enroll is group 10002, 0750/0640.
    read_only: true
    environment:
      VAULT_ADDR: http://vault:8200
      # Least-privilege AppRole (policy vault/policies/enroll.hcl), created
      # by ./portcullis vault init. No static/root token.
      VAULT_ROLE_ID_FILE: /run/secrets/portcullis-enroll/role-id
      VAULT_SECRET_ID_FILE: /run/secrets/portcullis-enroll/secret-id
      LLDAP_URL: ldap://lldap:3890
      LLDAP_BASE_DN: ${LLDAP_BASE_DN:-dc=portcullis,dc=local}
      LLDAP_BIND_DN: uid=admin,ou=people,${LLDAP_BASE_DN:-dc=portcullis,dc=local}
      LLDAP_BIND_PASSWORD: ${LLDAP_ADMIN_PASSWORD:?LLDAP_ADMIN_PASSWORD is not set — run ./portcullis init}
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      # Lifetime of client certs issued by enroll (admin enrolment and
      # self-service renewal). Capped by the Vault role (portcullis pki setup).
      CERT_TTL: ${CLIENT_CERT_TTL:-720h}
    networks:
      - portcullis
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8443/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    pids_limit: 128
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis
      traefik.http.routers.enroll.rule: Host(`enroll.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.enroll.entrypoints: websecure
      traefik.http.routers.enroll.tls.options: authaware@file
      traefik.http.routers.enroll.middlewares: rate-limit@file,client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.enroll.service: enroll
      # Self-service (/self, /api/self/*): any signed-in user, for THEIR OWN
      # certificate. client-cert-pem passes the verified cert (PEM) so enroll
      # can renew exactly that key; portcullis-self still enforces
      # revocation and host checks.
      traefik.http.routers.enroll-self.rule: Host(`enroll.${PORTCULLIS_DOMAIN:-portcullis.local}`) && (PathPrefix(`/self`) || PathPrefix(`/api/self/`))
      traefik.http.routers.enroll-self.entrypoints: websecure
      traefik.http.routers.enroll-self.tls.options: authaware@file
      traefik.http.routers.enroll-self.priority: "100"
      traefik.http.routers.enroll-self.middlewares: rate-limit@file,client-cert-pem@file,portcullis-auth@docker,portcullis-self@docker,security-headers@file
      traefik.http.routers.enroll-self.service: enroll
      traefik.http.services.enroll.loadbalancer.server.port: "8443"
    volumes:
      - ./secrets/enroll:/run/secrets/portcullis-enroll:ro
    depends_on:
      vault:
        condition: service_healthy
      lldap:
        condition: service_healthy
    restart: unless-stopped

  # ── Monitoring (opt-in: COMPOSE_PROFILES=monitoring in .env, then
  # ./portcullis up). docs/monitoring.md. Config: monitoring/; generated
  # files and the Vault metrics token: secrets/monitoring/ (./portcullis up).
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: [monitoring]
    <<: *hardening
    user: "65534:65534"
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - ./secrets/monitoring/prometheus:/etc/portcullis:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - portcullis
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    profiles: [monitoring]
    <<: *hardening
    user: "65534:65534"
    read_only: true
    command:
      # Generated from ALERT_* in .env by ./portcullis up (monitoring.sh).
      - --config.file=/etc/portcullis/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ./secrets/monitoring/alertmanager:/etc/portcullis:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring
      - alerting
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    profiles: [monitoring]
    <<: *hardening
    user: "65534:65534"
    read_only: true
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    # The TLS probe connects to auth.<domain> the way browsers do: through
    # the host's published :443, so it sees Traefik's real (ACME) cert.
    extra_hosts:
      - "auth.${PORTCULLIS_DOMAIN:-portcullis.local}:host-gateway"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring
      - portcullis
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped

  # Serves monitoring/textfile/*.prom (written by ./portcullis backup and
  # ./portcullis status --textfile): backup age, client-cert / CA expiry.
  # Only the textfile collector — no host metrics, no host mounts.
  textfile-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    profiles: [monitoring]
    <<: *hardening
    user: "65534:65534"
    read_only: true
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/textfile
    volumes:
      - ./monitoring/textfile:/textfile:ro
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    profiles: [monitoring]
    <<: *hardening
    user: "472:472"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      GF_SERVER_ROOT_URL: https://metrics.${PORTCULLIS_DOMAIN:-portcullis.local}/
      GF_LOG_MODE: console
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      # Sign-in is Portcullis: forward-auth + group-gate (lldap_admin) set
      # X-Forwarded-User (LLDAP username) / X-Forwarded-Email; Grafana
      # accepts them only from Traefik's fixed IP on portcullis-proxy.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Forwarded-User
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: Email:X-Forwarded-Email
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_AUTH_PROXY_WHITELIST: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Everyone who gets here is in lldap_admin.
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana/admin-password
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - ./secrets/monitoring/grafana:/run/secrets/grafana:ro
    networks:
      - monitoring
      - portcullis-proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    pids_limit: 256
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis-proxy
      traefik.http.routers.grafana-metrics.rule: Host(`metrics.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.grafana-metrics.entrypoints: websecure
      traefik.http.routers.grafana-metrics.tls.options: authaware@file
      traefik.http.routers.grafana-metrics.middlewares: rate-limit@file,client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.grafana-metrics.loadbalancer.server.port: "3000"
    restart: unless-stopped

volumes:
  postgres_data:
  vault_data:
  lldap_data:
  hub_data:
  traefik_acme:
  prometheus_data:
  alertmanager_data:
  grafana_data:
