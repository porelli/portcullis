name: portcullis

networks:
  portcullis:
    name: portcullis
  # Shared routing plane (Traefik + app frontends). Fixed IPAM so Traefik
  # has a well-known address: header-auth apps (grafana, firefly-iii, ...)
  # trust X-Forwarded-User / X-WEBAUTH-USER only from PORTCULLIS_TRAEFIK_IP.
  # Dynamic container addresses come from PORTCULLIS_PROXY_IP_RANGE, which
  # must lie inside the subnet and must NOT contain PORTCULLIS_TRAEFIK_IP —
  # so no app container can ever be handed Traefik's address.
  # Docker cannot change IPAM in place: after editing these, the network
  # must be removed and recreated (./portcullis up explains how).
  portcullis-proxy:
    name: portcullis-proxy
    ipam:
      config:
        - subnet: ${PORTCULLIS_PROXY_SUBNET:-172.31.250.0/24}
          ip_range: ${PORTCULLIS_PROXY_IP_RANGE:-172.31.250.128/25}

  # Traefik ↔ Keycloak only. Keycloak trusts proxy headers — including the
  # client certificate Traefik forwards for X.509 login — ONLY from
  # Traefik's fixed address here (--proxy-trusted-addresses). Anything else
  # that reaches Keycloak (the 127.0.0.1:8080 publish, the portcullis
  # network) cannot inject a client certificate. internal: no egress.
  portcullis-auth:
    name: portcullis-auth
    internal: true
    ipam:
      config:
        - subnet: ${PORTCULLIS_AUTH_SUBNET:-172.31.251.0/28}
          ip_range: ${PORTCULLIS_AUTH_IP_RANGE:-172.31.251.8/29}
  # Docker API access (integration contract §6): each client only reaches
  # its own socket proxy, on a network shared with nobody else.
  socket-proxy-traefik:
    internal: true
  socket-proxy-hub:
    internal: true
  # Monitoring profile: Prometheus, Alertmanager, Grafana, exporters. No
  # egress; Prometheus / blackbox also join `portcullis` to reach the
  # targets, Grafana `portcullis-proxy` (Traefik), Alertmanager `alerting`
  # (egress for webhook / SMTP receivers).
  monitoring:
    internal: true
  alerting: {}
  # Domains service (contract §12): the Hub ⇄ domains API, only those two.
  # Fixed subnet: the API answers only connections addressed to it there
  # (DOMAINS_API_SUBNET), never on portcullis-certs or domains-egress.
  portcullis-domains:
    internal: true
    ipam:
      config:
        - subnet: ${PORTCULLIS_DOMAINS_SUBNET:-172.31.252.0/28}
  # domains ⇄ Traefik only: the certificate endpoint (mTLS, contract §12.4).
  portcullis-certs:
    internal: true
  # domains' egress: ACME, the DNS providers' APIs, the public resolvers.
  domains-egress: {}
  # mcp-gate ⇄ Keycloak (JWKS) and the Hub (:8890) only (contract §15):
  # Keycloak and the Hub are pinned outside the dynamic range, and the gate
  # maps both names to those addresses (extra_hosts): it never resolves
  # them through DNS. network.sh validates PORTCULLIS_MCP_*.
  portcullis-mcp:
    name: portcullis-mcp
    internal: true
    ipam:
      config:
        - subnet: ${PORTCULLIS_MCP_SUBNET:-172.31.253.0/28}
          ip_range: ${PORTCULLIS_MCP_IP_RANGE:-172.31.253.8/29}
  # The session store and its two clients only: sessions, forward-auth,
  # forward-auth-ext. No egress, nothing else can reach the store.
  portcullis-sessions:
    internal: true

# Hardening defaults (see docs/hardening.md for per-service exceptions).
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  # Read-only Docker API for Traefik's docker provider: containers,
  # networks, events, version (+ /_ping). No writes (POST=0).
  socket-proxy-traefik:
    image: ghcr.io/linuxserver/socket-proxy:3.4.7@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    <<: *hardening
    # HAProxy runs as root (the socket is root:docker) and chroots to "/".
    cap_add: [SYS_CHROOT]
    read_only: true
    tmpfs:
      - /run
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      VERSION: "1"
      PING: "1"
      POST: "0"
      DISABLE_IPV6: "1"
      LOG_LEVEL: warning
    volumes:
      # The engine socket (contract §6): rootful Docker's, or the operator's
      # rootless Podman socket (PORTCULLIS_ENGINE_SOCKET, written by init).
      - ${PORTCULLIS_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - socket-proxy-traefik
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped

  # Docker API for the Hub: what `docker compose up/down` and the Hub's
  # Engine API calls need — containers (create/start/stop/rm/inspect/list/
  # logs/exec), images (pull/inspect), networks, volumes, exec, events,
  # info, version, /_ping — with write methods (POST=1 also allows
  # PUT/DELETE on those sections). Denied: build, commit, swarm, nodes,
  # services, tasks, secrets, configs, plugins, system (df/prune), auth,
  # distribution, container export. Container archive (GET/PUT
  # /containers/{id}/archive) is allowed (ALLOW_ARCHIVE): the Hub's instance
  # backups / restores copy volume data through never-started helpers.
  socket-proxy-hub:
    image: ghcr.io/linuxserver/socket-proxy:3.4.7@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    <<: *hardening
    cap_add: [SYS_CHROOT]
    read_only: true
    tmpfs:
      - /run
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      EXEC: "1"
      EVENTS: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      ALLOW_LOGS: "1"
      # The Hub's instance backups / restores copy volumes through the
      # archive endpoints of never-started helper containers (contract §6;
      # the proxy denies /containers/{id}/archive without it).
      ALLOW_ARCHIVE: "1"
      POST: "1"
      DISABLE_IPV6: "1"
      LOG_LEVEL: warning
    volumes:
      # The engine socket (contract §6): rootful Docker's, or the operator's
      # rootless Podman socket (PORTCULLIS_ENGINE_SOCKET, written by init).
      - ${PORTCULLIS_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - socket-proxy-hub
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped

  traefik:
    image: docker.io/library/traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    <<: *hardening
    # Runs as root (binds :80/:443, owns the ACME volume) but with no
    # capability except binding low ports; root without CAP_DAC_OVERRIDE
    # can only read files it may read by mode (certs/ are world/group-0
    # readable, see ./portcullis up).
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # Static configuration (env vars are the sole config source)
      TRAEFIK_API_DASHBOARD: "true"
      TRAEFIK_API_INSECURE: "false"
      TRAEFIK_LOG_LEVEL: INFO
      TRAEFIK_ACCESSLOG: "true"
      # Entrypoints
      TRAEFIK_PING: "true"
      # Internal entrypoint for /ping (healthcheck) — not published.
      TRAEFIK_ENTRYPOINTS_TRAEFIK_ADDRESS: ":8080"
      TRAEFIK_ENTRYPOINTS_TRAEFIK_HTTP_ALIASHEADERSSTRATEGY: delete
      # Prometheus metrics on an internal entrypoint (:8082, not published;
      # scraped over the portcullis network by the monitoring profile).
      TRAEFIK_ENTRYPOINTS_METRICS_ADDRESS: ":8082"
      TRAEFIK_ENTRYPOINTS_METRICS_HTTP_ALIASHEADERSSTRATEGY: delete
      TRAEFIK_METRICS_PROMETHEUS: "true"
      TRAEFIK_METRICS_PROMETHEUS_ENTRYPOINT: metrics
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      # Drop header-name aliases (X_Forwarded_Tls_Client_Cert, ...) before
      # routing; the canonical X-Forwarded-* / X-Forwarded-Tls-Client-*
      # headers are always deleted from untrusted clients (no trustedIPs).
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_ALIASHEADERSSTRATEGY: delete
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ALIASHEADERSSTRATEGY: delete
      # Routers without an explicit entrypoint attach to websecure only.
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ASDEFAULT: "true"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: websecure
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: https
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_CERTRESOLVER: letsencrypt
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_DOMAINS_0_MAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_DOMAINS_0_SANS: "*.${PORTCULLIS_DOMAIN:-portcullis.local}"
      # Providers
      TRAEFIK_PROVIDERS_DOCKER: "true"
      # No socket mount: read-only API through its own proxy (contract §6).
      TRAEFIK_PROVIDERS_DOCKER_ENDPOINT: tcp://socket-proxy-traefik:2375
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: portcullis-proxy
      TRAEFIK_PROVIDERS_FILE_DIRECTORY: /etc/traefik/dynamic
      TRAEFIK_PROVIDERS_FILE_WATCH: "true"
      # Enrolled domains' certificates (contract §12.4): polled from the
      # domains service over portcullis-certs with mutual TLS. The answer
      # holds only tls.certificates (inline PEM); an unreachable endpoint
      # keeps the last fetched configuration. Paths only, never key material.
      TRAEFIK_PROVIDERS_HTTP_ENDPOINT: https://domains:8443/traefik/dynamic
      TRAEFIK_PROVIDERS_HTTP_POLLINTERVAL: 10s
      TRAEFIK_PROVIDERS_HTTP_POLLTIMEOUT: 5s
      TRAEFIK_PROVIDERS_HTTP_MAXRESPONSEBODYSIZE: "4194304"
      TRAEFIK_PROVIDERS_HTTP_TLS_CA: /run/portcullis/domains-endpoint/ca.crt
      TRAEFIK_PROVIDERS_HTTP_TLS_CERT: /run/portcullis/domains-endpoint/client.crt
      TRAEFIK_PROVIDERS_HTTP_TLS_KEY: /run/portcullis/domains-endpoint/client.key
      # ACME (Let's Encrypt)
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL:-admin@portcullis.local}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_STORAGE: /acme/acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_CASERVER: ${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_DNSCHALLENGE: "true"
      # ACME_DNS_PROVIDER: written by config apply (hetzner-cloud → lego's
      # hetzner); DNS_PROVIDER covers a hand `compose up` before it.
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_DNSCHALLENGE_PROVIDER: ${ACME_DNS_PROVIDER:-${DNS_PROVIDER:-cloudflare}}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_DNSCHALLENGE_RESOLVERS: 1.1.1.1:53,8.8.8.8:53
      # DNS provider credentials
      # Cloudflare
      CF_API_EMAIL: ${CF_API_EMAIL:-}
      CF_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      # Porkbun
      PORKBUN_API_KEY: ${PORKBUN_API_KEY:-}
      PORKBUN_SECRET_API_KEY: ${PORKBUN_SECRET_API_KEY:-}
      # Route53
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID:-}
      # DigitalOcean
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN:-}
      # Hetzner (legacy DNS API) / Hetzner Cloud (lego prefers the token)
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
      # Google Cloud DNS
      GCE_PROJECT: ${GCE_PROJECT:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
      - traefik_acme:/acme
      # Client certificate for the domains certificate endpoint (group 0, 0640).
      - ./secrets/domains/certs-endpoint/ca.crt:/run/portcullis/domains-endpoint/ca.crt:ro
      - ./secrets/domains/certs-endpoint/client.crt:/run/portcullis/domains-endpoint/client.crt:ro
      - ./secrets/domains/certs-endpoint/client.key:/run/portcullis/domains-endpoint/client.key:ro
    networks:
      portcullis: {}
      portcullis-proxy:
        ipv4_address: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
      portcullis-auth:
        ipv4_address: ${PORTCULLIS_AUTH_TRAEFIK_IP:-172.31.251.2}
      socket-proxy-traefik: {}
      portcullis-certs: {}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    pids_limit: 512
    depends_on:
      socket-proxy-traefik:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.tls: "true"
      traefik.http.routers.dashboard.tls.certresolver: letsencrypt
      traefik.http.routers.dashboard.tls.domains[0].main: ${PORTCULLIS_DOMAIN:-portcullis.local}
      traefik.http.routers.dashboard.tls.domains[0].sans: "*.${PORTCULLIS_DOMAIN:-portcullis.local}"
      traefik.http.routers.dashboard.tls.options: authaware@file
      traefik.http.routers.dashboard.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.dashboard.service: api@internal
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    <<: *hardening
    # The image's postgres user. /var/lib/postgresql is postgres-owned in
    # the image, so a fresh volume inherits it and the entrypoint needs no
    # chown/su-exec (hence no capabilities).
    user: "70:70"
    read_only: true
    tmpfs:
      - /var/run/postgresql:mode=1777
      - /tmp
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set — run ./portcullis init}
    volumes:
      # Postgres 18+ expects the mount at /var/lib/postgresql (the image stores
      # data under a versioned subdir so pg_upgrade can work without mount
      # boundary issues). Mounting at /var/lib/postgresql/data makes the image
      # refuse to start on a fresh volume.
      - postgres_data:/var/lib/postgresql
    networks:
      - portcullis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1g
    pids_limit: 256
    shm_size: 128m
    restart: unless-stopped

  vault:
    image: docker.io/hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    <<: *hardening
    # The image's vault user (uid 100, gid 1000). secrets/vault-unseal is
    # group 1000, mode 0750/0640 (./portcullis vault init|up).
    user: "100:1000"
    read_only: true
    tmpfs:
      - /tmp
    # Server mode with raft storage (vault/vault.hcl). The wrapper starts
    # Vault and auto-unseals it on every container start from
    # secrets/vault-unseal/unseal-key (written by ./portcullis vault init).
    entrypoint: ["/bin/sh", "/vault/portcullis/entrypoint.sh"]
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      # disable_mlock = true in vault.hcl (recommended for raft) — no
      # IPC_LOCK capability needed, so skip the image's setcap step.
      SKIP_SETCAP: "true"
    ports:
      # Loopback only: the ./portcullis CLI (pki setup, cert ..., status)
      # uses http://127.0.0.1:8200. The listener is plain HTTP —
      # never expose it on 0.0.0.0.
      - "127.0.0.1:8200:8200"
    volumes:
      # /vault/file: vault-owned in the image (it runs non-root), so the
      # fresh named volume gets the right owner. See vault/vault.hcl.
      - vault_data:/vault/file
      - ./vault:/vault/portcullis:ro
      - ./secrets/vault-unseal:/vault/unseal:ro
    networks:
      - portcullis
    healthcheck:
      # Exit code 0 only when initialised AND unsealed.
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

  lldap:
    # -rootless: runs as lldap (uid 1000), /data is lldap-owned in the image.
    image: docker.io/lldap/lldap:v0.6.3-alpine-rootless@sha256:ba2c50930ea998eefd5454aa678a7977448019248b1827da87d330df0b71c284
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    environment:
      LLDAP_JWT_SECRET: ${LLDAP_JWT_SECRET:?LLDAP_JWT_SECRET is not set — run ./portcullis init}
      LLDAP_LDAP_USER_PASS: ${LLDAP_ADMIN_PASSWORD:?LLDAP_ADMIN_PASSWORD is not set — run ./portcullis init}
      LLDAP_LDAP_BASE_DN: ${LLDAP_BASE_DN:-dc=portcullis,dc=local}
      LLDAP_LDAP_USER_DN: admin
      LLDAP_LDAP_USER_EMAIL: admin@portcullis.local
      LLDAP_HTTP_URL: https://directory.${PORTCULLIS_DOMAIN:-portcullis.local}
    volumes:
      - lldap_data:/data
    networks:
      - portcullis
    labels:
      # directory.<domain> is NOT LLDAP's web UI: LLDAP has no SSO, so its UI
      # would need its own password on top of the passkey. People and groups
      # are managed in the Hub's directory (people.<domain>); this router only
      # redirects there. LLDAP's own UI is break-glass, from the server:
      # ./portcullis lldap-ui.
      traefik.enable: "true"
      traefik.docker.network: portcullis
      traefik.http.routers.lldap.rule: Host(`directory.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.lldap.entrypoints: websecure
      traefik.http.routers.lldap.tls.options: authaware@file
      traefik.http.routers.lldap.middlewares: directory-redirect@docker,security-headers@file
      traefik.http.middlewares.directory-redirect.redirectregex.regex: ^https?://[^/]+(/.*)?$$
      traefik.http.middlewares.directory-redirect.redirectregex.replacement: https://people.${PORTCULLIS_DOMAIN:-portcullis.local}/
      traefik.http.services.lldap.loadbalancer.server.port: "17170"
    healthcheck:
      test: ["CMD", "/app/lldap", "healthcheck", "--config-file", "/data/lldap_config.toml"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped

  keycloak:
    # Portcullis's Keycloak image (porelli/portcullis-keycloak): the official
    # Keycloak pinned tag@sha256 plus the sign-in extension (contract §8.1).
    # edge = its main; a core release pins a released tag by digest
    # (release.yml), like HUB_IMAGE.
    image: ${KEYCLOAK_IMAGE:-ghcr.io/porelli/portcullis-keycloak:edge}
    <<: *hardening
    # Not read_only: `start` re-augments the server into /opt/keycloak/lib
    # when build options (the x509 lookup provider, the extension's
    # providers) differ from the image's.
    tmpfs:
      - /tmp
    command:
      - start
      - --import-realm
      - --http-enabled=true
      - --http-port=8080
      - --hostname=https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}
      - --proxy-headers=xforwarded
      # Proxy headers (X-Forwarded-*, and the client cert below) are honoured
      # only from Traefik's fixed address on the portcullis-auth network:
      # Quarkus decides "trusted proxy" from the TCP peer of each request and
      # the x509 lookup returns no cert otherwise (so the 127.0.0.1:8080
      # publish below, used by the CLI, cannot be used to forge a cert).
      - --proxy-trusted-addresses=${PORTCULLIS_AUTH_TRAEFIK_IP:-172.31.251.2}
      - --health-enabled=true
      # /metrics on the management port 9000 (not routed by Traefik).
      - --metrics-enabled=true
      # X.509 login: Traefik verifies the client cert (authaware TLS on
      # auth.<domain>) and forwards it PEM-encoded in X-Forwarded-Tls-Client-Cert
      # (client-cert-pem@file); Keycloak's `traefik` lookup provider reads it.
      - --spi-x509cert-lookup--provider=traefik
      # Our CA chain (certs/truststore/, written by ./portcullis pki setup):
      # the X.509 authenticator re-validates the forwarded cert against it.
      - --truststore-paths=/opt/keycloak/conf/truststores/portcullis
      # Re-fetch Vault's CRL at least every 60s (default: until nextUpdate).
      - --spi-crl-storage--infinispan--cache-time=60
      # Keycloak's own impersonation (contract §8 "Stock impersonation off"):
      # the admin console's "Impersonate" and POST …/users/{id}/impersonation
      # answer "feature disabled", so no impersonation skips the fresh touch,
      # the reason or the record (the extension's portcullis-impersonate start).
      - --features-disabled=impersonation
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set — run ./portcullis init}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is not set — run ./portcullis init}
      # The Sign-in page the extension's needs-stronger page links to
      # (contract §8.1; unset = the account console).
      PORTCULLIS_SIGNIN_URL: https://people.${PORTCULLIS_DOMAIN:-portcullis.local}/signin
      # Where an impersonation start sends the browser (contract §8, §8.1;
      # unset or not http(s) = every start refused).
      PORTCULLIS_PORTAL_URL: https://${PORTCULLIS_DOMAIN:-portcullis.local}/
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Login theme `portcullis` (keycloak.v2 + unique passkey labels, no
      # label prompt; keycloak/themes/portcullis).
      - ./keycloak/themes/portcullis:/opt/keycloak/themes/portcullis:ro
      - ./certs/truststore:/opt/keycloak/conf/truststores/portcullis:ro
      # The Hub's signin-keycloak.json (contract §8.1): the extension reads
      # /hub-data/signin-keycloak.json; missing or invalid = nobody signs in.
      - hub_data:/hub-data:ro
    networks:
      portcullis: {}
      portcullis-auth: {}
      # mcp-gate reads the JWKS here (contract §15), at this pinned address.
      portcullis-mcp:
        ipv4_address: ${PORTCULLIS_MCP_KEYCLOAK_IP:-172.31.253.2}
    healthcheck:
      # One CMD-SHELL string: Podman's compat API re-splits exec-form (CMD)
      # arguments on whitespace (a `bash -c '<script>'` reached the
      # container as `bash -c '{'`), so no CMD argument may contain a space.
      test: ["CMD-SHELL", "bash -c '{ printf \"HEAD /health/ready HTTP/1.0\\r\\n\\r\\n\" >&0; grep \"HTTP/1.0 200\"; } 0<>/dev/tcp/localhost/9000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    pids_limit: 1024
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis-auth
      # All routers on auth.<domain> MUST use the same TLS option (Traefik requirement).
      # authaware@file: a client cert is requested but optional (verified
      # against the CA if given), so YubiKey PIV users can log in with it
      # (X.509) and everyone else with WebAuthn / password.
      # Public OIDC/SAML endpoints — no forward-auth (users need these to log in)
      traefik.http.routers.keycloak.rule: Host(`auth.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.keycloak.entrypoints: websecure
      traefik.http.routers.keycloak.tls.options: authaware@file
      traefik.http.routers.keycloak.middlewares: rate-limit-auth@file,client-cert-pem@file,security-headers@file
      traefik.http.routers.keycloak.priority: "1"
      traefik.http.services.keycloak.loadbalancer.server.port: "8080"
      # Static assets (themes, the admin console's ~40 JS chunks): the login
      # rate limit (rate-limit-auth, 10/s burst 20) made the console fail
      # with "Failed to fetch dynamically imported module" (HTTP 429).
      traefik.http.routers.keycloak-resources.rule: Host(`auth.${PORTCULLIS_DOMAIN:-portcullis.local}`) && PathPrefix(`/resources/`)
      traefik.http.routers.keycloak-resources.entrypoints: websecure
      traefik.http.routers.keycloak-resources.tls.options: authaware@file
      traefik.http.routers.keycloak-resources.middlewares: rate-limit@file,security-headers@file
      traefik.http.routers.keycloak-resources.priority: "5"
      traefik.http.routers.keycloak-resources.service: keycloak
      # Admin console + master realm — protected behind forward-auth + group-gate
      # (auth=lldap_admin). /realms/master is the admin realm's login/token
      # endpoint; it has no business being public. The CLI and the Hub reach
      # the admin API over the internal network (http://keycloak:8080 or the
      # 127.0.0.1:8080 publish), which bypasses Traefik.
      traefik.http.routers.keycloak-admin.rule: Host(`auth.${PORTCULLIS_DOMAIN:-portcullis.local}`) && (PathPrefix(`/admin`) || PathPrefix(`/realms/master`))
      traefik.http.routers.keycloak-admin.entrypoints: websecure
      traefik.http.routers.keycloak-admin.tls.options: authaware@file
      # portcullis-auth-console, not portcullis-auth: the admin console sends
      # its own `Authorization: Bearer <console token>` to /admin/realms/...;
      # portcullis-auth would replace it with the forward-auth session's
      # token (portcullis realm, no admin roles) → "You do not have
      # permission to access this resource".
      traefik.http.routers.keycloak-admin.middlewares: rate-limit-auth@file,client-cert-pem@file,portcullis-auth-console@docker,portcullis-groups@docker,security-headers@file
      traefik.http.routers.keycloak-admin.priority: "10"
      traefik.http.routers.keycloak-admin.service: keycloak
    depends_on:
      postgres:
        condition: service_healthy
      lldap:
        condition: service_healthy
    restart: unless-stopped

  # Session store of both oauth2-proxies (Valkey, scripts/lib/sessions.sh):
  # the browser keeps only a small ticket cookie, the session itself lives
  # here. oauth2-proxy v7.15.5's cookie store never expires the unsplit
  # _oauth2_proxy once a session outgrows one cookie (_oauth2_proxy_0..n)
  # and keeps loading the stale one (upstream #3486; fix #3491 unreleased).
  # Memory only (no RDB / AOF: a restart signs everyone out), one ACL user
  # per oauth2-proxy limited to its own ticket keys, the default user off.
  # The config (with the users' password hashes) is generated from .env.
  sessions:
    image: docker.io/valkey/valkey:9.1.3-alpine3.24@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    <<: *hardening
    # The image's valkey user; its entrypoint only drops privileges when
    # started as root, so it runs valkey-server directly.
    user: "999:1000"
    read_only: true
    tmpfs:
      - /data
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    volumes:
      - ./secrets/sessions/valkey.conf:/etc/valkey/valkey.conf:ro
    networks:
      - portcullis-sessions
    # No credentials in the check: an unauthenticated PING must be refused
    # (NOAUTH), which also proves the default user is off.
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -h 127.0.0.1 ping 2>&1 | grep -q NOAUTH"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped

  forward-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
    <<: *hardening
    # distroless, runs as nonroot (65532). No healthcheck: the image has
    # no shell/HTTP client (Traefik and `portcullis status` see it fail).
    read_only: true
    extra_hosts:
      - "auth.${PORTCULLIS_DOMAIN:-portcullis.local}:host-gateway"
    command: ["--alpha-config=/etc/oauth2-proxy/alpha.yaml"]
    volumes:
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
      # provider + upstreams live in alpha config so we can declare
      # loginURLParameters (per-request pc_method passthrough); everything
      # else keeps coming from OAUTH2_PROXY_* env vars below.
      - ./oauth2-proxy/alpha.yaml:/etc/oauth2-proxy/alpha.yaml:ro
    environment:
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      FORWARD_AUTH_CLIENT_SECRET: ${FORWARD_AUTH_CLIENT_SECRET:?FORWARD_AUTH_CLIENT_SECRET is not set — run ./portcullis init}
      OAUTH2_PROXY_COOKIE_SECRET: ${FORWARD_AUTH_COOKIE_SECRET:?FORWARD_AUTH_COOKIE_SECRET is not set — run ./portcullis init}
      OAUTH2_PROXY_COOKIE_DOMAINS: .${PORTCULLIS_DOMAIN:-portcullis.local}
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      # Re-validate the session with Keycloak (refresh-token grant) once it
      # is older than a minute: a revoked Keycloak session (logout, the
      # Hub removing a membership) ends forward-auth access, and changed
      # groups / amr reach group-gate, within about a minute instead of the
      # 168h cookie lifetime (cookie_expire, the default, must stay larger).
      OAUTH2_PROXY_COOKIE_REFRESH: 1m
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # Only trust X-Forwarded-* headers from the portcullis network (traefik).
      # Without this, oauth2-proxy treats 0.0.0.0/0 as trusted — spoofable by
      # any container that can reach the forward-auth port directly.
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: "172.16.0.0/12,127.0.0.1/32"
      # Note: header injection (access token, authorization, X-Auth-Request-*)
      # is declared in config/oauth2-proxy/alpha.yaml — when --alpha-config is
      # set, OAUTH2_PROXY_PASS_ACCESS_TOKEN / SET_AUTHORIZATION_HEADER env are
      # silently ignored.
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${PORTCULLIS_DOMAIN:-portcullis.local}
      OAUTH2_PROXY_REDIRECT_URL: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/oauth2/callback
      # Chain Keycloak logout on /oauth2/sign_out so the realm SSO cookie
      # also gets cleared. Without this, Keycloak reuses the SSO session
      # via auth-cookie and the new token has amr=[] — breaking step-up.
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis/protocol/openid-connect/logout?id_token_hint={id_token}
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SSL_UPSTREAM_INSECURE_SKIP_VERIFY: "true"
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      # Sessions in the `sessions` store; the cookie is only a ticket
      # (_oauth2_proxy = v2.<ticket id>.<secret>, signed). Keys
      # _oauth2_proxy-<hex> (+ .lock while a refresh runs), user
      # forward-auth may touch nothing else.
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://sessions:6379
      OAUTH2_PROXY_REDIS_USERNAME: forward-auth
      OAUTH2_PROXY_REDIS_PASSWORD: ${FORWARD_AUTH_REDIS_PASSWORD:?FORWARD_AUTH_REDIS_PASSWORD is not set — run ./portcullis init}
    networks:
      - portcullis
      - portcullis-sessions
    mem_limit: 256m
    pids_limit: 128
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis
      traefik.http.services.forward-auth.loadbalancer.server.port: "4180"
      # Forward auth middleware — Traefik delegates auth checks here
      # Uses /oauth2/start which returns 302→Keycloak for unauth'd users
      # and 202 with user headers for auth'd users (via cookie)
      traefik.http.middlewares.portcullis-auth.forwardauth.address: http://forward-auth:4180
      traefik.http.middlewares.portcullis-auth.forwardauth.trustForwardHeader: "true"
      # Identity headers apps may trust. Every name listed is deleted from the
      # client's request first, so none of them can be spoofed. X-Forwarded-User /
      # X-Auth-Request-User / X-Auth-Request-Preferred-Username = LLDAP username
      # (never the user-editable email, nor Keycloak's user id).
      traefik.http.middlewares.portcullis-auth.forwardauth.authResponseHeaders: X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups,X-Auth-Request-Preferred-Username,X-Forwarded-User,X-Forwarded-Email,Authorization,X-Forwarded-Access-Token,X-Forwarded-Impersonator,X-Forwarded-Impersonation
      # Attribute headers (contract §5) come only from group-gate. Traefik
      # deletes every request header matching the regex before copying the
      # auth server's matches: oauth2-proxy returns none, so this strips
      # client-sent X-Forwarded-Attr-* on every forward-auth router.
      traefik.http.middlewares.portcullis-auth.forwardauth.authResponseHeadersRegex: ^X-Forwarded-Attr-
      # Keycloak's admin consoles only: the same, minus Authorization (the
      # console's own bearer token must reach the admin API).
      traefik.http.middlewares.portcullis-auth-console.forwardauth.address: http://forward-auth:4180
      traefik.http.middlewares.portcullis-auth-console.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.portcullis-auth-console.forwardauth.authResponseHeaders: X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups,X-Auth-Request-Preferred-Username,X-Forwarded-User,X-Forwarded-Email,X-Forwarded-Access-Token,X-Forwarded-Impersonator,X-Forwarded-Impersonation
      traefik.http.middlewares.portcullis-auth-console.forwardauth.authResponseHeadersRegex: ^X-Forwarded-Attr-
      # oauth2-proxy's own endpoints (/oauth2/callback, /oauth2/start for
      # group-gate's step-up, /oauth2/sign_out) live ONLY on auth.<domain>.
      # No host-less PathPrefix(`/oauth2/`) router: Traefik cannot select TLS
      # options for a rule without a Host, serves it with the default ones
      # and answers 421 Misdirected Request on every tiered (authaware /
      # protected / public) host.
      traefik.http.routers.oauth2-callback.rule: Host(`auth.${PORTCULLIS_DOMAIN:-portcullis.local}`) && PathPrefix(`/oauth2`)
      traefik.http.routers.oauth2-callback.entrypoints: websecure
      traefik.http.routers.oauth2-callback.tls.options: authaware@file
      traefik.http.routers.oauth2-callback.priority: "1000"
      traefik.http.routers.oauth2-callback.service: forward-auth
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      sessions:
        condition: service_healthy

  # Second oauth2-proxy for extra-domain hosts (contract §5 "Extra-domain
  # hosts"): one process has one redirect URL and one cookie domain, and
  # forward-auth's are auth.<domain> / .<domain>, which browsers never send
  # to another domain. Same Keycloak client, provider config and cookie
  # secret; the callback is relative (oauth2-proxy builds
  # https://<request host>/oauth2/callback from X-Forwarded-Host, trusted
  # from Traefik only), the cookie is host-only and named
  # __Host-portcullis_ext (a host under an enrolled subdomain of the main domain also receives
  # forward-auth's .<domain> cookie). No whitelist: every redirect it
  # accepts is relative, so it lands on the same host. Its routers
  # (Host(`<host>`) && PathPrefix(`/oauth2/`), service forward-auth-ext) are
  # the Hub's, one per extra-domain host; core routes it on no host.
  forward-auth-ext:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
    <<: *hardening
    read_only: true
    extra_hosts:
      - "auth.${PORTCULLIS_DOMAIN:-portcullis.local}:host-gateway"
    command: ["--alpha-config=/etc/oauth2-proxy/alpha.yaml"]
    volumes:
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - ./oauth2-proxy/alpha.yaml:/etc/oauth2-proxy/alpha.yaml:ro
    environment:
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      FORWARD_AUTH_CLIENT_SECRET: ${FORWARD_AUTH_CLIENT_SECRET:?FORWARD_AUTH_CLIENT_SECRET is not set — run ./portcullis init}
      OAUTH2_PROXY_COOKIE_SECRET: ${FORWARD_AUTH_COOKIE_SECRET:?FORWARD_AUTH_COOKIE_SECRET is not set — run ./portcullis init}
      # __Host- prefix: browsers accept it only Secure, without Domain and
      # with Path=/ (exactly what this service sets: no COOKIE_DOMAINS),
      # so neither a sibling host nor plain http can plant or widen it.
      # The CSRF and split-session cookies inherit the prefix.
      OAUTH2_PROXY_COOKIE_NAME: __Host-portcullis_ext
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_PATH: /
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_REFRESH: 1m
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: "172.16.0.0/12,127.0.0.1/32"
      OAUTH2_PROXY_REDIRECT_URL: /oauth2/callback
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}/realms/portcullis/protocol/openid-connect/logout?id_token_hint={id_token}
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SSL_UPSTREAM_INSECURE_SKIP_VERIFY: "true"
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      # Same store, its own user: keys __Host-portcullis_ext-<hex> only.
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://sessions:6379
      OAUTH2_PROXY_REDIS_USERNAME: forward-auth-ext
      OAUTH2_PROXY_REDIS_PASSWORD: ${FORWARD_AUTH_EXT_REDIS_PASSWORD:?FORWARD_AUTH_EXT_REDIS_PASSWORD is not set — run ./portcullis init}
    networks:
      - portcullis
      - portcullis-sessions
    mem_limit: 256m
    pids_limit: 128
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis
      traefik.http.services.forward-auth-ext.loadbalancer.server.port: "4180"
      # In place of portcullis-auth on every router of an extra-domain host
      # (rendered by the Hub); the same headers, so the same stripping.
      traefik.http.middlewares.portcullis-auth-ext.forwardauth.address: http://forward-auth-ext:4180
      traefik.http.middlewares.portcullis-auth-ext.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.portcullis-auth-ext.forwardauth.authResponseHeaders: X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups,X-Auth-Request-Preferred-Username,X-Forwarded-User,X-Forwarded-Email,Authorization,X-Forwarded-Access-Token,X-Forwarded-Impersonator,X-Forwarded-Impersonation
      traefik.http.middlewares.portcullis-auth-ext.forwardauth.authResponseHeadersRegex: ^X-Forwarded-Attr-
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      sessions:
        condition: service_healthy

  group-gate:
    # Built locally like enroll: pinned python base + group-gate/requirements.txt
    # (pip --require-hashes) + the script. Named so ./portcullis backup can run
    # its SQLite helpers in it (scripts/lib/backup.sh).
    build:
      context: ./group-gate
    image: portcullis-group-gate
    <<: *hardening
    # Unprivileged uid with no home (USER 10003 in group-gate/Dockerfile):
    # reads only world-readable mounts.
    user: "10003:10003"
    # Group 10001 (the Hub's): the opened log's directory (opened/, 2770)
    # and day files (0640) carry it, so the Hub can read and prune them.
    group_add: ["10001"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./group-gate/group-gate-map.conf:/etc/group-gate/map.conf:ro
      # Hub writes per-app auth policies into this volume under group-gate-policy.json
      - hub_data:/hub-data:ro
      # Revoked certificate serials (both kinds), written by ./portcullis cert revoke|sync.
      - ./certs/revocation:/etc/group-gate/revocation:ro
      # The two intermediates (./portcullis pki setup): a presented leaf
      # counts as yubikey_cert or browser_cert only when one of these
      # issued it (contract §4 "Certificate binding").
      - ./certs/yubikey-ca.crt:/etc/group-gate/ca/yubikey-ca.crt:ro
      - ./certs/browser-ca.crt:/etc/group-gate/ca/browser-ca.crt:ro
      # The opened log (contract §4 "Opened log"): opened/<YYYY-MM-DD>.jsonl,
      # read and pruned by the Hub (sign-in history, §8.2). 10003:10001.
      - group_gate_data:/data
    environment:
      GATE_POLICY_FILE: /hub-data/group-gate-policy.json
      # The Hub's shared custom fields → X-Forwarded-Attr-* (contract §4.1).
      GATE_ATTRIBUTES_FILE: /hub-data/user-attributes.json
      # Landing portal (https://<domain>/): the Hub's app list (contract §10).
      GATE_PORTAL_FILE: /hub-data/portal-apps.json
      # Certificate revocation: requests whose YubiKey or browser
      # certificate (seen via client-headers@file) has a revoked serial are
      # denied. Sources: the serial file above (instant) plus Vault's CRLs
      # (unauthenticated endpoints, refreshed periodically).
      GATE_REVOKED_FILE: /etc/group-gate/revocation/revoked-serials.txt
      # auto_rebuild=true: Vault adds new revocations to the DELTA CRL
      # (rebuilt about once a minute) and folds them into the full CRL only
      # at its next rebuild — group-gate enforces both.
      # Both CAs (pki_int: YubiKey certificates, pki_file: browser
      # certificates), space-separated; the old GATE_CRL_URL /
      # GATE_DELTA_CRL_URL make group-gate refuse to start.
      GATE_CRL_URLS: http://vault:8200/v1/pki_int/crl http://vault:8200/v1/pki_file/crl
      GATE_DELTA_CRL_URLS: http://vault:8200/v1/pki_int/crl/delta http://vault:8200/v1/pki_file/crl/delta
      GATE_YUBIKEY_CA_FILE: /etc/group-gate/ca/yubikey-ca.crt
      GATE_BROWSER_CA_FILE: /etc/group-gate/ca/browser-ca.crt
      GATE_OPENED_DIR: /data/opened
      # The Hub's impersonation.json (contract §4 "Impersonated requests",
      # sign-in part 3): missing, invalid or older than 300 s = no
      # impersonation counts (impersonated requests denied).
      GATE_IMPERSONATION_FILE: /hub-data/impersonation.json
      # Required: core hosts are <sub>.<PORTCULLIS_DOMAIN> (map.conf) and
      # app hosts <label>.<PORTCULLIS_DOMAIN> or on an enrolled domain
      # (policy v5 extra_domains); any other X-Forwarded-Host is denied.
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
    networks:
      - portcullis
    healthcheck:
      # One CMD-SHELL string (Podman re-splits CMD arguments on whitespace).
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    pids_limit: 64
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis
      traefik.http.services.group-gate.loadbalancer.server.port: "8080"
      traefik.http.middlewares.portcullis-groups.forwardauth.address: http://group-gate:8080
      traefik.http.middlewares.portcullis-groups.forwardauth.trustForwardHeader: "true"
      # group-gate reads the username from X-Auth-Request-Preferred-Username
      # (set by portcullis-auth, which must run first) and denies without it.
      # Authorization / X-Forwarded-Access-Token: group-gate echoes them
      # unchanged on allow (the Keycloak console keeps its own bearer behind
      # portcullis-auth-console) and withholds both when it stripped an
      # expired membership the token still names — Traefik then deletes them.
      # X-Forwarded-Impersonator / X-Forwarded-Impersonation (contract §5,
      # sign-in part 3): group-gate's on a live impersonation only; listed on
      # all four forward-auth middlewares so a client-sent copy never survives.
      traefik.http.middlewares.portcullis-groups.forwardauth.authResponseHeaders: X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups,X-Auth-Request-Preferred-Username,X-Forwarded-User,X-Forwarded-Email,Authorization,X-Forwarded-Access-Token,X-Forwarded-Impersonator,X-Forwarded-Impersonation
      # The user's shared custom fields (user-attributes.json in hub_data,
      # contract §4.1/§5) on every allowed request; client copies are deleted
      # first (forwardAuth removes all request headers matching the regex).
      traefik.http.middlewares.portcullis-groups.forwardauth.authResponseHeadersRegex: ^X-Forwarded-Attr-
      # Public exceptions (the Hub's portcullis-public-<app> routers, no
      # forward-auth): allows only published public paths without any
      # credential (contract §5). No authResponseHeaders: nobody is signed in.
      # The regex only deletes client-sent X-Forwarded-Attr-* (the guard
      # returns none): public routers have no other forward-auth to do it.
      traefik.http.middlewares.portcullis-public-guard.forwardauth.address: http://group-gate:8080/public-guard
      traefik.http.middlewares.portcullis-public-guard.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.portcullis-public-guard.forwardauth.authResponseHeadersRegex: ^X-Forwarded-Attr-
      # Landing portal at the apex domain: any signed-in user; group-gate's
      # /portal lists the apps of portal-apps.json their groups allow and,
      # for lldap_admin, the Hub and the consoles.
      traefik.http.routers.portal.rule: Host(`${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.portal.entrypoints: websecure
      traefik.http.routers.portal.tls.options: authaware@file
      traefik.http.routers.portal.middlewares: rate-limit@file,client-headers@file,portcullis-auth@docker,portal-path@docker,security-headers@file
      traefik.http.routers.portal.service: group-gate
      traefik.http.middlewares.portal-path.replacepath.path: /portal
    restart: unless-stopped

  hub:
    image: ${HUB_IMAGE:-ghcr.io/porelli/portcullis-hub:edge}
    <<: *hardening
    # Background instance backups / restores / deletes get ~50 s to finish
    # on stop (the Hub's bounded shutdown wait); longer ones are marked
    # interrupted at the next start.
    stop_grace_period: 60s
    # The image runs as uid/gid 10001; it writes only /data (named volume,
    # 10001-owned in the image), /project/templates and /project/appfiles
    # (chowned to 10001 by ./portcullis up) and the tmpfs paths below.
    read_only: true
    # /home/hub ($HOME of the image's user 10001): sticky world-writable
    # instead of uid=/gid= options, which Podman's compat API refuses
    # ("unknown mount option uid=10001"); only uid 10001 runs in here.
    tmpfs:
      - /tmp
      - /home/hub:mode=1777
    environment:
      PROJECT_DIR: /project
      PROJECT_HOST_DIR: ${PWD:-.}
      HUB_DATA_DIR: /data
      # No socket mount: Engine API + `docker compose` via its proxy (contract §6).
      DOCKER_HOST: tcp://socket-proxy-hub:2375
      # docker | podman (rootless): the Hub verifies the engine's /version
      # against it and refuses every engine operation on a mismatch (503).
      HUB_CONTAINER_RUNTIME: ${CONTAINER_RUNTIME:?CONTAINER_RUNTIME must be set in .env (./portcullis init writes it)}
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      DEFAULT_TEMPLATES_URL: https://github.com/porelli/portcullis-templates.git
      PORTAL_DISPLAY_NAME: ${PORTAL_DISPLAY_NAME:-Portcullis}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is not set — run ./portcullis init}
      # Users & Groups (integration contract §9): the Hub logs in to LLDAP
      # as its own service account `portcullis-hub` (lldap_admin), whose
      # credentials are FILES under /run/portcullis/lldap (never env vars),
      # kept in place by ./portcullis up. Invites go to enroll's API with the
      # shared secret in /run/portcullis/invite/secret; enroll refuses
      # `admin` and `portcullis-hub` (./portcullis invite admin on the host).
      HUB_LLDAP_CREDENTIALS_DIR: /run/portcullis/lldap
      LLDAP_HTTP_URL: http://lldap:17170
      LLDAP_LDAP_URL: ldap://lldap:3890
      LLDAP_BASE_DN: ${LLDAP_BASE_DN:-dc=portcullis,dc=local}
      # Extra groups treated as administrators (no invites via the API); same value as enroll.
      INVITE_PROTECTED_GROUPS: ${INVITE_PROTECTED_GROUPS:-}
      HUB_INVITE_API_URL: http://enroll:8444/internal/invites
      HUB_INVITE_SECRET_FILE: /run/portcullis/invite/secret
      # Enrolled domains (contract §12): the domains service's API over
      # portcullis-domains, bearer secret from a file.
      HUB_DOMAINS_API_URL: http://domains:8080
      HUB_DOMAINS_SECRET_FILE: /run/portcullis/domains/api-secret
      # Host directories an app's custom (Expert) override may bind-mount
      # (colon-separated; empty = /srv:/mnt:/media).
      HUB_OVERRIDE_BIND_ROOTS: ${HUB_OVERRIDE_BIND_ROOTS:-}
      # Shared secret Traefik sends as X-Portcullis-Proxy-Secret on every
      # request routed to the Hub (hub-proxy-secret middleware below,
      # integration contract §5); the Hub refuses to start without it.
      # Generated by ./portcullis init.
      HUB_PROXY_SECRET: ${HUB_PROXY_SECRET:?HUB_PROXY_SECRET is not set — run ./portcullis init}
      # Second listener: the directory only (users, groups, org chart,
      # import; per-request permission checks), routed as people.<domain>
      # for every signed-in user (contract §5.1).
      HUB_PEOPLE_ADDR: ":8889"
      # Per-person secrets volume (contract §6, file sharing): the Hub checks
      # ownership and mode at start; core ensures it.
      HUB_SECRETS_DIR: /secrets
      HUB_SECRETS_VOLUME: portcullis_hub_secrets
      # Keycloak public URL for fresh auth (file sharing, contract §8).
      HUB_KEYCLOAK_PUBLIC_URL: https://auth.${PORTCULLIS_DOMAIN:-portcullis.local}
      # AI support (contract §15.7): the Hub's third listener, for mcp-gate
      # only (X-Portcullis-MCP-Secret = the shared hub-secret file, compared
      # in constant time). Never a Traefik target (CI checks no router
      # points at 8890); reachable on every Hub network, the secret is the
      # protection. The Hub encrypts AI credentials to the gate's recipient
      # (age.pub; it holds no identity) and reads the gate's access log.
      HUB_MCP_ADDR: ":8890"
      HUB_MCP_GATE_SECRET_FILE: /run/portcullis/mcp-gate/hub-secret
      HUB_MCP_GATE_RECIPIENT_FILE: /run/portcullis/mcp-gate/age.pub
      HUB_MCP_GATE_DATA_DIR: /mcp-gate-data
      # Sign-in part 2 (contract §8.1 "Limits", §8.2, §5.1): the ceiling of a
      # browser certificate's lifetime (core's grammar; the Hub refuses to
      # start without it), the days before a certificate shows as expiring
      # (passed through; the Hub applies core's ^[0-9]+$, else 7), and
      # group-gate's opened log (read, and day files pruned).
      HUB_CLIENT_CERT_TTL: ${CLIENT_CERT_TTL:-720h}
      HUB_CERT_EXPIRY_WARN_DAYS: ${CERT_EXPIRY_WARN_DAYS:-7}
      HUB_GROUP_GATE_DATA_DIR: /group-gate-data
      # Sign-in part 3 (contract §8.1 "Impersonation"): how long a session
      # as someone else lasts, 1–30 minutes (default 30; only shortens);
      # anything else and the Hub refuses to start.
      HUB_IMPERSONATION_MAX_MINUTES: ${IMPERSONATION_MAX_MINUTES:-30}
    volumes:
      - .:/project:ro
      # Writable overlay: before every `compose up` the Hub copies each app's
      # template dir here, so `./templates/<app>/...` bind mounts in template
      # compose files resolve to real files on the HOST (compose resolves them
      # against --project-directory = this checkout). Generated, gitignored.
      - ./templates:/project/templates:rw
      # Settings data files (contract §13.7): the Hub writes
      # <id>/<name>/<name>.json (+ <name>.secrets.json) here and its
      # override bind-mounts `./appfiles/<id>/<name>` (the directory, not
      # the file: renames give a new inode) read-only into the service.
      # Generated from Hub state (not backed up), gitignored.
      - ./appfiles:/project/appfiles:rw
      # The Hub only needs /project/templates, the config file targets and
      # the core variables templates reference. Mask the Vault root token /
      # unseal key (secrets/) and backups (which contain copies of secrets/
      # and .env) with empty tmpfs mounts. Both dirs are tracked via .gitkeep
      # so the mountpoints always exist inside the read-only /project bind.
      - type: tmpfs
        target: /project/secrets
        tmpfs:
          size: 1048576
      - type: tmpfs
        target: /project/backups
        tmpfs:
          size: 1048576
      - hub_data:/data
      # NOT the core .env (it holds every core secret): a generated subset
      # with only what templates may reference (PORTCULLIS_DOMAIN, Traefik's
      # IP, VPN client secrets, HUB_SHARED_ENV). Rewritten in place by
      # ./portcullis up; group 10001, mode 0640.
      - ./secrets/hub/core.env:/project/.env:ro
      # secrets/ is masked above; these two subdirectories are the Hub's.
      - ./secrets/hub/lldap:/run/portcullis/lldap:ro
      - ./secrets/hub/invite:/run/portcullis/invite:ro
      - ./secrets/domains/api-secret:/run/portcullis/domains/api-secret:ro
      # mcp-gate (contract §15): the shared secret, the gate's age recipient
      # and its access log (written by the gate only).
      - ./secrets/mcp-gate/hub-secret:/run/portcullis/mcp-gate/hub-secret:ro
      - ./secrets/mcp-gate/age.pub:/run/portcullis/mcp-gate/age.pub:ro
      - mcp_gate_data:/mcp-gate-data:ro
      # group-gate's opened log (sign-in history, contract §8.2): read-write
      # only to delete day files older than history_days (never today's).
      - group_gate_data:/group-gate-data
      # Per-person secrets (contract §6): file-share password hashes, never
      # backed up, emptied by restore. The Hub checks ownership (10001:10001
      # 0700) at start; ./portcullis init/upgrade/restore ensure it.
      - hub_secrets:/secrets
    networks:
      portcullis: {}
      socket-proxy-hub: {}
      portcullis-domains: {}
      # mcp-gate → the Hub's :8890 listener (contract §15.7), at this pinned address.
      portcullis-mcp:
        ipv4_address: ${PORTCULLIS_MCP_HUB_IP:-172.31.253.3}
    mem_limit: 1g
    pids_limit: 512
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis
      traefik.http.routers.hub.rule: Host(`hub.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.hub.entrypoints: websecure
      traefik.http.routers.hub.tls.options: authaware@file
      # hub-proxy-secret is LAST among the request-modifying middlewares, so
      # the secret is never forwarded to the forwardAuth servers.
      traefik.http.routers.hub.middlewares: rate-limit@file,client-headers@file,portcullis-auth@docker,portcullis-groups@docker,hub-proxy-secret@docker,security-headers@file
      traefik.http.routers.hub.service: hub
      traefik.http.middlewares.hub-proxy-secret.headers.customrequestheaders.X-Portcullis-Proxy-Secret: ${HUB_PROXY_SECRET:?HUB_PROXY_SECRET is not set — run ./portcullis init}
      traefik.http.services.hub.loadbalancer.server.port: "8888"
      # people.<domain>: the Hub's directory listener (:8889), any signed-in
      # user (group-gate-map.conf people=*); the Hub checks permissions per
      # request. Same chain and proxy secret as the admin Hub (contract §5.1),
      # with client-cert-pem@file: the YubiKey renewal on the Sign-in page
      # reads the presented certificate from X-Forwarded-Tls-Client-Cert.
      traefik.http.routers.people.rule: Host(`people.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.people.entrypoints: websecure
      traefik.http.routers.people.tls.options: authaware@file
      traefik.http.routers.people.middlewares: rate-limit@file,client-cert-pem@file,portcullis-auth@docker,portcullis-groups@docker,hub-proxy-secret@docker,security-headers@file
      traefik.http.routers.people.service: hub-people
      traefik.http.services.hub-people.loadbalancer.server.port: "8889"
    depends_on:
      keycloak:
        condition: service_started
      socket-proxy-hub:
        condition: service_healthy
    restart: unless-stopped

  enroll:
    build:
      context: ./enroll
    <<: *hardening
    # USER 10002 in enroll/Dockerfile; secrets/enroll is group 10002, 0750/0640.
    read_only: true
    environment:
      # Extra groups treated as administrators (no invites via the API); same value as the hub.
      INVITE_PROTECTED_GROUPS: ${INVITE_PROTECTED_GROUPS:-}
      VAULT_ADDR: http://vault:8200
      # Least-privilege AppRole (policy vault/policies/enroll.hcl), created
      # by ./portcullis vault init. No static/root token.
      VAULT_ROLE_ID_FILE: /run/secrets/portcullis-enroll/role-id
      VAULT_SECRET_ID_FILE: /run/secrets/portcullis-enroll/secret-id
      LLDAP_URL: ldap://lldap:3890
      LLDAP_BASE_DN: ${LLDAP_BASE_DN:-dc=portcullis,dc=local}
      LLDAP_BIND_DN: uid=admin,ou=people,${LLDAP_BASE_DN:-dc=portcullis,dc=local}
      LLDAP_BIND_PASSWORD: ${LLDAP_ADMIN_PASSWORD:?LLDAP_ADMIN_PASSWORD is not set — run ./portcullis init}
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      # Longest lifetime of the certificates enroll issues (YubiKey and
      # browser certificates). Capped by the Vault roles (portcullis pki setup).
      CERT_TTL: ${CLIENT_CERT_TTL:-720h}
      # Invites: Keycloak admin API as the service account portcullis-enroll
      # (secret: secrets/enroll/keycloak-client-secret); the invite OIDC
      # client secret and the Hub's invite API secret are files there too.
      KEYCLOAK_URL: http://keycloak:8080
    networks:
      - portcullis
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8443/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    pids_limit: 128
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis
      # One-time invite links (enroll/invite.go): public, no forward-auth
      # (the user has no passkey yet). The only router on enroll.<domain>
      # (contract §5 "Core routers"): any other path there gets Traefik's
      # 404. Only /invite/* reaches enroll this way; the token / JWKS
      # (:8445) and invite API (:8444) ports are not routed by Traefik
      # (Keycloak / the Hub use them on `portcullis`).
      traefik.http.routers.enroll-invite.rule: Host(`enroll.${PORTCULLIS_DOMAIN:-portcullis.local}`) && PathPrefix(`/invite/`)
      traefik.http.routers.enroll-invite.entrypoints: websecure
      traefik.http.routers.enroll-invite.tls.options: authaware@file
      traefik.http.routers.enroll-invite.priority: "110"
      traefik.http.routers.enroll-invite.middlewares: rate-limit-auth@file,client-headers@file,security-headers@file
      traefik.http.routers.enroll-invite.service: enroll
      traefik.http.services.enroll.loadbalancer.server.port: "8443"
    volumes:
      - ./secrets/enroll:/run/secrets/portcullis-enroll:ro
      # Core-console groups (auth, hub, directory, ... entries): the Hub's
      # invite API refuses their members like lldap_admin's (enroll/invite.go).
      - ./group-gate/group-gate-map.conf:/etc/group-gate/map.conf:ro
    depends_on:
      vault:
        condition: service_healthy
      lldap:
        condition: service_healthy
    restart: unless-stopped

  # Enrolled domains (contract §12): DNS credentials (age-encrypted in
  # domains_data), A/AAAA records and ACME DNS-01 wildcard certificates per
  # domain; the certificates reach Traefik only through its HTTP provider
  # (portcullis-certs, mTLS). Never routed by Traefik. The main domain keeps
  # Traefik's own resolver.
  domains:
    build:
      context: ./domains
    image: portcullis-domains
    <<: *hardening
    read_only: true
    # USER 10004:10004 in domains/Dockerfile; group 10001 only to read the
    # API secret it shares with the Hub (secrets/domains/api-secret).
    user: "10004:10004"
    group_add: ["10001"]
    environment:
      PORTCULLIS_DOMAIN: ${PORTCULLIS_DOMAIN:-portcullis.local}
      ACME_EMAIL: ${ACME_EMAIL:-admin@portcullis.local}
      ACME_CA_SERVER: ${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      DOMAINS_API_SUBNET: ${PORTCULLIS_DOMAINS_SUBNET:-172.31.252.0/28}
      # DNS hardening (contract §12.4): the caa set, its issuer for a CA
      # other than Let's Encrypt, iodef; ALERT_SMTP_FROM's domain gets no
      # nomail recommendation.
      DNS_CAA: ${DNS_CAA:-true}
      DNS_CAA_ISSUER: ${DNS_CAA_ISSUER:-}
      DNS_CAA_IODEF: ${DNS_CAA_IODEF:-}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
    # DOMAINS_PUBLIC_IPV4 / _IPV6: PORTCULLIS_PUBLIC_IPV4 / _IPV6 from .env,
    # else detected (the last detected address kept when a lookup fails) —
    # written by ./portcullis up, so a manual `docker compose up` gets them
    # (missing before the first up: no addresses, no records).
    env_file:
      - path: ./secrets/domains/public-ips.env
        required: false
      # DOMAINS_MAIN_ACME_ACCOUNT_URI: Traefik's ACME account (written by
      # ./portcullis up / upgrade), the pin of the read-only main-domain plan.
      - path: ./secrets/domains/main-domain.env
        required: false
    volumes:
      - domains_data:/data
      - ./secrets/domains/api-secret:/run/portcullis/domains/api-secret:ro
      - ./secrets/domains/age.key:/run/portcullis/domains/age.key:ro
      - ./secrets/domains/certs-endpoint/ca.crt:/run/portcullis/domains/certs-endpoint/ca.crt:ro
      - ./secrets/domains/certs-endpoint/server.crt:/run/portcullis/domains/certs-endpoint/server.crt:ro
      - ./secrets/domains/certs-endpoint/server.key:/run/portcullis/domains/certs-endpoint/server.key:ro
    networks:
      - portcullis-domains
      - portcullis-certs
      - domains-egress
    healthcheck:
      test: ["CMD", "domains", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped

  # The domains image's one-shot DNS tool for the main domain (contract
  # §12.1): `./portcullis dns plan | setup | check` runs it with
  # `docker compose run --rm --no-deps -T dns-tool <sub>` and the provider
  # credentials as JSON on stdin. Internet only (domains-egress: the DNS
  # provider APIs, the public resolvers); no volumes, no environment, no
  # secrets, never started by `up` (profile tools).
  dns-tool:
    image: portcullis-domains
    pull_policy: never
    profiles: [tools]
    <<: *hardening
    read_only: true
    user: "10004:10004"
    entrypoint: ["domains", "dns"]
    stdin_open: true
    # The image's HEALTHCHECK (domains healthcheck → :8080) is the
    # service's; a one-shot run serves nothing.
    healthcheck:
      disable: true
    networks: [domains-egress]
    mem_limit: 128m
    pids_limit: 64

  # MCP gate (contract §15): terminates every MCP request — the Keycloak
  # access token for exactly this resource, the person's population, tool
  # policy, limits, confirmations, the access log — and forwards it with
  # the person's identity in the template's form; never the token. No
  # forward-auth on its routers (MCP clients send bearer tokens, never
  # cookies; browser routes keep oauth2-proxy, which accepts no bearer).
  # No Docker access, no LLDAP / Keycloak admin credentials. On
  # portcullis-proxy at the pinned PORTCULLIS_MCP_GATE_IP (the only peer
  # that calls companions); on portcullis-mcp (internal: only the gate,
  # Keycloak and the Hub) for Keycloak's JWKS and the Hub's :8890 listener.
  # Not on portcullis: nothing else is reachable from it.
  mcp-gate:
    build:
      context: ./mcp-gate
    image: portcullis-mcp-gate
    <<: *hardening
    read_only: true
    # USER 10005:10005 in mcp-gate/Dockerfile; group 10001 only: the shared
    # hub-secret, the Hub's files in hub_data (mcp-gate.json,
    # mcp-credentials.json, user-attributes.json: the only group-readable
    # files there) and the access log's group (the Hub reads it).
    user: "10005:10005"
    group_add: ["10001"]
    tmpfs:
      - /tmp
    environment:
      MCP_GATE_LISTEN: ":8080"
      MCP_GATE_HUB_DATA: /hub-data
      MCP_GATE_DATA: /data
      MCP_GATE_AGE_KEY_FILE: /run/portcullis/mcp-gate/age.key
      MCP_GATE_HUB_SECRET_FILE: /run/portcullis/mcp-gate/hub-secret
      MCP_GATE_JWKS_URL: http://keycloak:8080/realms/portcullis/protocol/openid-connect/certs
      MCP_GATE_HUB_URL: http://hub:8890
      # The Go heap stays under mem_limit (final review I3: the gate caps
      # bodies in flight at 512 MiB gate-wide, 6 POSTs per person).
      GOMEMLIMIT: 900MiB
    volumes:
      - hub_data:/hub-data:ro
      # The access log (contract §15.8): access.jsonl 0640 group 10001, the
      # directory 0750 (the gate refuses to start if it can't set them).
      - mcp_gate_data:/data
      - ./secrets/mcp-gate/age.key:/run/portcullis/mcp-gate/age.key:ro
      - ./secrets/mcp-gate/hub-secret:/run/portcullis/mcp-gate/hub-secret:ro
    networks:
      portcullis-mcp: {}
      portcullis-proxy:
        ipv4_address: ${PORTCULLIS_MCP_GATE_IP:-172.31.250.3}
    # MCP_GATE_JWKS_URL / MCP_GATE_HUB_URL name keycloak and hub: /etc/hosts
    # pins them to their portcullis-mcp addresses (never DNS, which a
    # container answering to those names elsewhere could shadow).
    extra_hosts:
      - "keycloak:${PORTCULLIS_MCP_KEYCLOAK_IP:-172.31.253.2}"
      - "hub:${PORTCULLIS_MCP_HUB_IP:-172.31.253.3}"
    healthcheck:
      test: ["CMD", "mcp-gate", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 1g
    pids_limit: 256
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis-proxy
      traefik.http.services.mcp-gate.loadbalancer.server.port: "8080"
      # "All my apps" (mcp.<domain>/mcp and its RFC 9728 metadata): every
      # path of the host goes to the gate, which serves only those two.
      traefik.http.routers.mcp.rule: Host(`mcp.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.mcp.entrypoints: websecure
      traefik.http.routers.mcp.tls.options: authaware@file
      traefik.http.routers.mcp.middlewares: rate-limit@file,security-headers@file
      traefik.http.routers.mcp.service: mcp-gate
      # The Portcullis MCP (admin on hub.<domain>, people on people.<domain>):
      # exact paths only, above the hub / people routers, with the SAME TLS
      # options as those routers (one SNI host, one TLS option; CI checks).
      traefik.http.routers.hub-mcp.rule: Host(`hub.${PORTCULLIS_DOMAIN:-portcullis.local}`) && (Path(`/mcp`) || Path(`/.well-known/oauth-protected-resource/mcp`))
      traefik.http.routers.hub-mcp.entrypoints: websecure
      traefik.http.routers.hub-mcp.tls.options: authaware@file
      traefik.http.routers.hub-mcp.priority: "200"
      traefik.http.routers.hub-mcp.middlewares: rate-limit@file,security-headers@file
      traefik.http.routers.hub-mcp.service: mcp-gate
      traefik.http.routers.people-mcp.rule: Host(`people.${PORTCULLIS_DOMAIN:-portcullis.local}`) && (Path(`/mcp`) || Path(`/.well-known/oauth-protected-resource/mcp`))
      traefik.http.routers.people-mcp.entrypoints: websecure
      traefik.http.routers.people-mcp.tls.options: authaware@file
      traefik.http.routers.people-mcp.priority: "200"
      traefik.http.routers.people-mcp.middlewares: rate-limit@file,security-headers@file
      traefik.http.routers.people-mcp.service: mcp-gate
    restart: unless-stopped

  # ── Monitoring (opt-in: COMPOSE_PROFILES=monitoring in .env, then
  # ./portcullis up). docs/monitoring.md. Config: monitoring/; generated
  # files and the Vault metrics token: secrets/monitoring/ (./portcullis up).
  prometheus:
    image: docker.io/prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    profiles: [monitoring]
    <<: *hardening
    user: "65534:65534"
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - ./secrets/monitoring/prometheus:/etc/portcullis:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - portcullis
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped

  alertmanager:
    image: docker.io/prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    profiles: [monitoring]
    <<: *hardening
    user: "65534:65534"
    read_only: true
    command:
      # Generated from ALERT_* in .env by ./portcullis up (monitoring.sh).
      - --config.file=/etc/portcullis/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ./secrets/monitoring/alertmanager:/etc/portcullis:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring
      - alerting
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped

  blackbox:
    image: docker.io/prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    profiles: [monitoring]
    <<: *hardening
    user: "65534:65534"
    read_only: true
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    # The TLS probe connects to auth.<domain> the way browsers do: through
    # the host's published :443, so it sees Traefik's real (ACME) cert.
    extra_hosts:
      - "auth.${PORTCULLIS_DOMAIN:-portcullis.local}:host-gateway"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring
      - portcullis
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped

  # Serves monitoring/textfile/*.prom (written by ./portcullis backup and
  # ./portcullis status --textfile): backup age, client-cert / CA expiry.
  # Only the textfile collector — no host metrics, no host mounts.
  textfile-exporter:
    image: docker.io/prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    profiles: [monitoring]
    <<: *hardening
    user: "65534:65534"
    read_only: true
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/textfile
    volumes:
      - ./monitoring/textfile:/textfile:ro
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    profiles: [monitoring]
    <<: *hardening
    user: "472:472"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      GF_SERVER_ROOT_URL: https://metrics.${PORTCULLIS_DOMAIN:-portcullis.local}/
      GF_LOG_MODE: console
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      # Sign-in is Portcullis: forward-auth + group-gate (lldap_admin) set
      # X-Forwarded-User (LLDAP username) / X-Forwarded-Email; Grafana
      # accepts them only from Traefik's fixed IP on portcullis-proxy.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Forwarded-User
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      # Deliberately no GF_AUTH_PROXY_HEADERS email mapping: Grafana's user
      # sync can match accounts by email, and LLDAP email is user-editable.
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_AUTH_PROXY_WHITELIST: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Everyone who gets here is in lldap_admin.
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana/admin-password
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - ./secrets/monitoring/grafana:/run/secrets/grafana:ro
    networks:
      - monitoring
      - portcullis-proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    pids_limit: 256
    labels:
      traefik.enable: "true"
      traefik.docker.network: portcullis-proxy
      traefik.http.routers.grafana-metrics.rule: Host(`metrics.${PORTCULLIS_DOMAIN:-portcullis.local}`)
      traefik.http.routers.grafana-metrics.entrypoints: websecure
      traefik.http.routers.grafana-metrics.tls.options: authaware@file
      traefik.http.routers.grafana-metrics.middlewares: rate-limit@file,client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.grafana-metrics.loadbalancer.server.port: "3000"
    restart: unless-stopped

volumes:
  postgres_data:
  vault_data:
  lldap_data:
  hub_data:
  # Per-person secrets (contract §6, file sharing): password hashes for
  # person_secret options. Never backed up (offsite would carry hashes);
  # emptied by restore (a restored hash could revive a leaked password).
  # init/upgrade/restore ensure 10001:10001 0700; the Hub checks it at start.
  hub_secrets:
    name: portcullis_hub_secrets
  traefik_acme:
  domains_data:
  # The MCP gate's access log (contract §15.8); read-only in the Hub.
  mcp_gate_data:
  # group-gate's opened log (contract §4, §8.2): written by group-gate,
  # read and pruned by the Hub. 10003:10001, kept a year, backed up.
  group_gate_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
