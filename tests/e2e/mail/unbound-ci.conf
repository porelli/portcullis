# CI only (build-and-test "Test the mail service", e2e-mail; P40): mail-resolver
# forwards EVERY name to the domains service's fake DNS on domains-egress,
# so no DNS query (MX, DNSBL, PTR, DKIM) leaves the runner. No DNSSEC
# validation (the fake zone is unsigned): the dane check reports it.
# __FAKEDNS__ is replaced by the fake DNS's address there.
server:
    do-daemonize: no
    username: ""
    chroot: ""
    directory: "/var/unbound"
    logfile: ""
    use-syslog: no
    pidfile: ""
    verbosity: 1
    interface: 0.0.0.0@5353
    port: 5353
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.31.255.0/28 allow
    module-config: "iterator"
    do-not-query-localhost: no
    hide-identity: yes
    hide-version: yes
    num-threads: 1
    # The fake zone changes during a run (DKIM keys, the mail set): short
    # caches, so a new record is seen within seconds.
    cache-max-ttl: 5
    cache-max-negative-ttl: 2
    # The CI's domains are under .test (team-b.test, remote.test): Unbound
    # answers the special-use .test itself (NXDOMAIN, RFC 6761) unless
    # told not to.
    local-zone: "test." nodefault
forward-zone:
    name: "."
    forward-addr: __FAKEDNS__@8053
