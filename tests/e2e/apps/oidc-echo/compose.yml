services:
  # Stands in for a native-OIDC app: e2e-signin drives Keycloak's authorize
  # endpoint with the instance's client itself and stops the browser at the
  # redirect URI (https://<host>/cb), so the app never signs anyone in; the
  # secret is only what the Hub registers in Keycloak for the client.
  web:
    image: docker.io/traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    environment:
      OIDC_ECHO_SECRET: ${OIDC_ECHO_SECRET:?OIDC_ECHO_SECRET must be set}
    networks: [default, portcullis-proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.oidc.rule: Host(`${PORTCULLIS_HOST_OIDC:-oidc.portcullis.local}`)
      traefik.http.routers.oidc.entrypoints: websecure
      traefik.http.routers.oidc.middlewares: client-headers@file,security-headers@file
      traefik.http.services.oidc.loadbalancer.server.port: "80"

networks:
  portcullis-proxy:
    external: true
