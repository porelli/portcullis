services:
  web:
    image: docker.io/traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    # A numeric non-root user (Kubernetes refuses a volume-mounting service
    # without one), so :8080: a non-root pod can't bind :80.
    user: "65534:65534"
    command: ["--port", "8080"]
    networks: [default, portcullis-proxy]
    volumes:
      - data:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.echo.rule: Host(`${PORTCULLIS_HOST_ECHO:-echo.portcullis.local}`)
      traefik.http.routers.echo.entrypoints: websecure
      traefik.http.routers.echo.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.echo.loadbalancer.server.port: "8080"
  # PID 1 shell that ignores SIGTERM: compose down waits ECHO_STOP_GRACE.
  # Its own image (never the Hub's helper alpine): e2e-instances removes the
  # helper image while echo instances run and checks the Hub pulls it by
  # digest, which Docker's containerd image store refuses for an image in use.
  hold:
    image: docker.io/library/busybox:1.38.0-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
    command: ["sh", "-c", "trap '' TERM; while :; do sleep 1; done"]
    stop_grace_period: ${ECHO_STOP_GRACE:-1s}
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  data: {}

networks:
  portcullis-proxy:
    external: true
