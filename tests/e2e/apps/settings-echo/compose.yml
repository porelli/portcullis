services:
  web:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    networks: [default, portcullis-proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.settings-echo.rule: Host(`${PORTCULLIS_HOST_SETTINGS_ECHO:-settings-echo.portcullis.local}`)
      traefik.http.routers.settings-echo.entrypoints: websecure
      traefik.http.routers.settings-echo.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
      traefik.http.services.settings-echo.loadbalancer.server.port: "80"

networks:
  portcullis-proxy:
    external: true
