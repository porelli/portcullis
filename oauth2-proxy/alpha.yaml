# oauth2-proxy alpha config.
#
# Why alpha config: upstream keeps per-request loginURLParameters out of the
# legacy env-based config. We need the per-request pc_method so group-gate's
# step-up redirect (/oauth2/start?pc_method=security_key) reaches Keycloak.
# Once --alpha-config is set, providers + upstreams MUST live here; every
# other knob (cookie, headers, ingress) still comes from OAUTH2_PROXY_* env.
#
# Env substitution: ${FOO} is expanded at load time, so secrets stay in .env.
providers:
  - id: portcullis-keycloak
    provider: oidc
    clientID: portcullis-forward-auth
    clientSecret: ${FORWARD_AUTH_CLIENT_SECRET}
    scope: openid email profile groups
    code_challenge_method: S256
    oidcConfig:
      issuerURL: https://auth.${PORTCULLIS_DOMAIN}/realms/portcullis
      skipDiscovery: false
      groupsClaim: groups
      # Identity = the LLDAP username (immutable, admin-assigned), never the
      # email: LLDAP lets every user edit their own mail. oauth2-proxy's
      # session "user" is always the token's `sub` (Keycloak's user UUID) —
      # there is no setting for it: `userIDClaim` is a deprecated alias of
      # emailClaim (v7.15: it only replaced the EMAIL with the username).
      # So the identity headers below are built from the preferred_username
      # claim, and group-gate reads only X-Auth-Request-Preferred-Username.
      emailClaim: email
      # Keycloak does not trust LLDAP's (user-editable) mail, so
      # email_verified is false. Nothing here authorises by email, so accept it.
      insecureAllowUnverifiedEmail: true
      audienceClaims:
        - aud
    # Per-request parameters for Keycloak; `allow` gates accepted values.
    loginURLParameters:
      # A step-up asks for one sign-in method (contract §5, plan D7):
      # group-gate sends /oauth2/start?pc_method=<method id or passkey>;
      # Keycloak keeps the unknown authorize parameter as the client note
      # client_request_param_pc_method, which the sign-in extension reads.
      # No default (a normal sign-in asks for nothing in particular) and no
      # acr_values: the flows have no LoA levels any more.
      - name: pc_method
        allow:
          - value: password
          - value: totp
          - value: passkey_synced
          - value: browser_cert
          - value: passkey_device
          - value: security_key
          - value: yubikey_cert
          - value: passkey
      # One-time invite links (enroll/invite.go) start here with
      # kc_idp_hint=portcullis-invite (Keycloak's identity provider
      # redirector) and prompt=login, so an SSO session of whoever used the
      # browser before is not reused. group-gate's step-up never sends
      # prompt: the extension asks only for the one method, on top of the
      # Keycloak session's.
      - name: kc_idp_hint
        allow:
          - value: portcullis-invite
      - name: prompt
        allow:
          - value: login

server:
  bindAddress: 0.0.0.0:4180

# Forward-auth emits headers on the /oauth2/auth 202 response via
# injectResponseHeaders (NOT injectRequestHeaders — that one mutates the
# inbound request object which Traefik drops). Traefik's authResponseHeaders
# copies these onto the downstream service's request.
#
# X-Auth-Request-User / X-Forwarded-User / X-Auth-Request-Preferred-Username
# all carry preferred_username (the LLDAP username), NOT `user` (= sub).
injectResponseHeaders:
  - name: X-Auth-Request-User
    values:
      - claimSource:
          claim: preferred_username
  - name: X-Auth-Request-Email
    values:
      - claimSource:
          claim: email
  - name: X-Auth-Request-Groups
    values:
      - claimSource:
          claim: groups
  - name: X-Auth-Request-Preferred-Username
    values:
      - claimSource:
          claim: preferred_username
  - name: X-Auth-Request-Access-Token
    values:
      - claimSource:
          claim: access_token
  - name: X-Forwarded-Access-Token
    values:
      - claimSource:
          claim: access_token
  - name: X-Forwarded-User
    values:
      - claimSource:
          claim: preferred_username
  - name: Authorization
    values:
      - claimSource:
          claim: access_token
          prefix: "Bearer "

upstreamConfig:
  upstreams:
    # 202 sentinel: this instance is forward-auth only, not proxying upstream.
    - id: static
      path: /
      static: true
      staticCode: 202
