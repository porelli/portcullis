# Portcullis alert rules (docs/monitoring.md). Tested by
# monitoring/prometheus/tests/alerts_test.yml (`promtool test rules`, CI).
groups:
  - name: portcullis
    rules:
      - alert: VaultSealedOrDown
        expr: probe_success{job="vault_health"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Vault is sealed, uninitialised or down
          description: >-
            /v1/sys/health is not 200: no certificates can be issued and the CRL
            is not refreshed. Run ./portcullis vault unseal and check
            docker compose logs vault.

      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }} cannot be scraped"
          description: "{{ $labels.instance }} ({{ $labels.job }}) has been unreachable for 5 minutes."

      - alert: ServiceProbeFailed
        expr: probe_success{job=~"services|services_tcp"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service }} is down or unhealthy"
          description: "The health probe of {{ $labels.service }} ({{ $labels.instance }}) has failed for 5 minutes."

      - alert: PublicCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="tls"} - time() < 14 * 86400
        for: 1h
        labels: {severity: critical}
        annotations:
          summary: The public certificate expires in less than 14 days
          description: >-
            {{ $labels.instance }} presents a certificate that expires in
            {{ $value | humanizeDuration }}. ACME renewal (Traefik, DNS-01) is
            failing: check docker compose logs traefik and the DNS provider credentials.

      - alert: PublicCertProbeFailed
        expr: probe_success{job="tls"} == 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: TLS handshake with the public endpoint fails
          description: "{{ $labels.instance }}: expired, untrusted or wrong certificate, or Traefik is down."

      - alert: CrlStale
        expr: >-
          group_gate_crl_enabled == 1
          and (
            time() - group_gate_crl_last_success_timestamp_seconds > 600
            or (group_gate_crl_next_update_timestamp_seconds > 0) < time()
          )
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: group-gate's copy of Vault's CRL is stale
          description: >-
            group-gate has not fetched a fresh CRL for 10 minutes, or the CRL is
            past its nextUpdate (Keycloak then refuses X.509 logins). Certs revoked
            in Vault only (not via ./portcullis cert revoke) may still be accepted.

      - alert: RevocationListUnreadable
        expr: group_gate_revoked_file_serials < 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: group-gate cannot read certs/revocation/revoked-serials.txt
          description: Every request that presents a YubiKey or browser certificate is denied until it is readable.

      - alert: GroupGateDenySpike
        expr: sum(rate(group_gate_denials_total[5m])) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Many requests denied by group-gate
          description: "{{ $value | humanize }} denials/s for 10 minutes. Check the denial reasons on the Portcullis dashboard."

      - alert: GroupGatePolicyErrors
        expr: increase(group_gate_policy_load_errors_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: The Hub policy file (or a policy in it) is invalid
          description: group-gate fails closed and denies the affected apps. Check the Hub and docker compose logs group-gate.

      - alert: BackupTooOld
        expr: time() - portcullis_backup_last_success_timestamp_seconds > 36 * 3600
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "No successful {{ $labels.kind }} backup for 36 hours"
          description: "The last {{ $labels.kind }} backup is {{ $value | humanizeDuration }} old. Check the portcullis-backup.timer (journalctl -u portcullis-backup)."

      - alert: BackupNeverRan
        expr: absent(portcullis_backup_last_success_timestamp_seconds)
        for: 6h
        labels: {severity: warning}
        annotations:
          summary: No backup has been recorded
          description: Run ./portcullis backup --offsite and schedule it (./portcullis backup schedule --systemd).

      - alert: ClientCertExpiring
        expr: portcullis_client_cert_expiry_timestamp_seconds - time() < 7 * 86400
        labels: {severity: info}
        annotations:
          summary: "The {{ $labels.kind }} certificate of {{ $labels.cn }} expires soon"
          description: "YubiKey certificate: renew it on the Sign-in page (https://people.<domain>/signin) or with ./portcullis cert renew; browser certificate: make a new one on the Sign-in page ({{ $value | humanizeDuration }} left)."

      - alert: CaExpiring
        expr: portcullis_ca_expiry_timestamp_seconds - time() < 90 * 86400
        labels: {severity: critical}
        annotations:
          summary: "The {{ $labels.ca }} CA expires in less than 90 days"
          description: Every YubiKey and browser certificate it issued (for the root, all of them) stops working when it expires.

      - alert: PortcullisStatusStale
        expr: time() - portcullis_status_last_run_timestamp_seconds > 36 * 3600
        labels: {severity: warning}
        annotations:
          summary: ./portcullis status --textfile has not run for 36 hours
          description: Certificate and CA expiry metrics are out of date (it runs after every scheduled backup).

      # VPN (contract §16): in admin / server mode the VPN-only core surfaces
      # need wg; with it down (or never scraped) they are unreachable.
      - alert: PortcullisVPNDown
        expr: portcullis_vpn_mode_restricted == 1 and on() (absent(up{job="wg"}) or up{job="wg"} == 0)
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: The VPN service is down while core surfaces are VPN-only
          description: >-
            VPN mode is admin or server and wg can't be scraped: the VPN-only core
            surfaces are unreachable. Run ./portcullis status on the host; break-glass:
            ./portcullis vpn mode apps.

      - alert: PortcullisVPNProviderStale
        expr: wg_provider_stale == 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "The VPN provider {{ $labels.provider }} has a stale device map"
          description: >-
            Its devices are denied until the Hub publishes a fresh map (the identity
            hook fails or the gateway is down). See the instance's VPN tab in the Hub.

      # Usage (the Hub's usage metrics, job hub-usage, contract §16.2): the
      # doctor's thresholds, so Alertmanager notifies what the doctor shows.
      # The Hub's own label is app (the instance id or core); instance is
      # Prometheus' scrape target, hub-metrics:9100 (FR-H1).
      - alert: PortcullisAppMemoryNearLimit
        expr: portcullis_container_memory_working_set_bytes / portcullis_container_memory_limit_bytes > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.app }}'s {{ $labels.service }}.{{ $labels.number }} is near its memory limit"
          description: Its working set has been above 90 % of its memory limit for 10 minutes. Raise the limit or look at its logs (Hub → Usage).

      # The doctor's disk bands (disk_nearly_full): a warning under 10 % or
      # 5 GiB free, a problem under 3 % or 1 GiB.
      - alert: PortcullisDiskNearlyFull
        expr: >-
          portcullis_filesystem_free_bytes / portcullis_filesystem_total_bytes < 0.10
          or portcullis_filesystem_free_bytes < 5 * 1024 * 1024 * 1024
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "A filesystem with Portcullis data (device {{ $labels.dev }}) is nearly full"
          description: Less than 10 % or 5 GiB is free. Free space or move the data (Hub → Usage → Storage names the filesystem and what is on it, largest first).

      - alert: PortcullisDiskAlmostFull
        expr: >-
          portcullis_filesystem_free_bytes / portcullis_filesystem_total_bytes < 0.03
          or portcullis_filesystem_free_bytes < 1024 * 1024 * 1024
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "A filesystem with Portcullis data (device {{ $labels.dev }}) is almost full"
          description: Less than 3 % or 1 GiB is free. When it fills, apps can't write; databases stop, uploads and backups fail. Free space now (Hub → Usage → Storage).

      - alert: PortcullisUsageSamplerStale
        expr: (time() - portcullis_usage_sampler_last_success_timestamp_seconds > 600) and on() (up{job="hub-usage"} == 1)
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: The Hub's usage sampler has had no good sample for 10 minutes
          description: The Usage page and these metrics are out of date. Check the Hub's log for usage lines and GET /api/runtime.

      # The sampler's timestamp is left out until its first good sweep: a
      # Hub that is scraped but never sampled is caught here.
      - alert: PortcullisUsageSamplerNeverRan
        expr: absent(portcullis_usage_sampler_last_success_timestamp_seconds) and on() (up{job="hub-usage"} == 1)
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: The Hub's usage sampler has never had a good sample
          description: The Hub is scraped but has measured nothing for 15 minutes. Check the Hub's log for usage lines and GET /api/runtime.
      # Multiple servers (contract §17): link's handshake ages and the worker
      # agents' gauges (job link, labelled server=<id>).
      # Only servers that enrolled (link.json ready): one added but never
      # joined isn't down (the Hub's server_enrol op reports it).
      - alert: PortcullisServerDown
        expr: wg_link_peer_handshake_age_seconds > 300 and on(job, instance, server) wg_link_peer_ready == 1
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "The server {{ $labels.server }} has had no tunnel handshake for 5 minutes"
          description: >-
            Its apps are unreachable (nothing routes to an offline server); their containers
            keep running there. Check the worker's network and ./portcullis worker status on it.

      - alert: PortcullisServerDiskLow
        expr: >-
          (portcullis_agent_disk_free_bytes / portcullis_agent_disk_total_bytes) < 0.10
          or (portcullis_agent_data_free_bytes / portcullis_agent_data_total_bytes) < 0.10
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "The server {{ $labels.server }} has less than 10 % disk free"
          description: >-
            The engine's data root or the agent's data dir is nearly full: images, volumes
            and backups on that server will fail. Free space on the worker.

      - alert: PortcullisServerContainerUnhealthy
        # app = the instance id (instance is Prometheus' target label).
        expr: portcullis_agent_container_unhealthy == 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.app }} / {{ $labels.service }} is unhealthy on the server {{ $labels.server }}"
          description: >-
            Its healthcheck has failed for 5 minutes. See the instance in the Hub (logs, restart).

      # High availability (contract §20.8, Task 29 fix round 1 M1): the main
      # domain's certificate in the front door's store (job frontdoor; no
      # target outside HA). 0 = none yet: fires too (nothing is served).
      - alert: PortcullisFrontdoorCertExpiring
        expr: portcullis_frontdoor_certificate_expiry_timestamp_seconds - time() < 14 * 86400
        for: 1h
        labels: {severity: critical}
        annotations:
          summary: "The main domain's certificate (front door) expires in under 14 days, or there is none"
          description: >-
            The front door renews it with 30 days left only while it belongs to its current ACME
            account. ./portcullis status names why it isn't renewing (a pending ACME_STAGING flip:
            run ./portcullis up; the front door's log says the rest).

      # Mail (contract §19.8): the wired provider's contract gauges (job
      # mail-provider); MailCertExpiring is core's textfile metric.
      - alert: MailQueueHigh
        expr: portcullis_mail_queue_messages > 100
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} messages wait in the mail queue"
          description: >-
            Outbound mail isn't leaving. Run ./portcullis mail status (port 25, blocklists,
            the relay) and look at the doctor's mail findings.

      - alert: MailDeferralsHigh
        expr: portcullis_mail_queue_deferred_ratio > 0.2
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: More than a fifth of the queued mail is deferred
          description: >-
            Remote servers keep refusing or timing out. Run ./portcullis mail status
            (reverse DNS, blocklists, port 25).

      - alert: MailCertExpiring
        expr: portcullis_mail_cert_expiry_seconds - time() < 14 * 86400
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: The mail certificate expires within 14 days (or is missing)
          description: >-
            The daily timer should have renewed it. Run ./portcullis mail cert and
            check ./portcullis mail schedule --systemd is installed.

      - alert: MailBlocklisted
        expr: portcullis_mail_check{check="blocklist"} == 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: The mail server's address is on a blocklist (or a list refused the query)
          description: >-
            Receivers will refuse its mail. ./portcullis mail status names the list and
            the delisting steps.

      - alert: MailDKIMStuck
        expr: portcullis_mail_check{check=~"dkim_stuck:.*"} == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "A DKIM key of {{ $labels.check }} has waited more than 24 h for DNS"
          description: >-
            The rotation can't finish until both public resolvers serve the new TXT
            record. Check the domain's mail records (./portcullis dns plan, or the
            domain in the Hub).

      - alert: MailCheckFailing
        expr: portcullis_mail_check{check!="blocklist",check!~"dkim_stuck:.*"} == 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "The mail check {{ $labels.check }} is failing"
          description: Run ./portcullis mail status, or see the Hub's doctor.

      - alert: PortcullisStatusProblems
        expr: portcullis_status_ok == 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: ./portcullis status reported problems
          description: Run ./portcullis status on the host.
