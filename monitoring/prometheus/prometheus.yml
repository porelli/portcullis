# Prometheus for the Portcullis core stack (compose profile `monitoring`,
# docs/monitoring.md). Static: everything domain- or secret-specific comes
# from files ./portcullis writes into secrets/monitoring/prometheus/
# (mounted at /etc/portcullis).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    stack: portcullis

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Traefik's internal `metrics` entrypoint (:8082, not published).
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  # Needs a token with the portcullis-metrics policy (./portcullis vault init).
  # A sealed Vault answers 503 here too — see the vault_health probe.
  - job_name: vault
    metrics_path: /v1/sys/metrics
    params:
      format: [prometheus]
    authorization:
      type: Bearer
      credentials_file: /etc/portcullis/vault-token
    static_configs:
      - targets: ["vault:8200"]

  - job_name: group-gate
    static_configs:
      - targets: ["group-gate:8080"]

  # Keycloak management interface (--metrics-enabled), not routed by Traefik.
  - job_name: keycloak
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # The VPN service (profile wg, contract §16): over portcullis-metrics-wg.
  # file_sd, written by ./portcullis (up / vpn init): the target only while
  # the profile is on, so an install without the VPN has no wg target and
  # no TargetDown for it.
  - job_name: wg
    file_sd_configs:
      - files: [/etc/portcullis/wg-targets.json]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'wg_link_.*|portcullis_agent_.*'
        action: drop
      # A server-labelled series is a worker's (job link's), never wg's own:
      # nothing a worker returns reaches the families the alerts read.
      - source_labels: [server]
        regex: '.+'
        action: drop

  # Multiple servers (contract §17.2): the link role's own metrics and the
  # worker agents' (fetched over the tunnel by wg, labelled server=<id>),
  # from the same wg target as job wg (one process, ruling P25); each job
  # keeps only its own families.
  - job_name: link
    file_sd_configs:
      - files: [/etc/portcullis/wg-targets.json]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'wg_link_.*|portcullis_agent_.*'
        action: keep

  # Mail (profile mail, contract §19.8): over portcullis-metrics-mail, from
  # one file_sd written by ./portcullis (mail-targets.json: both targets
  # while the profile is on, else []), each job keeping its own service.
  # Stalwart's endpoint needs Basic auth (prometheus + a copy of
  # secrets/mail/metrics-secret).
  - job_name: mail
    metrics_path: /metrics/prometheus
    basic_auth:
      username: prometheus
      password_file: /etc/portcullis/mail-metrics-secret
    file_sd_configs:
      - files: [/etc/portcullis/mail-targets.json]
    relabel_configs:
      - source_labels: [service]
        regex: mail
        action: keep
  # mailctl's endpoint needs Basic auth too (its own password, a copy of
  # secrets/mail/mailctl-metrics-secret).
  - job_name: mailctl
    basic_auth:
      username: prometheus
      password_file: /etc/portcullis/mailctl-metrics-secret
    file_sd_configs:
      - files: [/etc/portcullis/mail-targets.json]
    relabel_configs:
      - source_labels: [service]
        regex: mailctl
        action: keep

  # Textfile metrics written by ./portcullis (backup age, client-cert and CA
  # expiry, `portcullis status` service health).
  - job_name: portcullis
    honor_labels: true
    static_configs:
      - targets: ["textfile-exporter:9100"]

  # Unauthenticated health: 200 only when Vault is initialised, unsealed and active.
  - job_name: vault_health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://vault:8200/v1/sys/health"]
    relabel_configs: &blackbox
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Liveness of the services without a metrics endpoint.
  - job_name: services
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://enroll:8443/healthz"]
        labels: {service: enroll}
      # /ready, not /ping: oauth2-proxy (v7.15.5) answers /ready only after
      # a PING to its session store (the sessions service) succeeds, so a
      # store that is up but refusing the proxy shows here at once.
      - targets: ["http://forward-auth:4180/ready"]
        labels: {service: forward-auth}
      - targets: ["http://forward-auth-ext:4180/ready"]
        labels: {service: forward-auth-ext}
      - targets: ["http://hub:8888/healthz"]
        labels: {service: hub}
      - targets: ["http://lldap:17170/"]
        labels: {service: lldap}
    relabel_configs: *blackbox

  - job_name: services_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["postgres:5432"]
        labels: {service: postgres}
      - targets: ["lldap:3890"]
        labels: {service: lldap-ldap}
    relabel_configs: *blackbox

  # The public (ACME) certificate as browsers see it: TLS to auth.<domain>:443.
  - job_name: tls
    metrics_path: /probe
    params:
      module: [tls_cert]
    file_sd_configs:
      - files: [/etc/portcullis/tls-targets.json]
    relabel_configs: *blackbox
