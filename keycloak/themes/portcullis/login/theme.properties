# Portcullis login theme: keycloak.v2 plus webauthn-register.ftl and
# resources/js/webauthnRegister.js (direct attestation, the extension's
# registration hints, unique passkey labels). Selected by the realm (loginTheme).
# Branding: resources/img/favicon.ico overrides the parent's (template.ftl
# links ${url.resourcesPath}/img/favicon.ico) and css/portcullis.css puts
# img/portcullis-mark.svg above the login card; styles lists the parent's
# sheet first (Keycloak resolves css/styles.css through keycloak.v2).
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/portcullis.css
