# Values of the core chart. ./portcullis writes every one of them from .env
# into secrets/kube/values.yaml (kube_render_values; no secret ever: those
# are Secrets synced from secrets/ and .env). The keys marked required have
# no usable default: the chart refuses to render without them (`required`
# replaces compose's ${VAR:?}).

# Required: PORTCULLIS_DOMAIN.
domain: ""
# The cluster's networks (.env, detected at init and re-checked every run).
podCIDR: ""
serviceCIDR: ""
# The kube API (default/kubernetes EndpointSlice): ip:port, the only
# addresses the Hub and Traefik may reach on it.
apiEndpoints: []
# Fixed ClusterIPs in the service CIDR's static band (network + 20/21/22).
traefikServiceIP: ""
traefikVPNServiceIP: ""
wgEdgeServiceIP: ""
# The node addresses (InternalIP / ExternalIP): app egress excludes them,
# except 80/443 (the hairpin to auth.<domain>).
nodeAddresses: []

# Every image by digest only (name@sha256:...): images.yaml's third-party
# refs and the tag refs the CLI resolved (K1). Required per rendered service.
images: {}

# The containers' uids / gids (common.sh CT_*).
uids:
  traefik: 65532
  postgres: 70
  vault: 100
  vaultGroup: 1000
  lldap: 1000
  keycloak: 1000
  sessions: 999
  sessionsGroup: 1000
  oauth2proxy: 65532
  groupGate: 10003
  hub: 10001
  enroll: 10002
  domains: 10004
  mcpGate: 10005
  wg: 10006
  vpnDoc: 10007
  # The mail-provider group (CT_GID_MAIL_PROVIDER): the Hub's group_add as
  # on Docker; the mail slot itself is Docker / Podman only (§19.12).
  mailProvider: 2000
  nobody: 65534
  grafana: 472
  # nodeadm (contract §20.1; its own image, no compose service).
  nodeadm: 10010

# Compose profiles (COMPOSE_PROFILES): the same switches as on Docker.
monitoring:
  enabled: false
  prometheusRetention: 30d

wg:
  enabled: false
  builtin: "off"
  subnet: 10.213.0.0/22
  dnsUpstream: 1.1.1.1,9.9.9.9
  people:
    port: 51820
  # Contract §16 defaults.
  edge:
    maxPerProvider: 1024
    maxPerUser: 128
    maxPerClient: 32
    pressurePercent: 90
    pressureIdle: 2m

vpn:
  mode: apps
  publicEnrol: "true"
  # Ranges no VPN provider may claim on top of compose's fixed core subnets:
  # the pod and the service CIDR (K-P11).
  reservedPools: ""
  # compose's fixed core subnets, as WG_CORE_SUBNETS / GATE_CORE_SUBNETS
  # list them (network.sh vpn_reserved_ranges' fixed part).
  coreSubnets: "172.31.250.0/24 172.31.251.0/28 172.31.252.0/28 172.31.253.0/28 172.31.254.0/26 172.31.254.64/28"

# The six entrypoint classes (.env PORTCULLIS_EP_* / PORTCULLIS_WEB_*,
# written by ./portcullis vpn mode): comma-separated entrypoint lists.
entrypoints:
  ep:
    core: websecure,vpnsecure
    admin: websecure,vpnsecure
    enrol: websecure,vpnsecure
  web:
    core: websecure
    admin: websecure
    enrol: websecure

acme:
  email: ""
  caServer: https://acme-v02.api.letsencrypt.org/directory
  dnsProvider: cloudflare
  cfApiEmail: ""
  gceProject: ""

dns:
  caa: "true"
  caaIssuer: ""
  caaIodef: ""

keycloak:
  admin: admin

lldap:
  baseDN: dc=portcullis,dc=local

hub:
  bindRoots: ""
  invitesProtectedGroups: ""
  portalDisplayName: Portcullis
  clientCertTTL: 720h
  certExpiryWarnDays: "7"
  impersonationMaxMinutes: "30"
  # The Hub's own image by digest (= images.hub), the helper pods' image.
  selfImage: ""
  appsNamespace: portcullis-apps

alerting:
  smtpFrom: ""

# High availability (PORTCULLIS_HA=on → ha.enabled, written by
# kube_render_values; contract §20). The front door (templates/frontdoor.yaml)
# renders only with it. In HA: the gates and Keycloak are replicated with a
# PodDisruptionBudget and spread over the nodes, Alertmanager is 2 meshed
# replicas, every core pod tolerates a lost node for 30 s, the replicated
# volumes are <name>-r on portcullis-core-replicated, and Traefik is a
# DaemonSet on the ingress nodes in its own namespace (ingressNamespace).
ha:
  enabled: false
  # The non-small nodes at the primary site (kube_render_values counts
  # them from the nodes' labels; preflight P33: every pinned set is bounded
  # by main): Keycloak runs 3 replicas from 3 of them, else 2.
  nonSmallNodesAtPrimary: 0
  # The node mesh pcmesh (§20.11): the nodeagents answer on :7443 there.
  meshCIDR: 10.215.0.0/24
  nodeadmNamespace: portcullis-nodeadm
  # Longhorn's namespace (Task 24): nodeadm asks it to evict a node's
  # replicas on a cooperative removal.
  longhornNamespace: longhorn-system
  # group-gate and mcp-gate in HA (contract §20.10): StatefulSets of this
  # many replicas (1-16; a PDB from 2), each with its own log, served to
  # the Hub on :8091 / :8092 (wg's status on :8093); the Hub reads
  # HUB_GATE_REPLICAS = this. forward-auth and forward-auth-ext run as many
  # (no state of their own: the sessions are in Valkey).
  gateReplicas: 2
  # group-gate prunes its own opened log to this many days in HA
  # (GATE_OPENED_PRUNE_DAYS; the Hub's default history_days, contract §8.2).
  openedPruneDays: 365

# The measured memory peaks, MiB (user ruling 2026-11-19, plan Amendment 2):
# the higher of the test server's `docker stats` (spike-cluster.md, "H7")
# and the k3d cluster's `kubectl top` working set under load
# (spike-components.md, "Memory"). portcullis.memRequest makes the
# request peak × 1.25 rounded up to 16 Mi (never above the limit, which
# stays compose's mem_limit); a service with no measurement (the
# monitoring profile, the front door, nodeadm) requests its limit. Requests
# are what the scheduler and N−1 count: a node can then hold more than its
# limits add up to (the OOM risk the docs state).
memoryPeakMi:
  keycloak: 773
  hub: 96.9
  vault: 92
  traefik: 74
  postgres: 303
  group-gate: 47.3
  forward-auth: 18
  wg: 18.1
  enroll: 16.1
  mcp-gate: 10.7
  forward-auth-ext: 9.5
  sessions: 12
  lldap: 9.1
  domains: 8.8

# nodeadm (contract §20.2): node enrolment and the cluster API. The CLI
# enables it on a cluster init installed (it reads the k3s server token
# there), with its image by digest; probeEgressHost is the main domain's DNS
# provider API host (the probes' egress reference, §20.4; no credential).
nodeadm:
  enabled: false
  image: ""
  probeEgressHost: ""

# Content hashes of every synced ConfigMap / Secret (secrets/kube/applied.json):
# pods carry portcullis.io/config-hash over the ones they mount, so a
# change rolls them.
hashes: {}

# Nested host directories synced as one ConfigMap each, keys = the
# relative path with "/" → "__": the items that rebuild the tree.
configItems:
  keycloakTheme: []
  vault: []
  prometheus: []
  grafanaProvisioning: []
  grafanaDashboards: []
  textfile: []

# Only for kubeconform in CI: ./portcullis init applies the namespaces
# itself (labels, PSA, ownership, K11), never Helm.
renderNamespaces: false
installID: ""
appsNamespace: portcullis-apps
storageNamespace: portcullis-storage
# Traefik's only watched namespace: the core IngressRoutes and Middlewares,
# never a Secret (Traefik's CRD provider lists every Secret of each watched
# namespace, so the core and apps namespaces are never watched).
edgeNamespace: portcullis-edge
# NEW (HA): Traefik's own namespace (PSA privileged for hostPort 80/443;
# the admission policy portcullis-ingress-pods admits only its DaemonSet's
# pod shape there). Created by ./portcullis (kube_cluster_setup), like the
# others.
ingressNamespace: portcullis-ingress

# rt_run (K16): the one-shot to render (templates/oneshot.yaml), set by
# ./portcullis only with helm template --show-only.
oneshot: ""
