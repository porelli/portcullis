{{- /* lldap (compose: lldap). */ -}}
{{- $s := dict
  "name" "lldap" "uid" .Values.uids.lldap "gid" .Values.uids.lldap
  "memory" "256Mi" "nets" (list "portcullis") "egress" true
  "hashes" (list "portcullis-env")
  "health" (dict "test" (list "/app/lldap" "healthcheck" "--config-file" "/data/lldap_config.toml") "interval" 5 "timeout" 3 "retries" 5)
  "ports" (list (dict "name" "http" "port" 17170) (dict "name" "ldap" "port" 3890))
  "env" (list
    (dict "name" "LLDAP_JWT_SECRET" "valueFrom" (dict "secretKeyRef" (dict "name" "portcullis-env" "key" "LLDAP_JWT_SECRET")))
    (dict "name" "LLDAP_LDAP_USER_PASS" "valueFrom" (dict "secretKeyRef" (dict "name" "portcullis-env" "key" "LLDAP_ADMIN_PASSWORD")))
    (dict "name" "LLDAP_LDAP_BASE_DN" "value" .Values.lldap.baseDN)
    (dict "name" "LLDAP_LDAP_USER_DN" "value" "admin")
    (dict "name" "LLDAP_LDAP_USER_EMAIL" "value" "admin@portcullis.local")
    (dict "name" "LLDAP_HTTP_URL" "value" (printf "https://directory.%s" (include "portcullis.domain" .))))
  "mounts" (list
    (dict "name" "data" "mountPath" "/data")
    (dict "name" "tmp" "mountPath" "/tmp"))
  "volumes" (list
    (dict "name" "data" "persistentVolumeClaim" (dict "claimName" "lldap-data"))
    (dict "name" "tmp" "emptyDir" (dict "medium" "Memory")))
-}}
{{ include "portcullis.deployment" (dict "root" . "s" $s) }}
---
{{ include "portcullis.pvc" (list . "lldap-data" .Values.uids.lldap .Values.uids.lldap "0750") }}
---
apiVersion: v1
kind: Service
metadata:
  name: lldap
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    portcullis.io/component: lldap
  ports:
    - name: http
      port: 17170
      targetPort: 17170
    - name: ldap
      port: 3890
      targetPort: 3890
