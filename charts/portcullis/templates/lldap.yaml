{{- /* lldap (compose: lldap). On Kubernetes LLDAP runs on Postgres (plan
Task 23, D8: the HA shape on every install): the database lldap of the CNPG
Cluster portcullis-pg (LLDAP_DATABASE_URL from the CLI's Secret
portcullis-pg-lldap, never Helm), no lldap-data PVC (/data is an emptyDir:
only the entrypoint's copy of the config template lives there). The server
key (it protects the OPAQUE password files) is the CLI's Secret
secrets-lldap-key, the same on every replica (LLDAP_KEY_FILE, read-only;
LLDAP_KEY_SEED empty, or the template config's well-known seed would win;
a key that doesn't match the database makes LLDAP refuse to start). The
schema is made or upgraded by the Job lldap-schema-<image hash> alone
(plan Amendment 2: replicas racing on create_schema fail): it runs
`lldap create_schema`, then records the image in portcullis_lldap_schema;
every LLDAP pod waits for that row (init container wait-schema, psql with
PGPASSWORD from the Secret: nothing on argv) before it starts. In HA 2
replicas (a PDB, spread). */ -}}
{{- $img := include "portcullis.image" (list . "lldap") -}}
{{- $pgimg := include "portcullis.image" (list . "postgres") -}}
{{- $pgenv := list
  (dict "name" "PGHOST" "value" (include "portcullis.pgHost" .))
  (dict "name" "PGPORT" "value" "5432")
  (dict "name" "PGUSER" "value" "lldap")
  (dict "name" "PGDATABASE" "value" "lldap")
  (dict "name" "PGCONNECT_TIMEOUT" "value" "5")
  (dict "name" "PGPASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" "portcullis-pg-lldap" "key" "PGPASSWORD"))) -}}
{{- $sec := dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) -}}
{{- $small := dict "limits" (dict "memory" "64Mi") "requests" (dict "memory" "64Mi") -}}
{{- $wait := printf "i=0; until [ \"$(psql -XtAc \"select 1 from portcullis_lldap_schema where image = '%s'\" 2>/dev/null)\" = 1 ]; do i=$((i + 1)); [ \"$i\" -lt 450 ] || { echo \"LLDAP's schema Job hasn't recorded this image after 15 min\" >&2; exit 1; }; sleep 2; done" $img -}}
{{- $s := dict
  "name" "lldap" "uid" .Values.uids.lldap "gid" .Values.uids.lldap "pin" true "fsGroup" .Values.uids.lldap
  "memory" "256Mi" "nets" (list "portcullis") "egress" true
  "hashes" (list "portcullis-env" "secrets-lldap-key")
  "health" (dict "test" (list "/app/lldap" "healthcheck" "--config-file" "/data/lldap_config.toml") "interval" 5 "timeout" 3 "retries" 5)
  "ports" (list (dict "name" "http" "port" 17170) (dict "name" "ldap" "port" 3890))
  "env" (list
    (dict "name" "LLDAP_JWT_SECRET" "valueFrom" (dict "secretKeyRef" (dict "name" "portcullis-env" "key" "LLDAP_JWT_SECRET")))
    (dict "name" "LLDAP_LDAP_USER_PASS" "valueFrom" (dict "secretKeyRef" (dict "name" "portcullis-env" "key" "LLDAP_ADMIN_PASSWORD")))
    (dict "name" "LLDAP_LDAP_BASE_DN" "value" .Values.lldap.baseDN)
    (dict "name" "LLDAP_LDAP_USER_DN" "value" "admin")
    (dict "name" "LLDAP_LDAP_USER_EMAIL" "value" "admin@portcullis.local")
    (dict "name" "LLDAP_HTTP_URL" "value" (printf "https://directory.%s" (include "portcullis.domain" .)))
    (dict "name" "LLDAP_DATABASE_URL" "valueFrom" (dict "secretKeyRef" (dict "name" "portcullis-pg-lldap" "key" "LLDAP_DATABASE_URL")))
    (dict "name" "LLDAP_KEY_FILE" "value" "/run/lldap-key/server_key")
    (dict "name" "LLDAP_KEY_SEED" "value" ""))
  "mounts" (list
    (dict "name" "data" "mountPath" "/data")
    (dict "name" "tmp" "mountPath" "/tmp")
    (dict "name" "key" "mountPath" "/run/lldap-key" "readOnly" true))
  "volumes" (list
    (dict "name" "data" "emptyDir" (dict "medium" "Memory" "sizeLimit" "16Mi"))
    (dict "name" "tmp" "emptyDir" (dict "medium" "Memory"))
    (dict "name" "key" "secret" (dict "secretName" "secrets-lldap-key" "defaultMode" 288 "items" (list (dict "key" "server_key" "path" "server_key")))))
  "initContainers" (list (dict "name" "wait-schema" "image" $pgimg "imagePullPolicy" "IfNotPresent"
    "command" (list "sh" "-c" $wait) "env" $pgenv "resources" $small "securityContext" $sec))
-}}
{{- if .Values.ha.enabled }}{{ $_ := set $s "replicas" 2 }}{{ end }}
{{ include "portcullis.deployment" (dict "root" . "s" $s) }}
---
apiVersion: v1
kind: Service
metadata:
  name: lldap
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    portcullis.io/component: lldap
  ports:
    - name: http
      port: 17170
      targetPort: 17170
    - name: ldap
      port: 3890
      targetPort: 3890
---
# LLDAP's schema, made or upgraded once per LLDAP image (named after its
# inputs: a Job's pod template is immutable, so a change is a new Job; Helm
# removes the old one; no config-hash annotation for the same reason). Waits for Postgres,
# runs create_schema (cwd /tmp: it writes nothing there with the key file
# given), then records the image.
{{- $pin := include "portcullis.sitePin" (dict "root" . "s" (dict "pin" true)) | trim }}
apiVersion: batch/v1
kind: Job
metadata:
  name: lldap-schema-{{ printf "%s|%s|%s|%s|%v" $img $pgimg .Values.lldap.baseDN (include "portcullis.pgHost" .) .Values.ha.enabled | sha256sum | trunc 10 }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: portcullis
    portcullis.io/component: lldap-schema
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        portcullis.io/component: lldap-schema
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: portcullis-core
      {{- with $pin }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- if .Values.ha.enabled }}
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.uids.lldap }}
        runAsGroup: {{ .Values.uids.lldap }}
        fsGroup: {{ .Values.uids.lldap }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-postgres
          image: {{ $pgimg }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "i=0; until psql -XtAc 'select 1' >/dev/null 2>&1; do i=$((i + 1)); [ \"$i\" -lt 450 ] || { echo 'Postgres (database lldap) unreachable for 15 min' >&2; exit 1; }; sleep 2; done"]
          env: {{ toJson $pgenv }}
          resources: {{ toJson $small }}
          securityContext: {{ toJson $sec }}
        - name: create-schema
          image: {{ $img }}
          imagePullPolicy: IfNotPresent
          command: ["/app/lldap", "create_schema"]
          workingDir: /tmp
          env:
            - name: LLDAP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portcullis-pg-lldap
                  key: LLDAP_DATABASE_URL
            - name: LLDAP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: portcullis-env
                  key: LLDAP_JWT_SECRET
            - name: LLDAP_LDAP_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: portcullis-env
                  key: LLDAP_ADMIN_PASSWORD
            - name: LLDAP_LDAP_BASE_DN
              value: {{ .Values.lldap.baseDN | quote }}
            - name: LLDAP_KEY_FILE
              value: /run/lldap-key/server_key
            - name: LLDAP_KEY_SEED
              value: ""
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 256Mi
          securityContext: {{ toJson $sec }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: key
              mountPath: /run/lldap-key
              readOnly: true
      containers:
        - name: record
          image: {{ $pgimg }}
          imagePullPolicy: IfNotPresent
          command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-c", "create table if not exists portcullis_lldap_schema (image text primary key, at timestamptz not null default now())", "-c", {{ printf "insert into portcullis_lldap_schema (image) values ('%s') on conflict (image) do update set at = now()" $img | quote }}]
          env: {{ toJson $pgenv }}
          resources: {{ toJson $small }}
          securityContext: {{ toJson $sec }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        - name: key
          secret:
            secretName: secrets-lldap-key
            defaultMode: 288
            items:
              - key: server_key
                path: server_key
