{{- /* traefik-dynamic: the file-provider part the chart owns (K15, contract §5
"Names apps may use"): the core middlewares and services app routers name
as @file (an IngressRoute in the apps namespace can't reach this
namespace's objects), and the chart-only strip-forwarded of the kcinternal
router, and the core routers' backends core-<service>-<port> (the core
IngressRoutes live in the edge namespace, which holds no Service of
theirs). Projected next to the synced traefik/dynamic/*.yml. The core-only
Middlewares (portcullis-auth-console, portal paths, directory-redirect) are
CRDs of the edge namespace; hub-proxy-secret (it carries the secret) is applied by the CLI
from stdin, never rendered. */ -}}
{{- $ns := .Release.Namespace -}}
{{- $edge := .Values.edgeNamespace -}}
{{- $core := list (list "lldap" 17170) (list "keycloak" 8080) (list "forward-auth" 4180) (list "group-gate" 8080) (list "hub" 8888) (list "hub" 8889) (list "enroll" 8443) (list "mcp-gate" 8080) -}}
{{- if .Values.monitoring.enabled }}{{- $core = append $core (list "grafana" 3000) -}}{{- end -}}
{{- $d := include "portcullis.domain" . -}}
{{- $idh := "X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups,X-Auth-Request-Preferred-Username,X-Forwarded-User,X-Forwarded-Email,Authorization,X-Forwarded-Access-Token,X-Forwarded-Impersonator,X-Forwarded-Impersonation" | splitList "," -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-dynamic
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/managed-by: portcullis
data:
  kubernetes.yml: |
    # Rendered by charts/portcullis (traefik-file-middlewares.yaml): do not edit.
    http:
      middlewares:
        portcullis-auth:
          forwardAuth:
            address: http://forward-auth.{{ $ns }}.svc.cluster.local:4180
            trustForwardHeader: true
            authResponseHeaders: {{ toJson $idh }}
            authResponseHeadersRegex: ^X-Forwarded-Attr-
        portcullis-auth-ext:
          forwardAuth:
            address: http://forward-auth-ext.{{ $ns }}.svc.cluster.local:4180
            trustForwardHeader: true
            authResponseHeaders: {{ toJson $idh }}
            authResponseHeadersRegex: ^X-Forwarded-Attr-
        portcullis-groups:
          forwardAuth:
            address: http://group-gate.{{ $ns }}.svc.cluster.local:8080
            trustForwardHeader: true
            authResponseHeaders: {{ toJson $idh }}
            authResponseHeadersRegex: ^X-Forwarded-Attr-
        portcullis-groups-vpn:
          forwardAuth:
            address: http://group-gate.{{ $ns }}.svc.cluster.local:8080/auth/vpn
            trustForwardHeader: true
            authResponseHeaders: {{ toJson $idh }}
            authResponseHeadersRegex: ^X-Forwarded-Attr-
        portcullis-public-guard:
          forwardAuth:
            address: http://group-gate.{{ $ns }}.svc.cluster.local:8080/public-guard
            trustForwardHeader: true
            authResponseHeadersRegex: ^X-Forwarded-Attr-
        portcullis-public-guard-vpn:
          forwardAuth:
            address: http://group-gate.{{ $ns }}.svc.cluster.local:8080/public-guard/vpn
            trustForwardHeader: true
            authResponseHeadersRegex: ^X-Forwarded-Attr-
        vpn-required-path:
          replacePath:
            path: /vpn-required
        # kcinternal's router only: Keycloak hears no client address and no
        # client certificate from an internal client (chart-only, never on
        # the apps' @file list).
        strip-forwarded:
          headers:
            customRequestHeaders:
              X-Forwarded-For: ""
              X-Forwarded-Host: ""
              X-Forwarded-Proto: ""
              X-Forwarded-Port: ""
              X-Forwarded-Server: ""
              X-Forwarded-Prefix: ""
              X-Forwarded-Uri: ""
              X-Forwarded-Method: ""
              X-Forwarded-Ssl: ""
              X-Forwarded-Tls-Client-Cert: ""
              X-Forwarded-Tls-Client-Cert-Info: ""
              Forwarded: ""
              X-Real-Ip: ""
      services:
        group-gate:
          loadBalancer:
            servers:
              - url: http://group-gate.{{ $ns }}.svc.cluster.local:8080
        forward-auth-ext:
          loadBalancer:
            servers:
              - url: http://forward-auth-ext.{{ $ns }}.svc.cluster.local:4180
        mcp-gate:
          loadBalancer:
            servers:
              - url: http://mcp-gate.{{ $ns }}.svc.cluster.local:8080
        {{- range $c := $core }}
        core-{{ index $c 0 }}-{{ index $c 1 }}:
          loadBalancer:
            servers:
              - url: http://{{ index $c 0 }}.{{ $ns }}.svc.cluster.local:{{ index $c 1 }}
        {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portcullis-auth-console
  namespace: {{ $edge }}
spec:
  forwardAuth:
    address: http://forward-auth.{{ $ns }}.svc.cluster.local:4180
    trustForwardHeader: true
    authResponseHeaders: {{ toJson (without $idh "Authorization") }}
    authResponseHeadersRegex: ^X-Forwarded-Attr-
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portal-path
  namespace: {{ $edge }}
spec:
  replacePath:
    path: /portal
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portal-vpn-path
  namespace: {{ $edge }}
spec:
  replacePath:
    path: /portal/vpn
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: directory-redirect
  namespace: {{ $edge }}
spec:
  redirectRegex:
    regex: ^https?://[^/]+(/.*)?$
    replacement: https://people.{{ $d }}/
