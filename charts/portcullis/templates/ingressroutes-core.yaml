{{- /* Core routers (compose: every traefik.http.routers.* label of core),
one IngressRoute each, entrypoints from the six classes (entrypoints.ep /
entrypoints.web, written by ./portcullis vpn mode; `parked` = Traefik's
loopback), the -vpn twins on vpnsecure with group-gate's VPN paths.
Middleware names: CRDs of this namespace without a suffix, the file
provider's with @file (K15). k8s_parity.py compares these with compose. */ -}}
{{- $d := include "portcullis.domain" . -}}
{{- $ep := .Values.entrypoints -}}
{{- $h := printf "Host(`%s`)" $d -}}
{{- $sub := dict -}}
{{- range list "traefik" "hub" "directory" "metrics" "people" "mcp" "auth" "enroll" -}}{{- $_ := set $sub . (printf "Host(`%s.%s`)" . $d) -}}{{- end -}}
{{- $kcAdmin := printf "%s && (PathPrefix(`/admin`) || PathPrefix(`/realms/master`))" $sub.auth -}}
{{- $mcpPaths := "(Path(`/mcp`) || Path(`/.well-known/oauth-protected-resource/mcp`))" -}}
{{- $peopleChain := list "rate-limit@file" "client-cert-pem@file" "portcullis-auth@file" "portcullis-groups@file" "hub-proxy-secret" "security-headers@file" -}}
{{- $peopleChainVPN := list "rate-limit@file" "client-cert-pem@file" "portcullis-auth@file" "portcullis-groups-vpn@file" "hub-proxy-secret" "security-headers@file" -}}
{{- $routers := list
  (dict "name" "dashboard" "ep" $ep.web.admin "rule" $sub.traefik "mw" (list "client-headers@file" "portcullis-auth@file" "portcullis-groups@file" "security-headers@file") "svc" "api@internal" "resolver" true)
  (dict "name" "dashboard-vpn" "ep" "vpnsecure" "rule" $sub.traefik "mw" (list "client-headers@file" "portcullis-auth@file" "portcullis-groups-vpn@file" "security-headers@file") "svc" "api@internal")
  (dict "name" "lldap" "ep" $ep.ep.admin "rule" $sub.directory "mw" (list "directory-redirect" "security-headers@file") "svc" "lldap" "port" 17170)
  (dict "name" "keycloak" "ep" $ep.ep.enrol "rule" $sub.auth "prio" 1 "mw" (list "rate-limit-auth@file" "client-cert-pem@file" "security-headers@file") "svc" "keycloak" "port" 8080)
  (dict "name" "keycloak-resources" "ep" $ep.ep.enrol "rule" (printf "%s && PathPrefix(`/resources/`)" $sub.auth) "prio" 5 "mw" (list "rate-limit@file" "security-headers@file") "svc" "keycloak" "port" 8080)
  (dict "name" "keycloak-admin" "ep" $ep.web.admin "rule" $kcAdmin "prio" 10 "mw" (list "rate-limit-auth@file" "client-cert-pem@file" "portcullis-auth-console" "portcullis-groups@file" "security-headers@file") "svc" "keycloak" "port" 8080)
  (dict "name" "keycloak-admin-vpn" "ep" "vpnsecure" "rule" $kcAdmin "prio" 10 "mw" (list "rate-limit-auth@file" "client-cert-pem@file" "portcullis-auth-console" "portcullis-groups-vpn@file" "security-headers@file") "svc" "keycloak" "port" 8080)
  (dict "name" "oauth2-callback" "ep" $ep.ep.enrol "rule" (printf "%s && PathPrefix(`/oauth2`)" $sub.auth) "prio" 1000 "mw" list "svc" "forward-auth" "port" 4180)
  (dict "name" "portal" "ep" $ep.web.core "rule" $h "mw" (list "rate-limit@file" "client-headers@file" "portcullis-auth@file" "portal-path" "security-headers@file") "svc" "group-gate" "port" 8080)
  (dict "name" "portal-vpn" "ep" "vpnsecure" "rule" $h "mw" (list "rate-limit@file" "client-headers@file" "portcullis-auth@file" "portal-vpn-path" "security-headers@file") "svc" "group-gate" "port" 8080)
  (dict "name" "core-vpn-required" "ep" "websecure" "rule" (printf "%s || %s || %s || %s || %s || %s || %s" $h $sub.traefik $sub.hub $sub.directory $sub.metrics $sub.people $sub.mcp) "prio" 1 "mw" (list "rate-limit@file" "vpn-required-path@file" "security-headers@file") "svc" "group-gate" "port" 8080)
  (dict "name" "keycloak-admin-vpn-required" "ep" "websecure" "rule" $kcAdmin "prio" 9 "mw" (list "rate-limit-auth@file" "vpn-required-path@file" "security-headers@file") "svc" "group-gate" "port" 8080)
  (dict "name" "hub" "ep" $ep.web.admin "rule" $sub.hub "mw" (list "rate-limit@file" "client-headers@file" "portcullis-auth@file" "portcullis-groups@file" "hub-proxy-secret" "security-headers@file") "svc" "hub" "port" 8888)
  (dict "name" "hub-vpn" "ep" "vpnsecure" "rule" $sub.hub "mw" (list "rate-limit@file" "client-headers@file" "portcullis-auth@file" "portcullis-groups-vpn@file" "hub-proxy-secret" "security-headers@file") "svc" "hub" "port" 8888)
  (dict "name" "people" "ep" $ep.web.core "rule" $sub.people "mw" $peopleChain "svc" "hub" "port" 8889)
  (dict "name" "people-vpn" "ep" "vpnsecure" "rule" $sub.people "mw" $peopleChainVPN "svc" "hub" "port" 8889)
  (dict "name" "people-vpn-enrol" "ep" $ep.web.enrol "rule" (printf "%s && PathPrefix(`/vpn/`)" $sub.people) "prio" 190 "mw" $peopleChain "svc" "hub" "port" 8889)
  (dict "name" "people-vpn-enrol-vpn" "ep" "vpnsecure" "rule" (printf "%s && PathPrefix(`/vpn/`)" $sub.people) "prio" 190 "mw" $peopleChainVPN "svc" "hub" "port" 8889)
  (dict "name" "enroll-invite" "ep" $ep.ep.enrol "rule" (printf "%s && PathPrefix(`/invite/`)" $sub.enroll) "prio" 110 "mw" (list "rate-limit-auth@file" "client-headers@file" "security-headers@file") "svc" "enroll" "port" 8443)
  (dict "name" "mcp" "ep" $ep.ep.admin "rule" $sub.mcp "mw" (list "rate-limit@file" "security-headers@file") "svc" "mcp-gate" "port" 8080)
  (dict "name" "hub-mcp" "ep" $ep.ep.admin "rule" (printf "%s && %s" $sub.hub $mcpPaths) "prio" 200 "mw" (list "rate-limit@file" "security-headers@file") "svc" "mcp-gate" "port" 8080)
  (dict "name" "people-mcp" "ep" $ep.ep.admin "rule" (printf "%s && %s" $sub.people $mcpPaths) "prio" 200 "mw" (list "rate-limit@file" "security-headers@file") "svc" "mcp-gate" "port" 8080)
-}}
{{- if .Values.monitoring.enabled -}}
{{- $routers = append $routers (dict "name" "grafana-metrics" "ep" $ep.web.admin "rule" $sub.metrics "mw" (list "rate-limit@file" "client-headers@file" "portcullis-auth@file" "portcullis-groups@file" "security-headers@file") "svc" "grafana" "port" 3000) -}}
{{- $routers = append $routers (dict "name" "grafana-metrics-vpn" "ep" "vpnsecure" "rule" $sub.metrics "mw" (list "rate-limit@file" "client-headers@file" "portcullis-auth@file" "portcullis-groups-vpn@file" "security-headers@file") "svc" "grafana" "port" 3000) -}}
{{- end -}}
{{- range $r := $routers }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $r.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: portcullis
spec:
  entryPoints: {{ toJson (splitList "," $r.ep) }}
  routes:
    - match: {{ $r.rule | quote }}
      kind: Rule
      {{- with $r.prio }}
      priority: {{ . }}
      {{- end }}
      {{- with $r.mw }}
      middlewares:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      services:
        {{- if hasSuffix "@internal" $r.svc }}
        - name: {{ $r.svc }}
          kind: TraefikService
        {{- else }}
        - name: {{ $r.svc }}
          port: {{ $r.port }}
        {{- end }}
  tls:
    {{- if $r.resolver }}
    certResolver: letsencrypt
    domains:
      - main: {{ $d }}
        sans: [{{ printf "*.%s" $d | quote }}]
    {{- end }}
    options:
      name: authaware@file
{{- end }}
---
# kcinternal (K15): every path to Keycloak, the client's forwarded and
# certificate headers stripped. Admits only the five internal clients
# (netpol-networks.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kcinternal
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: portcullis
spec:
  entryPoints: ["kcinternal"]
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: strip-forwarded@file
      services:
        - name: keycloak
          port: 8080
