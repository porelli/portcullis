{{- /* Traefik's ServiceAccount (the k8s form of socket-proxy-traefik): one
read-only Role, in the edge namespace only. Traefik's CRD provider runs a
Secret informer (list / watch, no name or label scope RBAC can narrow) in
every namespace it watches, so it watches only the edge namespace, which
holds the core IngressRoutes and Middlewares and never a Secret: TLS comes
from the file provider. Nothing in the core namespace (portcullis-env, the
age / wg / vault Secrets) or the apps namespace (the instances' Secrets),
nothing cluster-scoped, no nodes (the Ingress / Gateway providers are off).
The provider's informers need every resource listed (Traefik 3.7 lists
ConfigMaps too): one it can't list keeps it from loading any route.
k8s_hardening.py checks every ServiceAccount's Secret access. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik
  namespace: {{ .Values.edgeNamespace }}
rules:
  - apiGroups: [""]
    resources: ["services", "secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "ingressroutetcps", "ingressrouteudps", "middlewares", "middlewaretcps", "serverstransports", "serverstransporttcps", "tlsoptions", "tlsstores", "traefikservices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik
  namespace: {{ .Values.edgeNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: {{ .Release.Namespace }}
