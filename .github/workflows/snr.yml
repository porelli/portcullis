name: SNR image

# ghcr.io/porelli/portcullis-snr: medik8s Self Node Remediation v0.13.0 with
# Portcullis' one patch (kube/ha/fencing/snr-patch: its Secret cache holds
# only its peers' certificate in its own namespace; plan Task 24 fix round
# 1). Built and pushed as `edge` and the fixed main-<sha7> on every push to
# main that touches the patch directory and on dispatch from main;
# dispatched from another branch it pushes only `dev-<branch>-<sha7>`.
# Every push is cosign-signed keyless; amd64 + arm64; provenance + SBOM.
# The image's labels record the upstream tag, commit and the patch's
# sha256 (the Dockerfile verifies both). kube/ha/fencing pins the digest.
on:
  push:
    branches: [main]
    paths:
      - 'kube/ha/fencing/snr-patch/**'
      - '.github/workflows/snr.yml'
  workflow_dispatch:

permissions: {}

# Never cancelled on main: a cancel between the push and `cosign sign`
# would leave an unsigned digest under edge / main-<sha7>.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing (GitHub OIDC)
    env:
      # The repository (not a pinned ref: this job builds it).
      SNR_REPO: ghcr.io/${{ github.repository_owner }}/portcullis-snr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # edge from main; dev-<branch>-<sha7> from any other ref (P2).
      - name: Tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF" = refs/heads/main ]; then
            # edge moves; main-<sha7> never does: kube/ha/fencing pins its
            # digest.
            tag=edge
            echo "fixed=main-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            branch=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-80)
            tag="dev-${branch}-${SHA:0:7}"
          fi
          case "$tag" in edge|dev-*) ;; *) echo "::error::unexpected tag $tag"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.SNR_REPO }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=${{ steps.tag.outputs.fixed }},enable=${{ steps.tag.outputs.fixed != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: kube/ha/fencing/snr-patch
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Sign the pushed manifest-list digest (covers every tag and platform).
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${SNR_REPO}@${DIGEST}"

      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
          FIXED: ${{ steps.tag.outputs.fixed }}
        run: echo "pushed ${SNR_REPO}:${TAG}${FIXED:+ and :${FIXED}}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
