name: CI

on:
  push:
    branches: [main]
    # Docs-only changes don't need the stack booted.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  # release.yml runs exactly these checks before publishing a tag (it
  # passes no `jobs`: the default `all`).
  workflow_call:
    inputs:
      jobs:
        description: Jobs to run (always all for a release)
        type: string
        default: all
  # Cross-repo feature branches (e.g. `instances`): run by hand with
  # `gh workflow run ci.yml --ref <branch>`; the Hub and the Keycloak image
  # are then built from the Hub's / portcullis-keycloak's same-named branch
  # (.github/actions/hub-image, .github/actions/keycloak-image).
  # `-f jobs=build-and-test,e2e-signin` (comma- or space-separated job
  # names) runs only those jobs; the default `all` runs every job; an
  # unknown name fails the run (job `jobs-input`). Push and pull_request
  # always run everything.
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run: all, or a comma/space-separated list of unit-tests build-and-test e2e e2e-instances e2e-signin e2e-settings e2e-folders e2e-filesharing e2e-ai e2e-podman"
        type: string
        default: all


# A newer push to the same ref supersedes the older run (runners are shared
# across the four repos). Release runs come in via workflow_call and get the
# caller's group, so they are never cancelled by a push to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

# Secrets are NOT set here: `./portcullis init --env-only` generates them
# into .env (exactly as on a real install) and the steps that need one read
# it from there.
env:
  PORTCULLIS_DOMAIN: portcullis.local
  # Every plain `docker compose` call (incl. the ones inside ./portcullis)
  # uses the core file + the CI override written below.
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
  VAULT_ADDR: http://127.0.0.1:8200
  TRAEFIK_IP: 172.31.250.2
  # Go toolchain for the enroll, domains and mcp-gate unit tests (same as their Dockerfiles' golang image).
  GO_VERSION: 1.27.3
  # The domains service's records point here in CI: no public-IP detection
  # on the runners (./portcullis up uses these instead).
  PORTCULLIS_PUBLIC_IPV4: 203.0.113.10
  PORTCULLIS_PUBLIC_IPV6: ""
  # docker/build-push-action: no build summary / build-record artifact in
  # its post step. Nothing reads them, and on 2026-11-11 (run 43092132806)
  # the artifact service answered HTML for each upload: 5 retries ≈ 10.5 min
  # per build, 30+ minutes after e2e-settings' tests had all passed.
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  # Pebble (ACME test CA) for the domains service test (also in the CI override).
  PEBBLE_IMG: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199

# Caches (images, Go, buildx layers, Playwright) are RESTORED by every run but
# SAVED only by pushes to main (trusted code; also not by release.yml's tag
# runs). PR runs could only write their own PR-scoped entries anyway, and
# everything restored is verified or content-addressed (see
# .github/actions/cached-images).

jobs:
  # First, and needed by every other job: a workflow_dispatch `jobs` input
  # naming a job that doesn't exist fails the run here (a typo would
  # otherwise skip every job and the run would show green with nothing
  # run). Empty and `all` run everything; push / pull_request /
  # workflow_call aren't checked (they always run everything). The known
  # names are read from this file's own `jobs:` keys, so the list can't
  # drift from the jobs.
  jobs-input:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: Check the jobs input
        if: github.event_name == 'workflow_dispatch'
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          case "$JOBS" in ''|all) echo "jobs: all"; exit 0 ;; esac
          known="$(yq -r '.jobs | keys | .[]' .github/workflows/ci.yml | grep -vx 'jobs-input' | paste -sd ' ' -)"
          [ -n "${known// }" ] || { echo "::error::could not read the job names from ci.yml"; exit 1; }
          # The jobs' `if`s split on commas and spaces only: anything else
          # (tabs, newlines) can't match a name either.
          [[ "$JOBS" != *$'\n'* ]] || { echo "::error::jobs: one line of names separated by commas and/or spaces"; exit 1; }
          IFS=', ' read -r -a names <<< "$JOBS"
          picked="" bad=""
          for n in "${names[@]}"; do
            [ -n "$n" ] || continue
            if [[ " $known " == *" $n "* ]]; then picked="$picked $n"; else bad="$bad $n"; fi
          done
          [ -z "$bad" ] || { echo "::error::jobs: unknown job name(s):$bad (known: $known; or \`all\` alone)"; exit 1; }
          [ -n "$picked" ] || { echo "::error::jobs: no job names given (known: $known; or \`all\` alone)"; exit 1; }
          echo "jobs:$picked"

  unit-tests:
    needs: jobs-input
    # Runs unless a workflow_dispatch named other jobs (input `jobs`: `all`, or
    # names separated by commas and/or spaces; exact names, so `e2e` is not `e2e-ai`).
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.jobs == '' || inputs.jobs == 'all'
      || contains(format(' ,{0}, ', inputs.jobs), ',unit-tests,') || contains(format(' ,{0}, ', inputs.jobs), ',unit-tests ') || contains(format(' ,{0}, ', inputs.jobs), ' unit-tests,') || contains(format(' ,{0}, ', inputs.jobs), ' unit-tests ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -S warning portcullis scripts/lib/*.sh tests/*.sh tests/e2e/*.sh vault/entrypoint.sh .github/automerge/*.sh
      - name: Dependabot auto-merge tests (fake gh + fixtures)
        run: bash .github/automerge/test.sh
      - name: realm export fits Keycloak's columns
        run: |
          # Most Keycloak columns are varchar(255) (an import with a longer
          # value aborts the first start); a flow description also gets
          # keycloak configure's " [sync <sha256>]" marker (72 chars).
          jq -e '([.. | strings | length] | max) <= 255 and ([.authenticationFlows[].description // "" | length] | max) <= 183' keycloak/realm-export.json >/dev/null \
            || { echo "FAIL: a realm-export.json value is too long for Keycloak"; exit 1; }
      - name: CLI help for every command
        run: |
          ./portcullis help
          # Every command listed by `portcullis help` must print its usage.
          ./portcullis help | sed -n 's/^  \([a-z][a-z -]*[a-z]\)  .*/\1/p' | while read -r cmd; do
            echo "::group::portcullis $cmd --help"
            # shellcheck disable=SC2086
            ./portcullis $cmd --help | tee /tmp/help.out
            head -n1 /tmp/help.out | grep -q "^Usage: portcullis $cmd" || { echo "FAIL: '$cmd --help' has no usage line"; exit 1; }
            echo "::endgroup::"
          done
      - name: CLI argument parsing tests
        run: bash tests/test_cli.sh
      - name: shell library tests (.env, proxy network, revocation sync, pki setup)
        run: bash tests/test_shell_libs.sh
      # group-gate's own pins (group-gate/requirements.txt, hashes), the same
      # files its image installs; pip's wheel cache saved on main only.
      - name: Restore the group-gate pip cache
        id: gg-pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: group-gate-pip-${{ runner.os }}-${{ hashFiles('group-gate/requirements.txt') }}
      - name: Install group-gate's dependencies (pinned, hashes)
        run: |
          python3 -m venv /tmp/gg-venv
          /tmp/gg-venv/bin/pip install --quiet --disable-pip-version-check \
            --require-hashes --only-binary=:all: -r group-gate/requirements.txt
      - name: Save the group-gate pip cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gg-pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.gg-pip-cache.outputs.cache-primary-key }}
      - name: group-gate unit tests
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/gg-venv/bin/python tests/test_group_gate.py
      # The Keycloak login theme's favicon and mark are byte copies of the
      # branding sources (sha256 pinned in the test).
      - name: branding copies
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/test_branding.py
      # tests/signin_vectors.json drives group-gate's rule evaluator; it must
      # be a byte copy of the Hub's internal/signin/testdata/vectors.json, on
      # the same-named Hub branch when it exists (cross-repo feature branches
      # land together), else main — like portcullis-keycloak's `vectors` job.
      - name: Shared sign-in vectors match the Hub
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          own=tests/signin_vectors.json
          url="https://github.com/porelli/portcullis-hub"
          # The Hub's heads, listed once: a failed listing (network, auth)
          # fails rather than comparing main. The same-named branch only as
          # exactly refs/heads/<REF> (ls-remote patterns also match
          # suffixes), else main; the files are fetched at the commit listed,
          # so a push in between can't change what is compared.
          heads=$(git ls-remote --heads "$url") || { echo "::error::git ls-remote $url failed"; exit 1; }
          ref=main
          if [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] && [ "$REF" != main ] \
            && awk -v r="refs/heads/$REF" '$2 == r { f = 1 } END { exit !f }' <<<"$heads"; then
            ref="$REF"
          fi
          sha=$(awk -v r="refs/heads/$ref" '$2 == r { print $1 }' <<<"$heads")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::portcullis-hub has no single commit for refs/heads/$ref"; exit 1; }
          echo "portcullis-hub: $ref ($sha)" | tee -a "$GITHUB_STEP_SUMMARY"
          hub="$RUNNER_TEMP/hub_vectors.json"
          code=$(curl -sS -o "$hub" -w '%{http_code}' "https://raw.githubusercontent.com/porelli/portcullis-hub/$sha/internal/signin/testdata/vectors.json")
          [ "$code" = 200 ] || { echo "::error::fetching the Hub's vectors from $ref ($sha): HTTP $code"; exit 1; }
          if ! cmp "$own" "$hub"; then
            echo "::error::$own differs from portcullis-hub $ref ($sha) internal/signin/testdata/vectors.json: copy it byte for byte"
            exit 1
          fi
          echo "vectors match portcullis-hub $ref ($sha)" | tee -a "$GITHUB_STEP_SUMMARY"
      # e2e_filesharing's run_op (busy-409 retry, scrubbing) on a fake Hub:
      # stdlib only, no stack.
      - name: e2e helper unit tests (e2e_fsops)
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/gg-venv/bin/python tests/test_e2e_fsops.py
      - name: compose files are valid with a generated .env
        run: |
          ./portcullis init --env-only --runtime docker --non-interactive --domain ci.example.org --dns-provider none
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.podman-selinux.yml --profile '*' config -q
          # Healthchecks that behave the same on Podman (its compat API
          # re-splits CMD arguments on whitespace).
          tests/lint_healthchecks.sh .env
          # The podman overlay: restart: always (what podman-restart.service
          # starts at boot) on exactly the core services that have a restart
          # policy, nothing else; Docker keeps unless-stopped.
          docker compose -f docker-compose.yml -f docker-compose.podman.yml --profile '*' config -q
          WANT_RS="$(docker compose -f docker-compose.yml --profile '*' config --format json | jq -c '[.services | to_entries[] | select(.value.restart != null) | .key] | sort')"
          GOT_RS="$(yq -o=json '.services' docker-compose.podman.yml | jq -c '[to_entries[] | select(.value == {"restart": "always"}) | .key] | sort')"
          ALL_RS="$(yq -o=json '.services' docker-compose.podman.yml | jq -c 'keys | sort')"
          [ "$WANT_RS" = "$GOT_RS" ] && [ "$GOT_RS" = "$ALL_RS" ] \
            || { echo "FAIL: docker-compose.podman.yml must set only restart: always on every core service with a restart policy (want $WANT_RS, got $GOT_RS / $ALL_RS)"; exit 1; }
          docker compose -f docker-compose.yml --profile '*' config --format json | jq -e '[.services[] | select(.restart != null) | .restart] | unique == ["unless-stopped"]' >/dev/null \
            || { echo "FAIL: Docker's restart policy is unless-stopped everywhere"; exit 1; }
          docker compose -f docker-compose.yml --profile monitoring config -q
          docker compose -f docker-compose.yml --profile '*' config -q
          docker compose -f docker-compose.yml -f docker-compose.apps.yml config -q
          docker compose -f docker-compose.test.yml config -q
          docker compose -f docker-compose.yml config --format json \
            | jq -e '.services.hub.environment.HUB_PROXY_SECRET | test("^[0-9a-f]{64}$")' >/dev/null \
            || { echo "FAIL: hub has no generated HUB_PROXY_SECRET"; exit 1; }
          if HUB_PROXY_SECRET='' docker compose -f docker-compose.yml config -q 2>/dev/null; then
            echo "FAIL: compose accepted an empty HUB_PROXY_SECRET"; exit 1
          fi
          for v in FORWARD_AUTH_REDIS_PASSWORD FORWARD_AUTH_EXT_REDIS_PASSWORD; do
            if env "$v=" docker compose -f docker-compose.yml config -q 2>/dev/null; then
              echo "FAIL: compose accepted an empty $v"; exit 1
            fi
          done
          if grep -rn 'portcullis-forward-auth-secret' docker-compose*.yml keycloak/ .env.example; then
            echo "FAIL: public default forward-auth secret is back"; exit 1
          fi
          CFG="$(docker compose -f docker-compose.yml config --format json)"
          # Every profile (monitoring, ...): same pin + hardening rules.
          CFG_ALL="$(docker compose -f docker-compose.yml --profile '*' config --format json)"
          # Contract §6: only the socket proxies mount the engine socket —
          # rootful Docker's, or the operator's rootless Podman socket
          # (PORTCULLIS_ENGINE_SOCKET) — read-only at /var/run/docker.sock;
          # the Hub gets the runtime as HUB_CONTAINER_RUNTIME.
          socket_rule() {  # <config json> <runtime>
            printf '%s' "$1" | jq -e --arg rt "$2" '(env.PORTCULLIS_ENGINE_SOCKET // "/var/run/docker.sock") as $src
                | ([.services | to_entries[] | select([.value.volumes[]?.source] | index($src)) | .key] | sort == ["socket-proxy-hub", "socket-proxy-traefik"])
                and ([.services["socket-proxy-traefik", "socket-proxy-hub"].volumes[] | select(.source == $src) | "\(.target):\(.read_only)"] == ["/var/run/docker.sock:true", "/var/run/docker.sock:true"])
                and ([.services[].volumes[]? | select(.source == "/var/run/docker.sock" or .target == "/var/run/docker.sock")] | length == 2)
                and .services.hub.environment.HUB_CONTAINER_RUNTIME == $rt' >/dev/null
          }
          socket_rule "$CFG" docker || { echo "FAIL: the engine socket (docker): only the two proxies, read-only; HUB_CONTAINER_RUNTIME=docker"; exit 1; }
          export PODMAN_SOCK=/run/user/1001/podman/podman.sock
          CFG_PODMAN="$(CONTAINER_RUNTIME=podman PORTCULLIS_ENGINE_SOCKET="$PODMAN_SOCK" docker compose -f docker-compose.yml config --format json)"
          PORTCULLIS_ENGINE_SOCKET="$PODMAN_SOCK" socket_rule "$CFG_PODMAN" podman \
            || { echo "FAIL: the engine socket (podman): only the two proxies mount $PODMAN_SOCK read-only; HUB_CONTAINER_RUNTIME=podman"; exit 1; }
          # No default runtime (P0): compose refuses an empty CONTAINER_RUNTIME.
          if CONTAINER_RUNTIME='' docker compose -f docker-compose.yml config -q 2>/dev/null; then
            echo "FAIL: compose accepted an empty CONTAINER_RUNTIME"; exit 1
          fi
          # Core stays userspace (VPN cross-reference): no NET_ADMIN / SYS_ADMIN.
          CAPS="$(echo "$CFG_ALL" | jq -r '.services | to_entries[] | select((.value.cap_add // []) | any(. == "NET_ADMIN" or . == "SYS_ADMIN")) | .key')"
          [ -z "$CAPS" ] || { echo "FAIL: core services with NET_ADMIN / SYS_ADMIN: $CAPS"; exit 1; }
          # The rootless Podman SELinux overlay (P10 + the controller's
          # narrowing): every project bind (source inside the checkout)
          # re-declared with the base's target / read_only and a label — Z
          # when one service mounts the path, z only when several services
          # mount it or a path above / below it (or templates/ / appfiles/,
          # which the Hub's app instances mount) —; never a label on the
          # checkout, secrets/, backups/ or .env (or a parent of them): the
          # Hub's `.:/project` becomes a tmpfs with group-gate's map bound in;
          # nothing outside the checkout relabelled (never the engine socket);
          # no service the base lacks; label=disable on the two proxies only
          # (compose services; the CLI's short-lived helpers — ct_run, restic —
          # run label=disable under Podman instead of relabelling host files)
          # (each keeping no-new-privileges); the base itself relabels nothing.
          OV_ALL="$(docker compose -f docker-compose.yml -f docker-compose.podman-selinux.yml --profile '*' config --format json)"
          binds() {  # <config json> — "service target read_only selinux" of every project bind
            printf '%s' "$1" | jq -r --arg p "$PWD" '.services | to_entries[] | .key as $s | (.value.volumes // [])[]
                | select(.type == "bind" and (.source == $p or (.source | startswith($p + "/"))))
                | "\($s) \(.target) \(.read_only // false) \(.bind.selinux // "-")"' | sort
          }
          [ -z "$(binds "$CFG_ALL" | awk '$4 != "-"')" ] || { echo "FAIL: docker-compose.yml relabels a bind (selinux): only the overlay may"; exit 1; }
          NBINDS="$(binds "$CFG_ALL" | wc -l | tr -d ' ')"
          [ "$NBINDS" = 45 ] || { echo "FAIL: expected 45 project binds in docker-compose.yml, got $NBINDS: update docker-compose.podman-selinux.yml (and this count)"; exit 1; }
          diff <({ binds "$CFG_ALL" | grep -vx 'hub /project true -' | awk '{print $1, $2, $3}'; echo "hub /project/group-gate/group-gate-map.conf true"; } | sort) \
               <(binds "$OV_ALL" | awk '{print $1, $2, $3}' | sort) \
            || { echo "FAIL: docker-compose.podman-selinux.yml must re-declare every project bind (but the Hub's /project root) with the same target / read_only, plus the Hub's map file"; exit 1; }
          echo "$OV_ALL" | jq -e '[.services.hub.volumes[] | select(.target == "/project") | .type] == ["tmpfs"]' >/dev/null \
            || { echo "FAIL: the overlay must turn the Hub's /project root into a tmpfs (never relabel the checkout)"; exit 1; }
          BADLABEL="$(echo "$OV_ALL" | jq -r --arg p "$PWD" '
              def inside($a; $b): $a == $b or ($a | startswith($b + "/"));
              [.services | to_entries[] | .key as $s | (.value.volumes // [])[] | select(.type == "bind") | {s: $s, src: .source, lab: (.bind.selinux // null)}] as $all
              | ($all | map(select(.lab != null))) as $lab
              | ($lab[] | select(inside(.src; $p) | not) | "\(.s) \(.src): a label outside the checkout"),
                ($lab[] | select(.src as $x | ([$p, $p + "/secrets", $p + "/backups", $p + "/.env"] | any(inside(.; $x)))) | "\(.s) \(.src): never label the checkout, secrets/, backups/ or .env (or a parent)"),
                ($lab[] | . as $b
                  | ([$all[] | select(.s != $b.s and (inside(.src; $b.src) or inside($b.src; .src)))] | length > 0
                     or inside($b.src; $p + "/templates") or inside($b.src; $p + "/appfiles")) as $shared
                  | select(($shared and .lab != "z") or (($shared | not) and .lab != "Z"))
                  | "\(.s) \(.src): \(.lab), want \(if $shared then "z (shared)" else "Z (one service)" end)"),
                ([.services[].volumes[]? | select(.target == "/var/run/docker.sock") | .bind.selinux // empty][] | "the engine socket is relabelled")')"
          [ -z "$BADLABEL" ] || { echo "FAIL: SELinux labels in docker-compose.podman-selinux.yml:"; echo "$BADLABEL"; exit 1; }
          EXTRA="$(comm -23 <(yq -r '.services | keys | .[]' docker-compose.podman-selinux.yml | sort) <(docker compose -f docker-compose.yml --profile '*' config --services | sort))"
          [ -z "$EXTRA" ] || { echo "FAIL: docker-compose.podman-selinux.yml names services docker-compose.yml lacks: $EXTRA"; exit 1; }
          if ! echo "$OV_ALL" | jq -e '([.services | to_entries[] | select((.value.security_opt // []) | index("label=disable")) | .key] | sort == ["socket-proxy-hub", "socket-proxy-traefik"])
                 and ([.services["socket-proxy-traefik", "socket-proxy-hub"].security_opt | index("no-new-privileges:true")] | all(. != null))' >/dev/null \
             || ! echo "$CFG_ALL" | jq -e '[.services[].security_opt[]? | select(startswith("label"))] == []' >/dev/null; then
            echo "FAIL: label=disable must be on exactly the two socket proxies, only in the overlay, next to no-new-privileges"; exit 1
          fi
          # The hardening baseline holds with the overlay merged too.
          WEAK="$(echo "$OV_ALL" | jq -r '.services | to_entries[]
              | select((.value.security_opt // [] | index("no-new-privileges:true") | not) or ((.value.cap_drop // []) != ["ALL"])
                       or (.value.mem_limit == null) or (.value.pids_limit == null)) | .key')"
          [ -z "$WEAK" ] || { echo "FAIL: with the SELinux overlay, services without no-new-privileges/cap_drop ALL/limits: $WEAK"; exit 1; }
          echo "$CFG" | jq -e '.services.traefik.environment.TRAEFIK_PROVIDERS_DOCKER_ENDPOINT == "tcp://socket-proxy-traefik:2375"
              and .services.hub.environment.DOCKER_HOST == "tcp://socket-proxy-hub:2375"
              and .services["socket-proxy-traefik"].environment.POST == "0"
              and ([.services.traefik.networks | keys[]] | index("socket-proxy-traefik"))
              and ([.services.hub.networks | keys[]] | index("socket-proxy-hub"))
              and ([.services | to_entries[] | select((.value.networks // {}) | has("socket-proxy-hub")) | .key] | sort == ["hub", "socket-proxy-hub"])
              and ([.services | to_entries[] | select((.value.networks // {}) | has("socket-proxy-traefik")) | .key] | sort == ["socket-proxy-traefik", "traefik"])' >/dev/null \
            || { echo "FAIL: socket proxy wiring"; exit 1; }
          # Contract §5: Traefik injects the generated secret on the Hub router.
          echo "$CFG" | jq -e '.services.hub.labels as $l
              | ($l["traefik.http.routers.hub.middlewares"] | test("hub-proxy-secret@docker"))
              and $l["traefik.http.middlewares.hub-proxy-secret.headers.customrequestheaders.X-Portcullis-Proxy-Secret"] == .services.hub.environment.HUB_PROXY_SECRET
              and (.services.hub.image | test("^ghcr.io/porelli/portcullis-hub:"))
              and ([.services.hub.environment | keys[] | select(test("LLDAP") and test("PASS|SECRET|TOKEN|KEY"))] == [])
              and ([.services.hub.volumes[] | select(.target == "/run/portcullis/lldap" or .target == "/run/portcullis/invite") | .read_only] == [true, true])' >/dev/null \
            || { echo "FAIL: hub proxy-secret middleware / image / LLDAP + invite credentials only as read-only files"; exit 1; }
          # Contract §1 / §8.1: Keycloak is Portcullis's image (KEYCLOAK_IMAGE,
          # edge on main) and reads the Hub's signin-keycloak.json read-only.
          echo "$CFG" | jq -e '(.services.keycloak.image | test("^ghcr.io/porelli/portcullis-keycloak:"))
              and ([.services.keycloak.volumes[] | select(.type == "volume") | "\(.source):\(.target):\(.read_only // false)"] == ["hub_data:/hub-data:true"])
              and ([.services | to_entries[] | select([.value.volumes[]? | select(.type == "volume" and .source == "hub_data")] | length > 0) | .key] | sort
                   == ["group-gate", "hub", "keycloak", "mcp-gate"])' >/dev/null \
            || { echo "FAIL: keycloak image (ghcr.io/porelli/portcullis-keycloak) / hub_data:/hub-data:ro"; exit 1; }
          # Hardening baseline on every core service (all profiles).
          WEAK="$(echo "$CFG_ALL" | jq -r '.services | to_entries[]
              | select((.value.security_opt // [] | index("no-new-privileges:true") | not) or ((.value.cap_drop // []) != ["ALL"])
                       or (.value.mem_limit == null) or (.value.pids_limit == null)) | .key')"
          [ -z "$WEAK" ] || { echo "FAIL: services without no-new-privileges/cap_drop ALL/limits: $WEAK"; exit 1; }
          # Keycloak trusts proxy headers only from Traefik's address on portcullis-auth.
          echo "$CFG" | jq -e '(.services.keycloak.command | index("--proxy-trusted-addresses=172.31.251.2"))
              and .services.traefik.networks["portcullis-auth"].ipv4_address == "172.31.251.2"
              and ([.services | to_entries[] | select((.value.networks // {}) | has("portcullis-auth")) | .key] | sort == ["keycloak", "traefik"])' >/dev/null \
            || { echo "FAIL: portcullis-auth / proxy-trusted-addresses wiring"; exit 1; }
          # Monitoring profile: internal network, nothing published, Grafana
          # behind forward-auth + group-gate, header auth only from Traefik.
          echo "$CFG_ALL" | jq -e --arg ip 172.31.250.2 '.networks.monitoring.internal == true
              and ([.services | to_entries[] | select((.value.profiles // []) | index("monitoring")) | select(.value.ports != null) | .key] == [])
              and ([.services.traefik.ports[].target] | sort == [80, 443])
              and (.services.traefik.environment.TRAEFIK_ENTRYPOINTS_METRICS_ADDRESS == ":8082")
              and (.services.keycloak.command | index("--metrics-enabled=true"))
              and (.services.grafana.labels["traefik.http.routers.grafana-metrics.middlewares"] | test("portcullis-auth@docker,portcullis-groups@docker"))
              and .services.grafana.environment.GF_AUTH_PROXY_WHITELIST == $ip
              and .services.grafana.environment.GF_AUTH_PROXY_HEADER_PROPERTY == "username"
              and .services.grafana.environment.GF_AUTH_BASIC_ENABLED == "false"' >/dev/null \
            || { echo "FAIL: monitoring profile wiring"; exit 1; }
          grep -qx 'metrics=lldap_admin' group-gate/group-gate-map.conf || { echo "FAIL: metrics is not lldap_admin in the group-gate map"; exit 1; }
          # Contract §5 / §5.1: attribute headers, people.<domain>, directory redirect.
          grep -qx 'people=\*' group-gate/group-gate-map.conf || { echo "FAIL: people is not * (any signed-in user) in the group-gate map"; exit 1; }
          echo "$CFG" | jq -e --arg d "${PORTCULLIS_DOMAIN:-ci.example.org}" '.services["group-gate"].labels as $g | .services["forward-auth"].labels as $f | .services.hub.labels as $h
              | ([$g["traefik.http.middlewares.portcullis-groups.forwardauth.authResponseHeadersRegex"],
                  $g["traefik.http.middlewares.portcullis-public-guard.forwardauth.authResponseHeadersRegex"],
                  $f["traefik.http.middlewares.portcullis-auth.forwardauth.authResponseHeadersRegex"],
                  $f["traefik.http.middlewares.portcullis-auth-console.forwardauth.authResponseHeadersRegex"],
                  .services["forward-auth-ext"].labels["traefik.http.middlewares.portcullis-auth-ext.forwardauth.authResponseHeadersRegex"]] | all(. == "^X-Forwarded-Attr-"))
              and .services.hub.environment.HUB_PEOPLE_ADDR == ":8889"
              and $h["traefik.http.routers.people.rule"] == "Host(`people.\($d)`)"
              and $h["traefik.http.routers.people.tls.options"] == "authaware@file"
              and $h["traefik.http.routers.people.middlewares"] == "rate-limit@file,client-cert-pem@file,portcullis-auth@docker,portcullis-groups@docker,hub-proxy-secret@docker,security-headers@file"
              and $h["traefik.http.services.\($h["traefik.http.routers.people.service"]).loadbalancer.server.port"] == "8889"
              and $h["traefik.http.services.\($h["traefik.http.routers.hub.service"]).loadbalancer.server.port"] == "8888"
              and .services.lldap.labels["traefik.http.middlewares.directory-redirect.redirectregex.replacement"] == "https://people.\($d)/"
              and .services["forward-auth"].environment.OAUTH2_PROXY_COOKIE_REFRESH == "1m"
              and (.services["forward-auth"].environment.OAUTH2_PROXY_COOKIE_EXPIRE // null) == null' >/dev/null \
            || { echo "FAIL: attribute-header regex / people router / directory redirect / forward-auth cookie refresh wiring"; exit 1; }
          # Every HTTPS router names its Host: Traefik cannot pick TLS options
          # (authaware / protected / public) for a host-less rule and answers
          # 421 on it (that broke /oauth2/start on app hosts).
          HOSTLESS="$(for files in "docker-compose.yml" "docker-compose.yml -f docker-compose.apps.yml" "docker-compose.test.yml"; do
              # shellcheck disable=SC2086
              docker compose -f $files --profile '*' config --format json \
                | jq -r '.services[].labels // {} | to_entries[] | select(.key | test("^traefik\\.http\\.routers\\.[^.]+\\.rule$")) | select(.value | test("Host\\(") | not) | "\(.key)=\(.value)"'
            done)"
          [ -z "$HOSTLESS" ] || { echo "FAIL: routers without Host(): $HOSTLESS"; exit 1; }
          # group-gate needs the username header from portcullis-auth and must
          # pass it on; both forward-auth middlewares strip client copies.
          echo "$CFG" | jq -e '[.services["forward-auth"].labels["traefik.http.middlewares.portcullis-auth.forwardauth.authResponseHeaders"],
                 .services["group-gate"].labels["traefik.http.middlewares.portcullis-groups.forwardauth.authResponseHeaders"]]
              | all(split(",") | index("X-Auth-Request-Preferred-Username") and index("X-Forwarded-User") and index("X-Auth-Request-User"))' >/dev/null \
            || { echo "FAIL: identity headers missing from a forward-auth authResponseHeaders"; exit 1; }
          # Sign-in part 3 (contract §5, §8): group-gate's impersonation headers are
          # listed on all four forward-auth middlewares (Traefik deletes client
          # copies), Keycloak's own impersonation is off, and the impersonation
          # file / portal URL / max minutes reach their readers.
          echo "$CFG" | jq -e --arg d "${PORTCULLIS_DOMAIN:-ci.example.org}" '
              def hdrs($svc; $mw): .services[$svc].labels["traefik.http.middlewares.\($mw).forwardauth.authResponseHeaders"] | split(",");
              ([hdrs("forward-auth"; "portcullis-auth"), hdrs("forward-auth"; "portcullis-auth-console"),
                hdrs("forward-auth-ext"; "portcullis-auth-ext"), hdrs("group-gate"; "portcullis-groups")]
               | all(index("X-Forwarded-Impersonator") and index("X-Forwarded-Impersonation")))
              and (.services.keycloak.command | index("--features-disabled=impersonation"))
              and ([.services.keycloak.command[] | select(test("^--features(-enabled)?=.*impersonation"))] == [])
              and ((.services.keycloak.environment // {}) | keys | map(select(test("^KC_FEATURES"))) == [])
              and .services.keycloak.environment.PORTCULLIS_PORTAL_URL == "https://\($d)/"
              and .services["group-gate"].environment.GATE_IMPERSONATION_FILE == "/hub-data/impersonation.json"
              and .services.hub.environment.HUB_IMPERSONATION_MAX_MINUTES == "30"' >/dev/null \
            || { echo "FAIL: impersonation wiring (the four middlewares' headers, --features-disabled=impersonation, PORTCULLIS_PORTAL_URL, GATE_IMPERSONATION_FILE, HUB_IMPERSONATION_MAX_MINUTES)"; exit 1; }
          # Expired memberships: group-gate must be able to withhold the token
          # headers, so portcullis-groups lists them (Traefik deletes unreturned ones).
          echo "$CFG" | jq -e '.services["group-gate"].labels["traefik.http.middlewares.portcullis-groups.forwardauth.authResponseHeaders"]
              | split(",") | index("Authorization") and index("X-Forwarded-Access-Token")' >/dev/null \
            || { echo "FAIL: portcullis-groups does not list Authorization / X-Forwarded-Access-Token"; exit 1; }
          # Token headers (contract §4 "How group-gate decides" reads amr from
          # X-Forwarded-Access-Token only): every forwardAuth in front of
          # group-gate lists it, so Traefik deletes a client's copy and only
          # oauth2-proxy's reaches group-gate. portcullis-auth and -ext also
          # strip Authorization; portcullis-auth-console deliberately keeps the
          # client's Authorization (the Keycloak console's own bearer) but
          # strips the access token.
          echo "$CFG" | jq -e '
              def hdrs($svc; $mw): .services[$svc].labels["traefik.http.middlewares.\($mw).forwardauth.authResponseHeaders"] | split(",");
              (hdrs("forward-auth"; "portcullis-auth") | index("X-Forwarded-Access-Token") and index("Authorization"))
              and (hdrs("forward-auth-ext"; "portcullis-auth-ext") | index("X-Forwarded-Access-Token") and index("Authorization"))
              and (hdrs("forward-auth"; "portcullis-auth-console") | index("X-Forwarded-Access-Token") and (index("Authorization") | not))' >/dev/null \
            || { echo "FAIL: a forward-auth middleware lets a client's X-Forwarded-Access-Token / Authorization through"; exit 1; }
          # Contract §5 "Extra-domain hosts": forward-auth-ext = forward-auth
          # with a relative callback and a host-only __Host-portcullis_ext cookie;
          # portcullis-auth-ext strips exactly what portcullis-auth strips.
          echo "$CFG" | jq -e '.services["forward-auth"] as $m | .services["forward-auth-ext"] as $x
              | ($m.labels | with_entries(select(.key | startswith("traefik.http.middlewares.portcullis-auth.forwardauth.")) | .key |= sub("portcullis-auth"; "portcullis-auth-ext")) | del(.["traefik.http.middlewares.portcullis-auth-ext.forwardauth.address"])) as $want
              | $x.image == $m.image and $x.command == $m.command and $x.read_only == true
              and $x.labels["traefik.http.middlewares.portcullis-auth-ext.forwardauth.address"] == "http://forward-auth-ext:4180"
              and ($want | to_entries | all(. as $e | $x.labels[$e.key] == $e.value))
              and ([$x.labels | keys[] | select(test("^traefik\\.http\\.routers\\."))] == [])
              and $x.environment.OAUTH2_PROXY_REDIRECT_URL == "/oauth2/callback"
              and $x.environment.OAUTH2_PROXY_COOKIE_NAME == "__Host-portcullis_ext"
              and $x.environment.OAUTH2_PROXY_COOKIE_SECURE == "true" and $x.environment.OAUTH2_PROXY_COOKIE_PATH == "/"
              and ($x.environment.OAUTH2_PROXY_COOKIE_DOMAINS // null) == null
              and ($x.environment.OAUTH2_PROXY_WHITELIST_DOMAINS // null) == null
              and $x.environment.OAUTH2_PROXY_COOKIE_SECRET == $m.environment.OAUTH2_PROXY_COOKIE_SECRET
              and $x.environment.FORWARD_AUTH_CLIENT_SECRET == $m.environment.FORWARD_AUTH_CLIENT_SECRET
              and $x.environment.OAUTH2_PROXY_TRUSTED_PROXY_IPS == $m.environment.OAUTH2_PROXY_TRUSTED_PROXY_IPS
              and $x.environment.OAUTH2_PROXY_COOKIE_REFRESH == "1m"
              and ($x.environment.OAUTH2_PROXY_COOKIE_EXPIRE // null) == null' >/dev/null \
            || { echo "FAIL: forward-auth-ext / portcullis-auth-ext wiring (contract §5)"; exit 1; }
          grep -qE '^\s+code_challenge_method: S256$' oauth2-proxy/alpha.yaml || { echo "FAIL: oauth2-proxy (both services) must send PKCE S256"; exit 1; }
          if grep -nE '^\s*userIDClaim:' oauth2-proxy/alpha.yaml; then echo "FAIL: userIDClaim is an alias of emailClaim in oauth2-proxy v7"; exit 1; fi
          # Contract §12.1 / §12.4: the domains service. portcullis-domains =
          # {domains, hub}, portcullis-certs = {domains, traefik}, both internal;
          # domains is never routed, reads its secrets as read-only files, and
          # Traefik polls it over mTLS with paths only (no key material in env).
          echo "$CFG" | jq -e '.services.domains as $d | .services.traefik as $t | .services.hub as $h
              | .networks["portcullis-domains"].internal == true and .networks["portcullis-certs"].internal == true
              and ([.services | to_entries[] | select((.value.networks // {}) | has("portcullis-domains")) | .key] | sort == ["domains", "hub"])
              and ([.services | to_entries[] | select((.value.networks // {}) | has("portcullis-certs")) | .key] | sort == ["domains", "traefik"])
              and ([$d.networks | keys[]] | sort == ["domains-egress", "portcullis-certs", "portcullis-domains"])
              and ([.services | to_entries[] | select((.value.networks // {}) | has("domains-egress")) | .key] == ["domains"])
              and ([$d.labels // {} | keys[] | select(startswith("traefik."))] == [])
              and $d.read_only == true and $d.user == "10004:10004" and $d.group_add == ["10001"]
              and ([$d.volumes[] | select(.type == "bind") | .read_only] | all)
              and ([$d.volumes[] | select(.type == "bind") | .target] | sort == ["/run/portcullis/domains/age.key", "/run/portcullis/domains/api-secret",
                    "/run/portcullis/domains/certs-endpoint/ca.crt", "/run/portcullis/domains/certs-endpoint/server.crt", "/run/portcullis/domains/certs-endpoint/server.key"])
              and ([$d.volumes[] | select(.type == "volume") | .source] == ["domains_data"])
              and ([.services | to_entries[] | select([.value.volumes[]? | select(.type == "volume") | .source] | index("domains_data")) | .key] == ["domains"])
              and ([$d.environment | keys[] | select(test("TOKEN|SECRET|KEY|PASSWORD"))] == [])
              and ($d.environment.DOMAINS_API_SUBNET | length > 0)
              and $d.environment.DOMAINS_API_SUBNET == .networks["portcullis-domains"].ipam.config[0].subnet
              and $t.environment.TRAEFIK_PROVIDERS_HTTP_ENDPOINT == "https://domains:8443/traefik/dynamic"
              and $t.environment.TRAEFIK_PROVIDERS_HTTP_POLLINTERVAL == "10s" and $t.environment.TRAEFIK_PROVIDERS_HTTP_POLLTIMEOUT == "5s"
              and $t.environment.TRAEFIK_PROVIDERS_HTTP_MAXRESPONSEBODYSIZE == "4194304"
              and ([$t.environment | keys[] | select(test("RESPONDINGTIMEOUTS"))] == [])
              and ([$t.environment.TRAEFIK_PROVIDERS_HTTP_TLS_CA, $t.environment.TRAEFIK_PROVIDERS_HTTP_TLS_CERT, $t.environment.TRAEFIK_PROVIDERS_HTTP_TLS_KEY] | all(startswith("/run/portcullis/domains-endpoint/")))
              and ([$t.environment | keys[] | select(startswith("TRAEFIK_PROVIDERS_HTTP_HEADERS"))] == [])
              and ([$t.volumes[] | select(.target | startswith("/run/portcullis/domains-endpoint/")) | .read_only] == [true, true, true])
              and ([$t.volumes[] | select(.source | test("certs-endpoint/(ca|server)\\.key$"))] == [])
              and $h.environment.HUB_DOMAINS_API_URL == "http://domains:8080"
              and $h.environment.HUB_DOMAINS_SECRET_FILE == "/run/portcullis/domains/api-secret"
              and ([$h.volumes[] | select(.target == "/run/portcullis/domains/api-secret") | .read_only] == [true])
              and ([.services | to_entries[] | select([.value.volumes[]? | .source // "" | select(test("secrets/domains/age\\.key$"))] | length > 0) | .key] == ["domains"])' >/dev/null \
            || { echo "FAIL: domains service wiring (contract §12.1 / §12.4)"; exit 1; }
          # Contract §12.1: the one-shot dns tool (profile tools) — the domains
          # image on domains-egress only, read-only, no volumes, no environment
          # or env file (credentials reach it on stdin only).
          echo "$CFG_ALL" | jq -e '.services["dns-tool"] as $t
              | $t.image == "portcullis-domains" and $t.profiles == ["tools"]
              and ([$t.networks | keys[]] == ["domains-egress"])
              and (($t.volumes // []) == []) and ($t.environment == null) and ($t.env_file == null)
              and $t.read_only == true and $t.user == "10004:10004"
              and $t.entrypoint == ["domains", "dns"] and ($t.ports // []) == []
              and $t.healthcheck.disable == true
              and ([$t.labels // {} | keys[] | select(startswith("traefik."))] == [])
              and ([.services | to_entries[] | select((.value.networks // {}) | has("domains-egress")) | .key] | sort == ["dns-tool", "domains"])' >/dev/null \
            || { echo "FAIL: dns-tool wiring (contract §12.1: egress only, no volumes / env, credentials on stdin)"; exit 1; }
          # Contract §15 / §5 / §6: mcp-gate. Networks exactly portcullis +
          # portcullis-proxy at the pinned address; group 10001 only (G74);
          # hub_data read-only; mcp_gate_data written by the gate only and
          # read-only in the Hub; age.key only in the gate; the three MCP
          # routers have no forward-auth / groups / proxy secret, hub-mcp /
          # people-mcp outrank hub / people and share their TLS options (G44);
          # no router targets the Hub's :8890 (G36, every compose file).
          echo "$CFG" | jq -e --arg d "${PORTCULLIS_DOMAIN:-ci.example.org}" '.services["mcp-gate"] as $g | .services.hub as $h | $g.labels as $l | $h.labels as $hl
              | def prio($r; $labels): ($labels["traefik.http.routers.\($r).priority"] // ($labels["traefik.http.routers.\($r).rule"] | length) | tonumber);
                def mounts($src): [.services | to_entries[] | select([.value.volumes[]? | .source // "" | select(test($src))] | length > 0) | .key] | sort;
              ([$g.networks | keys[]] | sort == ["portcullis-mcp", "portcullis-proxy"])
              and $g.networks["portcullis-proxy"].ipv4_address == "172.31.250.3"
              and .networks["portcullis-mcp"].name == "portcullis-mcp" and .networks["portcullis-mcp"].internal == true
              and .networks["portcullis-mcp"].ipam.config[0].subnet == "172.31.253.0/28"
              and ([.services | to_entries[] | select((.value.networks // {}) | has("portcullis-mcp")) | .key] | sort == ["hub", "keycloak", "mcp-gate"])
              and .networks["portcullis-mcp"].ipam.config[0].ip_range == "172.31.253.8/29"
              and .services.keycloak.networks["portcullis-mcp"].ipv4_address == "172.31.253.2"
              and .services.hub.networks["portcullis-mcp"].ipv4_address == "172.31.253.3"
              and ($g.networks["portcullis-mcp"].ipv4_address // null) == null
              and ($g.extra_hosts | sort) == ["hub=172.31.253.3", "keycloak=172.31.253.2"]
              and ([.services | to_entries[] | select(.value.networks["portcullis-proxy"].ipv4_address? != null) | "\(.key)=\(.value.networks["portcullis-proxy"].ipv4_address)"] | sort == ["mcp-gate=172.31.250.3", "traefik=172.31.250.2"])
              and $g.user == "10005:10005" and $g.group_add == ["10001"] and $g.read_only == true
              and ($g.tmpfs // [] | index("/tmp")) != null and ($g.ports // []) == []
              and (($g.environment | to_entries | map(select(.key | test("SECRET|KEY|PASSWORD|TOKEN"))) | all(.value | startswith("/run/portcullis/mcp-gate/"))))
              and $g.environment.MCP_GATE_HUB_URL == "http://hub:8890"
              and $g.environment.MCP_GATE_JWKS_URL == "http://keycloak:8080/realms/portcullis/protocol/openid-connect/certs"
              and ([$g.volumes[] | select(.type == "volume") | "\(.source):\(.target):\(.read_only // false)"] | sort == ["hub_data:/hub-data:true", "mcp_gate_data:/data:false"])
              and ([$g.volumes[] | select(.type == "bind") | "\(.target):\(.read_only // false)"] | sort == ["/run/portcullis/mcp-gate/age.key:true", "/run/portcullis/mcp-gate/hub-secret:true"])
              and (mounts("secrets/mcp-gate/age\\.key$") == ["mcp-gate"])
              and (mounts("secrets/mcp-gate/age\\.pub$") == ["hub"])
              and (mounts("secrets/mcp-gate/hub-secret$") == ["hub", "mcp-gate"])
              and ([.services | to_entries[] | select([.value.volumes[]? | select(.type == "volume" and .source == "mcp_gate_data")] | length > 0) | .key] | sort == ["hub", "mcp-gate"])
              and ([$h.volumes[] | select(.source == "mcp_gate_data") | "\(.target):\(.read_only // false)"] == ["/mcp-gate-data:true"])
              and ([$h.volumes[] | select(.target | startswith("/run/portcullis/mcp-gate/")) | "\(.target):\(.read_only // false)"] | sort == ["/run/portcullis/mcp-gate/age.pub:true", "/run/portcullis/mcp-gate/hub-secret:true"])
              and $h.environment.HUB_MCP_ADDR == ":8890" and $h.environment.HUB_MCP_GATE_DATA_DIR == "/mcp-gate-data"
              and $h.environment.HUB_MCP_GATE_SECRET_FILE == "/run/portcullis/mcp-gate/hub-secret"
              and $h.environment.HUB_MCP_GATE_RECIPIENT_FILE == "/run/portcullis/mcp-gate/age.pub"
              and $l["traefik.enable"] == "true" and $l["traefik.docker.network"] == "portcullis-proxy"
              and $l["traefik.http.services.mcp-gate.loadbalancer.server.port"] == "8080"
              and ([$l | keys[] | capture("^traefik\\.http\\.routers\\.(?<r>[^.]+)\\.rule$").r] | sort == ["hub-mcp", "mcp", "people-mcp"])
              and $l["traefik.http.routers.mcp.rule"] == "Host(`mcp.\($d)`)"
              and $l["traefik.http.routers.hub-mcp.rule"] == "Host(`hub.\($d)`) && (Path(`/mcp`) || Path(`/.well-known/oauth-protected-resource/mcp`))"
              and $l["traefik.http.routers.people-mcp.rule"] == "Host(`people.\($d)`) && (Path(`/mcp`) || Path(`/.well-known/oauth-protected-resource/mcp`))"
              and (["mcp", "hub-mcp", "people-mcp"] | all(. as $r
                    | $l["traefik.http.routers.\($r).middlewares"] == "rate-limit@file,security-headers@file"
                    and $l["traefik.http.routers.\($r).service"] == "mcp-gate"
                    and $l["traefik.http.routers.\($r).entrypoints"] == "websecure"))
              and ([$l | to_entries[] | select(.key | test("\\.middlewares$")) | .value | select(test("portcullis-auth|portcullis-groups|proxy-secret"))] == [])
              and $l["traefik.http.routers.mcp.tls.options"] == "authaware@file"
              and $l["traefik.http.routers.hub-mcp.tls.options"] == $hl["traefik.http.routers.hub.tls.options"]
              and $l["traefik.http.routers.people-mcp.tls.options"] == $hl["traefik.http.routers.people.tls.options"]
              and prio("hub-mcp"; $l) > prio("hub"; $hl) and prio("people-mcp"; $l) > prio("people"; $hl)' >/dev/null \
            || { echo "FAIL: mcp-gate wiring (contract §15 / §5, G36 G44 G74)"; exit 1; }
          # Session store (scripts/lib/sessions.sh; oauth2-proxy #3486): Valkey
          # pinned, hardened, read-only, non-root, no ports / env / routers,
          # memory-only on a tmpfs /data; its config only in it, read-only;
          # portcullis-sessions internal with exactly sessions + the two
          # oauth2-proxies (like portcullis-mcp's members); each proxy its own
          # store user and generated password (never shared with any other
          # service), waits for the store healthy; the cookie name / domain
          # unchanged.
          echo "$CFG" | jq -e '.services.sessions as $s | .services["forward-auth"] as $m | .services["forward-auth-ext"] as $x
              | def members($n): [.services | to_entries[] | select((.value.networks // {}) | has($n)) | .key] | sort;
              def mounts($src): [.services | to_entries[] | select([.value.volumes[]? | .source // "" | select(test($src))] | length > 0) | .key] | sort;
              ($s.image | test("^docker.io/valkey/valkey:[0-9]+\\.[0-9]+\\.[0-9]+(-alpine[0-9.]*)?@sha256:[0-9a-f]{64}$"))
              and $s.user == "999:1000" and $s.read_only == true
              and $s.cap_drop == ["ALL"] and ($s.security_opt | index("no-new-privileges:true")) != null
              and $s.mem_limit != null and $s.pids_limit != null
              and ($s.tmpfs // [] | index("/data")) != null
              and ($s.ports // []) == [] and ($s.expose // []) == []
              and ($s.environment // {}) == {}
              and ([$s.labels // {} | keys[] | select(startswith("traefik."))] == [])
              and $s.command == ["valkey-server", "/etc/valkey/valkey.conf"]
              and ([$s.volumes[] | "\(.type):\(.source | sub("^.*/secrets/"; "secrets/")):\(.target):\(.read_only // false)"]
                   == ["bind:secrets/sessions/valkey.conf:/etc/valkey/valkey.conf:true"])
              and (mounts("secrets/sessions/") == ["sessions"])
              and ($s.healthcheck.test | join(" ") | test("NOAUTH"))
              and ([$s.networks | keys[]] == ["portcullis-sessions"])
              and .networks["portcullis-sessions"].internal == true
              and (members("portcullis-sessions") == ["forward-auth", "forward-auth-ext", "sessions"])
              and ([$m.networks | keys[]] | sort == ["portcullis", "portcullis-sessions"])
              and ([$x.networks | keys[]] | sort == ["portcullis", "portcullis-sessions"])
              and ([$m, $x] | all(.depends_on.sessions.condition == "service_healthy"
                   and .environment.OAUTH2_PROXY_SESSION_STORE_TYPE == "redis"
                   and .environment.OAUTH2_PROXY_REDIS_CONNECTION_URL == "redis://sessions:6379"
                   and (.environment.OAUTH2_PROXY_REDIS_PASSWORD | test("^[A-Za-z0-9]{40}$"))))
              and $m.environment.OAUTH2_PROXY_REDIS_USERNAME == "forward-auth"
              and $x.environment.OAUTH2_PROXY_REDIS_USERNAME == "forward-auth-ext"
              and $m.environment.OAUTH2_PROXY_REDIS_PASSWORD != $x.environment.OAUTH2_PROXY_REDIS_PASSWORD
              and ($m.environment.OAUTH2_PROXY_COOKIE_NAME // null) == null
              and $m.environment.OAUTH2_PROXY_COOKIE_DOMAINS == ".\($m.environment.PORTCULLIS_DOMAIN)"
              and ([.services | to_entries[] | select(.key != "forward-auth" and .key != "forward-auth-ext") | .value.environment // {} | to_entries[]
                   | select(.value == $m.environment.OAUTH2_PROXY_REDIS_PASSWORD or .value == $x.environment.OAUTH2_PROXY_REDIS_PASSWORD)] == [])' >/dev/null \
            || { echo "FAIL: session store wiring (sessions, portcullis-sessions, the oauth2-proxies' redis settings)"; exit 1; }
          # Contract §4 "Opened log" / §8.2 (sign-in part 2): group_gate_data is
          # mounted by exactly group-gate (rw at /data, uid 10003 + group 10001
          # only) and the Hub (rw at /group-gate-data, to prune day files);
          # group-gate reads both CA files read-only and both CAs' CRL lists;
          # no enroll / enroll-self router and no self-service middleware —
          # enroll-invite is the only router on enroll.<domain>.
          echo "$CFG" | jq -e --arg d "${PORTCULLIS_DOMAIN:-ci.example.org}" '.services["group-gate"] as $g | .services.hub as $h
              | ([.services | to_entries[] | select([.value.volumes[]? | select(.type == "volume" and .source == "group_gate_data")] | length > 0) | .key] | sort == ["group-gate", "hub"])
              and ([$g.volumes[] | select(.source == "group_gate_data") | "\(.target):\(.read_only // false)"] == ["/data:false"])
              and ([$h.volumes[] | select(.source == "group_gate_data") | "\(.target):\(.read_only // false)"] == ["/group-gate-data:false"])
              and $g.user == "10003:10003" and $g.group_add == ["10001"]
              and $g.environment.GATE_OPENED_DIR == "/data/opened" and $h.environment.HUB_GROUP_GATE_DATA_DIR == "/group-gate-data"
              and $g.environment.GATE_YUBIKEY_CA_FILE == "/etc/group-gate/ca/yubikey-ca.crt"
              and $g.environment.GATE_BROWSER_CA_FILE == "/etc/group-gate/ca/browser-ca.crt"
              and ([$g.volumes[] | select(.target | startswith("/etc/group-gate/ca/")) | "\(.source | sub("^.*/certs/"; "certs/")):\(.target):\(.read_only // false)"] | sort
                   == ["certs/browser-ca.crt:/etc/group-gate/ca/browser-ca.crt:true", "certs/yubikey-ca.crt:/etc/group-gate/ca/yubikey-ca.crt:true"])
              and $g.environment.GATE_CRL_URLS == "http://vault:8200/v1/pki_int/crl http://vault:8200/v1/pki_file/crl"
              and $g.environment.GATE_DELTA_CRL_URLS == "http://vault:8200/v1/pki_int/crl/delta http://vault:8200/v1/pki_file/crl/delta"
              and ($g.environment | has("GATE_CRL_URL") or has("GATE_DELTA_CRL_URL") | not)
              and $h.environment.HUB_CLIENT_CERT_TTL == "720h" and $h.environment.HUB_CERT_EXPIRY_WARN_DAYS == "7"
              and .services.keycloak.environment.PORTCULLIS_SIGNIN_URL == "https://people.\($d)/signin"
              and ([.services[].labels // {} | keys[] | select(test("^traefik\\.http\\.middlewares\\.[^.]*-self\\."))] == [])
              and ([.services[].labels // {} | to_entries[] | select(.key | test("^traefik\\.http\\.routers\\.[^.]+\\.rule$")) | select(.value | test("enroll\\.")) | .key]
                   == ["traefik.http.routers.enroll-invite.rule"])
              and .services.enroll.labels["traefik.http.routers.enroll-invite.rule"] == "Host(`enroll.\($d)`) && PathPrefix(`/invite/`)"' >/dev/null \
            || { echo "FAIL: group_gate_data / group-gate CA files + CRL lists / Hub sign-in env / enroll.<domain> routers (contract §4, §5, §8.2)"; exit 1; }
          grep -qx 'mcp=\*' group-gate/group-gate-map.conf || { echo "FAIL: mcp is not * in the group-gate map (core host, contract §4)"; exit 1; }
          PORT8890="$(for files in "docker-compose.yml" "docker-compose.yml -f docker-compose.apps.yml" "docker-compose.test.yml"; do
              # shellcheck disable=SC2086
              docker compose -f $files --profile '*' config --format json \
                | jq -r '.services[].labels // {} | to_entries[] | select(.key | test("^traefik\\.http\\.services\\.[^.]+\\.loadbalancer\\.server\\.port$")) | select(.value == "8890") | .key'
            done)"
          [ -z "$PORT8890" ] || { echo "FAIL: a Traefik service targets the Hub's MCP listener :8890: $PORT8890"; exit 1; }
          # ... nor does the file provider (a server URL, a port, hub:8890).
          if grep -rnE '(^|[^0-9])8890([^0-9]|$)' traefik/dynamic/; then
            echo "FAIL: traefik/dynamic references the Hub's MCP listener :8890"; exit 1
          fi
          # Every core service name is in the CLI's DNS-shadowing guard (network.sh).
          diff <(bash -c 'source scripts/lib/common.sh; source scripts/lib/network.sh; printf "%s\n" $CORE_SERVICE_NAMES' | sort) \
               <(docker compose -f docker-compose.yml --profile '*' config --services | sort) \
            || { echo "FAIL: CORE_SERVICE_NAMES (scripts/lib/network.sh) differs from docker-compose.yml's services"; exit 1; }
          diff <(bash -c 'source scripts/lib/common.sh; source scripts/lib/network.sh; printf "%s\n" $CORE_PROXY_SERVICES' | sort) \
               <(docker compose -f docker-compose.yml --profile '*' config --format json | jq -r '.services | to_entries[] | select((.value.networks // {}) | has("portcullis-proxy")) | .key' | sort) \
            || { echo "FAIL: CORE_PROXY_SERVICES (scripts/lib/network.sh) differs from the core services on portcullis-proxy"; exit 1; }
          # oauth2-proxy never accepts bearer tokens on browser routes (contract §5).
          if grep -nE '^\s*skipJwtBearerTokens:\s*true' oauth2-proxy/alpha.yaml \
             || grep -rniE 'skip[-_]jwt[-_]bearer[-_]tokens' docker-compose*.yml oauth2-proxy/; then
            echo "FAIL: oauth2-proxy must not accept JWT bearer tokens"; exit 1
          fi
          echo "PASS: socket proxies, hub proxy secret, hardening, auth network, monitoring wiring, domains service, mcp-gate, session store"

      - name: every image is pinned tag@sha256 (all compose files, all profiles, CLI, workflows)
        run: |
          # The env file from the previous step makes every compose file render.
          bad=0
          for files in "docker-compose.yml" "docker-compose.yml -f docker-compose.apps.yml" "docker-compose.test.yml"; do
            # shellcheck disable=SC2086
            docker compose -f $files --profile '*' config --format json \
              | jq -r '.services | to_entries[] | select(.value.build == null) | "\(.key)\t\(.value.image // "")"'
          done | sort -u > /tmp/images
          while IFS=$'\t' read -r svc img; do
            # The Hub and Keycloak come from HUB_IMAGE / KEYCLOAK_IMAGE (edge on
            # main; release.yml requires a pinned release of each).
            case "$svc" in hub|keycloak) continue ;; esac
            # dns-tool runs the locally built domains image (no build of its own).
            [ "$svc:$img" != dns-tool:portcullis-domains ] || continue
            [[ "$img" =~ ^[^@[:space:]]+:[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]] || { echo "UNPINNED: $svc → $img"; bad=1; }
          done < /tmp/images
          for df in enroll/Dockerfile group-gate/Dockerfile domains/Dockerfile mcp-gate/Dockerfile; do
            if grep -E '^FROM ' "$df" | grep -v '@sha256:'; then echo "UNPINNED base image in $df"; bad=1; fi
          done
          # One Go builder (tag and digest) for every locally built Go service.
          if [ "$(grep -hE '^FROM docker.io/library/golang:' enroll/Dockerfile domains/Dockerfile mcp-gate/Dockerfile | awk '{print $2}' | sort -u | wc -l | tr -d ' ')" != 1 ]; then
            echo "The Go Dockerfiles pin different golang builders:"; grep -nE '^FROM docker.io/library/golang:' enroll/Dockerfile domains/Dockerfile mcp-gate/Dockerfile; bad=1
          fi
          # Fully qualified registry names (docker.io/library/…, docker.io/<org>/…):
          # podman build / pull never depend on registries.conf short-name
          # resolution (rootless Podman). Local images (portcullis-*) and the
          # HUB_IMAGE / KEYCLOAK_IMAGE defaults are exempt.
          UNQ="$(tests/lint_images.sh)" || true
          [ -z "$UNQ" ] || { echo "UNQUALIFIED image names (use docker.io/library/… or <registry>/…):"; echo "$UNQ"; bad=1; }
          # group-gate's Python deps: exact pins with hashes, installed with --require-hashes.
          grep -q -- '--require-hashes' group-gate/Dockerfile || { echo "group-gate/Dockerfile installs without --require-hashes"; bad=1; }
          if grep -vE '^\s*(#|$|--hash=sha256:[0-9a-f]{64})' group-gate/requirements.txt | grep -vE '^[A-Za-z0-9._-]+==[^ ]+( ;.*)? \\$'; then
            echo "group-gate/requirements.txt: not an exact pin with hashes"; bad=1
          fi
          # Images the CLI runs itself (PORTCULLIS_HELPER_IMAGE, BACKUP_RESTIC_IMAGE, ...).
          if grep -nE '^[A-Z_]+_IMAGE="' scripts/lib/*.sh | grep -v '@sha256:[0-9a-f]\{64\}"'; then echo "UNPINNED image constant in scripts/lib"; bad=1; fi
          # Inline compose snippets and docker run images in the workflows.
          if grep -nE '^\s+image: ' .github/workflows/*.yml | grep -v '@sha256:'; then echo "UNPINNED image in a workflow"; bad=1; fi
          if grep -nE '(ALPINE|_IMG|IMAGE): [a-z]' .github/workflows/*.yml | grep -v '@sha256:'; then echo "UNPINNED image variable in a workflow"; bad=1; fi
          # The CI-only app templates (job e2e-instances).
          if grep -nE '^\s+image: ' tests/e2e/apps/*/compose.yml | grep -v '@sha256:'; then echo "UNPINNED image in a CI template"; bad=1; fi
          # Actions by full commit SHA.
          if grep -nE '^\s+(- )?uses: ' .github/workflows/*.yml .github/actions/*/action.yml | grep -vE 'uses: (\./|[^@]+@[0-9a-f]{40} # v[0-9]+\.[0-9]+\.[0-9]+$)'; then echo "Action not pinned by commit SHA (# vX.Y.Z)"; bad=1; fi
          [ "$bad" = 0 ] || exit 1
          echo "PASS: $(wc -l < /tmp/images) compose images, CLI images and actions are pinned"

      - name: List the monitoring tool images
        run: |
          docker compose -f docker-compose.yml --profile '*' config --format json \
            | jq -r '.services | .prometheus.image, .alertmanager.image, .blackbox.image' > "$RUNNER_TEMP/unit-images.txt"
      - name: Load the monitoring tool images (cached, verified)
        uses: ./.github/actions/cached-images
        with:
          images: ${{ runner.temp }}/unit-images.txt
          name: unit
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: monitoring config (promtool, amtool, blackbox, dashboard)
        run: |
          CFG_ALL="$(docker compose -f docker-compose.yml --profile '*' config --format json)"
          PROM="$(echo "$CFG_ALL" | jq -r .services.prometheus.image)"
          AM="$(echo "$CFG_ALL" | jq -r .services.alertmanager.image)"
          BB="$(echo "$CFG_ALL" | jq -r .services.blackbox.image)"
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" --entrypoint promtool "$PROM" \
            check config --syntax-only /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/monitoring/prometheus:/p:ro" --entrypoint promtool "$PROM" check rules /p/alerts.yml
          docker run --rm -v "$PWD/monitoring/prometheus:/p:ro" -w /p/tests --entrypoint promtool "$PROM" test rules alerts_test.yml
          docker run --rm -v "$PWD/monitoring/blackbox/blackbox.yml:/c.yml:ro" "$BB" --config.file=/c.yml --config.check
          mkdir -p /tmp/am
          for vars in "X=1" "ALERT_WEBHOOK_URL=https://hooks.example/x" "ALERT_NTFY_URL=https://ntfy.sh/topic" \
                      "ALERT_SMTP_SMARTHOST=smtp.example:587 ALERT_SMTP_TO=ops@example ALERT_SMTP_USERNAME=u ALERT_SMTP_PASSWORD=p"; do
            # shellcheck disable=SC2086
            env $vars bash -c 'source scripts/lib/common.sh; source scripts/lib/monitoring.sh; alertmanager_config' > /tmp/am/alertmanager.yml
            docker run --rm -v /tmp/am:/c:ro --entrypoint amtool "$AM" check-config /c/alertmanager.yml
          done
          jq -e '.uid == "portcullis" and (.panels | length) > 0' monitoring/grafana/dashboards/portcullis.json >/dev/null
          echo "PASS: prometheus config + rules (+ rule tests), alertmanager receivers, blackbox modules, dashboard"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Module + build cache handled below (saved on main only).
          cache: false
      - name: Restore the Go module and build cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('enroll/go.sum', 'domains/go.sum', 'mcp-gate/go.sum') }}-${{ hashFiles('enroll/**/*.go', 'domains/**/*.go', 'mcp-gate/**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('enroll/go.sum', 'domains/go.sum', 'mcp-gate/go.sum') }}-
      - name: enroll unit tests
        working-directory: enroll
        env:
          CGO_ENABLED: "0"
        run: |
          # The module cache is checked against go.sum, the build cache is
          # keyed by content hashes.
          go mod verify
          go vet ./...
          go test ./...
      - name: domains unit tests (in-process Pebble, fake libdns provider + DNS server)
        working-directory: domains
        run: |
          go mod verify
          go vet ./...
          go vet -tags testprovider ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "FAIL: gofmt"; exit 1; }
          # The production build (no tags) never links the fake provider.
          if go list -deps . | grep -q 'internal/fakedns'; then echo "FAIL: production build links internal/fakedns"; exit 1; fi
          CGO_ENABLED=1 go test -race ./...
      - name: mcp-gate unit tests (config, token checks, resource metadata; contract §15)
        working-directory: mcp-gate
        run: |
          go mod verify
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "FAIL: gofmt"; exit 1; }
          # The shared test vector (contract §15.4, preflight G47) is
          # decoded strictly and re-encoded byte for byte by the tests.
          test -s internal/config/testdata/mcp-gate.json && test -s internal/config/testdata/mcp-credentials.json
          CGO_ENABLED=1 go test -race ./...
      # mcp-gate's shared vectors are byte copies of the Hub's: the gate
      # files (contract §15.4, internal/aigate/testdata/) and the sign-in
      # rule vectors (internal/signin/testdata/vectors.json), on the
      # same-named Hub branch when it exists, else main — like group-gate's
      # vectors check above.
      - name: mcp-gate shared vectors match the Hub
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          url="https://github.com/porelli/portcullis-hub"
          # The Hub's heads, listed once: a failed listing (network, auth)
          # fails rather than comparing main. The same-named branch only as
          # exactly refs/heads/<REF> (ls-remote patterns also match
          # suffixes), else main; the files are fetched at the commit listed,
          # so a push in between can't change what is compared.
          heads=$(git ls-remote --heads "$url") || { echo "::error::git ls-remote $url failed"; exit 1; }
          ref=main
          if [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] && [ "$REF" != main ] \
            && awk -v r="refs/heads/$REF" '$2 == r { f = 1 } END { exit !f }' <<<"$heads"; then
            ref="$REF"
          fi
          sha=$(awk -v r="refs/heads/$ref" '$2 == r { print $1 }' <<<"$heads")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::portcullis-hub has no single commit for refs/heads/$ref"; exit 1; }
          echo "portcullis-hub (mcp-gate vectors): $ref ($sha)" | tee -a "$GITHUB_STEP_SUMMARY"
          fail=0
          for pair in \
            "mcp-gate/internal/config/testdata/mcp-gate.json internal/aigate/testdata/mcp-gate.json" \
            "mcp-gate/internal/config/testdata/mcp-credentials.json internal/aigate/testdata/mcp-credentials.json" \
            "mcp-gate/internal/signin/testdata/signin_vectors.json internal/signin/testdata/vectors.json"; do
            read -r own theirs <<<"$pair"
            hub="$RUNNER_TEMP/hub_$(basename "$own")"
            code=$(curl -sS -o "$hub" -w '%{http_code}' "https://raw.githubusercontent.com/porelli/portcullis-hub/$sha/$theirs")
            [ "$code" = 200 ] || { echo "::error::fetching the Hub's $theirs from $ref ($sha): HTTP $code"; exit 1; }
            if ! cmp "$own" "$hub"; then
              echo "::error::$own differs from portcullis-hub $ref ($sha) $theirs: copy it byte for byte"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "mcp-gate vectors match portcullis-hub $ref ($sha)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the Go module and build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  build-and-test:
    needs: jobs-input
    # Runs unless a workflow_dispatch named other jobs (input `jobs`: `all`, or
    # names separated by commas and/or spaces; exact names, so `e2e` is not `e2e-ai`).
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.jobs == '' || inputs.jobs == 'all'
      || contains(format(' ,{0}, ', inputs.jobs), ',build-and-test,') || contains(format(' ,{0}, ', inputs.jobs), ',build-and-test ') || contains(format(' ,{0}, ', inputs.jobs), ' build-and-test,') || contains(format(' ,{0}, ', inputs.jobs), ' build-and-test ')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate .env (portcullis init --env-only)
        run: |
          ./portcullis init --env-only --runtime docker --non-interactive --domain portcullis.local \
            --email ci@portcullis.local --dns-provider none
          test "$(stat -c %a .env)" = 600 || { echo "FAIL: .env is not 0600"; exit 1; }
          # Make the generated values available to the test steps below.
          for v in KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD LLDAP_ADMIN_PASSWORD FORWARD_AUTH_CLIENT_SECRET; do
            val="$(grep "^$v=" .env | cut -d= -f2-)"
            [ -n "$val" ] || { echo "FAIL: $v not generated"; exit 1; }
            [ "$v" = KEYCLOAK_ADMIN ] || echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          done

      - name: CI compose override
        run: |
          # Keycloak runs its production command (x509 lookup provider,
          # proxy-trusted-addresses, truststore); only the management port
          # is published for the health checks.
          cat > docker-compose.ci.yml <<'YML'
          services:
            keycloak:
              ports:
                - "127.0.0.1:9000:9000"
            lldap:
              ports:
                - "127.0.0.1:17170:17170"
            group-gate:
              environment:
                # Faster CRL refresh so the CRL-only revocation test is quick.
                GATE_CRL_REFRESH_SECONDS: "3"
            # The domains service against Pebble with the CI-only fake DNS
            # provider (build tag testprovider: provider "fake", its DNS on
            # :8053, which Pebble's DNS-01 validation and the records check use).
            domains:
              build:
                args:
                  GO_TAGS: testprovider
              environment:
                ACME_CA_SERVER: https://pebble:14000/dir
                LEGO_CA_CERTIFICATES: /run/ci/pebble.minica.pem
                DOMAINS_RESOLVERS: 127.0.0.1:8053
                # Pebble is no Let's Encrypt: its CAA issuer domain (caa set on).
                DNS_CAA_ISSUER: pebble.test
              volumes:
                - /tmp/pebble.minica.pem:/run/ci/pebble.minica.pem:ro
            pebble:
              image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
              command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "domains:8053"]
              environment:
                PEBBLE_VA_NOSLEEP: "1"
                PEBBLE_WFE_NONCEREJECT: "0"
              networks: [domains-egress]
            # The one-shot dns tool asks its own fake DNS (the testprovider
            # build serves provider "fake" in the tool's process).
            dns-tool:
              environment:
                DOMAINS_RESOLVERS: 127.0.0.1:8053
            traefik:
              environment:
                # CI only: Traefik's API on its internal :8080 entrypoint, for
                # the "no @http object" checks of the domains test.
                TRAEFIK_API_INSECURE: "true"
          YML
          sed -i 's/^          //' docker-compose.ci.yml
          docker compose config -q

      - name: List the images this job runs
        run: |
          # Compose services (minus the locally built enroll and the unpinned
          # edge Hub and Keycloak, pulled by their own steps) + the pinned images used inline
          # here and by the CLI (helper, restic, whoami, curl, docker cli).
          {
            docker compose config --images | grep -vxE 'portcullis-(enroll|group-gate|domains|mcp-gate)|ghcr\.io/porelli/portcullis-(hub|keycloak):.*'
            grep -ohE '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' .github/workflows/ci.yml scripts/lib/*.sh
          } | sort -u > "$RUNNER_TEMP/images.txt"
      - name: Load images (cached, verified)
        timeout-minutes: 15
        uses: ./.github/actions/cached-images
        with:
          images: ${{ runner.temp }}/images.txt
          name: build-and-test
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Becomes the default builder, so the later `up --build` (restore) reuse
      # its layer cache too.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build enrollment UI (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: enroll
          # compose's name for the build-only enroll service
          tags: portcullis-enroll
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=enroll
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=enroll,mode=max' || '' }}
      - name: Build group-gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: group-gate
          # compose's image name for group-gate
          tags: portcullis-group-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=group-gate
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=group-gate,mode=max' || '' }}
      - name: Build the domains service (CI test build, buildx layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: domains
          # compose's image name; the CI override builds the same test variant
          tags: portcullis-domains
          build-args: GO_TAGS=testprovider
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=domains-test
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=domains-test,mode=max' || '' }}
      - name: Build the MCP gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mcp-gate
          # compose's image name for mcp-gate
          tags: portcullis-mcp-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=mcp-gate
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=mcp-gate,mode=max' || '' }}
      - name: Hub image (same-named Hub branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/hub-image
      - name: Keycloak image (same-named portcullis-keycloak branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/keycloak-image

      - name: Start core services (without Traefik ACME)
        run: docker compose up -d postgres lldap

      - name: Initialize and unseal Vault (server mode)
        run: |
          ./portcullis vault init
          test "$(stat -c %a secrets)" = 700 || { echo "FAIL: secrets/ is not 0700"; exit 1; }
          test -s secrets/vault-init.json && test "$(stat -c %a secrets/vault-init.json)" = 600 \
            || { echo "FAIL: secrets/vault-init.json missing or not 0600"; exit 1; }
          # Read by non-root containers: operator-owned, container group, 0640/0750.
          for f in secrets/vault-unseal/unseal-key:1000 secrets/enroll/role-id:10002 secrets/enroll/secret-id:10002 secrets/hub/core.env:10001; do
            test -s "${f%:*}" || { echo "FAIL: ${f%:*} missing"; exit 1; }
            test "$(stat -c %a:%u:%g "${f%:*}")" = "640:$(id -u):${f#*:}" || { echo "FAIL: ${f%:*} is $(stat -c %a:%u:%g "${f%:*}"), want 640:$(id -u):${f#*:}"; exit 1; }
            test "$(stat -c %a:%g "$(dirname "${f%:*}")")" = "750:${f#*:}" || { echo "FAIL: $(dirname "${f%:*}") mode/group"; exit 1; }
          done
          test "$(stat -c %u templates)" = 10001 || { echo "FAIL: templates/ not owned by the Hub uid"; exit 1; }
          if grep -Eq 'PASSWORD|SECRET=.{8}' secrets/hub/core.env; then echo "FAIL: core secrets leaked into the Hub env"; cat secrets/hub/core.env; exit 1; fi
          docker compose exec -T vault vault status -format=json | jq -e '.sealed == false and .storage_type == "raft"' \
            || { echo "FAIL: Vault not unsealed / not on raft storage"; exit 1; }
          # Idempotent: a second run must not re-init or rotate anything.
          SID_BEFORE=$(sha256sum secrets/enroll/secret-id)
          ./portcullis vault init
          test "$SID_BEFORE" = "$(sha256sum secrets/enroll/secret-id)" || { echo "FAIL: re-run rotated secret-id"; exit 1; }
          echo "PASS: Vault initialised, unsealed, secrets owner-only, re-run idempotent"

      - name: Install Vault CLI (copied from the pinned Vault image)
        run: |
          # Same binary as the server, integrity covered by the image pull —
          # no unverified download from releases.hashicorp.com.
          docker compose exec -T vault sh -c 'cat "$(command -v vault)"' > /tmp/vault
          sudo install -m 0755 /tmp/vault /usr/local/bin/vault
          vault version

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U keycloak > /dev/null 2>&1; then
              echo "PostgreSQL is ready"; exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "FAIL: PostgreSQL not ready"; exit 1

      - name: Wait for LLDAP
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T lldap /app/lldap healthcheck --config-file /data/lldap_config.toml > /dev/null 2>&1; then
              echo "LLDAP is ready"; exit 0
            fi
            echo "Waiting for LLDAP... ($i/30)"
            sleep 2
          done
          echo "FAIL: LLDAP not ready"; exit 1

      - name: Initialize Vault PKI
        run: |
          # Root token is read from secrets/vault-init.json by the CLI.
          ./portcullis pki setup --with-server-cert
          # Read by Traefik (root without CAP_DAC_OVERRIDE): operator-owned, group 0, 0640.
          test "$(stat -c %a:%u:%g certs/server.key)" = "640:$(id -u):0" \
            || { echo "FAIL: server.key is $(stat -c %a:%u:%g certs/server.key), want 640:$(id -u):0"; exit 1; }
          # Second run must be a no-op (would otherwise replace the CA).
          BEFORE=$(sha256sum certs/root-ca.crt)
          ./portcullis pki setup --with-server-cert
          test "$BEFORE" = "$(sha256sum certs/root-ca.crt)" || { echo "FAIL: re-run replaced the CA"; exit 1; }

      - name: Verify CA chain created
        run: |
          test -f certs/root-ca.crt || (echo "FAIL: root-ca.crt missing" && exit 1)
          test -f certs/intermediate-ca.crt || (echo "FAIL: intermediate-ca.crt missing" && exit 1)
          test -s certs/yubikey-ca.crt || (echo "FAIL: yubikey-ca.crt missing or empty" && exit 1)
          test -s certs/browser-ca.crt || (echo "FAIL: browser-ca.crt missing or empty" && exit 1)
          test -f certs/ca-chain.crt || (echo "FAIL: ca-chain.crt missing" && exit 1)
          test -f certs/ca-chain-yubikey.crt || (echo "FAIL: ca-chain-yubikey.crt missing" && exit 1)
          for f in portcullis-ca-chain.pem portcullis-yubikey-ca.pem portcullis-browser-ca.pem; do
            test -f "certs/truststore/$f" || { echo "FAIL: truststore/$f missing"; exit 1; }
          done
          test -f certs/server.crt || (echo "FAIL: server.crt missing" && exit 1)
          test -f certs/server.key || (echo "FAIL: server.key missing" && exit 1)
          echo "PASS: All PKI certificates created"

      - name: Verify CA chain is valid
        run: |
          openssl verify -CAfile certs/root-ca.crt certs/intermediate-ca.crt
          openssl verify -CAfile certs/root-ca.crt certs/yubikey-ca.crt
          openssl verify -CAfile certs/root-ca.crt certs/browser-ca.crt
          openssl verify -CAfile certs/ca-chain.crt certs/server.crt
          # ca-chain.crt = root + pki_int + pki_file; ca-chain-yubikey.crt = pki_int ONLY
          # (review C1: Go trusts every caFiles certificate as an anchor, so a root
          # there would let a browser certificate sending pki_file + root through).
          subjects() { openssl crl2pkcs7 -nocrl -certfile "$1" | openssl pkcs7 -print_certs -noout | sed -n 's/^subject=//p'; }
          test "$(subjects certs/ca-chain.crt | tr '\n' '|')" = "$(for f in root-ca yubikey-ca browser-ca; do subjects "certs/$f.crt"; done | tr '\n' '|')" \
            || { echo "FAIL: ca-chain.crt is not root + YubiKey CA + browser CA"; subjects certs/ca-chain.crt; exit 1; }
          test "$(subjects certs/ca-chain-yubikey.crt | tr '\n' '|')" = "$(subjects certs/yubikey-ca.crt | tr '\n' '|')" \
            || { echo "FAIL: ca-chain-yubikey.crt is not the YubiKey CA alone"; subjects certs/ca-chain-yubikey.crt; exit 1; }
          cmp -s certs/ca-chain-yubikey.crt certs/yubikey-ca.crt || { echo "FAIL: ca-chain-yubikey.crt differs from yubikey-ca.crt"; exit 1; }
          test "$(subjects certs/yubikey-ca.crt)" != "$(subjects certs/browser-ca.crt)" || { echo "FAIL: the two CAs have the same subject"; exit 1; }
          cmp -s certs/ca-chain.crt certs/truststore/portcullis-ca-chain.pem || { echo "FAIL: truststore chain differs"; exit 1; }
          echo "PASS: Certificate chain is valid"

      - name: Test Vault persistence and auto-unseal across restart
        run: |
          VAULT_TOKEN=$(jq -r .root_token secrets/vault-init.json); export VAULT_TOKEN
          echo "::add-mask::$VAULT_TOKEN"
          CA_BEFORE=$(vault read -field=certificate pki_int/cert/ca | sha256sum)
          docker compose restart vault
          # The container must unseal ITSELF (non-root vault user reading the
          # group-readable key file) — no `portcullis vault unseal` here.
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8200/v1/sys/health)" = 200 ] && break
            [ "$i" -eq 60 ] && { echo "FAIL: Vault did not auto-unseal"; docker compose logs --tail=30 vault; exit 1; }
            sleep 1
          done
          ./portcullis vault unseal || { echo "FAIL: Vault not active"; docker compose logs --tail=30 vault; exit 1; }
          CA_AFTER=$(vault read -field=certificate pki_int/cert/ca | sha256sum)
          test "$CA_BEFORE" = "$CA_AFTER" || { echo "FAIL: PKI changed/lost across restart"; exit 1; }
          echo "PASS: Vault auto-unsealed after restart and kept its PKI"

      - name: Test enroll AppRole is least-privilege
        run: |
          TOKEN=$(vault write -field=token auth/approle/login \
            role_id=@secrets/enroll/role-id secret_id=@secrets/enroll/secret-id)
          [ -z "$TOKEN" ] || [ "$TOKEN" = null ] || echo "::add-mask::$TOKEN"
          export VAULT_TOKEN="$TOKEN"
          # allowed <vault args>: the policy lets the call through — it may still
          # fail for other reasons (a bad CSR, an unknown serial), never 403.
          allowed() {
            local out
            out="$(vault "$@" 2>&1 </dev/null)" && return 0
            case "$out" in *"permission denied"*)
              echo "FAIL: enroll token was denied: vault $*"; printf '%s\n' "$out"; exit 1 ;;
            esac
          }
          # denied <vault args>: refused by the policy — a non-zero exit AND
          # "permission denied" (the CLI exits 2 for every API error).
          denied() {
            local out rc=0
            out="$(echo 'path "*" { capabilities = ["sudo"] }' | vault "$@" 2>&1)" || rc=$?
            if [ "$rc" = 0 ] || [[ "$out" != *"permission denied"* ]]; then
              echo "FAIL: enroll token was not refused with permission denied: vault $* (exit $rc)"
              printf '%s\n' "$out"; exit 1
            fi
          }
          vault list pki_int/certs >/dev/null || { echo "FAIL: enroll token cannot list certs"; exit 1; }
          allowed list pki_file/certs
          allowed read pki_int/cert/ca
          allowed read pki_file/cert/ca
          # A bad CSR / unknown serial: Vault answers 400, which proves the policy allowed it.
          allowed write pki_int/sign/client-cert csr=not-a-csr common_name=ci-policy-check
          allowed write pki_file/sign/browser-cert csr=not-a-csr common_name=ci-policy-check
          allowed write pki_int/revoke serial_number=00:00:00:00
          allowed write pki_file/revoke serial_number=00:00:00:00
          allowed read -format=json pki_int/crl/rotate
          allowed read -format=json pki_file/crl/rotate
          denied write -f pki/root/generate/internal common_name=x
          denied write pki_int/issue/server-cert common_name=x.portcullis.local
          denied write pki_file/issue/browser-cert common_name=x
          denied write pki_file/roles/browser-cert max_ttl=87600h
          denied write pki_file/config/crl disable=true
          denied write pki_file/intermediate/set-signed certificate=x
          # Signing never takes SANs (denied_parameters on both sign paths).
          for san in alt_names=evil.example ip_sans=10.0.0.1 uri_sans=spiffe://evil other_sans="1.2.3.4;UTF8:evil"; do
            denied write pki_file/sign/browser-cert csr=not-a-csr common_name=ci-policy-check "$san"
            denied write pki_int/sign/client-cert csr=not-a-csr common_name=ci-policy-check "$san"
          done
          denied read sys/auth
          denied read sys/mounts
          denied policy write evil -
          TTL=$(vault token lookup -format=json | jq -r .data.ttl)
          [ "$TTL" -gt 0 ] && [ "$TTL" -le 3600 ] || { echo "FAIL: enroll token TTL $TTL not short-lived"; exit 1; }
          echo "PASS: enroll token can only use its PKI paths (ttl ${TTL}s)"

      - name: Start Keycloak
        run: |
          docker compose up -d keycloak
          echo "Waiting for Keycloak to start..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:9000/health/ready > /dev/null 2>&1; then
              echo "Keycloak is ready"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "FAIL: Keycloak did not start in time"
              docker compose logs keycloak | tail -50
              exit 1
            fi
            sleep 3
          done

      - name: Configure Keycloak realm and OIDC clients
        run: |
          ./portcullis keycloak configure
          ./portcullis oidc register
          # Idempotent: a second run must succeed too.
          ./portcullis oidc register

      - name: Test Keycloak OIDC discovery endpoint
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:8080/realms/portcullis/.well-known/openid-configuration)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "PASS: OIDC discovery endpoint available"
          else
            echo "FAIL: OIDC discovery returned $HTTP_CODE"
            exit 1
          fi

      - name: Test Keycloak SAML descriptor endpoint
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:8080/realms/portcullis/protocol/saml/descriptor)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "PASS: SAML descriptor endpoint available"
          else
            echo "FAIL: SAML descriptor returned $HTTP_CODE"
            exit 1
          fi

      - name: Test Keycloak WebAuthn policy is configured
        run: |
          # Get admin token
          TOKEN=$(curl -s http://localhost:8080/realms/master/protocol/openid-connect/token \
            -d "client_id=admin-cli" \
            -d "username=$KEYCLOAK_ADMIN" \
            --data-urlencode password@- \
            -d "grant_type=password" < <(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD") | jq -r '.access_token')
          { [ -n "$TOKEN" ] && [ "$TOKEN" != null ]; } || { echo "FAIL: no Keycloak admin token"; exit 1; }
          echo "::add-mask::$TOKEN"

          # Check realm has WebAuthn policy
          REALM=$(curl -s http://localhost:8080/admin/realms/portcullis \
            -H @<(printf 'Authorization: Bearer %s\n' "$TOKEN"))

          WEBAUTHN_RP=$(echo "$REALM" | jq -r '.webAuthnPolicyPasswordlessRpEntityName')
          if [ "$WEBAUTHN_RP" = "Portcullis" ]; then
            echo "PASS: WebAuthn passwordless policy configured (RP: $WEBAUTHN_RP)"
          else
            echo "FAIL: WebAuthn policy not found (got: $WEBAUTHN_RP)"
            exit 1
          fi

          # Check browser flow
          BROWSER_FLOW=$(echo "$REALM" | jq -r '.browserFlow')
          if [ "$BROWSER_FLOW" = "portcullis-universal" ]; then
            echo "PASS: Browser flow set to portcullis-universal"
          else
            echo "FAIL: Browser flow is $BROWSER_FLOW, expected portcullis-universal"
            exit 1
          fi

      - name: Test Keycloak forward-auth OIDC client exists
        run: |
          TOKEN=$(curl -s http://localhost:8080/realms/master/protocol/openid-connect/token \
            -d "client_id=admin-cli" \
            -d "username=$KEYCLOAK_ADMIN" \
            --data-urlencode password@- \
            -d "grant_type=password" < <(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD") | jq -r '.access_token')
          { [ -n "$TOKEN" ] && [ "$TOKEN" != null ]; } || { echo "FAIL: no Keycloak admin token"; exit 1; }
          echo "::add-mask::$TOKEN"

          CLIENT=$(curl -s http://localhost:8080/admin/realms/portcullis/clients \
            -H @<(printf 'Authorization: Bearer %s\n' "$TOKEN") \
            | jq -r '.[] | select(.clientId == "portcullis-forward-auth") | .clientId')

          if [ "$CLIENT" = "portcullis-forward-auth" ]; then
            echo "PASS: Forward auth OIDC client exists"
          else
            echo "FAIL: Forward auth OIDC client not found"
            exit 1
          fi

          # The realm export ships a placeholder; `oidc register` must have
          # pushed the generated secret from .env.
          UUID=$(curl -s "http://localhost:8080/admin/realms/portcullis/clients?clientId=portcullis-forward-auth" \
            -H @<(printf 'Authorization: Bearer %s\n' "$TOKEN") | jq -r '.[0].id')
          KC_SECRET=$(curl -s "http://localhost:8080/admin/realms/portcullis/clients/$UUID/client-secret" \
            -H @<(printf 'Authorization: Bearer %s\n' "$TOKEN") | jq -r '.value')
          [ "$KC_SECRET" = "$FORWARD_AUTH_CLIENT_SECRET" ] || { echo "FAIL: Keycloak client secret != .env FORWARD_AUTH_CLIENT_SECRET"; exit 1; }
          echo "PASS: forward-auth client secret in Keycloak matches the generated .env value"

      - name: Test LLDAP user creation
        run: |
          # Create a test user via LLDAP GraphQL API
          LLDAP_TOKEN=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
            | curl -s http://localhost:17170/auth/simple/login -H "Content-Type: application/json" -d @- \
            | jq -r '.token')
          [ -z "$LLDAP_TOKEN" ] || [ "$LLDAP_TOKEN" = null ] || echo "::add-mask::$LLDAP_TOKEN"

          if [ "$LLDAP_TOKEN" = "null" ] || [ -z "$LLDAP_TOKEN" ]; then
            echo "FAIL: Could not authenticate with LLDAP"
            exit 1
          fi

          # Create user
          HTTP_CODE=$(curl -s -o /tmp/lldap-response.json -w "%{http_code}" \
            http://localhost:17170/api/graphql \
            -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { createUser(user: {id: \"testuser\", email: \"testuser@portcullis.local\"}) { id email } }"}')

          if [ "$HTTP_CODE" = "200" ]; then
            USER_ID=$(jq -r '.data.createUser.id // empty' /tmp/lldap-response.json)
            if [ "$USER_ID" = "testuser" ]; then
              echo "PASS: Test user created in LLDAP"
            else
              echo "PASS: LLDAP responded (user may already exist)"
            fi
          else
            echo "FAIL: LLDAP user creation returned $HTTP_CODE"
            cat /tmp/lldap-response.json
            exit 1
          fi

      - name: Test the email-unverified scope (email claim, no email_verified)
        run: |
          set -o pipefail
          # configure is idempotent: a second run must leave the scope with
          # exactly its one email mapper.
          ./portcullis keycloak configure >/dev/null
          KC_TOKEN=$(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=$KEYCLOAK_ADMIN" \
            --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token)
          [ -z "$KC_TOKEN" ] || [ "$KC_TOKEN" = null ] || echo "::add-mask::$KC_TOKEN"
          kc() { curl -sf -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") -H 'Content-Type: application/json' "$@"; }
          A=http://127.0.0.1:8080/admin/realms/portcullis
          SCOPE=$(kc "$A/client-scopes" | jq -c '[.[] | select(.name == "email-unverified")][0] // empty')
          [ -n "$SCOPE" ] || { echo "FAIL: email-unverified client scope missing"; exit 1; }
          echo "$SCOPE" | jq -e '.protocol == "openid-connect" and .attributes["include.in.token.scope"] == "true"
              and ([.protocolMappers[] | .config["claim.name"]] == ["email"])' >/dev/null \
            || { echo "FAIL: email-unverified scope must have exactly one mapper, for email: $SCOPE"; exit 1; }

          # A throwaway LLDAP user with a password and a direct-grant client
          # that has email-unverified instead of email.
          PW="$(openssl rand -hex 16)Aa1!"; echo "::add-mask::$PW"
          LLDAP_TOKEN=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
            | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          [ -z "$LLDAP_TOKEN" ] || [ "$LLDAP_TOKEN" = null ] || echo "::add-mask::$LLDAP_TOKEN"
          jq -n '{query: "mutation { createUser(user: {id: \"scopecheck\", email: \"scopecheck@portcullis.local\"}) { id } }"}' \
            | curl -sf http://127.0.0.1:17170/api/graphql -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") \
              -H 'Content-Type: application/json' -d @- | jq -e '.errors == null' >/dev/null
          # As the CLI does (users.sh): the user's password via LLDAP_USER_PASSWORD,
          # the admin JWT read from stdin inside the lldap container. The JWT is
          # then lldap_set_password's --token argument: a container process's
          # argv is visible from the host (ps) while it runs — the accepted
          # exception (short-lived token; the tool has no env/file option).
          { printf '%s\n' "$LLDAP_TOKEN"; printf '%s\n' "$PW"; } | docker compose exec -T lldap sh -c 'read -r T; read -r P; export LLDAP_USER_PASSWORD="$P";
            exec /app/lldap_set_password --base-url http://localhost:17170 --token "$T" --username "$1"' _ scopecheck # secret-argv-ok: inside the lldap container
          CS="$(openssl rand -hex 24)"; echo "::add-mask::$CS"
          export CS
          jq -n '{clientId: "ci-email-unverified", protocol: "openid-connect", publicClient: false,
              secret: env.CS, standardFlowEnabled: false, directAccessGrantsEnabled: true,
              defaultClientScopes: ["basic", "profile", "email-unverified"], optionalClientScopes: []}' \
            | kc -X POST -d @- "$A/clients"
          CU=$(kc "$A/clients?clientId=ci-email-unverified" | jq -r '.[0].id')
          trap 'kc -X DELETE "$A/clients/$CU" || true' EXIT
          kc "$A/clients/$CU/default-client-scopes" | jq -e '[.[].name] | index("email-unverified") and (index("email") | not)' >/dev/null \
            || { echo "FAIL: throwaway client scopes: $(kc "$A/clients/$CU/default-client-scopes" | jq -c '[.[].name]')"; exit 1; }

          TOK=$(printf '%s' "$PW" | curl -sf http://127.0.0.1:8080/realms/portcullis/protocol/openid-connect/token \
            -H @<(printf 'Authorization: Basic %s\n' "$(printf '%s' "ci-email-unverified:$CS" | base64 -w0)") --data-urlencode grant_type=password --data-urlencode scope=openid \
            --data-urlencode username=scopecheck --data-urlencode password@-)
          claims() { echo "$TOK" | jq -r ".$1" | cut -d. -f2 | tr '_-' '/+' | awk '{while (length($0) % 4) $0 = $0 "="; print}' | base64 -d; }
          for t in id_token access_token; do
            claims "$t" | jq -e '.email == "scopecheck@portcullis.local" and (has("email_verified") | not)
                and .preferred_username == "scopecheck"' >/dev/null \
              || { echo "FAIL: $t claims: $(claims "$t" | jq -c '{email, email_verified, preferred_username}')"; exit 1; }
          done
          AT=$(echo "$TOK" | jq -r .access_token)
          curl -sf http://127.0.0.1:8080/realms/portcullis/protocol/openid-connect/userinfo -H @<(printf 'Authorization: Bearer %s\n' "$AT") \
            | jq -e '.email == "scopecheck@portcullis.local" and (has("email_verified") | not)' >/dev/null \
            || { echo "FAIL: userinfo carries email_verified or lacks email"; exit 1; }
          echo "PASS: email-unverified scope: email in id/access token and userinfo, no email_verified"

          # Control: the built-in email scope does send email_verified=false
          # (LLDAP email is never trusted), which is why the scope exists.
          kc -X DELETE "$A/clients/$CU/default-client-scopes/$(echo "$SCOPE" | jq -r .id)"
          kc -X PUT "$A/clients/$CU/default-client-scopes/$(kc "$A/client-scopes" | jq -r '.[] | select(.name == "email") | .id')"
          TOK=$(printf '%s' "$PW" | curl -sf http://127.0.0.1:8080/realms/portcullis/protocol/openid-connect/token \
            -H @<(printf 'Authorization: Basic %s\n' "$(printf '%s' "ci-email-unverified:$CS" | base64 -w0)") --data-urlencode grant_type=password --data-urlencode scope=openid \
            --data-urlencode username=scopecheck --data-urlencode password@-)
          claims id_token | jq -e '.email_verified == false' >/dev/null \
            || { echo "FAIL: built-in email scope: $(claims id_token | jq -c '{email, email_verified}')"; exit 1; }
          echo "PASS: built-in email scope sends email_verified=false"

      - name: Test Vault client certificate issuance
        run: |
          VAULT_TOKEN=$(jq -r .root_token secrets/vault-init.json); export VAULT_TOKEN
          echo "::add-mask::$VAULT_TOKEN"

          # Generate a test key and CSR
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/test-client.key
          openssl req -new -key /tmp/test-client.key -out /tmp/test-client.csr \
            -subj "/CN=testuser/emailAddress=testuser@portcullis.local"

          # Sign with Vault
          CSR=$(cat /tmp/test-client.csr)
          RESULT=$(vault write -format=json pki_int/sign/client-cert \
            csr="$CSR" \
            common_name="testuser" \
            ttl="1h")

          SERIAL=$(echo "$RESULT" | jq -r '.data.serial_number')
          CERT=$(echo "$RESULT" | jq -r '.data.certificate')

          if [ -n "$SERIAL" ] && [ "$SERIAL" != "null" ]; then
            echo "PASS: Client certificate issued (serial: $SERIAL)"
            echo "$SERIAL" > /tmp/test-client.serial
          else
            echo "FAIL: Certificate issuance failed"
            echo "$RESULT"
            exit 1
          fi

          # Verify the cert
          echo "$CERT" > /tmp/test-client.crt
          # RFC 2253 form: the same on every OpenSSL (3.x defaults differ between runner images).
          CN=$(openssl x509 -in /tmp/test-client.crt -noout -subject -nameopt RFC2253 | sed 's/^subject= *//' | tr ',' '\n' | sed -n 's/^CN=//p')
          if [ "$CN" = "testuser" ]; then
            echo "PASS: Certificate CN matches (CN=$CN)"
          else
            echo "FAIL: Certificate CN mismatch (expected testuser, got $CN)"
            exit 1
          fi

          # Verify against CA chain
          openssl verify -CAfile certs/ca-chain.crt /tmp/test-client.crt
          echo "PASS: Client certificate validates against CA chain"

          # A cert from an unrelated CA, for negative mTLS tests
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -keyout /tmp/foreign.key -out /tmp/foreign.crt -subj "/CN=testuser" -days 1

      - name: Start Traefik, group-gate and the mTLS test app
        run: |
          # CI has no ACME: serve the Vault-issued wildcard cert from the file provider.
          cat > traefik/dynamic/ci-certs.yml <<'EOF'
          tls:
            certificates:
              - certFile: /certs/server.crt
                keyFile: /certs/server.key
          EOF
          # Test app on portcullis-proxy: one router on the protected tier
          # (cert required), one on authaware gated by group-gate. ci-gated has
          # no portcullis-auth (no browser login in this job) and no group
          # mapping (ALLOW-UNMAPPED): the tests send the identity headers
          # portcullis-auth would set themselves. group-gate denies requests
          # without X-Auth-Request-Preferred-Username; revocation is checked
          # before that and does not depend on the user.
          cat > /tmp/ci-mtls.yml <<'YML'
          services:
            whoami:
              image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
              networks: [portcullis-proxy]
              labels:
                traefik.enable: "true"
                traefik.http.services.ci-whoami.loadbalancer.server.port: "80"
                traefik.http.routers.ci-mtls.rule: Host(`mtls.portcullis.local`)
                traefik.http.routers.ci-mtls.entrypoints: websecure
                traefik.http.routers.ci-mtls.tls.options: protected@file
                traefik.http.routers.ci-mtls.middlewares: client-headers@file
                traefik.http.routers.ci-mtls.service: ci-whoami
                traefik.http.routers.ci-gated.rule: Host(`gated.portcullis.local`)
                traefik.http.routers.ci-gated.entrypoints: websecure
                traefik.http.routers.ci-gated.tls.options: authaware@file
                traefik.http.routers.ci-gated.middlewares: client-headers@file,portcullis-groups@docker
                traefik.http.routers.ci-gated.service: ci-whoami
                # Public-exception stand-in: every path goes through the
                # public guard only (the Hub's routers also restrict paths).
                traefik.http.routers.ci-public.rule: Host(`public.portcullis.local`)
                traefik.http.routers.ci-public.entrypoints: websecure
                traefik.http.routers.ci-public.tls.options: authaware@file
                traefik.http.routers.ci-public.middlewares: portcullis-public-guard@docker
                traefik.http.routers.ci-public.service: ci-whoami
          networks:
            portcullis-proxy:
              external: true
          YML
          docker compose up -d traefik group-gate enroll
          docker compose -p ci-mtls -f /tmp/ci-mtls.yml up -d
          docker compose ps
          for svc in socket-proxy-traefik traefik group-gate enroll; do
            for i in $(seq 1 40); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q "$svc")")" = healthy ] && break
              [ "$i" -eq 40 ] && { echo "FAIL: $svc not healthy"; docker compose logs --tail=40 "$svc"; exit 1; }
              sleep 3
            done
          done
          echo "PASS: socket-proxy-traefik, traefik, group-gate, enroll healthy (non-root, read-only)"

          TRAEFIK_CID=$(docker compose ps -q traefik)
          GOT_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis-proxy").IPAddress}}' "$TRAEFIK_CID")
          test "$GOT_IP" = "$TRAEFIK_IP" || { echo "FAIL: Traefik IP on portcullis-proxy is $GOT_IP, want $TRAEFIK_IP"; exit 1; }
          docker network inspect portcullis-proxy | jq -e '.[0].IPAM.Config[0] | .Subnet == "172.31.250.0/24" and .IPRange == "172.31.250.128/25"' \
            || { echo "FAIL: portcullis-proxy IPAM config"; exit 1; }
          WHOAMI_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis-proxy").IPAddress}}' "$(docker compose -p ci-mtls -f /tmp/ci-mtls.yml ps -q whoami)")
          # shellcheck source=/dev/null
          source scripts/lib/network.sh
          cidr_contains 172.31.250.128/25 "$WHOAMI_IP" || { echo "FAIL: app IP $WHOAMI_IP outside the dynamic range"; exit 1; }
          echo "PASS: Traefik pinned to $GOT_IP, apps get dynamic IPs ($WHOAMI_IP)"

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --cacert certs/ca-chain.crt \
              --cert /tmp/test-client.crt --key /tmp/test-client.key \
              --resolve "mtls.portcullis.local:443:127.0.0.1" https://mtls.portcullis.local/ || true)
            [ "$code" = 200 ] && break
            if [ "$i" -eq 30 ]; then echo "FAIL: routers not ready (last code $code)"; docker compose logs --tail=40 traefik; exit 1; fi
            sleep 2
          done

      - name: Test the domains service (Pebble, fake DNS provider, Traefik HTTP provider over mTLS)
        run: |
          # Contract §12.4 "Checks" / "CI". Pebble's directory TLS root ships in its image.
          cid="$(docker create "$PEBBLE_IMG")"; docker cp "$cid:/test/certs/pebble.minica.pem" /tmp/pebble.minica.pem; docker rm "$cid" >/dev/null
          chmod 644 /tmp/pebble.minica.pem
          docker compose up -d pebble domains
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q domains)")" = healthy ] && break
            [ "$i" -eq 40 ] && { echo "FAIL: domains not healthy"; docker compose logs --tail=40 domains; exit 1; }
            sleep 3
          done
          docker compose exec -T domains sh -c 'test "$(id -u)" = 10004' || { echo "FAIL: domains is not uid 10004"; exit 1; }
          CURL_IMG=curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          SECRET="$(cat secrets/domains/api-secret)"; echo "::add-mask::$SECRET"
          # The API on portcullis-domains (the Hub's network); the bearer comes from stdin.
          dapi() { printf 'Authorization: Bearer %s\n' "$SECRET" \
                   | docker run --rm -i --network portcullis_portcullis-domains "$CURL_IMG" -s -H @- -H 'Content-Type: application/json' "$@"; }
          code=$(docker run --rm --network portcullis_portcullis-domains "$CURL_IMG" -s -o /dev/null -w '%{http_code}' http://domains:8080/domains)
          [ "$code" = 401 ] || { echo "FAIL: domains API without the bearer secret got $code"; exit 1; }
          # The API answers only on portcullis-domains: not to Traefik (portcullis-certs).
          # Positive control from the same container: domains:8443 answers HTTP
          # (Go's TLS server replies "400 … HTTP request to an HTTPS server").
          tstatus() { docker compose exec -T traefik wget -q -T 5 -O /dev/null -S "$1" 2>&1 | grep -o 'HTTP/[0-9.]* [0-9]*' | tail -n1 | cut -d' ' -f2; }
          [ "$(tstatus http://domains:8443/)" = 400 ] || { echo "FAIL: positive control: Traefik can't reach domains:8443 ($(tstatus http://domains:8443/))"; exit 1; }
          [ -z "$(tstatus http://domains:8080/healthz)" ] || { echo "FAIL: Traefik reached the domains API (:8080)"; exit 1; }
          # The certificate endpoint, as Traefik fetches it (client certificate), and without.
          E=secrets/domains/certs-endpoint
          dyn() { docker run --rm --user 0:0 --network portcullis_portcullis-certs -v "$PWD/$E:/c:ro" "$CURL_IMG" \
                    -sf --cacert /c/ca.crt --cert /c/client.crt --key /c/client.key https://domains:8443/traefik/dynamic; }
          if docker run --rm --network portcullis_portcullis-certs -v "$PWD/$E/ca.crt:/ca.crt:ro" "$CURL_IMG" -sf --cacert /ca.crt https://domains:8443/traefik/dynamic >/dev/null 2>&1; then
            echo "FAIL: certificate endpoint answered without a client certificate"; exit 1
          fi
          dyn | jq -e '. == {"tls": {"certificates": []}}' >/dev/null || { echo "FAIL: empty document: $(dyn)"; exit 1; }
          # Membership of the internal networks at runtime.
          docker network inspect portcullis_portcullis-certs | jq -e '[.[0].Containers[].Name | sub("^portcullis-"; "") | sub("-[0-9]+$"; "")] | sort == ["domains", "traefik"]' >/dev/null \
            || { echo "FAIL: portcullis-certs members: $(docker network inspect portcullis_portcullis-certs | jq -c '[.[0].Containers[].Name]')"; exit 1; }
          TRAEFIK_STARTED="$(docker inspect -f '{{.State.StartedAt}}' "$(docker compose ps -q traefik)")"

          D=team-b.ci-domains.test
          code=$(dapi -o /dev/null -w '%{http_code}' -X PUT -d '{"provider":"fake","credentials":{"api_token":"ci-fake-token-0123456789"}}' "http://domains:8080/domains/$D")
          [ "$code" = 202 ] || { echo "FAIL: enroll $D got $code"; exit 1; }
          code=$(dapi -o /dev/null -w '%{http_code}' -X PUT -d '{"provider":"fake","credentials":{"api_token":"x"}}' "http://domains:8080/domains/auth.portcullis.local")
          [ "$code" = 400 ] || { echo "FAIL: enrolling a core host got $code"; exit 1; }
          for i in $(seq 1 60); do
            st="$(dapi http://domains:8080/domains | jq -r --arg d "$D" '.[] | select(.name == $d) | .state')"
            [ "$st" = ready ] && break
            [ "$i" -eq 60 ] && { echo "FAIL: $D state $st: $(dapi http://domains:8080/domains)"; docker compose logs --tail=60 domains pebble; exit 1; }
            sleep 2
          done
          dapi http://domains:8080/domains | jq -e --arg d "$D" '.[] | select(.name == $d) | .records_ok == true and (.cert_not_after | type) == "string" and .last_error == ""' >/dev/null \
            || { echo "FAIL: domain object: $(dapi http://domains:8080/domains)"; exit 1; }
          if docker compose logs domains 2>&1 | grep -q 'ci-fake-token-0123456789'; then echo "FAIL: the DNS token is in the domains logs"; exit 1; fi
          if docker run --rm -v portcullis_domains_data:/d:ro alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a grep -rq 'ci-fake-token-0123456789' /d; then
            echo "FAIL: the DNS token is in clear in domains_data"; exit 1
          fi

          # The served document: only tls.certificates with certFile/keyFile;
          # every certificate's SANs exactly <d> and *.<d> of an enrolled domain.
          DOC="$(dyn)"
          echo "$DOC" | jq -e '(keys == ["tls"]) and (.tls | keys == ["certificates"]) and (.tls.certificates | length == 1)
              and (.tls.certificates | all(keys == ["certFile", "keyFile"]))' >/dev/null \
            || { echo "FAIL: served document shape: $(echo "$DOC" | jq -c 'walk(if type == "string" then .[0:20] else . end)')"; exit 1; }
          ENROLLED="$(dapi http://domains:8080/domains | jq -c '[.[].name]')"
          for i in $(echo "$DOC" | jq -r '.tls.certificates | keys[]'); do
            SANS="$(echo "$DOC" | jq -r ".tls.certificates[$i].certFile" | openssl x509 -noout -ext subjectAltName | tail -n +2 | tr -d ' ' | tr ',' '\n' | sort | paste -sd,)"
            name="${SANS##*DNS:}"
            [ "$SANS" = "DNS:*.$name,DNS:$name" ] || { echo "FAIL: served SANs $SANS"; exit 1; }
            echo "$ENROLLED" | jq -e --arg n "$name" 'index($n) != null' >/dev/null || { echo "FAIL: served a certificate for $name, not enrolled"; exit 1; }
            case "$name" in *portcullis.local) echo "FAIL: served a main-domain certificate ($name)"; exit 1 ;; esac
          done
          echo "PASS: domains enrolled $D (Pebble, DNS-01), serves only {tls: {certificates}} with SANs {<d>, *.<d>}, mTLS required"

          # DNS hardening (contract §12.2 / §12.4): the caa set of $D is pinned
          # to the service's own ACME account (Pebble's, DNS_CAA_ISSUER=pebble.test).
          ACCT="$(dapi http://domains:8080/acme/account)"
          echo "$ACCT" | jq -e '.caa_issuer == "pebble.test" and (.account_uri | startswith("https://")) and .ca_server == "https://pebble:14000/dir"' >/dev/null \
            || { echo "FAIL: /acme/account: $ACCT"; exit 1; }
          PLAN="$(dapi "http://domains:8080/domains/$D/dns?refresh=1")"
          echo "$PLAN" | jq -e --argjson a "$ACCT" '.can_write == true and .caa.would_issue == true and .caa.account_uri == $a.account_uri
              and ([.items[] | select(.set == "caa" and .status != "foreign")] | length == 1 and all(.status == "ok"))
              and ([.items[] | select(.set == "address" and .status != "foreign")] | all(.status == "ok"))' >/dev/null \
            || { echo "FAIL: the plan of $D: $PLAN"; exit 1; }
          dapi http://domains:8080/domains | jq -e --arg d "$D" '.[] | select(.name == $d) | .caa_ok == true' >/dev/null \
            || { echo "FAIL: caa_ok of $D: $(dapi http://domains:8080/domains)"; exit 1; }
          dapi http://domains:8080/main/dns | jq -e '.can_write == false and .name == "portcullis.local"' >/dev/null \
            || { echo "FAIL: the main-domain plan: $(dapi http://domains:8080/main/dns)"; exit 1; }
          docker compose exec -T domains domains report --main --json | jq -e --arg d "$D" '.main.name == "portcullis.local" and (.domains | keys == [$d])' >/dev/null \
            || { echo "FAIL: domains report --main --json"; exit 1; }
          # The one-shot dns tool (profile tools): apply in its own fake zone
          # (the testprovider build), the credentials on stdin only.
          TOOL_IN="$(jq -n '{name: "tool.ci-domains.test", provider: "fake", credentials: {api_token: "ci-fake-token-0123456789"},
              ipv4: "203.0.113.10", ipv6: "", ca_server: "https://pebble:14000/dir",
              caa: {enabled: true, issuer: "pebble.test", account_uri: "", iodef: ""}, nomail: false, sets: ["address", "caa"], mail_from: ""}')"
          printf '%s' "$TOOL_IN" | docker compose run --rm -T dns-tool apply --wait 60s > /tmp/dns-tool-apply.json \
            || { echo "FAIL: dns-tool apply: $(cat /tmp/dns-tool-apply.json)"; exit 1; }
          jq -e '.can_write == true and .caa.would_issue == true
              and ([.items[] | select((.set == "address" or .set == "caa") and .status != "foreign" and .severity != "info")] | length >= 3 and all(.status == "ok"))' /tmp/dns-tool-apply.json >/dev/null \
            || { echo "FAIL: dns-tool apply plan: $(cat /tmp/dns-tool-apply.json)"; exit 1; }
          # check without credentials, against the domains service's fake DNS:
          # the enrolled $D, pinned to the service's account, exits 0.
          IP4="$(echo "$PLAN" | jq -r '[.items[] | select(.set == "address" and .type == "A")][0].want[0]')"
          jq -n --arg d "$D" --arg ip "$IP4" --argjson a "$ACCT" '{name: $d, provider: "", ipv4: $ip, ipv6: "", ca_server: $a.ca_server,
              caa: {enabled: true, issuer: "pebble.test", account_uri: $a.account_uri, iodef: ""}, nomail: false, sets: [], mail_from: ""}' \
            | docker compose run --rm -T -e DOMAINS_RESOLVERS=domains:8053 dns-tool check > /tmp/dns-tool-check.json \
            || { echo "FAIL: dns-tool check: $(cat /tmp/dns-tool-check.json)"; exit 1; }
          jq -e '.can_write == false and .caa.would_issue == true' /tmp/dns-tool-check.json >/dev/null || { echo "FAIL: dns-tool check plan: $(cat /tmp/dns-tool-check.json)"; exit 1; }
          if printf '%s' "$TOOL_IN" | docker compose run --rm -T dns-tool check >/dev/null 2>&1; then echo "FAIL: dns-tool check accepted credentials"; exit 1; fi
          echo "PASS: dns plan of $D pinned to the service's account; dns-tool apply / check (stdin credentials)"

          # Traefik picks it up by SNI through its HTTP provider, without a restart.
          sni_sans() { openssl s_client -connect 127.0.0.1:443 -servername "$1" </dev/null 2>/dev/null | openssl x509 -noout -ext subjectAltName 2>/dev/null | tail -n +2 | tr -d ' '; }
          for i in $(seq 1 25); do
            sni_sans "app.$D" | grep -q "DNS:\*\.$D" && break
            [ "$i" -eq 25 ] && { echo "FAIL: Traefik does not serve the $D certificate for app.$D: $(sni_sans "app.$D")"; docker compose logs --tail=40 traefik; exit 1; }
            sleep 1
          done
          [ "$(docker inspect -f '{{.State.StartedAt}}' "$(docker compose ps -q traefik)")" = "$TRAEFIK_STARTED" ] || { echo "FAIL: Traefik restarted"; exit 1; }
          for h in auth.portcullis.local hub.portcullis.local; do
            sni_sans "$h" | grep -q 'DNS:\*\.portcullis\.local' || { echo "FAIL: $h no longer serves the main certificate: $(sni_sans "$h")"; exit 1; }
          done
          echo "PASS: the $D certificate is served by SNI within ~25 s without a Traefik restart; auth and hub keep the main certificate"

          # The HTTP provider contributed nothing but certificates.
          tapi() { docker run --rm --network portcullis "$CURL_IMG" -sf "http://traefik:8080/api/$1"; }
          for ep in http/routers http/services http/middlewares tcp/routers tcp/services tcp/middlewares udp/routers udp/services; do
            tapi "$ep" | jq -e '[.[] | select((.provider // "") == "http" or ((.name // "") | endswith("@http")))] == []' >/dev/null \
              || { echo "FAIL: @http objects in /api/$ep: $(tapi "$ep" | jq -c '[.[] | select(.provider == "http") | .name]')"; exit 1; }
          done
          tapi rawdata | jq -e '[.. | objects | keys[] | select(endswith("@http"))] == []' >/dev/null \
            || { echo "FAIL: @http keys in /api/rawdata"; exit 1; }
          echo "PASS: Traefik's API lists no @http router / service / middleware / transport"

          # Delete: the certificate stops being served, the records go.
          code=$(dapi -o /dev/null -w '%{http_code}' -X DELETE "http://domains:8080/domains/$D")
          [ "$code" = 204 ] || { echo "FAIL: delete $D got $code"; exit 1; }
          dyn | jq -e '.tls.certificates == []' >/dev/null || { echo "FAIL: certificate still in the document after delete"; exit 1; }
          for i in $(seq 1 25); do
            sni_sans "app.$D" | grep -q "DNS:\*\.$D" || break
            [ "$i" -eq 25 ] && { echo "FAIL: Traefik still serves the deleted $D certificate"; exit 1; }
            sleep 1
          done
          [ "$(docker inspect -f '{{.State.StartedAt}}' "$(docker compose ps -q traefik)")" = "$TRAEFIK_STARTED" ] || { echo "FAIL: Traefik restarted"; exit 1; }
          # A domain that stays enrolled: the backup / restore test below checks it survives.
          code=$(dapi -o /dev/null -w '%{http_code}' -X PUT -d '{"provider":"fake","credentials":{"api_token":"ci-fake-token-0123456789"}}' http://domains:8080/domains/keep.ci-domains.test)
          [ "$code" = 202 ] || { echo "FAIL: enroll keep.ci-domains.test got $code"; exit 1; }
          echo "PASS: a deleted domain's certificate stops being served (no restart)"

      - name: Test mTLS authentication with client cert
        run: |
          # The Hub isn't running yet: a policy file v6 (contract §4) like the
          # Hub's fresh install writes (the four starting methods, Standard the
          # default, every gated core page on Standard; the later steps add
          # their keys to it). Without a file group-gate denies everything.
          jq -n '{version: 6, methods: ["passkey_device", "passkey_synced", "security_key", "yubikey_cert"],
                  templates: {standard: {op: "any", items: [{op: "any", items: ["passkey_synced", "passkey_device", "security_key"]},
                                                            {op: "any", items: ["yubikey_cert"]}]}},
                  default: "standard", hosts: {},
                  core: ([""] + ["directory.", "hub.", "metrics.", "people.", "traefik."]
                         | map({key: (. + "portcullis.local"), value: "standard"}) | from_entries),
                  people: {}, add_stronger: false, extra_domains: []}' > /tmp/ci-policy-v6.json
          docker run --rm -i -v portcullis_hub_data:/d alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
              sh -c 'cat > /d/group-gate-policy.json.tmp && chmod 644 /d/group-gate-policy.json.tmp && mv /d/group-gate-policy.json.tmp /d/group-gate-policy.json' \
            < /tmp/ci-policy-v6.json
          # ci-gated has no forward-auth, so the tests send the session headers
          # portcullis-auth would set, the access token included: group-gate
          # reads only its amr / preferred_username (oauth2-proxy verified it
          # upstream), so an unsigned stand-in per sign-in method will do.
          # mtls counts only with testuser's own unrevoked cert on the request.
          for m in mtls hwk spk; do
            printf 'CI_TOKEN_%s=%s\n' "${m^^}" "$(python3 -c 'import base64, json, sys
          b = lambda d: base64.urlsafe_b64encode(json.dumps(d).encode()).rstrip(b"=").decode()
          print(b({"alg": "HS256", "typ": "JWT"}) + "." + b({"preferred_username": "testuser", "amr": [sys.argv[1]]}) + ".c2ln")' "$m")"
          done >> "$GITHUB_ENV"
          # shellcheck disable=SC1090
          source <(sed 's/^/export /' "$GITHUB_ENV" | grep '^export CI_TOKEN_')
          mtls() { curl -s -o /tmp/mtls.out -w '%{http_code}' --cacert certs/ca-chain.crt \
                     --resolve "$1:443:127.0.0.1" "${@:2}" "https://$1/" || true; }

          code=$(mtls mtls.portcullis.local)
          [ "$code" = 000 ] || { echo "FAIL: protected tier accepted a request WITHOUT client cert ($code)"; exit 1; }
          echo "PASS: protected tier rejects missing client cert"

          code=$(mtls mtls.portcullis.local --cert /tmp/foreign.crt --key /tmp/foreign.key)
          [ "$code" = 000 ] || { echo "FAIL: protected tier accepted a cert from a foreign CA ($code)"; exit 1; }
          echo "PASS: protected tier rejects foreign-CA client cert"

          code=$(mtls gated.portcullis.local --cert /tmp/foreign.crt --key /tmp/foreign.key)
          [ "$code" = 000 ] || { echo "FAIL: authaware tier accepted a cert from a foreign CA ($code)"; exit 1; }
          echo "PASS: authaware tier rejects foreign-CA client cert"

          code=$(mtls mtls.portcullis.local --cert /tmp/test-client.crt --key /tmp/test-client.key)
          [ "$code" = 200 ] || { echo "FAIL: valid client cert got $code"; cat /tmp/mtls.out; exit 1; }
          grep -qi '^X-Forwarded-Tls-Client-Cert-Info:.*SerialNumber' /tmp/mtls.out \
            || { echo "FAIL: backend did not get cert info with SerialNumber"; cat /tmp/mtls.out; exit 1; }
          grep -q "^RemoteAddr: $TRAEFIK_IP:" /tmp/mtls.out \
            || { echo "FAIL: backend saw requests from a non-Traefik IP"; cat /tmp/mtls.out; exit 1; }
          echo "PASS: valid client cert accepted; backend sees cert info + Traefik's static IP"

          code=$(mtls gated.portcullis.local --cert /tmp/test-client.crt --key /tmp/test-client.key)
          [ "$code" = 403 ] || { echo "FAIL: group-gated router without a username got $code"; cat /tmp/mtls.out; exit 1; }
          echo "PASS: group-gate fails closed without X-Auth-Request-Preferred-Username"
          code=$(mtls gated.portcullis.local --cert /tmp/test-client.crt --key /tmp/test-client.key -H 'X-Auth-Request-Preferred-Username: testuser')
          if [ "$code" != 403 ] || ! grep -q 'id="stepup-continue"' /tmp/mtls.out; then
            echo "FAIL: a cert without a session (no amr) got $code, want the step-up page"; cat /tmp/mtls.out; exit 1
          fi
          echo "PASS: a client cert alone is no sign-in: the step-up page"
          code=$(mtls gated.portcullis.local -H 'X-Auth-Request-Preferred-Username: testuser' -H "X-Forwarded-Access-Token: $CI_TOKEN_MTLS")
          if [ "$code" != 403 ] || ! grep -q 'id="present-certificate"' /tmp/mtls.out; then
            echo "FAIL: an mtls session without the cert on the request got $code, want the present-certificate page"; cat /tmp/mtls.out; exit 1
          fi
          echo "PASS: an mtls session needs the certificate on the request (mTLS binding)"
          code=$(mtls gated.portcullis.local --cert /tmp/test-client.crt --key /tmp/test-client.key -H 'X-Auth-Request-Preferred-Username: testuser' \
                   -H "X-Forwarded-Access-Token: $CI_TOKEN_MTLS")
          [ "$code" = 200 ] || { echo "FAIL: group-gated router with valid cert got $code"; cat /tmp/mtls.out; exit 1; }
          echo "PASS: group-gated router accepts valid, unrevoked cert bound to the mtls session"

      - name: Test Keycloak X.509 login - via Traefik works, a forged cert header does not
        run: |
          # The Hub isn't running yet: write a minimal signin-keycloak.json
          # (contract §8.1, the starting methods) into hub_data, or the sign-in
          # extension denies everything (DENY_ALL). The Hub's start replaces it.
          printf '%s' '{"version":1,"methods":["passkey_device","passkey_synced","security_key","yubikey_cert"],"add_stronger":false,"templates":{"standard":{"op":"any","items":[{"op":"any","items":["passkey_synced","passkey_device","security_key"]},{"op":"any","items":["yubikey_cert"]}]}},"clients":{},"authenticators":{},"mds":{"serial":0,"next_update":"0001-01-01T00:00:00Z"}}' \
            | docker run --rm -i -v portcullis_hub_data:/d alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
                sh -c 'cat > /d/signin-keycloak.json.tmp && chmod 644 /d/signin-keycloak.json.tmp && mv /d/signin-keycloak.json.tmp /d/signin-keycloak.json'
          # pc_method=yubikey_cert = the YubiKey certificate only (the other
          # methods step aside); with confirmation disabled a successful cert
          # login answers 302 → redirect_uri?code=...
          # portcullis-forward-auth requires PKCE S256 (like oauth2-proxy sends):
          # S256 of the verifier ci-pkce-verifier-0123456789abcdefghijklmnopqrstuvwxyz.
          NOPKCE='/realms/portcullis/protocol/openid-connect/auth?client_id=portcullis-forward-auth&response_type=code&scope=openid&pc_method=yubikey_cert&prompt=login&state=ci&nonce=ci&redirect_uri=https%3A%2F%2Fauth.portcullis.local%2Foauth2%2Fcallback'
          AUTHQ="$NOPKCE&code_challenge=83JUujMAYgRhPwEoyXqFBcdcLnEjuT8NyjHlOlacyZo&code_challenge_method=S256"
          got_code() { grep -qiE '^location: .*[?&]code=' "$1"; }

          # 0) Without PKCE the forward-auth client issues no code (a stolen
          #    code for an extra-domain callback is useless without the verifier).
          curl -s -o /dev/null -D /tmp/kc-nopkce.h --cacert certs/ca-chain.crt \
            --cert /tmp/test-client.crt --key /tmp/test-client.key \
            --resolve "auth.portcullis.local:443:127.0.0.1" "https://auth.portcullis.local$NOPKCE" || true
          if got_code /tmp/kc-nopkce.h; then echo "FAIL: portcullis-forward-auth issued a code without PKCE"; cat /tmp/kc-nopkce.h; exit 1; fi
          echo "PASS: portcullis-forward-auth refuses authorization requests without PKCE"

          # 1) Positive control: a real TLS client cert through Traefik (also
          #    proves the CRL check + truststore re-validation pass).
          curl -s -o /dev/null -D /tmp/kc-ok.h --cacert certs/ca-chain.crt \
            --cert /tmp/test-client.crt --key /tmp/test-client.key \
            --resolve "auth.portcullis.local:443:127.0.0.1" "https://auth.portcullis.local$AUTHQ" || true
          got_code /tmp/kc-ok.h || { echo "FAIL: X.509 login through Traefik did not authenticate"; cat /tmp/kc-ok.h; docker compose logs --tail=60 keycloak; exit 1; }
          echo "PASS: X.509 login through Traefik (CRL checked, chain re-validated) issues a code"

          # 2) Forged header with that same valid, enrolled cert, sent straight
          #    to Keycloak from everywhere except Traefik's address. Turn off
          #    the realm's HTTPS requirement meanwhile, so plain-HTTP requests
          #    reach the X.509 authenticator and only the proxy-trust gate can
          #    stop them.
          KC_TOKEN=$(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=$KEYCLOAK_ADMIN" \
            --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token)
          [ -z "$KC_TOKEN" ] || [ "$KC_TOKEN" = null ] || echo "::add-mask::$KC_TOKEN"
          realm_ssl() { printf '{"sslRequired":"%s"}' "$1" | curl -sf -X PUT -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") \
            -H 'Content-Type: application/json' -d @- http://127.0.0.1:8080/admin/realms/portcullis; }
          realm_ssl none
          trap 'realm_ssl all' EXIT
          CERT_HDR="$(grep -v -- ----- /tmp/test-client.crt | tr -d '\n')"
          FORGE=(-H "X-Forwarded-Tls-Client-Cert: $CERT_HDR" -H "X-Forwarded-For: 172.31.251.2"
                 -H "X-Forwarded-Proto: https" -H "X-Forwarded-Trusted-Proxy: true")
          CURL_IMG=curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          BEFORE=$(docker compose logs keycloak 2>&1 | grep -c 'X-Forwarded-Tls-Client-Cert" is not trusted' || true)
          for net in portcullis portcullis-auth; do
            docker run --rm --network "$net" "$CURL_IMG" -s -o /dev/null -D - "${FORGE[@]}" "http://keycloak:8080$AUTHQ" > "/tmp/kc-forged-$net.h" || true
            grep -q '^HTTP/' "/tmp/kc-forged-$net.h" || { echo "FAIL: no answer from Keycloak on $net"; exit 1; }
            if got_code "/tmp/kc-forged-$net.h"; then echo "FAIL: forged cert header authenticated from the $net network"; exit 1; fi
          done
          curl -s -o /dev/null -D /tmp/kc-forged-host.h "${FORGE[@]}" "http://127.0.0.1:8080$AUTHQ" || true
          if got_code /tmp/kc-forged-host.h; then echo "FAIL: forged cert header authenticated via 127.0.0.1:8080"; exit 1; fi
          sleep 2
          AFTER=$(docker compose logs keycloak 2>&1 | grep -c 'X-Forwarded-Tls-Client-Cert" is not trusted' || true)
          [ "$AFTER" -ge $((BEFORE + 3)) ] || { echo "FAIL: Keycloak did not log the untrusted cert header 3x ($BEFORE → $AFTER)"; docker compose logs --tail=40 keycloak; exit 1; }
          echo "PASS: forged X-Forwarded-Tls-Client-Cert ignored from portcullis, portcullis-auth and 127.0.0.1:8080 (proxy-trust gate)"

          # 3) Vault keeps the CRL fresh, so crl-abort-if-non-updated=true never locks people out.
          VAULT_TOKEN=$(jq -r .root_token secrets/vault-init.json); export VAULT_TOKEN
          echo "::add-mask::$VAULT_TOKEN"
          vault read -format=json pki_int/config/crl | jq -e '.data.auto_rebuild == true and .data.enable_delta == true' >/dev/null \
            || { echo "FAIL: CRL auto_rebuild / enable_delta off: $(vault read -format=json pki_int/config/crl | jq -c .data)"; exit 1; }
          for crl in crl crl/delta; do
            NEXT=$(curl -sf "http://127.0.0.1:8200/v1/pki_int/$crl/pem" | openssl crl -noout -nextupdate | cut -d= -f2)
            [ -n "$NEXT" ] && [ "$(date -d "$NEXT" +%s)" -gt "$(date +%s)" ] || { echo "FAIL: Vault $crl is missing/stale (nextUpdate '$NEXT')"; exit 1; }
            echo "PASS: pki_int/$crl nextUpdate $NEXT"
          done
          echo "PASS: CRL auto-rebuild + delta CRL on (group-gate and Keycloak read both)"

      - name: Test client-cert headers cannot be spoofed and path rules see X-Forwarded-Uri
        run: |
          # (the gated router has no forward-auth: the username header is the test's)
          # (a security-key session: the stand-in token of the mTLS step)
          gated() { curl -s -o /dev/null -w '%{http_code}' --cacert certs/ca-chain.crt \
                      --resolve "gated.portcullis.local:443:127.0.0.1" -H 'X-Auth-Request-Preferred-Username: testuser' \
                      -H "X-Forwarded-Access-Token: $CI_TOKEN_HWK" "${@:2}" "https://gated.portcullis.local$1" || true; }
          policy() { docker run --rm -i -v portcullis_hub_data:/d alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
                       sh -c 'cat > /d/group-gate-policy.json.tmp && chmod 644 /d/group-gate-policy.json.tmp && mv /d/group-gate-policy.json.tmp /d/group-gate-policy.json'; }
          VAULT_TOKEN=$(jq -r .root_token secrets/vault-init.json); export VAULT_TOKEN
          echo "::add-mask::$VAULT_TOKEN"
          # Revoke a throwaway cert, then CLAIM it in spoofed headers (no TLS
          # client cert). If Traefik passed them through, group-gate would deny.
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/spoof.key
          openssl req -new -key /tmp/spoof.key -subj "/CN=testuser" -out /tmp/spoof.csr
          SN=$(vault write -format=json pki_int/sign/client-cert csr="$(cat /tmp/spoof.csr)" common_name=testuser ttl=1h | jq -r .data.serial_number)
          ./portcullis cert revoke --yes "$SN" >/dev/null
          DEC=$(python3 -c "print(int('${SN//:/}', 16))")
          INFO="Subject%3D%22CN%3Dtestuser%22%3BSerialNumber%3D%22$DEC%22"
          for h in "X-Forwarded-Tls-Client-Cert-Info: $INFO" "X_Forwarded_Tls_Client_Cert_Info: $INFO" "X-Forwarded-Tls-Client-Cert: MIIB"; do
            code=$(gated / -H "$h")
            [ "$code" = 200 ] || { echo "FAIL: spoofed '$h' reached group-gate ($code)"; docker compose logs --tail=10 group-gate; exit 1; }
          done
          echo "PASS: Traefik strips client-supplied client-cert headers (incl. aliases)"

          # path_groups through Traefik: group-gate only sees the path via
          # X-Forwarded-Uri set by Traefik's forwardAuth.
          jq '. + {groups: {"gated.portcullis.local": "users_ci"}, path_groups: {"gated.portcullis.local": [{prefix: "/admin", group: "admin_ci"}]}}' \
            /tmp/ci-policy-v6.json | policy
          # (the gated router has no forward-auth, so the groups header is the test's)
          for p in /admin /admin/x /%61dmin //admin /x/../admin /ADMIN '/admin;x=1' /admin%2fx; do
            code=$(gated "$p" --path-as-is -H 'X-Auth-Request-Groups: users_ci')
            [ "$code" = 403 ] || { echo "FAIL: $p without admin_ci got $code"; docker compose logs --tail=10 group-gate; exit 1; }
          done
          [ "$(gated /admin -H 'X-Auth-Request-Groups: users_ci,admin_ci')" = 200 ] || { echo "FAIL: admin_ci denied"; exit 1; }
          [ "$(gated /administrator -H 'X-Auth-Request-Groups: users_ci')" = 200 ] || { echo "FAIL: /administrator denied"; exit 1; }
          [ "$(gated /x%00 --path-as-is -H 'X-Auth-Request-Groups: users_ci')" = 403 ] || { echo "FAIL: NUL path allowed"; exit 1; }
          [ "$(gated / -H 'X-Auth-Request-Groups: other')" = 403 ] || { echo "FAIL: host group not enforced"; exit 1; }
          policy < /tmp/ci-policy-v6.json
          echo "PASS: path_groups enforced on Traefik's X-Forwarded-Uri (bypass variants denied)"

          # Attribute headers (contract §5): group-gate's reach the app, the
          # client's never do (whoami echoes the request headers).
          printf '%s' '{"version":2,"fields":{"city":"City"},"users":{"testuser":{"city":["Milan"]}},"hosts":{"gated.portcullis.local":{"Gated-Role":{"testuser":"Admin, Ops"}},"other.portcullis.local":{"Other-Role":{"testuser":"x"}}}}' \
            | docker run --rm -i -v portcullis_hub_data:/d alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
                sh -c 'cat > /d/user-attributes.json && chmod 644 /d/user-attributes.json'
          curl -s --cacert certs/ca-chain.crt --resolve "gated.portcullis.local:443:127.0.0.1" \
            -H 'X-Auth-Request-Preferred-Username: testuser' -H "X-Forwarded-Access-Token: $CI_TOKEN_HWK" -H 'X-Forwarded-Attr-City: Forged' -H 'X-Forwarded-Attr-Forged: x' \
            -H 'x-forwarded-attr-lower: x' -H 'X-Forwarded-Impersonator: root' -H "X-Forwarded-Impersonation: 0f3c$(printf 'a%.0s' $(seq 28))" \
            -H 'x-forwarded-impersonation: lower' https://gated.portcullis.local/ > /tmp/attrs.out || true
          grep -qx 'X-Forwarded-Attr-City: Milan' <(tr -d '\r' < /tmp/attrs.out) || { echo "FAIL: attribute header missing"; cat /tmp/attrs.out; exit 1; }
          # Per-host header (v2 `hosts`): this host's only, sent verbatim.
          grep -qx 'X-Forwarded-Attr-Gated-Role: Admin, Ops' <(tr -d '\r' < /tmp/attrs.out) || { echo "FAIL: per-host attribute header missing"; cat /tmp/attrs.out; exit 1; }
          if grep -qi 'Other-Role' /tmp/attrs.out; then echo "FAIL: another host's attribute header reached the app"; cat /tmp/attrs.out; exit 1; fi
          if grep -qi 'Forged\|attr-lower' /tmp/attrs.out; then echo "FAIL: client-sent X-Forwarded-Attr-* reached the app"; cat /tmp/attrs.out; exit 1; fi
          # Sign-in part 3 (contract §5): group-gate's impersonation headers only; client copies deleted.
          if grep -qi 'Impersonat' /tmp/attrs.out; then echo "FAIL: a client-sent X-Forwarded-Impersonat* reached the app"; cat /tmp/attrs.out; exit 1; fi
          echo "PASS: attribute headers from user-attributes.json; client copies (and of the impersonation headers) stripped"

          # directory.<domain> redirects to the Hub's directory (people.<domain>).
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' --cacert certs/ca-chain.crt \
                  --resolve "directory.portcullis.local:443:127.0.0.1" https://directory.portcullis.local/x || true)
          [ "$loc" = "https://people.portcullis.local/" ] || { echo "FAIL: directory.<domain> redirects to '$loc'"; exit 1; }
          echo "PASS: directory.<domain> → https://people.<domain>/"

      - name: Test the public guard (public exceptions) through Traefik
        run: |
          pub() { curl -s -o /dev/null -w '%{http_code}' --cacert certs/ca-chain.crt \
                    --resolve "public.portcullis.local:443:127.0.0.1" "${@:2}" "https://public.portcullis.local$1" || true; }
          policy() { docker run --rm -i -v portcullis_hub_data:/d alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
                       sh -c 'cat > /d/group-gate-policy.json.tmp && chmod 644 /d/group-gate-policy.json.tmp && mv /d/group-gate-policy.json.tmp /d/group-gate-policy.json'; }
          # No public_paths entry (or an older file version / subdomain keys): denied.
          policy < /tmp/ci-policy-v6.json
          [ "$(pub /s/AbC123)" = 403 ] || { echo "FAIL: public path allowed without a v6 public_paths entry"; exit 1; }
          PP='{"paths":[{"path":"/s/{token}","match":"prefix"}],"token_pattern":"^[A-Za-z0-9-]{1,32}$"}'
          for old in "{\"version\":4,\"public_paths\":{\"public\":$PP}}" \
                     "{\"version\":5,\"public_paths\":{\"public.portcullis.local\":$PP}}" \
                     "$(jq -c --argjson pp "$PP" '. + {version: 5, public_paths: {"public.portcullis.local": $pp}}' /tmp/ci-policy-v6.json)" \
                     "$(jq -c --argjson pp "$PP" '. + {public_paths: {public: $pp}}' /tmp/ci-policy-v6.json)"; do
            echo "$old" | policy
            [ "$(pub /s/AbC123)" = 403 ] || { echo "FAIL: public path allowed by $old"; exit 1; }
          done
          jq '. + {public_paths: {"public.portcullis.local": {
                    paths: [{path: "/s/{token}", match: "prefix"}, {path: "/dist", match: "static"}],
                    token_pattern: "^[A-Za-z0-9-]{1,32}$", static_extensions: ["js", "css"],
                    credential_headers: ["X-Api-Key"], credential_cookies: ["nc_token"], credential_query: ["auth_token"]}}}' \
            /tmp/ci-policy-v6.json | policy
          for p in /s/AbC123 /s/AbC123/download /dist/core-common.js; do
            [ "$(pub "$p")" = 200 ] || { echo "FAIL: public $p denied"; docker compose logs --tail=10 group-gate; exit 1; }
          done
          for p in / /s /x /dist/a.php /dist/x.php/a.js /s/a.b /s/AbC%2Fx /s/AbC%23x /s/AbC123/../../x; do
            [ "$(pub "$p" --path-as-is)" = 403 ] || { echo "FAIL: non-public $p allowed"; exit 1; }
          done
          for h in "Authorization: Basic YWRtaW46eA==" "Proxy-Authorization: x" "X-Api-Key: k" \
                   "Cookie: nc_token=x" "Cookie: a=1; nc.token=x" "Cookie:  nc[token=x" "Cookie: nc_token[]=x" "Cookie: NC%5Ftoken=x"; do
            [ "$(pub /s/AbC123 -H "$h")" = 403 ] || { echo "FAIL: credential '$h' passed the public guard"; exit 1; }
          done
          for q in auth_token=x auth.token=x +auth_token=x 'auth_token%5B%5D=x' auth%5Ftoken=x; do
            [ "$(pub "/s/AbC123?$q")" = 403 ] || { echo "FAIL: credential query $q passed the public guard"; exit 1; }
          done
          # No forward-auth on public routers: the guard's regex deletes forged attribute headers.
          curl -s --cacert certs/ca-chain.crt --resolve "public.portcullis.local:443:127.0.0.1" \
            -H 'X-Forwarded-Attr-City: Forged' https://public.portcullis.local/s/AbC123 > /tmp/pub-attrs.out || true
          grep -q 'Hostname' /tmp/pub-attrs.out || { echo "FAIL: public path not served"; cat /tmp/pub-attrs.out; exit 1; }
          if grep -qi 'Forged' /tmp/pub-attrs.out; then echo "FAIL: forged X-Forwarded-Attr-* reached a public router's app"; exit 1; fi
          policy < /tmp/ci-policy-v6.json
          echo "PASS: public guard: only published paths, no credentials (PHP-normalised names)"

      - name: Test the socket proxies
        run: |
          # Traefik's proxy: read-only, containers/networks/events/version only.
          # busybox wget -S prints the status line ("HTTP/1.1 403 ...") also on errors.
          tp() { docker compose exec -T traefik wget -q -O /dev/null -S "$@" 2>&1 | grep -o 'HTTP/[0-9.]* [0-9]*' | tail -n1 | cut -d' ' -f2; }
          [ "$(tp http://socket-proxy-traefik:2375/version)" = 200 ] || { echo "FAIL: traefik proxy /version"; exit 1; }
          [ "$(tp http://socket-proxy-traefik:2375/containers/json)" = 200 ] || { echo "FAIL: traefik proxy /containers/json"; exit 1; }
          for denied in /images/json /info /volumes /secrets /swarm /system/df; do
            [ "$(tp "http://socket-proxy-traefik:2375$denied")" = 403 ] || { echo "FAIL: traefik proxy allowed $denied"; exit 1; }
          done
          [ "$(tp --post-data='{}' --header 'Content-Type: application/json' http://socket-proxy-traefik:2375/containers/create)" = 403 ] \
            || { echo "FAIL: traefik proxy allowed a POST"; exit 1; }
          # The libpod API (rootless Podman's native API: play kube, generate,
          # ...) and /build never pass either proxy (contract §6).
          for denied in /libpod/info /libpod/play/kube /v5.0.0/libpod/containers/json /build; do
            [ "$(tp "http://socket-proxy-traefik:2375$denied")" = 403 ] || { echo "FAIL: traefik proxy allowed $denied"; exit 1; }
          done
          echo "PASS: socket-proxy-traefik is read-only and minimal (libpod and /build denied)"

          # Hub's proxy: run real `docker compose` through it, like the Hub does.
          docker compose up -d socket-proxy-hub
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q socket-proxy-hub)")" = healthy ] && break; sleep 2
          done
          NET="$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q socket-proxy-hub)")"
          mkdir -p /tmp/hubproj && cat > /tmp/hubproj/compose.yml <<'YML'
          services:
            web:
              image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
              volumes: [data:/data]
              networks: [portcullis-proxy, default]
          volumes:
            data:
          networks:
            portcullis-proxy:
              external: true
          YML
          sed -i 's/^          //' /tmp/hubproj/compose.yml
          dcli() { docker run --rm --network "$NET" -e DOCKER_HOST=tcp://socket-proxy-hub:2375 -v /tmp/hubproj:/p:ro -w /p \
                     docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb "$@"; }
          dcli docker compose -p ci-hubproxy up -d --pull missing || { docker compose logs --tail=30 socket-proxy-hub; echo "FAIL: compose up through socket-proxy-hub"; exit 1; }
          dcli docker compose -p ci-hubproxy ps --format json | grep -q '"State":"running"' || { echo "FAIL: compose ps"; exit 1; }
          dcli docker compose -p ci-hubproxy logs web >/dev/null || { echo "FAIL: compose logs"; exit 1; }
          dcli docker compose -p ci-hubproxy exec -T web /whoami --help >/dev/null 2>&1 || dcli docker compose -p ci-hubproxy top >/dev/null 2>&1 || true
          dcli docker compose -p ci-hubproxy restart web || { echo "FAIL: compose restart"; exit 1; }
          dcli docker compose -p ci-hubproxy down -v || { echo "FAIL: compose down -v"; exit 1; }
          for denied in "docker swarm init" "docker system df" "docker plugin ls" "docker secret ls" "docker node ls"; do
            # shellcheck disable=SC2086
            if dcli $denied >/dev/null 2>&1; then echo "FAIL: socket-proxy-hub allowed: $denied"; exit 1; fi
          done
          # The libpod API and /build: 403 on the Hub's proxy too, GET and POST
          # (its POST=1 allows writes only on the allowed sections).
          hp() { docker run --rm --network "$NET" --entrypoint wget \
                   docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb \
                   -q -O /dev/null -S "$@" 2>&1 | grep -o 'HTTP/[0-9.]* [0-9]*' | tail -n1 | cut -d' ' -f2; }
          for denied in /libpod/info /libpod/play/kube /v5.0.0/libpod/containers/json /build; do
            [ "$(hp "http://socket-proxy-hub:2375$denied")" = 403 ] || { echo "FAIL: socket-proxy-hub allowed GET $denied"; exit 1; }
            [ "$(hp --post-data='{}' --header 'Content-Type: application/json' "http://socket-proxy-hub:2375$denied")" = 403 ] \
              || { echo "FAIL: socket-proxy-hub allowed POST $denied"; exit 1; }
          done
          echo "PASS: docker compose up/ps/logs/restart/down -v work through socket-proxy-hub; swarm/system/plugins/secrets/nodes, libpod and /build denied"

      - name: Test the Hub (non-root, socket proxy, proxy secret)
        run: |
          if [ -z "${HUB_LOCAL:-}" ] && ! docker compose pull --quiet hub; then
            echo "::warning::Hub image $(docker compose config --format json | jq -r .services.hub.image) cannot be pulled — skipping the Hub test"
            exit 0
          fi
          # The Hub's admin routes (GET /api/signin here, the sign-in API in
          # reset-core's step) check the actor in LLDAP with the Hub's service
          # account, which `portcullis up` reconciles later in this job: set
          # it up now with the same function.
          # shellcheck disable=SC1090
          PORTCULLIS_LIB="$PWD/scripts/lib" bash -c 'set -euo pipefail
            for l in common network vault pki certs keycloak users domains mcpgate dns config status monitoring backup signin stack; do
              source "$PORTCULLIS_LIB/$l.sh"
            done
            lldap_service_account' | tee /tmp/hub-sa.out
          grep -qE 'portcullis-hub: password (matches|set from) secrets/hub/lldap/password' /tmp/hub-sa.out \
            || { echo "FAIL: the Hub's LLDAP service account"; exit 1; }
          docker compose up -d hub
          HUB_CID="$(docker compose ps -q hub)"
          test "$(docker inspect -f '{{json .HostConfig.Binds}}' "$HUB_CID" | grep -c docker.sock)" = 0 || { echo "FAIL: hub mounts docker.sock"; exit 1; }
          HUB_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis").IPAddress}}' "$HUB_CID")
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "http://$HUB_IP:8888/healthz")" = 200 ] && break
            [ "$i" -eq 30 ] && { echo "FAIL: hub /healthz"; docker compose logs --tail=40 hub; exit 1; }
            sleep 2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://$HUB_IP:8888/")
          case "$code" in 401|403) ;; *) echo "FAIL: hub without proxy secret got $code"; exit 1 ;; esac
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H @<(printf 'X-Portcullis-Proxy-Secret: %s\n' "$SECRET") "http://$HUB_IP:8888/")
          case "$code" in 401|403|000) echo "FAIL: hub WITH proxy secret got $code"; docker compose logs --tail=20 hub; exit 1 ;; esac
          docker compose exec -T hub sh -c 'test "$(id -u)" = 10001 && test -w /project/templates && test -w /project/appfiles && ! grep -q POSTGRES_PASSWORD /project/.env && docker version >/dev/null' \
            || { echo "FAIL: hub runtime (uid / templates / env subset / DOCKER_HOST)"; docker compose logs --tail=20 hub; exit 1; }
          echo "PASS: Hub runs as 10001 without the socket, sees only the env subset, enforces the proxy secret"

          # Template sources: the Hub synced them at start (status file) and
          # syncs again on SIGHUP — what `./portcullis upgrade` does (hub_sources_sync).
          OUT="$(bash -c 'source scripts/lib/common.sh; source scripts/lib/status.sh; hub_sources_sync 40' 2>&1)"
          echo "$OUT"
          echo "$OUT" | grep -q 'template source portcullis: \(updated to\|up to date\)' \
            || { echo "FAIL: upgrade's template sync"; docker compose logs --tail=30 hub; exit 1; }
          docker compose exec -T hub cat /data/source-sync.json | jq -e '.trigger == "signal" and .ok and (.running | not)' >/dev/null \
            || { echo "FAIL: source-sync.json: $(docker compose exec -T hub cat /data/source-sync.json)"; exit 1; }
          [ "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' "$HUB_CID")" = "true 0" ] || { echo "FAIL: the Hub did not survive SIGHUP"; exit 1; }
          docker compose logs hub | grep -q 'sync on SIGHUP finished (ok=true)' || { echo "FAIL: no SIGHUP sync in the Hub log"; exit 1; }
          echo "PASS: the Hub syncs its template sources at start and on SIGHUP; upgrade prints the result"

          # Product default (contract §4, §8.1): on a fresh install the Hub
          # publishes policy file v6 with the four starting methods, Standard
          # (any passkey or a YubiKey certificate) the default and Strong
          # (security key or certificate) on hub / people, and group-gate
          # applies the default to every app host without its own pick — here
          # the ci-gated test app.
          hubapi() { curl -s -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$SECRET") "$@"; }
          policy_file() { docker run --rm -v portcullis_hub_data:/d:ro alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a cat /d/group-gate-policy.json 2>/dev/null; }
          gated() { curl -s -o /dev/null -w '%{http_code}' --cacert certs/ca-chain.crt \
                      --resolve "gated.portcullis.local:443:127.0.0.1" -H 'X-Auth-Request-Preferred-Username: testuser' \
                      --cert /tmp/test-client.crt --key /tmp/test-client.key "$@" https://gated.portcullis.local/ || true; }
          STANDARD='{"op":"any","items":[{"op":"any","items":["passkey_synced","passkey_device","security_key"]},{"op":"any","items":["yubikey_cert"]}]}'
          for i in $(seq 1 30); do
            policy_file | jq -e --argjson std "$STANDARD" '.version == 6 and .methods == ["passkey_device", "passkey_synced", "security_key", "yubikey_cert"]
                and .default == "standard" and .templates.standard == $std
                and .templates.strong == {op: "any", items: ["security_key", "yubikey_cert"]}
                and .core["hub.portcullis.local"] == "strong" and .core["people.portcullis.local"] == "strong"
                and .core["portcullis.local"] == "standard" and (.extra_domains | type) == "array" and .add_stronger == false' >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "FAIL: the Hub did not publish the fresh-install v6 policy: $(policy_file)"; docker compose logs --tail=20 hub; exit 1; }
            sleep 2
          done
          hubapi "http://$HUB_IP:8888/api/signin" | jq -e '.default == "standard" and ([.methods[] | select(.on) | .id] | sort) == ["passkey_device", "passkey_synced", "security_key", "yubikey_cert"]' >/dev/null \
            || { echo "FAIL: GET /api/signin on a fresh Hub: $(hubapi "http://$HUB_IP:8888/api/signin" | head -c 600)"; exit 1; }
          # Log lines are counted before and after each request: the mTLS
          # step already logged the same kind of line for this host.
          gg_count() { docker compose logs group-gate > /tmp/gg.log 2>&1; grep -cE "$1" /tmp/gg.log || true; }
          gg_grew() { local i; for i in $(seq 1 10); do [ "$(gg_count "$1")" -gt "$2" ] && return 0; sleep 1; done; return 1; }
          STEP_RE='STEPUP user=testuser host=gated\.portcullis\.local amr=\[\] have=\[\] pc_method=(passkey|passkey_synced|passkey_device|security_key|yubikey_cert)$'
          n0=$(gg_count "$STEP_RE")
          code=$(gated)
          [ "$code" = 403 ] || { echo "FAIL: gated app under the Standard default without a session got $code"; exit 1; }
          gg_grew "$STEP_RE" "$n0" \
            || { echo "FAIL: group-gate did not step up under the Standard default"; docker compose logs --tail=10 group-gate; exit 1; }
          for t in "$CI_TOKEN_SPK" "$CI_TOKEN_HWK" "$CI_TOKEN_MTLS"; do
            [ "$(gated -H "X-Forwarded-Access-Token: $t")" = 200 ] || { echo "FAIL: a session meeting Standard denied: $(gated -H "X-Forwarded-Access-Token: $t")"; exit 1; }
          done
          echo "PASS: fresh Hub publishes policy v6 (Standard the default, Strong on hub / people); group-gate steps up apps without their own pick"

          # An admin change through the sign-in API reaches group-gate: Strong
          # as the default refuses the synced passkey (the step-up asks for a
          # security key or the certificate, or needs-stronger when the Hub's
          # inventory knows testuser has neither) and keeps the YubiKey
          # certificate; then back to Standard.
          setdef() { printf '{"template":"%s"}' "$1" | hubapi -o /tmp/setdef.json -w '%{http_code}' -X PUT -H 'Content-Type: application/json' \
                       --data-binary @- "http://$HUB_IP:8888/api/signin/default"; }
          STRONG_RE="(STEPUP|NEEDS-STRONGER) user=testuser host=gated\\.portcullis\\.local amr=\\['spk'\\] have=\\['passkey_synced'\\] (pc_method=(security_key|yubikey_cert)|set_up=.*)$"
          n0=$(gg_count "$STRONG_RE")
          [ "$(setdef strong)" = 200 ] || { echo "FAIL: PUT /api/signin/default strong: $(head -c 400 /tmp/setdef.json)"; exit 1; }
          for i in $(seq 1 30); do
            policy_file | jq -e '.default == "strong"' >/dev/null 2>&1 && [ "$(gated -H "X-Forwarded-Access-Token: $CI_TOKEN_SPK")" = 403 ] && break
            [ "$i" -eq 30 ] && { echo "FAIL: group-gate does not enforce the Strong default: $(policy_file)"; docker compose logs --tail=10 group-gate; exit 1; }
            sleep 2
          done
          gg_grew "$STRONG_RE" "$n0" \
            || { echo "FAIL: no step-up / needs-stronger page for a synced session under Strong"; docker compose logs --tail=10 group-gate; exit 1; }
          [ "$(gated -H "X-Forwarded-Access-Token: $CI_TOKEN_MTLS")" = 200 ] || { echo "FAIL: a bound mtls session denied under Strong"; exit 1; }
          [ "$(gated -H "X-Forwarded-Access-Token: $CI_TOKEN_HWK")" = 200 ] || { echo "FAIL: a security-key session denied under Strong"; exit 1; }
          [ "$(setdef standard)" = 200 ] || { echo "FAIL: PUT /api/signin/default standard: $(head -c 400 /tmp/setdef.json)"; exit 1; }
          for i in $(seq 1 30); do
            policy_file | jq -e '.default == "standard"' >/dev/null 2>&1 && [ "$(gated -H "X-Forwarded-Access-Token: $CI_TOKEN_SPK")" = 200 ] && break
            [ "$i" -eq 30 ] && { echo "FAIL: group-gate still enforces Strong: $(policy_file)"; exit 1; }
            sleep 2
          done
          echo "PASS: an admin's default change (PUT /api/signin/default) is published and enforced by group-gate"

      - name: Test the MCP gate (non-root, pinned address, secrets, access log, MCP routes without forward-auth)
        run: |
          set -o pipefail
          ALPINE=alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          # The CLI of the image: usage on a bad command (exit 2), keygen
          # prints one identity with its recipient (never kept here).
          rc=0; docker run --rm --network none --read-only --cap-drop ALL portcullis-mcp-gate --help 2>/tmp/gate-help >/dev/null || rc=$?
          if [ "$rc" != 2 ] || ! grep -q 'usage: mcp-gate \[serve|keygen|healthcheck\]' /tmp/gate-help; then
            echo "FAIL: mcp-gate --help (rc=$rc): $(cat /tmp/gate-help)"; exit 1
          fi
          docker run --rm --network none --read-only --cap-drop ALL portcullis-mcp-gate keygen \
            | awk '/^# public key: age1[0-9a-z]+$/ {p++} /^AGE-SECRET-KEY-1[0-9A-Z]+$/ {k++} END {exit !(p == 1 && k == 1)}' \
            || { echo "FAIL: mcp-gate keygen"; exit 1; }
          rc=0; docker run --rm --network none --read-only --cap-drop ALL portcullis-mcp-gate healthcheck || rc=$?
          [ "$rc" = 1 ] || { echo "FAIL: healthcheck without a running gate exited $rc"; exit 1; }
          # Secrets made by ./portcullis (mcpgate_ensure_secrets): modes, groups, recipient = the key's.
          test "$(stat -c '%a' secrets/mcp-gate)" = 700 || { echo "FAIL: secrets/mcp-gate is not 0700"; exit 1; }
          for f in age.key:10005 age.pub:10001 hub-secret:10001; do
            test "$(stat -c '%a %g' "secrets/mcp-gate/${f%%:*}")" = "640 ${f#*:}" || { echo "FAIL: secrets/mcp-gate/${f%%:*}: $(stat -c '%a %g' "secrets/mcp-gate/${f%%:*}")"; exit 1; }
          done
          grep -qx "# public key: $(cat secrets/mcp-gate/age.pub)" secrets/mcp-gate/age.key || { echo "FAIL: age.pub is not age.key's recipient"; exit 1; }
          [ "$(tr -d '\n' < secrets/mcp-gate/hub-secret | wc -c)" = 48 ] || { echo "FAIL: hub-secret is not 48 characters"; exit 1; }
          if ! grep -qx 'PORTCULLIS_MCP_GATE_IP=172.31.250.3' secrets/hub/core.env || grep -q 'MCP.*SECRET' secrets/hub/core.env; then
            echo "FAIL: core.env lacks PORTCULLIS_MCP_GATE_IP (or carries a gate secret)"; exit 1
          fi

          docker compose up -d mcp-gate
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q mcp-gate)")" = healthy ] && break
            [ "$i" -eq 40 ] && { echo "FAIL: mcp-gate not healthy"; docker compose logs --tail=40 mcp-gate; exit 1; }
            sleep 3
          done
          CID="$(docker compose ps -q mcp-gate)"
          docker inspect "$CID" | jq -e '.[0] as $c
              | $c.Config.User == "10005:10005" and $c.HostConfig.GroupAdd == ["10001"]
              and $c.HostConfig.ReadonlyRootfs == true and $c.HostConfig.CapDrop == ["ALL"]
              and ($c.HostConfig.SecurityOpt | index("no-new-privileges:true")) != null
              and ($c.HostConfig.Privileged | not)
              and ([$c.Mounts[] | select(.Source | test("docker\\.sock"))] == [])
              and ($c.NetworkSettings.Networks | keys | sort) == ["portcullis-mcp", "portcullis-proxy"]
              and $c.NetworkSettings.Networks["portcullis-proxy"].IPAddress == "172.31.250.3"
              and ($c.HostConfig.PortBindings // {} | length) == 0' >/dev/null \
            || { echo "FAIL: mcp-gate container (user, group 10001 only, read-only, caps, socket, networks, address)"; exit 1; }
          [ "$(docker exec "$CID" id -G)" = "10005 10001" ] || { echo "FAIL: mcp-gate groups: $(docker exec "$CID" id -G)"; exit 1; }
          # portcullis-mcp: exactly the gate, Keycloak and the Hub; the gate
          # reaches Keycloak's JWKS (and resolves hub) there, and no other core service.
          docker network inspect portcullis-mcp | jq -e '.[0].Internal == true and .[0].IPAM.Config[0].Subnet == "172.31.253.0/28"' >/dev/null \
            || { echo "FAIL: portcullis-mcp network (internal, subnet)"; exit 1; }
          # keycloak / hub come from /etc/hosts (extra_hosts), pinned to their
          # portcullis-mcp addresses, which really are theirs.
          docker exec "$CID" cat /etc/hosts > /tmp/gate-hosts
          if ! grep -qE '^172\.31\.253\.2[[:space:]]+keycloak$' /tmp/gate-hosts || ! grep -qE '^172\.31\.253\.3[[:space:]]+hub$' /tmp/gate-hosts; then
            echo "FAIL: the gate's /etc/hosts lacks the pinned keycloak / hub:"; cat /tmp/gate-hosts; exit 1
          fi
          for s in keycloak:172.31.253.2 hub:172.31.253.3; do
            got="$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis-mcp").IPAddress}}' "$(docker compose ps -q "${s%%:*}")")"
            [ "$got" = "${s#*:}" ] || { echo "FAIL: ${s%%:*} is $got on portcullis-mcp (pinned ${s#*:})"; exit 1; }
          done
          docker exec "$CID" wget -q -T 5 -O /dev/null http://keycloak:8080/realms/portcullis/protocol/openid-connect/certs \
            || { echo "FAIL: the gate can't read Keycloak's JWKS over portcullis-mcp"; exit 1; }
          # No other core service is reachable by name from the gate.
          for other in lldap vault postgres group-gate enroll domains forward-auth socket-proxy-hub; do
            if out="$(docker exec "$CID" nslookup "$other" 2>&1)"; then
              echo "FAIL: the gate resolves $other (it must reach only Keycloak and the Hub): $out"; exit 1
            fi
          done
          if docker exec "$CID" sh -c 'touch /x' 2>/dev/null; then echo "FAIL: mcp-gate rootfs is writable"; exit 1; fi
          docker exec "$CID" mcp-gate healthcheck || { echo "FAIL: mcp-gate healthcheck in the container"; exit 1; }
          # G29: the access log and its directory (gate-owned, group 10001: the Hub's read-only mount).
          docker run --rm -v portcullis_mcp_gate_data:/d:ro "$ALPINE" stat -c '%n %a %u %g' /d /d/access.jsonl > /tmp/gate-log-mode
          [ "$(cat /tmp/gate-log-mode)" = "$(printf '/d 750 10005 10001\n/d/access.jsonl 640 10005 10001')" ] \
            || { echo "FAIL: access log modes: $(cat /tmp/gate-log-mode)"; exit 1; }

          # Through Traefik: no MCP route runs forward-auth (no sign-in
          # redirect, no cookie), the gate answers (no mcp-gate.json yet: AI
          # support off), hub.<d>/mcp and people.<d>/mcp outrank the Hub's
          # forward-auth routers, every other path of those hosts doesn't
          # reach the gate.
          mcp_req() { curl -s -o /tmp/mcp-body -D /tmp/mcp-hdr -w '%{http_code}' --cacert certs/ca-chain.crt \
                        --resolve "$1:443:127.0.0.1" "${@:3}" "https://$1$2" || true; }
          for t in mcp.portcullis.local/mcp mcp.portcullis.local/.well-known/oauth-protected-resource/mcp \
                   hub.portcullis.local/mcp hub.portcullis.local/.well-known/oauth-protected-resource/mcp \
                   people.portcullis.local/mcp people.portcullis.local/.well-known/oauth-protected-resource/mcp; do
            code="$(mcp_req "${t%%/*}" "/${t#*/}" -X POST -H 'Content-Type: application/json' -H 'Cookie: _oauth2_proxy=x' --data '{}')"
            [ "${t#*/}" = mcp ] || code="$(mcp_req "${t%%/*}" "/${t#*/}")"
            if [ "$code" != 503 ] || ! grep -q 'AI support is off' /tmp/mcp-body; then
              echo "FAIL: https://$t → $code (want the gate's 503 'AI support is off'): $(head -c 300 /tmp/mcp-body)"; cat /tmp/mcp-hdr; exit 1
            fi
            if grep -qi '^set-cookie:' /tmp/mcp-hdr; then echo "FAIL: https://$t set a cookie"; exit 1; fi
          done
          for t in hub.portcullis.local/ hub.portcullis.local/mcp/x people.portcullis.local/ people.portcullis.local/.well-known/oauth-protected-resource; do
            code="$(mcp_req "${t%%/*}" "/${t#*/}")"
            if [ "$code" = 503 ] && grep -q 'AI support is off' /tmp/mcp-body; then echo "FAIL: https://$t reached the gate"; exit 1; fi
          done
          # To a file first: under pipefail, `logs | grep -q` fails when grep
          # exits early and compose gets SIGPIPE.
          docker compose logs mcp-gate > /tmp/mcp-gate.log 2>&1
          grep -q 'mcp-gate: listening on :8080' /tmp/mcp-gate.log || { echo "FAIL: no listening line"; tail -20 /tmp/mcp-gate.log; exit 1; }
          if grep -qE 'eyJ|AGE-SECRET-KEY|_oauth2_proxy' /tmp/mcp-gate.log; then echo "FAIL: a token, key or cookie in the gate's log"; exit 1; fi
          # Refusals reach the access log (one line per request, decision deny:off).
          docker run --rm -v portcullis_mcp_gate_data:/d:ro "$ALPINE" cat /d/access.jsonl > /tmp/gate-access.jsonl
          jq -se 'length >= 3 and all(.decision == "deny:off" and .user == "" and .client == "")' /tmp/gate-access.jsonl >/dev/null \
            || { echo "FAIL: access log after the refused requests:"; cat /tmp/gate-access.jsonl; exit 1; }
          if [ -n "$(docker compose ps -q hub)" ]; then
            docker compose exec -T hub sh -c 'test -r /run/portcullis/mcp-gate/hub-secret && test -r /run/portcullis/mcp-gate/age.pub && test -r /mcp-gate-data/access.jsonl && ! touch /mcp-gate-data/x 2>/dev/null' \
              || { echo "FAIL: the Hub's gate files (secret, recipient, read-only access log)"; exit 1; }
          fi
          echo "PASS: mcp-gate healthy as 10005 (+10001 only) at 172.31.250.3, read-only, secrets 0640 by group, access log 0640/0750 group 10001 read-only in the Hub, MCP routes reach the gate without forward-auth or cookies"

      - name: Test signin reset-core (lockout recovery, as uid 10001)
        run: |
          set -o pipefail
          if [ -z "$(docker compose ps -q hub)" ]; then
            echo "::warning::the Hub isn't running (its test was skipped) — skipping signin reset-core"; exit 0
          fi
          ALPINE=alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"
          hub_ip() { docker inspect -f '{{(index .NetworkSettings.Networks "portcullis").IPAddress}}' "$(docker compose ps -q hub)"; }
          hubadmin() { curl -s -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$SECRET") "$@"; }
          method_on() { hubadmin "http://$(hub_ip):8888/api/signin" | jq -r --arg m "$1" '.methods[] | select(.id == $m) | .on'; }
          # Something for the reset to undo: switch passkey_synced off through the Hub's API
          # (no administrator has a passkey yet, so the lockout guard lets it through with a warning).
          code=$(printf '%s' '{"on":false}' | hubadmin -o /tmp/method.json -w '%{http_code}' -X PUT -H 'Content-Type: application/json' \
                   --data-binary @- "http://$(hub_ip):8888/api/signin/methods/passkey_synced")
          [ "$code" = 200 ] || { echo "FAIL: switching passkey_synced off answered $code: $(head -c 300 /tmp/method.json)"; exit 1; }
          [ "$(method_on passkey_synced)" = false ] || { echo "FAIL: passkey_synced still on before the reset"; exit 1; }
          core_picks() { hubadmin "http://$(hub_ip):8888/api/signin" | jq -c '[.core.hub, .core.people]'; }
          [ "$(core_picks)" = '["strong","strong"]' ] || { echo "FAIL: hub / people before the reset: $(core_picks) (want Strong, the fresh install's)"; exit 1; }
          rc=0; ./portcullis signin reset-core </dev/null >/tmp/reset.out 2>&1 || rc=$?
          [ "$rc" = 2 ] || { echo "FAIL: reset-core without --yes and no tty exited $rc (want 2)"; cat /tmp/reset.out; exit 1; }
          ./portcullis signin reset-core --yes 2>&1 | tee /tmp/reset.out
          grep -q 'method passkey_synced: off -> on' /tmp/reset.out || { echo "FAIL: the reset didn't report switching passkey_synced back on"; exit 1; }
          if grep -q 'nothing to change' /tmp/reset.out; then echo "FAIL: the reset changed nothing"; exit 1; fi
          [ "$(docker inspect -f '{{.State.Running}}' "$(docker compose ps -q hub)")" = true ] || { echo "FAIL: the Hub is not running again"; exit 1; }
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "http://$(hub_ip):8888/healthz")" = 200 ] && break
            [ "$i" -eq 30 ] && { echo "FAIL: hub /healthz after reset-core"; docker compose logs --tail=40 hub; exit 1; }
            sleep 2
          done
          [ "$(method_on passkey_synced)" = true ] || { echo "FAIL: passkey_synced still off after the reset"; exit 1; }
          # The reset puts hub and people on Standard (contract §8.1 "Lockout guard").
          [ "$(core_picks)" = '["standard","standard"]' ] || { echo "FAIL: hub / people after the reset: $(core_picks) (want standard)"; exit 1; }
          # The files the reset wrote (state.yaml is rewritten atomically: a new
          # inode owned by the run's uid; audit.jsonl appended; the data dir's
          # lock) must be the Hub user's — a root run would leave them root's.
          docker run --rm --network none -v portcullis_hub_data:/d:ro "$ALPINE" \
              stat -c '%n %u:%g' /d/state.yaml /d/audit.jsonl /d/.hub.lock > /tmp/reset-owners
          cat /tmp/reset-owners
          [ "$(awk '$2 != "10001:10001"' /tmp/reset-owners)" = "" ] && [ "$(wc -l < /tmp/reset-owners)" = 3 ] \
            || { echo "FAIL: files the reset wrote aren't owned by 10001:10001"; exit 1; }
          docker run --rm --network none -v portcullis_hub_data:/d:ro "$ALPINE" cat /d/audit.jsonl \
            | jq -se 'map(select(.action == "signin.reset_core")) | last | .actor == "cli" and .result == "ok" and (.detail | contains("method passkey_synced: off -> on"))' >/dev/null \
            || { echo "FAIL: no signin.reset_core audit entry by cli naming the change"; exit 1; }
          echo "PASS: signin reset-core refuses without --yes and a tty (exit 2), undoes a method switched off through the API, puts hub / people on standard, writes state.yaml / audit.jsonl / .hub.lock as 10001, audits it, starts the Hub again"

      # enroll is no longer a site (contract §5 "Core routers", D31): only
      # /healthz, the setup-link pages (/invite/*) and the internal API on
      # :8444 (bearer) remain. Its old pages and APIs must be gone.
      - name: Find enroll; its retired pages and APIs are gone
        run: |
          ENROLL_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis").IPAddress}}' "$(docker compose ps -q enroll)")
          test -n "$ENROLL_IP" || { echo "FAIL: no enroll IP on the portcullis network"; exit 1; }
          echo "ENROLL_IP=$ENROLL_IP" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$ENROLL_IP:8443/healthz" || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ] || { echo "FAIL: enroll /healthz returned $code"; docker compose logs --tail=30 enroll; exit 1; }
          for p in / /users /certs /enroll/testuser /api/users /self /api/self/renew; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$ENROLL_IP:8443$p" || true)
            [ "$code" = 404 ] || { echo "FAIL: enroll still answers GET $p ($code)"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "http://$ENROLL_IP:8443/api/sign" || true)
          case "$code" in 404|405) ;; *) echo "FAIL: enroll still answers POST /api/sign ($code)"; exit 1 ;; esac
          echo "PASS: enroll serves /healthz; its old pages, /api/users, /api/sign and /self are gone"

      - name: Test the sign-in flows, setup links and the invite APIs
        run: |
          set -o pipefail
          # The invite IdP is created by configure once enroll runs (Keycloak
          # resolves http://enroll:8445 to accept it; it is not in the realm
          # import). Idempotent: the flows were synced by the first run.
          # Regression (test server 2026-11-12): a realm whose passwordless
          # passkey policy drifted (conveyance none, attachment cross-platform)
          # must be put back by configure — the checks below expect direct.
          PRE_TOKEN=$(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=${KEYCLOAK_ADMIN:-admin}" \
            --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token)
          [ -n "$PRE_TOKEN" ] && [ "$PRE_TOKEN" != null ] || { echo "FAIL: admin token for the passkey-policy drift check"; exit 1; }
          echo "::add-mask::$PRE_TOKEN"
          echo '{"webAuthnPolicyPasswordlessRpEntityName": "Portcullis", "webAuthnPolicyPasswordlessAttestationConveyancePreference": "none", "webAuthnPolicyPasswordlessAuthenticatorAttachment": "cross-platform"}' \
            | curl -sf -X PUT -H @<(printf 'Authorization: Bearer %s\n' "$PRE_TOKEN") -H 'Content-Type: application/json' --data-binary @- \
              http://127.0.0.1:8080/admin/realms/portcullis \
            || { echo "FAIL: drifting the passkey policy"; exit 1; }
          curl -sf -H @<(printf 'Authorization: Bearer %s\n' "$PRE_TOKEN") http://127.0.0.1:8080/admin/realms/portcullis \
            | jq -e '.webAuthnPolicyPasswordlessAttestationConveyancePreference == "none"' >/dev/null \
            || { echo "FAIL: the drift didn't take (the check would prove nothing)"; exit 1; }
          unset PRE_TOKEN
          OUT=$(./portcullis keycloak configure)
          echo "$OUT" | grep -c "up to date" | grep -qx 3 || { echo "FAIL: flows rebuilt on a second configure"; echo "$OUT"; exit 1; }
          echo "$OUT" | grep -q "invite identity provider (URLs, client secret): ok" || { echo "FAIL: invite IdP not configured"; echo "$OUT"; exit 1; }
          KC_TOKEN=$(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=${KEYCLOAK_ADMIN:-admin}" \
            --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token)
          [ -z "$KC_TOKEN" ] || [ "$KC_TOKEN" = null ] || echo "::add-mask::$KC_TOKEN"
          kc() { curl -sf -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") "http://127.0.0.1:8080/admin/realms/portcullis$1"; }
          # The browser flow (contract §8.1): only the sign-in extension's
          # methods (no stock password, passkey or X.509 authenticator, no LoA
          # condition), ending with the template check; the invite IdP is
          # reachable only with kc_idp_hint (hidden), linking to existing users only.
          EX=$(kc /authentication/flows/portcullis-universal/executions)
          echo "$EX" | jq -e '[.[] | [.level, (if .authenticationFlow then .displayName else .providerId end), .requirement]]
              == [[0, "portcullis-authenticate", "REQUIRED"], [1, "auth-cookie", "ALTERNATIVE"], [1, "identity-provider-redirector", "ALTERNATIVE"],
                  [1, "portcullis-signin", "ALTERNATIVE"], [2, "portcullis-x509", "ALTERNATIVE"], [2, "portcullis-x509", "ALTERNATIVE"],
                  [2, "portcullis-signin-passkey", "ALTERNATIVE"],
                  [3, "portcullis-passkey", "REQUIRED"],
                  [3, "portcullis-passkey-security-key", "CONDITIONAL"], [4, "portcullis-condition-passkey-kind", "REQUIRED"], [4, "portcullis-method", "REQUIRED"],
                  [3, "portcullis-passkey-device", "CONDITIONAL"], [4, "portcullis-condition-passkey-kind", "REQUIRED"], [4, "portcullis-method", "REQUIRED"],
                  [3, "portcullis-passkey-synced", "CONDITIONAL"], [4, "portcullis-condition-passkey-kind", "REQUIRED"], [4, "portcullis-method", "REQUIRED"],
                  [2, "portcullis-password-form", "ALTERNATIVE"], [0, "portcullis-template", "REQUIRED"]]' >/dev/null \
            || { echo "FAIL: browser flow: $(echo "$EX" | jq -c '[.[] | [.level, (if .authenticationFlow then .displayName else .providerId end), .requirement]]')"; exit 1; }
          # Every reference execution keeps its method 10 h in the amr.
          for c in $(echo "$EX" | jq -r '.[] | select(.providerId // "" | IN("portcullis-x509", "portcullis-password-form", "portcullis-method")) | .authenticationConfig // "none"'); do
            kc "/authentication/config/$c" | jq -e '(.config["default.reference.value"] | IN("mtls", "file", "pwd", "hwk", "dpk", "spk")) and .config["default.reference.maxAge"] == "36000"' >/dev/null \
              || { echo "FAIL: reference config $c: $(kc "/authentication/config/$c" | jq -c .config)"; exit 1; }
          done
          # The two x509 executions (contract §8.1, sign-in part 2), in order:
          # x509-config (YubiKey: pki_int's CA and CRLs, amr mtls), then
          # x509-browser-config (browser: pki_file's, amr file), as configure pushed them.
          X509=$(for c in $(echo "$EX" | jq -r '.[] | select(.providerId == "portcullis-x509") | .authenticationConfig'); do
                   kc "/authentication/config/$c" | jq -c '{alias, m: .config["portcullis.method"], ref: .config["default.reference.value"], ca: .config["portcullis.ca"],
                       crl: .config["x509-cert-auth.crl-relative-path"], abort: .config["x509-cert-auth-crl-abort-if-non-updated"]}'
                 done | jq -sc .)
          T=/opt/keycloak/conf/truststores/portcullis
          [ "$X509" = "$(jq -nc --arg t "$T" '[{alias: "x509-config", m: "yubikey_cert", ref: "mtls", ca: "\($t)/portcullis-yubikey-ca.pem",
                crl: "http://vault:8200/v1/pki_int/crl##http://vault:8200/v1/pki_int/crl/delta", abort: "true"},
              {alias: "x509-browser-config", m: "browser_cert", ref: "file", ca: "\($t)/portcullis-browser-ca.pem",
                crl: "http://vault:8200/v1/pki_file/crl##http://vault:8200/v1/pki_file/crl/delta", abort: "true"}]')" ] \
            || { echo "FAIL: the x509 configs: $X509"; exit 1; }
          kc /events/config | jq -e '.eventsEnabled and ((.enabledEventTypes | sort) == ["IMPERSONATE", "LOGIN", "LOGIN_ERROR"]) and .eventsExpiration > 0' >/dev/null \
            || { echo "FAIL: realm events config: $(kc /events/config | jq -c '{eventsEnabled, enabledEventTypes, eventsExpiration}')"; exit 1; }
          kc /authentication/required-actions | jq -e '[.[] | select(.alias | startswith("webauthn-register")) | [.alias, .enabled]] | sort
              == [["webauthn-register", false], ["webauthn-register-passwordless", true]]' >/dev/null \
            || { echo "FAIL: required actions: webauthn-register-passwordless on, the two-factor webauthn-register off"; exit 1; }
          kc "" | jq -e '.attributes["acr.loa.map"] == "{}" and .bruteForceProtected and .failureFactor == 10 and .waitIncrementSeconds == 60
              and .maxFailureWaitSeconds == 900 and (.permanentLockout | not) and .webAuthnPolicyPasswordlessAttestationConveyancePreference == "direct"
              and .webAuthnPolicyPasswordlessAuthenticatorAttachment == "not specified" and .webAuthnPolicyPasswordlessRequireResidentKey == "Yes"
              and .webAuthnPolicyPasswordlessUserVerificationRequirement == "required"' >/dev/null \
            || { echo "FAIL: realm sign-in settings: $(kc "" | jq -c '{loa: .attributes["acr.loa.map"], bruteForceProtected, failureFactor, waitIncrementSeconds, maxFailureWaitSeconds, permanentLockout, att: .webAuthnPolicyPasswordlessAttestationConveyancePreference, attachment: .webAuthnPolicyPasswordlessAuthenticatorAttachment, rk: .webAuthnPolicyPasswordlessRequireResidentKey, uv: .webAuthnPolicyPasswordlessUserVerificationRequirement}')"; exit 1; }
          kc /authentication/flows | jq -e 'any(.[]; .alias == "portcullis-universal" and (.description | test("\\[sync [0-9a-f]{10}\\]$")))' >/dev/null \
            || { echo "FAIL: browser flow not synced from realm-export.json"; exit 1; }
          kc /identity-provider/instances/portcullis-invite | jq -e '.enabled and .hideOnLogin and (.trustEmail | not)
              and .firstBrokerLoginFlowAlias == "portcullis-invite-link" and .postBrokerLoginFlowAlias == "portcullis-invite-session"
              and .config.tokenUrl == "http://enroll:8445/oidc/token" and .config.pkceEnabled == "true"' >/dev/null \
            || { echo "FAIL: invite identity provider: $(kc /identity-provider/instances/portcullis-invite | jq -c 'del(.config.clientSecret)')"; exit 1; }
          kc /authentication/flows/portcullis-invite-link/executions | jq -e '[.[].providerId] == ["idp-detect-existing-broker-user", "idp-auto-link"]' >/dev/null \
            || { echo "FAIL: invite first-login flow must only link existing users"; exit 1; }
          # Post-broker flow: only portcullis-forward-auth (marker scope), a
          # positive check then deny-unless-admitted, then amr inv and the
          # template check (contract §8 "Invite links").
          INV=$(kc /authentication/flows/portcullis-invite-session/executions)
          echo "$INV" | jq -e '[.[] | select(.level == 0) | [(if .authenticationFlow then .displayName else .providerId end), .requirement]]
              == [["portcullis-invite-client", "CONDITIONAL"], ["portcullis-invite-deny", "CONDITIONAL"], ["allow-access-authenticator", "REQUIRED"], ["portcullis-template", "REQUIRED"]]
              and ([.[] | select(.level == 1) | .providerId] == ["conditional-client-scope", "allow-access-authenticator",
                     "conditional-sub-flow-executed", "deny-access-authenticator"])' >/dev/null \
            || { echo "FAIL: invite post-broker flow: $(echo "$INV" | jq -c '[.[] | {displayName, providerId, requirement, level}]')"; exit 1; }
          kc "/authentication/config/$(echo "$INV" | jq -r '.[] | select(.level == 0 and .providerId == "allow-access-authenticator") | .authenticationConfig')" \
            | jq -e '.config["default.reference.value"] == "inv" and .config["default.reference.maxAge"] == "36000"' >/dev/null \
            || { echo "FAIL: the invite flow's amr is not inv"; exit 1; }
          FWD=$(kc "/clients?clientId=portcullis-forward-auth" | jq -r '.[0].id')
          SCOPE_ID=$(kc /client-scopes | jq -r '.[] | select(.name == "portcullis-invite-client") | .id')
          kc "/clients/$FWD" | jq -e '.attributes["pkce.code.challenge.method"] == "S256"' >/dev/null \
            || { echo "FAIL: portcullis-forward-auth does not require PKCE S256"; exit 1; }
          # No LoA request on the forward-auth client (contract §8.1: the Hub
          # pushes no default.acr.values; configure clears it).
          kc "/clients/$FWD" | jq -e '(.attributes["default.acr.values"] // "") == ""' >/dev/null \
            || { echo "FAIL: portcullis-forward-auth has default.acr.values: $(kc "/clients/$FWD" | jq -c '.attributes["default.acr.values"]')"; exit 1; }
          kc "/clients/$FWD/default-client-scopes" | jq -e --arg s "$SCOPE_ID" '[.[] | select(.id == $s)] | length == 1' >/dev/null \
            || { echo "FAIL: portcullis-forward-auth lacks the portcullis-invite-client scope"; exit 1; }
          kc /default-default-client-scopes | jq -e --arg s "$SCOPE_ID" 'all(.[]; .id != $s)' >/dev/null \
            || { echo "FAIL: portcullis-invite-client is a realm default scope"; exit 1; }
          # configure keeps the Hub's extra-domain callbacks on the forward-auth client (contract §5).
          kc "/clients/$FWD" | jq '.redirectUris += ["https://grafana.team-b.example.org/oauth2/callback", "https://evil.example.org/*"]' \
            | curl -sf -X PUT -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") -H 'Content-Type: application/json' --data-binary @- \
                "http://127.0.0.1:8080/admin/realms/portcullis/clients/$FWD"
          ./portcullis keycloak configure >/dev/null
          KC_TOKEN=$(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=${KEYCLOAK_ADMIN:-admin}" \
            --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token)
          [ -z "$KC_TOKEN" ] || [ "$KC_TOKEN" = null ] || echo "::add-mask::$KC_TOKEN"
          kc "/clients/$FWD" | jq -e '.redirectUris | sort == ["https://auth.portcullis.local/oauth2/callback", "https://grafana.team-b.example.org/oauth2/callback"]' >/dev/null \
            || { echo "FAIL: configure did not keep (only) the extra-domain callbacks: $(kc "/clients/$FWD" | jq -c .redirectUris)"; exit 1; }
          kc "/clients/$FWD" | jq '.redirectUris = ["https://auth.portcullis.local/oauth2/callback"]' \
            | curl -sf -X PUT -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") -H 'Content-Type: application/json' --data-binary @- \
                "http://127.0.0.1:8080/admin/realms/portcullis/clients/$FWD"
          echo "PASS: invite post-broker flow limited to portcullis-forward-auth; configure keeps extra-domain callbacks"
          # No LDAP user cache: group/attribute changes in LLDAP reach tokens at once.
          kc "/components?type=org.keycloak.storage.UserStorageProvider" | jq -e '[.[] | select(.providerId == "ldap")][0].config.cachePolicy == ["NO_CACHE"]' >/dev/null \
            || { echo "FAIL: LDAP federation cachePolicy is not NO_CACHE"; exit 1; }
          ENR=$(kc "/clients?clientId=portcullis-enroll" | jq -r '.[0].id')
          SA=$(kc "/clients/$ENR/service-account-user" | jq -r .id)
          RM=$(kc "/clients?clientId=realm-management" | jq -r '.[0].id')
          kc "/users/$SA/role-mappings/clients/$RM" | jq -e '[.[].name] | sort == ["manage-users", "view-users"]' >/dev/null \
            || { echo "FAIL: portcullis-enroll service account roles"; exit 1; }
          echo "PASS: passkey-only browser flow, hidden invite IdP (link-only), enroll service account; configure idempotent"

          # Setup links (CLI → enroll over docker exec; enroll needs no secret on argv).
          L1=$(./portcullis invite testuser --json | jq -r .url)
          L2=$(./portcullis invite testuser --ttl 30m --to hub --json | jq -r .url)
          for l in "$L1" "$L2"; do [ -z "$l" ] || [ "$l" = null ] || echo "::add-mask::$l"; done
          for l in "$L1" "$L2"; do [[ "$l" =~ ^https://enroll\.portcullis\.local/invite/[A-Za-z0-9_-]{43}$ ]] || { echo "FAIL: link $l"; exit 1; }; done
          page() { curl -s -o /dev/null -w '%{http_code}' "http://$ENROLL_IP:8443/invite/${1##*/}"; }
          [ "$(page "$L1")" = 404 ] || { echo "FAIL: a new link must revoke the older one"; exit 1; }
          [ "$(page "$L2")" = 200 ] || { echo "FAIL: setup page"; exit 1; }
          [ "$(page "$L2")" = 200 ] || { echo "FAIL: viewing the setup page must not consume the link"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Sec-Fetch-Site: cross-site' "http://$ENROLL_IP:8443/invite/${L2##*/}")
          [ "$code" = 403 ] || { echo "FAIL: cross-site redeem got $code"; exit 1; }
          if ./portcullis invite portcullis-hub >/dev/null 2>&1; then echo "FAIL: invite for the Hub's service account"; exit 1; fi
          ./portcullis invite admin --json | jq -e .url >/dev/null || { echo "FAIL: the server must be able to invite the bootstrap admin"; exit 1; }
          # The Hub's API (contract §9.4): bearer secret from the shared file; admin / portcullis-hub refused.
          api() { jq -n --arg u "$1" '{username: $u}' | curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -H @<(printf 'Authorization: Bearer %s%s\n' "$(cat secrets/enroll/invite-api-secret)" "${2:-}") \
              -d @- "http://$ENROLL_IP:8444/internal/invites"; }
          [ "$(api testuser)" = 201 ] || { echo "FAIL: Hub invite API for testuser"; exit 1; }
          # Any lldap_admin member (not just `admin`) is refused: an invite hands over the account.
          LT=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
            | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          [ -z "$LT" ] || [ "$LT" = null ] || echo "::add-mask::$LT"
          lg() { jq -n --arg q "$1" '{query: $q}' | curl -sf http://127.0.0.1:17170/api/graphql \
            -H @<(printf 'Authorization: Bearer %s\n' "$LT") -H 'Content-Type: application/json' -d @- | jq -e '.errors == null' >/dev/null; }
          lg 'mutation { createUser(user: {id: "ciadmin2", email: "ciadmin2@portcullis.local"}) { id } }'
          lg 'mutation { addUserToGroup(userId: "ciadmin2", groupId: 1) { ok } }'
          [ "$(api ciadmin2)" = 409 ] || { echo "FAIL: Hub invite API must refuse lldap_admin members"; exit 1; }
          ./portcullis invite ciadmin2 --json | jq -e .url >/dev/null || { echo "FAIL: the server must be able to invite an administrator"; exit 1; }
          lg 'mutation { deleteUser(userId: "ciadmin2") { ok } }'
          for u in admin portcullis-hub; do [ "$(api "$u")" = 409 ] || { echo "FAIL: Hub invite API must refuse $u"; exit 1; }; done
          [ "$(api nosuchuser)" = 404 ] || { echo "FAIL: Hub invite API for an unknown user"; exit 1; }
          [ "$(api testuser x)" = 401 ] || { echo "FAIL: Hub invite API with a wrong secret"; exit 1; }
          cmp -s secrets/enroll/invite-api-secret secrets/hub/invite/secret || { echo "FAIL: the Hub's invite secret differs"; exit 1; }
          docker compose exec -T enroll wget -q -O - http://127.0.0.1:8445/oidc/jwks | jq -e '.keys[0].alg == "ES256"' >/dev/null \
            || { echo "FAIL: invite JWKS"; exit 1; }
          echo "PASS: setup links (single owner, revocation, no consumption on view, same-origin redeem), Hub invite API (§9.4)"

      # Sign-in part 3 (contract §8 "Stock impersonation off"): Keycloak runs
      # with --features-disabled=impersonation, so its own impersonation
      # answers "feature disabled" even for the master realm's admin.
      - name: Stock impersonation is off
        run: |
          set -o pipefail
          TOK=$(mktemp); chmod 600 "$TOK"; trap 'rm -f "$TOK"' EXIT
          # The CLI's admin token (admin-cli), kept in a file: never on argv.
          printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=${KEYCLOAK_ADMIN:-admin}" \
            --data-urlencode grant_type=password --data-urlencode password@- \
            | jq -r '"Authorization: Bearer " + .access_token' > "$TOK"
          grep -q '^Authorization: Bearer [^n]' "$TOK" || { echo "FAIL: no admin token"; exit 1; }
          echo "::add-mask::$(cut -d' ' -f3 "$TOK")"
          UID_=$(curl -sf -H @"$TOK" "http://127.0.0.1:8080/admin/realms/portcullis/users?username=testuser&exact=true" | jq -r '.[0].id')
          [ -n "$UID_" ] && [ "$UID_" != null ] || { echo "FAIL: no Keycloak user testuser"; exit 1; }
          code=$(curl -s -o /tmp/stock-imp.json -w '%{http_code}' -X POST -H @"$TOK" \
            "http://127.0.0.1:8080/admin/realms/portcullis/users/$UID_/impersonation")
          rm -f "$TOK"
          case "$code" in 2??) echo "FAIL: Keycloak's own impersonation answered $code"; exit 1 ;; esac
          grep -qi 'feature' /tmp/stock-imp.json || { echo "FAIL: the refusal ($code) doesn't name the feature: $(head -c 300 /tmp/stock-imp.json)"; exit 1; }
          echo "PASS: POST …/users/{id}/impersonation answers $code: $(head -c 200 /tmp/stock-imp.json)"

      # F5: the impersonation mapper exists only through keycloak configure,
      # on the live acr scope next to amr; the notice action is enabled.
      - name: acr scope has amr and impersonation
        run: |
          set -o pipefail
          TOK=$(mktemp); chmod 600 "$TOK"; trap 'rm -f "$TOK"' EXIT
          printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=${KEYCLOAK_ADMIN:-admin}" \
            --data-urlencode grant_type=password --data-urlencode password@- \
            | jq -r '"Authorization: Bearer " + .access_token' > "$TOK"
          grep -q '^Authorization: Bearer [^n]' "$TOK" || { echo "FAIL: no admin token"; exit 1; }
          echo "::add-mask::$(cut -d' ' -f3 "$TOK")"
          kc() { curl -sf -H @"$TOK" "http://127.0.0.1:8080/admin/realms/portcullis$1"; }
          ACR=$(kc /client-scopes | jq -r '.[] | select(.name == "acr") | .id')
          [ -n "$ACR" ] || { echo "FAIL: no acr client scope"; exit 1; }
          M=$(kc "/client-scopes/$ACR/protocol-mappers/models")
          echo "$M" | jq -e '([.[] | select(.protocolMapper == "oidc-amr-mapper")] | length) == 1
              and ([.[] | select(.protocolMapper == "portcullis-impersonation")] | length) == 1
              and ([.[] | select(.protocolMapper == "portcullis-impersonation") | .config
                    | .["access.token.claim"] == "true" and .["id.token.claim"] == "true" and .["userinfo.token.claim"] == "true"] | all)' >/dev/null \
            || { echo "FAIL: the acr scope's mappers: $(echo "$M" | jq -c '[.[] | {name, protocolMapper, config}]')"; exit 1; }
          RA=$(kc /authentication/required-actions/portcullis-impersonation-notice)
          echo "$RA" | jq -e '.enabled and (.defaultAction | not) and .providerId == "portcullis-impersonation-notice"' >/dev/null \
            || { echo "FAIL: the notice required action: $RA"; exit 1; }
          # Idempotent: a second configure adds no second mapper.
          ./portcullis keycloak configure >/dev/null
          [ "$(kc "/client-scopes/$ACR/protocol-mappers/models" | jq '[.[] | select(.protocolMapper == "portcullis-impersonation")] | length')" = 1 ] \
            || { echo "FAIL: a second keycloak configure added another impersonation mapper"; exit 1; }
          rm -f "$TOK"
          echo "PASS: the acr scope has amr and the impersonation mapper (access, ID, userinfo), once; the notice action is enabled"

      - name: Test users and groups deleted in LLDAP leave Keycloak
        run: |
          set -o pipefail
          tok() { printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=${KEYCLOAK_ADMIN:-admin}" \
            --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token; }
          KC_TOKEN=$(tok)
          [ -z "$KC_TOKEN" ] || [ "$KC_TOKEN" = null ] || echo "::add-mask::$KC_TOKEN"
          kc() { curl -sf -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") "http://127.0.0.1:8080/admin/realms/portcullis$1"; }
          kcpost() { curl -sf -X POST -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") "http://127.0.0.1:8080/admin/realms/portcullis$1"; }
          kcstatus() { curl -s -o /dev/null -w '%{http_code}' -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") "http://127.0.0.1:8080/admin/realms/portcullis$1"; }
          LT=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
            | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          [ -z "$LT" ] || [ "$LT" = null ] || echo "::add-mask::$LT"
          lq() { jq -n --arg q "$1" '{query: $q}' | curl -sf http://127.0.0.1:17170/api/graphql \
            -H @<(printf 'Authorization: Bearer %s\n' "$LT") -H 'Content-Type: application/json' -d @-; }
          lg() { lq "$1" | jq -e '.errors == null' >/dev/null || { echo "FAIL: LLDAP: $1"; exit 1; }; }
          kcgroup() { kc "/groups?search=$1&exact=true&briefRepresentation=true" | jq -e --arg g "$1" 'any(.[]?; .name == $g)' >/dev/null; }

          # configure (run above, idempotent) set the federation up for it.
          LDAP_ID=$(kc "/components?type=org.keycloak.storage.UserStorageProvider" | jq -r '[.[] | select(.providerId == "ldap")][0].id')
          kc "/components/$LDAP_ID" | jq -e '.config.removeInvalidUsersEnabled == ["true"] and .config.fullSyncPeriod == ["3600"]
              and .config.editMode == ["READ_ONLY"] and .config.customUserSearchFilter == ["(!(uid=portcullis-hub))"]
              and .config.uuidLDAPAttribute == ["entryUUID"] and .config.usernameLDAPAttribute == ["uid"]' >/dev/null \
            || { echo "FAIL: LDAP federation: $(kc "/components/$LDAP_ID" | jq -c '.config | del(.bindCredential)')"; exit 1; }
          MAP=$(kc "/components?parent=$LDAP_ID&type=org.keycloak.storage.ldap.mappers.LDAPStorageMapper" | jq -r '[.[] | select(.providerId == "group-ldap-mapper")][0].id')
          kc "/components/$MAP" | jq -e '.config["drop.non.existing.groups.during.sync"] == ["true"] and .config.mode == ["READ_ONLY"]' >/dev/null \
            || { echo "FAIL: group mapper: $(kc "/components/$MAP" | jq -c .config)"; exit 1; }

          # A user and a group in LLDAP reach Keycloak with a full sync.
          lg 'mutation { createUser(user: {id: "gone-user", email: "gone-user@portcullis.local"}) { id } }'
          GID=$(lq 'mutation { createGroup(name: "gone-group") { id } }' | jq -r '.data.createGroup.id')
          lg "mutation { addUserToGroup(userId: \"gone-user\", groupId: $GID) { ok } }"
          kcpost "/user-storage/$LDAP_ID/sync?action=triggerFullSync" | jq -e '.status' >/dev/null || { echo "FAIL: full sync"; exit 1; }
          UID_GONE=$(kc "/users?username=gone-user&exact=true" | jq -r '.[0].id // empty')
          [ -n "$UID_GONE" ] || { echo "FAIL: gone-user not imported"; exit 1; }
          kcgroup gone-group || { echo "FAIL: gone-group not imported"; exit 1; }
          # The Hub's service account exists in LLDAP from `up` on (later in this job).
          HUB_SA=$(lq '{ user(userId: "portcullis-hub") { id } }' | jq -r '.data.user.id // empty')
          # Keycloak ids: a removed-and-reimported user would get a new one.
          ADMIN_ID=$(kc "/users?username=admin&exact=true" | jq -r '.[0].id // empty')
          TEST_ID=$(kc "/users?username=testuser&exact=true" | jq -r '.[0].id // empty')
          [ -n "$ADMIN_ID" ] && [ -n "$TEST_ID" ] || { echo "FAIL: admin / testuser not in Keycloak before the check"; exit 1; }

          # LLDAP unreachable: a listing keeps every user (Keycloak can't
          # tell gone from unreachable), a sync drops no group.
          docker compose stop lldap >/dev/null
          kc "/users?briefRepresentation=true&max=1000" >/dev/null || true
          kcpost "/user-storage/$LDAP_ID/sync?action=triggerFullSync" >/dev/null || true
          docker compose start lldap >/dev/null
          for i in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q lldap)")" = healthy ] && break
            [ "$i" -eq 60 ] && { echo "FAIL: lldap not healthy again"; docker compose logs --tail=40 lldap; exit 1; }
            sleep 2
          done
          KC_TOKEN=$(tok)
          [ -z "$KC_TOKEN" ] || [ "$KC_TOKEN" = null ] || echo "::add-mask::$KC_TOKEN"
          LT=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
            | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          [ -z "$LT" ] || [ "$LT" = null ] || echo "::add-mask::$LT"
          kc "/users?username=testuser&exact=true" | jq -e --arg id "$TEST_ID" '.[0].id == $id' >/dev/null || { echo "FAIL: testuser removed while LLDAP was down"; exit 1; }
          kcgroup lldap_admin || { echo "FAIL: lldap_admin dropped while LLDAP was down"; exit 1; }
          # Keycloak reaches LLDAP again (its JVM caches the failed DNS lookup
          # for a while; a sync that can't reach LDAP answers 0 updated users).
          for i in $(seq 1 30); do
            kcpost "/user-storage/$LDAP_ID/sync?action=triggerFullSync" | jq -e '.updated > 0' >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "FAIL: Keycloak doesn't reach LLDAP again"; exit 1; }
            sleep 3
          done

          # Deleted straight in LLDAP: the next sync drops the group; the
          # user goes at its next lookup (the Hub lists all users every 15 min).
          lg 'mutation { deleteUser(userId: "gone-user") { ok } }'
          lg "mutation { deleteGroup(groupId: $GID) { ok } }"
          lq '{ groups { displayName } }' | jq -e 'all(.data.groups[]; .displayName != "gone-group")' >/dev/null || { echo "FAIL: gone-group still in LLDAP"; exit 1; }
          SYNC=$(kcpost "/user-storage/$LDAP_ID/sync?action=triggerFullSync") || { echo "FAIL: full sync"; exit 1; }
          echo "full sync: $SYNC"
          if kcgroup gone-group; then
            echo "FAIL: gone-group still in Keycloak after the sync"
            echo "mapper sync: $(kcpost "/user-storage/$LDAP_ID/mappers/$MAP/sync?direction=fedToKeycloak")"
            kcgroup gone-group && echo "(still there after a mapper sync too)"
            docker compose logs --tail=80 keycloak | grep -iE 'ldap|group|sync' | tail -40
            exit 1
          fi
          kc "/users?briefRepresentation=true&max=1000" | jq -e 'all(.[]; .username != "gone-user")' >/dev/null \
            || { echo "FAIL: gone-user still listed"; exit 1; }
          [ "$(kcstatus "/users/$UID_GONE")" = 404 ] || { echo "FAIL: Keycloak kept its copy of gone-user"; exit 1; }

          # Linked by LLDAP's immutable entryUUID, never the username: an
          # account deleted and re-created under the same name straight in
          # LLDAP (no Keycloak lookup in between) is a new identity — a new
          # Keycloak id (every token's sub), the old copy (sessions, consents,
          # passkeys, role grants) removed, not inherited; a full sync first
          # doesn't re-link it either. LLDAP's admin (read only here) is
          # linked by its LLDAP uuid.
          KC_TOKEN=$(tok)
          [ -z "$KC_TOKEN" ] || [ "$KC_TOKEN" = null ] || echo "::add-mask::$KC_TOKEN"
          luuid() { lq "{ user(userId: \"$1\") { uuid } }" | jq -r '.data.user.uuid // empty'; }
          kc "/users/$ADMIN_ID" | jq -e --arg u "$(luuid admin)" --arg l "$LDAP_ID" '$u != "" and .attributes.LDAP_ID == [$u] and .federationLink == $l' >/dev/null \
            || { echo "FAIL: admin not linked by its LLDAP uuid: $(kc "/users/$ADMIN_ID" | jq -c '[.federationLink, .attributes.LDAP_ID]')"; exit 1; }
          lg 'mutation { createUser(user: {id: "same-name", email: "same-name@portcullis.local"}) { id } }'
          U1=$(luuid same-name)
          K1=$(kc "/users?username=same-name&exact=true" | jq -r '.[0].id // empty')
          [ -n "$U1" ] && [ -n "$K1" ] || { echo "FAIL: same-name not imported"; exit 1; }
          kc "/users/$K1" | jq -e --arg u "$U1" '.attributes.LDAP_ID == [$u]' >/dev/null || { echo "FAIL: same-name not linked by its LLDAP uuid"; exit 1; }
          # A Keycloak-side grant on the old copy stands for its local state.
          kcjson() { curl -sf -X POST -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") -H 'Content-Type: application/json' -d @- "http://127.0.0.1:8080/admin/realms/portcullis$1"; }
          echo '{"name": "ci-same-name-marker"}' | kcjson /roles >/dev/null || { echo "FAIL: create the marker role"; exit 1; }
          kc /roles/ci-same-name-marker | jq -c '[.]' | kcjson "/users/$K1/role-mappings/realm" >/dev/null || { echo "FAIL: grant the marker role"; exit 1; }
          lg 'mutation { deleteUser(userId: "same-name") { ok } }'
          lg 'mutation { createUser(user: {id: "same-name", email: "same-name@portcullis.local"}) { id } }'
          U2=$(luuid same-name)
          [ -n "$U2" ] && [ "$U2" != "$U1" ] || { echo "FAIL: LLDAP gave the re-created account the same uuid ($U1 / $U2)"; exit 1; }
          kcpost "/user-storage/$LDAP_ID/sync?action=triggerFullSync" >/dev/null || { echo "FAIL: full sync"; exit 1; }
          K2=$(kc "/users?username=same-name&exact=true" | jq -r '.[0].id // empty')
          [ -n "$K2" ] && [ "$K2" != "$K1" ] || { echo "FAIL: the re-created same-name kept Keycloak id $K1 (got '$K2')"; exit 1; }
          [ "$(kcstatus "/users/$K1")" = 404 ] || { echo "FAIL: Keycloak kept the old same-name copy $K1"; exit 1; }
          kc "/users/$K2" | jq -e --arg u "$U2" '.attributes.LDAP_ID == [$u]' >/dev/null || { echo "FAIL: re-created same-name not linked by its new uuid"; exit 1; }
          [ "$(kc "/users?briefRepresentation=true&max=1000" | jq '[.[] | select(.username == "same-name")] | length')" = 1 ] \
            || { echo "FAIL: same-name duplicated in Keycloak"; exit 1; }
          kc "/users/$K2/role-mappings/realm" | jq -e 'all(.[]?; .name != "ci-same-name-marker")' >/dev/null \
            || { echo "FAIL: the re-created same-name inherited the old copy's grant"; exit 1; }
          curl -sf -X DELETE -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") http://127.0.0.1:8080/admin/realms/portcullis/roles/ci-same-name-marker \
            || { echo "FAIL: delete the marker role"; exit 1; }
          lg 'mutation { deleteUser(userId: "same-name") { ok } }'
          [ "$(kcstatus "/users/$K2")" = 404 ] || { echo "FAIL: Keycloak kept same-name after its deletion"; exit 1; }

          # Core's own accounts are untouched: LLDAP's admin + testuser and
          # their groups in Keycloak, the Hub's service account in LLDAP (and
          # never in Keycloak), the master realm's admin.
          for id in "$ADMIN_ID" "$TEST_ID"; do
            [ "$(kcstatus "/users/$id")" = 200 ] || { echo "FAIL: Keycloak user $id (admin / testuser) removed"; exit 1; }
          done
          kcgroup lldap_admin || { echo "FAIL: lldap_admin dropped"; exit 1; }
          [ "$(lq '{ user(userId: "portcullis-hub") { id } }' | jq -r '.data.user.id // empty')" = "$HUB_SA" ] || { echo "FAIL: the Hub's service account changed in LLDAP"; exit 1; }
          lq '{ user(userId: "admin") { id } }' | jq -e '.data.user.id == "admin"' >/dev/null || { echo "FAIL: LLDAP admin gone"; exit 1; }
          [ "$(kc "/users?username=portcullis-hub&exact=true" | jq length)" = 0 ] || { echo "FAIL: the Hub's service account is in Keycloak"; exit 1; }
          [ -n "$(tok)" ] && [ "$(tok)" != null ] || { echo "FAIL: master admin can't sign in"; exit 1; }
          echo "PASS: users and groups deleted in LLDAP leave Keycloak (group at sync, user at lookup); a re-created name is a new Keycloak identity (entryUUID); LLDAP outage removes nothing; core's accounts kept"

      # The admin CSR path that replaced /api/sign (contract §9.4, D23):
      # enroll's internal API on :8444 with the invite bearer, signed on
      # pki_int through enroll's own AppRole.
      - name: Test enroll's YubiKey certificate API - sign a CSR (AppRole token)
        run: |
          api() { curl -s -o /tmp/yk.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' "$@"; }
          bearer() { printf 'Authorization: Bearer %s\n' "$(cat secrets/enroll/invite-api-secret)"; }
          PAYLOAD=$(jq -n --arg csr "$(cat /tmp/test-client.csr)" '{user: "testuser", csr: $csr}')
          code=$(printf '%s' "$PAYLOAD" | api -H @<(bearer) --data-binary @- "http://$ENROLL_IP:8444/internal/yubikey-certificates")
          [ "$code" = 201 ] || { echo "FAIL: POST /internal/yubikey-certificates got $code: $(head -c 400 /tmp/yk.json)"; docker compose logs --tail=30 enroll; exit 1; }
          SERIAL=$(jq -r '.serial // empty' /tmp/yk.json)
          if [ -z "$SERIAL" ] || ! jq -e '.certificate | startswith("-----BEGIN CERTIFICATE-----")' /tmp/yk.json >/dev/null; then
            echo "FAIL: answer without a PEM certificate / serial: $(head -c 400 /tmp/yk.json)"; exit 1
          fi
          jq -r .certificate /tmp/yk.json > /tmp/yk-leaf.pem
          openssl verify -CAfile certs/ca-chain.crt /tmp/yk-leaf.pem >/dev/null \
            || { echo "FAIL: the signed certificate doesn't chain to the YubiKey CA"; exit 1; }
          [ "$(openssl x509 -noout -issuer -in /tmp/yk-leaf.pem | sed 's/^issuer= *//')" = "$(openssl x509 -noout -subject -in certs/yubikey-ca.crt | sed 's/^subject= *//')" ] \
            || { echo "FAIL: not issued by pki_int"; exit 1; }
          echo "PASS: enroll signed a YubiKey certificate on pki_int via its AppRole (serial: $SERIAL)"
          # No bearer, a wrong bearer, a CSR for another name: refused.
          code=$(printf '%s' "$PAYLOAD" | api --data-binary @- "http://$ENROLL_IP:8444/internal/yubikey-certificates")
          [ "$code" = 401 ] || { echo "FAIL: no bearer got $code"; exit 1; }
          code=$(printf '%s' "$PAYLOAD" | api -H @<(printf 'Authorization: Bearer %s\n' wrong-wrong-wrong-wrong-wrong-wrong) --data-binary @- "http://$ENROLL_IP:8444/internal/yubikey-certificates")
          [ "$code" = 401 ] || { echo "FAIL: a wrong bearer got $code"; exit 1; }
          code=$(jq -n --arg csr "$(cat /tmp/test-client.csr)" '{user: "admin", csr: $csr}' | api -H @<(bearer) --data-binary @- "http://$ENROLL_IP:8444/internal/yubikey-certificates")
          case "$code" in 400|409) ;; *) echo "FAIL: testuser's CSR signed for admin ($code)"; exit 1 ;; esac
          echo "PASS: no / wrong bearer refused (401); a CSR is never signed for another account"

      - name: Test Vault cert listing
        run: |
          VAULT_TOKEN=$(jq -r .root_token secrets/vault-init.json); export VAULT_TOKEN
          echo "::add-mask::$VAULT_TOKEN"
          CERTS=$(vault list -format=json pki_int/certs | jq 'length')
          if [ "$CERTS" -gt 0 ]; then
            echo "PASS: Vault has $CERTS certificates issued"
          else
            echo "FAIL: No certificates found in Vault"
            exit 1
          fi

      - name: Test certificate revocation is enforced
        run: |
          # (the gated router has no forward-auth: the username header is the test's)
          gated() { curl -s -o /dev/null -w '%{http_code}' --cacert certs/ca-chain.crt \
                      --resolve "gated.portcullis.local:443:127.0.0.1" -H 'X-Auth-Request-Preferred-Username: testuser' \
                      -H "X-Forwarded-Access-Token: $CI_TOKEN_MTLS" --cert "$1.crt" --key "$1.key" https://gated.portcullis.local/ || true; }
          # Precondition: the cert bound to testuser's mtls session opens
          # ci-gated (the default template is met), so only revocation can
          # turn 200 into 403.
          [ "$(gated /tmp/test-client)" = 200 ] || { echo "FAIL: precondition: ci-gated refuses testuser's bound session before the revocation"; exit 1; }

          # 1) portcullis cert revoke → serial file → immediate denial
          SERIAL=$(cat /tmp/test-client.serial)
          ./portcullis cert list --all | grep -qi "$SERIAL" || { echo "FAIL: cert list does not show $SERIAL"; exit 1; }
          ./portcullis cert revoke --yes "$SERIAL"
          grep -qi "^$SERIAL\$" certs/revocation/revoked-serials.txt || { echo "FAIL: serial not in revoked-serials.txt"; exit 1; }
          code=$(gated /tmp/test-client)
          [ "$code" = 403 ] || { echo "FAIL: revoked cert (serial file) got $code"; docker compose logs --tail=20 group-gate; exit 1; }
          echo "PASS: cert revoked via portcullis cert revoke is denied"
          ./portcullis cert sync
          grep -qi "^$SERIAL\$" certs/revocation/revoked-serials.txt || { echo "FAIL: cert sync dropped the serial"; exit 1; }

          # 2) revoke directly in Vault (no file update, no CRL rotate). With
          #    auto_rebuild Vault does not rebuild the full CRL on revoke; the
          #    serial reaches the delta CRL at the next delta rebuild
          #    (delta_rebuild_interval=1m, Vault's periodic function runs once a
          #    minute → ≤ ~2 min), then group-gate's next refresh (3s here, 60s
          #    by default) denies it. Window: 180s.
          VAULT_TOKEN=$(jq -r .root_token secrets/vault-init.json); export VAULT_TOKEN
          echo "::add-mask::$VAULT_TOKEN"
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/c2.key
          openssl req -new -key /tmp/c2.key -subj "/CN=testuser" -out /tmp/c2.csr
          R=$(vault write -format=json pki_int/sign/client-cert csr="$(cat /tmp/c2.csr)" common_name=testuser ttl=1h)
          echo "$R" | jq -r .data.certificate > /tmp/c2.crt
          SN2=$(echo "$R" | jq -r .data.serial_number)
          code=$(gated /tmp/c2)
          [ "$code" = 200 ] || { echo "FAIL: fresh cert got $code"; docker compose logs --tail=20 group-gate; exit 1; }
          vault write pki_int/revoke serial_number="$SN2" >/dev/null
          in_crl() { curl -sf "http://127.0.0.1:8200/v1/pki_int/$1/pem" | openssl crl -noout -text 2>/dev/null \
                       | tr -d ' :' | grep -qi "SerialNumber${SN2//:/}"; }
          start=$(date +%s); seen=""
          while [ $(( $(date +%s) - start )) -lt 180 ]; do
            if [ -z "$seen" ]; then
              in_crl crl/delta && seen="delta CRL"
              in_crl crl && seen="full CRL"
              [ -z "$seen" ] || echo "serial in Vault's $seen after $(( $(date +%s) - start ))s"
            fi
            code=$(gated /tmp/c2)
            [ "$code" = 403 ] && { echo "PASS: cert revoked in Vault only is denied via the CRLs after $(( $(date +%s) - start ))s"; exit 0; }
            sleep 3
          done
          echo "FAIL: cert revoked in Vault still accepted after 180s ($code; in Vault CRL: ${seen:-no})"
          vault read -format=json pki_int/config/crl | jq -c .data
          docker compose logs --tail=20 group-gate; exit 1

      - name: Test enroll's certificates API (contract §9.4)
        run: |
          certs() { curl -s -o /tmp/certs.json -w '%{http_code}' "$@" "http://$ENROLL_IP:8444/internal/certificates"; }
          for h in "" "Authorization: Bearer" "Authorization: Bearer wrong" "Authorization: Basic x"; do
            [ "$(certs ${h:+-H "$h"})" = 401 ] || { echo "FAIL: certificates API with '${h:-no Authorization}'"; exit 1; }
          done
          [ "$(certs -H @<(printf 'Authorization: Bearer %s\n' "$(cat secrets/enroll/invite-api-secret)"))" = 200 ] \
            || { echo "FAIL: certificates API with the bearer: $(head -c 300 /tmp/certs.json)"; exit 1; }
          SERIAL=$(tr 'A-F' 'a-f' < /tmp/test-client.serial)
          jq -e --arg s "$SERIAL" '(keys == ["certificates"]) and (.certificates | length > 0)
              and all(.certificates[]; (keys == ["kind", "not_after", "not_before", "revoked", "serial", "user"]) and (.user == (.user | ascii_downcase))
                      and (.kind | IN("yubikey", "browser"))
                      and (.not_after | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$")) and (.not_before | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$"))
                      and (.revoked | type == "boolean"))
              and all(.certificates[] | select(.user == "testuser"); .kind == "yubikey")
              and any(.certificates[]; .serial == $s and .user == "testuser" and .revoked == true)
              and all(.certificates[]; .user | endswith("portcullis.local") | not)' /tmp/certs.json >/dev/null \
            || { echo "FAIL: certificates API answer (want testuser's revoked $SERIAL, no server certs):"; jq -c . /tmp/certs.json | head -c 2000; exit 1; }
          if grep -q 'BEGIN' /tmp/certs.json; then echo "FAIL: PEM in the certificates API answer"; exit 1; fi
          echo "PASS: certificates API: bearer only, YubiKey client certs with Vault's revocation state ($(jq '.certificates | length' /tmp/certs.json) certs)"

      - name: portcullis up (whole stack) keeps the Hub's LLDAP service account
        run: |
          # `up` starts every service, the Hub included.
          [ -n "${HUB_LOCAL:-}" ] || docker compose pull --quiet hub || { echo "::warning::Hub image cannot be pulled — skipping"; exit 0; }
          ./portcullis up
          LLDAP_TOKEN=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
            | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          [ -z "$LLDAP_TOKEN" ] || [ "$LLDAP_TOKEN" = null ] || echo "::add-mask::$LLDAP_TOKEN"
          jq -n '{query: "{ user(userId: \"portcullis-hub\") { id groups { displayName } } }"}' | curl -sf http://127.0.0.1:17170/api/graphql \
            -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") -H 'Content-Type: application/json' -d @- \
            | jq -e 'any(.data.user.groups[]; .displayName == "lldap_admin")' >/dev/null || { echo "FAIL: portcullis-hub not in lldap_admin"; exit 1; }
          jq -n --rawfile p secrets/hub/lldap/password '{username: "portcullis-hub", password: ($p | rtrimstr("\n"))}' \
            | curl -sf -o /dev/null http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- \
            || { echo "FAIL: secrets/hub/lldap/password does not log in"; exit 1; }
          test "$(stat -c '%a %g' secrets/hub/lldap/password)" = "640 10001" || { echo "FAIL: password file mode/group"; exit 1; }
          # The service account never reaches Keycloak (federation user filter), so it cannot sign in.
          ./portcullis keycloak configure >/dev/null
          KC_TOKEN=$(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=${KEYCLOAK_ADMIN:-admin}" \
            --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token)
          [ -z "$KC_TOKEN" ] || [ "$KC_TOKEN" = null ] || echo "::add-mask::$KC_TOKEN"
          curl -sf -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") \
              "http://127.0.0.1:8080/admin/realms/portcullis/users?username=portcullis-hub&exact=true" | jq -e 'length == 0' >/dev/null \
            || { echo "FAIL: portcullis-hub is visible in Keycloak"; exit 1; }
          # A changed password in LLDAP is reset from the file on the next run.
          { printf '%s\n' "$LLDAP_TOKEN"; openssl rand -hex 20; } | docker compose exec -T lldap sh -c 'read -r T; read -r P; export LLDAP_USER_PASSWORD="$P";
            exec /app/lldap_set_password --base-url http://localhost:17170 --token "$T" --username "$1"' _ portcullis-hub >/dev/null # secret-argv-ok: inside the lldap container
          ./portcullis up | grep -q "portcullis-hub: password set from secrets/hub/lldap/password" || { echo "FAIL: password not reconciled"; exit 1; }
          if docker compose ps -q hub | grep -q .; then
            docker compose exec -T hub sh -c 'test "$(cat /run/portcullis/lldap/username)" = portcullis-hub && test -s /run/portcullis/lldap/password && test -s /run/portcullis/invite/secret' \
              || { echo "FAIL: Hub does not see its LLDAP / invite files"; exit 1; }
          fi
          echo "PASS: portcullis up creates / reconciles portcullis-hub (lldap_admin, password from the 0640 file) and mounts it into the Hub"

      - name: Test the session store (oauth2-proxy sessions in Valkey, a ticket cookie, the ACL)
        run: |
          # oauth2-proxy #3486: a session in cookies outgrew one cookie and the
          # stale unsplit one kept winning. With the store the browser holds one
          # small ticket and the session lives in `sessions` (Valkey).
          docker compose up -d sessions forward-auth forward-auth-ext
          SID="$(docker compose ps -q sessions)"
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$SID")" = healthy ] && break
            [ "$i" = 30 ] && { echo "FAIL: sessions not healthy"; docker compose logs --tail=40 sessions; exit 1; }
            sleep 2
          done
          test "$(docker inspect -f '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}}' "$SID")" = "999:1000 true [ALL]" \
            || { echo "FAIL: sessions user / read-only / caps: $(docker inspect -f '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}}' "$SID")"; exit 1; }
          test "$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$SID")" = "portcullis_portcullis-sessions " \
            || { echo "FAIL: sessions networks: $(docker inspect -f '{{json .NetworkSettings.Networks}}' "$SID" | jq -c keys)"; exit 1; }
          test "$(stat -c '%a' secrets/sessions) $(stat -c '%a %g' secrets/sessions/valkey.conf)" = "700 640 1000" \
            || { echo "FAIL: secrets/sessions modes / group"; exit 1; }
          FA_PW="$(grep '^FORWARD_AUTH_REDIS_PASSWORD=' .env | cut -d= -f2-)"; echo "::add-mask::$FA_PW"
          FX_PW="$(grep '^FORWARD_AUTH_EXT_REDIS_PASSWORD=' .env | cut -d= -f2-)"; echo "::add-mask::$FX_PW"
          if grep -qF -e "$FA_PW" -e "$FX_PW" secrets/sessions/valkey.conf; then echo "FAIL: a store password in clear in valkey.conf"; exit 1; fi
          # No password reaches argv / the container's environment: valkey-cli reads it from VALKEYCLI_AUTH, passed by name.
          vk() { local pw="$1" user="$2"; shift 2; VALKEYCLI_AUTH="$pw" docker compose exec -T -e VALKEYCLI_AUTH sessions valkey-cli --no-auth-warning --user "$user" "$@" 2>&1; }
          # shellcheck disable=SC2254  # $want is a glob on purpose
          expect() { local want="$1" what="$2"; shift 2; local got; got="$("$@")" || true; case "$got" in $want) echo "PASS: $what" ;; *) echo "FAIL: $what: $got"; exit 1 ;; esac; }
          expect '*NOAUTH*' "the default user is off (unauthenticated PING refused)" docker compose exec -T sessions valkey-cli ping
          expect '*WRONGPASS*' "a wrong password is refused" vk wrong forward-auth ping
          expect PONG "forward-auth signs in" vk "$FA_PW" forward-auth ping
          expect PONG "forward-auth-ext signs in" vk "$FX_PW" forward-auth-ext ping
          expect OK "forward-auth writes its own keys" vk "$FA_PW" forward-auth set _oauth2_proxy-ci0 x PX 60000
          expect '*NOPERM*' "forward-auth-ext can't read forward-auth's keys" vk "$FX_PW" forward-auth-ext get _oauth2_proxy-ci0
          expect '*NOPERM*' "forward-auth can't write forward-auth-ext's keys" vk "$FA_PW" forward-auth set __Host-portcullis_ext-ci0 x
          expect OK "forward-auth-ext writes its own keys" vk "$FX_PW" forward-auth-ext set __Host-portcullis_ext-ci0 x PX 60000
          expect '*NOPERM*' "forward-auth can't read forward-auth-ext's keys" vk "$FA_PW" forward-auth get __Host-portcullis_ext-ci0
          for cmd in "keys x" "scan 0" "flushall" "config get maxmemory" "config set maxmemory 0" "acl list" "client list" "info" "shutdown" "script flush"; do
            # shellcheck disable=SC2086  # the command's words (no glob characters in them)
            expect '*NOPERM*' "forward-auth may not run '$cmd'" vk "$FA_PW" forward-auth $cmd
          done
          expect x "a script reads its own key" vk "$FA_PW" forward-auth eval "return redis.call('get', KEYS[1])" 1 _oauth2_proxy-ci0
          expect '*NOPERM*' "a script can't read another proxy's key" vk "$FA_PW" forward-auth eval "return redis.call('get', KEYS[1])" 1 __Host-portcullis_ext-ci0
          # (Valkey words a refused call inside a script "ACL failure in script: ... no permissions to run")
          expect "*ACL failure in script*forward-auth has no permissions to run the 'flushall' command*" "a script can't run what the user can't" vk "$FA_PW" forward-auth eval "return redis.call('flushall')" 0
          expect 1 "forward-auth deletes its own key" vk "$FA_PW" forward-auth del _oauth2_proxy-ci0
          expect 1 "forward-auth-ext deletes its own key" vk "$FX_PW" forward-auth-ext del __Host-portcullis_ext-ci0

          # A real sign-in through forward-auth (YubiKey certificate, curl's cookie jar = the browser).
          VAULT_TOKEN=$(jq -r .root_token secrets/vault-init.json); export VAULT_TOKEN
          echo "::add-mask::$VAULT_TOKEN"
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/sess.key
          openssl req -new -key /tmp/sess.key -subj "/CN=testuser" -out /tmp/sess.csr
          vault write -format=json pki_int/sign/client-cert csr=@/tmp/sess.csr common_name=testuser ttl=1h | jq -r .data.certificate > /tmp/sess.crt
          J=/tmp/sess.jar; rm -f "$J"
          C=(curl -s --cacert certs/ca-chain.crt --cert /tmp/sess.crt --key /tmp/sess.key --resolve "auth.portcullis.local:443:127.0.0.1" -c "$J" -b "$J")
          for i in $(seq 1 30); do
            [ "$("${C[@]}" -o /dev/null -w '%{http_code}' https://auth.portcullis.local/oauth2/auth)" = 401 ] && break
            [ "$i" = 30 ] && { echo "FAIL: forward-auth does not answer"; docker compose logs --tail=40 forward-auth; exit 1; }
            sleep 2
          done
          # rd = oauth2-proxy's own /oauth2/auth: 202 once the session loads from the store.
          END="$("${C[@]}" -L --max-redirs 10 -o /dev/null -w '%{http_code} %{url_effective}' \
            "https://auth.portcullis.local/oauth2/start?pc_method=yubikey_cert&rd=https%3A%2F%2Fauth.portcullis.local%2Foauth2%2Fauth")"
          [ "${END%% *}" = 202 ] || { echo "FAIL: sign-in through forward-auth ended at ${END%%\?*}"; docker compose logs --tail=40 forward-auth; exit 1; }
          echo "PASS: a YubiKey-certificate sign-in through forward-auth; /oauth2/auth answers 202"
          NAMES="$(awk -F'\t' '!/^#/ || /^#HttpOnly_/ { if (NF >= 7) print $6 }' "$J" | grep -E '^_oauth2_proxy(_[0-9]+)?$' | sort | paste -sd' ')"
          [ "$NAMES" = _oauth2_proxy ] || { echo "FAIL: oauth2-proxy cookies after the sign-in: '$NAMES' (want exactly _oauth2_proxy, no _oauth2_proxy_0…)"; exit 1; }
          VAL="$(awk -F'\t' '$6 == "_oauth2_proxy" { print $7 }' "$J")"
          [ "${#VAL}" -lt 512 ] || { echo "FAIL: the session cookie is ${#VAL} bytes (a ticket is ~200)"; exit 1; }
          # Value = base64url(v2.<base64url(ticket id)>.<base64url(secret)>)|<time>|<signature>.
          KEY="$(VAL="$VAL" python3 -c 'import base64, os
          def d(s): return base64.urlsafe_b64decode(s + "=" * (-len(s) % 4))
          t = d(os.environ["VAL"].split("|")[0]).decode().split(".")
          assert t[0] == "v2" and len(t) == 3, "not a ticket"
          print(d(t[1]).decode())')" || { echo "FAIL: the session cookie is not an oauth2-proxy ticket"; exit 1; }
          [[ "$KEY" =~ ^_oauth2_proxy-[0-9a-f]{32}$ ]] || { echo "FAIL: ticket id '$KEY'"; exit 1; }
          [ "$(vk "$FA_PW" forward-auth get "$KEY" | wc -c)" -gt 100 ] || { echo "FAIL: the store holds no session for $KEY"; exit 1; }
          expect '*NOPERM*' "forward-auth-ext can't read the session" vk "$FX_PW" forward-auth-ext get "$KEY"
          echo "PASS: one small ticket cookie (${#VAL} bytes), the session under $KEY in the store"
          # Sign-in part 3 (contract §5): a client-sent X-Forwarded-Impersonation /
          # -Impersonator never reaches the Hub through portcullis-auth +
          # portcullis-groups. If it did, the Hub's read-only rule would answer
          # every POST but Stop with its "Stop first" text (GET
          # /api/me/impersonation first: the chain reaches the Hub at all).
          P=(--resolve "people.portcullis.local:443:127.0.0.1")
          FORGED=(-H 'X-Forwarded-Impersonator: root' -H "X-Forwarded-Impersonation: 0f3c$(printf 'a%.0s' $(seq 28))")
          # Retried: `portcullis up` may have just restarted the Hub, and Traefik
          # routes to it only once it is healthy (Traefik's own 404 until then).
          for i in $(seq 1 30); do
            code="$("${C[@]}" "${P[@]}" -o /tmp/imp-get.json -w '%{http_code}' "${FORGED[@]}" https://people.portcullis.local/api/me/impersonation)"
            [ "$code" = 404 ] || break
            sleep 2
          done
          if [ "$code" != 200 ] || ! jq -e '.active == null' /tmp/imp-get.json >/dev/null; then
            echo "FAIL: GET people.<d>/api/me/impersonation with forged headers: $code $(head -c 300 /tmp/imp-get.json)"; docker compose logs --tail=20 group-gate; exit 1
          fi
          "${C[@]}" "${P[@]}" -o /tmp/imp-post.txt -X POST -H 'Content-Type: application/json' -d '{}' "${FORGED[@]}" \
            https://people.portcullis.local/api/me/signin/browser-certificates || true
          if grep -q 'signed in as someone else' /tmp/imp-post.txt; then echo "FAIL: a client-sent X-Forwarded-Impersonation reached the Hub"; exit 1; fi
          echo "PASS: client-sent impersonation headers never reach the Hub (people.<d> through forward-auth + group-gate)"
          # Signing out deletes it from the store: the same cookie no longer opens anything.
          cp "$J" /tmp/sess-before.jar
          "${C[@]}" -o /dev/null https://auth.portcullis.local/oauth2/sign_out
          [ "$(vk "$FA_PW" forward-auth get "$KEY" | wc -c)" -le 1 ] || { echo "FAIL: the session survived the sign-out"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' --cacert certs/ca-chain.crt --resolve "auth.portcullis.local:443:127.0.0.1" -b /tmp/sess-before.jar https://auth.portcullis.local/oauth2/auth)"
          [ "$code" = 401 ] || { echo "FAIL: the signed-out ticket still answers $code"; exit 1; }
          echo "PASS: sign-out removes the session from the store; the old ticket gets 401"

      - name: portcullis status
        run: |
          ./portcullis status || true   # hub/forward-auth are not started in CI
          OUT=$(./portcullis status --json || true)
          echo "$OUT" | jq -e '.vault.active == true and .keycloak.health == "healthy" and .keycloak.realm == true and .keycloak.forward_auth_client == true and (.vault.certs_issued > 0)' \
            || { echo "FAIL: unexpected status: $OUT"; exit 1; }
          echo "PASS: portcullis status --json reports Vault, PKI and Keycloak healthy"

      - name: Backup (consistent, nothing stopped) and verify it
        timeout-minutes: 15
        run: |
          VAULT_STARTED="$(docker inspect -f '{{.State.StartedAt}}' "$(docker compose ps -q vault)")"
          ./portcullis backup
          B=$(find backups -maxdepth 1 -type d -name '2*' | sort | tail -n1)
          for f in MANIFEST.json .env secrets/vault-init.json secrets/vault-unseal/unseal-key certs/ca-chain.crt vault.snap postgres.dump lldap_data.tar.gz hub_data.tar.gz traefik_acme.tar.gz mcp_gate_data.tar.gz group_gate_data.tar.gz certs/yubikey-ca.crt certs/browser-ca.crt; do
            test -s "$B/$f" || { echo "FAIL: backup lacks $f"; ls -la "$B"; exit 1; }
          done
          test "$(stat -c %a "$B")" = 700 || { echo "FAIL: backup dir is not 0700"; exit 1; }
          test "$VAULT_STARTED" = "$(docker inspect -f '{{.State.StartedAt}}' "$(docker compose ps -q vault)")" \
            || { echo "FAIL: the backup restarted Vault"; exit 1; }
          tar -tzf "$B/lldap_data.tar.gz" | grep -qx './users.db' || { echo "FAIL: lldap users.db not in the archive"; exit 1; }
          grep -q 'portcullis_backup_last_success_timestamp_seconds{kind="local"}' monitoring/textfile/backup_local.prom \
            || { echo "FAIL: no backup metric"; exit 1; }
          ./portcullis backup verify --local
          # A damaged backup is detected.
          cp -a "$B" /tmp/damaged && echo x >> /tmp/damaged/postgres.dump
          if ./portcullis backup verify --local /tmp/damaged; then echo "FAIL: verify accepted a modified dump"; exit 1; fi
          ./portcullis restore --list | grep -q "$(basename "$B")"
          ./portcullis status --textfile || true
          grep -q '^portcullis_vault_active 1$' monitoring/textfile/status.prom || { echo "FAIL: status --textfile"; cat monitoring/textfile/status.prom; exit 1; }
          echo "PASS: logical backup while running, verify --local, corruption detected, metrics"

      - name: Off-host backup (restic, local repository), verify, wrong password
        timeout-minutes: 15
        run: |
          echo "BACKUP_REPOSITORY=$RUNNER_TEMP/restic-repo" >> .env
          ./portcullis backup --offsite
          first=$(./portcullis backup --list --offsite --json | jq -r '.[0].id')
          ./portcullis backup --offsite   # incremental
          ./portcullis backup --offsite   # third same-day snapshot -> retention prunes the middle one
          # restic >= 0.17 also keeps the OLDEST snapshot while a keep-* bucket is not
          # full yet ("oldest daily snapshot"), so after 3 same-day backups exactly the
          # oldest and the newest survive.
          snaps=$(./portcullis backup --list --offsite --json)
          test "$(jq length <<<"$snaps")" = 2 || { echo "FAIL: retention kept $(jq length <<<"$snaps") same-day snapshots (want 2)"; jq . <<<"$snaps"; exit 1; }
          jq -e --arg f "$first" 'map(.id) | index($f) != null' <<<"$snaps" >/dev/null || { echo "FAIL: oldest snapshot $first was pruned"; exit 1; }
          grep -q 'kind="offsite"' monitoring/textfile/backup_offsite.prom || { echo "FAIL: no offsite metric"; exit 1; }
          ./portcullis backup verify
          # Encrypted at rest: neither the root token nor the .env secrets appear.
          for secret in "$(jq -r .root_token secrets/vault-init.json)" "$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)"; do
            if grep -rqF -f <(printf '%s\n' "$secret") "$RUNNER_TEMP/restic-repo"; then echo "FAIL: plaintext secret in the restic repository"; exit 1; fi
          done
          if BACKUP_PASSWORD=wrong ./portcullis backup verify; then echo "FAIL: wrong BACKUP_PASSWORD accepted"; exit 1; fi
          echo "PASS: restic backup (x2), retention, check + restore + sanity checks, encrypted, wrong password refused"

      - name: Restore from off-host into a fresh stack (new host)
        timeout-minutes: 15
        run: |
          VAULT_TOKEN=$(jq -r .root_token secrets/vault-init.json); export VAULT_TOKEN
          echo "::add-mask::$VAULT_TOKEN"
          ROOT_CA=$(vault read -field=certificate pki/cert/ca | sha256sum)
          N_CERTS=$(vault list -format=json pki_int/certs | jq length)
          REVOKED=$(cat /tmp/test-client.serial)
          BACKUP_REPOSITORY="$(grep '^BACKUP_REPOSITORY=' .env | cut -d= -f2-)"
          BACKUP_PASSWORD="$(grep '^BACKUP_PASSWORD=' .env | cut -d= -f2-)"
          echo "::add-mask::$BACKUP_PASSWORD"
          export BACKUP_REPOSITORY BACKUP_PASSWORD
          cp secrets/mcp-gate/age.pub /tmp/gate-age.pub
          # LLDAP's admin: its Keycloak id and LLDAP uuid (the link, entryUUID) must survive.
          KC_TOKEN=$(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=$KEYCLOAK_ADMIN" \
            --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token)
          [ -z "$KC_TOKEN" ] || [ "$KC_TOKEN" = null ] || echo "::add-mask::$KC_TOKEN"
          ADMIN_KC=$(curl -sf -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") "http://127.0.0.1:8080/admin/realms/portcullis/users?username=admin&exact=true" \
            | jq -c '.[0] | {id, link: .attributes.LDAP_ID}')
          jq -e '.id != null and (.link | length) == 1' <<<"$ADMIN_KC" >/dev/null || { echo "FAIL: admin's Keycloak copy before the backup: $ADMIN_KC"; exit 1; }
          # Everything local is gone: containers, volumes, .env, secrets/, certs/, local backups.
          docker compose -p ci-mtls -f /tmp/ci-mtls.yml down 2>/dev/null || true
          docker compose -p ci-hubproxy down -v 2>/dev/null || true
          docker compose down -v
          rm -rf .env secrets/* certs backups/2* backups/.verify-* monitoring/textfile/*.prom
          unset VAULT_TOKEN
          ./portcullis restore --yes --from-offsite
          VAULT_TOKEN=$(jq -r .root_token secrets/vault-init.json); export VAULT_TOKEN
          echo "::add-mask::$VAULT_TOKEN"
          test "$ROOT_CA" = "$(vault read -field=certificate pki/cert/ca | sha256sum)" || { echo "FAIL: CA differs after restore"; exit 1; }
          # domains_data (age-encrypted) + secrets/domains/age.key came back: the store decrypts.
          for _ in $(seq 1 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q domains)" 2>/dev/null)" = healthy ] && break; sleep 3; done
          printf 'Authorization: Bearer %s\n' "$(cat secrets/domains/api-secret)" \
            | docker run --rm -i --network portcullis_portcullis-domains curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93 -sf -H @- http://domains:8080/domains \
            | jq -e 'any(.[]; .name == "keep.ci-domains.test")' >/dev/null || { echo "FAIL: enrolled domain lost by backup/restore"; docker compose logs --tail=20 domains; exit 1; }
          test "$N_CERTS" = "$(vault list -format=json pki_int/certs | jq length)" || { echo "FAIL: issued-cert records lost"; exit 1; }
          vault read -format=json "pki_int/cert/$REVOKED" | jq -e '.data.revocation_time > 0' >/dev/null || { echo "FAIL: revocation lost"; exit 1; }
          # Keycloak realm, client secret and the LLDAP user survived.
          for _ in $(seq 1 60); do curl -sf http://localhost:9000/health/ready >/dev/null && break; sleep 3; done
          KC_TOKEN=$(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=$KEYCLOAK_ADMIN" \
            --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token)
          [ -z "$KC_TOKEN" ] || [ "$KC_TOKEN" = null ] || echo "::add-mask::$KC_TOKEN"
          kc() { curl -sf -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") "http://127.0.0.1:8080/admin/realms/portcullis$1"; }
          UUID=$(kc "/clients?clientId=portcullis-forward-auth" | jq -r '.[0].id')
          test "$(kc "/clients/$UUID/client-secret" | jq -r .value)" = "$FORWARD_AUTH_CLIENT_SECRET" || { echo "FAIL: Keycloak client secret after restore"; exit 1; }
          LLDAP_TOKEN=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
            | curl -sf http://localhost:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          [ -z "$LLDAP_TOKEN" ] || [ "$LLDAP_TOKEN" = null ] || echo "::add-mask::$LLDAP_TOKEN"
          jq -n '{query: "{ user(userId: \"testuser\") { id } }"}' | curl -sf http://localhost:17170/api/graphql \
            -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") -H 'Content-Type: application/json' -d @- \
            | jq -e '.data.user.id == "testuser"' >/dev/null || { echo "FAIL: LLDAP user lost"; exit 1; }
          # Same Keycloak id after the restore and a full sync, still linked to the same LLDAP uuid.
          LDAPC=$(kc "/components?type=org.keycloak.storage.UserStorageProvider" | jq -r '[.[] | select(.providerId == "ldap")][0].id')
          curl -sf -X POST -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") "http://127.0.0.1:8080/admin/realms/portcullis/user-storage/$LDAPC/sync?action=triggerFullSync" >/dev/null \
            || { echo "FAIL: full sync after restore"; exit 1; }
          jq -n '{query: "{ user(userId: \"admin\") { uuid } }"}' | curl -sf http://localhost:17170/api/graphql \
            -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") -H 'Content-Type: application/json' -d @- \
            | jq -e --argjson b "$ADMIN_KC" '[.data.user.uuid] == $b.link' >/dev/null || { echo "FAIL: LLDAP admin's uuid changed by backup/restore"; exit 1; }
          [ "$(kc "/users?username=admin&exact=true" | jq -c '.[0] | {id, link: .attributes.LDAP_ID}')" = "$ADMIN_KC" ] \
            || { echo "FAIL: admin's Keycloak identity changed by backup/restore: $ADMIN_KC → $(kc "/users?username=admin&exact=true" | jq -c '.[0] | {id, link: .attributes.LDAP_ID}')"; exit 1; }
          ./portcullis status --json | jq -e '.vault.active and .keycloak.realm and .keycloak.forward_auth_client' >/dev/null \
            || { echo "FAIL: status after restore"; ./portcullis status || true; exit 1; }
          # The gate's key / recipient / secret and its access log came back (G29 modes kept).
          for _ in $(seq 1 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q mcp-gate)" 2>/dev/null)" = healthy ] && break; sleep 3; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q mcp-gate)")" = healthy ] || { echo "FAIL: mcp-gate after restore"; docker compose logs --tail=30 mcp-gate; exit 1; }
          cmp -s /tmp/gate-age.pub secrets/mcp-gate/age.pub || { echo "FAIL: the gate's recipient changed by backup/restore"; exit 1; }
          docker run --rm -v portcullis_mcp_gate_data:/d:ro alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
            sh -c 'stat -c "%a %u %g" /d /d/access.jsonl && grep -c "deny:off" /d/access.jsonl' > /tmp/gate-restored
          [ "$(sed -n 1,2p /tmp/gate-restored | paste -sd' ')" = "750 10005 10001 640 10005 10001" ] && [ "$(sed -n 3p /tmp/gate-restored)" -ge 3 ] \
            || { echo "FAIL: restored access log: $(cat /tmp/gate-restored)"; exit 1; }
          echo "PASS: restored from restic into a fresh stack: CA, cert records, revocations, Keycloak (admin's id and entryUUID link kept), LLDAP, the MCP gate's key and access log"
          # The restore's LLDAP guard read the real volume and database: LLDAP
          # users counted, Keycloak's federated users counted, so it passed.
          GUARD=$(bash -c 'source scripts/lib/common.sh; env_load; source scripts/lib/status.sh; source scripts/lib/backup.sh; _backup_load_cfg
            printf "%s %s" "$(_restore_lldap_count)" "$(_restore_kc_federated_count)"')
          echo "restore guard sees: LLDAP $GUARD Keycloak"
          [[ "$GUARD" =~ ^[1-9][0-9]*\ [1-9][0-9]*$ ]] || { echo "FAIL: restore guard counts: $GUARD"; exit 1; }
          # An empty LLDAP volume is "missing" (refused while Keycloak has users).
          docker volume create ci-empty-lldap >/dev/null
          EMPTY=$(bash -c 'source scripts/lib/common.sh; env_load; source scripts/lib/status.sh; source scripts/lib/backup.sh; _backup_load_cfg
            _volume_name() { echo ci-empty-lldap; }; _restore_lldap_count')
          docker volume rm ci-empty-lldap >/dev/null
          [ "$EMPTY" = missing ] || { echo "FAIL: empty LLDAP volume counted as $EMPTY"; exit 1; }
          echo "PASS: restore's LLDAP guard counts the real LLDAP and Keycloak users; an empty volume is missing"

      - name: Collect service status
        if: always()
        run: |
          echo "=== Docker Compose Status ==="
          docker compose ps
          echo ""
          echo "=== Service Logs (last 10 lines each) ==="
          for svc in socket-proxy-traefik socket-proxy-hub traefik keycloak vault lldap enroll postgres group-gate hub; do
            echo "--- $svc ---"
            docker compose logs --tail=10 "$svc" 2>/dev/null || echo "(not running)"
            echo ""
          done

      - name: Cleanup
        if: always()
        run: |
          docker compose -p ci-mtls -f /tmp/ci-mtls.yml down 2>/dev/null || true
          docker compose -p ci-hubproxy down -v 2>/dev/null || true
          docker compose down -v

  # Browser end-to-end login through the real chain:
  # Traefik → oauth2-proxy → Keycloak (LLDAP users, WebAuthn, X.509) → group-gate.
  # tests/e2e/e2e_login.py documents every scenario.
  e2e:
    needs: jobs-input
    # Runs unless a workflow_dispatch named other jobs (input `jobs`: `all`, or
    # names separated by commas and/or spaces; exact names, so `e2e` is not `e2e-ai`).
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.jobs == '' || inputs.jobs == 'all'
      || contains(format(' ,{0}, ', inputs.jobs), ',e2e,') || contains(format(' ,{0}, ', inputs.jobs), ',e2e ') || contains(format(' ,{0}, ', inputs.jobs), ' e2e,') || contains(format(' ,{0}, ', inputs.jobs), ' e2e ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_DOMAIN: portcullis.local
      E2E_ARTIFACTS: e2e-artifacts
      # The whole stack incl. the monitoring profile (Grafana at metrics.<domain>).
      COMPOSE_PROFILES: monitoring
      E2E_METRICS: "1"
      ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate .env and the CI override
        run: |
          ./portcullis init --env-only --runtime docker --non-interactive --domain portcullis.local \
            --email ci@portcullis.local --dns-provider none
          for v in KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD LLDAP_ADMIN_PASSWORD; do
            val="$(grep "^$v=" .env | cut -d= -f2-)"
            [ "$v" = KEYCLOAK_ADMIN ] || echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          done
          cat > docker-compose.ci.yml <<'YML'
          services:
            keycloak:
              ports:
                - "127.0.0.1:9000:9000"
            lldap:
              ports:
                - "127.0.0.1:17170:17170"
          YML
          sed -i 's/^          //' docker-compose.ci.yml
          docker compose config -q

      - name: List the images this job runs
        run: |
          # Compose services incl. the monitoring profile (minus enroll and the
          # edge Hub) + the helper alpine, whoami and curl used inline.
          {
            docker compose config --images | grep -vxE 'portcullis-(enroll|group-gate|domains|mcp-gate)|ghcr\.io/porelli/portcullis-(hub|keycloak):.*'
            grep -ohE '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' .github/workflows/ci.yml scripts/lib/common.sh \
              | grep -E '^(alpine|busybox|traefik/whoami|curlimages/curl):'
          } > "$RUNNER_TEMP/images.txt"
      - name: Load images (cached, verified)
        timeout-minutes: 15
        uses: ./.github/actions/cached-images
        with:
          images: ${{ runner.temp }}/images.txt
          name: e2e
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build enrollment UI (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: enroll
          tags: portcullis-enroll
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=enroll
          # build-and-test writes the (identical) cache on main.
          cache-to: ""
      - name: Build group-gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: group-gate
          tags: portcullis-group-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=group-gate
          cache-to: ""
      # The production build (no test provider): vault init's age-key
      # generation runs this image.
      - name: Build the domains service (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: domains
          tags: portcullis-domains
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=domains-test
          cache-to: ""
      - name: Build the MCP gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mcp-gate
          # compose's image name for mcp-gate
          tags: portcullis-mcp-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=mcp-gate
          cache-to: ""
      - name: Keycloak image (same-named portcullis-keycloak branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/keycloak-image

      - name: Start the core stack (Vault, PKI, all services except the Hub)
        run: |
          docker compose up -d postgres lldap
          ./portcullis vault init
          ./portcullis pki setup --with-server-cert
          ./portcullis config apply --bundle-only
          # No ACME in CI: serve the Vault-issued wildcard cert.
          printf 'tls:\n  certificates:\n    - certFile: /certs/server.crt\n      keyFile: /certs/server.key\n' > traefik/dynamic/ci-certs.yml
          # shellcheck disable=SC2046
          docker compose up -d $(docker compose config --services | grep -vx hub)
          for i in $(seq 1 100); do
            curl -sf http://127.0.0.1:9000/health/ready >/dev/null && break
            [ "$i" -eq 100 ] && { echo "FAIL: Keycloak not ready"; docker compose logs --tail=80 keycloak; exit 1; }
            sleep 3
          done
          ./portcullis keycloak configure
          ./portcullis oidc register
          # oauth2-proxy exits while Keycloak is down; make sure it runs now.
          docker compose up -d forward-auth forward-auth-ext
          docker compose restart forward-auth forward-auth-ext
          docker compose ps

      - name: Users, groups, setup links, policy, test app, certs
        run: |
          set -o pipefail
          gql() {
            jq -n --arg q "$1" '{query: $q}' | curl -sf http://127.0.0.1:17170/api/graphql \
              -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") -H 'Content-Type: application/json' -d @- \
              | tee /dev/stderr | jq -e '.errors == null' >/dev/null
          }
          LLDAP_TOKEN=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
            | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          [ -z "$LLDAP_TOKEN" ] || [ "$LLDAP_TOKEN" = null ] || echo "::add-mask::$LLDAP_TOKEN"
          gql 'mutation { createUser(user: {id: "e2e", email: "e2e@portcullis.local"}) { id } }'
          gql 'mutation { createUser(user: {id: "e2e-other", email: "e2e-other@portcullis.local"}) { id } }'
          gql 'mutation { createUser(user: {id: "e2e-bypass", email: "e2e-bypass@portcullis.local"}) { id } }'
          for g in users_e2e admin_e2e; do
            gql "mutation { createGroup(name: \"$g\") { id } }"
          done
          GID=$(jq -n '{query: "{ groups { id displayName } }"}' | curl -sf http://127.0.0.1:17170/api/graphql \
            -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") -H 'Content-Type: application/json' -d @- \
            | jq -r '.data.groups[] | select(.displayName == "users_e2e") | .id')
          gql "mutation { addUserToGroup(userId: \"e2e\", groupId: $GID) { ok } }"
          # No passwords at all: every user (incl. the bootstrap admin) gets
          # a one-time setup link, like `portcullis init` prints for admin.
          # Nothing is pre-assigned in Keycloak: redeeming the link adds the
          # passkey registration itself.
          for spec in "E2E_INVITE e2e https://hwk.portcullis.local/" "E2E_OTHER_INVITE e2e-other https://app.portcullis.local/" \
                      "E2E_ADMIN_INVITE admin portal" "E2E_BYPASS_INVITE e2e-bypass https://app.portcullis.local/"; do
            read -r var who to <<<"$spec"
            url="$(./portcullis invite "$who" --to "$to" --json | jq -r .url)"
            # Masked before anything can print it: a malformed link may still carry a token.
            [ -z "$url" ] || [ "$url" = null ] || echo "::add-mask::$url"
            [[ "$url" =~ ^https://enroll\.portcullis\.local/invite/[A-Za-z0-9_-]{43}$ ]] || { echo "FAIL: setup link for $who: $url"; exit 1; }
            echo "$var=$url" >> "$GITHUB_ENV"
          done

          # Keycloak imports the users from LDAP when the links are redeemed.
          KC_TOKEN=$(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=$KEYCLOAK_ADMIN" \
            --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token)
          [ -z "$KC_TOKEN" ] || [ "$KC_TOKEN" = null ] || echo "::add-mask::$KC_TOKEN"
          kc() { curl -sf -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") -H 'Content-Type: application/json' "$@"; }
          KC_UID=$(kc "http://127.0.0.1:8080/admin/realms/portcullis/users?username=e2e&exact=true" | jq -r '.[0].id')
          [ -n "$KC_UID" ] && [ "$KC_UID" != null ] || { echo "FAIL: e2e not visible in Keycloak (LDAP federation)"; exit 1; }
          kc "http://127.0.0.1:8080/admin/realms/portcullis/users/$KC_UID" | jq -e '(.requiredActions // []) == []' >/dev/null \
            || { echo "FAIL: e2e has required actions before redeeming its link"; exit 1; }
          # Another client (like a Hub-created app client): no marker scope, so
          # the invite IdP's post-broker flow must refuse it (e2e_login.py).
          jq -n '{clientId: "e2e-invite-bypass", enabled: true, protocol: "openid-connect", publicClient: true,
                  standardFlowEnabled: true, directAccessGrantsEnabled: false,
                  redirectUris: ["https://app.portcullis.local/bypass-cb"]}' \
            | kc -X POST --data-binary @- http://127.0.0.1:8080/admin/realms/portcullis/clients >/dev/null
          echo "E2E_BYPASS_CLIENT=e2e-invite-bypass" >> "$GITHUB_ENV"
          SCOPE_ID=$(kc http://127.0.0.1:8080/admin/realms/portcullis/client-scopes | jq -r '.[] | select(.name == "portcullis-invite-client") | .id')
          [ -n "$SCOPE_ID" ] || { echo "FAIL: keycloak configure did not create the portcullis-invite-client scope"; exit 1; }
          for c in portcullis-forward-auth e2e-invite-bypass; do
            CID=$(kc "http://127.0.0.1:8080/admin/realms/portcullis/clients?clientId=$c" | jq -r '.[0].id')
            HAS=$(kc "http://127.0.0.1:8080/admin/realms/portcullis/clients/$CID/default-client-scopes" | jq --arg s "$SCOPE_ID" 'any(.[]; .id == $s)')
            WANT=false; [ "$c" = portcullis-forward-auth ] && WANT=true
            [ "$HAS" = "$WANT" ] || { echo "FAIL: $c has the portcullis-invite-client scope: $HAS (want $WANT)"; exit 1; }
          done

          # group-gate policy file v6 (normally written by the Hub), with the
          # Hub's fresh-install methods and Standard default (any passkey or
          # a YubiKey certificate). "app" has no template of its own
          # (passkey and cert-only sessions must both pass); every core
          # page on Standard.
          printf '%s' '{"version": 6,
            "methods": ["passkey_device", "passkey_synced", "security_key", "yubikey_cert"],
            "templates": {"standard": {"op": "any", "items": [{"op": "any", "items": ["passkey_synced", "passkey_device", "security_key"]}, {"op": "any", "items": ["yubikey_cert"]}]},
                          "e2e-hwk": {"op": "any", "items": ["security_key"]}, "e2e-mtls": {"op": "any", "items": ["yubikey_cert"]}},
            "default": "standard",
            "hosts": {"hwk.portcullis.local": "e2e-hwk", "mtls.portcullis.local": "e2e-mtls"},
            "core": {"portcullis.local": "standard", "directory.portcullis.local": "standard",
                     "hub.portcullis.local": "standard", "metrics.portcullis.local": "standard", "people.portcullis.local": "standard",
                     "traefik.portcullis.local": "standard"},
            "people": {}, "add_stronger": false, "extra_domains": [],
            "groups": {"app.portcullis.local": "users_e2e", "hwk.portcullis.local": "users_e2e", "mtls.portcullis.local": "users_e2e"},
            "path_groups": {"app.portcullis.local": [{"prefix": "/admin", "group": "admin_e2e"}]}}' \
            | docker run --rm -i -v portcullis_hub_data:/d "$ALPINE" sh -c 'cat > /d/group-gate-policy.json && chmod 644 /d/group-gate-policy.json'
          # The extension's signin-keycloak.json (normally written by the Hub;
          # without it nobody signs in, contract §8.1): the same methods and
          # templates, no native-OIDC clients, the CI trust list (Chromium's
          # virtual authenticator = a security key) and no FIDO list yet.
          docker run --rm -v portcullis_hub_data:/d:ro "$ALPINE" cat /d/group-gate-policy.json \
            | jq -c --slurpfile auth tests/e2e/fixtures/virtual-authenticators.json \
                '{version: 1, methods, add_stronger, templates, clients: {}, authenticators: $auth[0],
                  mds: {serial: 0, next_update: "0001-01-01T00:00:00Z"}}' \
            | docker run --rm -i -v portcullis_hub_data:/d "$ALPINE" \
                sh -c 'cat > /d/signin-keycloak.json.tmp && chmod 644 /d/signin-keycloak.json.tmp && mv /d/signin-keycloak.json.tmp /d/signin-keycloak.json'
          # Shared custom fields (normally written by the Hub): e2e_login.py
          # checks the attribute header reaches the app and forged ones don't.
          printf '%s' '{"version": 2, "fields": {"city": "City"}, "users": {"e2e": {"city": ["Milan"]}}}' \
            | docker run --rm -i -v portcullis_hub_data:/d "$ALPINE" sh -c 'cat > /d/user-attributes.json && chmod 644 /d/user-attributes.json'

          # Test app behind the standard forward-auth chain.
          cat > /tmp/e2e-app.yml <<'YML'
          services:
            whoami:
              image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
              networks: [portcullis-proxy]
              labels:
                traefik.enable: "true"
                traefik.http.services.e2e.loadbalancer.server.port: "80"
                traefik.http.routers.e2e.rule: Host(`app.portcullis.local`) || Host(`hwk.portcullis.local`) || Host(`mtls.portcullis.local`)
                traefik.http.routers.e2e.entrypoints: websecure
                traefik.http.routers.e2e.tls.options: authaware@file
                traefik.http.routers.e2e.middlewares: client-headers@file,portcullis-auth@docker,portcullis-groups@docker,security-headers@file
                traefik.http.routers.e2e.service: e2e
          networks:
            portcullis-proxy:
              external: true
          YML
          sed -i 's/^          //' /tmp/e2e-app.yml
          docker compose -p e2e-app -f /tmp/e2e-app.yml up -d
          echo "127.0.0.1 portcullis.local auth.portcullis.local enroll.portcullis.local app.portcullis.local hwk.portcullis.local mtls.portcullis.local metrics.portcullis.local" | sudo tee -a /etc/hosts

          # Client certs: one for e2e from Vault, one from a foreign CA.
          VAULT_TOKEN=$(jq -r .root_token secrets/vault-init.json); export VAULT_TOKEN
          echo "::add-mask::$VAULT_TOKEN"
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/e2e.key
          openssl req -new -key /tmp/e2e.key -subj "/CN=e2e" -out /tmp/e2e.csr
          docker compose exec -T -e VAULT_TOKEN vault vault write -format=json pki_int/sign/client-cert \
            csr="$(cat /tmp/e2e.csr)" common_name=e2e ttl=2h > /tmp/e2e.json
          jq -r .data.certificate /tmp/e2e.json > /tmp/e2e.crt
          echo "E2E_REVOKE_CMD=./portcullis cert revoke --yes $(jq -r .data.serial_number /tmp/e2e.json)" >> "$GITHUB_ENV"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -keyout /tmp/foreign.key -out /tmp/foreign.crt -subj "/CN=e2e" -days 1

          # Wait until the app is routed (unauthenticated → redirect to sign-in).
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --cacert certs/ca-chain.crt https://app.portcullis.local/ || true)
            case "$code" in 302|401|403) echo "app routed (HTTP $code)"; break ;; esac
            [ "$i" -eq 40 ] && { echo "FAIL: app not routed ($code)"; docker compose logs --tail=40 traefik forward-auth; exit 1; }
            sleep 3
          done

      # pip wheels + Playwright's browsers, keyed on the pinned
      # tests/e2e/requirements.txt (the browser build is tied to the
      # Playwright version).
      - name: Restore the pip / Playwright browser cache
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: e2e-playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/requirements.txt') }}

      - name: Install Playwright (pinned) and trust the CA
        timeout-minutes: 10
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install --quiet -r tests/e2e/requirements.txt
          # OS packages always (apt); the browser download is skipped when cached.
          sudo /tmp/e2e-venv/bin/playwright install-deps chromium
          /tmp/e2e-venv/bin/playwright install chromium
          sudo apt-get install -y -qq libnss3-tools >/dev/null
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password 2>/dev/null || true
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n portcullis-root -i certs/root-ca.crt

      - name: Save the pip / Playwright browser cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}

      - name: Run the browser login tests
        env:
          E2E_USER: e2e
          E2E_CERT: /tmp/e2e.crt
          E2E_KEY: /tmp/e2e.key
          E2E_FOREIGN_CERT: /tmp/foreign.crt
          E2E_FOREIGN_KEY: /tmp/foreign.key
        run: |
          NODE_EXTRA_CA_CERTS="$PWD/certs/ca-chain.crt" /tmp/e2e-venv/bin/python tests/e2e/e2e_login.py
          # refresh_rotation really refreshed (oauth2-proxy → Keycloak), and no refresh failed.
          docker compose logs forward-auth > /tmp/forward-auth.log 2>&1
          grep -q 'Refreshing session - User: ' /tmp/forward-auth.log || { echo "FAIL: no forward-auth session refresh during the e2e run"; exit 1; }
          if grep -iE 'unable to refresh|error (redeeming|refreshing)|refresh token.*(invalid|reuse)' /tmp/forward-auth.log; then
            echo "FAIL: a forward-auth session refresh failed"; exit 1
          fi
          echo "PASS: forward-auth sessions refreshed with Keycloak, none failed"

      - name: Re-invite / lost-key recovery (second key, --replace-keys)
        run: |
          set -o pipefail
          LT=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
            | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          [ -z "$LT" ] || [ "$LT" = null ] || echo "::add-mask::$LT"
          for u in e2e-spare e2e-lost; do
            jq -n --arg u "$u" '{query: ("mutation { createUser(user: {id: \"" + $u + "\", email: \"" + $u + "@portcullis.local\"}) { id } }")}' \
              | curl -sf http://127.0.0.1:17170/api/graphql -H @<(printf 'Authorization: Bearer %s\n' "$LT") -H 'Content-Type: application/json' -d @- \
              | jq -e '.errors == null' >/dev/null
          done
          export NODE_EXTRA_CA_CERTS="$PWD/certs/ca-chain.crt"
          # A second key next to the first (both work) ...
          /tmp/e2e-venv/bin/python tests/e2e/e2e_invite.py "$(./portcullis invite e2e-spare --json | jq -r .url)" https://portcullis.local/ \
            --reinvite-cmd "./portcullis invite e2e-spare --json" --expect-amr hwk
          # ... and a lost key replaced (the old one stops working).
          /tmp/e2e-venv/bin/python tests/e2e/e2e_invite.py "$(./portcullis invite e2e-lost --json | jq -r .url)" https://portcullis.local/ \
            --reinvite-cmd "./portcullis invite e2e-lost --replace-keys --json" --replaced --expect-amr hwk

      - name: Monitoring (targets up, probes, rules, alerts, Grafana behind forward-auth)
        run: |
          ./portcullis backup >/dev/null
          ./portcullis status --textfile >/dev/null || true
          for svc in prometheus alertmanager blackbox textfile-exporter grafana; do
            for i in $(seq 1 40); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q "$svc")" 2>/dev/null)" = healthy ] && break
              [ "$i" -eq 40 ] && { echo "FAIL: $svc not healthy"; docker compose logs --tail=40 "$svc"; exit 1; }
              sleep 3
            done
          done
          q() { docker compose exec -T prometheus wget -qO- "http://127.0.0.1:9090/api/v1/$1"; }
          qq() { q "query?query=$(jq -rn --arg q "$1" '$q | @uri')"; }
          # Every scrape job must be up. The blackbox jobs (vault_health,
          # services, services_tcp, tls) are up whenever blackbox answers, so
          # they are checked through probe_success below, not here.
          want="alertmanager grafana group-gate keycloak portcullis prometheus traefik vault"
          for i in $(seq 1 40); do
            UP="$(qq 'up == 1' | jq -r '[.data.result[].metric.job] | unique | join(" ")')"
            DOWN="$(qq 'up == 0' | jq -r '[.data.result[].metric.job] | unique | join(" ")')"
            missing=""
            for j in $want; do [[ " $UP " == *" $j "* ]] || missing="$missing $j"; done
            [ -z "$missing" ] && [ -z "$DOWN" ] && break
            [ "$i" -eq 40 ] && { echo "FAIL: targets missing:${missing:- none}, down: ${DOWN:-none} (up: $UP)"; q targets | jq -c '.data.activeTargets[] | {job: .labels.job, health, lastError}'; exit 1; }
            sleep 5
          done
          echo "targets up: $UP"
          probe() { qq "probe_success{job=\"$1\"}" | jq -r --arg s "$2" '[.data.result[] | select(($s == "") or (.metric.service == $s)) | .value[1]] | join(",")'; }
          for i in $(seq 1 20); do [ "$(probe vault_health '')" = 1 ] && break; sleep 3; done
          [ "$(probe vault_health '')" = 1 ] || { echo "FAIL: vault_health probe"; exit 1; }
          for svc in enroll forward-auth forward-auth-ext lldap; do [ "$(probe services "$svc")" = 1 ] || { echo "FAIL: $svc probe"; exit 1; }; done
          # Textfile metrics were just written: allow a scrape interval or two.
          has() {
            for _ in $(seq 1 15); do [ "$(qq "$1" | jq '.data.result | length')" -gt 0 ] && return 0; sleep 5; done
            echo "FAIL: no $1"; exit 1
          }
          has 'sum(group_gate_requests_total)>0'
          has 'group_gate_crl_last_success_timestamp_seconds>0'
          has 'portcullis_backup_last_success_timestamp_seconds'
          has 'portcullis_ca_expiry_timestamp_seconds'
          has 'traefik_entrypoint_requests_total'
          has 'vault_core_unsealed==1'
          q rules | jq -e '[.data.groups[].name] | index("portcullis")' >/dev/null || { echo "FAIL: alert rules not loaded"; exit 1; }
          if q alerts | jq -e '[.data.alerts[] | select(.labels.alertname == "VaultSealedOrDown" or .labels.alertname == "CrlStale")] | length > 0' >/dev/null; then
            echo "FAIL: VaultSealedOrDown / CrlStale pending or firing"; q alerts | jq -c '.data.alerts[]'; exit 1
          fi
          # Grafana: unauthenticated → sign-in redirect; a forged identity header from
          # anywhere but Traefik's IP is not accepted.
          code=$(curl -s -o /dev/null -w '%{http_code}' --cacert certs/ca-chain.crt https://metrics.portcullis.local/)
          case "$code" in 302|401) ;; *) echo "FAIL: metrics.<domain> unauthenticated got $code"; exit 1 ;; esac
          CURL_IMG=curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          code=$(docker run --rm --network portcullis-proxy "$CURL_IMG" -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-User: admin' http://grafana:3000/api/user)
          [ "$code" != 200 ] || { echo "FAIL: Grafana accepted X-Forwarded-User from a non-Traefik peer"; exit 1; }
          echo "PASS: monitoring: targets up, probes, metrics, rules, no Vault/CRL alert, Grafana gated"

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-artifacts
          docker compose ps -a > e2e-artifacts/compose-ps.txt 2>&1 || true
          for svc in traefik keycloak forward-auth forward-auth-ext group-gate lldap vault enroll socket-proxy-traefik prometheus grafana alertmanager blackbox; do
            docker compose logs --no-color "$svc" > "e2e-artifacts/$svc.log" 2>&1 || true
          done

      - name: Upload screenshots, traces and logs
        timeout-minutes: 10
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker compose -p e2e-app -f /tmp/e2e-app.yml down 2>/dev/null || true
          docker compose down -v

  # App instances and enrolled extra domains, end to end (contract §5, §11,
  # §12): the whole stack plus the Hub (built from the Hub repo's same-named
  # branch when there is one, .github/actions/hub-image), the domains
  # service against Pebble with the fake DNS provider, the extra domain
  # team-b.test, and instances of the CI template tests/e2e/apps/echo
  # created through the Hub's API. tests/e2e/e2e_instances.py documents the
  # browser scenarios; the instance backup / delete / restore checks run
  # against a real daemon at the end.
  e2e-instances:
    needs: jobs-input
    # Runs unless a workflow_dispatch named other jobs (input `jobs`: `all`, or
    # names separated by commas and/or spaces; exact names, so `e2e` is not `e2e-ai`).
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.jobs == '' || inputs.jobs == 'all'
      || contains(format(' ,{0}, ', inputs.jobs), ',e2e-instances,') || contains(format(' ,{0}, ', inputs.jobs), ',e2e-instances ') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-instances,') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-instances ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_DOMAIN: portcullis.local
      E2E_EXTRA: team-b.test
      E2E_ARTIFACTS: e2e-artifacts
      ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      CURL_IMG: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate .env and the CI override (Pebble, fake DNS provider)
        run: |
          ./portcullis init --env-only --runtime docker --non-interactive --domain portcullis.local \
            --email ci@portcullis.local --dns-provider none
          for v in KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD LLDAP_ADMIN_PASSWORD; do
            val="$(grep "^$v=" .env | cut -d= -f2-)"
            [ "$v" = KEYCLOAK_ADMIN ] || echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          done
          cat > docker-compose.ci.yml <<'YML'
          services:
            # CI only (contract §8.1 "Extra entries"): the Hub's trust list
            # gets Chromium's virtual authenticator as a security key.
            hub:
              environment:
                HUB_DEV: "1"
                HUB_SIGNIN_EXTRA_AUTHENTICATORS: /run/portcullis/signin/extra-authenticators.json
              volumes:
                - ./tests/e2e/fixtures/virtual-authenticators.json:/run/portcullis/signin/extra-authenticators.json:ro
            keycloak:
              ports:
                - "127.0.0.1:9000:9000"
            lldap:
              ports:
                - "127.0.0.1:17170:17170"
            domains:
              build:
                args:
                  GO_TAGS: testprovider
              environment:
                ACME_CA_SERVER: https://pebble:14000/dir
                LEGO_CA_CERTIFICATES: /run/ci/pebble.minica.pem
                DOMAINS_RESOLVERS: 127.0.0.1:8053
                # Pebble is no Let's Encrypt: its CAA issuer domain (caa set on).
                DNS_CAA_ISSUER: pebble.test
              volumes:
                - /tmp/pebble.minica.pem:/run/ci/pebble.minica.pem:ro
            pebble:
              image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
              command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "domains:8053"]
              environment:
                PEBBLE_VA_NOSLEEP: "1"
                PEBBLE_WFE_NONCEREJECT: "0"
              networks: [domains-egress]
          YML
          sed -i 's/^          //' docker-compose.ci.yml
          docker compose config -q

      - name: List the images this job runs
        run: |
          {
            docker compose config --images | grep -vxE 'portcullis-(enroll|group-gate|domains|mcp-gate)|ghcr\.io/porelli/portcullis-(hub|keycloak):.*'
            grep -ohE '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' .github/workflows/ci.yml scripts/lib/common.sh tests/e2e/apps/*/compose.yml \
              | grep -E '^(alpine|busybox|traefik/whoami|curlimages/curl):'
          } | sort -u > "$RUNNER_TEMP/images.txt"
      - name: Load images (cached, verified)
        timeout-minutes: 15
        uses: ./.github/actions/cached-images
        with:
          images: ${{ runner.temp }}/images.txt
          name: e2e-instances
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build enrollment UI (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: enroll
          tags: portcullis-enroll
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=enroll
          cache-to: ""
      - name: Build group-gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: group-gate
          tags: portcullis-group-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=group-gate
          cache-to: ""
      - name: Build the domains service (CI test build, buildx layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: domains
          tags: portcullis-domains
          build-args: GO_TAGS=testprovider
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=domains-test
          cache-to: ""
      - name: Build the MCP gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mcp-gate
          # compose's image name for mcp-gate
          tags: portcullis-mcp-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=mcp-gate
          cache-to: ""
      - name: Hub image (same-named Hub branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/hub-image
      - name: Keycloak image (same-named portcullis-keycloak branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/keycloak-image

      - name: Start the whole stack (Hub with the CI template source, domains + Pebble)
        run: |
          PEBBLE_IMG=$(docker compose config --format json | jq -r .services.pebble.image)
          cid="$(docker create "$PEBBLE_IMG")"; docker cp "$cid:/test/certs/pebble.minica.pem" /tmp/pebble.minica.pem; docker rm "$cid" >/dev/null
          chmod 644 /tmp/pebble.minica.pem
          docker compose up -d postgres lldap
          ./portcullis vault init
          ./portcullis pki setup --with-server-cert
          ./portcullis config apply --bundle-only
          printf 'tls:\n  certificates:\n    - certFile: /certs/server.crt\n      keyFile: /certs/server.key\n' > traefik/dynamic/ci-certs.yml
          # The Hub's only template source: the CI templates echo and
          # slowpull (stop_enable_mid_pull) as a local source (a source with
          # a path and no URL is never pulled; with a source present the Hub
          # doesn't clone the marketplace).
          docker volume create --label com.docker.compose.project=portcullis --label com.docker.compose.volume=hub_data portcullis_hub_data >/dev/null
          docker run --rm -v portcullis_hub_data:/data -v "$PWD/tests/e2e/apps:/src:ro" "$ALPINE" sh -c '
            mkdir -p /data/repos/ci && cp -r /src/echo /src/slowpull /data/repos/ci/ &&
            printf "sources:\n  - name: ci\n    url: \"\"\n    path: /data/repos/ci\n" > /data/state.yaml &&
            chown -R 10001:10001 /data && chmod 600 /data/state.yaml'
          # Keycloak's first start (realm import) outlasts compose's health
          # wait: start everything but the Hub, configure Keycloak, then
          # `portcullis up` (the Hub's LLDAP service account, the Hub).
          # shellcheck disable=SC2046
          docker compose up -d $(docker compose config --services | grep -vx hub)
          for i in $(seq 1 100); do
            curl -sf http://127.0.0.1:9000/health/ready >/dev/null && break
            [ "$i" -eq 100 ] && { echo "FAIL: Keycloak not ready"; docker compose logs --tail=80 keycloak; exit 1; }
            sleep 3
          done
          ./portcullis keycloak configure
          ./portcullis oidc register
          ./portcullis up
          # oauth2-proxy exits while Keycloak is down.
          docker compose restart forward-auth forward-auth-ext
          docker compose ps
          HUB_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis").IPAddress}}' "$(docker compose ps -q hub)")
          echo "HUB_IP=$HUB_IP" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "http://$HUB_IP:8888/healthz")" = 200 ] && break
            [ "$i" -eq 40 ] && { echo "FAIL: hub /healthz"; docker compose logs --tail=40 hub; exit 1; }
            sleep 2
          done

      - name: Extra domain, instances, users, setup links (through the Hub's API)
        run: |
          set -o pipefail
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$SECRET"
          # The Hub's API as Traefik calls it: proxy secret + the admin's identity.
          hub() { local m="$1" p="$2"; shift 2
                  curl -s -X "$m" -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$SECRET") \
                    -H 'Content-Type: application/json' "$@" "http://$HUB_IP:8888$p"; }
          hubc() { hub "$@" -o /tmp/hub.out -w '%{http_code}'; }
          # hubop: a lifecycle route's 202, then its op record until done.
          source tests/e2e/hubop.sh
          for i in $(seq 1 30); do
            hub GET /api/templates | jq -e 'any(.[]; .id == "echo")' >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "FAIL: the Hub did not load the CI template: $(hub GET /api/templates | head -c 400)"; docker compose logs --tail=40 hub; exit 1; }
            sleep 2
          done

          # Enrolled domain team-b.test: the Hub accepts only real providers,
          # so CI enrolls it on the domains service's API with the fake one;
          # the Hub picks the service's list up (RefreshDomains).
          code=$(hubc POST /api/domains -d '{"name":"team-b.test","provider":"fake","credentials":{"api_token":"ci-fake-token-0123456789"}}')
          [ "$code" = 400 ] || { echo "FAIL: the Hub forwarded an unknown provider ($code)"; exit 1; }
          DSECRET="$(cat secrets/domains/api-secret)"; echo "::add-mask::$DSECRET"
          dapi() { printf 'Authorization: Bearer %s\n' "$DSECRET" \
                   | docker run --rm -i --network portcullis_portcullis-domains "$CURL_IMG" -s -H @- -H 'Content-Type: application/json' "$@"; }
          code=$(dapi -o /dev/null -w '%{http_code}' -X PUT -d '{"provider":"fake","credentials":{"api_token":"ci-fake-token-0123456789"}}' "http://domains:8080/domains/$E2E_EXTRA")
          [ "$code" = 202 ] || { echo "FAIL: enroll $E2E_EXTRA got $code"; exit 1; }
          for i in $(seq 1 60); do
            st="$(hub GET /api/domains | jq -r --arg d "$E2E_EXTRA" '.[]? | select(.name == $d) | .state')"
            [ "$st" = ready ] && break
            [ "$i" -eq 60 ] && { echo "FAIL: $E2E_EXTRA in the Hub: $(hub GET /api/domains)"; docker compose logs --tail=60 domains pebble; exit 1; }
            sleep 3
          done
          echo "PASS: $E2E_EXTRA enrolled (Pebble, DNS-01 with the fake provider) and ready in the Hub"

          # Instances: echo-a and echo-c on the extra domain, echo-b on the main one.
          for spec in "echo-a echo-a.$E2E_EXTRA Team A" "echo-b echo-b.$E2E_DOMAIN Team B" "echo-c echo-c.$E2E_EXTRA Team C"; do
            read -r id host label <<<"$spec"
            hubop POST /api/instances -d "$(jq -cn --arg id "$id" --arg l "$label" --arg h "$host" '{template: "echo", id: $id, label: $l, hosts: {echo: $h}}')" \
              || { echo "FAIL: create $id"; exit 1; }
          done
          # A host on a domain that isn't enrolled is refused.
          code=$(hubc POST /api/instances -d '{"template":"echo","id":"echo-x","label":"X","hosts":{"echo":"echo-x.not-enrolled.test"}}')
          case "$code" in 400|409) ;; *) echo "FAIL: a host on an unknown domain got $code"; exit 1 ;; esac
          # Every create names its label (contracts §11.9).
          code=$(hubc POST /api/instances -d "$(jq -cn --arg h "echo-y.$E2E_DOMAIN" '{template: "echo", id: "echo-y", hosts: {echo: $h}}')")
          [ "$code" = 400 ] || { echo "FAIL: a create without a label got $code $(cat /tmp/hub.out)"; exit 1; }
          # echo-c: a template of the YubiKey certificate only (a passkey
          # session steps up, contract §8.1); echo-b: a slow stop (its backup
          # takes > 60 s, e2e_instances.py long_backup).
          code=$(hubc POST /api/signin/templates -d '{"id":"e2e-cert","name":"YubiKey certificate only","rule":{"op":"any","items":["yubikey_cert"]}}')
          [ "$code" = 201 ] || { echo "FAIL: create the e2e-cert template: $code $(cat /tmp/hub.out)"; exit 1; }
          code=$(hubc PUT /api/instances/echo-c/settings -d '{"sign_in_template":"e2e-cert"}')
          [ "$code" = 200 ] || { echo "FAIL: echo-c sign-in template: $code $(cat /tmp/hub.out)"; exit 1; }
          hub GET /api/instances/echo-c/signin | jq -e '.template == "e2e-cert" and (.inherits | not)' >/dev/null \
            || { echo "FAIL: echo-c's pick: $(hub GET /api/instances/echo-c/signin | head -c 400)"; exit 1; }
          code=$(hubc PUT /api/instances/echo-b/settings -d '{"values":{"echo_stop_grace":"75s"}}')
          [ "$code" = 200 ] || { echo "FAIL: echo-b settings: $code $(cat /tmp/hub.out)"; exit 1; }
          # Env overrides (contracts §11.9): a variable of the admin's own is
          # stored and reset; a Hub variable and a setting's (echo_stop_grace)
          # are refused; the whole-file Expert route is gone.
          code=$(hubc PUT /api/instances/echo-b/env/CI_MARKER -d '{"value":"on"}')
          if [ "$code" != 200 ] || ! jq -e '.row.name == "CI_MARKER" and .row.source == "custom" and .row.value == "on" and .row.overridden' /tmp/hub.out >/dev/null; then
            echo "FAIL: env override CI_MARKER: $code $(cat /tmp/hub.out)"; exit 1
          fi
          hub GET /api/instances/echo-b/env | jq -e 'any(.rows[]; .name == "CI_MARKER" and .value == "on" and .overridden)' >/dev/null \
            || { echo "FAIL: env rows of echo-b: $(hub GET /api/instances/echo-b/env)"; exit 1; }
          for n in PORTCULLIS_INSTANCE ECHO_STOP_GRACE; do
            code=$(hubc PUT "/api/instances/echo-b/env/$n" -d '{"value":"x"}')
            [ "$code" = 400 ] || { echo "FAIL: env override $n got $code $(cat /tmp/hub.out)"; exit 1; }
          done
          code=$(hubc DELETE /api/instances/echo-b/env/CI_MARKER)
          if [ "$code" != 200 ] || ! jq -e '.row == null' /tmp/hub.out >/dev/null; then
            echo "FAIL: env reset CI_MARKER: $code $(cat /tmp/hub.out)"; exit 1
          fi
          code=$(hubc GET /api/templates/env/echo-b)
          case "$code" in 404|405) ;; *) echo "FAIL: the removed /api/templates/env/ route answered $code"; exit 1 ;; esac
          echo "PASS: env overrides: custom variable stored and reset, Hub and setting variables refused, whole-file route gone"

          # Users and the instances' groups (created by the Hub as the admin).
          LLDAP_TOKEN=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
            | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          [ -z "$LLDAP_TOKEN" ] || [ "$LLDAP_TOKEN" = null ] || echo "::add-mask::$LLDAP_TOKEN"
          gql() { jq -n --arg q "$1" '{query: $q}' | curl -sf http://127.0.0.1:17170/api/graphql \
                    -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") -H 'Content-Type: application/json' -d @-; }
          for u in alice bob; do
            gql "mutation { createUser(user: {id: \"$u\", email: \"$u@portcullis.local\"}) { id } }" | jq -e '.errors == null' >/dev/null
          done
          GROUPS_JSON="$(gql '{ groups { id displayName } }')"
          for g in users_echo-a admin_echo-a users_echo-b users_echo-c; do
            echo "$GROUPS_JSON" | jq -e --arg g "$g" 'any(.data.groups[]; .displayName == $g)' >/dev/null || { echo "FAIL: the Hub did not create $g"; exit 1; }
          done
          for m in alice:users_echo-a alice:users_echo-c bob:users_echo-b; do
            gid=$(echo "$GROUPS_JSON" | jq -r --arg g "${m#*:}" '.data.groups[] | select(.displayName == $g) | .id')
            gql "mutation { addUserToGroup(userId: \"${m%%:*}\", groupId: $gid) { ok } }" | jq -e '.errors == null' >/dev/null
          done

          for id in echo-a echo-b echo-c; do
            hubop POST /api/templates/enable -d "{\"id\":\"$id\"}" || { echo "FAIL: enable $id"; exit 1; }
          done

          # What the Hub published: policy v6 keyed by hostname, the extra domain.
          policy_file() { docker run --rm -v portcullis_hub_data:/d:ro "$ALPINE" cat /d/group-gate-policy.json; }
          for i in $(seq 1 30); do
            policy_file | jq -e --arg x "$E2E_EXTRA" '.version == 6 and .extra_domains == [$x]
                and .groups["echo-a.\($x)"] == "users_echo-a" and .groups["echo-c.\($x)"] == "users_echo-c"
                and .groups["echo-b.portcullis.local"] == "users_echo-b"
                and .hosts["echo-c.\($x)"] == "e2e-cert" and .templates["e2e-cert"] == {op: "any", items: ["yubikey_cert"]}
                and (.hosts | has("echo-a.\($x)") | not) and .default == "standard"' >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "FAIL: policy file: $(policy_file)"; exit 1; }
            sleep 2
          done
          echo "PASS: policy v6: instances keyed by hostname, groups per instance, echo-c on e2e-cert, extra_domains = [$E2E_EXTRA]"

          # The rendered sign-in: forward-auth-ext on extra-domain hosts only.
          labels() { docker inspect -f '{{json .Config.Labels}}' "$(docker ps -q --filter "label=com.docker.compose.project=portcullis-$1" --filter label=com.docker.compose.service=web)"; }
          labels echo-a | jq -e --arg h "echo-a.$E2E_EXTRA" '
              (.["traefik.http.routers.echo-a_echo.middlewares"] | split(",") | index("portcullis-auth-ext@docker") != null and index("portcullis-auth@docker") == null)
              and .["traefik.http.routers.portcullis-oauth2-echo-a_echo.service"] == "forward-auth-ext@docker"
              and .["traefik.http.routers.portcullis-oauth2-echo-a_echo.rule"] == "Host(`\($h)`) && PathPrefix(`/oauth2/`)"' >/dev/null \
            || { echo "FAIL: echo-a labels: $(labels echo-a)"; exit 1; }
          labels echo-b | jq -e '(.["traefik.http.routers.echo-b_echo.middlewares"] | split(",") | index("portcullis-auth@docker") != null)
              and ([keys[] | select(startswith("traefik.http.routers.portcullis-oauth2-"))] == [])' >/dev/null \
            || { echo "FAIL: echo-b labels: $(labels echo-b)"; exit 1; }
          KC_TOKEN=$(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=$KEYCLOAK_ADMIN" \
            --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token)
          [ -z "$KC_TOKEN" ] || [ "$KC_TOKEN" = null ] || echo "::add-mask::$KC_TOKEN"
          curl -sf -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") "http://127.0.0.1:8080/admin/realms/portcullis/clients?clientId=portcullis-forward-auth" \
            | jq -e --arg x "$E2E_EXTRA" '.[0].redirectUris as $u | ($u | index("https://echo-a.\($x)/oauth2/callback") != null)
                and ($u | index("https://echo-c.\($x)/oauth2/callback") != null) and ($u | index("https://echo-b.portcullis.local/oauth2/callback") == null)' >/dev/null \
            || { echo "FAIL: forward-auth callbacks"; exit 1; }
          echo "PASS: extra-domain routers use portcullis-auth-ext + a Host-scoped /oauth2/ router to forward-auth-ext; callbacks registered"

          # Traefik serves the enrolled domain's certificate by SNI; core hosts keep the main one.
          sni_sans() { openssl s_client -connect 127.0.0.1:443 -servername "$1" </dev/null 2>/dev/null | openssl x509 -noout -ext subjectAltName 2>/dev/null | tail -n +2 | tr -d ' '; }
          for i in $(seq 1 30); do
            sni_sans "echo-a.$E2E_EXTRA" | grep -q "DNS:\*\.$E2E_EXTRA" && break
            [ "$i" -eq 30 ] && { echo "FAIL: no $E2E_EXTRA certificate for echo-a: $(sni_sans "echo-a.$E2E_EXTRA")"; exit 1; }
            sleep 1
          done
          sni_sans "auth.$E2E_DOMAIN" | grep -q 'DNS:\*\.portcullis\.local' || { echo "FAIL: auth.<main> lost the main certificate"; exit 1; }
          docker run --rm --network portcullis_domains-egress "$CURL_IMG" -sfk https://pebble:15000/roots/0 > /tmp/pebble-root.pem
          openssl x509 -noout -in /tmp/pebble-root.pem
          cat certs/ca-chain.crt /tmp/pebble-root.pem > /tmp/e2e-ca-bundle.pem
          echo "PASS: echo-a.$E2E_EXTRA is served with the enrolled domain's certificate (Pebble); auth.<main> keeps the main one"

          echo "127.0.0.1 portcullis.local auth.portcullis.local enroll.portcullis.local hub.portcullis.local echo-b.portcullis.local echo-a.$E2E_EXTRA echo-c.$E2E_EXTRA" | sudo tee -a /etc/hosts
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --cacert /tmp/e2e-ca-bundle.pem "https://echo-a.$E2E_EXTRA/" || true)
            case "$code" in 302|401|403) echo "echo-a routed (HTTP $code)"; break ;; esac
            [ "$i" -eq 40 ] && { echo "FAIL: echo-a not routed ($code)"; docker compose logs --tail=40 traefik forward-auth-ext; exit 1; }
            sleep 3
          done

          for spec in "E2E_ALICE_INVITE alice" "E2E_BOB_INVITE bob" "E2E_ADMIN_INVITE admin"; do
            read -r var who <<<"$spec"
            url="$(./portcullis invite "$who" --to portal --json | jq -r .url)"
            # Masked before anything can print it: a malformed link may still carry a token.
            [ -z "$url" ] || [ "$url" = null ] || echo "::add-mask::$url"
            [[ "$url" =~ ^https://enroll\.portcullis\.local/invite/[A-Za-z0-9_-]{43}$ ]] || { echo "FAIL: setup link for $who: $url"; exit 1; }
            echo "$var=$url" >> "$GITHUB_ENV"
          done
          # alice's client certificate (echo-c's mtls step-up).
          VAULT_TOKEN=$(jq -r .root_token secrets/vault-init.json); export VAULT_TOKEN
          echo "::add-mask::$VAULT_TOKEN"
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/alice.key
          openssl req -new -key /tmp/alice.key -subj "/CN=alice" -out /tmp/alice.csr
          docker compose exec -T -e VAULT_TOKEN vault vault write -format=json pki_int/sign/client-cert \
            csr="$(cat /tmp/alice.csr)" common_name=alice ttl=2h | jq -r .data.certificate > /tmp/alice.crt

      - name: Restore the pip / Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: e2e-playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/requirements.txt') }}

      - name: Install Playwright (pinned) and trust core's CA and Pebble's root
        timeout-minutes: 10
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install --quiet -r tests/e2e/requirements.txt
          sudo /tmp/e2e-venv/bin/playwright install-deps chromium
          /tmp/e2e-venv/bin/playwright install chromium
          sudo apt-get install -y -qq libnss3-tools >/dev/null
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password 2>/dev/null || true
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n portcullis-root -i certs/root-ca.crt
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n pebble-root -i /tmp/pebble-root.pem

      - name: Run the browser tests (cross-domain SSO, two instances, long backup through Traefik)
        env:
          E2E_CERT: /tmp/alice.crt
          E2E_KEY: /tmp/alice.key
        run: NODE_EXTRA_CA_CERTS=/tmp/e2e-ca-bundle.pem /tmp/e2e-venv/bin/python tests/e2e/e2e_instances.py

      - name: Instance backup → guarded delete → restore into a new id (real daemon)
        timeout-minutes: 15
        run: |
          set -o pipefail
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$SECRET"
          hub() { local m="$1" p="$2"; shift 2
                  curl -s -X "$m" -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$SECRET") \
                    -H 'Content-Type: application/json' "$@" "http://$HUB_IP:8888$p"; }
          hubc() { hub "$@" -o /tmp/hub.out -w '%{http_code}'; }
          # Long operations: 202 {op_id, poll}, then the op record until done (→ /tmp/op.json).
          source tests/e2e/hubop.sh
          # Data with owners and modes the restore must keep: a file 4242:4343
          # 0640 and the volume root 1234:5678 0751.
          docker run --rm -v portcullis_echo-a-data:/d "$ALPINE" sh -c \
            'echo instance-data > /d/f && chown 4242:4343 /d/f && chmod 0640 /d/f && mkdir -p /d/sub && chown 4242:4343 /d/sub && chown 1234:5678 /d && chmod 0751 /d'
          meta() { docker run --rm -v "$1:/d:ro" "$ALPINE" sh -c 'stat -c "%u:%g:%a" /d /d/f /d/sub && cat /d/f'; }
          WANT="$(meta portcullis_echo-a-data)"
          # The helper image is pulled by digest (not present beforehand).
          HELPER="$(grep -o 'PORTCULLIS_HELPER_IMAGE="[^"]*"' scripts/lib/common.sh | cut -d'"' -f2)"
          docker image rm -f "$HELPER" "${HELPER%@*}" >/dev/null 2>&1 || true
          if docker image inspect "$HELPER" >/dev/null 2>&1; then echo "FAIL: the helper image is still present"; exit 1; fi
          hubop POST /api/instances/echo-a/backups
          ARCHIVE="$(jq -r .result.archive /tmp/op.json)"
          docker image inspect -f '{{json .RepoDigests}}' "$HELPER" | jq -e --arg d "${HELPER%%:*}@${HELPER#*@}" 'index($d) != null' >/dev/null \
            || { echo "FAIL: the helper image was not pulled by its digest"; exit 1; }
          [ -z "$(docker ps -aq --filter label=io.portcullis.hub.helper)" ] || { echo "FAIL: helper containers left behind"; docker ps -a; exit 1; }
          echo "PASS: backup $ARCHIVE (helper image pulled by digest, never-started helpers removed)"

          # Guarded delete: the id must be typed.
          for body in '{}' '{"confirm":"echo-b"}' '{"confirm":"ECHO-A"}'; do
            code=$(hubc DELETE /api/instances/echo-a -d "$body")
            [ "$code" = 400 ] || { echo "FAIL: delete with $body got $code"; exit 1; }
          done
          docker volume inspect portcullis_echo-a-data >/dev/null || { echo "FAIL: a refused delete removed the volume"; exit 1; }
          hubop DELETE /api/instances/echo-a -d '{"confirm":"echo-a"}'
          DEL_BACKUP="$(jq -r .result.backup /tmp/op.json)"
          if docker volume inspect portcullis_echo-a-data >/dev/null 2>&1; then echo "FAIL: delete kept the volume"; exit 1; fi
          [ -z "$(docker ps -aq --filter label=com.docker.compose.project=portcullis-echo-a)" ] || { echo "FAIL: delete kept containers"; exit 1; }
          hub GET /api/backups | jq -e --arg a "$DEL_BACKUP" 'any(.[]; .archive == $a and .instance == "echo-a" and .instance_exists == false)' >/dev/null \
            || { echo "FAIL: the delete's backup is not listed: $(hub GET /api/backups)"; exit 1; }
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --cacert /tmp/e2e-ca-bundle.pem "https://echo-a.$E2E_EXTRA/" || true)
            [ "$code" = 404 ] && break
            [ "$i" -eq 15 ] && { echo "FAIL: echo-a still routed after delete ($code)"; exit 1; }
            sleep 2
          done
          echo "PASS: delete needs the typed id, backs up first ($DEL_BACKUP), removes containers, volume and routing"

          # Restore the manual backup into a new instance id.
          hubop POST /api/instances/restore -d "$(jq -cn --arg a "$ARCHIVE" '{archive: $a, id: "echo-r"}')"
          jq -e '.result.instance == "echo-r"' /tmp/op.json >/dev/null || { echo "FAIL: restore op: $(cat /tmp/op.json)"; exit 1; }
          GOT="$(meta portcullis_echo-r-data)"
          [ "$GOT" = "$WANT" ] || { echo "FAIL: restored volume differs: got $GOT want $WANT"; exit 1; }
          docker volume inspect -f '{{json .Labels}}' portcullis_echo-r-data | jq -e '.["com.docker.compose.project"] == "portcullis-echo-r"' >/dev/null \
            || { echo "FAIL: restored volume labels"; exit 1; }
          hub GET /api/instances | jq -e 'any(.[]; .id == "echo-r" and .template == "echo" and .state == "created")' >/dev/null \
            || { echo "FAIL: echo-r: $(hub GET /api/instances)"; exit 1; }
          hubop POST /api/templates/enable -d '{"id":"echo-r"}' || { echo "FAIL: enable echo-r"; exit 1; }
          docker exec "$(docker ps -q --filter label=com.docker.compose.project=portcullis-echo-r --filter label=com.docker.compose.service=hold)" cat /proc/1/status >/dev/null
          [ "$(meta portcullis_echo-r-data)" = "$WANT" ] || { echo "FAIL: the running instance changed its data"; exit 1; }
          echo "PASS: restore into a new id: owners ($WANT) and the volume root's owner / mode kept, labelled for the new project, enables"

      # stop_enable_mid_pull (contract §11.7 "Stop"): an enable of the CI
      # template slowpull (native OIDC; GitLab CE's ~1.5 GB image, never on
      # the runner: the cached image list takes only alpine / busybox /
      # whoami / curl) is stopped while its `images` step downloads. The
      # record ends stopped, and the Stop's undo removed what the enable
      # made: no containers or volumes, no Keycloak client, no groups; the
      # instance is disabled again and the Stop is audited.
      - name: Stop an enable mid-download (stop_enable_mid_pull)
        run: |
          set -o pipefail
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$SECRET"
          hub() { local m="$1" p="$2"; shift 2
                  curl -s -X "$m" -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$SECRET") \
                    -H 'Content-Type: application/json' "$@" "http://$HUB_IP:8888$p"; }
          hubc() { hub "$@" -o /tmp/hub.out -w '%{http_code}'; }
          source tests/e2e/hubop.sh
          ID=slowpull PROJECT=portcullis-slowpull
          IMG="$(sed -n 's/^ *image: //p' tests/e2e/apps/slowpull/compose.yml)"
          KC_TOKEN=$(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
            --data-urlencode client_id=admin-cli --data-urlencode "username=$KEYCLOAK_ADMIN" \
            --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token)
          [ -z "$KC_TOKEN" ] || [ "$KC_TOKEN" = null ] || echo "::add-mask::$KC_TOKEN"
          kc_clients() { curl -sf -H @<(printf 'Authorization: Bearer %s\n' "$KC_TOKEN") \
                           "http://127.0.0.1:8080/admin/realms/portcullis/clients?clientId=$1" | jq length; }
          LLDAP_TOKEN=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
            | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          [ -z "$LLDAP_TOKEN" ] || [ "$LLDAP_TOKEN" = null ] || echo "::add-mask::$LLDAP_TOKEN"
          lldap_groups() { jq -n '{query: "{ groups { displayName } }"}' | curl -sf http://127.0.0.1:17170/api/graphql \
                             -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") -H 'Content-Type: application/json' -d @- \
                             | jq -c '[.data.groups[].displayName]'; }

          # Before: the template is loaded, its default instance never ran
          # (not listed: no record, not enabled), the image absent (else the
          # pull is instant and the test vacuous).
          hub GET /api/templates | jq -e --arg id "$ID" 'any(.[]; .id == $id)' >/dev/null \
            || { echo "FAIL: the Hub did not load the CI template $ID: $(hub GET /api/templates | jq -c '[.[].id]')"; exit 1; }
          hub GET /api/instances | jq -e --arg id "$ID" 'all(.[]; .id != $id)' >/dev/null \
            || { echo "FAIL: $ID before the enable: $(hub GET /api/instances | jq -c --arg id "$ID" '.[] | select(.id == $id)')"; exit 1; }
          if docker image inspect "$IMG" >/dev/null 2>&1; then echo "FAIL: $IMG is already on the runner"; exit 1; fi
          [ "$(kc_clients "$ID")" = 0 ] || { echo "FAIL: a Keycloak client $ID exists before the enable"; exit 1; }

          # The enable, until its images step runs; then Stop.
          hubop_start POST /api/templates/enable -d "{\"id\":\"$ID\"}"
          jq -e --arg id "$ID" '.op == "enable" and .instance == $id' /tmp/hub.out >/dev/null || { echo "FAIL: 202 body $(cat /tmp/hub.out)"; exit 1; }
          t0=$SECONDS
          for i in $(seq 1 600); do
            hub GET "$HUBOP_POLL" --max-time 30 > /tmp/op.json || true
            jq -e --arg o "$HUBOP_ID" '.op_id == $o and any(.steps[]?; .key == "images" and .state == "running")' /tmp/op.json >/dev/null 2>&1 && break
            if jq -e --arg o "$HUBOP_ID" '.op_id == $o and (.running | not)' /tmp/op.json >/dev/null 2>&1; then
              echo "FAIL: the enable ended before its images step ran:"; hubop_explain; exit 1
            fi
            [ "$i" = 600 ] && { echo "FAIL: images not running after 300 s:"; hubop_explain; exit 1; }
            sleep 0.5
          done
          echo "images running after $((SECONDS - t0)) s: $(jq -c '{stoppable, created, images: [.steps[] | select(.key == "images")][0]}' /tmp/op.json)"
          code=$(hubc POST "/api/instances/$ID/op/stop" -d "{\"op_id\":\"$HUBOP_ID\"}")
          [ "$code" = 202 ] || { echo "FAIL: Stop: HTTP $code $(head -c 1500 /tmp/hub.out)"; exit 1; }
          jq -e --arg o "$HUBOP_ID" '.op_id == $o and .stopping == true' /tmp/hub.out >/dev/null \
            || { echo "FAIL: the Stop's answer is not the stopping record: $(head -c 1500 /tmp/hub.out)"; exit 1; }
          echo "Stop accepted $((SECONDS - t0)) s after the enable"
          # Still downloading when the Stop was accepted (not a vacuous Stop).
          if docker image inspect "$IMG" >/dev/null 2>&1; then echo "FAIL: $IMG finished downloading before the Stop"; exit 1; fi

          # The record ends stopped: not running, not ok, no error, stopped_by.
          hubop_end "$HUBOP_POLL" "$HUBOP_ID" 300 || exit 1
          cp /tmp/op.json /tmp/op-stopped.json
          # Booleans are left out when false: a missing one reads as false.
          jq -e '.op == "enable" and .ok == false and (.error // "") == "" and .stopped_by == "admin" and .stopped_at != null
              and (.stopping // false) == false and (.stoppable // false) == false' /tmp/op.json >/dev/null \
            || { echo "FAIL: the record didn't end stopped:"; hubop_explain; exit 1; }
          echo "stopped after $((SECONDS - t0)) s: $(jq -c '{created, steps: [.steps[] | {key, state}]}' /tmp/op.json)"

          # Nothing the enable made is left.
          left="$(docker ps -aq --filter "label=com.docker.compose.project=$PROJECT")"
          [ -z "$left" ] || { echo "FAIL: containers of $PROJECT left: $(docker ps -a --filter "label=com.docker.compose.project=$PROJECT")"; exit 1; }
          for v in $(jq -r '.created.volumes[]?' /tmp/op.json); do
            if docker volume inspect "$v" >/dev/null 2>&1; then echo "FAIL: volume $v (created by the enable) left"; exit 1; fi
          done
          vols="$(docker volume ls -q --filter "label=com.docker.compose.project=$PROJECT")"
          [ -z "$vols" ] || { echo "FAIL: volumes of $PROJECT left: $vols"; exit 1; }
          jq -e --arg id "$ID" '.created.keycloak_clients | index($id) != null' /tmp/op.json >/dev/null \
            || { echo "FAIL: the enable's ledger has no Keycloak client $ID (stopped too early?): $(jq -c .created /tmp/op.json)"; exit 1; }
          for c in $(jq -r '.created.keycloak_clients[]?' /tmp/op.json); do
            [ "$(kc_clients "$c")" = 0 ] || { echo "FAIL: Keycloak client $c (created by the enable) left"; exit 1; }
          done
          jq -e '.created.groups | length > 0' /tmp/op.json >/dev/null \
            || { echo "FAIL: the enable's ledger has no groups: $(jq -c .created /tmp/op.json)"; exit 1; }
          GROUPS_NOW="$(lldap_groups)"
          [ -n "$GROUPS_NOW" ] || { echo "FAIL: LLDAP groups unreadable"; exit 1; }
          for g in $(jq -r '.created.groups[]?' /tmp/op.json); do
            echo "$GROUPS_NOW" | jq -e --arg g "$g" 'index($g) == null' >/dev/null || { echo "FAIL: group $g (created by the enable) left in LLDAP"; exit 1; }
          done
          hub GET /api/instances | jq -e --arg id "$ID" 'any(.[]; .id == $id and .state == "disabled")' >/dev/null \
            || { echo "FAIL: $ID after the Stop: $(hub GET /api/instances | jq -c --arg id "$ID" '.[] | select(.id == $id)')"; exit 1; }
          # The Stop's audit names the step it stopped (images).
          hub GET /api/directory/audit | jq -e --arg id "$ID" 'any(.[]; .action == "enable.stop" and .result == "ok" and .actor == "admin"
              and ((.target // "") | split("/")[0]) == $id and .detail == "images")' >/dev/null \
            || { echo "FAIL: no enable.stop in the audit: $(hub GET /api/directory/audit | jq -c --arg id "$ID" '[.[] | select((.target // "") | startswith($id))]')"; exit 1; }
          echo "PASS: stop_enable_mid_pull: the enable stopped during images; no containers, volumes, Keycloak client $(jq -c .created.keycloak_clients /tmp/op.json) or groups $(jq -c .created.groups /tmp/op.json) left; $ID disabled; enable.stop audited"

          # Cleanup: no half-pulled image (a later run must pull it again).
          docker image rm -f "$IMG" "${IMG%@*}" >/dev/null 2>&1 || true

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-artifacts
          docker compose ps -a > e2e-artifacts/compose-ps.txt 2>&1 || true
          docker ps -a > e2e-artifacts/docker-ps.txt 2>&1 || true
          for svc in traefik keycloak forward-auth forward-auth-ext group-gate lldap hub domains pebble socket-proxy-hub; do
            docker compose logs --no-color "$svc" > "e2e-artifacts/$svc.log" 2>&1 || true
          done
          docker run --rm -v portcullis_hub_data:/d:ro "$ALPINE" sh -c 'cat /d/group-gate-policy.json; ls -la /d /d/overrides /d/ops; cat /d/overrides/*.yml /d/ops/*.json' > e2e-artifacts/hub-data.txt 2>&1 || true

      - name: Upload screenshots, traces and logs
        timeout-minutes: 10
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-instances-artifacts
          path: e2e-artifacts/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          for p in $(docker ps -aq --filter label=com.docker.compose.project | xargs -r docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' | sort -u | grep -E '^portcullis-(echo-|slowpull$)'); do
            docker compose -p "$p" down -v 2>/dev/null || true
          done
          docker compose down -v

  # Sign-in methods end to end (contract §5, §8, §8.1): the whole stack plus
  # the Hub (same-named Hub branch; HUB_DEV=1 with the CI trust list fixture,
  # mounted from a host directory the test rewrites for the reclassification
  # case) and the Keycloak image (same-named portcullis-keycloak branch), one
  # local template source = the CI templates tests/e2e/apps/echo
  # (forward-auth) and tests/e2e/apps/oidc-echo (native OIDC), instances on
  # Standard, Basic, YubiKey certificate only (forward-auth and native
  # OIDC), Strong and YubiKey + certificate. tests/e2e/e2e_signin.py documents the cases: methods on and
  # off, synced / security-key passkeys, the pc_method step-up, passwords,
  # native-OIDC templates, TLS following the switches, reclassification, the
  # cross-user certificate and pc_fresh; part 2: browser certificates
  # (create / .p12 / sign-in as file / revoke / the limit), the four TLS
  # options' CA names and handshakes, the YubiKey renewal on the Sign-in
  # page, forged certificate headers, sign_in_help, the sign-in history and
  # enroll.<d> serving setup links only.
  e2e-signin:
    needs: jobs-input
    # Runs unless a workflow_dispatch named other jobs (input `jobs`: `all`, or
    # names separated by commas and/or spaces; exact names, so `e2e` is not `e2e-ai`).
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.jobs == '' || inputs.jobs == 'all'
      || contains(format(' ,{0}, ', inputs.jobs), ',e2e-signin,') || contains(format(' ,{0}, ', inputs.jobs), ',e2e-signin ') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-signin,') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-signin ')
    runs-on: ubuntu-latest
    # 40 (part 3): the impersonation cases add the 2 min 10 s expiry wait.
    timeout-minutes: 40
    env:
      E2E_DOMAIN: portcullis.local
      E2E_ARTIFACTS: e2e-artifacts
      ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      APP_HOSTS: echo-std echo-basic echo-cert echo-file echo-anycert oidc-strong oidc-all oidc-cert
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate .env and the CI override (Pebble, fake DNS provider, the trust list fixture from a host directory)
        run: |
          ./portcullis init --env-only --runtime docker --non-interactive --domain portcullis.local \
            --email ci@portcullis.local --dns-provider none
          # Signing in as someone else lasts at most 2 minutes in this job
          # (every case; imp_expiry waits for it).
          echo "IMPERSONATION_MAX_MINUTES=2" >> .env
          for v in KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD LLDAP_ADMIN_PASSWORD; do
            val="$(grep "^$v=" .env | cut -d= -f2-)"
            [ "$v" = KEYCLOAK_ADMIN ] || echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          done
          # The fixture is a copy in a directory (mounted ro): the test
          # rewrites it in place (reclassify) and the Hub sees each new mtime.
          mkdir -p /tmp/signin-fixture
          cp tests/e2e/fixtures/virtual-authenticators.json /tmp/signin-fixture/extra-authenticators.json
          chmod 755 /tmp/signin-fixture; chmod 644 /tmp/signin-fixture/extra-authenticators.json
          cat > docker-compose.ci.yml <<'YML'
          services:
            # CI only (contract §8.1 "Extra entries"): the Hub's trust list
            # gets Chromium's virtual authenticator as a security key.
            hub:
              environment:
                HUB_DEV: "1"
                HUB_SIGNIN_EXTRA_AUTHENTICATORS: /run/portcullis/signin/extra-authenticators.json
              volumes:
                - /tmp/signin-fixture:/run/portcullis/signin:ro
            keycloak:
              ports:
                - "127.0.0.1:9000:9000"
            lldap:
              ports:
                - "127.0.0.1:17170:17170"
            domains:
              build:
                args:
                  GO_TAGS: testprovider
              environment:
                ACME_CA_SERVER: https://pebble:14000/dir
                LEGO_CA_CERTIFICATES: /run/ci/pebble.minica.pem
                DOMAINS_RESOLVERS: 127.0.0.1:8053
              volumes:
                - /tmp/pebble.minica.pem:/run/ci/pebble.minica.pem:ro
            pebble:
              image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
              command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "domains:8053"]
              environment:
                PEBBLE_VA_NOSLEEP: "1"
                PEBBLE_WFE_NONCEREJECT: "0"
              networks: [domains-egress]
          YML
          sed -i 's/^          //' docker-compose.ci.yml
          docker compose config -q

      - name: List the images this job runs
        run: |
          {
            docker compose config --images | grep -vxE 'portcullis-(enroll|group-gate|domains|mcp-gate)|ghcr\.io/porelli/portcullis-(hub|keycloak):.*'
            grep -ohE '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' .github/workflows/ci.yml scripts/lib/common.sh tests/e2e/apps/*/compose.yml \
              | grep -E '^(alpine|busybox|traefik/whoami|curlimages/curl):'
          } | sort -u > "$RUNNER_TEMP/images.txt"
      - name: Load images (cached, verified)
        timeout-minutes: 15
        uses: ./.github/actions/cached-images
        with:
          images: ${{ runner.temp }}/images.txt
          name: e2e-signin
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # imp_ai_refused: an AI token minted for alice before a start.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build the MCP client (tests/e2e/mcpclient, go-sdk pinned in go.mod / go.sum)
        timeout-minutes: 15
        working-directory: tests/e2e/mcpclient
        run: |
          go mod verify
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/mcpclient" .

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build enrollment UI (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: enroll
          tags: portcullis-enroll
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=enroll
          cache-to: ""
      - name: Build group-gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: group-gate
          tags: portcullis-group-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=group-gate
          cache-to: ""
      - name: Build the domains service (CI test build, buildx layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: domains
          tags: portcullis-domains
          build-args: GO_TAGS=testprovider
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=domains-test
          cache-to: ""
      - name: Build the MCP gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mcp-gate
          # compose's image name for mcp-gate
          tags: portcullis-mcp-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=mcp-gate
          cache-to: ""
      - name: Hub image (same-named Hub branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/hub-image
      - name: Keycloak image (same-named portcullis-keycloak branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/keycloak-image

      - name: Start the whole stack (Hub with the echo / oidc-echo template source)
        run: |
          PEBBLE_IMG=$(docker compose config --format json | jq -r .services.pebble.image)
          cid="$(docker create "$PEBBLE_IMG")"; docker cp "$cid:/test/certs/pebble.minica.pem" /tmp/pebble.minica.pem; docker rm "$cid" >/dev/null
          chmod 644 /tmp/pebble.minica.pem
          docker compose up -d postgres lldap
          ./portcullis vault init
          ./portcullis pki setup --with-server-cert
          ./portcullis config apply --bundle-only
          printf 'tls:\n  certificates:\n    - certFile: /certs/server.crt\n      keyFile: /certs/server.key\n' > traefik/dynamic/ci-certs.yml
          # The Hub's only template source: the CI templates echo and
          # oidc-echo, as a local source (path, no URL: never pulled).
          docker volume create --label com.docker.compose.project=portcullis --label com.docker.compose.volume=hub_data portcullis_hub_data >/dev/null
          docker run --rm -v portcullis_hub_data:/data -v "$PWD/tests/e2e/apps:/src:ro" "$ALPINE" sh -c '
            mkdir -p /data/repos/ci && cp -r /src/echo /src/oidc-echo /data/repos/ci/ &&
            printf "sources:\n  - name: ci\n    url: \"\"\n    path: /data/repos/ci\n" > /data/state.yaml &&
            chown -R 10001:10001 /data && chmod 600 /data/state.yaml'
          # shellcheck disable=SC2046
          docker compose up -d $(docker compose config --services | grep -vx hub)
          for i in $(seq 1 100); do
            curl -sf http://127.0.0.1:9000/health/ready >/dev/null && break
            [ "$i" -eq 100 ] && { echo "FAIL: Keycloak not ready"; docker compose logs --tail=80 keycloak; exit 1; }
            sleep 3
          done
          # Test server 2026-11-12: a realm whose passwordless passkey policy
          # drifted (conveyance none, attachment cross-platform) registered a
          # YubiKey as synced, and configure couldn't put it back. Drifted
          # here before any registration: every later one (and the
          # passkey_kinds_identified case) needs configure to restore it.
          kc_tok() { printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | curl -sf http://127.0.0.1:8080/realms/master/protocol/openid-connect/token \
              --data-urlencode client_id=admin-cli --data-urlencode "username=${KEYCLOAK_ADMIN:-admin}" \
              --data-urlencode grant_type=password --data-urlencode password@- | jq -r .access_token; }
          policy() { curl -sf -H @<(printf 'Authorization: Bearer %s\n' "$1") http://127.0.0.1:8080/admin/realms/portcullis \
              | jq -c '{c: .webAuthnPolicyPasswordlessAttestationConveyancePreference, a: .webAuthnPolicyPasswordlessAuthenticatorAttachment,
                        r: .webAuthnPolicyPasswordlessRequireResidentKey, u: .webAuthnPolicyPasswordlessUserVerificationRequirement}'; }
          TOK=$(kc_tok); [ -n "$TOK" ] && [ "$TOK" != null ] || { echo "FAIL: admin token for the passkey-policy drift"; exit 1; }
          echo "::add-mask::$TOK"
          echo '{"webAuthnPolicyPasswordlessRpEntityName": "Portcullis", "webAuthnPolicyPasswordlessAttestationConveyancePreference": "none", "webAuthnPolicyPasswordlessAuthenticatorAttachment": "cross-platform"}' \
            | curl -sf -X PUT -H @<(printf 'Authorization: Bearer %s\n' "$TOK") -H 'Content-Type: application/json' --data-binary @- \
              http://127.0.0.1:8080/admin/realms/portcullis || { echo "FAIL: drifting the passkey policy"; exit 1; }
          got="$(policy "$TOK")"; echo "drifted passwordless policy: $got"
          # (Keycloak resets the passwordless fields the body omits to their
          # defaults, so r drifts to "not specified" too: configure must fix it.)
          case "$got" in '{"c":"none","a":"cross-platform",'*) ;; *) echo "FAIL: the drift didn't take (the check would prove nothing)"; exit 1 ;; esac
          ./portcullis keycloak configure
          TOK=$(kc_tok); echo "::add-mask::$TOK"
          got="$(policy "$TOK")"; echo "passwordless policy after configure: $got"
          [ "$got" = '{"c":"direct","a":"not specified","r":"Yes","u":"required"}' ] || { echo "FAIL: keycloak configure didn't restore the passwordless policy"; exit 1; }
          unset TOK
          ./portcullis oidc register
          ./portcullis up
          # oauth2-proxy exits while Keycloak is down.
          docker compose restart forward-auth forward-auth-ext
          docker compose ps
          HUB_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis").IPAddress}}' "$(docker compose ps -q hub)")
          echo "HUB_IP=$HUB_IP" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "http://$HUB_IP:8888/healthz")" = 200 ] && break
            [ "$i" -eq 40 ] && { echo "FAIL: hub /healthz"; docker compose logs --tail=40 hub; exit 1; }
            sleep 2
          done

      - name: Users, groups, templates, instances, certificates, a password (through the Hub's API)
        run: |
          set -o pipefail
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$SECRET"
          hub() { local m="$1" p="$2"; shift 2
                  curl -s -X "$m" -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$SECRET") \
                    -H 'Content-Type: application/json' "$@" "http://$HUB_IP:8888$p"; }
          hubc() { hub "$@" -o /tmp/hub.out -w '%{http_code}'; }
          want() { local code="$1" what="$2"
                   case "$code" in 200|201) ;; *) echo "FAIL: $what: HTTP $code $(head -c 600 /tmp/hub.out)"; docker compose logs --tail=40 hub; exit 1 ;; esac; }
          # hubop: a lifecycle route's 202, then its op record until done.
          source tests/e2e/hubop.sh
          for i in $(seq 1 30); do
            hub GET /api/templates | jq -e '[.[].id] as $ids | ["echo", "oidc-echo"] - $ids == []' >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "FAIL: the Hub did not load the CI templates: $(hub GET /api/templates | jq -c '[.[].id]')"; docker compose logs --tail=60 hub; exit 1; }
            sleep 2
          done

          # People, created with the Hub's own LLDAP service account; root and
          # sam in lldap_admin (only the CLI invites administrators).
          LLDAP_TOKEN=$(jq -n --rawfile u secrets/hub/lldap/username --rawfile p secrets/hub/lldap/password \
              '{username: ($u | rtrimstr("\n")), password: ($p | rtrimstr("\n"))}' \
            | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          [ -z "$LLDAP_TOKEN" ] || [ "$LLDAP_TOKEN" = null ] || echo "::add-mask::$LLDAP_TOKEN"
          [ -n "$LLDAP_TOKEN" ] && [ "$LLDAP_TOKEN" != null ] || { echo "FAIL: LLDAP login as the Hub's service account"; exit 1; }
          gql() { jq -n --arg q "$1" '{query: $q}' | curl -sf http://127.0.0.1:17170/api/graphql \
                    -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") -H 'Content-Type: application/json' -d @-; }
          for u in root sam alice bob pat rita carol; do
            gql "mutation { createUser(user: {id: \"$u\", email: \"$u@portcullis.local\"}) { id } }" | jq -e '.errors == null' >/dev/null
          done
          gid=$(gql '{ groups { id displayName } }' | jq -r '.data.groups[] | select(.displayName == "lldap_admin") | .id')
          for u in root sam; do
            gql "mutation { addUserToGroup(userId: \"$u\", groupId: $gid) { ok } }" | jq -e '.errors == null' >/dev/null
          done

          # Templates: Basic and YubiKey + certificate on (they start
          # disabled), e2e-cert = YubiKey certificate only.
          for t in basic yubikey-and-certificate; do
            code=$(hubc PUT "/api/signin/templates/$t/enabled" -d '{"on":true}'); want "$code" "enable template $t"
          done
          code=$(hubc POST /api/signin/templates -d '{"id":"e2e-cert","name":"YubiKey certificate only","rule":{"op":"any","items":["yubikey_cert"]}}')
          want "$code" "create the e2e-cert template"
          # Browser certificates (part 2): browser_cert on (off by default),
          # e2e-file = any[browser_cert] and e2e-anycert = any[yubikey_cert,
          # browser_cert] — both protected-any@file.
          # Off by default (a fresh Hub, part 2 ruling): asserted before the switch.
          hub GET /api/signin | jq -e '[.methods[] | select(.id == "browser_cert")] | length == 1 and .[0].on == false' >/dev/null \
            || { echo "FAIL: browser_cert isn't off by default: $(hub GET /api/signin | jq -c '[.methods[] | select(.id == "browser_cert")]')"; exit 1; }
          echo "PASS: browser_cert is off by default"
          code=$(hubc PUT /api/signin/methods/browser_cert -d '{"on":true}'); want "$code" "switch browser_cert on"
          code=$(hubc POST /api/signin/templates -d '{"id":"e2e-file","name":"Browser certificate only","rule":{"op":"any","items":["browser_cert"]}}')
          want "$code" "create the e2e-file template"
          code=$(hubc POST /api/signin/templates -d '{"id":"e2e-anycert","name":"Any certificate","rule":{"op":"any","items":["yubikey_cert","browser_cert"]}}')
          want "$code" "create the e2e-anycert template"

          # Instances (all on the main domain) and their picks, then enable.
          for spec in "echo echo-std Echo-Std" "echo echo-basic Echo-Basic" "echo echo-cert Echo-Cert" \
                      "echo echo-file Echo-File" "echo echo-anycert Echo-Anycert" \
                      "oidc-echo oidc-strong OIDC-Strong" "oidc-echo oidc-all OIDC-All" "oidc-echo oidc-cert OIDC-Cert"; do
            read -r tpl id label <<<"$spec"
            router="echo"; [ "$tpl" = oidc-echo ] && router="oidc"
            label="${label//-/ }"
            hubop POST /api/instances -d "$(jq -cn --arg t "$tpl" --arg id "$id" --arg l "$label" --arg r "$router" --arg h "$id.$E2E_DOMAIN" \
                '{template: $t, id: $id, label: $l, hosts: {($r): $h}}')" || { echo "FAIL: create $id"; exit 1; }
          done
          for pick in echo-basic:basic echo-cert:e2e-cert echo-file:e2e-file echo-anycert:e2e-anycert \
                      oidc-strong:strong oidc-all:yubikey-and-certificate oidc-cert:e2e-cert; do
            code=$(hubc PUT "/api/instances/${pick%%:*}/settings" -d "$(jq -cn --arg t "${pick#*:}" '{sign_in_template: $t}')")
            want "$code" "sign-in template of ${pick%%:*}"
          done
          for m in alice:users_echo-std alice:users_echo-cert alice:users_echo-file alice:users_echo-anycert pat:users_echo-basic; do
            code=$(hubc POST "/api/directory/groups/${m#*:}/members" -d "$(jq -cn --arg u "${m%%:*}" '{username: $u}')")
            want "$code" "add $m"
          done
          for id in echo-std echo-basic echo-cert echo-file echo-anycert oidc-strong oidc-all oidc-cert; do
            hubop POST /api/templates/enable -d "{\"id\":\"$id\"}" || { echo "FAIL: enable $id"; exit 1; }
          done

          # What the Hub published: the picks in the policy file, the
          # native-OIDC clients with their templates in signin-keycloak.json.
          hub_file() { docker run --rm --network none -v portcullis_hub_data:/d:ro "$ALPINE" cat "/d/$1"; }
          for i in $(seq 1 30); do
            hub_file group-gate-policy.json | jq -e --arg d "$E2E_DOMAIN" '.version == 6
                and .hosts["echo-basic.\($d)"] == "basic" and .hosts["echo-cert.\($d)"] == "e2e-cert"
                and .hosts["echo-file.\($d)"] == "e2e-file" and .hosts["echo-anycert.\($d)"] == "e2e-anycert"
                and (.methods | index("browser_cert") != null)
                and (.hosts | has("echo-std.\($d)") | not) and .default == "standard"
                and .core["hub.\($d)"] == "strong" and .core["people.\($d)"] == "strong"' >/dev/null 2>&1 \
              && hub_file signin-keycloak.json | jq -e '.clients["oidc-strong"] == {template: "strong", name: "OIDC echo · OIDC Strong"}
                and .clients["oidc-all"] == {template: "yubikey-and-certificate", name: "OIDC echo · OIDC All"}
                and .clients["oidc-cert"] == {template: "e2e-cert", name: "OIDC echo · OIDC Cert"}
                and (.authenticators | has("01020304-0506-0708-0102-030405060708"))
                and (.methods | index("password") == null) and (.methods | index("browser_cert") != null)' >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "FAIL: published: $(hub_file group-gate-policy.json | jq -c '{hosts, core, default}') $(hub_file signin-keycloak.json | jq -c '{clients, methods, mds}')"; exit 1; }
            sleep 2
          done
          echo "PASS: policy v6 picks (Basic, e2e-cert, e2e-file, e2e-anycert, Strong core pages; browser_cert on) and signin-keycloak.json clients (oidc-strong Strong, oidc-all YubiKey + certificate, oidc-cert e2e-cert)"

          # pat: a Hub-set password only (allowed while the method is off),
          # kept in a 0600 file, never printed.
          mkdir -m 700 /tmp/e2e-secrets
          code=$(hubc POST /api/directory/users/pat/password -d '{"generate":true}')
          want "$code" "set pat's password"
          ( umask 077; jq -er .password /tmp/hub.out > /tmp/e2e-secrets/pat.password ) || { echo "FAIL: no generated password"; rm -f /tmp/hub.out; exit 1; }
          rm -f /tmp/hub.out
          echo "::add-mask::$(cat /tmp/e2e-secrets/pat.password)"

          # Certificates: root's (all[yubikey_cert, security_key]) and bob's
          # (the cross-user certificate).
          VAULT_TOKEN=$(jq -r .root_token secrets/vault-init.json); export VAULT_TOKEN
          echo "::add-mask::$VAULT_TOKEN"
          for u in root bob; do
            openssl ecparam -name prime256v1 -genkey -noout -out "/tmp/e2e-secrets/$u.key"
            openssl req -new -key "/tmp/e2e-secrets/$u.key" -subj "/CN=$u" -out "/tmp/e2e-secrets/$u.csr"
            docker compose exec -T -e VAULT_TOKEN vault vault write -format=json pki_int/sign/client-cert \
              csr="$(cat "/tmp/e2e-secrets/$u.csr")" common_name="$u" ttl=2h | jq -r .data.certificate > "/tmp/e2e-secrets/$u.crt"
            openssl x509 -noout -subject -in "/tmp/e2e-secrets/$u.crt"
          done

          # shellcheck disable=SC2086
          echo "127.0.0.1 portcullis.local auth.portcullis.local enroll.portcullis.local hub.portcullis.local people.portcullis.local $(printf '%s.portcullis.local ' $APP_HOSTS)" | sudo tee -a /etc/hosts
          for id in echo-std echo-basic; do
            for i in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --cacert certs/ca-chain.crt "https://$id.$E2E_DOMAIN/" || true)
              case "$code" in 302|401|403) echo "$id routed (HTTP $code)"; break ;; esac
              [ "$i" -eq 40 ] && { echo "FAIL: $id not routed ($code)"; docker compose logs --tail=40 traefik; exit 1; }
              sleep 3
            done
          done

      - name: Restore the pip / Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: e2e-playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/requirements.txt') }}

      - name: Install Playwright (pinned) and trust core's CA
        timeout-minutes: 10
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install --quiet -r tests/e2e/requirements.txt
          # cryptography (group-gate's pinned, hashed wheels): the .p12, CSRs
          # and the CA checks of the browser-certificate cases.
          /tmp/e2e-venv/bin/pip install --quiet --require-hashes --only-binary=:all: -r group-gate/requirements.txt
          sudo /tmp/e2e-venv/bin/playwright install-deps chromium
          /tmp/e2e-venv/bin/playwright install chromium
          sudo apt-get install -y -qq libnss3-tools >/dev/null
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password 2>/dev/null || true
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n portcullis-root -i certs/root-ca.crt

      - name: Run the sign-in scenarios (methods, passkey kinds, pc_method, passwords, native OIDC, TLS, reclassify, pc_fresh, browser certificates, Sign-in page, help, history, signing in as someone else)
        env:
          E2E_ROOT_CERT: /tmp/e2e-secrets/root.crt
          E2E_ROOT_KEY: /tmp/e2e-secrets/root.key
          E2E_BOB_CERT: /tmp/e2e-secrets/bob.crt
          E2E_BOB_KEY: /tmp/e2e-secrets/bob.key
          E2E_PAT_PASSWORD_FILE: /tmp/e2e-secrets/pat.password
          E2E_FIXTURE: /tmp/signin-fixture/extra-authenticators.json
          E2E_MCPCLIENT: ${{ runner.temp }}/mcpclient
        run: |
          E2E_HUB_SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$E2E_HUB_SECRET"
          export E2E_HUB_SECRET
          NODE_EXTRA_CA_CERTS="$PWD/certs/ca-chain.crt" /tmp/e2e-venv/bin/python tests/e2e/e2e_signin.py

      # Keycloak's portcullis-needs-stronger.ftl in core's portcullis theme
      # (a Keycloak page: no secret on it), kept on success too.
      - name: Upload the Keycloak needs-stronger screenshot
        timeout-minutes: 10
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-signin-needs-stronger
          path: e2e-artifacts/signin-screens/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-artifacts
          docker compose ps -a > e2e-artifacts/compose-ps.txt 2>&1 || true
          docker ps -a > e2e-artifacts/docker-ps.txt 2>&1 || true
          for svc in traefik keycloak forward-auth group-gate lldap hub enroll mcp-gate; do
            docker compose logs --no-color "$svc" > "e2e-artifacts/$svc.log" 2>&1 || true
          done
          docker run --rm -v portcullis_hub_data:/d:ro "$ALPINE" sh -c 'cat /d/group-gate-policy.json; echo; cat /d/signin-keycloak.json; ls -la /d /d/overrides; cat /d/overrides/*.yml' > e2e-artifacts/hub-data.txt 2>&1 || true

      # The screenshots and HTML of the password pages are taken before
      # anything is typed; no traces are recorded.
      - name: Upload screenshots and logs
        timeout-minutes: 10
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-signin-artifacts
          path: e2e-artifacts/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          for p in $(docker ps -aq --filter label=com.docker.compose.project | xargs -r docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' | sort -u | grep -E '^portcullis-(echo|oidc)-'); do
            docker compose -p "$p" down -v 2>/dev/null || true
          done
          docker compose down -v
          rm -rf /tmp/e2e-secrets

  # The app settings panel's deliveries on a real stack (contract §13): the
  # Hub (same-named Hub branch) with one local template source: the
  # templates repo's immich, grafana, nextcloud and firefox-sync (its
  # same-named branch, else main) and the CI fixtures tests/e2e/apps/
  # settings-echo (header) and settings-file (data file + hook). Claims
  # (Immich), headers (Grafana, settings-echo through group-gate), data
  # files + hooks + restarts, My apps and person-entered values on
  # people.<domain> (firefox-sync's allowlist and guard.sql on Postgres),
  # membership changes through the Hub, Nextcloud's start hook.
  e2e-settings:
    needs: jobs-input
    # Runs unless a workflow_dispatch named other jobs (input `jobs`: `all`, or
    # names separated by commas and/or spaces; exact names, so `e2e` is not `e2e-ai`).
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.jobs == '' || inputs.jobs == 'all'
      || contains(format(' ,{0}, ', inputs.jobs), ',e2e-settings,') || contains(format(' ,{0}, ', inputs.jobs), ',e2e-settings ') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-settings,') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-settings ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_DOMAIN: portcullis.local
      E2E_ARTIFACTS: e2e-artifacts
      ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      APP_HOSTS: photos grafana cloud firefox-sync settings-echo settings-file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Immich (server + ML + Postgres), Nextcloud and the core stack.
      - name: Free disk space (preinstalled toolchains this job doesn't use)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup "${AGENT_TOOLSDIRECTORY:-/nonexistent}"
          df -h /

      - name: Templates (same-named templates branch, else main)
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          url=https://github.com/porelli/portcullis-templates
          ref=main
          if [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] && [ "$REF" != main ] && [[ "$REF" != v* ]] \
              && git ls-remote --exit-code --heads "$url" "$REF" >/dev/null; then
            ref="$REF"
          fi
          git clone --quiet --depth=1 --branch "$ref" "$url" "$RUNNER_TEMP/templates"
          echo "Templates: portcullis-templates@$ref ($(git -C "$RUNNER_TEMP/templates" rev-parse --short HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
          for t in immich grafana nextcloud firefox-sync; do
            test -f "$RUNNER_TEMP/templates/$t/manifest.yaml"
          done

      - name: Generate .env and the CI override (Pebble, fake DNS provider, app hostnames on Traefik)
        run: |
          ./portcullis init --env-only --runtime docker --non-interactive --domain portcullis.local \
            --email ci@portcullis.local --dns-provider none
          for v in KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD LLDAP_ADMIN_PASSWORD; do
            val="$(grep "^$v=" .env | cut -d= -f2-)"
            [ "$v" = KEYCLOAK_ADMIN ] || echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          done
          # Public DNS stand-in: on portcullis-proxy auth.<domain> and the
          # apps' hosts resolve to Traefik (Immich and Nextcloud reach
          # Keycloak there, as through public DNS in production). The static
          # address is restated: the override replaces the entry.
          cat > docker-compose.ci.yml <<'YML'
          services:
            # CI only (contract §8.1 "Extra entries"): the Hub's trust list
            # gets Chromium's virtual authenticator as a security key.
            hub:
              environment:
                HUB_DEV: "1"
                HUB_SIGNIN_EXTRA_AUTHENTICATORS: /run/portcullis/signin/extra-authenticators.json
              volumes:
                - ./tests/e2e/fixtures/virtual-authenticators.json:/run/portcullis/signin/extra-authenticators.json:ro
            keycloak:
              ports:
                - "127.0.0.1:9000:9000"
            lldap:
              ports:
                - "127.0.0.1:17170:17170"
            traefik:
              networks:
                portcullis-proxy:
                  ipv4_address: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
                  aliases:
                    - auth.portcullis.local
                    - people.portcullis.local
                    - photos.portcullis.local
                    - grafana.portcullis.local
                    - cloud.portcullis.local
                    - firefox-sync.portcullis.local
                    - settings-echo.portcullis.local
                    - settings-file.portcullis.local
            domains:
              build:
                args:
                  GO_TAGS: testprovider
              environment:
                ACME_CA_SERVER: https://pebble:14000/dir
                LEGO_CA_CERTIFICATES: /run/ci/pebble.minica.pem
                DOMAINS_RESOLVERS: 127.0.0.1:8053
              volumes:
                - /tmp/pebble.minica.pem:/run/ci/pebble.minica.pem:ro
            pebble:
              image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
              command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "domains:8053"]
              environment:
                PEBBLE_VA_NOSLEEP: "1"
                PEBBLE_WFE_NONCEREJECT: "0"
              networks: [domains-egress]
          YML
          docker compose config -q
          docker compose config --format json | jq -e '.services.traefik.networks["portcullis-proxy"] | (.aliases | index("auth.portcullis.local")) and .ipv4_address != null' >/dev/null \
            || { echo "FAIL: Traefik alias override not applied"; exit 1; }

      - name: List the images this job runs
        run: |
          {
            docker compose config --images | grep -vxE 'portcullis-(enroll|group-gate|domains|mcp-gate)|ghcr\.io/porelli/portcullis-(hub|keycloak):.*'
            grep -ohE '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' .github/workflows/ci.yml scripts/lib/common.sh tests/e2e/apps/*/compose.yml \
              | grep -E '^(alpine|busybox|traefik/whoami|curlimages/curl):'
          } | sort -u > "$RUNNER_TEMP/images.txt"
      - name: Load images (cached, verified)
        timeout-minutes: 15
        uses: ./.github/actions/cached-images
        with:
          images: ${{ runner.temp }}/images.txt
          name: e2e-settings
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The apps' images (pinned tag@sha256 in their compose files): pulled
      # by digest up front, so the Hub's enable doesn't wait for them.
      - name: Pull the templates' images (by digest)
        run: |
          set -o pipefail
          grep -ohE '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' \
            "$RUNNER_TEMP"/templates/{immich,grafana,nextcloud,firefox-sync}/compose.yml | sort -u > "$RUNNER_TEMP/app-images.txt"
          cat "$RUNNER_TEMP/app-images.txt"
          pull() { for i in 1 2 3 4; do docker pull -q "$1" >/dev/null && return 0; sleep $((i * 15)); done; echo "FAIL: pull $1"; return 1; }
          export -f pull
          # shellcheck disable=SC2016
          xargs -P 4 -I{} bash -c 'pull "$1"' _ {} < "$RUNNER_TEMP/app-images.txt"
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build enrollment UI (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: enroll
          tags: portcullis-enroll
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=enroll
          cache-to: ""
      - name: Build group-gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: group-gate
          tags: portcullis-group-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=group-gate
          cache-to: ""
      - name: Build the domains service (CI test build, buildx layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: domains
          tags: portcullis-domains
          build-args: GO_TAGS=testprovider
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=domains-test
          cache-to: ""
      - name: Build the MCP gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mcp-gate
          # compose's image name for mcp-gate
          tags: portcullis-mcp-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=mcp-gate
          cache-to: ""
      - name: Hub image (same-named Hub branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/hub-image
      - name: Keycloak image (same-named portcullis-keycloak branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/keycloak-image

      - name: Start the whole stack (Hub with the CI template source)
        run: |
          PEBBLE_IMG=$(docker compose config --format json | jq -r .services.pebble.image)
          cid="$(docker create "$PEBBLE_IMG")"; docker cp "$cid:/test/certs/pebble.minica.pem" /tmp/pebble.minica.pem; docker rm "$cid" >/dev/null
          chmod 644 /tmp/pebble.minica.pem
          docker compose up -d postgres lldap
          ./portcullis vault init
          ./portcullis pki setup --with-server-cert
          ./portcullis config apply --bundle-only
          printf 'tls:\n  certificates:\n    - certFile: /certs/server.crt\n      keyFile: /certs/server.key\n' > traefik/dynamic/ci-certs.yml
          # The Hub's only template source: the pilots from the templates
          # checkout and the two CI fixtures, as a local source (path, no
          # URL: never pulled; no marketplace clone).
          docker volume create --label com.docker.compose.project=portcullis --label com.docker.compose.volume=hub_data portcullis_hub_data >/dev/null
          docker run --rm -v portcullis_hub_data:/data -v "$PWD/tests/e2e/apps:/src:ro" -v "$RUNNER_TEMP/templates:/tpl:ro" "$ALPINE" sh -c '
            mkdir -p /data/repos/ci &&
            cp -r /tpl/immich /tpl/grafana /tpl/nextcloud /tpl/firefox-sync /src/settings-echo /src/settings-file /data/repos/ci/ &&
            printf "sources:\n  - name: ci\n    url: \"\"\n    path: /data/repos/ci\n" > /data/state.yaml &&
            chown -R 10001:10001 /data && chmod 600 /data/state.yaml'
          # shellcheck disable=SC2046
          docker compose up -d $(docker compose config --services | grep -vx hub)
          for i in $(seq 1 100); do
            curl -sf http://127.0.0.1:9000/health/ready >/dev/null && break
            [ "$i" -eq 100 ] && { echo "FAIL: Keycloak not ready"; docker compose logs --tail=80 keycloak; exit 1; }
            sleep 3
          done
          ./portcullis keycloak configure
          ./portcullis oidc register
          ./portcullis up
          docker compose restart forward-auth forward-auth-ext
          docker compose ps
          HUB_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis").IPAddress}}' "$(docker compose ps -q hub)")
          echo "HUB_IP=$HUB_IP" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "http://$HUB_IP:8888/healthz")" = 200 ] && break
            [ "$i" -eq 40 ] && { echo "FAIL: hub /healthz"; docker compose logs --tail=40 hub; exit 1; }
            sleep 2
          done

      - name: Users, groups, instances and settings (through the Hub's API), setup links
        run: |
          set -o pipefail
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$SECRET"
          hub() { local m="$1" p="$2"; shift 2
                  curl -s -X "$m" -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$SECRET") \
                    -H 'Content-Type: application/json' "$@" "http://$HUB_IP:8888$p"; }
          hubc() { hub "$@" -o /tmp/hub.out -w '%{http_code}'; }
          # hubop: a lifecycle route's 202, then its op record until done.
          source tests/e2e/hubop.sh
          want() { local code="$1" what="$2"; shift 2
                   [ "$code" = 200 ] || { echo "FAIL: $what: HTTP $code $(head -c 600 /tmp/hub.out)"; docker compose logs --tail=40 hub; exit 1; }; }
          TEMPLATES="immich grafana nextcloud firefox-sync settings-echo settings-file"
          for i in $(seq 1 30); do
            hub GET /api/templates | jq -e --arg t "$TEMPLATES" '[.[].id] as $ids | ($t | split(" ")) - $ids == []' >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "FAIL: the Hub did not load every template: $(hub GET /api/templates | jq -c '[.[].id]')"; docker compose logs --tail=60 hub; exit 1; }
            sleep 2
          done
          echo "PASS: the Hub loaded $TEMPLATES"

          # Users (LLDAP, as the admin); everything else through the Hub.
          LLDAP_TOKEN=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
            | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          [ -z "$LLDAP_TOKEN" ] || [ "$LLDAP_TOKEN" = null ] || echo "::add-mask::$LLDAP_TOKEN"
          gql() { jq -n --arg q "$1" '{query: $q}' | curl -sf http://127.0.0.1:17170/api/graphql \
                    -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") -H 'Content-Type: application/json' -d @-; }
          for u in alice bob carol dave; do
            gql "mutation { createUser(user: {id: \"$u\", email: \"$u@portcullis.local\"}) { id } }" | jq -e '.errors == null' >/dev/null
          done

          # Enable every default instance (EnableAs creates users_<id> / admin_<id>).
          for id in grafana settings-echo settings-file firefox-sync immich nextcloud; do
            t0=$SECONDS
            HUBOP_TIMEOUT=1500 hubop POST /api/templates/enable -d "{\"id\":\"$id\"}" || { echo "FAIL: enable $id"; exit 1; }
            echo "enabled $id in $((SECONDS - t0)) s: $(jq -c '{groups_created: .result.groups_created, warnings}' /tmp/op.json 2>/dev/null)"
          done
          # Groups the scenarios need that EnableAs may not create (P28:
          # admin_grafana; firefox-sync's access group with group_access off).
          GROUPS_JSON="$(gql '{ groups { displayName } }')"
          for g in office_milan users_immich admin_immich users_grafana admin_grafana users_firefox-sync users_settings-echo users_settings-file; do
            echo "$GROUPS_JSON" | jq -e --arg g "$g" 'any(.data.groups[]; .displayName == $g)' >/dev/null && continue
            code=$(hubc POST /api/directory/groups -d "$(jq -cn --arg g "$g" '{name: $g}')")
            want "$code" "create group $g"
            echo "created $g"
          done
          for m in alice:users_immich alice:office_milan alice:users_grafana alice:users_settings-echo alice:users_firefox-sync \
                   bob:users_immich bob:admin_immich bob:users_grafana bob:admin_grafana bob:users_settings-echo bob:users_firefox-sync \
                   carol:users_settings-file carol:office_milan; do
            code=$(hubc POST "/api/directory/groups/${m#*:}/members" -d "$(jq -cn --arg u "${m%%:*}" '{username: $u}')")
            want "$code" "add $m"
          done

          # Starting settings (contract §13.12).
          save() {
            code=$(hubc PUT "/api/instances/$1/settings" -d "$2")
            want "$code" "settings of $1"
            echo "saved $1: $(jq -c '{effect, changed, warnings}' /tmp/hub.out)"
          }
          save immich '{"person":{"storage_quota":{"default":"100GiB","resolve":"max","rows":[{"group":"office_milan","value":"10GiB"}]}}}'
          save settings-echo '{"person":{"tier":{"default":"bronze","resolve":"max","rows":[{"group":"office_milan","value":"gold"}]}}}'
          save settings-file '{"person":{"seats":{"default":1,"resolve":"max","rows":[{"group":"office_milan","value":5}]},"level":{"default":"basic","resolve":"max","rows":[{"group":"office_milan","value":"plus"}]}}}'
          code=$(hubc GET /api/instances/immich/settings)
          want "$code" "immich settings panel"
          jq -e '(.options | type == "array" and length > 0) and any(.options[]; .key == "storage_quota")' /tmp/hub.out >/dev/null \
            || { echo "FAIL: immich settings panel has no options: $(head -c 400 /tmp/hub.out)"; exit 1; }

          # shellcheck disable=SC2086
          echo "127.0.0.1 portcullis.local auth.portcullis.local enroll.portcullis.local hub.portcullis.local people.portcullis.local $(printf '%s.portcullis.local ' $APP_HOSTS)" | sudo tee -a /etc/hosts
          for spec in "E2E_ALICE_INVITE alice" "E2E_BOB_INVITE bob" "E2E_CAROL_INVITE carol"; do
            read -r var who <<<"$spec"
            url="$(./portcullis invite "$who" --to portal --json | jq -r .url)"
            # Masked before anything can print it: a malformed link may still carry a token.
            [ -z "$url" ] || [ "$url" = null ] || echo "::add-mask::$url"
            [[ "$url" =~ ^https://enroll\.portcullis\.local/invite/[A-Za-z0-9_-]{43}$ ]] || { echo "FAIL: setup link for $who: $url"; exit 1; }
            echo "$var=$url" >> "$GITHUB_ENV"
          done

      - name: Restore the pip / Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: e2e-playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/requirements.txt') }}

      - name: Install Playwright (pinned) and trust core's CA
        timeout-minutes: 10
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install --quiet -r tests/e2e/requirements.txt
          sudo /tmp/e2e-venv/bin/playwright install-deps chromium
          /tmp/e2e-venv/bin/playwright install chromium
          sudo apt-get install -y -qq libnss3-tools >/dev/null
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password 2>/dev/null || true
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n portcullis-root -i certs/root-ca.crt

      - name: Run the settings scenarios (claims, headers, data files, hooks, My apps, person-entered values)
        run: |
          E2E_HUB_SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$E2E_HUB_SECRET"
          export E2E_HUB_SECRET
          NODE_EXTRA_CA_CERTS="$PWD/certs/ca-chain.crt" /tmp/e2e-venv/bin/python tests/e2e/e2e_settings.py

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-artifacts/apps
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$SECRET"
          docker compose ps -a > e2e-artifacts/compose-ps.txt 2>&1 || true
          docker ps -a > e2e-artifacts/docker-ps.txt 2>&1 || true
          for svc in traefik keycloak forward-auth group-gate lldap hub socket-proxy-hub; do
            docker compose logs --no-color "$svc" > "e2e-artifacts/$svc.log" 2>&1 || true
          done
          for c in $(docker ps -aq --filter label=com.docker.compose.project); do
            name="$(docker inspect -f '{{.Name}}' "$c" | tr -d /)"
            case "$name" in portcullis-*-*) docker logs "$c" > "e2e-artifacts/apps/$name.log" 2>&1 || true ;; esac
          done
          # Settings panels (secrets are write-only: {set, updated_at}) and delivery status.
          for id in immich grafana nextcloud firefox-sync settings-echo settings-file; do
            curl -s -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$SECRET") \
              "http://$HUB_IP:8888/api/instances/$id/settings" > "e2e-artifacts/panel-$id.json" 2>&1 || true
          done
          docker run --rm -v portcullis_hub_data:/d:ro "$ALPINE" sh -c 'cat /d/group-gate-policy.json; echo; cat /d/user-attributes.json; echo; ls -la /d /d/overrides; cat /d/overrides/*.yml' > e2e-artifacts/hub-data.txt 2>&1 || true
          # shellcheck disable=SC2024
          sudo find appfiles -name '*.json' ! -name '*.secrets.json' -exec sh -c 'echo "== $1"; cat "$1"; echo' _ {} \; > e2e-artifacts/appfiles.txt 2>&1 || true

      - name: Upload screenshots, traces and logs
        timeout-minutes: 10
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-settings-artifacts
          path: e2e-artifacts/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          for p in $(docker ps -aq --filter label=com.docker.compose.project | xargs -r docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' | sort -u | grep '^portcullis-.'); do
            docker compose -p "$p" down -v 2>/dev/null || true
          done
          docker compose down -v

  # Shared folders and the doctor on a real stack (contract §14): the Hub
  # (same-named Hub branch) with one local template source = the templates
  # repo's jellyfin (same-named templates branch, else main: its folder
  # blocks) and the CI fixture tests/e2e/apps/folder-writer (2001:2001,
  # umask 022, a folder-write `shared` option, a lan_only port). The tree
  # /srv/e2e-media (50 files 1000:1000 0640, dirs 0750) is on the runner's
  # ext4 root with ACLs; the Hub's fixer helper (its own image, root in a
  # capped container) changes it through core's unchanged socket-proxy-hub.
  # tests/e2e/e2e_folders.py: check path, create (gid 60000), assign
  # preview / apply / host verify, doctor drift, undo, lan_only exposure and
  # rebind, the socket proxy as on main. No browser.
  e2e-folders:
    needs: jobs-input
    # Runs unless a workflow_dispatch named other jobs (input `jobs`: `all`, or
    # names separated by commas and/or spaces; exact names, so `e2e` is not `e2e-ai`).
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.jobs == '' || inputs.jobs == 'all'
      || contains(format(' ,{0}, ', inputs.jobs), ',e2e-folders,') || contains(format(' ,{0}, ', inputs.jobs), ',e2e-folders ') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-folders,') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-folders ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_DOMAIN: portcullis.local
      E2E_ARTIFACTS: e2e-artifacts
      E2E_MEDIA: /srv/e2e-media
      ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Templates (same-named templates branch, else main)
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          url=https://github.com/porelli/portcullis-templates
          ref=main
          if [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] && [ "$REF" != main ] && [[ "$REF" != v* ]] \
              && git ls-remote --exit-code --heads "$url" "$REF" >/dev/null; then
            ref="$REF"
          fi
          git clone --quiet --depth=1 --branch "$ref" "$url" "$RUNNER_TEMP/templates"
          echo "Templates: portcullis-templates@$ref ($(git -C "$RUNNER_TEMP/templates" rev-parse --short HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
          # Fail closed: the scenarios need jellyfin's folder block.
          grep -q '^      folder:' "$RUNNER_TEMP/templates/jellyfin/manifest.yaml" \
            || { echo "FAIL: jellyfin has no folder block on portcullis-templates@$ref"; exit 1; }

      - name: Generate .env and the CI override (Pebble, fake DNS provider, auth on portcullis-proxy)
        run: |
          ./portcullis init --env-only --runtime docker --non-interactive --domain portcullis.local \
            --email ci@portcullis.local --dns-provider none
          for v in KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD LLDAP_ADMIN_PASSWORD; do
            val="$(grep "^$v=" .env | cut -d= -f2-)"
            [ "$v" = KEYCLOAK_ADMIN ] || echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          done
          # Jellyfin's setup reaches Keycloak at auth.<domain> (public DNS
          # stand-in, as in e2e-settings).
          cat > docker-compose.ci.yml <<'YML'
          services:
            # CI only (contract §8.1 "Extra entries"): the Hub's trust list
            # gets Chromium's virtual authenticator as a security key.
            hub:
              environment:
                HUB_DEV: "1"
                HUB_SIGNIN_EXTRA_AUTHENTICATORS: /run/portcullis/signin/extra-authenticators.json
              volumes:
                - ./tests/e2e/fixtures/virtual-authenticators.json:/run/portcullis/signin/extra-authenticators.json:ro
            keycloak:
              ports:
                - "127.0.0.1:9000:9000"
            lldap:
              ports:
                - "127.0.0.1:17170:17170"
            traefik:
              networks:
                portcullis-proxy:
                  ipv4_address: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
                  aliases:
                    - auth.portcullis.local
                    - media.portcullis.local
            domains:
              build:
                args:
                  GO_TAGS: testprovider
              environment:
                ACME_CA_SERVER: https://pebble:14000/dir
                LEGO_CA_CERTIFICATES: /run/ci/pebble.minica.pem
                DOMAINS_RESOLVERS: 127.0.0.1:8053
              volumes:
                - /tmp/pebble.minica.pem:/run/ci/pebble.minica.pem:ro
            pebble:
              image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
              command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "domains:8053"]
              environment:
                PEBBLE_VA_NOSLEEP: "1"
                PEBBLE_WFE_NONCEREJECT: "0"
              networks: [domains-egress]
          YML
          docker compose config -q
          docker compose config --format json | jq -e '.services.traefik.networks["portcullis-proxy"] | (.aliases | index("auth.portcullis.local")) and .ipv4_address != null' >/dev/null \
            || { echo "FAIL: Traefik alias override not applied"; exit 1; }
          # Main's compose file: the socket proxy must be its service, unchanged.
          git fetch --quiet --depth=1 origin main
          git show origin/main:docker-compose.yml > /tmp/main-docker-compose.yml

      - name: List the images this job runs
        run: |
          {
            docker compose config --images | grep -vxE 'portcullis-(enroll|group-gate|domains|mcp-gate)|ghcr\.io/porelli/portcullis-(hub|keycloak):.*'
            grep -ohE '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' .github/workflows/ci.yml scripts/lib/common.sh tests/e2e/apps/*/compose.yml \
              | grep -E '^(alpine|busybox|traefik/whoami|curlimages/curl):'
          } | sort -u > "$RUNNER_TEMP/images.txt"
      - name: Load images (cached, verified)
        timeout-minutes: 15
        uses: ./.github/actions/cached-images
        with:
          images: ${{ runner.temp }}/images.txt
          name: e2e-folders
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Pull Jellyfin's images (by digest)
        run: |
          set -o pipefail
          grep -ohE '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' "$RUNNER_TEMP/templates/jellyfin/compose.yml" \
            | sort -u > "$RUNNER_TEMP/app-images.txt"
          cat "$RUNNER_TEMP/app-images.txt"
          while read -r img; do
            for i in 1 2 3 4; do docker pull -q "$img" >/dev/null && break; [ "$i" = 4 ] && { echo "FAIL: pull $img"; exit 1; }; sleep $((i * 15)); done
          done < "$RUNNER_TEMP/app-images.txt"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build enrollment UI (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: enroll
          tags: portcullis-enroll
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=enroll
          cache-to: ""
      - name: Build group-gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: group-gate
          tags: portcullis-group-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=group-gate
          cache-to: ""
      - name: Build the domains service (CI test build, buildx layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: domains
          tags: portcullis-domains
          build-args: GO_TAGS=testprovider
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=domains-test
          cache-to: ""
      - name: Build the MCP gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mcp-gate
          # compose's image name for mcp-gate
          tags: portcullis-mcp-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=mcp-gate
          cache-to: ""
      - name: Hub image (same-named Hub branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/hub-image
      - name: Keycloak image (same-named portcullis-keycloak branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/keycloak-image

      - name: The shared folder's tree on the host (ext4, ACLs)
        run: |
          set -o pipefail
          sudo apt-get install -y -qq acl >/dev/null
          fs="$(findmnt -no FSTYPE,OPTIONS --target /srv)"; echo "/srv: $fs"
          [[ "$fs" == "ext4 "* ]] || { echo "FAIL: /srv is not on ext4"; exit 1; }
          sudo rm -rf "$E2E_MEDIA"
          sudo install -d -o 1000 -g 1000 -m 0750 "$E2E_MEDIA"
          for d in 1 2 3 4 5; do
            sudo install -d -o 1000 -g 1000 -m 0750 "$E2E_MEDIA/d$d"
            for f in $(seq 1 10); do
              echo "movie $d.$f" | sudo tee "$E2E_MEDIA/d$d/movie-$f.mkv" >/dev/null
            done
          done
          sudo find "$E2E_MEDIA" -type f -exec chown 1000:1000 {} + -exec chmod 0640 {} +
          [ "$(sudo find "$E2E_MEDIA" -type f | wc -l)" = 50 ] && [ "$(sudo find "$E2E_MEDIA" -type d | wc -l)" = 6 ] \
            || { echo "FAIL: the tree"; sudo find "$E2E_MEDIA" -ls; exit 1; }
          # The filesystem takes ACLs (a throwaway file outside the tree).
          sudo touch /srv/.acl-probe && sudo setfacl -m g:1000:r /srv/.acl-probe && sudo getfacl --numeric --skip-base /srv/.acl-probe | grep 'group:1000:r--' >/dev/null
          sudo rm -f /srv/.acl-probe

      - name: Start the whole stack (Hub with the CI template source)
        run: |
          PEBBLE_IMG=$(docker compose config --format json | jq -r .services.pebble.image)
          cid="$(docker create "$PEBBLE_IMG")"; docker cp "$cid:/test/certs/pebble.minica.pem" /tmp/pebble.minica.pem; docker rm "$cid" >/dev/null
          chmod 644 /tmp/pebble.minica.pem
          docker compose up -d postgres lldap
          ./portcullis vault init
          ./portcullis pki setup --with-server-cert
          ./portcullis config apply --bundle-only
          printf 'tls:\n  certificates:\n    - certFile: /certs/server.crt\n      keyFile: /certs/server.key\n' > traefik/dynamic/ci-certs.yml
          # The Hub's only template source: jellyfin from the templates
          # checkout and the CI fixture, as a local source (path, no URL).
          docker volume create --label com.docker.compose.project=portcullis --label com.docker.compose.volume=hub_data portcullis_hub_data >/dev/null
          docker run --rm -v portcullis_hub_data:/data -v "$PWD/tests/e2e/apps:/src:ro" -v "$RUNNER_TEMP/templates:/tpl:ro" "$ALPINE" sh -c '
            mkdir -p /data/repos/ci &&
            cp -r /tpl/jellyfin /src/folder-writer /data/repos/ci/ &&
            printf "sources:\n  - name: ci\n    url: \"\"\n    path: /data/repos/ci\n" > /data/state.yaml &&
            chown -R 10001:10001 /data && chmod 600 /data/state.yaml'
          # shellcheck disable=SC2046
          docker compose up -d $(docker compose config --services | grep -vx hub)
          for i in $(seq 1 100); do
            curl -sf http://127.0.0.1:9000/health/ready >/dev/null && break
            [ "$i" -eq 100 ] && { echo "FAIL: Keycloak not ready"; docker compose logs --tail=80 keycloak; exit 1; }
            sleep 3
          done
          ./portcullis keycloak configure
          ./portcullis oidc register
          ./portcullis up
          docker compose restart forward-auth forward-auth-ext
          docker compose ps
          HUB_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis").IPAddress}}' "$(docker compose ps -q hub)")
          echo "HUB_IP=$HUB_IP" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "http://$HUB_IP:8888/healthz")" = 200 ] && break
            [ "$i" -eq 40 ] && { echo "FAIL: hub /healthz"; docker compose logs --tail=40 hub; exit 1; }
            sleep 2
          done
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$SECRET"
          for i in $(seq 1 30); do
            curl -s -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$SECRET") "http://$HUB_IP:8888/api/templates" \
              | jq -e '[.[].id] as $ids | ["jellyfin", "folder-writer"] - $ids == []' >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "FAIL: the Hub did not load jellyfin and folder-writer"; docker compose logs --tail=60 hub; exit 1; }
            sleep 2
          done
          echo "PASS: the Hub loaded jellyfin and folder-writer"

      - name: Run the shared-folder scenarios (check, assign, verify, drift, undo, exposure, socket proxy)
        run: |
          E2E_HUB_SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$E2E_HUB_SECRET"
          export E2E_HUB_SECRET
          python3 tests/e2e/e2e_folders.py

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-artifacts/apps
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$SECRET"
          docker compose ps -a > e2e-artifacts/compose-ps.txt 2>&1 || true
          docker ps -a > e2e-artifacts/docker-ps.txt 2>&1 || true
          for svc in traefik keycloak lldap hub socket-proxy-hub; do
            docker compose logs --no-color "$svc" > "e2e-artifacts/$svc.log" 2>&1 || true
          done
          for c in $(docker ps -aq --filter label=com.docker.compose.project); do
            name="$(docker inspect -f '{{.Name}}' "$c" | tr -d /)"
            case "$name" in portcullis-*-*) docker logs "$c" > "e2e-artifacts/apps/$name.log" 2>&1 || true ;; esac
          done
          for p in /api/folders /api/doctor /api/doctor/op /api/folders/media/op /api/instances/folder-writer/op /api/instances/jellyfin/op; do
            curl -s -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$SECRET") \
              "http://$HUB_IP:8888$p" > "e2e-artifacts/api$(echo "$p" | tr / _).json" 2>&1 || true
          done
          # shellcheck disable=SC2024
          sudo find "$E2E_MEDIA" -printf '%P %U:%G %m %y\n' > e2e-artifacts/tree.txt 2>&1 || true
          # shellcheck disable=SC2024
          sudo getfacl -R --numeric --absolute-names "$E2E_MEDIA" > e2e-artifacts/getfacl.txt 2>&1 || true
          docker run --rm -v portcullis_hub_data:/d:ro "$ALPINE" sh -c 'ls -laR /d/folders /d/folder-snapshots /d/doctor; cat /d/doctor/scans.json; ls -la /d/overrides; cat /d/overrides/*.yml' > e2e-artifacts/hub-data.txt 2>&1 || true

      - name: Upload logs
        timeout-minutes: 10
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-folders-artifacts
          path: e2e-artifacts/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          for p in $(docker ps -aq --filter label=com.docker.compose.project | xargs -r docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' | sort -u | grep '^portcullis-.'); do
            docker compose -p "$p" down -v 2>/dev/null || true
          done
          docker compose down -v
          sudo rm -rf "$E2E_MEDIA"

  # File sharing on a real stack (contract §5.1, §11.6, §13.16, §13.17): the
  # Hub (same-named Hub branch) with one local template source = the
  # templates repo's samba and timemachine (same-named templates branch,
  # else main; the step fails without their person_secret option), the
  # runner's smbclient (apt, pinned), slot 1 of Samba on a shared folder
  # (/srv/e2e-family, ext4 with ACLs). tests/e2e/e2e_filesharing.py: the
  # fresh passkey sign-in popup against real Keycloak (exactly one more
  # assertion, COOP observed), the password shown once (same code again
  # 403), SMB3 logins, revocation SLAs (Hub-made ≤ 10 s, LLDAP-direct ≤ 75 s,
  # measured: `LATENCY` lines and the step summary), a writer demoted to
  # reader, instance and core restores voiding passwords, no hash in any
  # archive, docker inspect, log or the hub_data volume. Passwords and
  # hashes are masked, given to smbclient through PASSWD, never on argv.
  e2e-filesharing:
    needs: jobs-input
    # Runs unless a workflow_dispatch named other jobs (input `jobs`: `all`, or
    # names separated by commas and/or spaces; exact names, so `e2e` is not `e2e-ai`).
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.jobs == '' || inputs.jobs == 'all'
      || contains(format(' ,{0}, ', inputs.jobs), ',e2e-filesharing,') || contains(format(' ,{0}, ', inputs.jobs), ',e2e-filesharing ') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-filesharing,') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-filesharing ')
    # The smbclient pin below is the 24.04 package.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_DOMAIN: portcullis.local
      E2E_ARTIFACTS: e2e-artifacts
      E2E_FAMILY: /srv/e2e-family
      ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      # Ubuntu 24.04's Samba 4.19.5 (any security update of it).
      SMBCLIENT_VERSION: "2:4.19.5+dfsg-4ubuntu9*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Templates (same-named templates branch, else main)
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          url=https://github.com/porelli/portcullis-templates
          ref=main
          if [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] && [ "$REF" != main ] && [[ "$REF" != v* ]] \
              && git ls-remote --exit-code --heads "$url" "$REF" >/dev/null; then
            ref="$REF"
          fi
          git clone --quiet --depth=1 --branch "$ref" "$url" "$RUNNER_TEMP/templates"
          echo "Templates: portcullis-templates@$ref ($(git -C "$RUNNER_TEMP/templates" rev-parse --short HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
          # Fail closed: the scenarios need both file-sharing templates.
          for t in samba timemachine; do
            grep -q '^      type: person_secret' "$RUNNER_TEMP/templates/$t/manifest.yaml" \
              || { echo "FAIL: $t has no person_secret option on portcullis-templates@$ref"; exit 1; }
          done

      - name: Generate .env and the CI override (Pebble, fake DNS provider, auth on portcullis-proxy)
        run: |
          ./portcullis init --env-only --runtime docker --non-interactive --domain portcullis.local \
            --email ci@portcullis.local --dns-provider none
          for v in KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD LLDAP_ADMIN_PASSWORD; do
            val="$(grep "^$v=" .env | cut -d= -f2-)"
            [ "$v" = KEYCLOAK_ADMIN ] || echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          done
          cat > docker-compose.ci.yml <<'YML'
          services:
            # CI only (contract §8.1 "Extra entries"): the Hub's trust list
            # gets Chromium's virtual authenticator as a security key.
            hub:
              environment:
                HUB_DEV: "1"
                HUB_SIGNIN_EXTRA_AUTHENTICATORS: /run/portcullis/signin/extra-authenticators.json
              volumes:
                - ./tests/e2e/fixtures/virtual-authenticators.json:/run/portcullis/signin/extra-authenticators.json:ro
            keycloak:
              ports:
                - "127.0.0.1:9000:9000"
            lldap:
              ports:
                - "127.0.0.1:17170:17170"
            traefik:
              networks:
                portcullis-proxy:
                  ipv4_address: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
                  aliases:
                    - auth.portcullis.local
                    - people.portcullis.local
            domains:
              build:
                args:
                  GO_TAGS: testprovider
              environment:
                ACME_CA_SERVER: https://pebble:14000/dir
                LEGO_CA_CERTIFICATES: /run/ci/pebble.minica.pem
                DOMAINS_RESOLVERS: 127.0.0.1:8053
              volumes:
                - /tmp/pebble.minica.pem:/run/ci/pebble.minica.pem:ro
            pebble:
              image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
              command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "domains:8053"]
              environment:
                PEBBLE_VA_NOSLEEP: "1"
                PEBBLE_WFE_NONCEREJECT: "0"
              networks: [domains-egress]
          YML
          docker compose config -q
          docker compose config --format json | jq -e '.services.traefik.networks["portcullis-proxy"] | (.aliases | index("auth.portcullis.local")) and .ipv4_address != null' >/dev/null \
            || { echo "FAIL: Traefik alias override not applied"; exit 1; }

      - name: List the images this job runs
        run: |
          {
            docker compose config --images | grep -vxE 'portcullis-(enroll|group-gate|domains|mcp-gate)|ghcr\.io/porelli/portcullis-(hub|keycloak):.*'
            grep -ohE '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' .github/workflows/ci.yml scripts/lib/common.sh tests/e2e/apps/*/compose.yml \
              | grep -E '^(alpine|busybox|traefik/whoami|curlimages/curl):'
          } | sort -u > "$RUNNER_TEMP/images.txt"
      - name: Load images (cached, verified)
        timeout-minutes: 15
        uses: ./.github/actions/cached-images
        with:
          images: ${{ runner.temp }}/images.txt
          name: e2e-filesharing
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Pull the file-sharing templates' images (by digest)
        run: |
          set -o pipefail
          grep -ohE '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' \
            "$RUNNER_TEMP"/templates/{samba,timemachine}/compose.yml | sort -u > "$RUNNER_TEMP/app-images.txt"
          cat "$RUNNER_TEMP/app-images.txt"
          while read -r img; do
            for i in 1 2 3 4; do docker pull -q "$img" >/dev/null && break; [ "$i" = 4 ] && { echo "FAIL: pull $img"; exit 1; }; sleep $((i * 15)); done
          done < "$RUNNER_TEMP/app-images.txt"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build enrollment UI (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: enroll
          tags: portcullis-enroll
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=enroll
          cache-to: ""
      - name: Build group-gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: group-gate
          tags: portcullis-group-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=group-gate
          cache-to: ""
      - name: Build the domains service (CI test build, buildx layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: domains
          tags: portcullis-domains
          build-args: GO_TAGS=testprovider
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=domains-test
          cache-to: ""
      - name: Build the MCP gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mcp-gate
          # compose's image name for mcp-gate
          tags: portcullis-mcp-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=mcp-gate
          cache-to: ""
      - name: Hub image (same-named Hub branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/hub-image
      - name: Keycloak image (same-named portcullis-keycloak branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/keycloak-image

      - name: smbclient (apt, pinned) and the shared folder on the host (ext4, ACLs)
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends "smbclient=$SMBCLIENT_VERSION" acl >/dev/null
          v="$(smbclient --version)"; echo "smbclient: $v ($(dpkg-query -W -f='${Version}' smbclient))" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$v" == "Version 4.19.5"* ]] || { echo "FAIL: smbclient $v is not the pinned 4.19.5"; exit 1; }
          fs="$(findmnt -no FSTYPE --target /srv)"; [ "$fs" = ext4 ] || { echo "FAIL: /srv is $fs, not ext4"; exit 1; }
          sudo rm -rf "$E2E_FAMILY"
          sudo install -d -o 0 -g 0 -m 0755 "$E2E_FAMILY"
          echo "family photos" | sudo tee "$E2E_FAMILY/readme.txt" >/dev/null

      - name: Start the whole stack (Hub with the CI template source)
        run: |
          PEBBLE_IMG=$(docker compose config --format json | jq -r .services.pebble.image)
          cid="$(docker create "$PEBBLE_IMG")"; docker cp "$cid:/test/certs/pebble.minica.pem" /tmp/pebble.minica.pem; docker rm "$cid" >/dev/null
          chmod 644 /tmp/pebble.minica.pem
          docker compose up -d postgres lldap
          ./portcullis vault init
          ./portcullis pki setup --with-server-cert
          ./portcullis config apply --bundle-only
          printf 'tls:\n  certificates:\n    - certFile: /certs/server.crt\n      keyFile: /certs/server.key\n' > traefik/dynamic/ci-certs.yml
          # The Hub's only template source: samba and timemachine from the
          # templates checkout, as a local source (path, no URL).
          docker volume create --label com.docker.compose.project=portcullis --label com.docker.compose.volume=hub_data portcullis_hub_data >/dev/null
          docker run --rm -v portcullis_hub_data:/data -v "$RUNNER_TEMP/templates:/tpl:ro" "$ALPINE" sh -c '
            mkdir -p /data/repos/ci &&
            cp -r /tpl/samba /tpl/timemachine /data/repos/ci/ &&
            printf "sources:\n  - name: ci\n    url: \"\"\n    path: /data/repos/ci\n" > /data/state.yaml &&
            chown -R 10001:10001 /data && chmod 600 /data/state.yaml'
          # shellcheck disable=SC2046
          docker compose up -d $(docker compose config --services | grep -vx hub)
          for i in $(seq 1 100); do
            curl -sf http://127.0.0.1:9000/health/ready >/dev/null && break
            [ "$i" -eq 100 ] && { echo "FAIL: Keycloak not ready"; docker compose logs --tail=80 keycloak; exit 1; }
            sleep 3
          done
          ./portcullis keycloak configure
          ./portcullis oidc register
          ./portcullis up
          docker compose restart forward-auth forward-auth-ext
          docker compose ps
          HUB_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis").IPAddress}}' "$(docker compose ps -q hub)")
          echo "HUB_IP=$HUB_IP" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "http://$HUB_IP:8888/healthz")" = 200 ] && break
            [ "$i" -eq 40 ] && { echo "FAIL: hub /healthz"; docker compose logs --tail=40 hub; exit 1; }
            sleep 2
          done
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$SECRET"
          for i in $(seq 1 30); do
            curl -s -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$SECRET") "http://$HUB_IP:8888/api/templates" \
              | jq -e '[.[].id] as $ids | ["samba", "timemachine"] - $ids == []' >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "FAIL: the Hub did not load samba and timemachine"; docker compose logs --tail=60 hub; exit 1; }
            sleep 2
          done
          echo "PASS: the Hub loaded samba and timemachine"
          echo "127.0.0.1 portcullis.local auth.portcullis.local enroll.portcullis.local hub.portcullis.local people.portcullis.local" | sudo tee -a /etc/hosts

      - name: Restore the pip / Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: e2e-playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/requirements.txt') }}

      - name: Install Playwright (pinned) and trust core's CA
        timeout-minutes: 10
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install --quiet -r tests/e2e/requirements.txt
          sudo /tmp/e2e-venv/bin/playwright install-deps chromium
          /tmp/e2e-venv/bin/playwright install chromium
          sudo apt-get install -y -qq libnss3-tools >/dev/null
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password 2>/dev/null || true
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n portcullis-root -i certs/root-ca.crt

      - name: Run the file-sharing scenarios (fresh auth, shown once, SMB3, revocation SLAs, restores, no hash)
        run: |
          E2E_HUB_SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$E2E_HUB_SECRET"
          export E2E_HUB_SECRET
          NODE_EXTRA_CA_CERTS="$PWD/certs/ca-chain.crt" /tmp/e2e-venv/bin/python tests/e2e/e2e_filesharing.py

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-artifacts/apps
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$SECRET"
          HUB_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis").IPAddress}}' "$(docker compose ps -q hub)" 2>/dev/null || true)
          docker compose ps -a > e2e-artifacts/compose-ps.txt 2>&1 || true
          docker ps -a > e2e-artifacts/docker-ps.txt 2>&1 || true
          for svc in traefik keycloak forward-auth group-gate lldap hub socket-proxy-hub; do
            docker compose logs --no-color "$svc" > "e2e-artifacts/$svc.log" 2>&1 || true
          done
          for c in $(docker ps -aq --filter label=com.docker.compose.project); do
            name="$(docker inspect -f '{{.Name}}' "$c" | tr -d /)"
            case "$name" in portcullis-*-*) docker logs "$c" > "e2e-artifacts/apps/$name.log" 2>&1 || true ;; esac
          done
          # Metadata only (never a hash or password): credentials views, ops, settings panels, the audit.
          for p in /api/instances/samba/credentials /api/instances/timemachine/credentials /api/instances/samba/op \
                   /api/instances/timemachine/op /api/instances/samba/settings /api/instances/timemachine/settings \
                   /api/folders /api/doctor /api/directory/audit; do
            curl -s -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$SECRET") \
              "http://$HUB_IP:8888$p" > "e2e-artifacts/api$(echo "$p" | tr / _).json" 2>&1 || true
          done

      - name: Upload screenshots and logs
        timeout-minutes: 10
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-filesharing-artifacts
          path: e2e-artifacts/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          for p in $(docker ps -aq --filter label=com.docker.compose.project | xargs -r docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' | sort -u | grep '^portcullis-.'); do
            docker compose -p "$p" down -v 2>/dev/null || true
          done
          docker compose down -v
          sudo rm -rf "$E2E_FAMILY"

  # AI support end to end (contract §15, plan 4 Task 30): the whole stack +
  # the Hub (same-named Hub branch) with one local template source = the
  # templates repo's gitea (app_token: the official gitea-mcp, mint / revoke
  # hooks) and grafana (identity_headers: mcp-grafana on its trust network)
  # (same-named templates branch, else main) plus the CI fixture echo (the
  # admin MCP's throwaway delete); instances gitea, gitea-b, grafana. tests/e2e/mcpclient (the official MCP Go SDK) runs on the
  # runner host (G60) as Claude Code would: RFC 9728 discovery, Keycloak's
  # authorization code flow with PKCE and `resource` for
  # portcullis-ai-claude-code, a loopback callback on 127.0.0.1:33418, then
  # Streamable HTTP through Traefik → mcp-gate → gitea-mcp → Gitea.
  # tests/e2e/e2e_ai.py (Playwright, CDP virtual authenticator for the
  # sign-in and consent): AI set up through the Hub's API as the CI admin
  # root (never LLDAP's admin), then gitea_as_alice, audience_separation,
  # no_token_crossing, destructive_confirmation, aggregate_lists,
  # leaver_refused_and_revoked, ai_off.
  e2e-ai:
    needs: jobs-input
    # Runs unless a workflow_dispatch named other jobs (input `jobs`: `all`, or
    # names separated by commas and/or spaces; exact names, so `e2e` is not `e2e-ai`).
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.jobs == '' || inputs.jobs == 'all'
      || contains(format(' ,{0}, ', inputs.jobs), ',e2e-ai,') || contains(format(' ,{0}, ', inputs.jobs), ',e2e-ai ') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-ai,') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-ai ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_DOMAIN: portcullis.local
      E2E_ARTIFACTS: e2e-artifacts
      ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Templates (same-named templates branch, else main)
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          url=https://github.com/porelli/portcullis-templates
          ref=main
          if [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] && [ "$REF" != main ] && [[ "$REF" != v* ]] \
              && git ls-remote --exit-code --heads "$url" "$REF" >/dev/null; then
            ref="$REF"
          fi
          git clone --quiet --depth=1 --branch "$ref" "$url" "$RUNNER_TEMP/templates"
          echo "Templates: portcullis-templates@$ref ($(git -C "$RUNNER_TEMP/templates" rev-parse --short HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q '^ai:' "$RUNNER_TEMP/templates/gitea/manifest.yaml" \
            || { echo "FAIL: the templates checkout's gitea has no ai: block"; exit 1; }
          grep -q 'mode: identity_headers' "$RUNNER_TEMP/templates/grafana/manifest.yaml" \
            || { echo "FAIL: the templates checkout's grafana has no identity_headers companion"; exit 1; }

      - name: Generate .env and the CI override (Pebble, fake DNS provider, app hostnames on Traefik)
        run: |
          ./portcullis init --env-only --runtime docker --non-interactive --domain portcullis.local \
            --email ci@portcullis.local --dns-provider none
          for v in KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD LLDAP_ADMIN_PASSWORD; do
            val="$(grep "^$v=" .env | cut -d= -f2-)"
            [ "$v" = KEYCLOAK_ADMIN ] || echo "::add-mask::$val"
          done
          # Public DNS stand-in: on portcullis-proxy auth.<domain> resolves
          # to Traefik (Gitea's OIDC discovery and token calls), as through
          # public DNS in production. The static address is restated: the
          # override replaces the entry.
          cat > docker-compose.ci.yml <<'YML'
          services:
            # CI only (contract §8.1 "Extra entries"): the Hub's trust list
            # gets Chromium's virtual authenticator as a security key.
            hub:
              environment:
                HUB_DEV: "1"
                HUB_SIGNIN_EXTRA_AUTHENTICATORS: /run/portcullis/signin/extra-authenticators.json
              volumes:
                - ./tests/e2e/fixtures/virtual-authenticators.json:/run/portcullis/signin/extra-authenticators.json:ro
            keycloak:
              ports:
                - "127.0.0.1:9000:9000"
            lldap:
              ports:
                - "127.0.0.1:17170:17170"
            traefik:
              networks:
                portcullis-proxy:
                  ipv4_address: ${PORTCULLIS_TRAEFIK_IP:-172.31.250.2}
                  aliases:
                    - auth.portcullis.local
            domains:
              build:
                args:
                  GO_TAGS: testprovider
              environment:
                ACME_CA_SERVER: https://pebble:14000/dir
                LEGO_CA_CERTIFICATES: /run/ci/pebble.minica.pem
                DOMAINS_RESOLVERS: 127.0.0.1:8053
              volumes:
                - /tmp/pebble.minica.pem:/run/ci/pebble.minica.pem:ro
            pebble:
              image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
              command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "domains:8053"]
              environment:
                PEBBLE_VA_NOSLEEP: "1"
                PEBBLE_WFE_NONCEREJECT: "0"
              networks: [domains-egress]
          YML
          docker compose config -q
          docker compose config --format json | jq -e '.services.traefik.networks["portcullis-proxy"] | (.aliases | index("auth.portcullis.local")) and .ipv4_address != null' >/dev/null \
            || { echo "FAIL: Traefik alias override not applied"; exit 1; }

      - name: List the images this job runs
        run: |
          {
            docker compose config --images | grep -vxE 'portcullis-(enroll|group-gate|domains|mcp-gate)|ghcr\.io/porelli/portcullis-(hub|keycloak):.*'
            grep -ohE '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' .github/workflows/ci.yml scripts/lib/common.sh tests/e2e/apps/*/compose.yml \
              | grep -E '^(alpine|busybox|traefik/whoami|curlimages/curl):'
          } | sort -u > "$RUNNER_TEMP/images.txt"
      - name: Load images (cached, verified)
        timeout-minutes: 15
        uses: ./.github/actions/cached-images
        with:
          images: ${{ runner.temp }}/images.txt
          name: e2e-ai
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Pull the template's images (by digest)
        run: |
          set -o pipefail
          grep -ohE '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' "$RUNNER_TEMP"/templates/{gitea,grafana}/compose.yml \
            | sort -u > "$RUNNER_TEMP/app-images.txt"
          cat "$RUNNER_TEMP/app-images.txt"
          pull() { for i in 1 2 3 4; do docker pull -q "$1" >/dev/null && return 0; sleep $((i * 15)); done; echo "FAIL: pull $1"; return 1; }
          export -f pull
          # shellcheck disable=SC2016
          xargs -P 4 -I{} bash -c 'pull "$1"' _ {} < "$RUNNER_TEMP/app-images.txt"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build the MCP client (tests/e2e/mcpclient, go-sdk pinned in go.mod / go.sum)
        timeout-minutes: 15
        working-directory: tests/e2e/mcpclient
        run: |
          go mod verify
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "FAIL: gofmt"; exit 1; }
          grep -qx 'require github.com/modelcontextprotocol/go-sdk v1.8.0' go.mod \
            || { echo "FAIL: mcpclient must pin go-sdk v1.8.0 like mcp-gate"; exit 1; }
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/mcpclient" .

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build enrollment UI (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: enroll
          tags: portcullis-enroll
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=enroll
          cache-to: ""
      - name: Build group-gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: group-gate
          tags: portcullis-group-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=group-gate
          cache-to: ""
      - name: Build the domains service (CI test build, buildx layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: domains
          tags: portcullis-domains
          build-args: GO_TAGS=testprovider
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=domains-test
          cache-to: ""
      - name: Build the MCP gate (buildx, GitHub Actions layer cache)
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mcp-gate
          # compose's image name for mcp-gate
          tags: portcullis-mcp-gate
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=mcp-gate
          cache-to: ""
      - name: Hub image (same-named Hub branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/hub-image
      - name: Keycloak image (same-named portcullis-keycloak branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/keycloak-image

      - name: Start the whole stack (Hub with the gitea / grafana / echo template source)
        run: |
          PEBBLE_IMG=$(docker compose config --format json | jq -r .services.pebble.image)
          cid="$(docker create "$PEBBLE_IMG")"; docker cp "$cid:/test/certs/pebble.minica.pem" /tmp/pebble.minica.pem; docker rm "$cid" >/dev/null
          chmod 644 /tmp/pebble.minica.pem
          docker compose up -d postgres lldap
          ./portcullis vault init
          ./portcullis pki setup --with-server-cert
          ./portcullis config apply --bundle-only
          printf 'tls:\n  certificates:\n    - certFile: /certs/server.crt\n      keyFile: /certs/server.key\n' > traefik/dynamic/ci-certs.yml
          # The Hub's only template source: gitea and grafana from the
          # templates checkout and the CI fixture echo (the throwaway
          # instance of the admin MCP's delete), as a local source (path,
          # no URL: never pulled).
          docker volume create --label com.docker.compose.project=portcullis --label com.docker.compose.volume=hub_data portcullis_hub_data >/dev/null
          docker run --rm -v portcullis_hub_data:/data -v "$RUNNER_TEMP/templates:/tpl:ro" -v "$PWD/tests/e2e/apps:/src:ro" "$ALPINE" sh -c '
            mkdir -p /data/repos/ci && cp -r /tpl/gitea /tpl/grafana /src/echo /data/repos/ci/ &&
            printf "sources:\n  - name: ci\n    url: \"\"\n    path: /data/repos/ci\n" > /data/state.yaml &&
            chown -R 10001:10001 /data && chmod 600 /data/state.yaml'
          # shellcheck disable=SC2046
          docker compose up -d $(docker compose config --services | grep -vx hub)
          for i in $(seq 1 100); do
            curl -sf http://127.0.0.1:9000/health/ready >/dev/null && break
            [ "$i" -eq 100 ] && { echo "FAIL: Keycloak not ready"; docker compose logs --tail=80 keycloak; exit 1; }
            sleep 3
          done
          ./portcullis keycloak configure
          ./portcullis oidc register
          ./portcullis up
          docker compose restart forward-auth forward-auth-ext
          docker compose ps
          HUB_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "portcullis").IPAddress}}' "$(docker compose ps -q hub)")
          echo "HUB_IP=$HUB_IP" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "http://$HUB_IP:8888/healthz")" = 200 ] && break
            [ "$i" -eq 40 ] && { echo "FAIL: hub /healthz"; docker compose logs --tail=40 hub; exit 1; }
            sleep 2
          done
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q mcp-gate)")" = healthy ] && break
            [ "$i" -eq 30 ] && { echo "FAIL: mcp-gate not healthy"; docker compose logs --tail=40 mcp-gate; exit 1; }
            sleep 2
          done

      - name: CI users (root in lldap_admin, alice, bob, carol) and setup links
        run: |
          set -o pipefail
          # The users are created with the Hub's own LLDAP service account
          # (what the Hub uses itself), never LLDAP's bootstrap admin.
          LLDAP_TOKEN=$(jq -n --rawfile u secrets/hub/lldap/username --rawfile p secrets/hub/lldap/password \
              '{username: ($u | rtrimstr("\n")), password: ($p | rtrimstr("\n"))}' \
            | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          [ -z "$LLDAP_TOKEN" ] || [ "$LLDAP_TOKEN" = null ] || echo "::add-mask::$LLDAP_TOKEN"
          [ -n "$LLDAP_TOKEN" ] && [ "$LLDAP_TOKEN" != null ] || { echo "FAIL: LLDAP login as the Hub's service account"; exit 1; }
          gql() { jq -n --arg q "$1" '{query: $q}' | curl -sf http://127.0.0.1:17170/api/graphql \
                    -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") -H 'Content-Type: application/json' -d @-; }
          for u in root alice bob carol; do
            gql "mutation { createUser(user: {id: \"$u\", email: \"$u@portcullis.local\"}) { id } }" | jq -e '.errors == null' >/dev/null
          done
          gid=$(gql '{ groups { id displayName } }' | jq -r '.data.groups[] | select(.displayName == "lldap_admin") | .id')
          gql "mutation { addUserToGroup(userId: \"root\", groupId: $gid) { ok } }" | jq -e '.errors == null' >/dev/null
          echo "127.0.0.1 portcullis.local auth.portcullis.local enroll.portcullis.local hub.portcullis.local people.portcullis.local mcp.portcullis.local gitea.portcullis.local gitea-b.portcullis.local grafana.portcullis.local" | sudo tee -a /etc/hosts
          # root is an administrator: only the CLI invites it (the Hub refuses).
          for spec in "E2E_ROOT_INVITE root" "E2E_ALICE_INVITE alice" "E2E_BOB_INVITE bob" "E2E_CAROL_INVITE carol"; do
            read -r var who <<<"$spec"
            url="$(./portcullis invite "$who" --to portal --json | jq -r .url)"
            # Masked before anything can print it: a malformed link may still carry a token.
            [ -z "$url" ] || [ "$url" = null ] || echo "::add-mask::$url"
            [[ "$url" =~ ^https://enroll\.portcullis\.local/invite/[A-Za-z0-9_-]{43}$ ]] || { echo "FAIL: setup link for $who: $url"; exit 1; }
            echo "$var=$url" >> "$GITHUB_ENV"
          done

      - name: Restore the pip / Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: e2e-playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/requirements.txt') }}

      - name: Install Playwright (pinned) and trust core's CA
        timeout-minutes: 10
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install --quiet -r tests/e2e/requirements.txt
          sudo /tmp/e2e-venv/bin/playwright install-deps chromium
          /tmp/e2e-venv/bin/playwright install chromium
          sudo apt-get install -y -qq libnss3-tools >/dev/null
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password 2>/dev/null || true
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n portcullis-root -i certs/root-ca.crt

      - name: Run the AI scenarios 1–7 (MCP client through mcp-gate with Keycloak OAuth)
        env:
          E2E_HUB_ACTOR: root
        run: |
          E2E_HUB_SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$E2E_HUB_SECRET"
          export E2E_HUB_SECRET
          E2E_TOKEN_DIR="$(mktemp -d)"; export E2E_TOKEN_DIR
          export E2E_MCPCLIENT="$RUNNER_TEMP/mcpclient" E2E_CA="$PWD/certs/ca-chain.crt"
          NODE_EXTRA_CA_CERTS="$PWD/certs/ca-chain.crt" /tmp/e2e-venv/bin/python tests/e2e/e2e_ai.py

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-artifacts/apps
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$SECRET"
          docker compose ps -a > e2e-artifacts/compose-ps.txt 2>&1 || true
          docker ps -a > e2e-artifacts/docker-ps.txt 2>&1 || true
          for svc in traefik keycloak forward-auth group-gate lldap hub mcp-gate socket-proxy-hub; do
            docker compose logs --no-color "$svc" > "e2e-artifacts/$svc.log" 2>&1 || true
          done
          for c in $(docker ps -aq --filter label=com.docker.compose.project); do
            name="$(docker inspect -f '{{.Name}}' "$c" | tr -d /)"
            case "$name" in portcullis-*-*) docker logs "$c" > "e2e-artifacts/apps/$name.log" 2>&1 || true ;; esac
          done
          # AI state (no credential: the Hub's views carry metadata only; the
          # gate files' credentials are age-encrypted and not copied).
          for p in /api/ai/settings /api/instances/gitea/ai /api/instances/gitea-b/ai /api/instances/grafana/ai \
                   /api/instances/gitea/op /api/instances/gitea-b/op /api/instances/grafana/op /api/instances/echo-del/op \
                   "/api/ai/activity?n=200" /api/directory/audit; do
            curl -s -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: root\n' "$SECRET") \
              "http://$HUB_IP:8888$p" > "e2e-artifacts/api$(echo "${p%%\?*}" | tr / _).json" 2>&1 || true
          done
          docker run --rm -v portcullis_hub_data:/d:ro "$ALPINE" sh -c 'cat /d/mcp-gate.json; ls -la /d /d/overrides; cat /d/overrides/*.yml' > e2e-artifacts/hub-data.txt 2>&1 || true

      - name: Upload screenshots, traces and logs
        timeout-minutes: 10
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ai-artifacts
          path: e2e-artifacts/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          for p in $(docker ps -aq --filter label=com.docker.compose.project | xargs -r docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' | sort -u | grep '^portcullis-.'); do
            docker compose -p "$p" down -v 2>/dev/null || true
          done
          docker compose down -v

  # Rootless Podman end to end (spec 2026-11-13-rootless-podman, contract
  # §6): the whole stack under CONTAINER_RUNTIME=podman, the runner user as
  # the operator, Docker stopped. First a Docker phase (P11): init on Docker,
  # one LLDAP person, a backup copied to $RUNNER_TEMP/rt-backup (0700, never
  # an artifact), the CA chain's sha256; then Docker is stopped and removed
  # from the picture, rootless Podman installed and prepared (subuid/subgid,
  # ip_unprivileged_port_start=80, linger, the user's podman.socket and
  # podman-restart.service), and `init --runtime podman`. Asserts: status
  # clean (runtime podman, ports ≥ ≤ 80, every host-prep check), the pinned
  # networks' IPAM and addresses, Memory / PidsLimit on every core
  # container, the socket proxies (libpod and /build denied), Traefik's
  # docker provider, secrets operator-owned (0:10001 inside the namespace),
  # an mTLS sign-in and the portal, tests/e2e/e2e_podman.py (/api/runtime,
  # an echo instance's lifecycle with forward-auth through host-gateway,
  # the folder fixer on /srv/e2e-pod, scrutiny refused), a simulated reboot
  # (user@<uid>.service restarted, podman-restart.service brings everything
  # back), and the Docker → Podman restore of the Docker phase's backup.
  # Failure artifacts: logs and API views only, never .env or secrets/.
  e2e-podman:
    needs: jobs-input
    # Runs unless a workflow_dispatch named other jobs (input `jobs`: `all`, or
    # names separated by commas and/or spaces; exact names, so `e2e` is not `e2e-ai`).
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.jobs == '' || inputs.jobs == 'all'
      || contains(format(' ,{0}, ', inputs.jobs), ',e2e-podman,') || contains(format(' ,{0}, ', inputs.jobs), ',e2e-podman ') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-podman,') || contains(format(' ,{0}, ', inputs.jobs), ' e2e-podman ')
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      E2E_DOMAIN: portcullis.local
      E2E_ARTIFACTS: e2e-artifacts
      E2E_POD: /srv/e2e-pod
      # Let's Encrypt staging (no real certificates in CI: Traefik serves the
      # Vault wildcard certificate from traefik/dynamic/ci-certs.yml).
      ACME_STAGING: "true"
      # The Hub's admin listener, published on the runner's loopback by the
      # CI override (rootless container addresses aren't reachable from the
      # host).
      HUB_API: http://127.0.0.1:18888
      ALPINE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Templates (same-named templates branch, else main)
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          url=https://github.com/porelli/portcullis-templates
          ref=main
          if [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] && [ "$REF" != main ] && [[ "$REF" != v* ]] \
              && git ls-remote --exit-code --heads "$url" "$REF" >/dev/null; then
            ref="$REF"
          fi
          git clone --quiet --depth=1 --branch "$ref" "$url" "$RUNNER_TEMP/templates"
          echo "Templates: portcullis-templates@$ref ($(git -C "$RUNNER_TEMP/templates" rev-parse --short HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q 'SYS_RAWIO' "$RUNNER_TEMP/templates/scrutiny/compose.yml" \
            || { echo "FAIL: scrutiny has no SYS_RAWIO on portcullis-templates@$ref"; exit 1; }

      - name: Shared helpers (status clean, redaction)
        run: |
          cat > "$RUNNER_TEMP/podlib.sh" <<'SH'
          # shellcheck shell=bash
          # status_ok: ./portcullis status --json is clean — runtime podman,
          # ports ≥ ≤ 80, no failed host check, every service running and
          # healthy, Vault, Keycloak (realm, forward-auth client, passkey
          # policy), no DNS shadow, mcp-gate serving; `problems` 0, or only the
          # DNS block's (portcullis.local has no public records in CI).
          status_ok() {
            local out
            out="$(./portcullis status --json 2>/dev/null)" || true
            printf '%s' "$out" > /tmp/status.json
            printf '%s' "$out" | jq -e '(.runtime.name == "podman") and (.runtime.port_start <= 80)
                and ([.runtime.checks[] | select(.status == "fail")] == [])
                and (.services | length > 0)
                and ([.services[] | select(.state != "running" or (.health != "healthy" and .health != "n/a"))] == [])
                and .vault.active and .keycloak.health == "healthy" and .keycloak.realm and .keycloak.forward_auth_client
                and (.keycloak.passkey_policy.ok // false)
                and .dns_shadows == [] and .mcp_gate.refusing == null
                and (.problems == 0 or (.dns != null and ([.dns.main.problems, (.dns.domains[]? | .problems)] | add) > 0))' >/dev/null 2>&1
          }
          # status_wait <seconds>: status_ok within the time, else the last status.
          status_wait() {
            local t0=$SECONDS
            until status_ok; do
              if (( SECONDS - t0 >= $1 )); then
                echo "FAIL: status not clean after $1 s:"; jq . /tmp/status.json 2>/dev/null || cat /tmp/status.json
                ./portcullis status || true
                return 1
              fi
              sleep 5
            done
          }
          # podns: this user's podman-family processes with their user
          # namespace and cgroup (two namespace trees = two pause processes).
          podns() {
            local p
            for p in $(pgrep -u "$(id -u)" -f '(^|/)(podman|conmon|pasta|pasta\.avx2|catatonit|rootlessport|aardvark-dns|netavark)( |$)'); do
              printf '  %s %s %s %s\n' "$p" "$(readlink "/proc/$p/ns/user" 2>/dev/null)" "$(cut -d: -f3 "/proc/$p/cgroup" 2>/dev/null | head -n1)" "$(tr '\0' ' ' < "/proc/$p/cmdline" 2>/dev/null | cut -c1-120)"
            done
          }
          # redact: setup links in init's output (masked from logs).
          redact() { sed -E 's#(/invite/)[A-Za-z0-9_-]+#\1<redacted>#g'; }
          # to_keycloak <url>: follows the redirects (Traefik on the runner's
          # :443) until Keycloak's authorization endpoint; 1 if never.
          to_keycloak() {
            local url="$1" h code loc
            for _ in 1 2 3 4; do
              h="${url#https://}"; h="${h%%/*}"
              read -r code loc < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' --max-time 20 \
                --cacert certs/ca-chain.crt --resolve "$h:443:127.0.0.1" "$url" || true)
              echo "  $code $url"
              case "$code" in 301|302|303|307) ;; *) return 1 ;; esac
              url="$loc"
              case "$url" in "https://auth.$E2E_DOMAIN/realms/portcullis/protocol/openid-connect/auth"*) echo "  → $url" | cut -c1-120; return 0 ;; esac
            done
            return 1
          }
          SH

      # ── Docker phase (P11): init, one person, a backup ──
      - name: Docker phase — .env and the CI override
        run: |
          ./portcullis init --env-only --runtime docker --non-interactive --domain portcullis.local \
            --email ci@portcullis.local --dns-provider none
          # The same override for both phases: the management / LLDAP ports
          # and the Hub's listener on loopback, Traefik's API (CI only).
          cat > docker-compose.ci.yml <<'YML'
          services:
            keycloak:
              ports:
                - "127.0.0.1:9000:9000"
            lldap:
              ports:
                - "127.0.0.1:17170:17170"
            hub:
              ports:
                - "127.0.0.1:18888:8888"
            traefik:
              environment:
                TRAEFIK_API_INSECURE: "true"
          YML
          # No ACME in CI: Traefik serves the Vault-issued wildcard certificate.
          printf 'tls:\n  certificates:\n    - certFile: /certs/server.crt\n      keyFile: /certs/server.key\n' > traefik/dynamic/ci-certs.yml
          docker compose config -q
          docker compose config --format json | jq -e '.services.hub.environment.HUB_CONTAINER_RUNTIME == "docker"' >/dev/null \
            || { echo "FAIL: HUB_CONTAINER_RUNTIME is not docker in the Docker phase"; exit 1; }

      - name: Hub image (same-named Hub branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/hub-image
      - name: Keycloak image (same-named portcullis-keycloak branch → built here, else the published one)
        timeout-minutes: 20
        uses: ./.github/actions/keycloak-image

      - name: Docker phase — init, one LLDAP person, backup, wipe
        timeout-minutes: 30
        run: |
          set -o pipefail
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/podlib.sh"
          ./portcullis init --runtime docker --non-interactive --domain portcullis.local \
            --email ci@portcullis.local --dns-provider none --no-config-repo 2>&1 | redact
          grep -qx 'CONTAINER_RUNTIME=docker' .env || { echo "FAIL: init --runtime docker wrote no CONTAINER_RUNTIME=docker"; exit 1; }
          LLDAP_ADMIN_PASSWORD="$(grep '^LLDAP_ADMIN_PASSWORD=' .env | cut -d= -f2-)"; echo "::add-mask::$LLDAP_ADMIN_PASSWORD"
          export LLDAP_ADMIN_PASSWORD
          for i in $(seq 1 30); do
            LLDAP_TOKEN=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
              | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token) && [ "$LLDAP_TOKEN" != null ] && break
            [ "$i" -eq 30 ] && { echo "FAIL: LLDAP login"; exit 1; }
            sleep 2
          done
          echo "::add-mask::$LLDAP_TOKEN"
          jq -n '{query: "mutation { createUser(user: {id: \"rt-person\", email: \"rt-person@portcullis.local\"}) { id } }"}' \
            | curl -sf http://127.0.0.1:17170/api/graphql -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") \
                -H 'Content-Type: application/json' -d @- | jq -e '.errors == null' >/dev/null \
            || { echo "FAIL: create the LLDAP person rt-person"; exit 1; }
          ./portcullis backup
          B="$(find backups -mindepth 1 -maxdepth 1 -type d -name '2*' | sort | tail -n1)"
          [ -n "$B" ] && [ -f "$B/MANIFEST.json" ] || { echo "FAIL: no backup in backups/"; ls -la backups; exit 1; }
          jq -e '.runtime.name == "docker"' "$B/MANIFEST.json" >/dev/null || { echo "FAIL: MANIFEST.json runtime: $(jq -c .runtime "$B/MANIFEST.json")"; exit 1; }
          (umask 077 && cp -r --preserve=mode,timestamps "$B" "$RUNNER_TEMP/rt-backup")
          chmod 700 "$RUNNER_TEMP/rt-backup"
          sha256sum certs/ca-chain.crt | cut -d' ' -f1 > "$RUNNER_TEMP/rt-ca.sha256"
          echo "PASS: Docker phase: init, rt-person, backup $B (copied to \$RUNNER_TEMP/rt-backup, 0700)"
          ./portcullis down
          docker volume ls -q --filter label=com.docker.compose.project=portcullis | xargs -r docker volume rm
          sudo rm -rf .env secrets certs templates appfiles backups/2*
          git checkout -- secrets/.gitkeep backups/.gitkeep
          [ -z "$(docker ps -aq)" ] || { echo "FAIL: containers left after the Docker phase"; docker ps -a; exit 1; }

      - name: Save the CI-built Hub / Keycloak images for Podman
        run: |
          : > "$RUNNER_TEMP/pod-images.txt"
          if [ -n "${HUB_LOCAL:-}" ]; then docker save -o "$RUNNER_TEMP/img-hub.tar" "$HUB_IMAGE"; echo "$RUNNER_TEMP/img-hub.tar $HUB_IMAGE" >> "$RUNNER_TEMP/pod-images.txt"; fi
          if [ -n "${KEYCLOAK_LOCAL:-}" ]; then docker save -o "$RUNNER_TEMP/img-kc.tar" "$KEYCLOAK_IMAGE"; echo "$RUNNER_TEMP/img-kc.tar $KEYCLOAK_IMAGE" >> "$RUNNER_TEMP/pod-images.txt"; fi
          cat "$RUNNER_TEMP/pod-images.txt"

      - name: Stop Docker
        run: |
          sudo systemctl disable --now docker.service docker.socket
          if curl -s --max-time 5 --unix-socket /var/run/docker.sock http://localhost/_ping; then
            echo "FAIL: /var/run/docker.sock still answers"; exit 1
          fi
          echo "PASS: Docker is stopped and disabled (its socket doesn't answer)"

      # ── Podman phase ──
      - name: Install and prepare rootless Podman (one-time host preparation)
        timeout-minutes: 15
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman passt uidmap acl >/dev/null
          podman --version
          me="$(id -un)"
          for f in /etc/subuid /etc/subgid; do
            if ! grep -q "^$me:" "$f"; then
              case "$f" in */subuid) sudo usermod --add-subuids 100000-165535 "$me" ;; *) sudo usermod --add-subgids 100000-165535 "$me" ;; esac
            fi
            n="$(awk -F: -v u="$me" '$1 == u { s += $3 } END { print s + 0 }' "$f")"
            [ "$n" -ge 65536 ] || { echo "FAIL: $f gives $me $n ids"; exit 1; }
            echo "$f: $(grep "^$me:" "$f")"
          done
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          # The SELinux overlay's layout for the whole Podman phase (the Hub's
          # /project a tmpfs, long-syntax z / Z binds, label=disable on the
          # proxies): a getenforce stub saying Enforcing, first on PATH from
          # the next step on (GITHUB_PATH; the Docker phase is over). Ubuntu
          # has no SELinux, so the labels themselves are no-ops here: Fedora
          # enforcing stays a manual release check (CLAUDE.md).
          mkdir -p "$RUNNER_TEMP/selinux-stub"
          printf '#!/bin/sh\necho Enforcing\n' > "$RUNNER_TEMP/selinux-stub/getenforce"
          chmod +x "$RUNNER_TEMP/selinux-stub/getenforce"
          echo "$RUNNER_TEMP/selinux-stub" >> "$GITHUB_PATH"
          # Ubuntu's AppArmor (bug 2154379): pasta's profile refuses podman's
          # SIGTERM, so removing a network's last container fails ("rootless
          # netns: kill network process: permission denied"). The host-prep
          # rule (runtime_host_checks refuses init / up without it).
          if [ "$(cat /sys/module/apparmor/parameters/enabled 2>/dev/null)" = Y ] && [ -f /etc/apparmor.d/usr.bin.pasta ]; then
            grep -n 'include\|signal' /etc/apparmor.d/usr.bin.pasta || true
            if grep -q 'local/usr.bin.pasta' /etc/apparmor.d/usr.bin.pasta; then
              echo 'signal (receive) set=(term) peer=podman,' | sudo tee -a /etc/apparmor.d/local/usr.bin.pasta >/dev/null
            else
              sudo sed -i 's/^}$/  signal (receive) set=(term) peer=podman,\n}/' /etc/apparmor.d/usr.bin.pasta
            fi
            sudo apparmor_parser -r /etc/apparmor.d/usr.bin.pasta
            echo "AppArmor: pasta now accepts podman's SIGTERM"
          fi
          sudo loginctl enable-linger "$me"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for i in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; [ "$i" -eq 30 ] && { echo "FAIL: no user manager for $me"; exit 1; }; sleep 1; done
          export XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          { echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"; echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"; } >> "$GITHUB_ENV"
          podman system migrate
          systemctl --user enable --now podman.socket podman-restart.service
          DOCKER_HOST="unix://$XDG_RUNTIME_DIR/podman/podman.sock"
          export DOCKER_HOST
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          docker version --format '{{json .Server.Components}}' | jq -e 'any(.[]; .Name == "Podman Engine")' >/dev/null \
            || { echo "FAIL: the Docker CLI doesn't reach Podman: $(docker version 2>&1 | tail -5)"; exit 1; }
          while read -r tar img; do
            podman load -i "$tar"
            docker image inspect "$img" >/dev/null || { echo "FAIL: $img isn't visible through the compat API after podman load"; podman images; exit 1; }
          done < "$RUNNER_TEMP/pod-images.txt"
          podman unshare cat /proc/self/uid_map
          echo "PASS: rootless Podman $(podman version --format '{{.Client.Version}}') on the user socket"

      - name: Podman phase — template sources, /srv/e2e-pod, init --runtime podman
        timeout-minutes: 40
        run: |
          set -o pipefail
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/podlib.sh"
          # The Hub's only template source: echo, folder-writer and scrutiny
          # as a local source (path, no URL), seeded before the first start.
          docker volume create --label com.docker.compose.project=portcullis --label com.docker.compose.volume=hub_data portcullis_hub_data >/dev/null
          docker run --rm -v portcullis_hub_data:/data -v "$PWD/tests/e2e/apps:/src:ro" -v "$RUNNER_TEMP/templates:/tpl:ro" "$ALPINE" sh -c '
            mkdir -p /data/repos/ci &&
            cp -r /tpl/scrutiny /src/echo /src/folder-writer /data/repos/ci/ &&
            printf "sources:\n  - name: ci\n    url: \"\"\n    path: /data/repos/ci\n" > /data/state.yaml &&
            chown -R 10001:10001 /data && chmod 600 /data/state.yaml'
          # The fixer's tree: operator-owned, with one host-root child.
          fs="$(findmnt -no FSTYPE --target /srv)"; [ "$fs" = ext4 ] || { echo "FAIL: /srv is $fs, not ext4"; exit 1; }
          me="$(id -un)"
          sudo rm -rf "$E2E_POD"
          sudo install -d -o "$me" -g "$me" -m 0750 "$E2E_POD" "$E2E_POD/ok" "$E2E_POD/rooted"
          for f in 1 2 3; do echo "pod $f" > "$E2E_POD/ok/file-$f.txt"; echo "rooted $f" > "$E2E_POD/rooted/file-$f.txt"; done
          sudo install -d -o root -g root -m 0755 "$E2E_POD/rooted/root-owned"
          ./portcullis init --runtime podman --non-interactive --domain portcullis.local \
            --email ci@portcullis.local --dns-provider none --no-config-repo 2>&1 | redact
          if ! grep -qx 'CONTAINER_RUNTIME=podman' .env || ! grep -qx "PORTCULLIS_ENGINE_SOCKET=$XDG_RUNTIME_DIR/podman/podman.sock" .env; then
            echo "FAIL: .env lacks CONTAINER_RUNTIME=podman / the rootless socket"; grep -E '^(CONTAINER_RUNTIME|PORTCULLIS_ENGINE_SOCKET)=' .env; exit 1
          fi
          status_wait 240
          jq -c '.runtime' /tmp/status.json | tee -a "$GITHUB_STEP_SUMMARY"
          # The SELinux overlay's layout is in use (getenforce stub): the CLI's
          # COMPOSE_FILE has it, the Hub's /project is a tmpfs, the map file
          # bound into it, the proxies carry label=disable.
          [ "$(getenforce)" = Enforcing ] || { echo "FAIL: the getenforce stub isn't on PATH"; exit 1; }
          CF="$(bash -c 'source scripts/lib/common.sh; env_load; runtime_export; printf "%s" "$COMPOSE_FILE"')"
          case "$CF" in *docker-compose.podman.yml*docker-compose.podman-selinux.yml*) ;; *) echo "FAIL: the CLI's COMPOSE_FILE lacks the podman overlays: $CF"; exit 1 ;; esac
          docker inspect -f '{{json .Mounts}}' "$(docker compose ps -q hub)" | jq -e '
              (map(select(.Destination == "/project")) | length == 1 and .[0].Type == "tmpfs")
              and (map(select(.Destination == "/project/group-gate/group-gate-map.conf")) | length == 1)' >/dev/null \
            || { echo "FAIL: the Hub's /project isn't the overlay's tmpfs + map bind"; docker inspect -f '{{json .Mounts}}' "$(docker compose ps -q hub)"; exit 1; }
          for p in socket-proxy-traefik socket-proxy-hub; do
            docker inspect -f '{{json .HostConfig.SecurityOpt}}' "$(docker compose ps -q "$p")" | jq -e 'any(.[]?; test("^label[=:]disable$"))' >/dev/null \
              || { echo "FAIL: $p has no label=disable"; exit 1; }
          done
          echo "PASS: the SELinux overlay's layout runs (Hub /project tmpfs + map bind, label=disable on the proxies)"
          echo "PASS: init --runtime podman; status clean (runtime podman, ports ≥ $(jq .runtime.port_start /tmp/status.json))"

      - name: Every SELinux-overlay bind source exists after a full up (monitoring profile)
        timeout-minutes: 15
        run: |
          set -o pipefail
          # The overlay's long-syntax binds never create a missing source
          # (rootless Podman + SELinux): after a full `up` with every profile
          # this job can start, each must exist (also checked statically
          # against stack_prepare in tests/test_shell_libs.sh).
          COMPOSE_PROFILES=monitoring ./portcullis up
          missing=""
          while IFS= read -r src; do
            [ -e "$src" ] || missing="$missing $src"
          done < <(docker compose -f docker-compose.yml -f docker-compose.podman-selinux.yml --profile '*' config --format json \
                     | jq -r '[.services[].volumes[]? | select(.type == "bind" and .bind.selinux != null) | .source] | unique[]')
          [ -z "$missing" ] || { echo "FAIL: overlay bind sources missing after up:$missing"; exit 1; }
          echo "PASS: every SELinux-overlay bind source exists after a full up with the monitoring profile"
          # Back to the default profile for the rest of the job.
          COMPOSE_PROFILES=monitoring docker compose rm -sf prometheus alertmanager blackbox textfile-exporter grafana

      - name: Pinned networks, addresses and limits
        run: |
          set -o pipefail
          envv() { local v; v="$(grep "^$1=" .env | tail -n1 | cut -d= -f2-)"; printf '%s' "${v:-$2}"; }
          # shellcheck source=/dev/null
          source scripts/lib/common.sh
          # shellcheck source=/dev/null
          source scripts/lib/network.sh
          # The subnet from the compat inspect; the range from libpod (Podman's
          # compat inspect never reports IPRange: compat create keeps an
          # ip_range <cidr> as the lease range first+1 .. last).
          ipam() { docker network inspect "$1" --format '{{json .IPAM.Config}}' | jq -r '.[0].Subnet'; }
          lease() { podman network inspect "$1" --format json | jq -r --arg s "$2" '[.[0].subnets[] | select(.subnet == $s) | (.lease_range // null)] | if length != 1 then "no-subnet" elif .[0] == null then "-" else "\(.[0].start_ip)-\(.[0].end_ip)" end'; }
          for spec in "portcullis-proxy PORTCULLIS_PROXY 172.31.250.0/24 172.31.250.128/25" "portcullis-auth PORTCULLIS_AUTH 172.31.251.0/28 172.31.251.8/29" \
                      "portcullis-mcp PORTCULLIS_MCP 172.31.253.0/28 172.31.253.8/29" "portcullis_portcullis-domains PORTCULLIS_DOMAINS 172.31.252.0/28 -"; do
            read -r net pre sub rng <<<"$spec"
            sub="$(envv "${pre}_SUBNET" "$sub")"
            want=-
            if [ "$rng" != - ]; then
              read -r first last <<<"$(cidr_bounds "$(envv "${pre}_IP_RANGE" "$rng")")"
              want="$(int_to_ip $((first + 1)))-$(int_to_ip "$last")"
            fi
            got="$(ipam "$net") $(lease "$net" "$sub")"
            [ "$got" = "$sub $want" ] || { echo "FAIL: $net IPAM '$got', want '$sub $want'"; docker network inspect "$net"; podman network inspect "$net"; exit 1; }
            echo "  $net: subnet $sub, lease range $want"
          done
          n=0
          while read -r svc net ip; do
            got="$(docker inspect -f '{{json .NetworkSettings.Networks}}' "$(docker compose ps -q "$svc")" | jq -r --arg n "$net" '.[$n].IPAddress // empty')"
            [ "$got" = "$ip" ] || { echo "FAIL: $svc on $net at '$got', want $ip"; exit 1; }
            echo "  $svc on $net: $got"; n=$((n + 1))
          done < <(docker compose config --format json | jq -r '.services | to_entries[] | .key as $s | (.value.networks // {}) | to_entries[] | select(.value.ipv4_address != null) | "\($s) \(.key) \(.value.ipv4_address)"')
          [ "$n" -ge 5 ] || { echo "FAIL: only $n pinned addresses (traefik ×2, mcp-gate, keycloak, hub)"; exit 1; }
          bad=""
          for cid in $(docker compose ps -q); do
            read -r name mem pids < <(docker inspect -f '{{.Name}} {{.HostConfig.Memory}} {{.HostConfig.PidsLimit}}' "$cid")
            { [ "${mem:-0}" -gt 0 ] && [ "${pids:-0}" -gt 0 ]; } || bad="$bad $name(mem=$mem,pids=$pids)"
          done
          [ -z "$bad" ] || { echo "FAIL: core containers without Memory / PidsLimit:$bad"; exit 1; }
          echo "PASS: IPAM round-trips, $n pinned addresses, Memory and PidsLimit on every core container"

      - name: The socket proxies on the Podman API (libpod and /build denied)
        run: |
          tp() { docker compose exec -T traefik wget -q -O /dev/null -S "$@" 2>&1 | grep -o 'HTTP/[0-9.]* [0-9]*' | tail -n1 | cut -d' ' -f2; }
          [ "$(tp http://socket-proxy-traefik:2375/version)" = 200 ] || { echo "FAIL: traefik proxy /version"; exit 1; }
          [ "$(tp http://socket-proxy-traefik:2375/containers/json)" = 200 ] || { echo "FAIL: traefik proxy /containers/json"; exit 1; }
          for denied in /images/json /info /volumes /secrets /swarm /system/df /libpod/info /libpod/play/kube /v5.0.0/libpod/containers/json /build; do
            [ "$(tp "http://socket-proxy-traefik:2375$denied")" = 403 ] || { echo "FAIL: traefik proxy allowed $denied"; exit 1; }
          done
          [ "$(tp --post-data='{}' --header 'Content-Type: application/json' http://socket-proxy-traefik:2375/containers/create)" = 403 ] \
            || { echo "FAIL: traefik proxy allowed a POST"; exit 1; }
          # Traversal / encoded paths into libpod (Podman's router isn't
          # dockerd's): never a 2xx through the proxy (a 403, or a redirect
          # the proxy then denies).
          for odd in "/containers/../libpod/info" "/containers/%2e%2e/libpod/info" "/containers%2F..%2Flibpod%2Finfo" "/v1.41/build" "/v5.0.0/libpod/info"; do
            c="$(tp "http://socket-proxy-traefik:2375$odd")"
            case "$c" in 2*) echo "FAIL: traefik proxy answered $c for $odd"; exit 1 ;; esac
          done
          echo "PASS: socket-proxy-traefik is read-only and minimal (libpod and /build denied)"
          NET="$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q socket-proxy-hub)")"
          mkdir -p /tmp/hubproj && cat > /tmp/hubproj/compose.yml <<'YML'
          services:
            web:
              image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
              volumes: [data:/data]
              networks: [portcullis-proxy, default]
          volumes:
            data:
          networks:
            portcullis-proxy:
              external: true
          YML
          dcli() { docker run --rm --network "$NET" -e DOCKER_HOST=tcp://socket-proxy-hub:2375 -v /tmp/hubproj:/p:ro -w /p \
                     docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb "$@"; }
          dcli docker compose -p ci-hubproxy up -d --pull missing || { docker compose logs --tail=30 socket-proxy-hub; echo "FAIL: compose up through socket-proxy-hub"; exit 1; }
          dcli docker compose -p ci-hubproxy ps --format json | grep -q '"State":"running"' || { echo "FAIL: compose ps"; exit 1; }
          dcli docker compose -p ci-hubproxy logs web >/dev/null || { echo "FAIL: compose logs"; exit 1; }
          dcli docker compose -p ci-hubproxy restart web || { echo "FAIL: compose restart"; exit 1; }
          dcli docker compose -p ci-hubproxy down -v || { echo "FAIL: compose down -v"; exit 1; }
          for denied in "docker swarm init" "docker system df" "docker plugin ls" "docker secret ls" "docker node ls"; do
            # shellcheck disable=SC2086
            if dcli $denied >/dev/null 2>&1; then echo "FAIL: socket-proxy-hub allowed: $denied"; exit 1; fi
          done
          hp() { docker run --rm --network "$NET" --entrypoint wget \
                   docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb \
                   -q -O /dev/null -S "$@" 2>&1 | grep -o 'HTTP/[0-9.]* [0-9]*' | tail -n1 | cut -d' ' -f2; }
          for odd in "/containers/../libpod/info" "/containers/%2e%2e/libpod/info" "/containers%2F..%2Flibpod%2Finfo" "/v1.41/build" "/v5.0.0/libpod/info"; do
            c="$(hp "http://socket-proxy-hub:2375$odd")"
            case "$c" in 2*) echo "FAIL: socket-proxy-hub answered $c for $odd"; exit 1 ;; esac
          done
          for denied in /libpod/info /libpod/play/kube /v5.0.0/libpod/containers/json /build; do
            [ "$(hp "http://socket-proxy-hub:2375$denied")" = 403 ] || { echo "FAIL: socket-proxy-hub allowed GET $denied"; exit 1; }
            [ "$(hp --post-data='{}' --header 'Content-Type: application/json' "http://socket-proxy-hub:2375$denied")" = 403 ] \
              || { echo "FAIL: socket-proxy-hub allowed POST $denied"; exit 1; }
          done
          # The engine socket: only the two proxies mount it (the user socket).
          for cid in $(docker compose ps -q); do
            name="$(docker inspect -f '{{.Name}}' "$cid" | tr -d /)"
            if docker inspect -f '{{json .Mounts}}' "$cid" | jq -e --arg s "$XDG_RUNTIME_DIR/podman/podman.sock" 'any(.[]; .Source == $s or .Destination == "/var/run/docker.sock")' >/dev/null; then
              case "$name" in *socket-proxy-traefik*|*socket-proxy-hub*) ;; *) echo "FAIL: $name mounts the engine socket"; exit 1 ;; esac
            fi
          done
          echo "PASS: compose through socket-proxy-hub on Podman; swarm/system/plugins/secrets/nodes, libpod and /build denied; only the proxies mount the engine socket"

      - name: Traefik's docker provider sees the core routers
        run: |
          for i in $(seq 1 30); do
            R="$(docker compose exec -T traefik wget -q -O - http://127.0.0.1:8080/api/http/routers 2>/dev/null || true)"
            printf '%s' "$R" | jq -e '[.[].name] | index("hub@docker") and index("people@docker")' >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "FAIL: Traefik's API lacks hub@docker / people@docker: $(printf '%s' "$R" | jq -c '[.[].name]' 2>/dev/null || printf '%s' "$R" | head -c 400)"; exit 1; }
            sleep 2
          done
          echo "PASS: Traefik's docker provider lists hub@docker and people@docker"

      - name: Secrets are operator-owned (0:<gid> inside the user namespace)
        run: |
          [ "$(stat -c %u secrets/hub/core.env)" = "$(id -u)" ] || { echo "FAIL: secrets/hub/core.env host owner $(stat -c %u:%g secrets/hub/core.env)"; exit 1; }
          [ "$(podman unshare stat -c %u:%g secrets/hub/core.env)" = 0:10001 ] \
            || { echo "FAIL: secrets/hub/core.env inside the namespace: $(podman unshare stat -c %u:%g secrets/hub/core.env)"; exit 1; }
          left="$(find secrets -not -user "$(id -u)" -printf '%P %u:%g\n')"
          [ -z "$left" ] || { echo "FAIL: secrets/ entries not owned by the operator: $left"; exit 1; }
          echo "PASS: secrets/ operator-owned on the host; core.env is 0:10001 inside the namespace"

      - name: Sign-in with a client certificate (mTLS) and the portal
        run: |
          set -o pipefail
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/podlib.sh"
          VAULT_TOKEN="$(jq -r .root_token secrets/vault-init.json)"; echo "::add-mask::$VAULT_TOKEN"
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/test-client.key
          openssl req -new -key /tmp/test-client.key -out /tmp/test-client.csr -subj "/CN=testuser"
          jq -n --rawfile csr /tmp/test-client.csr '{csr: $csr, common_name: "testuser", ttl: "1h"}' \
            | curl -sf -X POST -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_TOKEN") --data-binary @- \
                http://127.0.0.1:8200/v1/pki_int/sign/client-cert | jq -r .data.certificate > /tmp/test-client.crt
          openssl verify -CAfile certs/ca-chain.crt /tmp/test-client.crt
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -keyout /tmp/foreign.key -out /tmp/foreign.crt -subj "/CN=testuser" -days 1 2>/dev/null
          cat > /tmp/ci-mtls.yml <<'YML'
          services:
            whoami:
              image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
              networks: [portcullis-proxy]
              labels:
                traefik.enable: "true"
                traefik.http.services.ci-whoami.loadbalancer.server.port: "80"
                traefik.http.routers.ci-mtls.rule: Host(`mtls.portcullis.local`)
                traefik.http.routers.ci-mtls.entrypoints: websecure
                traefik.http.routers.ci-mtls.tls.options: protected@file
                traefik.http.routers.ci-mtls.middlewares: client-headers@file
                traefik.http.routers.ci-mtls.service: ci-whoami
          networks:
            portcullis-proxy:
              external: true
          YML
          env -u COMPOSE_FILE docker compose -p ci-mtls -f /tmp/ci-mtls.yml up -d
          mtls() { curl -s -o /tmp/mtls.out -w '%{http_code}' --cacert certs/ca-chain.crt \
                     --resolve "mtls.portcullis.local:443:127.0.0.1" "$@" "https://mtls.portcullis.local/" || true; }
          for i in $(seq 1 30); do
            code=$(mtls --cert /tmp/test-client.crt --key /tmp/test-client.key)
            [ "$code" = 200 ] && break
            [ "$i" -eq 30 ] && { echo "FAIL: the mTLS router (last $code)"; docker compose logs --tail=40 traefik; exit 1; }
            sleep 2
          done
          [ "$(mtls)" = 000 ] || { echo "FAIL: the protected tier accepted a request without a client certificate"; exit 1; }
          [ "$(mtls --cert /tmp/foreign.crt --key /tmp/foreign.key)" = 000 ] || { echo "FAIL: the protected tier accepted a foreign-CA certificate"; exit 1; }
          grep -qi '^X-Forwarded-Tls-Client-Cert-Info:.*SerialNumber' /tmp/mtls.out || { echo "FAIL: no cert info at the backend"; cat /tmp/mtls.out; exit 1; }
          TRAEFIK_IP="$(grep '^PORTCULLIS_TRAEFIK_IP=' .env | cut -d= -f2-)"
          grep -q "^RemoteAddr: ${TRAEFIK_IP:-172.31.250.2}:" /tmp/mtls.out || { echo "FAIL: the backend saw a non-Traefik address"; cat /tmp/mtls.out; exit 1; }
          echo "PASS: mTLS: the internal CA's client certificate signs in, none / a foreign one is refused, the backend sees Traefik's pinned address"
          echo "The portal without a session:"
          to_keycloak "https://$E2E_DOMAIN/" || { echo "FAIL: the portal doesn't send a visitor to Keycloak's sign-in"; exit 1; }
          echo "PASS: the portal sends a visitor without a session to Keycloak's sign-in"
          env -u COMPOSE_FILE docker compose -p ci-mtls -f /tmp/ci-mtls.yml down

      - name: The Hub on Podman (e2e_podman.py)
        timeout-minutes: 30
        run: |
          E2E_HUB_SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$E2E_HUB_SECRET"
          export E2E_HUB_SECRET
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$HUB_API/healthz")" = 200 ] && break
            [ "$i" -eq 40 ] && { echo "FAIL: the Hub's /healthz on $HUB_API"; docker compose logs --tail=40 hub; exit 1; }
            sleep 3
          done
          for i in $(seq 1 30); do
            curl -s -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$E2E_HUB_SECRET") "$HUB_API/api/templates" \
              | jq -e '[.[].id] as $ids | ["echo", "folder-writer", "scrutiny"] - $ids == []' >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "FAIL: the Hub did not load echo, folder-writer and scrutiny"; docker compose logs --tail=60 hub; exit 1; }
            sleep 2
          done
          python3 tests/e2e/e2e_podman.py

      - name: Reboot simulation (user manager and /run/user/<uid> recreated, podman-restart.service)
        timeout-minutes: 10
        run: |
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/podlib.sh"
          uid="$(id -u)"
          before="$(docker compose ps -q | wc -l)"
          # An enabled app instance must come back too (the Hub sets
          # restart: always on instance services under podman): folder-writer
          # from e2e_podman.py, enabled through the Hub's API if it isn't.
          SECRET="$(grep '^HUB_PROXY_SECRET=' .env | cut -d= -f2-)"; echo "::add-mask::$SECRET"
          hub() { local m="$1" p="$2"; shift 2
                  curl -s -X "$m" -H @<(printf 'X-Portcullis-Proxy-Secret: %s\nX-Forwarded-User: admin\n' "$SECRET") \
                    -H 'Content-Type: application/json' "$@" "$HUB_API$p"; }
          hubc() { hub "$@" -o /tmp/hub.out -w '%{http_code}'; }
          # shellcheck source=/dev/null
          source tests/e2e/hubop.sh
          APP=portcullis-folder-writer
          app_ids() { docker ps -q --filter "label=com.docker.compose.project=$APP"; }
          if [ -z "$(app_ids)" ]; then
            if ! hub GET /api/instances | jq -e 'any(.[]; .id == "folder-writer")' >/dev/null; then
              hubop POST /api/instances -d '{"template":"folder-writer","id":"folder-writer","label":"Folder Writer"}' || exit 1
            fi
            HUBOP_TIMEOUT=900 hubop POST /api/templates/enable -d '{"id":"folder-writer"}' || exit 1
          fi
          app_before="$(app_ids | wc -l)"
          [ "$app_before" -gt 0 ] || { echo "FAIL: no running container of $APP before the reboot"; exit 1; }
          # shellcheck disable=SC2046  # one id per word
          docker inspect -f '{{.Name}} {{.HostConfig.RestartPolicy.Name}}' $(app_ids) | awk '$2 != "always" { print; bad = 1 } END { exit bad }' \
            || { echo "FAIL: $APP containers without restart: always (the Hub must set it under podman)"; exit 1; }
          # shellcheck disable=SC2046  # one id per word
          docker inspect -f '{{.Name}} {{.HostConfig.RestartPolicy.Name}}' $(docker compose ps -q) | awk '$2 != "always" { print; bad = 1 } END { exit bad }' \
            || { echo "FAIL: core containers without restart: always (podman-restart.service starts only those)"; exit 1; }
          # A reboot: everything of this user stops and /run/user/<uid> is a
          # fresh tmpfs. Restarting user@ alone keeps the old runtime dir with
          # a stale rootless pause-process record, which no real boot has.
          echo "Before: this user's podman processes and their user namespaces:"; podns
          sudo systemctl stop "user@$uid.service"
          # Nothing of this user survives a reboot. The runner's own podman
          # CLI calls (outside the user manager) leave a pause process and
          # can leave pasta / rootlessport / conmon / aardvark-dns holding
          # the old user namespace: kill every one, then make sure none is
          # left (the job's own bash and the runner are not podman processes).
          for _ in 1 2 3; do
            pkill -KILL -u "$uid" -f '(^|/)(podman|conmon|pasta|pasta\.avx2|catatonit|rootlessport|aardvark-dns|netavark)( |$)' || true
            sleep 1
          done
          if pgrep -u "$uid" -f '(^|/)(podman|conmon|pasta|pasta\.avx2|catatonit|rootlessport|aardvark-dns|netavark)( |$)' >/dev/null; then
            echo "FAIL: podman processes of $uid survived the simulated shutdown:"; podns; exit 1
          fi
          sudo systemctl stop "user-runtime-dir@$uid.service" \
            || { echo "FAIL: /run/user/$uid can't be unmounted"; sudo fuser -vm "/run/user/$uid" || true; exit 1; }
          [ ! -e "/run/user/$uid/podman" ] || { echo "FAIL: /run/user/$uid survived"; exit 1; }
          sudo systemctl start "user@$uid.service"
          for _ in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/podman/podman.sock" ] && break; sleep 1; done
          systemctl --user is-active podman-restart.service || { systemctl --user status podman-restart.service --no-pager || true; }
          status_wait 180
          echo "After: this user's podman processes and their user namespaces (one tree expected):"; podns
          after="$(docker compose ps -q | wc -l)"
          [ "$after" = "$before" ] || { echo "FAIL: $before core containers before, $after after"; exit 1; }
          # The instance: the same number of containers running, none unhealthy.
          for i in $(seq 1 36); do
            n=0 bad=""
            for c in $(app_ids); do
              st="$(docker inspect -f '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c")"
              case "$st" in "running healthy"|"running none") n=$((n + 1)) ;; *) bad="$bad $c($st)" ;; esac
            done
            [ "$n" = "$app_before" ] && [ -z "$bad" ] && break
            [ "$i" -eq 36 ] && { echo "FAIL: $APP after the reboot: $n of $app_before running and healthy$bad"; docker ps -a --filter "label=com.docker.compose.project=$APP"; exit 1; }
            sleep 5
          done
          echo "PASS: $APP's $app_before containers (restart: always) came back running and healthy"
          echo "PASS: after a simulated reboot (user manager and /run/user/$uid recreated), podman-restart.service brought every container back; status clean"

      - name: Docker → Podman round trip (restore the Docker phase's backup)
        timeout-minutes: 40
        run: |
          set -o pipefail
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/podlib.sh"
          empty="$(mktemp -d)"
          for p in $(docker ps -aq --filter label=com.docker.compose.project | xargs -r docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' | sort -u | grep '^portcullis-.' || true); do
            (cd "$empty" && env -u COMPOSE_FILE docker compose -p "$p" down -v)
          done
          ./portcullis down
          docker volume ls -q --filter label=com.docker.compose.project=portcullis | xargs -r docker volume rm
          podman unshare rm -rf .env secrets certs templates appfiles
          rm -rf backups/2*
          git checkout -- secrets/.gitkeep
          ./portcullis init --runtime podman --non-interactive --domain portcullis.local \
            --email ci@portcullis.local --dns-provider none --no-config-repo 2>&1 | redact
          ./portcullis restore --yes "$RUNNER_TEMP/rt-backup" 2>&1 | redact
          if ! grep -qx 'CONTAINER_RUNTIME=podman' .env || ! grep -qx "PORTCULLIS_ENGINE_SOCKET=$XDG_RUNTIME_DIR/podman/podman.sock" .env \
             || [ "$(grep -c '^CONTAINER_RUNTIME=' .env)" != 1 ]; then
            echo "FAIL: the restored .env lost this host's runtime keys"; grep -E '^(CONTAINER_RUNTIME|PORTCULLIS_ENGINE_SOCKET)=' .env; exit 1
          fi
          status_wait 300
          [ "$(sha256sum certs/ca-chain.crt | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/rt-ca.sha256")" ] \
            || { echo "FAIL: certs/ca-chain.crt differs from the Docker phase's"; exit 1; }
          LLDAP_ADMIN_PASSWORD="$(grep '^LLDAP_ADMIN_PASSWORD=' .env | cut -d= -f2-)"; echo "::add-mask::$LLDAP_ADMIN_PASSWORD"
          export LLDAP_ADMIN_PASSWORD
          for i in $(seq 1 30); do
            LLDAP_TOKEN=$(jq -n '{username: "admin", password: env.LLDAP_ADMIN_PASSWORD}' \
              | curl -sf http://127.0.0.1:17170/auth/simple/login -H 'Content-Type: application/json' -d @- | jq -r .token) && [ "$LLDAP_TOKEN" != null ] && break
            [ "$i" -eq 30 ] && { echo "FAIL: LLDAP login after the restore"; exit 1; }
            sleep 2
          done
          echo "::add-mask::$LLDAP_TOKEN"
          jq -n '{query: "{ user(userId: \"rt-person\") { id } }"}' \
            | curl -sf http://127.0.0.1:17170/api/graphql -H @<(printf 'Authorization: Bearer %s\n' "$LLDAP_TOKEN") \
                -H 'Content-Type: application/json' -d @- | jq -e '.data.user.id == "rt-person"' >/dev/null \
            || { echo "FAIL: the Docker phase's LLDAP person rt-person is not in the restored LLDAP"; exit 1; }
          left="$(find secrets -not -user "$(id -u)" -printf '%P %u:%g\n')"
          [ -z "$left" ] || { echo "FAIL: restored secrets/ entries not owned by the operator: $left"; exit 1; }
          echo "PASS: Docker → Podman: the .env kept CONTAINER_RUNTIME=podman and the rootless socket, status clean, the CA chain and rt-person are the Docker phase's, secrets/ operator-owned"

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-artifacts/apps
          ./portcullis status > e2e-artifacts/status.txt 2>&1 || true
          cp /tmp/status.json e2e-artifacts/status.json 2>/dev/null || true
          docker compose ps -a > e2e-artifacts/compose-ps.txt 2>&1 || true
          docker ps -a > e2e-artifacts/docker-ps.txt 2>&1 || true
          for svc in $(docker compose config --services 2>/dev/null); do
            docker compose logs --no-color "$svc" > "e2e-artifacts/$svc.log" 2>&1 || true
          done
          for c in $(docker ps -aq --filter label=com.docker.compose.project 2>/dev/null); do
            name="$(docker inspect -f '{{.Name}}' "$c" | tr -d /)"
            case "$name" in portcullis-*-*) docker logs "$c" > "e2e-artifacts/apps/$name.log" 2>&1 || true ;; esac
          done
          podman info > e2e-artifacts/podman-info.txt 2>&1 || true
          # shellcheck source=/dev/null
          { source "$RUNNER_TEMP/podlib.sh"; podns; } > e2e-artifacts/podman-processes.txt 2>&1 || true
          for net in $(podman network ls --format '{{.Name}}' 2>/dev/null); do
            { echo "== $net (compat)"; docker network inspect "$net" --format '{{json .IPAM}}'; echo "== $net (libpod)"; podman network inspect "$net" --format json; } >> e2e-artifacts/networks.txt 2>&1 || true
          done
          journalctl --user -n 5000 --no-pager > e2e-artifacts/user-journal.txt 2>&1 || true
          # Every container's health (status, streak, the last checks' exit
          # codes and output), also into the run log; podman logs of each
          # container that isn't healthy.
          for c in $(docker ps -aq 2>/dev/null); do
            name="$(docker inspect -f '{{.Name}}' "$c" | tr -d /)"
            h="$(docker inspect -f '{{json .State.Health}}' "$c" 2>/dev/null || echo null)"
            printf '%s %s\n' "$name" "$h" >> e2e-artifacts/health.txt
            st="$(printf '%s' "$h" | jq -r '.Status // "none"' 2>/dev/null || echo none)"
            case "$st" in healthy|none) ;; *)
              echo "::group::$name is $st"
              printf '%s' "$h" | jq -r '"failing streak \(.FailingStreak)", ((.Log // [])[-5:][] | "  \(.Start) exit \(.ExitCode): \(.Output | .[0:400])")' 2>/dev/null || printf '%s\n' "$h"
              docker inspect -f '{{json .Config.Healthcheck}}' "$c" 2>/dev/null || true
              echo "::endgroup::"
              podman logs --tail 200 "$c" > "e2e-artifacts/podman-logs-$name.txt" 2>&1 || true ;;
            esac
          done
          # Keycloak's probe by hand (its compose healthcheck), and its
          # readiness from the runner through the CI-only :9000 publish.
          kc="$(docker compose ps -q keycloak 2>/dev/null | head -n1)"
          if [ -n "$kc" ]; then
            {
              echo "== /etc/hosts"; docker exec "$kc" cat /etc/hosts
              echo "== the healthcheck, by hand (rc, seconds)"
              t0=$SECONDS
              timeout 15 docker exec "$kc" bash -c "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"; echo "rc=$? $((SECONDS - t0))s"
              echo "== the same against 127.0.0.1"
              timeout 15 docker exec "$kc" bash -c "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; cat; } 0<>/dev/tcp/127.0.0.1/9000"; echo "rc=$?"
              echo "== GET /health/ready from the runner"
              curl -s -m 10 -i http://127.0.0.1:9000/health/ready; echo
            } > e2e-artifacts/keycloak-probe.txt 2>&1 || true
            cat e2e-artifacts/keycloak-probe.txt
          fi

      - name: Upload logs
        timeout-minutes: 10
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-podman-artifacts
          path: e2e-artifacts/
          retention-days: 7
