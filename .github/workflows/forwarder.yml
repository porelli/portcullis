name: Forwarder image

# ghcr.io/porelli/portcullis-forwarder (contract §16): built and pushed as
# `edge` on every push to main that touches forwarder/, and on dispatch
# (dispatched on another branch it only builds). Release tags are pushed by
# release.yml. Templates pin it tag@sha256 like any image.
on:
  push:
    branches: [main]
    paths:
      - 'forwarder/**'
      - '.github/workflows/forwarder.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: forwarder/go.mod
          cache-dependency-path: forwarder/go.sum
      - name: vet and test
        working-directory: forwarder
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing (GitHub OIDC)
    env:
      # The repository (not a pinned ref: this job builds it).
      FWD_REPO: ghcr.io/${{ github.repository_owner }}/portcullis-forwarder
      PUSH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # edge for main, never latest (release.yml adds X.Y.Z).
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.FWD_REPO }}
          flavor: |
            latest=false
          tags: |
            type=edge,branch=main

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: forwarder
          push: ${{ env.PUSH == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Sign the pushed manifest-list digest (covers every tag and platform).
      - name: Sign image (keyless)
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${FWD_REPO}@${DIGEST}"

      - name: Digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "pushed ${FWD_REPO}:edge@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
