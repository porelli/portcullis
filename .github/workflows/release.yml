name: Release

# Publishes a GitHub release for a vX.Y.Z tag (integration contract §1):
#   1. the tag is semver and CHANGELOG.md has a "## [X.Y.Z]" section,
#   2. the HUB_IMAGE and KEYCLOAK_IMAGE defaults in docker-compose.yml are
#      RELEASED tags pinned by digest
#      (ghcr.io/porelli/portcullis-hub:A.B.C@sha256:...,
#      ghcr.io/porelli/portcullis-keycloak:D.E.F@sha256:...), and each tag
#      still resolves to that digest,
#   3. the full CI (ci.yml) passes on the tagged commit,
#   4. ghcr.io/porelli/portcullis-forwarder:X.Y.Z and the five core-built
#      images ghcr.io/porelli/portcullis-{group-gate,enroll,domains,mcp-gate,wg}:X.Y.Z
#      (Kubernetes, K1) are built from the tagged commit, pushed and signed
#      (main pushes `edge`: forwarder.yml, images.yml),
#   5. release notes (the CHANGELOG section + GitHub's generated notes) and
#      portcullis-X.Y.Z.tar.gz (the checkout without .git, plus VERSION)
#      with its .sha256 are published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag is vX.Y.Z and CHANGELOG.md has its section
        id: tag
        run: |
          TAG="$GITHUB_REF_NAME"
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          V="${TAG#v}"
          grep -qE "^## \[$V\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$V]' section"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: HUB_IMAGE default is a released Hub tag pinned by digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016  # a literal ${HUB_IMAGE:-...} in docker-compose.yml
          HUB="$(sed -n 's/.*\${HUB_IMAGE:-\([^}]*\)}.*/\1/p' docker-compose.yml | head -n1)"
          echo "HUB_IMAGE default: $HUB"
          [[ "$HUB" =~ ^ghcr\.io/porelli/portcullis-hub:([0-9]+\.[0-9]+\.[0-9]+)@(sha256:[0-9a-f]{64})$ ]] \
            || { echo "::error::HUB_IMAGE default must be ghcr.io/porelli/portcullis-hub:X.Y.Z@sha256:<digest> (got $HUB)"; exit 1; }
          HV="${BASH_REMATCH[1]}" HD="${BASH_REMATCH[2]}"
          gh release view "v$HV" -R porelli/portcullis-hub --json tagName,isDraft,isPrerelease \
            | jq -e '.isDraft == false and .isPrerelease == false' >/dev/null \
            || { echo "::error::v$HV is not a published release of porelli/portcullis-hub"; exit 1; }
          GOT="$(docker buildx imagetools inspect "ghcr.io/porelli/portcullis-hub:$HV" --format '{{json .Manifest}}' | jq -r .digest)"
          [ "$GOT" = "$HD" ] || { echo "::error::ghcr.io/porelli/portcullis-hub:$HV is $GOT, docker-compose.yml pins $HD"; exit 1; }
          echo "PASS: Hub $HV pinned at $HD"

      - name: KEYCLOAK_IMAGE default is a released portcullis-keycloak tag pinned by digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016  # a literal ${KEYCLOAK_IMAGE:-...} in docker-compose.yml
          KC="$(sed -n 's/.*\${KEYCLOAK_IMAGE:-\([^}]*\)}.*/\1/p' docker-compose.yml | head -n1)"
          echo "KEYCLOAK_IMAGE default: $KC"
          [[ "$KC" =~ ^ghcr\.io/porelli/portcullis-keycloak:([0-9]+\.[0-9]+\.[0-9]+)@(sha256:[0-9a-f]{64})$ ]] \
            || { echo "::error::KEYCLOAK_IMAGE default must be ghcr.io/porelli/portcullis-keycloak:X.Y.Z@sha256:<digest> (got $KC)"; exit 1; }
          KV="${BASH_REMATCH[1]}" KD="${BASH_REMATCH[2]}"
          gh release view "v$KV" -R porelli/portcullis-keycloak --json tagName,isDraft,isPrerelease \
            | jq -e '.isDraft == false and .isPrerelease == false' >/dev/null \
            || { echo "::error::v$KV is not a published release of porelli/portcullis-keycloak"; exit 1; }
          GOT="$(docker buildx imagetools inspect "ghcr.io/porelli/portcullis-keycloak:$KV" --format '{{json .Manifest}}' | jq -r .digest)"
          [ "$GOT" = "$KD" ] || { echo "::error::ghcr.io/porelli/portcullis-keycloak:$KV is $GOT, docker-compose.yml pins $KD"; exit 1; }
          echo "PASS: Keycloak image $KV pinned at $KD"

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  # The VPN forwarder image (contract §16) at the release's version.
  forwarder:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing (GitHub OIDC)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      # The repository (not a pinned ref: this job builds it).
      FWD_REPO: ghcr.io/${{ github.repository_owner }}/portcullis-forwarder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: forwarder
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.FWD_REPO }}:${{ needs.preflight.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${FWD_REPO}@${DIGEST}"

  # The five core-built images (K1: Kubernetes has no builder) at the
  # release's version.
  core-images:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        svc: [group-gate, enroll, domains, mcp-gate, wg]
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing (GitHub OIDC)
    env:
      IMG_REPO: ghcr.io/${{ github.repository_owner }}/portcullis-${{ matrix.svc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.svc }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMG_REPO }}:${{ needs.preflight.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMG_REPO}@${DIGEST}"
      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          V: ${{ needs.preflight.outputs.version }}
        run: echo "pushed ${IMG_REPO}:${V}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    needs: [preflight, ci, forwarder, core-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Release tarball (checkout without .git, plus VERSION) and checksum
        env:
          V: ${{ needs.preflight.outputs.version }}
        run: |
          N="portcullis-$V"
          mkdir -p dist "$RUNNER_TEMP/src"
          git archive --format=tar --prefix="$N/" "$GITHUB_REF_NAME" | tar -x -C "$RUNNER_TEMP/src"
          printf '%s\n' "$V" > "$RUNNER_TEMP/src/$N/VERSION"
          # Reproducible: sorted, numeric root owner, commit time.
          tar -C "$RUNNER_TEMP/src" --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct "$GITHUB_REF_NAME")" -cf - "$N" | gzip -n > "dist/$N.tar.gz"
          (cd dist && sha256sum "$N.tar.gz" > "$N.tar.gz.sha256")
          test "$(tar -xzOf "dist/$N.tar.gz" "$N/VERSION")" = "$V"
          if tar -tzf "dist/$N.tar.gz" | grep -q '/\.git/'; then echo "::error::.git in the tarball"; exit 1; fi
          cat dist/*.sha256

      - name: Release notes and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.preflight.outputs.version }}
          FWD_DIGEST: ${{ needs.forwarder.outputs.digest }}
        run: |
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md
          # shellcheck disable=SC2016  # a literal ${HUB_IMAGE:-...} in docker-compose.yml
          HUB="$(sed -n 's/.*\${HUB_IMAGE:-\([^}]*\)}.*/\1/p' docker-compose.yml | head -n1)"
          # shellcheck disable=SC2016  # a literal ${KEYCLOAK_IMAGE:-...} in docker-compose.yml
          KC="$(sed -n 's/.*\${KEYCLOAK_IMAGE:-\([^}]*\)}.*/\1/p' docker-compose.yml | head -n1)"
          {
            echo
            echo "**Hub image:** \`$HUB\`"
            echo
            echo "**Keycloak image:** \`$KC\`"
            echo
            echo "**VPN forwarder image:** \`ghcr.io/porelli/portcullis-forwarder:$V@$FWD_DIGEST\`"
            echo
            echo "**Core images (Kubernetes):** \`ghcr.io/porelli/portcullis-{group-gate,enroll,domains,mcp-gate,wg}:$V\` (digests in the core-images jobs' summaries; signed keyless)"
            echo
            echo "Verify the tarball: \`sha256sum -c portcullis-$V.tar.gz.sha256\`"
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" "dist/portcullis-$V.tar.gz" "dist/portcullis-$V.tar.gz.sha256" \
            --verify-tag --title "Portcullis $V" --notes-file notes.md --generate-notes
