# Dependency updates, weekly, one grouped PR per ecosystem.
# Merged by .github/workflows/dependabot-automerge.yml once CI passes (patch,
# minor, digest-only); majors get `major-update` and wait for a manual merge;
# pre-releases are closed; red CI opens an `update-failed` issue. pip, Go and
# Actions skip pre-releases by default; docker needs the ranges below.
# Not covered (update by hand, CI's pin check keeps them tag@sha256): the
# image constants in scripts/lib/*.sh (PORTCULLIS_HELPER_IMAGE,
# BACKUP_RESTIC_IMAGE) and the images used inline in .github/workflows/ci.yml.
version: 2
updates:
  # docker-compose.yml (all profiles), docker-compose.apps.yml, docker-compose.test.yml:
  # tag@digest pins are updated together.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]

  # enroll/Dockerfile base images (golang, alpine).
  - package-ecosystem: docker
    directory: /enroll
    schedule:
      interval: weekly
    groups:
      enroll-images:
        patterns: ["*"]
    # No pre-releases (golang 1.28rc1 = Gem 1.28.rc.1; see the python note).
    ignore:
      - dependency-name: "golang"
        versions: [">= 1.28.a, < 1.28", ">= 1.29.a, < 1.29", ">= 1.30.a, < 1.30"]

  # domains/Dockerfile base images (golang, alpine).
  - package-ecosystem: docker
    directory: /domains
    schedule:
      interval: weekly
    groups:
      domains-images:
        patterns: ["*"]
    # No pre-releases (golang 1.28rc1 = Gem 1.28.rc.1; see the python note).
    ignore:
      - dependency-name: "golang"
        versions: [">= 1.28.a, < 1.28", ">= 1.29.a, < 1.29", ">= 1.30.a, < 1.30"]

  # mcp-gate/Dockerfile base images (golang, alpine).
  - package-ecosystem: docker
    directory: /mcp-gate
    schedule:
      interval: weekly
    groups:
      mcp-gate-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "golang"
        versions: [">= 1.28.a, < 1.28", ">= 1.29.a, < 1.29", ">= 1.30.a, < 1.30"]

  # group-gate/Dockerfile base image (python).
  - package-ecosystem: docker
    directory: /group-gate
    schedule:
      interval: weekly
    groups:
      group-gate-images:
        patterns: ["*"]
    # No pre-releases: Dependabot's own filter let python 3.16.0a1 through
    # (PR #1). Docker `versions` use Ruby Gem requirement syntax:
    # ">= X.Y.0.a, < X.Y.0" is exactly X.Y.0's alphas, betas and rcs. Add the
    # next minor when its pre-releases start; .github/automerge closes any
    # pre-release PR that still gets through.
    ignore:
      - dependency-name: "python"
        versions: [">= 3.16.0.a, < 3.16.0", ">= 3.17.0.a, < 3.17.0", ">= 3.18.0.a, < 3.18.0"]

  # group-gate/requirements.txt (cryptography, PyJWT + deps; pins with hashes).
  - package-ecosystem: pip
    directory: /group-gate
    schedule:
      interval: weekly
    groups:
      group-gate-python:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /enroll
    schedule:
      interval: weekly
    groups:
      enroll-go:
        patterns: ["*"]

  # domains/go.mod (lego, libdns providers, age; Pebble for the tests).
  - package-ecosystem: gomod
    directory: /domains
    schedule:
      interval: weekly
    groups:
      domains-go:
        patterns: ["*"]

  # mcp-gate/go.mod (MCP go-sdk, go-oidc, go-jose, age) and the e2e-ai
  # job's MCP client (tests/e2e/mcpclient), which pins the same go-sdk:
  # one group, so both move together.
  - package-ecosystem: gomod
    directories:
      - /mcp-gate
      - /tests/e2e/mcpclient
    schedule:
      interval: weekly
    groups:
      mcp-gate-go:
        patterns: ["*"]

  # Actions are pinned by commit SHA with a `# vX.Y.Z` comment; Dependabot
  # updates both (workflows and the local composite actions).
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # tests/e2e/requirements.txt (Playwright, used by the CI e2e job).
  - package-ecosystem: pip
    directory: /tests/e2e
    schedule:
      interval: weekly
    groups:
      e2e-python:
        patterns: ["*"]
