name: Keycloak image
description: >-
  Cross-repo feature branches: when porelli/portcullis-keycloak has a branch
  with this run's branch name (not main), build the Keycloak image (Keycloak +
  the sign-in extension) from it and use that image
  (KEYCLOAK_IMAGE=portcullis-keycloak:ci, KEYCLOAK_LOCAL=1 for the later
  steps), so core and extension changes that must ship together are tested
  together without publishing an image. KEYCLOAK_LOCAL is reserved: unlike
  HUB_LOCAL, which the Hub steps read to skip `compose pull hub`, no step
  reads it, because none pulls Keycloak by name (compose up uses the local
  image); a step that ever does must skip the pull when it is set. Otherwise the compose default (the
  published edge image) is pulled here and its digest named in the step
  summary.

runs:
  using: composite
  steps:
    - name: Build Keycloak from the same-named branch (if any), else pull the published image
      shell: bash
      env:
        REF: ${{ github.head_ref || github.ref_name }}
      run: |
        url=https://github.com/porelli/portcullis-keycloak
        # The heads, listed once: a failed listing fails the step instead of
        # quietly using the published image. Exactly refs/heads/<REF>;
        # release tags are vX.Y.Z only (a branch like vpn1 is a branch).
        heads=$(git ls-remote --heads "$url") || { echo "::error::git ls-remote $url failed"; exit 1; }
        if ! [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || [ "$REF" = main ] || [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || ! awk -v r="refs/heads/$REF" '$2 == r { f = 1 } END { exit !f }' <<<"$heads"; then
          # compose's default, read without interpolation (no .env needed:
          # e2e-k3s runs this before any exists); KEYCLOAK_IMAGE wins as in compose.
          img="${KEYCLOAK_IMAGE:-$(docker compose config --no-interpolate --format json | jq -r .services.keycloak.image | sed -E 's/^\$\{KEYCLOAK_IMAGE:-(.*)\}$/\1/')}"
          [[ "$img" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+(:[A-Za-z0-9._-]+)?(@sha256:[0-9a-f]{64})?$ ]] || { echo "::error::cannot read the Keycloak image from compose (got '$img')"; exit 1; }
          # Retried: a registry hiccup now and then.
          for i in 1 2 3; do
            docker pull --quiet "$img" >/dev/null && break
            [ "$i" = 3 ] && { echo "::error::the Keycloak image $img cannot be pulled"; exit 1; }
            sleep 20
          done
          echo "Keycloak: the published image $img ($(docker image inspect --format '{{join .RepoDigests ", "}}' "$img"))" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        git clone --quiet --depth=1 --branch "$REF" "$url" "$RUNNER_TEMP/portcullis-keycloak"
        echo "Keycloak: built from portcullis-keycloak@$REF ($(git -C "$RUNNER_TEMP/portcullis-keycloak" rev-parse --short HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
        # Retried: the Gradle dependency download fails now and then.
        for i in 1 2 3; do
          docker buildx build --load --provenance=false -t portcullis-keycloak:ci "$RUNNER_TEMP/portcullis-keycloak" && break
          [ "$i" = 3 ] && { echo "::error::the Keycloak image did not build"; exit 1; }
          sleep 20
        done
        { echo "KEYCLOAK_IMAGE=portcullis-keycloak:ci"; echo "KEYCLOAK_LOCAL=1"; } >> "$GITHUB_ENV"
