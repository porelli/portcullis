name: Hub image
description: >-
  Cross-repo feature branches: when porelli/portcullis-hub has a branch with
  this run's branch name (not main), build the Hub from it and use that image
  (HUB_IMAGE=portcullis-hub:ci, HUB_LOCAL=1 for the later steps), so core and
  Hub changes that must ship together are tested together without publishing
  an image. Otherwise nothing changes: the compose default (the published
  edge image) is pulled as before.

runs:
  using: composite
  steps:
    - name: Build the Hub from the same-named branch (if any)
      shell: bash
      env:
        REF: ${{ github.head_ref || github.ref_name }}
      run: |
        url=https://github.com/porelli/portcullis-hub
        # The heads, listed once: a failed listing fails the step instead of
        # quietly using the published image. Exactly refs/heads/<REF>;
        # release tags are vX.Y.Z only (a branch like vpn1 is a branch).
        heads=$(git ls-remote --heads "$url") || { echo "::error::git ls-remote $url failed"; exit 1; }
        if ! [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || [ "$REF" = main ] || [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || ! awk -v r="refs/heads/$REF" '$2 == r { f = 1 } END { exit !f }' <<<"$heads"; then
          echo "Hub: the published image ($(docker compose config --format json | jq -r .services.hub.image))" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        git clone --quiet --depth=1 --branch "$REF" "$url" "$RUNNER_TEMP/portcullis-hub"
        echo "Hub: built from portcullis-hub@$REF ($(git -C "$RUNNER_TEMP/portcullis-hub" rev-parse --short HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
        # Retried: the module download from proxy.golang.org fails now and then.
        for i in 1 2 3; do
          docker buildx build --load --provenance=false -t portcullis-hub:ci "$RUNNER_TEMP/portcullis-hub" && break
          [ "$i" = 3 ] && { echo "::error::the Hub image did not build"; exit 1; }
          sleep 20
        done
        { echo "HUB_IMAGE=portcullis-hub:ci"; echo "HUB_LOCAL=1"; } >> "$GITHUB_ENV"
