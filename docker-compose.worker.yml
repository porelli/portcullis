# A Portcullis worker server (contract §17.7): only the agent and its
# socket proxy. Installed and driven by ./portcullis worker … (never by
# hand): `worker join` writes .env (PORTCULLIS_ROLE=worker, the runtime,
# PORTCULLIS_WORKER_DATA = this checkout's worker-data/, the engine's data
# root, its unprivileged port start) and starts this project. Under rootless Podman the CLI adds
# docker-compose.worker.podman.yml (and -selinux) instead of the core
# overlays.
#
# The agent dials out to the primary over userspace WireGuard and serves
# the agent API inside its own netstack only: no port is published here.
# The project's name maps to the instance id `worker`, which the Hub
# reserves: no instance can ever be this project.
name: portcullis-worker

networks:
  # The agent → its socket proxy only (contract §6): shared with nobody else.
  socket-proxy-agent:
    internal: true
  # The agent's egress: the tunnel to the primary's link port, image pulls.
  worker-egress: {}

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  # The worker's engine API for the agent: the same image, sections and
  # limits as the primary's socket-proxy-hub (contract §6, §17.4).
  socket-proxy-agent:
    image: ghcr.io/linuxserver/socket-proxy:3.4.7@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    <<: *hardening
    cap_add: [SYS_CHROOT]
    read_only: true
    tmpfs:
      - /run
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      EXEC: "1"
      EVENTS: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      ALLOW_LOGS: "1"
      ALLOW_ARCHIVE: "1"
      POST: "1"
      DISABLE_IPV6: "1"
      LOG_LEVEL: warning
    volumes:
      # The engine socket (contract §6): rootful Docker's, or the operator's
      # rootless Podman socket (PORTCULLIS_ENGINE_SOCKET, written by join).
      - ${PORTCULLIS_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - socket-proxy-agent
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped

  agent:
    image: ${AGENT_IMAGE:-ghcr.io/porelli/portcullis-agent:edge}
    <<: *hardening
    # uid 10008 (the image's), + the Hub's 10001 so appfiles keep the
    # primary's group (contract §17.7).
    user: "10008:10008"
    group_add: ["10001"]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      AGENT_DATA: ${PORTCULLIS_WORKER_DATA:?PORTCULLIS_WORKER_DATA must be set in .env (./portcullis worker join writes it)}
      AGENT_ENGINE: tcp://socket-proxy-agent:2375
      AGENT_BIND_ROOTS: ${PORTCULLIS_WORKER_BIND_ROOTS:-/srv:/mnt:/media}
      AGENT_RUNTIME: ${CONTAINER_RUNTIME:?CONTAINER_RUNTIME must be set in .env (./portcullis worker join writes it)}
      # The host's ip_unprivileged_port_start (a per-netns sysctl the agent
      # can't read from its container), written by worker join.
      AGENT_UNPRIVILEGED_PORT_START: ${AGENT_UNPRIVILEGED_PORT_START:?AGENT_UNPRIVILEGED_PORT_START must be set in .env (./portcullis worker join writes it)}
      # Protected from every bind like the data dir (the agent refuses a
      # bind that equals, contains or sits inside one).
      AGENT_ENGINE_SOCKET: ${PORTCULLIS_ENGINE_SOCKET:-/var/run/docker.sock}
    volumes:
      # The data dir at the same absolute host path: relative binds of the
      # bundles resolve on the host (contract §17.4).
      - ./worker-data:${PORTCULLIS_WORKER_DATA:?PORTCULLIS_WORKER_DATA must be set in .env (./portcullis worker join writes it)}
      # Read-only at their host paths: the agent compares binds against the
      # install dir and the engine's data root by device and inode, and
      # refuses to start without them (review A2-M3).
      - .:${PORTCULLIS_WORKER_INSTALL:?PORTCULLIS_WORKER_INSTALL must be set in .env (./portcullis worker join writes it)}:ro
      - ${PORTCULLIS_WORKER_ENGINE_ROOT:?PORTCULLIS_WORKER_ENGINE_ROOT must be set in .env (./portcullis worker join writes it)}:${PORTCULLIS_WORKER_ENGINE_ROOT:?}:ro
      # Every folder root (PORTCULLIS_WORKER_BIND_ROOTS) at the same path,
      # read-only: docker-compose.worker.roots.yml, generated by the CLI
      # (the agent refuses to start unless it sees each one).
    networks:
      - socket-proxy-agent
      - worker-egress
    depends_on:
      socket-proxy-agent:
        condition: service_healthy
    # The image's HEALTHCHECK (portcullis-agent healthcheck).
    mem_limit: 256m
    pids_limit: 256
    restart: unless-stopped
