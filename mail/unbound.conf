# mail-resolver (contract §19.1): a validating recursive resolver for `mail`
# and `mailctl` only. Unbound from the root servers (no forwarders), DNSSEC
# validated with the image's trust anchor (read-only: refreshed by image
# bumps). Mounted read-only at /etc/unbound/custom.conf.
#
# It listens on 5353: a non-root process can't bind 53 and no capability is
# added. Stalwart (DnsResolver Custom) and mailctl (MAILCTL_LOCAL_RESOLVER)
# use 172.31.255.4:5353 explicitly; no compose `dns:` key is set.
#
# access-control: the default portcullis-mail subnet and loopback (the
# health check). A moved PORTCULLIS_MAIL_SUBNET needs this line changed too
# (./portcullis refuses to go on until it is).
server:
    do-daemonize: no
    username: ""
    chroot: ""
    directory: "/var/unbound"
    logfile: ""
    use-syslog: no
    pidfile: ""
    verbosity: 1
    interface: 0.0.0.0@5353
    port: 5353
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.31.255.0/28 allow
    root-hints: "/var/unbound/root.hints"
    trust-anchor-file: "/var/unbound/root.key"
    harden-dnssec-stripped: yes
    harden-glue: yes
    harden-below-nxdomain: yes
    val-permissive-mode: no
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
    cache-max-ttl: 86400
    edns-buffer-size: 1232
    num-threads: 1
    msg-cache-size: 16m
    rrset-cache-size: 32m
    prefetch: yes
    prefetch-key: yes
