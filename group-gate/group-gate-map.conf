# Subdomain to required LLDAP group mapping.
# Users must be in the listed group to access the app.
# Format: subdomain=required_group
#
# Subdomains are matched case-insensitively against <sub>.<PORTCULLIS_DOMAIN>.
#
# The Hub also writes a "groups" map (subdomain -> manifest access_group) into
# /hub-data/group-gate-policy.json; group-gate merges it on every request.
# Hub entries add to / override the app entries below, but can NEVER override
# the core subdomains (auth, traefik, hub, directory, enroll, metrics) — those always
# come from this file (defaulting to lldap_admin if missing).
#
# Subdomains with no entry in either source are not group-restricted at the
# gate level (any authenticated user passes; group-gate logs ALLOW-UNMAPPED).
# They may still have their own native OIDC group checks.

# Forward-auth protected apps
adguard=users_adguard
db=users_cloudbeaver
dokuwiki=users_dokuwiki
pihole=users_pihole
disks=users_scrutiny
wiki=users_wiki

# Header-auth apps (behind forward-auth + X-Forwarded-User)
finance=users_firefly
grafana=users_grafana
kanboard=users_kanboard

# Core infrastructure (admin-only)
auth=lldap_admin
traefik=lldap_admin
hub=lldap_admin
directory=lldap_admin
enroll=lldap_admin
# Grafana (docker compose --profile monitoring)
metrics=lldap_admin
