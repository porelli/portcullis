# Mail's recovery session (./portcullis mail enable / upgrade / restore's
# void; scripts/lib/mail.sh _mail_recovery_start), never on its own: added
# last to COMPOSE_FILE for the recovery-mode start only. Stalwart then runs
# with the recovery admin and possibly a restore's unvoided passwords, so
# it publishes no port, sits only on the internal portcullis-mail network
# (mailctl's bootstrap / void reach it there; no egress) and never comes
# back by itself (a reboot, a killed CLI): restart "no". The CLI checks
# that portcullis-mail is internal before starting it, and the entrypoint
# admits recovery mode only with this boot's session file.
services:
  mail:
    ports: !reset []
    networks: !override
      portcullis-mail:
        ipv4_address: ${PORTCULLIS_MAIL_IP:-172.31.255.2}
    restart: "no"
