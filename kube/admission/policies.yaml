# The admission guard behind the Hub's Role (contract §6 "The admission
# policies", K6): five ValidatingAdmissionPolicies on the apps namespace,
# each bound by its own portcullis-apps-guard-<policy> (bindings.yaml), and
# portcullis-edge-routes on portcullis-edge (Traefik's only watched
# namespace: the core and the apps' IngressRoutes / Middlewares) bound by
# portcullis-edge-guard-routes, all with the params ConfigMap
# portcullis-admission-params (params.yaml). Authored
# in the Hub (internal/runtime/kube/testdata/admission/, envtest vectors);
# this is a byte copy, compared in CI (K13).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-apps-pods
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: spec
    expression: object.spec
  - name: meta
    expression: object.metadata
  - name: labels
    expression: 'has(variables.meta.labels) ? variables.meta.labels : {}'
  - name: annotations
    expression: 'has(variables.meta.annotations) ? variables.meta.annotations : {}'
  - name: inst
    expression: >-
      'portcullis.io/instance' in variables.labels ? variables.labels['portcullis.io/instance'] : ''
  - name: helper
    expression: '''portcullis.io/helper'' in variables.labels ? variables.labels[''portcullis.io/helper''] : '''''
  - name: probe
    expression: '''portcullis.io/probe'' in variables.labels'
  - name: containers
    expression: >-
      variables.spec.containers + (has(variables.spec.initContainers) ? variables.spec.initContainers : []) + (has(variables.spec.ephemeralContainers)
      ? variables.spec.ephemeralContainers : [])
  - name: volumes
    expression: 'has(variables.spec.volumes) ? variables.spec.volumes : []'
  - name: baselineCaps
    expression: >-
      ['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD', 'NET_BIND_SERVICE', 'SETFCAP',
      'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']
  - name: safeSysctls
    expression: >-
      ['kernel.shm_rmid_forced', 'net.ipv4.ip_local_port_range', 'net.ipv4.ip_unprivileged_port_start', 'net.ipv4.tcp_syncookies',
      'net.ipv4.ping_group_range', 'net.ipv4.ip_local_reserved_ports', 'net.ipv4.tcp_keepalive_time', 'net.ipv4.tcp_fin_timeout',
      'net.ipv4.tcp_keepalive_intvl', 'net.ipv4.tcp_keepalive_probes']
  - name: prefix
    expression: variables.inst + '--'
  # Root one-shot helpers (ruling): a Job's pod labelled portcullis.io/one-shot:
  # true, every container of the root shape, no ServiceAccount token.
  - name: oneShot
    expression: >-
      'portcullis.io/one-shot' in variables.labels && variables.labels['portcullis.io/one-shot'] == 'true' && has(variables.meta.ownerReferences) && variables.meta.ownerReferences.exists(o, o.kind == 'Job' && has(o.controller) && o.controller) && request.userInfo.username in ['system:serviceaccount:kube-system:job-controller', 'system:kube-controller-manager'] && has(variables.spec.automountServiceAccountToken) && variables.spec.automountServiceAccountToken == false && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.fsGroup) && variables.spec.securityContext.fsGroup == 0) && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.supplementalGroups) && 0 in variables.spec.securityContext.supplementalGroups) && variables.volumes.all(v, has(v.emptyDir) || (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName.startsWith(variables.prefix)) || (has(v.configMap) && v.configMap.name.startsWith(variables.prefix)) || (has(v.secret) && v.secret.secretName.startsWith(variables.prefix))) && variables.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(x, x in ['CHOWN', 'DAC_OVERRIDE', 'FOWNER'])) && (!has(c.ports) || size(c.ports) == 0) && ((has(c.securityContext) && has(c.securityContext.runAsGroup)) ? c.securityContext.runAsGroup != 0 : (has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsGroup) && variables.spec.securityContext.runAsGroup != 0)) && (!has(c.volumeMounts) || c.volumeMounts.all(m, !variables.volumes.exists(v, v.name == m.name && has(v.hostPath)))))
  - name: initNames
    expression: 'has(variables.spec.initContainers) ? variables.spec.initContainers.map(c, c.name) : []'
  - name: svcStaticBand
    expression: >-
      string(cidr(params.data.serviceCIDR).ip()) + '/' + string(32 - ((32 - cidr(params.data.serviceCIDR).prefixLength()) - 4 < 4 ? 4
      : ((32 - cidr(params.data.serviceCIDR).prefixLength()) - 4 > 8 ? 8 : (32 - cidr(params.data.serviceCIDR).prefixLength()) - 4)))
  validations:
  - expression: >-
      !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
      || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
    messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
  - expression: variables.inst != ''
    message: a pod needs the portcullis.io/instance label
  - expression: variables.inst != 'portcullis-probe' || variables.probe
    message: 'portcullis.io/instance: portcullis-probe is reserved for the Hub''s probe pods'
  - expression: >-
      variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged
      == false)
    message: privileged containers are refused
  - expression: >-
      !(has(variables.spec.hostNetwork) && variables.spec.hostNetwork) && !(has(variables.spec.hostPID) && variables.spec.hostPID)
      && !(has(variables.spec.hostIPC) && variables.spec.hostIPC)
    messageExpression: '''host namespaces are refused ('' + object.metadata.name + '')'''
  - expression: >-
      variables.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))
    message: hostPort is refused
  - expression: >-
      !(has(variables.spec.securityContext) && has(variables.spec.securityContext.windowsOptions) && has(variables.spec.securityContext.windowsOptions.hostProcess)
      && variables.spec.securityContext.windowsOptions.hostProcess) && variables.containers.all(c, !(has(c.securityContext)
      && has(c.securityContext.windowsOptions) && has(c.securityContext.windowsOptions.hostProcess) && c.securityContext.windowsOptions.hostProcess))
    message: hostProcess is refused
  - expression: >-
      variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add)
        || c.securityContext.capabilities.add.all(cap,
             variables.helper == 'volume' ? cap in ['CHOWN', 'DAC_OVERRIDE', 'FOWNER']
             : (cap in variables.baselineCaps || (variables.helper == 'fixer' && cap == 'DAC_READ_SEARCH'))))
    message: >-
      a capability outside the Kubernetes baseline (helpers: fixer DAC_READ_SEARCH, volume CHOWN / DAC_OVERRIDE
      / FOWNER only)
  - expression: >-
      !(has(variables.spec.securityContext) && has(variables.spec.securityContext.seccompProfile) && variables.spec.securityContext.seccompProfile.type
      == 'Unconfined') && variables.containers.all(c, !(has(c.securityContext) && has(c.securityContext.seccompProfile)
      && c.securityContext.seccompProfile.type == 'Unconfined'))
    message: an Unconfined seccomp profile is refused
  - expression: >-
      !(has(variables.spec.securityContext) && has(variables.spec.securityContext.appArmorProfile) && variables.spec.securityContext.appArmorProfile.type
      == 'Unconfined') && variables.containers.all(c, !(has(c.securityContext) && has(c.securityContext.appArmorProfile)
      && c.securityContext.appArmorProfile.type == 'Unconfined')) && variables.annotations.all(k, !k.startsWith('container.apparmor.security.beta.kubernetes.io/')
      || variables.annotations[k] != 'unconfined')
    message: an Unconfined AppArmor profile is refused
  - expression: >-
      ([variables.spec].filter(s, has(s.securityContext) && has(s.securityContext.seLinuxOptions)).map(s, s.securityContext.seLinuxOptions)
        + variables.containers.filter(c, has(c.securityContext) && has(c.securityContext.seLinuxOptions)).map(c,
      c.securityContext.seLinuxOptions))
      .all(o, !has(o.user) && !has(o.role) && (!has(o.type) || o.type in ['container_t', 'container_init_t', 'container_kvm_t',
      'container_engine_t']))
    message: seLinuxOptions with a user, a role or another type are refused
  - expression: >-
      variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.procMount) || c.securityContext.procMount
      == 'Default')
    message: procMount must be Default
  - expression: >-
      !has(variables.spec.securityContext) || !has(variables.spec.securityContext.sysctls) || variables.spec.securityContext.sysctls.all(s,
      s.name in variables.safeSysctls)
    message: a sysctl outside the baseline's safe set
  - expression: >-
      variables.volumes.all(v, has(v.emptyDir)
        || (has(v.configMap) && (v.configMap.name.startsWith(variables.prefix) || v.configMap.name.startsWith('tpl-')))
        || (has(v.secret) && (v.secret.secretName.startsWith(variables.prefix) || v.secret.secretName.startsWith('tpl-')))
        || (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName.startsWith(variables.prefix))
        || (has(v.hostPath) && !v.hostPath.path.contains('/..') && !v.hostPath.path.contains('/./')
            && params.data.bindRoots.split(' ').exists(r, r != '' && (v.hostPath.path == r || v.hostPath.path.startsWith(r + '/'))))
        || (has(v.projected) && has(v.projected.sources) && v.projected.sources.all(src, has(src.downwardAPI)
            || (has(src.secret) && (src.secret.name.startsWith(variables.prefix) || src.secret.name.startsWith('tpl-'))) || (has(src.configMap) && (src.configMap.name.startsWith(variables.prefix) || src.configMap.name.startsWith('tpl-'))))))
    message: >-
      a volume outside the allowlist (emptyDir; the instance's own ConfigMap, Secret or PVC; hostPath under the shared-folder roots; projected secret, configMap or downwardAPI)
  - expression: >-
      (!has(variables.spec.serviceAccountName) || variables.spec.serviceAccountName == 'default') && has(variables.spec.automountServiceAccountToken)
      && variables.spec.automountServiceAccountToken == false
    message: >-
      pods run as the namespace's default ServiceAccount with automountServiceAccountToken: false
  - expression: >-
      variables.containers.all(c, (!has(c.envFrom) || c.envFrom.all(e, (!has(e.secretRef) || (e.secretRef.name.startsWith(variables.prefix) || e.secretRef.name.startsWith('tpl-')))
          && (!has(e.configMapRef) || (e.configMapRef.name.startsWith(variables.prefix) || e.configMapRef.name.startsWith('tpl-')))))
        && (!has(c.env) || c.env.all(e, !has(e.valueFrom) || ((!has(e.valueFrom.secretKeyRef) || (e.valueFrom.secretKeyRef.name.startsWith(variables.prefix) || e.valueFrom.secretKeyRef.name.startsWith('tpl-')))
          && (!has(e.valueFrom.configMapKeyRef) || (e.valueFrom.configMapKeyRef.name.startsWith(variables.prefix) || e.valueFrom.configMapKeyRef.name.startsWith('tpl-')))))))
    messageExpression: >-
      "a Secret, ConfigMap or PVC that isn't this instance's (" + variables.prefix + "* or tpl-*)"
  - expression: >-
      variables.annotations.all(k, !k.startsWith('cni.projectcalico.org/') && !k.startsWith('k8s.v1.cni.cncf.io/')
      && !k.startsWith('v1.multus-cni.io/') && !k.startsWith('kube-router.io/') && !k.startsWith('io.cilium/'))
    message: CNI annotations are refused
  - expression: >-
      !('portcullis.io/vpn-slot' in variables.labels) || variables.labels['portcullis.io/vpn-slot'].matches('^([0-9]|[1-3][0-9]|4[0-6])$')
    message: portcullis.io/vpn-slot must be an integer 0-46
  - expression: >-
      variables.helper == '' || ((variables.helper == 'fixer' || variables.helper == 'volume')
          && variables.containers.all(c, c.image == params.data.hubImage)
          && variables.labels.all(k, !k.startsWith('portcullis.io/net-') && k != 'portcullis.io/egress' && k !=
      'portcullis.io/vpn-slot')
          && request.userInfo.username == params.data.hubServiceAccount)
    message: >-
      a helper pod: portcullis.io/helper fixer or volume, the Hub's own image, no network label, created by the
      Hub
  - expression: >-
      (variables.helper != '' || ((!(has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsUser)
        && variables.spec.securityContext.runAsUser == 0) || variables.oneShot)
        && variables.containers.all(c, !(has(c.securityContext) && has(c.securityContext.runAsUser) && c.securityContext.runAsUser == 0)
          || variables.oneShot || (c.name in variables.initNames && has(variables.spec.automountServiceAccountToken) && variables.spec.automountServiceAccountToken == false && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.fsGroup) && variables.spec.securityContext.fsGroup == 0) && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.supplementalGroups) && 0 in variables.spec.securityContext.supplementalGroups) && has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(x, x in ['CHOWN', 'DAC_OVERRIDE', 'FOWNER'])) && (!has(c.ports) || size(c.ports) == 0) && ((has(c.securityContext) && has(c.securityContext.runAsGroup)) ? c.securityContext.runAsGroup != 0 : (has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsGroup) && variables.spec.securityContext.runAsGroup != 0)) && (!has(c.volumeMounts) || c.volumeMounts.all(m, !variables.volumes.exists(v, v.name == m.name && has(v.hostPath))))))))
    message: >-
      only the Hub's helper pods, a Job's one-shot pods (portcullis.io/one-shot) and init containers of the root shape
      (drop ALL, add only CHOWN / DAC_OVERRIDE / FOWNER, no privilege escalation, no ports, no ServiceAccount token, a group
      other than 0, no fsGroup / supplemental group 0, no hostPath mount; a one-shot pod's volumes only emptyDir or
      the instance's own PVC / ConfigMap / Secret) may run as root
  # Compose names (ruling): the Hub's hostname / subdomain / search domain only.
  - expression: >-
      ((!has(variables.spec.hostname) || ('portcullis.io/service' in variables.labels && variables.spec.hostname == variables.labels['portcullis.io/service']))
        && (!has(variables.spec.subdomain) || variables.spec.subdomain == variables.inst)
        && (!has(variables.spec.dnsPolicy) || variables.spec.dnsPolicy != 'None')
        && (!has(variables.spec.dnsConfig) || ((!has(variables.spec.dnsConfig.nameservers) || size(variables.spec.dnsConfig.nameservers) == 0)
          && (!has(variables.spec.dnsConfig.searches) || variables.spec.dnsConfig.searches.all(s, s == variables.inst + '.' + params.data.appsNamespace + '.svc.cluster.local')))))
    message: >-
      hostname / subdomain / dnsConfig: only the pod's own portcullis.io/service and instance, the search domain
      <instance>.<apps namespace>.svc.cluster.local, no nameservers, no dnsPolicy None
  # Compose network aliases (ruling): /etc/hosts entries for the Hub's
  # <instance>--<alias> ClusterIP Services only.
  - expression: >-
      (!has(variables.spec.hostAliases) || (size(variables.spec.hostAliases) <= 16 && variables.spec.hostAliases.all(h,
        has(h.ip) && isIP(h.ip) && ip(h.ip).family() == 4 && cidr(params.data.serviceCIDR).containsIP(h.ip)
        && h.ip != string(cidr(params.data.serviceCIDR).ip()) && !cidr(variables.svcStaticBand).containsIP(h.ip)
        && has(h.hostnames) && size(h.hostnames) > 0 && size(h.hostnames) <= 16
        && h.hostnames.all(n, n.matches('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')))))
    message: >-
      hostAliases: at most 16 entries, each an address of the service network outside its static band
      (the core Services' fixed addresses) and 1-16 hostnames that are single DNS labels
  - expression: >-
      !variables.probe || (variables.inst == 'portcullis-probe'
          && variables.volumes.size() == 0
          && variables.containers.all(c, c.image == params.data.hubImage
              && has(c.command) && size(c.command) >= 3 && c.command[0] == 'hub' && c.command[1] == 'helper' &&
      c.command[2] in ['listen', 'idle', 'dial']
              && (!has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add)
      || size(c.securityContext.capabilities.add) == 0)
              && has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot
      == true)
          && variables.labels.all(k, !k.startsWith('portcullis.io/') || k in ['portcullis.io/instance', 'portcullis.io/probe']))
    message: >-
      a probe pod: the Hub's image running hub helper listen|idle|dial, instance portcullis-probe, no volume, no
      capability, non-root, no other portcullis.io/ label
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-apps-workloads
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - jobs
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - secrets
  variables:
  - name: spec
    expression: object.spec.template.spec
  - name: meta
    expression: object.spec.template.metadata
  - name: labels
    expression: 'has(variables.meta.labels) ? variables.meta.labels : {}'
  - name: annotations
    expression: 'has(variables.meta.annotations) ? variables.meta.annotations : {}'
  - name: inst
    expression: >-
      'portcullis.io/instance' in variables.labels ? variables.labels['portcullis.io/instance'] : ''
  - name: helper
    expression: '''portcullis.io/helper'' in variables.labels ? variables.labels[''portcullis.io/helper''] : '''''
  - name: probe
    expression: '''portcullis.io/probe'' in variables.labels'
  - name: containers
    expression: >-
      variables.spec.containers + (has(variables.spec.initContainers) ? variables.spec.initContainers : []) + (has(variables.spec.ephemeralContainers)
      ? variables.spec.ephemeralContainers : [])
  - name: volumes
    expression: 'has(variables.spec.volumes) ? variables.spec.volumes : []'
  - name: baselineCaps
    expression: >-
      ['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD', 'NET_BIND_SERVICE', 'SETFCAP',
      'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']
  - name: safeSysctls
    expression: >-
      ['kernel.shm_rmid_forced', 'net.ipv4.ip_local_port_range', 'net.ipv4.ip_unprivileged_port_start', 'net.ipv4.tcp_syncookies',
      'net.ipv4.ping_group_range', 'net.ipv4.ip_local_reserved_ports', 'net.ipv4.tcp_keepalive_time', 'net.ipv4.tcp_fin_timeout',
      'net.ipv4.tcp_keepalive_intvl', 'net.ipv4.tcp_keepalive_probes']
  - name: prefix
    expression: variables.inst + '--'
  # Root one-shot helpers (ruling): a Job's pod labelled portcullis.io/one-shot:
  # true, every container of the root shape, no ServiceAccount token.
  - name: oneShot
    expression: >-
      'portcullis.io/one-shot' in variables.labels && variables.labels['portcullis.io/one-shot'] == 'true' && object.kind == 'Job' && has(variables.spec.automountServiceAccountToken) && variables.spec.automountServiceAccountToken == false && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.fsGroup) && variables.spec.securityContext.fsGroup == 0) && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.supplementalGroups) && 0 in variables.spec.securityContext.supplementalGroups) && variables.volumes.all(v, has(v.emptyDir) || (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName.startsWith(variables.prefix)) || (has(v.configMap) && v.configMap.name.startsWith(variables.prefix)) || (has(v.secret) && v.secret.secretName.startsWith(variables.prefix))) && variables.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(x, x in ['CHOWN', 'DAC_OVERRIDE', 'FOWNER'])) && (!has(c.ports) || size(c.ports) == 0) && ((has(c.securityContext) && has(c.securityContext.runAsGroup)) ? c.securityContext.runAsGroup != 0 : (has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsGroup) && variables.spec.securityContext.runAsGroup != 0)) && (!has(c.volumeMounts) || c.volumeMounts.all(m, !variables.volumes.exists(v, v.name == m.name && has(v.hostPath)))))
  - name: initNames
    expression: 'has(variables.spec.initContainers) ? variables.spec.initContainers.map(c, c.name) : []'
  - name: svcStaticBand
    expression: >-
      string(cidr(params.data.serviceCIDR).ip()) + '/' + string(32 - ((32 - cidr(params.data.serviceCIDR).prefixLength()) - 4 < 4 ? 4
      : ((32 - cidr(params.data.serviceCIDR).prefixLength()) - 4 > 8 ? 8 : (32 - cidr(params.data.serviceCIDR).prefixLength()) - 4)))
  validations:
  - expression: >-
      !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
      || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
    messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
  - expression: >-
      object.kind != 'Secret' || !has(object.type) || object.type != 'kubernetes.io/service-account-token'
    message: a ServiceAccount token Secret is refused
  - expression: object.kind == 'Secret' || !has(object.spec.replicas) || object.spec.replicas <= 1
    message: replicas above 1 are refused
  - expression: object.kind == 'Secret' || (variables.inst != '')
    message: a pod needs the portcullis.io/instance label
  - expression: object.kind == 'Secret' || (variables.inst != 'portcullis-probe' || variables.probe)
    message: 'portcullis.io/instance: portcullis-probe is reserved for the Hub''s probe pods'
  - expression: >-
      object.kind == 'Secret' || (variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged)
      || c.securityContext.privileged == false))
    message: privileged containers are refused
  - expression: >-
      object.kind == 'Secret' || (!(has(variables.spec.hostNetwork) && variables.spec.hostNetwork) && !(has(variables.spec.hostPID)
      && variables.spec.hostPID) && !(has(variables.spec.hostIPC) && variables.spec.hostIPC))
    messageExpression: '''host namespaces are refused ('' + object.metadata.name + '')'''
  - expression: >-
      object.kind == 'Secret' || (variables.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) ||
      p.hostPort == 0)))
    message: hostPort is refused
  - expression: >-
      object.kind == 'Secret' || (!(has(variables.spec.securityContext) && has(variables.spec.securityContext.windowsOptions)
      && has(variables.spec.securityContext.windowsOptions.hostProcess) && variables.spec.securityContext.windowsOptions.hostProcess)
      && variables.containers.all(c, !(has(c.securityContext) && has(c.securityContext.windowsOptions) && has(c.securityContext.windowsOptions.hostProcess)
      && c.securityContext.windowsOptions.hostProcess)))
    message: hostProcess is refused
  - expression: >-
      object.kind == 'Secret' || (variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities)
      || !has(c.securityContext.capabilities.add)
        || c.securityContext.capabilities.add.all(cap,
             variables.helper == 'volume' ? cap in ['CHOWN', 'DAC_OVERRIDE', 'FOWNER']
             : (cap in variables.baselineCaps || (variables.helper == 'fixer' && cap == 'DAC_READ_SEARCH')))))
    message: >-
      a capability outside the Kubernetes baseline (helpers: fixer DAC_READ_SEARCH, volume CHOWN / DAC_OVERRIDE
      / FOWNER only)
  - expression: >-
      object.kind == 'Secret' || (!(has(variables.spec.securityContext) && has(variables.spec.securityContext.seccompProfile)
      && variables.spec.securityContext.seccompProfile.type == 'Unconfined') && variables.containers.all(c, !(has(c.securityContext)
      && has(c.securityContext.seccompProfile) && c.securityContext.seccompProfile.type == 'Unconfined')))
    message: an Unconfined seccomp profile is refused
  - expression: >-
      object.kind == 'Secret' || (!(has(variables.spec.securityContext) && has(variables.spec.securityContext.appArmorProfile)
      && variables.spec.securityContext.appArmorProfile.type == 'Unconfined') && variables.containers.all(c, !(has(c.securityContext)
      && has(c.securityContext.appArmorProfile) && c.securityContext.appArmorProfile.type == 'Unconfined')) && variables.annotations.all(k,
      !k.startsWith('container.apparmor.security.beta.kubernetes.io/') || variables.annotations[k] != 'unconfined'))
    message: an Unconfined AppArmor profile is refused
  - expression: >-
      object.kind == 'Secret' || (([variables.spec].filter(s, has(s.securityContext) && has(s.securityContext.seLinuxOptions)).map(s,
      s.securityContext.seLinuxOptions)
        + variables.containers.filter(c, has(c.securityContext) && has(c.securityContext.seLinuxOptions)).map(c,
      c.securityContext.seLinuxOptions))
      .all(o, !has(o.user) && !has(o.role) && (!has(o.type) || o.type in ['container_t', 'container_init_t', 'container_kvm_t',
      'container_engine_t'])))
    message: seLinuxOptions with a user, a role or another type are refused
  - expression: >-
      object.kind == 'Secret' || (variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.procMount)
      || c.securityContext.procMount == 'Default'))
    message: procMount must be Default
  - expression: >-
      object.kind == 'Secret' || (!has(variables.spec.securityContext) || !has(variables.spec.securityContext.sysctls)
      || variables.spec.securityContext.sysctls.all(s, s.name in variables.safeSysctls))
    message: a sysctl outside the baseline's safe set
  - expression: >-
      object.kind == 'Secret' || (variables.volumes.all(v, has(v.emptyDir)
        || (has(v.configMap) && (v.configMap.name.startsWith(variables.prefix) || v.configMap.name.startsWith('tpl-')))
        || (has(v.secret) && (v.secret.secretName.startsWith(variables.prefix) || v.secret.secretName.startsWith('tpl-')))
        || (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName.startsWith(variables.prefix))
        || (has(v.hostPath) && !v.hostPath.path.contains('/..') && !v.hostPath.path.contains('/./')
            && params.data.bindRoots.split(' ').exists(r, r != '' && (v.hostPath.path == r || v.hostPath.path.startsWith(r + '/'))))
        || (has(v.projected) && has(v.projected.sources) && v.projected.sources.all(src, has(src.downwardAPI)
            || (has(src.secret) && (src.secret.name.startsWith(variables.prefix) || src.secret.name.startsWith('tpl-'))) || (has(src.configMap) && (src.configMap.name.startsWith(variables.prefix) || src.configMap.name.startsWith('tpl-')))))))
    message: >-
      a volume outside the allowlist (emptyDir; the instance's own ConfigMap, Secret or PVC; hostPath under the shared-folder roots; projected secret, configMap or downwardAPI)
  - expression: >-
      object.kind == 'Secret' || ((!has(variables.spec.serviceAccountName) || variables.spec.serviceAccountName
      == 'default') && has(variables.spec.automountServiceAccountToken) && variables.spec.automountServiceAccountToken
      == false)
    message: >-
      pods run as the namespace's default ServiceAccount with automountServiceAccountToken: false
  - expression: >-
      object.kind == 'Secret' || (variables.containers.all(c, (!has(c.envFrom) || c.envFrom.all(e, (!has(e.secretRef) || (e.secretRef.name.startsWith(variables.prefix) || e.secretRef.name.startsWith('tpl-')))
          && (!has(e.configMapRef) || (e.configMapRef.name.startsWith(variables.prefix) || e.configMapRef.name.startsWith('tpl-')))))
        && (!has(c.env) || c.env.all(e, !has(e.valueFrom) || ((!has(e.valueFrom.secretKeyRef) || (e.valueFrom.secretKeyRef.name.startsWith(variables.prefix) || e.valueFrom.secretKeyRef.name.startsWith('tpl-')))
          && (!has(e.valueFrom.configMapKeyRef) || (e.valueFrom.configMapKeyRef.name.startsWith(variables.prefix) || e.valueFrom.configMapKeyRef.name.startsWith('tpl-'))))))))
    messageExpression: >-
      "a Secret, ConfigMap or PVC that isn't this instance's (" + variables.prefix + "* or tpl-*)"
  - expression: >-
      object.kind == 'Secret' || (variables.annotations.all(k, !k.startsWith('cni.projectcalico.org/') && !k.startsWith('k8s.v1.cni.cncf.io/')
      && !k.startsWith('v1.multus-cni.io/') && !k.startsWith('kube-router.io/') && !k.startsWith('io.cilium/')))
    message: CNI annotations are refused
  - expression: >-
      object.kind == 'Secret' || (!('portcullis.io/vpn-slot' in variables.labels) || variables.labels['portcullis.io/vpn-slot'].matches('^([0-9]|[1-3][0-9]|4[0-6])$'))
    message: portcullis.io/vpn-slot must be an integer 0-46
  - expression: >-
      object.kind == 'Secret' || (variables.helper == '' || ((variables.helper == 'fixer' || variables.helper ==
      'volume')
          && variables.containers.all(c, c.image == params.data.hubImage)
          && variables.labels.all(k, !k.startsWith('portcullis.io/net-') && k != 'portcullis.io/egress' && k !=
      'portcullis.io/vpn-slot')
          && request.userInfo.username == params.data.hubServiceAccount))
    message: >-
      a helper pod: portcullis.io/helper fixer or volume, the Hub's own image, no network label, created by the
      Hub
  - expression: >-
      object.kind == 'Secret' || (variables.helper != '' || ((!(has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsUser)
        && variables.spec.securityContext.runAsUser == 0) || variables.oneShot)
        && variables.containers.all(c, !(has(c.securityContext) && has(c.securityContext.runAsUser) && c.securityContext.runAsUser == 0)
          || variables.oneShot || (c.name in variables.initNames && has(variables.spec.automountServiceAccountToken) && variables.spec.automountServiceAccountToken == false && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.fsGroup) && variables.spec.securityContext.fsGroup == 0) && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.supplementalGroups) && 0 in variables.spec.securityContext.supplementalGroups) && has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(x, x in ['CHOWN', 'DAC_OVERRIDE', 'FOWNER'])) && (!has(c.ports) || size(c.ports) == 0) && ((has(c.securityContext) && has(c.securityContext.runAsGroup)) ? c.securityContext.runAsGroup != 0 : (has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsGroup) && variables.spec.securityContext.runAsGroup != 0)) && (!has(c.volumeMounts) || c.volumeMounts.all(m, !variables.volumes.exists(v, v.name == m.name && has(v.hostPath))))))))
    message: >-
      only the Hub's helper pods, a Job's one-shot pods (portcullis.io/one-shot) and init containers of the root shape
      (drop ALL, add only CHOWN / DAC_OVERRIDE / FOWNER, no privilege escalation, no ports, no ServiceAccount token, a group
      other than 0, no fsGroup / supplemental group 0, no hostPath mount; a one-shot pod's volumes only emptyDir or
      the instance's own PVC / ConfigMap / Secret) may run as root
  # Compose names (ruling): the Hub's hostname / subdomain / search domain only.
  - expression: >-
      object.kind == 'Secret' || ((!has(variables.spec.hostname) || ('portcullis.io/service' in variables.labels && variables.spec.hostname == variables.labels['portcullis.io/service']))
        && (!has(variables.spec.subdomain) || variables.spec.subdomain == variables.inst)
        && (!has(variables.spec.dnsPolicy) || variables.spec.dnsPolicy != 'None')
        && (!has(variables.spec.dnsConfig) || ((!has(variables.spec.dnsConfig.nameservers) || size(variables.spec.dnsConfig.nameservers) == 0)
          && (!has(variables.spec.dnsConfig.searches) || variables.spec.dnsConfig.searches.all(s, s == variables.inst + '.' + params.data.appsNamespace + '.svc.cluster.local')))))
    message: >-
      hostname / subdomain / dnsConfig: only the pod's own portcullis.io/service and instance, the search domain
      <instance>.<apps namespace>.svc.cluster.local, no nameservers, no dnsPolicy None
  # Compose network aliases (ruling): /etc/hosts entries for the Hub's
  # <instance>--<alias> ClusterIP Services only.
  - expression: >-
      object.kind == 'Secret' || (!has(variables.spec.hostAliases) || (size(variables.spec.hostAliases) <= 16 && variables.spec.hostAliases.all(h,
        has(h.ip) && isIP(h.ip) && ip(h.ip).family() == 4 && cidr(params.data.serviceCIDR).containsIP(h.ip)
        && h.ip != string(cidr(params.data.serviceCIDR).ip()) && !cidr(variables.svcStaticBand).containsIP(h.ip)
        && has(h.hostnames) && size(h.hostnames) > 0 && size(h.hostnames) <= 16
        && h.hostnames.all(n, n.matches('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')))))
    message: >-
      hostAliases: at most 16 entries, each an address of the service network outside its static band
      (the core Services' fixed addresses) and 1-16 hostnames that are single DNS labels
  - expression: >-
      object.kind == 'Secret' || (!variables.probe || (variables.inst == 'portcullis-probe'
          && variables.volumes.size() == 0
          && variables.containers.all(c, c.image == params.data.hubImage
              && has(c.command) && size(c.command) >= 3 && c.command[0] == 'hub' && c.command[1] == 'helper' &&
      c.command[2] in ['listen', 'idle', 'dial']
              && (!has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add)
      || size(c.securityContext.capabilities.add) == 0)
              && has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot
      == true)
          && variables.labels.all(k, !k.startsWith('portcullis.io/') || k in ['portcullis.io/instance', 'portcullis.io/probe'])))
    message: >-
      a probe pod: the Hub's image running hub helper listen|idle|dial, instance portcullis-probe, no volume, no
      capability, non-root, no other portcullis.io/ label
  - expression: object.kind == 'Secret' || !('portcullis.io/helper' in variables.labels)
    message: helpers are pods, never Deployments or Jobs
