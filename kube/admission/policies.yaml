apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-apps-services
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  variables:
    - name: svcBits
      expression: "32 - cidr(params.data.serviceCIDR).prefixLength()"
    - name: bandBits
      expression: "variables.svcBits - 4 < 4 ? 4 : (variables.svcBits - 4 > 8 ? 8 : variables.svcBits - 4)"
    - name: staticBand
      expression: "string(cidr(params.data.serviceCIDR).ip()) + '/' + string(32 - variables.bandBits)"
    # A server dry-run reports the service network's own address as the
    # clusterIP (never allocated): not a static-band address.
    - name: netAddr
      expression: "string(cidr(params.data.serviceCIDR).ip())"
  validations:
    # The CLI's probe (kube_admission_probe): an object annotated with
    # exactly this binding's params generation is refused, naming it — the
    # proof that this policy's binding of that generation is live.
    - expression: >-
        !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
        || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
      messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
    - expression: "!has(object.spec.type) || object.spec.type in ['ClusterIP', 'LoadBalancer']"
      messageExpression: "'Service type ' + object.spec.type + ' is refused (NodePort, ExternalName)'"
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: "externalIPs are refused"
    - expression: "!has(object.spec.ports) || object.spec.ports.all(p, !has(p.nodePort) || p.nodePort == 0)"
      message: "a nodePort is refused"
    - expression: >-
        !has(object.spec.type) || object.spec.type != 'LoadBalancer'
        || (has(object.spec.allocateLoadBalancerNodePorts) && object.spec.allocateLoadBalancerNodePorts == false)
      message: "a LoadBalancer needs allocateLoadBalancerNodePorts: false"
    # The API server allocates a Service's clusterIP before admission, so
    # an allocated one can't be told from a requested one (Kubernetes 1.32:
    # every Service would be refused). Refused instead: any clusterIP in the
    # service network's static band, the first min(max(16, size/16), 256)
    # addresses, where the core Services' fixed IPs live (the dynamic
    # allocator never picks them while the dynamic band has room).
    - expression: >-
        (!has(object.spec.clusterIP) || object.spec.clusterIP in ['', 'None'] || !isIP(object.spec.clusterIP)
          || !cidr(variables.staticBand).containsIP(object.spec.clusterIP) || object.spec.clusterIP == variables.netAddr)
        && (!has(object.spec.clusterIPs) || object.spec.clusterIPs.all(a, a == 'None' || !isIP(a) || !cidr(variables.staticBand).containsIP(a) || a == variables.netAddr))
      message: "a clusterIP in the service network's static band (the core Services' fixed addresses) is refused"
    - expression: >-
        !has(object.spec.type) || object.spec.type != 'LoadBalancer'
        || object.spec.ports.all(p, !(string(p.port) in params.data.corePorts.split(' ')))
      message: "a LoadBalancer on a core port (80, 443, the VPN port, 8000, 8081, 8443, 8444)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-apps-traefik
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["traefik.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
  # Traefik doesn't watch the apps namespace (it would list every Secret of
  # it): app IngressRoutes / Middlewares live in portcullis-edge.
  validations:
    # The CLI's probe (kube_admission_probe): an object annotated with
    # exactly this binding's params generation is refused, naming it — the
    # proof that this policy's binding of that generation is live.
    - expression: >-
        !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
        || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
      messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
    # The CLI's probes of other params generations pass (Traefik doesn't
    # watch this namespace and the Hub has no Role for traefik.io here).
    - expression: "has(object.metadata.annotations) && 'portcullis.io/params-generation' in object.metadata.annotations"
      messageExpression: "object.kind + ' is refused in the apps namespace: Traefik objects live in portcullis-edge'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-apps-netpol
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["networkpolicies"]
  variables:
    - name: sel
      expression: "has(object.spec.podSelector.matchLabels) ? object.spec.podSelector.matchLabels : {}"
    - name: probe
      expression: "'portcullis.io/probe' in variables.sel"
    - name: inst
      expression: "'portcullis.io/instance' in variables.sel ? variables.sel['portcullis.io/instance'] : ''"
    - name: slot
      expression: "'portcullis.io/vpn-slot' in variables.sel ? variables.sel['portcullis.io/vpn-slot'] : ''"
    - name: ingress
      expression: "has(object.spec.ingress) ? object.spec.ingress : []"
    - name: egress
      expression: "has(object.spec.egress) ? object.spec.egress : []"
    - name: nodes
      expression: "params.data.nodeAddresses.split(' ').filter(a, a != '')"
    - name: apiAddrs
      expression: "params.data.apiAddresses.split(' ').filter(a, a != '')"
    - name: coreNs
      expression: "params.data.traefik.split(':')[0]"
    - name: traefikSel
      expression: "{params.data.traefik.split(':')[1].split('=')[0]: params.data.traefik.split(':')[1].split('=')[1]}"
    - name: mcpSel
      expression: "{params.data.mcpGate.split(':')[1].split('=')[0]: params.data.mcpGate.split(':')[1].split('=')[1]}"
    - name: wgSel
      expression: "{params.data.wg.split(':')[1].split('=')[0]: params.data.wg.split(':')[1].split('=')[1]}"
    - name: dnsNs
      expression: "params.data.kubeDNS.split(':')[0]"
    - name: dnsSel
      expression: "{params.data.kubeDNS.split(':')[1].split('=')[0]: params.data.kubeDNS.split(':')[1].split('=')[1]}"
  validations:
    # The CLI's probe (kube_admission_probe): an object annotated with
    # exactly this binding's params generation is refused, naming it — the
    # proof that this policy's binding of that generation is live.
    - expression: >-
        !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
        || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
      messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
    - expression: >-
        variables.probe
        || (variables.inst != ''
            && (!has(object.spec.podSelector.matchExpressions) || object.spec.podSelector.matchExpressions.all(e, e.key != 'portcullis.io/instance'))
            && variables.sel.exists(k, k.startsWith('portcullis.io/net-') || k in ['portcullis.io/egress', 'portcullis.io/service', 'portcullis.io/vpn-slot']))
      message: "a NetworkPolicy selects one instance's pods (portcullis.io/instance plus a net-, egress, service or vpn-slot key)"
    - expression: "size(variables.nodes) > 0 && size(variables.apiAddrs) > 0"
      message: "the params carry no node or API addresses: every NetworkPolicy is refused (fail closed)"
    # A port range would widen every port check below (53, 80 / 443, the
    # wg edge port): the Hub never writes endPort.
    - expression: >-
        variables.ingress.all(r, !has(r.ports) || r.ports.all(x, !has(x.endPort)))
        && variables.egress.all(r, !has(r.ports) || r.ports.all(x, !has(x.endPort)))
      message: "a NetworkPolicy port range (endPort) is refused"
    - expression: "variables.ingress.all(r, has(r.from) && size(r.from) > 0) && variables.egress.all(r, has(r.to) && size(r.to) > 0)"
      message: "a rule without from / to (all peers) is refused"
    - expression: >-
        variables.ingress.all(r, r.from.all(p, (!has(p.namespaceSelector) || (has(p.namespaceSelector.matchLabels) && size(p.namespaceSelector.matchLabels) > 0) || (has(p.namespaceSelector.matchExpressions) && size(p.namespaceSelector.matchExpressions) > 0))
          && (!has(p.podSelector) || (has(p.podSelector.matchLabels) && size(p.podSelector.matchLabels) > 0) || (has(p.podSelector.matchExpressions) && size(p.podSelector.matchExpressions) > 0)))) && variables.egress.all(r, r.to.all(p, (!has(p.namespaceSelector) || (has(p.namespaceSelector.matchLabels) && size(p.namespaceSelector.matchLabels) > 0) || (has(p.namespaceSelector.matchExpressions) && size(p.namespaceSelector.matchExpressions) > 0))
          && (!has(p.podSelector) || (has(p.podSelector.matchLabels) && size(p.podSelector.matchLabels) > 0) || (has(p.podSelector.matchExpressions) && size(p.podSelector.matchExpressions) > 0))))
      message: "an empty namespaceSelector or podSelector is refused"
    - expression: >-
        !variables.probe
        || (variables.ingress.all(r, r.from.all(p, !has(p.namespaceSelector) && !has(p.ipBlock) && has(p.podSelector) && has(p.podSelector.matchLabels) && 'portcullis.io/probe' in p.podSelector.matchLabels)) && variables.egress.all(r, r.to.all(p, !has(p.namespaceSelector) && !has(p.ipBlock) && has(p.podSelector) && has(p.podSelector.matchLabels) && 'portcullis.io/probe' in p.podSelector.matchLabels)))
      message: "a probe policy's peers are probe pods only"
    - expression: >-
        variables.probe || variables.ingress.all(r, r.from.all(p,
          (!has(p.namespaceSelector) && !has(p.ipBlock) && has(p.podSelector) && has(p.podSelector.matchLabels)
            && 'portcullis.io/instance' in p.podSelector.matchLabels && p.podSelector.matchLabels['portcullis.io/instance'] == variables.inst)
          || (!has(p.ipBlock) && has(p.namespaceSelector) && has(p.namespaceSelector.matchLabels)
            && p.namespaceSelector.matchLabels == {'kubernetes.io/metadata.name': variables.coreNs}
            && has(p.podSelector) && has(p.podSelector.matchLabels)
            && (p.podSelector.matchLabels == variables.traefikSel || p.podSelector.matchLabels == variables.mcpSel))))
      message: "an ingress peer that isn't the same instance, Traefik or mcp-gate"
    - expression: >-
        variables.probe || variables.egress.all(r, r.to.all(p,
          (!has(p.namespaceSelector) && !has(p.ipBlock) && has(p.podSelector) && has(p.podSelector.matchLabels)
            && 'portcullis.io/instance' in p.podSelector.matchLabels && p.podSelector.matchLabels['portcullis.io/instance'] == variables.inst)
          || (!has(p.ipBlock) && has(p.namespaceSelector) && has(p.namespaceSelector.matchLabels)
            && p.namespaceSelector.matchLabels == {'kubernetes.io/metadata.name': variables.dnsNs}
            && has(p.podSelector) && has(p.podSelector.matchLabels) && p.podSelector.matchLabels == variables.dnsSel
            && has(r.ports) && size(r.ports) > 0 && r.ports.all(x, has(x.port) && x.port == 53 && !has(x.endPort)))
          || (!has(p.ipBlock) && has(p.namespaceSelector) && has(p.namespaceSelector.matchLabels)
            && p.namespaceSelector.matchLabels == {'kubernetes.io/metadata.name': variables.coreNs}
            && has(p.podSelector) && has(p.podSelector.matchLabels) && p.podSelector.matchLabels == variables.wgSel
            && variables.slot != '' && has(r.ports) && size(r.ports) == 1 && has(r.ports[0].port) && !has(r.ports[0].endPort) && string(r.ports[0].port) == string(9001 + int(variables.slot)))
          || (has(p.ipBlock) && !has(p.namespaceSelector) && !has(p.podSelector)
            && p.ipBlock.cidr == '0.0.0.0/0' && has(p.ipBlock.except)
            && params.data.podCIDR in p.ipBlock.except && params.data.serviceCIDR in p.ipBlock.except
            && '169.254.0.0/16' in p.ipBlock.except && variables.nodes.all(n, n in p.ipBlock.except)
            && variables.apiAddrs.all(n, n in p.ipBlock.except))
          || (has(p.ipBlock) && !has(p.namespaceSelector) && !has(p.podSelector)
            && p.ipBlock.cidr in variables.nodes && (!has(p.ipBlock.except) || size(p.ipBlock.except) == 0)
            && has(r.ports) && size(r.ports) > 0 && r.ports.all(x, has(x.port) && !has(x.endPort) && (x.port == 80 || x.port == 443)))))
      message: "an egress peer outside the Hub's shapes (same instance, kube-dns :53, the instance's wg edge port, the internet minus the cluster, a node on 80 / 443)"
---
# portcullis-edge-routes: everyone but the CLI's own identity (params
# cliUsername: helm and kubectl run there and write the core objects) may
# write only owner=hub IngressRoutes / Middlewares here, never touch an
# owner=core one, and only in the shapes the Hub renders today:
#   IngressRoute  entryPoints ⊆ web / websecure / vpnsecure (never empty =
#                 every entrypoint), services = Services of the apps namespace
#                 or kind TraefikService with a K15 core service name
#                 (group-gate@file, forward-auth-ext@file, mcp-gate@file:
#                 the companions' MCP routes on their app's host);
#                 middlewares = this namespace's (never a core one:
#                 edgeCoreMiddlewares) or the @file allowlist; tls only the
#                 four tiers, the letsencrypt resolver, no secret / store
#   Middleware    exactly one type of the Hub's template allowlist
#                 (internal/templates middlewareAttrRe) — never forwardAuth,
#                 errors, plugin, basicAuth, digestAuth, passTLSClientCert;
#                 no redis address; no X-Portcullis-* header; a chain only of
#                 this namespace's (never core) or allowlisted @file names
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-edge-routes
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["traefik.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
  variables:
    - name: exempt
      expression: "params.data.cliUsername != '' && request.userInfo.username == params.data.cliUsername"
    - name: del
      expression: "request.operation == 'DELETE'"
    - name: edge
      expression: "params.data.edgeNamespace"
    - name: apps
      expression: "params.data.appsNamespace"
    - name: fileNames
      expression: "params.data.fileMiddlewares.split(' ')"
    - name: coreMiddlewares
      expression: "params.data.edgeCoreMiddlewares.split(' ')"
    - name: coreServices
      expression: "['group-gate@file', 'forward-auth-ext@file', 'mcp-gate@file']"
    - name: tiers
      expression: "['authaware@file', 'public@file', 'protected@file', 'protected-any@file']"
    - name: entryPoints
      expression: "['websecure', 'vpnsecure']"
    - name: reserved
      expression: "params.data.reservedHosts.split(' ')"
    - name: routes
      expression: "!variables.del && object.kind == 'IngressRoute' && has(object.spec.routes) ? object.spec.routes : []"
    - name: types
      expression: "['addPrefix', 'stripPrefix', 'stripPrefixRegex', 'replacePath', 'replacePathRegex', 'redirectRegex', 'redirectScheme', 'headers', 'compress', 'contentType', 'chain', 'rateLimit', 'inFlightReq', 'ipAllowList', 'buffering', 'retry', 'circuitBreaker', 'grpcWeb']"
    - name: owner
      expression: "!variables.del && has(object.metadata.labels) && 'portcullis.io/owner' in object.metadata.labels ? object.metadata.labels['portcullis.io/owner'] : ''"
    - name: oldOwner
      expression: "request.operation != 'CREATE' && has(oldObject.metadata.labels) && 'portcullis.io/owner' in oldObject.metadata.labels ? oldObject.metadata.labels['portcullis.io/owner'] : ''"
    - name: inst
      expression: "!variables.del && has(object.metadata.labels) && 'portcullis.io/instance' in object.metadata.labels ? object.metadata.labels['portcullis.io/instance'] : ''"
    - name: oldInst
      expression: "request.operation != 'CREATE' && has(oldObject.metadata.labels) && 'portcullis.io/instance' in oldObject.metadata.labels ? oldObject.metadata.labels['portcullis.io/instance'] : ''"
    - name: ownName
      expression: "variables.inst + '--'"
  validations:
    # The CLI's probe (kube_admission_probe): an object annotated with
    # exactly this binding's params generation is refused, naming it — the
    # proof that bindings of that generation are live with their params.
    - expression: >-
        variables.del || !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
        || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
      messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
    - expression: "variables.exempt || variables.del || object.kind in ['IngressRoute', 'Middleware']"
      messageExpression: "object.kind + ' is refused in portcullis-edge (only IngressRoute and Middleware)'"
    - expression: >-
        variables.exempt || variables.del || (variables.owner == 'hub'
          && 'portcullis.io/instance' in object.metadata.labels && object.metadata.labels['portcullis.io/instance'] != '')
      message: "an object here needs the labels portcullis.io/owner=hub and portcullis.io/instance"
    - expression: "variables.exempt || request.operation == 'CREATE' || variables.oldOwner == 'hub'"
      message: "only owner=hub objects may be changed or deleted (owner=core objects are the CLI's)"
    - expression: "variables.exempt || request.operation != 'UPDATE' || (variables.inst == variables.oldInst && variables.owner == variables.oldOwner)"
      message: "portcullis.io/owner and portcullis.io/instance can't change on an update"
    - expression: "variables.exempt || request.userInfo.username == params.data.hubServiceAccount"
      message: "only the Hub's ServiceAccount (and the CLI) may write the apps' routes"
    # A VPN-only instance's routes (the Hub labels them portcullis.io/reach:
    # vpn) are on vpnsecure, but its websecure "VPN required" page
    # (vpn-required-path first) and an opted-in public link (public-guard
    # first).
    - expression: >-
        variables.exempt || variables.del || object.kind != 'IngressRoute' || !has(object.metadata.labels)
        || !('portcullis.io/reach' in object.metadata.labels) || object.metadata.labels['portcullis.io/reach'] != 'vpn'
        || object.spec.entryPoints.all(x, x == 'vpnsecure')
        || variables.routes.all(r, has(r.middlewares) && size(r.middlewares) > 0
             && r.middlewares[0].name in ['vpn-required-path@file', 'portcullis-public-guard@file'])
      message: "a route of a VPN-only instance (portcullis.io/reach: vpn) is on vpnsecure only (but its VPN-required page and an opted-in public link)"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'IngressRoute'
        || (has(object.spec.entryPoints) && size(object.spec.entryPoints) > 0
            && object.spec.entryPoints.all(e, e in variables.entryPoints))
      message: "entryPoints must be set and only websecure or vpnsecure"
    # The shape the Hub renders on Docker: Host(`h`) [|| Host(`h`)…], with
    # an optional && Path / PathPrefix [|| …]; nothing else (no HostRegexp,
    # HostSNI, ClientIP, headers, methods, no catch-all).
    - expression: >-
        variables.exempt || variables.routes.all(r, has(r.match)
          && r.match.matches('^\\(?Host\\(`[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+`\\)( \\|\\| Host\\(`[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+`\\))*\\)?( && \\(?(PathPrefix|Path)\\(`[^`()]*`\\)( \\|\\| (PathPrefix|Path)\\(`[^`()]*`\\))*\\)?)?$'))
      message: "a route match other than Host(...) with an optional && Path / PathPrefix"
    # Hosts: lowercase labels of [a-z0-9-] (no leading / trailing hyphen),
    # no empty label, no trailing dot (the shape above). Defence in depth:
    # every Host(`…`) at all, normalised (lowerAscii, empty labels dropped:
    # a trailing / double dot), is refused when it is a reserved host or a
    # subdomain of one (the apex, which the other reserved hosts sit under,
    # only exactly).
    - expression: >-
        variables.exempt || variables.routes.all(r, !has(r.match)
          || r.match.findAll('Host\\(`[^`]*`\\)').all(h,
               !variables.reserved.exists(x, x != '' && (
                    h.substring(6, size(h) - 2).lowerAscii().split('.').filter(l, l != '').join('.') == x
                    || (h.substring(6, size(h) - 2).lowerAscii().split('.').filter(l, l != '').join('.').endsWith('.' + x)
                        && !variables.reserved.exists(o, o.endsWith('.' + x)))))))
      message: "a route on a reserved core hostname (or a subdomain of one)"
    - expression: "variables.exempt || variables.routes.all(r, !has(r.priority) || r.priority <= int(params.data.maxAppPriority))"
      message: "a route priority above maxAppPriority"
    - expression: "variables.exempt || variables.del || object.kind != 'IngressRoute' || has(object.spec.tls)"
      message: "a route without TLS"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'IngressRoute'
        || object.spec.routes.all(r, r.services.all(s,
             (has(s.kind) && s.kind == 'TraefikService')
               ? (s.name in variables.coreServices && !has(s.namespace))
               : ((!has(s.kind) || s.kind == 'Service') && !s.name.contains('@')
                  && has(s.namespace) && s.namespace == variables.apps)))
      message: "a service must be a Service of the apps namespace (namespace set) or a K15 core service (group-gate@file, forward-auth-ext@file, mcp-gate@file)"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'IngressRoute'
        || object.spec.routes.all(r, !has(r.middlewares) || r.middlewares.all(m,
             m.name.contains('@')
               ? (m.name in variables.fileNames && !has(m.namespace))
               : ((!has(m.namespace) || m.namespace == variables.edge) && !(m.name in variables.coreMiddlewares) && m.name.startsWith(variables.ownName))))
      message: "a middleware must be this instance's own (<instance>--…, never a core one) or on the @file allowlist"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'IngressRoute' || !has(object.spec.tls)
        || ((!has(object.spec.tls.options) || (object.spec.tls.options.name in variables.tiers && !has(object.spec.tls.options.namespace)))
            && !has(object.spec.tls.secretName) && !has(object.spec.tls.store)
            && (!has(object.spec.tls.certResolver) || object.spec.tls.certResolver == 'letsencrypt'))
      message: "tls.options outside the four tiers, another resolver, or a TLS secret / store reference"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'Middleware'
        || (size(object.spec) == 1 && object.spec.all(k, k in variables.types))
      message: "a Middleware must have exactly one type of the Hub's allowlist (never forwardAuth, errors, plugin, basicAuth, digestAuth, passTLSClientCert)"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'Middleware'
        || ((!has(object.spec.rateLimit) || !has(object.spec.rateLimit.redis))
            && (!has(object.spec.inFlightReq) || !has(object.spec.inFlightReq.redis)))
      message: "a rateLimit / inFlightReq with a redis address is refused"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'Middleware' || !has(object.spec.headers)
        || ((!has(object.spec.headers.customRequestHeaders) || object.spec.headers.customRequestHeaders.all(h, !h.lowerAscii().replace('_', '-').startsWith('x-portcullis-')))
            && (!has(object.spec.headers.customResponseHeaders) || object.spec.headers.customResponseHeaders.all(h, !h.lowerAscii().replace('_', '-').startsWith('x-portcullis-'))))
      message: "a Middleware may not set an X-Portcullis-* header"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'Middleware' || !has(object.spec.chain)
        || object.spec.chain.middlewares.all(m,
             m.name.contains('@')
               ? (m.name in variables.fileNames && !has(m.namespace))
               : ((!has(m.namespace) || m.namespace == variables.edge) && !(m.name in variables.coreMiddlewares) && m.name.startsWith(variables.ownName)))
      message: "a chain may name only this instance's own middlewares (never a core one) or the @file allowlist"
