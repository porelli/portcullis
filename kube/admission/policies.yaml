# The admission guard behind the Hub's Roles (contract §6 "The admission
# policies", K6): five ValidatingAdmissionPolicies on the apps namespace,
# each bound by its own portcullis-apps-guard-<policy>, and
# portcullis-edge-routes on portcullis-edge (Traefik's only watched
# namespace: the core and the apps' IngressRoutes / Middlewares) bound by
# portcullis-edge-guard-routes. The CLI applies every binding per params
# generation (<name>-<generation> on portcullis-admission-params-<generation>
# in the core namespace, create-before-delete; scripts/lib/kube.sh
# kube_admission_params_apply). Core is this file's only editor (tested on
# k3s 1.33 and 1.37: .github/ci/e2e-k3s-*.sh); the Hub keeps a byte copy in
# internal/runtime/kube/testdata/admission/ (envtest vectors), compared in
# core CI (K13).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-apps-pods
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  # The CLI's own identity (params cliUsername: helm and kubectl run as it;
  # chart objects also carry portcullis.io/owner=core) is exempt from every
  # check below but the generation probe.
  - name: cli
    expression: "params.data.cliUsername != '' && request.userInfo.username == params.data.cliUsername"
  - name: spec
    expression: object.spec
  - name: meta
    expression: object.metadata
  - name: labels
    expression: 'has(variables.meta.labels) ? variables.meta.labels : {}'
  - name: annotations
    expression: 'has(variables.meta.annotations) ? variables.meta.annotations : {}'
  - name: inst
    expression: >-
      'portcullis.io/instance' in variables.labels ? variables.labels['portcullis.io/instance'] : ''
  - name: helper
    expression: '''portcullis.io/helper'' in variables.labels ? variables.labels[''portcullis.io/helper''] : '''''
  - name: probe
    expression: '''portcullis.io/probe'' in variables.labels'
  - name: containers
    expression: >-
      variables.spec.containers + (has(variables.spec.initContainers) ? variables.spec.initContainers : []) + (has(variables.spec.ephemeralContainers)
      ? variables.spec.ephemeralContainers : [])
  - name: volumes
    expression: 'has(variables.spec.volumes) ? variables.spec.volumes : []'
  - name: baselineCaps
    expression: >-
      ['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD', 'NET_BIND_SERVICE', 'SETFCAP',
      'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']
  - name: safeSysctls
    expression: >-
      ['kernel.shm_rmid_forced', 'net.ipv4.ip_local_port_range', 'net.ipv4.ip_unprivileged_port_start', 'net.ipv4.tcp_syncookies',
      'net.ipv4.ping_group_range', 'net.ipv4.ip_local_reserved_ports', 'net.ipv4.tcp_keepalive_time', 'net.ipv4.tcp_fin_timeout',
      'net.ipv4.tcp_keepalive_intvl', 'net.ipv4.tcp_keepalive_probes']
  - name: prefix
    expression: variables.inst + '--'
  # The root shape (ruling), shared by one-shot pods and root init
  # containers: the pod has no ServiceAccount token and no group 0 ...
  - name: rootPod
    expression: |-
      has(variables.spec.automountServiceAccountToken) && variables.spec.automountServiceAccountToken == false
      && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.fsGroup)
           && variables.spec.securityContext.fsGroup == 0)
      && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.supplementalGroups)
           && 0 in variables.spec.securityContext.supplementalGroups)
  # ... and these are its containers of the root shape (by name): no
  # escalation, ALL dropped and at most CHOWN / DAC_OVERRIDE / FOWNER back,
  # no ports, a group other than 0, no hostPath mount.
  - name: rootShaped
    expression: |-
      variables.containers.filter(c, has(c.securityContext)
        && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false
        && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop)
        && 'ALL' in c.securityContext.capabilities.drop
        && (!has(c.securityContext.capabilities.add)
            || c.securityContext.capabilities.add.all(x, x in ['CHOWN', 'DAC_OVERRIDE', 'FOWNER']))
        && (!has(c.ports) || size(c.ports) == 0)
        && (has(c.securityContext.runAsGroup) ? c.securityContext.runAsGroup != 0
            : (has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsGroup)
               && variables.spec.securityContext.runAsGroup != 0))
        && (!has(c.volumeMounts)
            || c.volumeMounts.all(m, !variables.volumes.exists(v, v.name == m.name && has(v.hostPath))))
      ).map(c, c.name)
  # Root one-shot helpers (ruling): a Job's pod labelled portcullis.io/one-shot:
  # true, every container of the root shape, no ServiceAccount token.
  - name: oneShot
    expression: |-
      'portcullis.io/one-shot' in variables.labels && variables.labels['portcullis.io/one-shot'] == 'true'
      && has(variables.meta.ownerReferences)
      && variables.meta.ownerReferences.exists(o, o.kind == 'Job' && has(o.controller) && o.controller)
      && request.userInfo.username in ['system:serviceaccount:kube-system:job-controller', 'system:kube-controller-manager']
      && variables.rootPod
      && variables.volumes.all(v, has(v.emptyDir)
           || (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName.startsWith(variables.prefix))
           || (has(v.configMap) && v.configMap.name.startsWith(variables.prefix))
           || (has(v.secret) && v.secret.secretName.startsWith(variables.prefix)))
      && variables.containers.all(c, c.name in variables.rootShaped)
  - name: initNames
    expression: 'has(variables.spec.initContainers) ? variables.spec.initContainers.map(c, c.name) : []'
  - name: svcStaticBand
    expression: >-
      string(cidr(params.data.serviceCIDR).ip()) + '/' + string(32 - ((32 - cidr(params.data.serviceCIDR).prefixLength()) - 4 < 4 ? 4
      : ((32 - cidr(params.data.serviceCIDR).prefixLength()) - 4 > 8 ? 8 : (32 - cidr(params.data.serviceCIDR).prefixLength()) - 4)))
  # HA placement (contract §6 "placement"): the pod's required node
  # affinity terms (none = []).
  - name: requiredTerms
    expression: >-
      has(variables.spec.affinity) && has(variables.spec.affinity.nodeAffinity)
      && has(variables.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution)
      && has(variables.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms)
      ? variables.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms : []
  validations:
  - expression: >-
      !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
      || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
    messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
  - expression: |-
      variables.cli || (
        variables.inst != ''
      )
    message: a pod needs the portcullis.io/instance label
  - expression: |-
      variables.cli || (
        variables.inst != 'portcullis-probe' || variables.probe
      )
    message: 'portcullis.io/instance: portcullis-probe is reserved for the Hub''s probe pods'
  - expression: |-
      variables.cli || (
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged
        == false)
      )
    message: privileged containers are refused
  - expression: |-
      variables.cli || (
        !(has(variables.spec.hostNetwork) && variables.spec.hostNetwork) && !(has(variables.spec.hostPID) && variables.spec.hostPID)
        && !(has(variables.spec.hostIPC) && variables.spec.hostIPC)
      )
    messageExpression: '''host namespaces are refused ('' + object.metadata.name + '')'''
  - expression: |-
      variables.cli || (
        variables.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))
      )
    message: hostPort is refused
  - expression: |-
      variables.cli || (
        !(has(variables.spec.securityContext) && has(variables.spec.securityContext.windowsOptions) && has(variables.spec.securityContext.windowsOptions.hostProcess)
        && variables.spec.securityContext.windowsOptions.hostProcess) && variables.containers.all(c, !(has(c.securityContext)
        && has(c.securityContext.windowsOptions) && has(c.securityContext.windowsOptions.hostProcess) && c.securityContext.windowsOptions.hostProcess))
      )
    message: hostProcess is refused
  - expression: |-
      variables.cli || (
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add)
          || c.securityContext.capabilities.add.all(cap,
               variables.helper == 'volume' ? cap in ['CHOWN', 'DAC_OVERRIDE', 'FOWNER']
               : (cap in variables.baselineCaps || (variables.helper == 'fixer' && cap == 'DAC_READ_SEARCH'))))
      )
    message: >-
      a capability outside the Kubernetes baseline (helpers: fixer DAC_READ_SEARCH, volume CHOWN / DAC_OVERRIDE
      / FOWNER only)
  - expression: |-
      variables.cli || (
        !(has(variables.spec.securityContext) && has(variables.spec.securityContext.seccompProfile) && variables.spec.securityContext.seccompProfile.type
        == 'Unconfined') && variables.containers.all(c, !(has(c.securityContext) && has(c.securityContext.seccompProfile)
        && c.securityContext.seccompProfile.type == 'Unconfined'))
      )
    message: an Unconfined seccomp profile is refused
  - expression: |-
      variables.cli || (
        !(has(variables.spec.securityContext) && has(variables.spec.securityContext.appArmorProfile) && variables.spec.securityContext.appArmorProfile.type
        == 'Unconfined') && variables.containers.all(c, !(has(c.securityContext) && has(c.securityContext.appArmorProfile)
        && c.securityContext.appArmorProfile.type == 'Unconfined')) && variables.annotations.all(k, !k.startsWith('container.apparmor.security.beta.kubernetes.io/')
        || variables.annotations[k] != 'unconfined')
      )
    message: an Unconfined AppArmor profile is refused
  - expression: |-
      variables.cli || (
        ([variables.spec].filter(s, has(s.securityContext) && has(s.securityContext.seLinuxOptions)).map(s, s.securityContext.seLinuxOptions)
          + variables.containers.filter(c, has(c.securityContext) && has(c.securityContext.seLinuxOptions)).map(c,
        c.securityContext.seLinuxOptions))
        .all(o, !has(o.user) && !has(o.role) && (!has(o.type) || o.type in ['container_t', 'container_init_t', 'container_kvm_t',
        'container_engine_t']))
      )
    message: seLinuxOptions with a user, a role or another type are refused
  - expression: |-
      variables.cli || (
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.procMount) || c.securityContext.procMount
        == 'Default')
      )
    message: procMount must be Default
  - expression: |-
      variables.cli || (
        !has(variables.spec.securityContext) || !has(variables.spec.securityContext.sysctls) || variables.spec.securityContext.sysctls.all(s,
        s.name in variables.safeSysctls)
      )
    message: a sysctl outside the baseline's safe set
  - expression: |-
      variables.cli || (
        variables.volumes.all(v, has(v.emptyDir)
          || (has(v.configMap) && (v.configMap.name.startsWith(variables.prefix)))
          || (has(v.secret) && (v.secret.secretName.startsWith(variables.prefix)))
          || (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName.startsWith(variables.prefix))
          || (has(v.hostPath) && !v.hostPath.path.contains('/..') && !v.hostPath.path.contains('/./')
              && params.data.bindRoots.split(' ').exists(r, r != '' && (v.hostPath.path == r || v.hostPath.path.startsWith(r + '/'))))
          || (has(v.projected) && has(v.projected.sources) && v.projected.sources.all(src, has(src.downwardAPI)
              || (has(src.secret) && (src.secret.name.startsWith(variables.prefix))) || (has(src.configMap) && (src.configMap.name.startsWith(variables.prefix))))))
      )
    message: >-
      a volume outside the allowlist (emptyDir; the instance's own ConfigMap, Secret or PVC; hostPath under the shared-folder roots; projected secret, configMap or downwardAPI)
  - expression: |-
      variables.cli || (
        (!has(variables.spec.serviceAccountName) || variables.spec.serviceAccountName == 'default') && has(variables.spec.automountServiceAccountToken)
        && variables.spec.automountServiceAccountToken == false
      )
    message: >-
      pods run as the namespace's default ServiceAccount with automountServiceAccountToken: false
  - expression: |-
      variables.cli || (
        variables.containers.all(c, (!has(c.envFrom) || c.envFrom.all(e, (!has(e.secretRef) || (e.secretRef.name.startsWith(variables.prefix)))
            && (!has(e.configMapRef) || (e.configMapRef.name.startsWith(variables.prefix)))))
          && (!has(c.env) || c.env.all(e, !has(e.valueFrom) || ((!has(e.valueFrom.secretKeyRef) || (e.valueFrom.secretKeyRef.name.startsWith(variables.prefix)))
            && (!has(e.valueFrom.configMapKeyRef) || (e.valueFrom.configMapKeyRef.name.startsWith(variables.prefix)))))))
      )
    messageExpression: >-
      "a Secret, ConfigMap or PVC that isn't this instance's (" + variables.prefix + "*, its template files " + variables.prefix + "tpl-* included)"
  - expression: |-
      variables.cli || (
        variables.annotations.all(k, !k.startsWith('cni.projectcalico.org/') && !k.startsWith('k8s.v1.cni.cncf.io/')
        && !k.startsWith('v1.multus-cni.io/') && !k.startsWith('kube-router.io/') && !k.startsWith('io.cilium/'))
      )
    message: CNI annotations are refused
  - expression: |-
      variables.cli || (
        !('portcullis.io/vpn-slot' in variables.labels) || variables.labels['portcullis.io/vpn-slot'].matches('^([0-9]|[1-3][0-9]|4[0-6])$')
      )
    message: portcullis.io/vpn-slot must be an integer 0-46
  - expression: |-
      variables.cli || (
        variables.helper == '' || ((variables.helper == 'fixer' || variables.helper == 'volume')
            && variables.containers.all(c, c.image == params.data.hubImage)
            && variables.labels.all(k, !k.startsWith('portcullis.io/net-') && k != 'portcullis.io/egress' && k !=
        'portcullis.io/vpn-slot')
            && request.userInfo.username == params.data.hubServiceAccount)
      )
    message: >-
      a helper pod: portcullis.io/helper fixer or volume, the Hub's own image, no network label, created by the
      Hub
  - expression: |-
      variables.cli || (
        (variables.helper != '' || ((!(has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsUser)
          && variables.spec.securityContext.runAsUser == 0) || variables.oneShot)
          && variables.containers.all(c, !(has(c.securityContext) && has(c.securityContext.runAsUser) && c.securityContext.runAsUser == 0)
            || variables.oneShot
            || (c.name in variables.initNames && variables.rootPod && c.name in variables.rootShaped))))
      )
    message: >-
      only the Hub's helper pods, a Job's one-shot pods (portcullis.io/one-shot) and init containers of the root shape
      (drop ALL, add only CHOWN / DAC_OVERRIDE / FOWNER, no privilege escalation, no ports, no ServiceAccount token, a group
      other than 0, no fsGroup / supplemental group 0, no hostPath mount; a one-shot pod's volumes only emptyDir or
      the instance's own PVC / ConfigMap / Secret) may run as root
  # A pod with a hostPath volume (the Hub's helpers aside): every container,
  # init and ephemeral included, provably non-root (runAsNonRoot, or an
  # effective runAsUser > 0) and without privilege escalation (no uid given =
  # the image's USER, maybe root; a setuid binary would escalate).
  - expression: |-
      variables.cli || (
        variables.helper != '' || !variables.volumes.exists(v, has(v.hostPath))
        || variables.containers.all(c,
             (((has(c.securityContext) && has(c.securityContext.runAsNonRoot))
                 ? c.securityContext.runAsNonRoot
                 : (has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsNonRoot) && variables.spec.securityContext.runAsNonRoot))
              || ((has(c.securityContext) && has(c.securityContext.runAsUser))
                 ? c.securityContext.runAsUser > 0
                 : (has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsUser) && variables.spec.securityContext.runAsUser > 0)))
             && has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation)
             && c.securityContext.allowPrivilegeEscalation == false)
      )
    message: >-
      a pod with a hostPath volume: every container (init and ephemeral included) needs runAsNonRoot or a runAsUser
      above 0, and allowPrivilegeEscalation false
  # ... and never group 0 (files it creates in host folders would be root's
  # group): supplementalGroupsPolicy Strict (the kubelet adds no group from
  # the image's /etc/group, which could hold 0; Kubernetes >= 1.33), every
  # container's effective runAsGroup explicit and above 0, no pod
  # runAsGroup, fsGroup or supplemental group 0.
  - expression: |-
      variables.cli || (
        variables.helper != '' || !variables.volumes.exists(v, has(v.hostPath))
        || (has(variables.spec.securityContext) && has(variables.spec.securityContext.supplementalGroupsPolicy) && variables.spec.securityContext.supplementalGroupsPolicy == 'Strict'
            && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsGroup) && variables.spec.securityContext.runAsGroup == 0)
            && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.fsGroup) && variables.spec.securityContext.fsGroup == 0)
            && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.supplementalGroups) && 0 in variables.spec.securityContext.supplementalGroups)
            && variables.containers.all(c,
                 (has(c.securityContext) && has(c.securityContext.runAsGroup))
                   ? c.securityContext.runAsGroup > 0
                   : (has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsGroup) && variables.spec.securityContext.runAsGroup > 0)))
      )
    message: >-
      a pod with a hostPath volume needs supplementalGroupsPolicy Strict, every container (init and ephemeral included)
      an explicit runAsGroup above 0, and no runAsGroup, fsGroup or supplemental group 0
  # Compose names (ruling): the Hub's hostname / subdomain / search domain only.
  - expression: |-
      variables.cli || (
        ((!has(variables.spec.hostname) || ('portcullis.io/service' in variables.labels && variables.spec.hostname == variables.labels['portcullis.io/service']))
          && (!has(variables.spec.subdomain) || variables.spec.subdomain == variables.inst + '--pods')
          && (!has(variables.spec.dnsPolicy) || variables.spec.dnsPolicy != 'None')
          && (!has(variables.spec.dnsConfig) || ((!has(variables.spec.dnsConfig.nameservers) || size(variables.spec.dnsConfig.nameservers) == 0)
            && (!has(variables.spec.dnsConfig.searches) || variables.spec.dnsConfig.searches.all(s, s == variables.inst + '--pods.' + params.data.appsNamespace + '.svc.cluster.local')))))
      )
    message: >-
      hostname / subdomain / dnsConfig: only the pod's own portcullis.io/service, the subdomain <instance>--pods, the
      search domain <instance>--pods.<apps namespace>.svc.cluster.local, no nameservers, no dnsPolicy None
  # Compose network aliases (ruling): /etc/hosts entries for the Hub's
  # <instance>--<alias> ClusterIP Services only.
  - expression: |-
      variables.cli || (
        (!has(variables.spec.hostAliases) || (size(variables.spec.hostAliases) <= 16 && variables.spec.hostAliases.all(h,
          has(h.ip) && isIP(h.ip) && ip(h.ip).family() == 4 && cidr(params.data.serviceCIDR).containsIP(h.ip)
          && h.ip != string(cidr(params.data.serviceCIDR).ip()) && !cidr(variables.svcStaticBand).containsIP(h.ip)
          && has(h.hostnames) && size(h.hostnames) > 0 && size(h.hostnames) <= 16
          && h.hostnames.all(n, n.matches('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')))))
      )
    message: >-
      hostAliases: at most 16 entries, each an address of the service network outside its static band
      (the core Services' fixed addresses) and 1-16 hostnames that are single DNS labels
  - expression: |-
      variables.cli || (
        !variables.probe || (variables.inst == 'portcullis-probe'
            && variables.volumes.size() == 0
            && variables.containers.all(c, c.image == params.data.hubImage
                && has(c.command) && size(c.command) >= 3 && c.command[0] == 'hub' && c.command[1] == 'helper' &&
        c.command[2] in ['listen', 'idle', 'dial']
                && (!has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add)
        || size(c.securityContext.capabilities.add) == 0)
                && has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot
        == true)
            && variables.labels.all(k, !k.startsWith('portcullis.io/') || k in ['portcullis.io/instance', 'portcullis.io/probe']))
      )
    message: >-
      a probe pod: the Hub's image running hub helper listen|idle|dial, instance portcullis-probe, no volume, no
      capability, non-root, no other portcullis.io/ label
  # HA placement (contract §6 "placement"; vectors tagged ha). Priority:
  # only the four app classes (portcullis-core is core's; an unset class
  # is admitted: no class is a global default, priority 0, and the Hub's
  # translator always names one).
  - expression: |-
      variables.cli || (
        !has(variables.spec.priorityClassName) || variables.spec.priorityClassName in ['portcullis-critical', 'portcullis-high', 'portcullis-normal', 'portcullis-low']
      )
    message: app pods may use only portcullis-critical|high|normal|low
  # The small taint's toleration (or a keyless Exists toleration, which
  # tolerates every taint) only with a required node affinity that has a
  # term on portcullis.io/class In [small] and a class expression (In or
  # NotIn [small]) in every term: a VAP can't read Node objects (R2).
  - expression: |-
      variables.cli || (
        !has(variables.spec.tolerations) || (size(variables.spec.tolerations) <= 32
          && !variables.spec.tolerations.exists(t, !has(t.key) || t.key == '' || t.key == 'portcullis.io/small'))
        || (size(variables.requiredTerms) > 0 && size(variables.requiredTerms) <= 32
          && variables.requiredTerms.exists(t, has(t.matchExpressions) && size(t.matchExpressions) <= 32 && t.matchExpressions.exists(e,
               e.key == 'portcullis.io/class' && e.operator == 'In' && has(e.values) && e.values == ['small']))
          && variables.requiredTerms.all(t, has(t.matchExpressions) && size(t.matchExpressions) <= 32 && t.matchExpressions.exists(e,
               e.key == 'portcullis.io/class' && e.operator in ['In', 'NotIn'] && has(e.values) && e.values == ['small'])))
      )
    message: the portcullis.io/small toleration needs a required node affinity on portcullis.io/class In [small]
  # nodeName bypasses the scheduler, taints and affinity. (A scheduled
  # pod has one: only a create is judged; the binding subresource sets it.)
  - expression: |-
      variables.cli || (
        request.operation != 'CREATE' || !has(variables.spec.nodeName) || variables.spec.nodeName == ''
      )
    message: nodeName is refused
  # Placement keys are node label keys of portcullis.io/* and
  # kubernetes.io/hostname only (matchFields too); the labelSelector keys
  # of pod affinity and spread are pod labels and aren't judged.
  - expression: |-
      variables.cli || (
        (!has(variables.spec.nodeSelector) || (size(variables.spec.nodeSelector) <= 32 && variables.spec.nodeSelector.all(k, k.startsWith('portcullis.io/') || k == 'kubernetes.io/hostname')))
        && (!has(variables.spec.topologySpreadConstraints) || (size(variables.spec.topologySpreadConstraints) <= 32
            && variables.spec.topologySpreadConstraints.all(c, c.topologyKey.startsWith('portcullis.io/') || c.topologyKey == 'kubernetes.io/hostname')))
        && (!has(variables.spec.affinity) || (
          (!has(variables.spec.affinity.nodeAffinity) || (
            (size(variables.requiredTerms) <= 32 && variables.requiredTerms.all(t,
               (!has(t.matchExpressions) || (size(t.matchExpressions) <= 32 && t.matchExpressions.all(e, e.key.startsWith('portcullis.io/') || e.key == 'kubernetes.io/hostname')))
               && (!has(t.matchFields) || (size(t.matchFields) <= 32 && t.matchFields.all(e, e.key.startsWith('portcullis.io/') || e.key == 'kubernetes.io/hostname')))))
            && (!has(variables.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution)
                || (size(variables.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution) <= 32
                    && variables.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution.all(w,
                 (!has(w.preference.matchExpressions) || (size(w.preference.matchExpressions) <= 32 && w.preference.matchExpressions.all(e, e.key.startsWith('portcullis.io/') || e.key == 'kubernetes.io/hostname')))
                 && (!has(w.preference.matchFields) || (size(w.preference.matchFields) <= 32 && w.preference.matchFields.all(e, e.key.startsWith('portcullis.io/') || e.key == 'kubernetes.io/hostname'))))))))
          && (!has(variables.spec.affinity.podAffinity) || (
            (!has(variables.spec.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution) || (size(variables.spec.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution) <= 32
                && variables.spec.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution.all(t, t.topologyKey.startsWith('portcullis.io/') || t.topologyKey == 'kubernetes.io/hostname')))
            && (!has(variables.spec.affinity.podAffinity.preferredDuringSchedulingIgnoredDuringExecution) || (size(variables.spec.affinity.podAffinity.preferredDuringSchedulingIgnoredDuringExecution) <= 32
                && variables.spec.affinity.podAffinity.preferredDuringSchedulingIgnoredDuringExecution.all(w, w.podAffinityTerm.topologyKey.startsWith('portcullis.io/') || w.podAffinityTerm.topologyKey == 'kubernetes.io/hostname')))))
          && (!has(variables.spec.affinity.podAntiAffinity) || (
            (!has(variables.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution) || (size(variables.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution) <= 32
                && variables.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.all(t, t.topologyKey.startsWith('portcullis.io/') || t.topologyKey == 'kubernetes.io/hostname')))
            && (!has(variables.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution) || (size(variables.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution) <= 32
                && variables.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution.all(w, w.podAffinityTerm.topologyKey.startsWith('portcullis.io/') || w.podAffinityTerm.topologyKey == 'kubernetes.io/hostname')))))))
      )
    message: topologySpreadConstraints and affinity may use only portcullis.io/* and kubernetes.io/hostname keys
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-apps-workloads
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - jobs
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - secrets
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - persistentvolumeclaims
  variables:
  # The CLI's own identity (params cliUsername: helm and kubectl run as it;
  # chart objects also carry portcullis.io/owner=core) is exempt from every
  # check below but the generation probe.
  - name: cli
    expression: "params.data.cliUsername != '' && request.userInfo.username == params.data.cliUsername"
  # DELETE has no object: the object checks skip it (the old-object rule judges it).
  - name: skipObj
    expression: "variables.cli || request.operation == 'DELETE'"
  # Two exact controller changes to a claim (nothing else is exempt): the
  # volume binder setting spec.volumeName once, from empty; the PVC
  # protection controller removing only its kubernetes.io/pvc-protection
  # finalizer (spec, labels and annotations unchanged).
  - name: pvBind
    expression: >-
      request.operation == 'UPDATE' && request.kind.kind == 'PersistentVolumeClaim'
      && request.userInfo.username in ['system:serviceaccount:kube-system:persistent-volume-binder', 'system:kube-controller-manager']
      && !has(oldObject.spec.volumeName) && has(object.spec.volumeName) && object.spec.volumeName != ''
  - name: pvcUnprotect
    expression: >-
      request.operation == 'UPDATE' && request.kind.kind == 'PersistentVolumeClaim'
      && request.userInfo.username in ['system:serviceaccount:kube-system:pvc-protection-controller', 'system:kube-controller-manager']
      && has(oldObject.metadata.finalizers) && 'kubernetes.io/pvc-protection' in oldObject.metadata.finalizers
      && (has(object.metadata.finalizers) ? object.metadata.finalizers : []) == oldObject.metadata.finalizers.filter(f, f != 'kubernetes.io/pvc-protection')
      && object.spec == oldObject.spec
      && (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {})
      && (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {})
  - name: spec
    expression: object.spec.template.spec
  - name: meta
    expression: object.spec.template.metadata
  - name: labels
    expression: 'has(variables.meta.labels) ? variables.meta.labels : {}'
  - name: annotations
    expression: 'has(variables.meta.annotations) ? variables.meta.annotations : {}'
  - name: inst
    expression: >-
      'portcullis.io/instance' in variables.labels ? variables.labels['portcullis.io/instance'] : ''
  - name: helper
    expression: '''portcullis.io/helper'' in variables.labels ? variables.labels[''portcullis.io/helper''] : '''''
  - name: probe
    expression: '''portcullis.io/probe'' in variables.labels'
  - name: containers
    expression: >-
      variables.spec.containers + (has(variables.spec.initContainers) ? variables.spec.initContainers : []) + (has(variables.spec.ephemeralContainers)
      ? variables.spec.ephemeralContainers : [])
  - name: volumes
    expression: 'has(variables.spec.volumes) ? variables.spec.volumes : []'
  - name: baselineCaps
    expression: >-
      ['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD', 'NET_BIND_SERVICE', 'SETFCAP',
      'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']
  - name: safeSysctls
    expression: >-
      ['kernel.shm_rmid_forced', 'net.ipv4.ip_local_port_range', 'net.ipv4.ip_unprivileged_port_start', 'net.ipv4.tcp_syncookies',
      'net.ipv4.ping_group_range', 'net.ipv4.ip_local_reserved_ports', 'net.ipv4.tcp_keepalive_time', 'net.ipv4.tcp_fin_timeout',
      'net.ipv4.tcp_keepalive_intvl', 'net.ipv4.tcp_keepalive_probes']
  - name: prefix
    expression: variables.inst + '--'
  # The root shape (ruling), shared by one-shot pods and root init
  # containers: the pod has no ServiceAccount token and no group 0 ...
  - name: rootPod
    expression: |-
      has(variables.spec.automountServiceAccountToken) && variables.spec.automountServiceAccountToken == false
      && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.fsGroup)
           && variables.spec.securityContext.fsGroup == 0)
      && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.supplementalGroups)
           && 0 in variables.spec.securityContext.supplementalGroups)
  # ... and these are its containers of the root shape (by name): no
  # escalation, ALL dropped and at most CHOWN / DAC_OVERRIDE / FOWNER back,
  # no ports, a group other than 0, no hostPath mount.
  - name: rootShaped
    expression: |-
      variables.containers.filter(c, has(c.securityContext)
        && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false
        && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop)
        && 'ALL' in c.securityContext.capabilities.drop
        && (!has(c.securityContext.capabilities.add)
            || c.securityContext.capabilities.add.all(x, x in ['CHOWN', 'DAC_OVERRIDE', 'FOWNER']))
        && (!has(c.ports) || size(c.ports) == 0)
        && (has(c.securityContext.runAsGroup) ? c.securityContext.runAsGroup != 0
            : (has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsGroup)
               && variables.spec.securityContext.runAsGroup != 0))
        && (!has(c.volumeMounts)
            || c.volumeMounts.all(m, !variables.volumes.exists(v, v.name == m.name && has(v.hostPath))))
      ).map(c, c.name)
  # Root one-shot helpers (ruling): a Job's pod labelled portcullis.io/one-shot:
  # true, every container of the root shape, no ServiceAccount token.
  - name: oneShot
    expression: |-
      'portcullis.io/one-shot' in variables.labels && variables.labels['portcullis.io/one-shot'] == 'true'
      && object.kind == 'Job'
      && variables.rootPod
      && variables.volumes.all(v, has(v.emptyDir)
           || (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName.startsWith(variables.prefix))
           || (has(v.configMap) && v.configMap.name.startsWith(variables.prefix))
           || (has(v.secret) && v.secret.secretName.startsWith(variables.prefix)))
      && variables.containers.all(c, c.name in variables.rootShaped)
  - name: initNames
    expression: 'has(variables.spec.initContainers) ? variables.spec.initContainers.map(c, c.name) : []'
  - name: svcStaticBand
    expression: >-
      string(cidr(params.data.serviceCIDR).ip()) + '/' + string(32 - ((32 - cidr(params.data.serviceCIDR).prefixLength()) - 4 < 4 ? 4
      : ((32 - cidr(params.data.serviceCIDR).prefixLength()) - 4 > 8 ? 8 : (32 - cidr(params.data.serviceCIDR).prefixLength()) - 4)))
  # HA placement (contract §6 "placement"): the pod's required node
  # affinity terms (none = []).
  - name: requiredTerms
    expression: >-
      has(variables.spec.affinity) && has(variables.spec.affinity.nodeAffinity)
      && has(variables.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution)
      && has(variables.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms)
      ? variables.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms : []
  validations:
  - expression: >-
      request.operation == 'DELETE' || !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
      || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
    messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
  - expression: |-
      variables.skipObj || (
        object.kind != 'Secret' || !has(object.type) || object.type != 'kubernetes.io/service-account-token'
      )
    message: a ServiceAccount token Secret is refused
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || !has(object.spec.replicas) || object.spec.replicas <= 1
      )
    message: replicas above 1 are refused
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (variables.inst != '')
      )
    message: a pod needs the portcullis.io/instance label
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (variables.inst != 'portcullis-probe' || variables.probe)
      )
    message: 'portcullis.io/instance: portcullis-probe is reserved for the Hub''s probe pods'
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged)
        || c.securityContext.privileged == false))
      )
    message: privileged containers are refused
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (!(has(variables.spec.hostNetwork) && variables.spec.hostNetwork) && !(has(variables.spec.hostPID)
        && variables.spec.hostPID) && !(has(variables.spec.hostIPC) && variables.spec.hostIPC))
      )
    messageExpression: '''host namespaces are refused ('' + object.metadata.name + '')'''
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (variables.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) ||
        p.hostPort == 0)))
      )
    message: hostPort is refused
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (!(has(variables.spec.securityContext) && has(variables.spec.securityContext.windowsOptions)
        && has(variables.spec.securityContext.windowsOptions.hostProcess) && variables.spec.securityContext.windowsOptions.hostProcess)
        && variables.containers.all(c, !(has(c.securityContext) && has(c.securityContext.windowsOptions) && has(c.securityContext.windowsOptions.hostProcess)
        && c.securityContext.windowsOptions.hostProcess)))
      )
    message: hostProcess is refused
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities)
        || !has(c.securityContext.capabilities.add)
          || c.securityContext.capabilities.add.all(cap,
               variables.helper == 'volume' ? cap in ['CHOWN', 'DAC_OVERRIDE', 'FOWNER']
               : (cap in variables.baselineCaps || (variables.helper == 'fixer' && cap == 'DAC_READ_SEARCH')))))
      )
    message: >-
      a capability outside the Kubernetes baseline (helpers: fixer DAC_READ_SEARCH, volume CHOWN / DAC_OVERRIDE
      / FOWNER only)
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (!(has(variables.spec.securityContext) && has(variables.spec.securityContext.seccompProfile)
        && variables.spec.securityContext.seccompProfile.type == 'Unconfined') && variables.containers.all(c, !(has(c.securityContext)
        && has(c.securityContext.seccompProfile) && c.securityContext.seccompProfile.type == 'Unconfined')))
      )
    message: an Unconfined seccomp profile is refused
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (!(has(variables.spec.securityContext) && has(variables.spec.securityContext.appArmorProfile)
        && variables.spec.securityContext.appArmorProfile.type == 'Unconfined') && variables.containers.all(c, !(has(c.securityContext)
        && has(c.securityContext.appArmorProfile) && c.securityContext.appArmorProfile.type == 'Unconfined')) && variables.annotations.all(k,
        !k.startsWith('container.apparmor.security.beta.kubernetes.io/') || variables.annotations[k] != 'unconfined'))
      )
    message: an Unconfined AppArmor profile is refused
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (([variables.spec].filter(s, has(s.securityContext) && has(s.securityContext.seLinuxOptions)).map(s,
        s.securityContext.seLinuxOptions)
          + variables.containers.filter(c, has(c.securityContext) && has(c.securityContext.seLinuxOptions)).map(c,
        c.securityContext.seLinuxOptions))
        .all(o, !has(o.user) && !has(o.role) && (!has(o.type) || o.type in ['container_t', 'container_init_t', 'container_kvm_t',
        'container_engine_t'])))
      )
    message: seLinuxOptions with a user, a role or another type are refused
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.procMount)
        || c.securityContext.procMount == 'Default'))
      )
    message: procMount must be Default
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (!has(variables.spec.securityContext) || !has(variables.spec.securityContext.sysctls)
        || variables.spec.securityContext.sysctls.all(s, s.name in variables.safeSysctls))
      )
    message: a sysctl outside the baseline's safe set
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (variables.volumes.all(v, has(v.emptyDir)
          || (has(v.configMap) && (v.configMap.name.startsWith(variables.prefix)))
          || (has(v.secret) && (v.secret.secretName.startsWith(variables.prefix)))
          || (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName.startsWith(variables.prefix))
          || (has(v.hostPath) && !v.hostPath.path.contains('/..') && !v.hostPath.path.contains('/./')
              && params.data.bindRoots.split(' ').exists(r, r != '' && (v.hostPath.path == r || v.hostPath.path.startsWith(r + '/'))))
          || (has(v.projected) && has(v.projected.sources) && v.projected.sources.all(src, has(src.downwardAPI)
              || (has(src.secret) && (src.secret.name.startsWith(variables.prefix))) || (has(src.configMap) && (src.configMap.name.startsWith(variables.prefix)))))))
      )
    message: >-
      a volume outside the allowlist (emptyDir; the instance's own ConfigMap, Secret or PVC; hostPath under the shared-folder roots; projected secret, configMap or downwardAPI)
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || ((!has(variables.spec.serviceAccountName) || variables.spec.serviceAccountName
        == 'default') && has(variables.spec.automountServiceAccountToken) && variables.spec.automountServiceAccountToken
        == false)
      )
    message: >-
      pods run as the namespace's default ServiceAccount with automountServiceAccountToken: false
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (variables.containers.all(c, (!has(c.envFrom) || c.envFrom.all(e, (!has(e.secretRef) || (e.secretRef.name.startsWith(variables.prefix)))
            && (!has(e.configMapRef) || (e.configMapRef.name.startsWith(variables.prefix)))))
          && (!has(c.env) || c.env.all(e, !has(e.valueFrom) || ((!has(e.valueFrom.secretKeyRef) || (e.valueFrom.secretKeyRef.name.startsWith(variables.prefix)))
            && (!has(e.valueFrom.configMapKeyRef) || (e.valueFrom.configMapKeyRef.name.startsWith(variables.prefix))))))))
      )
    messageExpression: >-
      "a Secret, ConfigMap or PVC that isn't this instance's (" + variables.prefix + "*, its template files " + variables.prefix + "tpl-* included)"
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (variables.annotations.all(k, !k.startsWith('cni.projectcalico.org/') && !k.startsWith('k8s.v1.cni.cncf.io/')
        && !k.startsWith('v1.multus-cni.io/') && !k.startsWith('kube-router.io/') && !k.startsWith('io.cilium/')))
      )
    message: CNI annotations are refused
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (!('portcullis.io/vpn-slot' in variables.labels) || variables.labels['portcullis.io/vpn-slot'].matches('^([0-9]|[1-3][0-9]|4[0-6])$'))
      )
    message: portcullis.io/vpn-slot must be an integer 0-46
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (variables.helper == '' || ((variables.helper == 'fixer' || variables.helper ==
        'volume')
            && variables.containers.all(c, c.image == params.data.hubImage)
            && variables.labels.all(k, !k.startsWith('portcullis.io/net-') && k != 'portcullis.io/egress' && k !=
        'portcullis.io/vpn-slot')
            && request.userInfo.username == params.data.hubServiceAccount))
      )
    message: >-
      a helper pod: portcullis.io/helper fixer or volume, the Hub's own image, no network label, created by the
      Hub
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (variables.helper != '' || ((!(has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsUser)
          && variables.spec.securityContext.runAsUser == 0) || variables.oneShot)
          && variables.containers.all(c, !(has(c.securityContext) && has(c.securityContext.runAsUser) && c.securityContext.runAsUser == 0)
            || variables.oneShot
            || (c.name in variables.initNames && variables.rootPod && c.name in variables.rootShaped))))
      )
    message: >-
      only the Hub's helper pods, a Job's one-shot pods (portcullis.io/one-shot) and init containers of the root shape
      (drop ALL, add only CHOWN / DAC_OVERRIDE / FOWNER, no privilege escalation, no ports, no ServiceAccount token, a group
      other than 0, no fsGroup / supplemental group 0, no hostPath mount; a one-shot pod's volumes only emptyDir or
      the instance's own PVC / ConfigMap / Secret) may run as root
  # A pod with a hostPath volume (the Hub's helpers aside): every container,
  # init and ephemeral included, provably non-root (runAsNonRoot, or an
  # effective runAsUser > 0) and without privilege escalation (no uid given =
  # the image's USER, maybe root; a setuid binary would escalate).
  - expression: |-
      variables.skipObj || (object.kind in ['Secret', 'PersistentVolumeClaim'] ||
        variables.helper != '' || !variables.volumes.exists(v, has(v.hostPath))
        || variables.containers.all(c,
             (((has(c.securityContext) && has(c.securityContext.runAsNonRoot))
                 ? c.securityContext.runAsNonRoot
                 : (has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsNonRoot) && variables.spec.securityContext.runAsNonRoot))
              || ((has(c.securityContext) && has(c.securityContext.runAsUser))
                 ? c.securityContext.runAsUser > 0
                 : (has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsUser) && variables.spec.securityContext.runAsUser > 0)))
             && has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation)
             && c.securityContext.allowPrivilegeEscalation == false)
      )
    message: >-
      a pod with a hostPath volume: every container (init and ephemeral included) needs runAsNonRoot or a runAsUser
      above 0, and allowPrivilegeEscalation false
  # ... and never group 0 (files it creates in host folders would be root's
  # group): supplementalGroupsPolicy Strict (the kubelet adds no group from
  # the image's /etc/group, which could hold 0; Kubernetes >= 1.33), every
  # container's effective runAsGroup explicit and above 0, no pod
  # runAsGroup, fsGroup or supplemental group 0.
  - expression: |-
      variables.skipObj || (object.kind in ['Secret', 'PersistentVolumeClaim'] ||
        variables.helper != '' || !variables.volumes.exists(v, has(v.hostPath))
        || (has(variables.spec.securityContext) && has(variables.spec.securityContext.supplementalGroupsPolicy) && variables.spec.securityContext.supplementalGroupsPolicy == 'Strict'
            && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsGroup) && variables.spec.securityContext.runAsGroup == 0)
            && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.fsGroup) && variables.spec.securityContext.fsGroup == 0)
            && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.supplementalGroups) && 0 in variables.spec.securityContext.supplementalGroups)
            && variables.containers.all(c,
                 (has(c.securityContext) && has(c.securityContext.runAsGroup))
                   ? c.securityContext.runAsGroup > 0
                   : (has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsGroup) && variables.spec.securityContext.runAsGroup > 0)))
      )
    message: >-
      a pod with a hostPath volume needs supplementalGroupsPolicy Strict, every container (init and ephemeral included)
      an explicit runAsGroup above 0, and no runAsGroup, fsGroup or supplemental group 0
  # Compose names (ruling): the Hub's hostname / subdomain / search domain only.
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || ((!has(variables.spec.hostname) || ('portcullis.io/service' in variables.labels && variables.spec.hostname == variables.labels['portcullis.io/service']))
          && (!has(variables.spec.subdomain) || variables.spec.subdomain == variables.inst + '--pods')
          && (!has(variables.spec.dnsPolicy) || variables.spec.dnsPolicy != 'None')
          && (!has(variables.spec.dnsConfig) || ((!has(variables.spec.dnsConfig.nameservers) || size(variables.spec.dnsConfig.nameservers) == 0)
            && (!has(variables.spec.dnsConfig.searches) || variables.spec.dnsConfig.searches.all(s, s == variables.inst + '--pods.' + params.data.appsNamespace + '.svc.cluster.local')))))
      )
    message: >-
      hostname / subdomain / dnsConfig: only the pod's own portcullis.io/service, the subdomain <instance>--pods, the
      search domain <instance>--pods.<apps namespace>.svc.cluster.local, no nameservers, no dnsPolicy None
  # Compose network aliases (ruling): /etc/hosts entries for the Hub's
  # <instance>--<alias> ClusterIP Services only.
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (!has(variables.spec.hostAliases) || (size(variables.spec.hostAliases) <= 16 && variables.spec.hostAliases.all(h,
          has(h.ip) && isIP(h.ip) && ip(h.ip).family() == 4 && cidr(params.data.serviceCIDR).containsIP(h.ip)
          && h.ip != string(cidr(params.data.serviceCIDR).ip()) && !cidr(variables.svcStaticBand).containsIP(h.ip)
          && has(h.hostnames) && size(h.hostnames) > 0 && size(h.hostnames) <= 16
          && h.hostnames.all(n, n.matches('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')))))
      )
    message: >-
      hostAliases: at most 16 entries, each an address of the service network outside its static band
      (the core Services' fixed addresses) and 1-16 hostnames that are single DNS labels
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || (!variables.probe || (variables.inst == 'portcullis-probe'
            && variables.volumes.size() == 0
            && variables.containers.all(c, c.image == params.data.hubImage
                && has(c.command) && size(c.command) >= 3 && c.command[0] == 'hub' && c.command[1] == 'helper' &&
        c.command[2] in ['listen', 'idle', 'dial']
                && (!has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add)
        || size(c.securityContext.capabilities.add) == 0)
                && has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot
        == true)
            && variables.labels.all(k, !k.startsWith('portcullis.io/') || k in ['portcullis.io/instance', 'portcullis.io/probe'])))
      )
    message: >-
      a probe pod: the Hub's image running hub helper listen|idle|dial, instance portcullis-probe, no volume, no
      capability, non-root, no other portcullis.io/ label
  # HA placement (contract §6 "placement"; vectors tagged ha). Priority:
  # only the four app classes (portcullis-core is core's; an unset class
  # is admitted: no class is a global default, priority 0, and the Hub's
  # translator always names one).
  - expression: |-
      variables.skipObj || object.kind in ['Secret', 'PersistentVolumeClaim'] || (
        !has(variables.spec.priorityClassName) || variables.spec.priorityClassName in ['portcullis-critical', 'portcullis-high', 'portcullis-normal', 'portcullis-low']
      )
    message: app pods may use only portcullis-critical|high|normal|low
  # The small taint's toleration (or a keyless Exists toleration, which
  # tolerates every taint) only with a required node affinity that has a
  # term on portcullis.io/class In [small] and a class expression (In or
  # NotIn [small]) in every term: a VAP can't read Node objects (R2).
  - expression: |-
      variables.skipObj || object.kind in ['Secret', 'PersistentVolumeClaim'] || (
        !has(variables.spec.tolerations) || (size(variables.spec.tolerations) <= 32
          && !variables.spec.tolerations.exists(t, !has(t.key) || t.key == '' || t.key == 'portcullis.io/small'))
        || (size(variables.requiredTerms) > 0 && size(variables.requiredTerms) <= 32
          && variables.requiredTerms.exists(t, has(t.matchExpressions) && size(t.matchExpressions) <= 32 && t.matchExpressions.exists(e,
               e.key == 'portcullis.io/class' && e.operator == 'In' && has(e.values) && e.values == ['small']))
          && variables.requiredTerms.all(t, has(t.matchExpressions) && size(t.matchExpressions) <= 32 && t.matchExpressions.exists(e,
               e.key == 'portcullis.io/class' && e.operator in ['In', 'NotIn'] && has(e.values) && e.values == ['small'])))
      )
    message: the portcullis.io/small toleration needs a required node affinity on portcullis.io/class In [small]
  # nodeName bypasses the scheduler, taints and affinity.
  - expression: |-
      variables.skipObj || object.kind in ['Secret', 'PersistentVolumeClaim'] || (
        !has(variables.spec.nodeName) || variables.spec.nodeName == ''
      )
    message: nodeName is refused
  # Placement keys are node label keys of portcullis.io/* and
  # kubernetes.io/hostname only (matchFields too); the labelSelector keys
  # of pod affinity and spread are pod labels and aren't judged.
  - expression: |-
      variables.skipObj || object.kind in ['Secret', 'PersistentVolumeClaim'] || (
        (!has(variables.spec.nodeSelector) || (size(variables.spec.nodeSelector) <= 32 && variables.spec.nodeSelector.all(k, k.startsWith('portcullis.io/') || k == 'kubernetes.io/hostname')))
        && (!has(variables.spec.topologySpreadConstraints) || (size(variables.spec.topologySpreadConstraints) <= 32
            && variables.spec.topologySpreadConstraints.all(c, c.topologyKey.startsWith('portcullis.io/') || c.topologyKey == 'kubernetes.io/hostname')))
        && (!has(variables.spec.affinity) || (
          (!has(variables.spec.affinity.nodeAffinity) || (
            (size(variables.requiredTerms) <= 32 && variables.requiredTerms.all(t,
               (!has(t.matchExpressions) || (size(t.matchExpressions) <= 32 && t.matchExpressions.all(e, e.key.startsWith('portcullis.io/') || e.key == 'kubernetes.io/hostname')))
               && (!has(t.matchFields) || (size(t.matchFields) <= 32 && t.matchFields.all(e, e.key.startsWith('portcullis.io/') || e.key == 'kubernetes.io/hostname')))))
            && (!has(variables.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution)
                || (size(variables.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution) <= 32
                    && variables.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution.all(w,
                 (!has(w.preference.matchExpressions) || (size(w.preference.matchExpressions) <= 32 && w.preference.matchExpressions.all(e, e.key.startsWith('portcullis.io/') || e.key == 'kubernetes.io/hostname')))
                 && (!has(w.preference.matchFields) || (size(w.preference.matchFields) <= 32 && w.preference.matchFields.all(e, e.key.startsWith('portcullis.io/') || e.key == 'kubernetes.io/hostname'))))))))
          && (!has(variables.spec.affinity.podAffinity) || (
            (!has(variables.spec.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution) || (size(variables.spec.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution) <= 32
                && variables.spec.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution.all(t, t.topologyKey.startsWith('portcullis.io/') || t.topologyKey == 'kubernetes.io/hostname')))
            && (!has(variables.spec.affinity.podAffinity.preferredDuringSchedulingIgnoredDuringExecution) || (size(variables.spec.affinity.podAffinity.preferredDuringSchedulingIgnoredDuringExecution) <= 32
                && variables.spec.affinity.podAffinity.preferredDuringSchedulingIgnoredDuringExecution.all(w, w.podAffinityTerm.topologyKey.startsWith('portcullis.io/') || w.podAffinityTerm.topologyKey == 'kubernetes.io/hostname')))))
          && (!has(variables.spec.affinity.podAntiAffinity) || (
            (!has(variables.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution) || (size(variables.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution) <= 32
                && variables.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.all(t, t.topologyKey.startsWith('portcullis.io/') || t.topologyKey == 'kubernetes.io/hostname')))
            && (!has(variables.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution) || (size(variables.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution) <= 32
                && variables.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution.all(w, w.podAffinityTerm.topologyKey.startsWith('portcullis.io/') || w.podAffinityTerm.topologyKey == 'kubernetes.io/hostname')))))))
      )
    message: topologySpreadConstraints and affinity may use only portcullis.io/* and kubernetes.io/hostname keys
  - expression: |-
      variables.skipObj || (
        object.kind in ['Secret', 'PersistentVolumeClaim'] || !('portcullis.io/helper' in variables.labels)
      )
    message: helpers are pods, never Deployments or Jobs
  # Only the Hub's own Secrets may be changed or deleted: the old object
  # owner=hub with an instance label; owner and instance can't change.
  - expression: |-
      variables.cli || request.operation == 'CREATE' || request.kind.kind != 'Secret' || (
        (has(oldObject.metadata.labels) && 'portcullis.io/owner' in oldObject.metadata.labels
          && oldObject.metadata.labels['portcullis.io/owner'] == 'hub' && 'portcullis.io/instance' in oldObject.metadata.labels)
        && (request.operation == 'DELETE' || (has(object.metadata.labels)
          && 'portcullis.io/owner' in object.metadata.labels && object.metadata.labels['portcullis.io/owner'] == 'hub'
          && 'portcullis.io/instance' in object.metadata.labels
          && object.metadata.labels['portcullis.io/instance'] == oldObject.metadata.labels['portcullis.io/instance']))
      )
    message: "only the Hub's own Secrets (portcullis.io/owner=hub, an instance label) may be changed or deleted; owner and instance can't change"
  # The same for claims, whose old name must also be the old instance's own
  # (<instance>--…).
  - expression: |-
      variables.cli || variables.pvcUnprotect || request.operation == 'CREATE' || request.kind.kind != 'PersistentVolumeClaim' || (
        (has(oldObject.metadata.labels) && 'portcullis.io/owner' in oldObject.metadata.labels
          && oldObject.metadata.labels['portcullis.io/owner'] == 'hub' && 'portcullis.io/instance' in oldObject.metadata.labels
          && oldObject.metadata.labels['portcullis.io/instance'] != ''
          && oldObject.metadata.name.startsWith(oldObject.metadata.labels['portcullis.io/instance'] + '--'))
        && (request.operation == 'DELETE' || (has(object.metadata.labels)
          && 'portcullis.io/owner' in object.metadata.labels && object.metadata.labels['portcullis.io/owner'] == 'hub'
          && 'portcullis.io/instance' in object.metadata.labels
          && object.metadata.labels['portcullis.io/instance'] == oldObject.metadata.labels['portcullis.io/instance']))
      )
    message: "only the Hub's own claims (portcullis.io/owner=hub, an instance label, named <instance>--…) may be changed or deleted; owner and instance can't change"
  # The Hub's claims: the apps StorageClass (never core's Retain one or
  # another provisioner), no pre-bound volume or data source, named
  # <instance>--… after its own instance label, a plain 3-digit mode
  # (an optional leading 0: no setuid, setgid or sticky bit). volumeName:
  # only the volume binder sets it (a controller), never the Hub; it stays.
  - expression: |-
      variables.skipObj || variables.pvcUnprotect || object.kind != 'PersistentVolumeClaim' || (
        has(object.spec.storageClassName) && object.spec.storageClassName == 'portcullis-apps'
        && (!has(object.spec.volumeName) || variables.pvBind
            || (request.operation == 'UPDATE' && has(oldObject.spec.volumeName) && oldObject.spec.volumeName == object.spec.volumeName))
        && !has(object.spec.dataSource) && !has(object.spec.dataSourceRef)
        && has(object.metadata.labels) && 'portcullis.io/instance' in object.metadata.labels
        && object.metadata.labels['portcullis.io/instance'] != ''
        && object.metadata.name.startsWith(object.metadata.labels['portcullis.io/instance'] + '--')
        && has(object.metadata.annotations) && 'portcullis.io/mode' in object.metadata.annotations
        && object.metadata.annotations['portcullis.io/mode'].matches('^0?[0-7]{3}$')
      )
    message: "a claim must use the portcullis-apps StorageClass, set no volumeName (only the volume binder does) or dataSource / dataSourceRef, be named <instance>--… after its portcullis.io/instance label, and have a 3-digit portcullis.io/mode"

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-apps-services
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["services"]
  variables:
    # The CLI's own identity (params cliUsername: helm and kubectl run as it;
    # chart objects also carry portcullis.io/owner=core) is exempt from every
    # check below but the generation probe.
    - name: cli
      expression: "params.data.cliUsername != '' && request.userInfo.username == params.data.cliUsername"
    # DELETE has no object: the object checks skip it (the old-object rule judges it).
    - name: skipObj
      expression: "variables.cli || request.operation == 'DELETE'"
    - name: svcBits
      expression: "32 - cidr(params.data.serviceCIDR).prefixLength()"
    - name: bandBits
      expression: "variables.svcBits - 4 < 4 ? 4 : (variables.svcBits - 4 > 8 ? 8 : variables.svcBits - 4)"
    - name: staticBand
      expression: "string(cidr(params.data.serviceCIDR).ip()) + '/' + string(32 - variables.bandBits)"
    # A server dry-run reports the service network's own address as the
    # clusterIP (never allocated): not a static-band address.
    - name: netAddr
      expression: "string(cidr(params.data.serviceCIDR).ip())"
  validations:
    # The CLI's probe (kube_admission_probe): an object annotated with
    # exactly this binding's params generation is refused, naming it — the
    # proof that this policy's binding of that generation is live.
    - expression: >-
        request.operation == 'DELETE' || !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
        || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
      messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
    # Names (ruling): an instance's Services are <instance>--… (its pods'
    # Services, aliases and the headless <instance>--pods) or its AI
    # companions' gate aliases portcullis-mcp-<instance>--…: a Service named
    # like another instance's compose service (db) would capture its lookups.
    - expression: |-
        variables.skipObj || (
          has(object.metadata.labels) && 'portcullis.io/instance' in object.metadata.labels
          && object.metadata.labels['portcullis.io/instance'] != ''
          && (object.metadata.name.startsWith(object.metadata.labels['portcullis.io/instance'] + '--')
              || object.metadata.name.startsWith('portcullis-mcp-' + object.metadata.labels['portcullis.io/instance'] + '--'))
        )
      message: "a Service is named <instance>--… or portcullis-mcp-<instance>--… (with its portcullis.io/instance label)"
    - expression: |-
        variables.skipObj || (
          !has(object.spec.type) || object.spec.type in ['ClusterIP', 'LoadBalancer']
        )
      messageExpression: "'Service type ' + object.spec.type + ' is refused (NodePort, ExternalName)'"
    - expression: |-
        variables.skipObj || (
          !has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0
        )
      message: "externalIPs are refused"
    - expression: |-
        variables.skipObj || (
          !has(object.spec.ports) || object.spec.ports.all(p, !has(p.nodePort) || p.nodePort == 0)
        )
      message: "a nodePort is refused"
    - expression: |-
        variables.skipObj || (
          !has(object.spec.type) || object.spec.type != 'LoadBalancer'
          || (has(object.spec.allocateLoadBalancerNodePorts) && object.spec.allocateLoadBalancerNodePorts == false)
        )
      message: "a LoadBalancer needs allocateLoadBalancerNodePorts: false"
    # The API server allocates a Service's clusterIP before admission, so
    # an allocated one can't be told from a requested one (Kubernetes 1.32:
    # every Service would be refused). Refused instead: any clusterIP in the
    # service network's static band, the first min(max(16, size/16), 256)
    # addresses, where the core Services' fixed IPs live (the dynamic
    # allocator never picks them while the dynamic band has room).
    - expression: |-
        variables.skipObj || (
          (!has(object.spec.clusterIP) || object.spec.clusterIP in ['', 'None'] || !isIP(object.spec.clusterIP)
            || !cidr(variables.staticBand).containsIP(object.spec.clusterIP) || object.spec.clusterIP == variables.netAddr)
          && (!has(object.spec.clusterIPs) || object.spec.clusterIPs.all(a, a == 'None' || !isIP(a) || !cidr(variables.staticBand).containsIP(a) || a == variables.netAddr))
        )
      message: "a clusterIP in the service network's static band (the core Services' fixed addresses) is refused"
    - expression: |-
        variables.skipObj || (
          !has(object.spec.type) || object.spec.type != 'LoadBalancer'
          || object.spec.ports.all(p, !(string(p.port) in params.data.corePorts.split(' ')))
        )
      message: "a LoadBalancer on a core port (80, 443, the VPN port, 8000, 8081, 8443, 8444)"
    # Only the Hub's own Services may be changed or deleted: the old object
    # owner=hub with an instance label; owner and instance can't change.
    - expression: |-
        variables.cli || request.operation == 'CREATE' || (
          (has(oldObject.metadata.labels) && 'portcullis.io/owner' in oldObject.metadata.labels
            && oldObject.metadata.labels['portcullis.io/owner'] == 'hub' && 'portcullis.io/instance' in oldObject.metadata.labels)
          && (request.operation == 'DELETE' || (has(object.metadata.labels)
            && 'portcullis.io/owner' in object.metadata.labels && object.metadata.labels['portcullis.io/owner'] == 'hub'
            && 'portcullis.io/instance' in object.metadata.labels
            && object.metadata.labels['portcullis.io/instance'] == oldObject.metadata.labels['portcullis.io/instance']))
        )
      message: "only the Hub's own Services (portcullis.io/owner=hub, an instance label) may be changed or deleted; owner and instance can't change"

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-apps-traefik
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["traefik.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
  # Traefik doesn't watch the apps namespace (it would list every Secret of
  # it): app IngressRoutes / Middlewares live in portcullis-edge.
  variables:
    # The CLI's own identity (params cliUsername: helm and kubectl run as it;
    # chart objects also carry portcullis.io/owner=core) is exempt from every
    # check below but the generation probe.
    - name: cli
      expression: "params.data.cliUsername != '' && request.userInfo.username == params.data.cliUsername"
  validations:
    # The CLI's probe (kube_admission_probe): an object annotated with
    # exactly this binding's params generation is refused, naming it — the
    # proof that this policy's binding of that generation is live.
    - expression: >-
        !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
        || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
      messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
    # The CLI's probes of other params generations pass (Traefik doesn't
    # watch this namespace and the Hub has no Role for traefik.io here).
    - expression: |-
        variables.cli || (
          has(object.metadata.annotations) && 'portcullis.io/params-generation' in object.metadata.annotations
        )
      messageExpression: "object.kind + ' is refused in the apps namespace: Traefik objects live in portcullis-edge'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-apps-netpol
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies"]
  variables:
    # The CLI's own identity (params cliUsername: helm and kubectl run as it;
    # chart objects also carry portcullis.io/owner=core) is exempt from every
    # check below but the generation probe.
    - name: cli
      expression: "params.data.cliUsername != '' && request.userInfo.username == params.data.cliUsername"
    # DELETE has no object: the object checks skip it (the old-object rule judges it).
    - name: skipObj
      expression: "variables.cli || request.operation == 'DELETE'"
    - name: sel
      expression: "has(object.spec.podSelector.matchLabels) ? object.spec.podSelector.matchLabels : {}"
    - name: probe
      expression: "'portcullis.io/probe' in variables.sel"
    - name: inst
      expression: "'portcullis.io/instance' in variables.sel ? variables.sel['portcullis.io/instance'] : ''"
    - name: slot
      expression: "'portcullis.io/vpn-slot' in variables.sel ? variables.sel['portcullis.io/vpn-slot'] : ''"
    - name: ingress
      expression: "has(object.spec.ingress) ? object.spec.ingress : []"
    - name: egress
      expression: "has(object.spec.egress) ? object.spec.egress : []"
    - name: nodes
      expression: "params.data.nodeAddresses.split(' ').filter(a, a != '')"
    - name: apiAddrs
      expression: "params.data.apiAddresses.split(' ').filter(a, a != '')"
    # Each peer's own namespace (Task 19 review C1): in HA Traefik is in
    # portcullis-ingress while mcp-gate and wg stay in the core namespace.
    - name: traefikNs
      expression: "params.data.traefik.split(':')[0]"
    - name: mcpNs
      expression: "params.data.mcpGate.split(':')[0]"
    - name: wgNs
      expression: "params.data.wg.split(':')[0]"
    - name: traefikSel
      expression: "{params.data.traefik.split(':')[1].split('=')[0]: params.data.traefik.split(':')[1].split('=')[1]}"
    - name: mcpSel
      expression: "{params.data.mcpGate.split(':')[1].split('=')[0]: params.data.mcpGate.split(':')[1].split('=')[1]}"
    - name: wgSel
      expression: "{params.data.wg.split(':')[1].split('=')[0]: params.data.wg.split(':')[1].split('=')[1]}"
    - name: dnsNs
      expression: "params.data.kubeDNS.split(':')[0]"
    - name: dnsSel
      expression: "{params.data.kubeDNS.split(':')[1].split('=')[0]: params.data.kubeDNS.split(':')[1].split('=')[1]}"
  validations:
    # The CLI's probe (kube_admission_probe): an object annotated with
    # exactly this binding's params generation is refused, naming it — the
    # proof that this policy's binding of that generation is live.
    - expression: >-
        request.operation == 'DELETE' || !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
        || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
      messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
    - expression: |-
        variables.skipObj || (
          variables.probe
          || (variables.inst != ''
              && (!has(object.spec.podSelector.matchExpressions) || object.spec.podSelector.matchExpressions.all(e, e.key != 'portcullis.io/instance'))
              && variables.sel.exists(k, k.startsWith('portcullis.io/net-') || k in ['portcullis.io/egress', 'portcullis.io/service', 'portcullis.io/vpn-slot']))
        )
      message: "a NetworkPolicy selects one instance's pods (portcullis.io/instance plus a net-, egress, service or vpn-slot key)"
    - expression: |-
        variables.skipObj || (
          size(variables.nodes) > 0 && size(variables.apiAddrs) > 0
        )
      message: "the params carry no node or API addresses: every NetworkPolicy is refused (fail closed)"
    # A port range would widen every port check below (53, 80 / 443, the
    # wg edge port): the Hub never writes endPort.
    - expression: |-
        variables.skipObj || (
          variables.ingress.all(r, !has(r.ports) || r.ports.all(x, !has(x.endPort)))
          && variables.egress.all(r, !has(r.ports) || r.ports.all(x, !has(x.endPort)))
        )
      message: "a NetworkPolicy port range (endPort) is refused"
    - expression: |-
        variables.skipObj || (
          variables.ingress.all(r, has(r.from) && size(r.from) > 0) && variables.egress.all(r, has(r.to) && size(r.to) > 0)
        )
      message: "a rule without from / to (all peers) is refused"
    - expression: |-
        variables.skipObj || (
          variables.ingress.all(r, r.from.all(p, (!has(p.namespaceSelector) || (has(p.namespaceSelector.matchLabels) && size(p.namespaceSelector.matchLabels) > 0) || (has(p.namespaceSelector.matchExpressions) && size(p.namespaceSelector.matchExpressions) > 0))
            && (!has(p.podSelector) || (has(p.podSelector.matchLabels) && size(p.podSelector.matchLabels) > 0) || (has(p.podSelector.matchExpressions) && size(p.podSelector.matchExpressions) > 0)))) && variables.egress.all(r, r.to.all(p, (!has(p.namespaceSelector) || (has(p.namespaceSelector.matchLabels) && size(p.namespaceSelector.matchLabels) > 0) || (has(p.namespaceSelector.matchExpressions) && size(p.namespaceSelector.matchExpressions) > 0))
            && (!has(p.podSelector) || (has(p.podSelector.matchLabels) && size(p.podSelector.matchLabels) > 0) || (has(p.podSelector.matchExpressions) && size(p.podSelector.matchExpressions) > 0))))
        )
      message: "an empty namespaceSelector or podSelector is refused"
    - expression: |-
        variables.skipObj || (
          !variables.probe
          || (variables.ingress.all(r, r.from.all(p, !has(p.namespaceSelector) && !has(p.ipBlock) && has(p.podSelector) && has(p.podSelector.matchLabels) && 'portcullis.io/probe' in p.podSelector.matchLabels)) && variables.egress.all(r, r.to.all(p, !has(p.namespaceSelector) && !has(p.ipBlock) && has(p.podSelector) && has(p.podSelector.matchLabels) && 'portcullis.io/probe' in p.podSelector.matchLabels)))
        )
      message: "a probe policy's peers are probe pods only"
    - expression: |-
        variables.skipObj || (
          variables.probe || variables.ingress.all(r, r.from.all(p,
            (!has(p.namespaceSelector) && !has(p.ipBlock) && has(p.podSelector) && has(p.podSelector.matchLabels)
              && 'portcullis.io/instance' in p.podSelector.matchLabels && p.podSelector.matchLabels['portcullis.io/instance'] == variables.inst)
            || (!has(p.ipBlock) && has(p.namespaceSelector) && has(p.namespaceSelector.matchLabels)
              && has(p.podSelector) && has(p.podSelector.matchLabels)
              && ((p.namespaceSelector.matchLabels == {'kubernetes.io/metadata.name': variables.traefikNs} && p.podSelector.matchLabels == variables.traefikSel)
                  || (p.namespaceSelector.matchLabels == {'kubernetes.io/metadata.name': variables.mcpNs} && p.podSelector.matchLabels == variables.mcpSel)))))
        )
      message: "an ingress peer that isn't the same instance, Traefik or mcp-gate"
    - expression: |-
        variables.skipObj || (
          variables.probe || variables.egress.all(r, r.to.all(p,
            (!has(p.namespaceSelector) && !has(p.ipBlock) && has(p.podSelector) && has(p.podSelector.matchLabels)
              && 'portcullis.io/instance' in p.podSelector.matchLabels && p.podSelector.matchLabels['portcullis.io/instance'] == variables.inst)
            || (!has(p.ipBlock) && has(p.namespaceSelector) && has(p.namespaceSelector.matchLabels)
              && p.namespaceSelector.matchLabels == {'kubernetes.io/metadata.name': variables.dnsNs}
              && has(p.podSelector) && has(p.podSelector.matchLabels) && p.podSelector.matchLabels == variables.dnsSel
              && has(r.ports) && size(r.ports) > 0 && r.ports.all(x, has(x.port) && x.port == 53 && !has(x.endPort)))
            || (!has(p.ipBlock) && has(p.namespaceSelector) && has(p.namespaceSelector.matchLabels)
              && p.namespaceSelector.matchLabels == {'kubernetes.io/metadata.name': variables.wgNs}
              && has(p.podSelector) && has(p.podSelector.matchLabels) && p.podSelector.matchLabels == variables.wgSel
              && variables.slot != '' && has(r.ports) && size(r.ports) == 1 && has(r.ports[0].port) && !has(r.ports[0].endPort) && string(r.ports[0].port) == string(9001 + int(variables.slot)))
            || (has(p.ipBlock) && !has(p.namespaceSelector) && !has(p.podSelector)
              && p.ipBlock.cidr == '0.0.0.0/0' && has(p.ipBlock.except)
              && params.data.podCIDR in p.ipBlock.except && params.data.serviceCIDR in p.ipBlock.except
              && '169.254.0.0/16' in p.ipBlock.except && variables.nodes.all(n, n in p.ipBlock.except)
              && variables.apiAddrs.all(n, n in p.ipBlock.except))
            || (has(p.ipBlock) && !has(p.namespaceSelector) && !has(p.podSelector)
              && p.ipBlock.cidr in variables.nodes && (!has(p.ipBlock.except) || size(p.ipBlock.except) == 0)
              && has(r.ports) && size(r.ports) > 0 && r.ports.all(x, has(x.port) && !has(x.endPort) && (x.port == 80 || x.port == 443)))))
        )
      message: "an egress peer outside the Hub's shapes (same instance, kube-dns :53, the instance's wg edge port, the internet minus the cluster, a node on 80 / 443)"
    # Only the Hub's own NetworkPolicies may be changed or deleted (never the
    # chart's default-deny, owner=core): the old object owner=hub with an
    # instance-shaped selector; owner and instance can't change.
    - expression: |-
        variables.cli || request.operation == 'CREATE' || (
          (has(oldObject.metadata.labels) && 'portcullis.io/owner' in oldObject.metadata.labels
            && oldObject.metadata.labels['portcullis.io/owner'] == 'hub')
          && has(oldObject.spec.podSelector.matchLabels) && 'portcullis.io/instance' in oldObject.spec.podSelector.matchLabels
          && (request.operation == 'DELETE' || (has(object.metadata.labels) && 'portcullis.io/owner' in object.metadata.labels
            && object.metadata.labels['portcullis.io/owner'] == 'hub'
            && has(object.spec.podSelector.matchLabels) && 'portcullis.io/instance' in object.spec.podSelector.matchLabels
            && object.spec.podSelector.matchLabels['portcullis.io/instance'] == oldObject.spec.podSelector.matchLabels['portcullis.io/instance']))
        )
      message: "only the Hub's own NetworkPolicies (portcullis.io/owner=hub, an instance selector) may be changed or deleted; owner and instance can't change"

---
# portcullis-edge-routes: everyone but the CLI's own identity (params
# cliUsername: helm and kubectl run there and write the core objects) may
# write only owner=hub IngressRoutes / Middlewares here, never touch an
# owner=core one, and only in the shapes the Hub renders today:
#   IngressRoute  entryPoints ⊆ websecure / vpnsecure (never empty =
#                 every entrypoint), services = Services of the apps namespace
#                 or kind TraefikService with a K15 core service name
#                 (group-gate@file, forward-auth-ext@file, mcp-gate@file:
#                 the companions' MCP routes on their app's host);
#                 middlewares = this namespace's (never a core one:
#                 edgeCoreMiddlewares) or the @file allowlist; tls only the
#                 four tiers, the letsencrypt resolver, no secret / store
#   Middleware    exactly one type of the Hub's template allowlist
#                 (internal/templates middlewareAttrRe) — never forwardAuth,
#                 errors, plugin, basicAuth, digestAuth, passTLSClientCert;
#                 no redis address; no X-Portcullis-* header; a chain only of
#                 this namespace's (never core) or allowlisted @file names
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-edge-routes
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["traefik.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
      # The apps' backends as seen from the edge: ExternalName Services
      # pinned to the instance's own apps Service (Traefik watches only this
      # namespace and can't read the apps one).
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["services"]
  variables:
    - name: exempt
      expression: "params.data.cliUsername != '' && request.userInfo.username == params.data.cliUsername"
    - name: del
      expression: "request.operation == 'DELETE'"
    - name: edge
      expression: "params.data.edgeNamespace"
    - name: apps
      expression: "params.data.appsNamespace"
    - name: fileNames
      expression: "params.data.fileMiddlewares.split(' ')"
    - name: coreMiddlewares
      expression: "params.data.edgeCoreMiddlewares.split(' ')"
    - name: coreServices
      expression: "['group-gate@file', 'forward-auth-ext@file', 'mcp-gate@file']"
    - name: tiers
      expression: "['authaware@file', 'public@file', 'protected@file', 'protected-any@file']"
    - name: entryPoints
      expression: "['websecure', 'vpnsecure']"
    - name: reserved
      expression: "params.data.reservedHosts.split(' ')"
    - name: routes
      expression: "!variables.del && object.kind == 'IngressRoute' && has(object.spec.routes) ? object.spec.routes : []"
    - name: types
      expression: "['addPrefix', 'stripPrefix', 'stripPrefixRegex', 'replacePath', 'replacePathRegex', 'redirectRegex', 'redirectScheme', 'headers', 'compress', 'contentType', 'chain', 'rateLimit', 'inFlightReq', 'ipAllowList', 'buffering', 'retry', 'circuitBreaker', 'grpcWeb']"
    - name: owner
      expression: "!variables.del && has(object.metadata.labels) && 'portcullis.io/owner' in object.metadata.labels ? object.metadata.labels['portcullis.io/owner'] : ''"
    - name: oldOwner
      expression: "request.operation != 'CREATE' && has(oldObject.metadata.labels) && 'portcullis.io/owner' in oldObject.metadata.labels ? oldObject.metadata.labels['portcullis.io/owner'] : ''"
    - name: inst
      expression: "!variables.del && has(object.metadata.labels) && 'portcullis.io/instance' in object.metadata.labels ? object.metadata.labels['portcullis.io/instance'] : ''"
    - name: oldInst
      expression: "request.operation != 'CREATE' && has(oldObject.metadata.labels) && 'portcullis.io/instance' in oldObject.metadata.labels ? oldObject.metadata.labels['portcullis.io/instance'] : ''"
    - name: ownName
      expression: "variables.inst + '--'"
    # <instance>--<part> (a Service or Middleware name): the part after the instance's own prefix is one
    # DNS label without "--", so "--" stays the one separator (the Hub
    # refuses instance ids with "--"; this holds without relying on that).
    - name: ownObj
      expression: >-
        !variables.del && variables.inst != ''
        && object.metadata.name.startsWith(variables.ownName)
        && object.metadata.name.substring(size(variables.ownName)).matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$')
        && !object.metadata.name.substring(size(variables.ownName)).contains('--')
  validations:
    # The CLI's probe (kube_admission_probe): an object annotated with
    # exactly this binding's params generation is refused, naming it — the
    # proof that bindings of that generation are live with their params.
    - expression: >-
        variables.del || !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
        || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
      messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
    - expression: "variables.exempt || variables.del || object.kind in ['IngressRoute', 'Middleware', 'Service']"
      messageExpression: "object.kind + ' is refused in portcullis-edge (only IngressRoute, Middleware and the pinned ExternalName Services)'"
    - expression: >-
        variables.exempt || variables.del || (variables.owner == 'hub'
          && 'portcullis.io/instance' in object.metadata.labels && object.metadata.labels['portcullis.io/instance'] != '')
      message: "an object here needs the labels portcullis.io/owner=hub and portcullis.io/instance"
    - expression: "variables.exempt || request.operation == 'CREATE' || variables.oldOwner == 'hub'"
      message: "only owner=hub objects may be changed or deleted (owner=core objects are the CLI's)"
    - expression: "variables.exempt || request.operation != 'UPDATE' || (variables.inst == variables.oldInst && variables.owner == variables.oldOwner)"
      message: "portcullis.io/owner and portcullis.io/instance can't change on an update"
    - expression: "variables.exempt || request.userInfo.username == params.data.hubServiceAccount"
      message: "only the Hub's ServiceAccount (and the CLI) may write the apps' routes"
    # A VPN-only instance's routes (the Hub labels them portcullis.io/reach:
    # vpn) are on vpnsecure, but its websecure "VPN required" page
    # (vpn-required-path first) and an opted-in public link (public-guard
    # first).
    - expression: >-
        variables.exempt || variables.del || object.kind != 'IngressRoute' || !has(object.metadata.labels)
        || !('portcullis.io/reach' in object.metadata.labels) || object.metadata.labels['portcullis.io/reach'] != 'vpn'
        || object.spec.entryPoints.all(x, x == 'vpnsecure')
        || variables.routes.all(r, has(r.middlewares) && size(r.middlewares) > 0
             && r.middlewares[0].name in ['vpn-required-path@file', 'portcullis-public-guard@file'])
      message: "a route of a VPN-only instance (portcullis.io/reach: vpn) is on vpnsecure only (but its VPN-required page and an opted-in public link)"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'IngressRoute'
        || (has(object.spec.entryPoints) && size(object.spec.entryPoints) > 0
            && object.spec.entryPoints.all(e, e in variables.entryPoints))
      message: "entryPoints must be set and only websecure or vpnsecure"
    # The shape the Hub renders on Docker: Host(`h`) [|| Host(`h`)…], with
    # an optional && Path / PathPrefix [|| …]; nothing else (no HostRegexp,
    # HostSNI, ClientIP, headers, methods, no catch-all).
    - expression: >-
        variables.exempt || variables.routes.all(r, has(r.match)
          && r.match.matches('^\\(?Host\\(`[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+`\\)( \\|\\| Host\\(`[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+`\\))*\\)?( && \\(?(PathPrefix|Path)\\(`[^`()]*`\\)( \\|\\| (PathPrefix|Path)\\(`[^`()]*`\\))*\\)?)?$'))
      message: "a route match other than Host(...) with an optional && Path / PathPrefix"
    # Hosts: lowercase labels of [a-z0-9-] (no leading / trailing hyphen),
    # no empty label, no trailing dot (the shape above). Defence in depth:
    # every Host(`…`) at all, normalised (lowerAscii, empty labels dropped:
    # a trailing / double dot), is refused when it is a reserved host or a
    # subdomain of one (the apex, which the other reserved hosts sit under,
    # only exactly).
    - expression: >-
        variables.exempt || variables.routes.all(r, !has(r.match)
          || r.match.findAll('Host\\(`[^`]*`\\)').all(h,
               !variables.reserved.exists(x, x != '' && (
                    h.substring(6, size(h) - 2).lowerAscii().split('.').filter(l, l != '').join('.') == x
                    || (h.substring(6, size(h) - 2).lowerAscii().split('.').filter(l, l != '').join('.').endsWith('.' + x)
                        && !variables.reserved.exists(o, o.endsWith('.' + x)))))))
      message: "a route on a reserved core hostname (or a subdomain of one)"
    - expression: "variables.exempt || variables.routes.all(r, !has(r.priority) || r.priority <= int(params.data.maxAppPriority))"
      message: "a route priority above maxAppPriority"
    # No multi-layer routing (parentRefs would make the routers children of
    # another IngressRoute, e.g. a core one), no ingress class of its own,
    # and only the v3 rule syntax.
    - expression: >-
        variables.exempt || variables.del || object.kind != 'IngressRoute'
        || (!has(object.spec.parentRefs) && !has(object.spec.ingressClassName)
            && variables.routes.all(r, !has(r.syntax) || r.syntax == 'v3'))
      message: "a route may not set parentRefs or ingressClassName, and its syntax is v3 (or unset)"
    - expression: "variables.exempt || variables.del || object.kind != 'IngressRoute' || has(object.spec.tls)"
      message: "a route without TLS"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'IngressRoute'
        || object.spec.routes.all(r, r.services.all(s,
             (has(s.kind) && s.kind == 'TraefikService')
               ? (s.name in variables.coreServices && !has(s.namespace))
               : ((!has(s.kind) || s.kind == 'Service') && !has(s.namespace)
                  && s.name.startsWith(variables.ownName)
                  && s.name.substring(size(variables.ownName)).matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$')
                  && !s.name.substring(size(variables.ownName)).contains('--'))))
      message: "a service must be this instance's own edge Service (<instance>--<service>, no namespace) or a K15 core service (group-gate@file, forward-auth-ext@file, mcp-gate@file)"
    # The apps' backends: exactly an ExternalName Service named
    # <instance>--<service> after its own instance label, pointing at that
    # name in the apps namespace (its ClusterIP Service there; apps Services
    # are never ExternalName, so the name can't chain on), no selector, no
    # address of its own, the routes' TCP ports named tcp-<port>.
    - expression: >-
        variables.exempt || variables.del || object.kind != 'Service'
        || (has(object.spec.type) && object.spec.type == 'ExternalName'
            && (!has(object.spec.selector) || size(object.spec.selector) == 0)
            && (!has(object.spec.clusterIP) || object.spec.clusterIP == '')
            && (!has(object.spec.clusterIPs) || size(object.spec.clusterIPs) == 0)
            && (!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0)
            && !has(object.spec.loadBalancerIP) && !has(object.spec.loadBalancerClass)
            && (!has(object.spec.loadBalancerSourceRanges) || size(object.spec.loadBalancerSourceRanges) == 0))
      message: "a Service in portcullis-edge must be type ExternalName with no selector, cluster IP, external IPs or load balancer"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'Service'
        || (variables.ownObj && has(object.spec.externalName)
            && object.spec.externalName == object.metadata.name + '.' + variables.apps + '.svc.cluster.local')
      messageExpression: "'a Service in portcullis-edge must be named <instance>--<service> after its own portcullis.io/instance label and point at exactly <its name>.' + variables.apps + '.svc.cluster.local'"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'Service'
        || (has(object.spec.ports) && size(object.spec.ports) >= 1 && size(object.spec.ports) <= 16 && object.spec.ports.all(p,
              has(p.name) && p.name == 'tcp-' + string(p.port)
              && (!has(p.protocol) || p.protocol == 'TCP') && !has(p.nodePort) && !has(p.appProtocol)
              && (!has(p.targetPort) || (type(p.targetPort) == int && p.targetPort == p.port))))
      message: "an edge Service's ports: 1 to 16, each {name: tcp-<port>, port, protocol: TCP}, no nodePort / appProtocol, targetPort = port"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'IngressRoute'
        || object.spec.routes.all(r, !has(r.middlewares) || r.middlewares.all(m,
             m.name.contains('@')
               ? (m.name in variables.fileNames && !has(m.namespace))
               : ((!has(m.namespace) || m.namespace == variables.edge) && !(m.name in variables.coreMiddlewares) && m.name.startsWith(variables.ownName))))
      message: "a middleware must be this instance's own (<instance>--…, never a core one) or on the @file allowlist"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'IngressRoute' || !has(object.spec.tls)
        || ((!has(object.spec.tls.options) || (object.spec.tls.options.name in variables.tiers && !has(object.spec.tls.options.namespace)))
            && !has(object.spec.tls.secretName) && !has(object.spec.tls.store) && !has(object.spec.tls.domains)
            && (!has(object.spec.tls.certResolver) || object.spec.tls.certResolver == 'letsencrypt'))
      message: "tls.options outside the four tiers, another resolver, tls.domains, or a TLS secret / store reference"
    # A Middleware is named after its own instance label, so no instance
    # can squat another's middleware names.
    - expression: "variables.exempt || variables.del || object.kind != 'Middleware' || variables.ownObj"
      message: "a Middleware in portcullis-edge must be named <instance>--<name> after its own portcullis.io/instance label (one DNS label after the prefix, no --)"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'Middleware'
        || (size(object.spec) == 1 && object.spec.all(k, k in variables.types))
      message: "a Middleware must have exactly one type of the Hub's allowlist (never forwardAuth, errors, plugin, basicAuth, digestAuth, passTLSClientCert)"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'Middleware'
        || ((!has(object.spec.rateLimit) || !has(object.spec.rateLimit.redis))
            && (!has(object.spec.inFlightReq) || !has(object.spec.inFlightReq.redis)))
      message: "a rateLimit / inFlightReq with a redis address is refused"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'Middleware' || !has(object.spec.headers)
        || ((!has(object.spec.headers.customRequestHeaders) || object.spec.headers.customRequestHeaders.all(h, !h.lowerAscii().replace('_', '-').startsWith('x-portcullis-')))
            && (!has(object.spec.headers.customResponseHeaders) || object.spec.headers.customResponseHeaders.all(h, !h.lowerAscii().replace('_', '-').startsWith('x-portcullis-'))))
      message: "a Middleware may not set an X-Portcullis-* header"
    - expression: >-
        variables.exempt || variables.del || object.kind != 'Middleware' || !has(object.spec.chain)
        || object.spec.chain.middlewares.all(m,
             m.name.contains('@')
               ? (m.name in variables.fileNames && !has(m.namespace))
               : ((!has(m.namespace) || m.namespace == variables.edge) && !(m.name in variables.coreMiddlewares) && m.name.startsWith(variables.ownName)))
      message: "a chain may name only this instance's own middlewares (never a core one) or the @file allowlist"
---
# portcullis-core-exec (NEW, HA; contract §6 "core exec", scan P12): the
# Hub's core Role has pods/exec create on the core namespace, which RBAC
# can't narrow by pod or command. On CONNECT, everyone but the CLI may run
# only the Hub's `/portcullis-bin/hub rev <dir> <doc>` (no stdin, no tty)
# in a reader pod (group-gate-*, keycloak-*, mcp-gate-*, wg-*): <dir>
# /vpn-doc with vpn, or /hub-data with one of the other seven documents of
# tests/published_docs.json (tests/k8s_hardening.py compares these
# literals), or probe-<16 hex> (another params generation's probe: prints
# nothing). Every other exec there (the front door's DNS credentials, Vault,
# a shell) is refused, and so is every attach or port-forward. The probe:
# `hub rev /hub-data probe-<generation>`. The `container` parameter isn't
# judged: any container of a reader pod runs the same fixed command.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-core-exec
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CONNECT
      resources:
      - pods/exec
      - pods/attach
      - pods/portforward
  variables:
  - name: cli
    expression: "params.data.cliUsername != '' && request.userInfo.username == params.data.cliUsername"
  - name: cmd
    expression: 'has(object.command) && type(object.command) == list ? object.command : []'
  validations:
  - expression: >-
      request.subResource != 'exec'
      || !(size(variables.cmd) == 4 && variables.cmd[0] == '/portcullis-bin/hub' && variables.cmd[1] == 'rev'
      && variables.cmd[2] == '/hub-data' && variables.cmd[3] == 'probe-' + params.data.generation)
    messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
  # No attach or port-forward in the core namespace (nobody but the CLI
  # holds either right today: defense in depth).
  - expression: "variables.cli || request.subResource == 'exec'"
    message: only the CLI may attach to or port-forward a pod of the core namespace
  - expression: |-
      variables.cli || request.subResource != 'exec' || (
        request.userInfo.username == params.data.hubServiceAccount
        && ['group-gate-', 'keycloak-', 'mcp-gate-', 'wg-'].exists(p, request.name.startsWith(p))
        && size(variables.cmd) == 4 && variables.cmd[0] == '/portcullis-bin/hub' && variables.cmd[1] == 'rev'
        && ((variables.cmd[2] == '/vpn-doc' && variables.cmd[3] == 'vpn')
          || (variables.cmd[2] == '/hub-data'
            && (variables.cmd[3] in ['group-gate-policy', 'user-attributes', 'portal-apps', 'signin-keycloak', 'impersonation', 'mcp-gate', 'mcp-credentials']
              || variables.cmd[3].matches('^probe-[0-9a-f]{16}$'))))
        && !(has(object.stdin) && object.stdin) && !(has(object.tty) && object.tty)
      )
    message: the Hub may exec only hub rev <dir> <doc> in a reader pod of the core namespace
---
# portcullis-ingress-pods (NEW, HA; contract §6 "ingress pods", Amendment
# 3): portcullis-ingress is PSA privileged (baseline forbids hostPort), so
# this is its only pod guard, for every identity (the CLI and the DaemonSet
# controller included): only the Traefik DaemonSet `traefik` and its pods
# (owned by it, and created only by the DaemonSet controller or the CLI:
# a self-declared owner reference isn't enough), the image traefikImage, no
# command or args (the image's entrypoint; Traefik is configured by
# environment), no exec probe but Traefik's own `traefik healthcheck --ping`
# and no lifecycle hook but sleep (each would run a command in the pod that
# holds the DNS credentials), environment variables only of traefikEnv's names (values
# from the traefikSecrets only, no envFrom), ServiceAccount traefik, the
# label app.kubernetes.io/name: traefik, one container (no init or
# ephemeral one), volumes only emptyDir and the named ConfigMaps / Secrets
# (projected too), the PSA restricted profile in every field (non-root, no
# privilege escalation, drop ALL with nothing added, seccomp RuntimeDefault)
# except hostPort 80 / 443 on that container, and no host namespaces. A dry run annotated with another
# params generation (16 hex) is another generation's probe and is let by:
# a dry run persists nothing.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-ingress-pods
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
      - pods/ephemeralcontainers
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - daemonsets
  variables:
  - name: ds
    expression: "object.kind == 'DaemonSet'"
  - name: spec
    expression: 'variables.ds ? object.spec.template.spec : object.spec'
  - name: meta
    expression: 'variables.ds ? object.spec.template.metadata : object.metadata'
  - name: labels
    expression: 'has(variables.meta.labels) ? variables.meta.labels : {}'
  - name: annotations
    expression: 'has(variables.meta.annotations) ? variables.meta.annotations : {}'
  - name: volumes
    expression: 'has(variables.spec.volumes) ? variables.spec.volumes : []'
  - name: cli
    expression: "params.data.cliUsername != '' && request.userInfo.username == params.data.cliUsername"
  # Traefik's only ConfigMaps, Secrets and environment variable names
  # (charts/portcullis/templates/traefik.yaml; tests/k8s_hardening.py holds
  # the rendered pod to these lists). kube-root-ca.crt: the API access volume
  # the ServiceAccount admission plugin adds. traefik-default-cert: the HA
  # Traefik's default certificate document (Task 31 fix round 2, M3).
  - name: traefikConfigMaps
    expression: "['config-traefik-dynamic', 'traefik-dynamic', 'certs', 'kube-root-ca.crt']"
  - name: traefikSecrets
    expression: "['secrets-certs', 'secrets-domains-certs-endpoint', 'portcullis-env', 'traefik-default-cert']"
  - name: traefikEnv
    expression: >-
      ['TRAEFIK_API_DASHBOARD', 'TRAEFIK_API_INSECURE', 'TRAEFIK_LOG_LEVEL', 'TRAEFIK_ACCESSLOG',
       'TRAEFIK_ACCESSLOG_FORMAT', 'TRAEFIK_PING', 'TRAEFIK_ENTRYPOINTS_TRAEFIK_ADDRESS',
       'TRAEFIK_ENTRYPOINTS_TRAEFIK_HTTP_ALIASHEADERSSTRATEGY', 'TRAEFIK_ENTRYPOINTS_METRICS_ADDRESS',
       'TRAEFIK_ENTRYPOINTS_METRICS_HTTP_ALIASHEADERSSTRATEGY', 'TRAEFIK_METRICS_PROMETHEUS',
       'TRAEFIK_METRICS_PROMETHEUS_ENTRYPOINT', 'TRAEFIK_ENTRYPOINTS_WEB_ADDRESS',
       'TRAEFIK_ENTRYPOINTS_WEB_HTTP_ALIASHEADERSSTRATEGY',
       'TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ALIASHEADERSSTRATEGY', 'TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_MIDDLEWARES',
       'TRAEFIK_ENTRYPOINTS_WEBSECURE_ASDEFAULT', 'TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO',
       'TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME', 'TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS',
       'TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_CERTRESOLVER',
       'TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_DOMAINS_0_MAIN',
       'TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_DOMAINS_0_SANS', 'TRAEFIK_ENTRYPOINTS_KCINTERNAL_ADDRESS',
       'TRAEFIK_ENTRYPOINTS_KCINTERNAL_HTTP_ALIASHEADERSSTRATEGY', 'TRAEFIK_ENTRYPOINTS_KCINTERNAL_HTTP_MIDDLEWARES',
       'TRAEFIK_ENTRYPOINTS_VPNSECURE_ADDRESS', 'TRAEFIK_ENTRYPOINTS_VPNSECURE_PROXYPROTOCOL_TRUSTEDIPS',
       'TRAEFIK_ENTRYPOINTS_VPNSECURE_HTTP_ALIASHEADERSSTRATEGY', 'TRAEFIK_ENTRYPOINTS_VPNSECURE_HTTP_MIDDLEWARES',
       'TRAEFIK_ENTRYPOINTS_VPNSECURE_HTTP_TLS_CERTRESOLVER',
       'TRAEFIK_ENTRYPOINTS_VPNSECURE_HTTP_TLS_DOMAINS_0_MAIN',
       'TRAEFIK_ENTRYPOINTS_VPNSECURE_HTTP_TLS_DOMAINS_0_SANS', 'TRAEFIK_ENTRYPOINTS_PARKED_ADDRESS',
       'TRAEFIK_PROVIDERS_KUBERNETESCRD', 'TRAEFIK_PROVIDERS_KUBERNETESCRD_NAMESPACES',
       'TRAEFIK_PROVIDERS_KUBERNETESCRD_ALLOWCROSSNAMESPACE',
       'TRAEFIK_PROVIDERS_KUBERNETESCRD_ALLOWEXTERNALNAMESERVICES',
       'TRAEFIK_PROVIDERS_KUBERNETESCRD_DISABLECLUSTERSCOPERESOURCES', 'TRAEFIK_PROVIDERS_KUBERNETESCRD_SAFENAMING',
       'TRAEFIK_PROVIDERS_FILE_DIRECTORY', 'TRAEFIK_PROVIDERS_FILE_WATCH', 'TRAEFIK_PROVIDERS_HTTP_ENDPOINT',
       'TRAEFIK_PROVIDERS_HTTP_POLLINTERVAL', 'TRAEFIK_PROVIDERS_HTTP_POLLTIMEOUT',
       'TRAEFIK_PROVIDERS_HTTP_MAXRESPONSEBODYSIZE', 'TRAEFIK_PROVIDERS_HTTP_TLS_CA',
       'TRAEFIK_PROVIDERS_HTTP_TLS_CERT', 'TRAEFIK_PROVIDERS_HTTP_TLS_KEY',
       'TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL',
       'TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_STORAGE',
       'TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_CASERVER',
       'TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_DNSCHALLENGE',
       'TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_DNSCHALLENGE_PROVIDER',
       'TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_DNSCHALLENGE_RESOLVERS', 'CF_API_EMAIL', 'GCE_PROJECT',
       'CF_DNS_API_TOKEN', 'PORKBUN_API_KEY', 'PORKBUN_SECRET_API_KEY', 'AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY',
       'AWS_HOSTED_ZONE_ID', 'DO_AUTH_TOKEN', 'HETZNER_API_KEY', 'HETZNER_API_TOKEN']
  - name: otherProbe
    expression: >-
      request.dryRun && has(object.metadata.annotations) && 'portcullis.io/params-generation' in object.metadata.annotations
      && object.metadata.annotations['portcullis.io/params-generation'].matches('^[0-9a-f]{16}$')
      && object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
  validations:
  - expression: >-
      !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
      || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
    messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
  - expression: |-
      variables.otherProbe || (
        (variables.ds ? object.metadata.name == 'traefik'
          : (has(object.metadata.ownerReferences) && size(object.metadata.ownerReferences) <= 8
             && object.metadata.ownerReferences.exists(o, o.apiVersion == 'apps/v1' && o.kind == 'DaemonSet' && o.name == 'traefik'
               && has(o.controller) && o.controller)))
        && 'app.kubernetes.io/name' in variables.labels && variables.labels['app.kubernetes.io/name'] == 'traefik'
        && has(variables.spec.serviceAccountName) && variables.spec.serviceAccountName == 'traefik'
        && size(variables.spec.containers) == 1
        && (!has(variables.spec.initContainers) || size(variables.spec.initContainers) == 0)
        && (!has(variables.spec.ephemeralContainers) || size(variables.spec.ephemeralContainers) == 0)
        && !(has(variables.spec.hostNetwork) && variables.spec.hostNetwork)
        && !(has(variables.spec.hostPID) && variables.spec.hostPID)
        && !(has(variables.spec.hostIPC) && variables.spec.hostIPC)
        && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsUser) && variables.spec.securityContext.runAsUser == 0)
        && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.windowsOptions) && has(variables.spec.securityContext.windowsOptions.hostProcess) && variables.spec.securityContext.windowsOptions.hostProcess)
        && !(has(variables.spec.securityContext) && has(variables.spec.securityContext.appArmorProfile) && variables.spec.securityContext.appArmorProfile.type == 'Unconfined')
        && (!has(variables.spec.securityContext) || !has(variables.spec.securityContext.seLinuxOptions) || (!has(variables.spec.securityContext.seLinuxOptions.user) && !has(variables.spec.securityContext.seLinuxOptions.role)
            && (!has(variables.spec.securityContext.seLinuxOptions.type) || variables.spec.securityContext.seLinuxOptions.type in ['container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t'])))
        && (!has(variables.spec.securityContext) || !has(variables.spec.securityContext.sysctls) || (size(variables.spec.securityContext.sysctls) <= 32 && variables.spec.securityContext.sysctls.all(s, s.name in ['kernel.shm_rmid_forced',
            'net.ipv4.ip_local_port_range', 'net.ipv4.ip_unprivileged_port_start', 'net.ipv4.tcp_syncookies', 'net.ipv4.ping_group_range',
            'net.ipv4.ip_local_reserved_ports', 'net.ipv4.tcp_keepalive_time', 'net.ipv4.tcp_fin_timeout', 'net.ipv4.tcp_keepalive_intvl',
            'net.ipv4.tcp_keepalive_probes'])))
        && size(variables.annotations) <= 64
        && variables.annotations.all(k, !k.startsWith('container.apparmor.security.beta.kubernetes.io/') || variables.annotations[k] != 'unconfined')
        && (variables.ds || request.operation != 'CREATE' || variables.cli
            || request.userInfo.username in ['system:serviceaccount:kube-system:daemon-set-controller', 'system:kube-controller-manager'])
        && size(variables.volumes) <= 32 && variables.volumes.all(v, has(v.emptyDir)
            || (has(v.configMap) && v.configMap.name in variables.traefikConfigMaps)
            || (has(v.secret) && v.secret.secretName in variables.traefikSecrets)
            || (has(v.projected) && has(v.projected.sources) && size(v.projected.sources) <= 8 && v.projected.sources.all(src,
                 (has(src.configMap) && src.configMap.name in variables.traefikConfigMaps)
                 || (has(src.secret) && src.secret.name in variables.traefikSecrets)
                 || has(src.downwardAPI) || (has(src.serviceAccountToken) && !has(src.serviceAccountToken.audience)))))
        && variables.spec.containers.all(c, c.image == params.data.traefikImage && has(c.securityContext)
          && (!has(c.command) || size(c.command) == 0) && (!has(c.args) || size(c.args) == 0)
          && (!has(c.envFrom) || size(c.envFrom) == 0)
          && (!has(c.startupProbe) || !has(c.startupProbe.exec) || (has(c.startupProbe.exec.command) && c.startupProbe.exec.command == ['traefik', 'healthcheck', '--ping']))
          && (!has(c.livenessProbe) || !has(c.livenessProbe.exec) || (has(c.livenessProbe.exec.command) && c.livenessProbe.exec.command == ['traefik', 'healthcheck', '--ping']))
          && (!has(c.readinessProbe) || !has(c.readinessProbe.exec) || (has(c.readinessProbe.exec.command) && c.readinessProbe.exec.command == ['traefik', 'healthcheck', '--ping']))
          && (!has(c.lifecycle) || ((!has(c.lifecycle.postStart) || (!has(c.lifecycle.postStart.exec) && !has(c.lifecycle.postStart.httpGet) && !has(c.lifecycle.postStart.tcpSocket)))
              && (!has(c.lifecycle.preStop) || (!has(c.lifecycle.preStop.exec) && !has(c.lifecycle.preStop.httpGet) && !has(c.lifecycle.preStop.tcpSocket)))))
          && (!has(c.env) || (size(c.env) <= 96 && c.env.all(e, e.name in variables.traefikEnv
              && (!has(e.valueFrom) || (has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name in variables.traefikSecrets
                  && !has(e.valueFrom.configMapKeyRef) && !has(e.valueFrom.fieldRef) && !has(e.valueFrom.resourceFieldRef))))))
          && !(has(c.securityContext.privileged) && c.securityContext.privileged)
          && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false
          && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop
          && (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0)
          && (has(c.securityContext.runAsNonRoot) ? c.securityContext.runAsNonRoot
              : (has(variables.spec.securityContext) && has(variables.spec.securityContext.runAsNonRoot) && variables.spec.securityContext.runAsNonRoot))
          && !(has(c.securityContext.runAsUser) && c.securityContext.runAsUser == 0)
          && (has(c.securityContext.seccompProfile) ? c.securityContext.seccompProfile.type == 'RuntimeDefault'
              : (has(variables.spec.securityContext) && has(variables.spec.securityContext.seccompProfile) && variables.spec.securityContext.seccompProfile.type == 'RuntimeDefault'))
          && (!has(c.securityContext.procMount) || c.securityContext.procMount == 'Default')
          && !(has(c.securityContext.windowsOptions) && has(c.securityContext.windowsOptions.hostProcess) && c.securityContext.windowsOptions.hostProcess)
          && !(has(c.securityContext.appArmorProfile) && c.securityContext.appArmorProfile.type == 'Unconfined')
          && (!has(c.securityContext.seLinuxOptions) || (!has(c.securityContext.seLinuxOptions.user) && !has(c.securityContext.seLinuxOptions.role)
              && (!has(c.securityContext.seLinuxOptions.type) || c.securityContext.seLinuxOptions.type in ['container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t'])))
          && (!has(c.ports) || (size(c.ports) <= 16 && c.ports.all(p, !has(p.hostPort) || p.hostPort in [0, 80, 443]))))
      )
    message: only the Traefik DaemonSet's pod shape may run in portcullis-ingress
---
# portcullis-node-labels (NEW, HA; ruling R-NODELABELS, contract §6, §20.11):
# a kubelet may write labels on its own Node, and NodeRestriction leaves
# these prefixes alone (topology.kubernetes.io/zone it even allows), so a
# compromised node could label itself to attract main-pinned data pods. For
# node identities (group system:nodes; matchConditions, so every other
# identity, the CLI and nodeadm among them, is never judged here), a Node
# CREATE or UPDATE (status included) may not add, change or remove a label
# under portcullis.io/, topology.kubernetes.io/,
# failure-domain.beta.kubernetes.io/, node.longhorn.io/ or
# svccontroller.k3s.cattle.io/, nor a taint under portcullis.io/ or
# nodeadm.portcullis/; a CREATE carrying any of those labels is refused, and
# a CREATE must carry exactly nodeadm.portcullis/unlabelled=true:NoSchedule
# among those taints (the join flags register it; nodeadm drops it once it
# has labelled the Node). A node identity never deletes a Node (a delete and
# re-register would shed nodeadm's labels). kubernetes.io/hostname (Runs on's node
# pins and the hostname spread) must be the Node's own name and never
# change or go (a kubelet could otherwise take another node's name and
# attract its pinned pods). The binding's namespaceSelector is the
# core namespace's only for the CLI's rewrite: a Node is cluster-scoped and
# never skipped by it. The probe: a node identity's dry-run Node annotated
# with the generation. HA (plan Task 24): the fencing and Longhorn
# ServiceAccounts (portcullis-fencing, longhorn-system: SNR patches Nodes'
# taints on every node it runs on) are judged as node identities: their
# own taints (remediation.medik8s.io/self-node-remediation,
# node.kubernetes.io/out-of-service) pass, a
# placement label or a Portcullis taint never does; SNR's agent (its own
# ServiceAccount) only annotates its own Node; SNR's manager only changes
# taints. Round 3: none of these identities sets a remediation.medik8s.io/
# label (SNR's exclude-from-remediation: an admin's), a nodeadm.portcullis/
# annotation or spec.unschedulable — the storm guard's inputs. Round 4:
# nor an owner reference or a finalizer (a dangling owner would have the
# garbage collector delete the Node); SNR's manager changes nothing but
# its own two taints, exactly as SNR v0.13.0 writes them
# (internal/controller/selfnoderemediation_controller.go NodeNoScheduleTaint
# remediation.medik8s.io/self-node-remediation:NoSchedule, no value;
# OutOfServiceTaint node.kubernetes.io/out-of-service=nodeshutdown:NoExecute;
# round 5 C1).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-node-labels
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - nodes
      - nodes/status
  matchConditions:
  - name: node-identities
    expression: >-
      'system:nodes' in request.userInfo.groups
      || request.userInfo.username.startsWith('system:serviceaccount:portcullis-fencing:')
      || request.userInfo.username.startsWith('system:serviceaccount:longhorn-system:')
  variables:
  - name: placed
    expression: "['portcullis.io/', 'topology.kubernetes.io/', 'failure-domain.beta.kubernetes.io/', 'node.longhorn.io/', 'svccontroller.k3s.cattle.io/', 'remediation.medik8s.io/']"
  # The annotations only nodeadm (or the CLI) sets or drops.
  - name: annPrefixes
    expression: "['nodeadm.portcullis/']"
  - name: newAnn
    expression: "request.operation != 'DELETE' && has(object.metadata.annotations) ? object.metadata.annotations : {}"
  - name: oldAnn
    expression: "request.operation == 'UPDATE' && has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
  # Review round 4 M2: owners and finalizers (a dangling owner makes the
  # garbage collector delete the Node; a finalizer stalls its removal).
  - name: newOwners
    expression: "request.operation != 'DELETE' && has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []"
  - name: oldOwners
    expression: "request.operation == 'UPDATE' && has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : []"
  - name: newFinalizers
    expression: "request.operation != 'DELETE' && has(object.metadata.finalizers) ? object.metadata.finalizers : []"
  - name: oldFinalizers
    expression: "request.operation == 'UPDATE' && has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []"
  # SNR's manager may add / remove only its own two taints, key, value and
  # effect as SNR v0.13.0 writes them (round 4 nit 4, round 5 C1):
  # NodeNoScheduleTaint and OutOfServiceTaint.
  - name: newOtherTaints
    expression: >-
      request.operation != 'DELETE' && has(object.spec.taints)
      ? object.spec.taints.filter(t, !((t.key == 'remediation.medik8s.io/self-node-remediation' && t.effect == 'NoSchedule' && (!has(t.value) || t.value == ''))
          || (t.key == 'node.kubernetes.io/out-of-service' && t.effect == 'NoExecute' && has(t.value) && t.value == 'nodeshutdown'))) : []
  - name: oldOtherTaints
    expression: >-
      request.operation == 'UPDATE' && has(oldObject.spec.taints)
      ? oldObject.spec.taints.filter(t, !((t.key == 'remediation.medik8s.io/self-node-remediation' && t.effect == 'NoSchedule' && (!has(t.value) || t.value == ''))
          || (t.key == 'node.kubernetes.io/out-of-service' && t.effect == 'NoExecute' && has(t.value) && t.value == 'nodeshutdown'))) : []
  - name: newUnsched
    expression: "request.operation != 'DELETE' && has(object.spec.unschedulable) && object.spec.unschedulable"
  - name: oldUnsched
    expression: "request.operation == 'UPDATE' && has(oldObject.spec.unschedulable) && oldObject.spec.unschedulable"
  # The taints only nodeadm (or the CLI) sets or drops.
  - name: taintPrefixes
    expression: "['portcullis.io/', 'nodeadm.portcullis/']"
  - name: newLabels
    expression: "request.operation != 'DELETE' && has(object.metadata.labels) ? object.metadata.labels : {}"
  - name: oldLabels
    expression: "request.operation == 'UPDATE' && has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
  - name: newTaints
    expression: >-
      request.operation != 'DELETE' && has(object.spec.taints)
      ? object.spec.taints.filter(t, variables.taintPrefixes.exists(p, t.key.startsWith(p))) : []
  - name: oldTaints
    expression: >-
      request.operation == 'UPDATE' && has(oldObject.spec.taints)
      ? oldObject.spec.taints.filter(t, variables.taintPrefixes.exists(p, t.key.startsWith(p))) : []
  validations:
  - expression: >-
      request.operation == 'DELETE' || !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
      || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
    messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
  - expression: |-
      request.operation != 'DELETE' && size(variables.newLabels) <= 256 && size(variables.oldLabels) <= 256
      && variables.newLabels.all(k, !variables.placed.exists(p, k.startsWith(p))
           || (k in variables.oldLabels && variables.oldLabels[k] == variables.newLabels[k]))
      && variables.oldLabels.all(k, !variables.placed.exists(p, k.startsWith(p)) || k in variables.newLabels)
      && size(variables.newTaints) <= 32 && size(variables.oldTaints) <= 32
      && (request.operation == 'CREATE'
          ? (size(variables.newTaints) == 1 && variables.newTaints[0].key == 'nodeadm.portcullis/unlabelled'
             && has(variables.newTaints[0].value) && variables.newTaints[0].value == 'true' && variables.newTaints[0].effect == 'NoSchedule')
          : (variables.newTaints.all(t, t in variables.oldTaints) && variables.oldTaints.all(t, t in variables.newTaints)))
      && (!('kubernetes.io/hostname' in variables.newLabels) || variables.newLabels['kubernetes.io/hostname'] == object.metadata.name)
      && (!('kubernetes.io/hostname' in variables.oldLabels) || ('kubernetes.io/hostname' in variables.newLabels
           && variables.newLabels['kubernetes.io/hostname'] == variables.oldLabels['kubernetes.io/hostname']))
    message: nodes can't set Portcullis placement labels or taints; nodeadm sets them
  # Plan Task 24 fix round 3 (I1): the storm guard's inputs. No node
  # identity or fencing / Longhorn ServiceAccount adds, changes or drops a
  # nodeadm.portcullis/ annotation, or cordons / uncordons a Node (the
  # remediation.medik8s.io/ labels are in variables.placed).
  - expression: >-
      request.operation == 'DELETE' || (size(variables.newAnn) <= 256 && size(variables.oldAnn) <= 256
        && variables.newAnn.all(k, !variables.annPrefixes.exists(p, k.startsWith(p))
             || (k in variables.oldAnn && variables.oldAnn[k] == variables.newAnn[k]))
        && variables.oldAnn.all(k, !variables.annPrefixes.exists(p, k.startsWith(p)) || k in variables.newAnn)
        && variables.newUnsched == variables.oldUnsched)
    message: nodes can't set nodeadm's annotations or cordon a Node; nodeadm and the CLI do
  # Review round 4 M2: no matched identity adds, changes or drops an owner
  # reference or a finalizer (none on a CREATE).
  - expression: >-
      request.operation == 'DELETE' || (size(variables.newOwners) <= 16 && size(variables.oldOwners) <= 16
        && size(variables.newFinalizers) <= 16 && size(variables.oldFinalizers) <= 16
        && size(variables.newOwners) == size(variables.oldOwners)
        && variables.newOwners.all(o, o in variables.oldOwners) && variables.oldOwners.all(o, o in variables.newOwners)
        && size(variables.newFinalizers) == size(variables.oldFinalizers)
        && variables.newFinalizers.all(f, f in variables.oldFinalizers) && variables.oldFinalizers.all(f, f in variables.newFinalizers))
    message: nodes can't set a Node's owner references or finalizers
  # SNR's manager (round 3 I1c, round 4 M2 + nit 4, round 5): the whole Node
  # but its taints unchanged — labels, annotations, owners, finalizers (the
  # rule above) and every other field of v1 NodeSpec (podCIDR, podCIDRs,
  # providerID, unschedulable, configSource, externalID; nodeadm's
  # TestManagerRuleJudgesEveryNodeSpecField holds the list to the vendored
  # k8s.io/api; podPreemptionPolicy, alpha and forbidden while its gate is
  # off, isn't referenced: the 1.33 floor's schema lacks it) — and of the
  # taints only its own
  # remediation.medik8s.io/self-node-remediation:NoSchedule and
  # node.kubernetes.io/out-of-service=nodeshutdown:NoExecute put or lifted.
  - expression: >-
      request.userInfo.username != 'system:serviceaccount:portcullis-fencing:self-node-remediation-controller-manager'
      || (request.operation == 'UPDATE' && (has(request.subResource) ? request.subResource : '') == ''
          && variables.newLabels == variables.oldLabels && variables.newAnn == variables.oldAnn
          && (has(object.spec.podCIDR) ? object.spec.podCIDR : '') == (has(oldObject.spec.podCIDR) ? oldObject.spec.podCIDR : '')
          && (has(object.spec.podCIDRs) ? object.spec.podCIDRs : []) == (has(oldObject.spec.podCIDRs) ? oldObject.spec.podCIDRs : [])
          && (has(object.spec.providerID) ? object.spec.providerID : '') == (has(oldObject.spec.providerID) ? oldObject.spec.providerID : '')
          && (has(object.spec.unschedulable) && object.spec.unschedulable) == (has(oldObject.spec.unschedulable) && oldObject.spec.unschedulable)
          && !has(object.spec.configSource) && !has(object.spec.externalID)
          && size(variables.newOtherTaints) <= 32 && size(variables.oldOtherTaints) <= 32
          && size(variables.newOtherTaints) == size(variables.oldOtherTaints)
          && variables.newOtherTaints.all(t, t in variables.oldOtherTaints) && variables.oldOtherTaints.all(t, t in variables.newOtherTaints))
    message: SNR's manager may only put or lift its remediation and out-of-service taints
  # SNR's agent (plan Task 24, security ruling: the DaemonSet runs on every
  # node, edge and small ones too): only its own Node (the bound token's
  # node name), only an UPDATE, and only the annotations change.
  - expression: >-
      request.userInfo.username != 'system:serviceaccount:portcullis-fencing:self-node-remediation-agent'
      || (request.operation == 'UPDATE' && (has(request.subResource) ? request.subResource : '') == ''
          && 'authentication.kubernetes.io/node-name' in request.userInfo.extra
          && request.userInfo.extra['authentication.kubernetes.io/node-name'].exists(n, n == object.metadata.name)
          && object.spec == oldObject.spec && variables.newLabels == variables.oldLabels)
    message: SNR's agent may only annotate its own Node
---
# portcullis-frontdoor-status (NEW, HA; plan Task 28 fix round 1, contract
# §12.4, §20.8): frontdoor-status steers every added domain's addresses
# (the domains service follows it), so in the core namespace only the
# front door's ServiceAccount (system:serviceaccount:<ns>:frontdoor) and
# the CLI may write the ConfigMap frontdoor-status — not another
# ServiceAccount, not an operator with cluster-wide ConfigMap rights
# (Longhorn's, for one) —, the front door only by UPDATE, and only as its
# own pod: the key leader and status.json's "leader" must both be the pod
# name its bound token carries (authentication.kubernetes.io/pod-name), so
# a follower knows who wrote it. The probe: a dry-run CREATE of
# frontdoor-status annotated with the generation; another generation's
# probe (a dry run with its 16 hex) is let by.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-frontdoor-status
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - configmaps
      # Only this ConfigMap reaches the binding: a binding whose params are
      # missing denies every request it matches, so it must never match the
      # core namespace's other ConfigMaps (the params themselves among them:
      # the CLI could no longer repair them).
      resourceNames:
      - frontdoor-status
  matchConditions:
  - name: frontdoor-status
    expression: "request.name == 'frontdoor-status'"
  variables:
  - name: cli
    expression: "'cliUsername' in params.data && params.data.cliUsername != '' && request.userInfo.username == params.data.cliUsername"
  - name: frontdoor
    expression: "request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':frontdoor'"
  - name: pod
    expression: >-
      has(request.userInfo.extra) && 'authentication.kubernetes.io/pod-name' in request.userInfo.extra
      && size(request.userInfo.extra['authentication.kubernetes.io/pod-name']) == 1
      ? request.userInfo.extra['authentication.kubernetes.io/pod-name'][0] : ''
  # Another params generation's probe (a dry run annotated with its 16
  # hex): let by, so that generation's own binding is the one that refuses
  # it (every policy refuses exactly its own generation first; found in CI).
  - name: otherProbe
    expression: >-
      request.dryRun && request.operation != 'DELETE' && has(object.metadata.annotations) && 'portcullis.io/params-generation' in object.metadata.annotations
      && object.metadata.annotations['portcullis.io/params-generation'].matches('^[0-9a-f]{16}$')
      && object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
  validations:
  - expression: >-
      request.operation == 'DELETE' || !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
      || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
    messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
  - expression: "variables.cli || variables.otherProbe || variables.frontdoor"
    message: only the front door (and the CLI) may write frontdoor-status
  - expression: "variables.cli || variables.otherProbe || request.operation == 'UPDATE'"
    message: the front door only updates frontdoor-status (the chart creates it)
  - expression: >-
      variables.cli || variables.otherProbe || (variables.pod != '' && has(object.data) && 'leader' in object.data && object.data['leader'] == variables.pod
        && 'status.json' in object.data && object.data['status.json'].contains('"leader":"' + variables.pod + '"'))
    message: the front door writes frontdoor-status only as its own pod (leader = its pod name)
---
# portcullis-ingress-default-cert (NEW, HA; Task 31 fix round 2, security
# review): traefik-default-cert in the ingress namespace is the HA
# Traefik's default certificate, projected into its watched directory as
# default-cert/tls.crt|tls.key beside the chart's own 00-default-cert.yml.
# Only the CLI creates or deletes it; the front door's ServiceAccount
# (system:serviceaccount:<core ns>:frontdoor, the core namespace of
# params hubServiceAccount) may only update it, keeping it type
# kubernetes.io/tls with exactly tls.crt and tls.key and its labels and
# annotations: it can replace a certificate, never add a file Traefik
# would read as configuration. Every other identity is refused. The
# probe: a dry-run CREATE of traefik-default-cert annotated with the
# generation; another generation's probe (a dry run with its 16 hex) is let by.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-ingress-default-cert
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - secrets
      # Only this Secret reaches the binding (a binding whose params are
      # missing denies every request it matches).
      resourceNames:
      - traefik-default-cert
  matchConditions:
  - name: traefik-default-cert
    expression: "request.name == 'traefik-default-cert'"
  variables:
  - name: cli
    expression: "'cliUsername' in params.data && params.data.cliUsername != '' && request.userInfo.username == params.data.cliUsername"
  - name: frontdoor
    expression: >-
      'hubServiceAccount' in params.data && params.data.hubServiceAccount.endsWith(':portcullis-hub')
      && request.userInfo.username == params.data.hubServiceAccount.replace(':portcullis-hub', ':frontdoor')
  - name: otherProbe
    expression: >-
      request.dryRun && request.operation != 'DELETE' && has(object.metadata.annotations) && 'portcullis.io/params-generation' in object.metadata.annotations
      && object.metadata.annotations['portcullis.io/params-generation'].matches('^[0-9a-f]{16}$')
      && object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
  validations:
  - expression: >-
      request.operation == 'DELETE' || !has(object.metadata.annotations) || !('portcullis.io/params-generation' in object.metadata.annotations)
      || object.metadata.annotations['portcullis.io/params-generation'] != params.data.generation
    messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
  - expression: "variables.cli || variables.otherProbe || variables.frontdoor"
    message: only the front door (and the CLI) may write traefik-default-cert
  - expression: "variables.cli || variables.otherProbe || request.operation == 'UPDATE'"
    message: the front door only updates traefik-default-cert (the CLI creates it)
  - expression: >-
      variables.cli || variables.otherProbe || request.operation != 'UPDATE'
      || (has(object.type) && object.type == 'kubernetes.io/tls' && has(object.data) && size(object.data) == 2
        && 'tls.crt' in object.data && 'tls.key' in object.data
        && (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {})
        && (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}))
    message: traefik-default-cert stays type kubernetes.io/tls with exactly tls.crt and tls.key, its labels and annotations unchanged
---
# portcullis-removed-nodes (NEW, HA; Task 30 fix rounds 1 and 2): a removed
# or revoked node's kubelet client certificate (system:node:<name>, k3s's
# client CA, about a year) still authenticates after its removal, so with
# the API reachable it could register its Node again, file CSRs (a signed
# self-renewal would extend its credential) and from a Node get kubelet
# certificates and a new node-password. No node identity (group
# system:nodes, or a system:node:* username with or without the group)
# creates or updates a Node (nodes, nodes/status) whose name, or whose
# identity's own name, nodeadm lists removed, nor creates a
# CertificateSigningRequest as (or for, spec.username, which the API server
# sets to the requester) a listed name.
# Its params are its own (fix round 2, R-I2): the ConfigMap
# portcullis-removed-nodes in the core namespace (binding
# portcullis-nodes-guard-removed, a fixed name outside the CLI's params
# generations), created empty by the CLI and updated in place by nodeadm
# alone, which confirms each write on every API server with this policy's
# probe BEFORE it deletes a removed node's Node (nodeadm/removedparams.go).
# Params without removedNodes (or without data) refuse every node
# identity's Node and CSR write (R-M2: fail closed; a missing ConfigMap is
# the binding's parameterNotFoundAction Deny). A cooperatively removed name
# leaves the list once a new node enrols under it (never at code issue), a
# revoked one never. The API server exposes no client certificate serial to
# a policy, so a re-used name can't be bound to the new node's certificate:
# the name stays refused until that enrolment. Controllers and the CLI
# aren't matched (a parked revoke's Node is still marked NotReady by the
# node lifecycle controller). The probe identities (system:node:
# portcullis-admission-*, ids nodeadm and the CLI never enrol) write only
# in a dry run. The probe: its own annotation
# portcullis.io/removed-nodes-generation (the probe Node of
# portcullis-node-labels carries portcullis.io/params-generation, which
# this policy doesn't read, so each binding refuses only its own probe),
# on a Node otherwise admissible by both policies; the rules run in order
# and the API server reports the first refusal, so params lacking the key
# never confirm a probe.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: portcullis-removed-nodes
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - nodes
      - nodes/status
    - apiGroups:
      - certificates.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - certificatesigningrequests
  matchConditions:
  - name: node-identities
    expression: "'system:nodes' in request.userInfo.groups || request.userInfo.username.startsWith('system:node:')"
  variables:
  - name: keyed
    expression: "has(params.data) && has(params.data.removedNodes) && has(params.data.generation)"
  - name: removed
    expression: "variables.keyed ? params.data.removedNodes.split(' ').filter(n, n != '') : []"
  - name: self
    expression: "request.userInfo.username.startsWith('system:node:') ? request.userInfo.username.substring(12) : ''"
  - name: csr
    expression: "request.resource.group == 'certificates.k8s.io'"
  validations:
  - expression: variables.keyed
    message: "the removed-node params (ConfigMap portcullis-removed-nodes) lack removedNodes: every node identity's Node and CSR write is refused"
  - expression: >-
      !has(object.metadata.annotations) || !('portcullis.io/removed-nodes-generation' in object.metadata.annotations)
      || object.metadata.annotations['portcullis.io/removed-nodes-generation'] != params.data.generation
    messageExpression: "'admission probe: params generation ' + params.data.generation + ' in effect'"
  - expression: "!variables.self.startsWith('portcullis-admission-') || request.dryRun"
    message: the admission probe identity writes only in a dry run
  - expression: "variables.csr || (!(object.metadata.name in variables.removed) && !(variables.self in variables.removed))"
    messageExpression: >-
      'node ' + (variables.self in variables.removed ? variables.self : object.metadata.name)
      + ' was removed from the cluster: its kubelet identity can neither register nor update a Node (a removed name is freed when a new node enrols under it, a revoked one never)'
  - expression: >-
      !variables.csr || (!(variables.self in variables.removed)
        && !(has(object.spec.username) && object.spec.username.startsWith('system:node:') && object.spec.username.substring(12) in variables.removed))
    messageExpression: >-
      'node ' + (variables.self in variables.removed ? variables.self : object.spec.username.substring(12))
      + ' was removed from the cluster: its kubelet identity can file no certificate signing request'
