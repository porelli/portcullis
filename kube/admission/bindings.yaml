# One binding per policy (a binding binds exactly one policy, Task 0 Q4;
# K6 / K-P1): portcullis-apps-guard-<policy>, the apps namespace only,
# portcullis-edge-guard-routes on portcullis-edge, and (NEW, HA)
# portcullis-core-guard-exec and portcullis-nodeadm-guard-admission on the
# core namespace, portcullis-nodeadm-guard-tokens on kube-system and
# portcullis-ingress-guard-pods on portcullis-ingress (ten); the params ConfigMap
# portcullis-admission-params in the core namespace (no Role of the Hub
# there; nodeadm may only create new generations, judged by
# portcullis-nodeadm-admission; missing = deny), Deny. The CLI applies each as
# <name>-<params generation> on portcullis-admission-params-<generation>,
# create-before-delete (scripts/lib/kube.sh kube_admission_params_apply).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: portcullis-apps-guard-pods
spec:
  policyName: portcullis-apps-pods
  validationActions: ["Deny"]
  paramRef:
    name: portcullis-admission-params
    namespace: portcullis
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: portcullis-apps
---
