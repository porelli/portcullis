# One binding per policy (a binding binds exactly one policy, Task 0 Q4;
# K6 / K-P1): portcullis-apps-guard-<policy>, the apps namespace only, and
# portcullis-edge-guard-routes on portcullis-edge; the params ConfigMap
# portcullis-admission-params (missing = deny), Deny.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: portcullis-apps-guard-pods
spec:
  policyName: portcullis-apps-pods
  validationActions: ["Deny"]
  paramRef:
    name: portcullis-admission-params
    namespace: portcullis-apps
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: portcullis-apps
---
