# The probe's default deny (both directions) and the two clients that must
# NOT reach the server, one per direction (each dial fails only when that
# direction is enforced):
#   client-ingress: its egress to the server is allowed, the server's
#                   ingress doesn't admit it — proves ingress enforcement;
#   client-egress:  the server's ingress admits it, it has no egress
#                   allowance — proves egress enforcement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: portcullis-netpol-probe
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-ingress
  namespace: portcullis-netpol-probe
spec:
  podSelector:
    matchLabels:
      portcullis.io/probe: server
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: portcullis.io/probe
                operator: In
                values: ["allowed", "egress-test"]
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-test-egress
  namespace: portcullis-netpol-probe
spec:
  podSelector:
    matchLabels:
      portcullis.io/probe: ingress-test
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              portcullis.io/probe: server
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: client-ingress
  namespace: portcullis-netpol-probe
  labels:
    portcullis.io/probe: ingress-test
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: docker.io/library/alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      command: ["sleep", "600"]
      resources:
        limits:
          memory: 16Mi
        requests:
          memory: 16Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client-egress
  namespace: portcullis-netpol-probe
  labels:
    portcullis.io/probe: egress-test
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: docker.io/library/alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      command: ["sleep", "600"]
      resources:
        limits:
          memory: 16Mi
        requests:
          memory: 16Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
