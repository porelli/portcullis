# CloudNativePG's barman-cloud plugin v0.16.0 (plan Amendments 1–2, Task
# 26: the CNPG WAL archive and base backups to the backup destination), the
# release asset upstream/plugin-barman-cloud-v0.16.0.yaml verbatim (sha256
# pinned in scripts/lib/ha.sh), in cnpg-system (the CNPG operator finds it
# there: the Service's cnpg.io/pluginName, its client / server certificate
# Secrets named by the Service's annotations, read in the operator's own
# namespace; the plugin mounts both Secrets as volumes, so its certificates
# are cert-manager's in cnpg-system — Task 25's question, answered from the
# pinned manifest). This overlay:
#   - pins the plugin image and the sidecar CNPG injects into the instances
#     (SIDECAR_IMAGE) by digest; the upstream Secret that carried the
#     sidecar's tag is dropped;
#   - WATCH_NAMESPACE=cnpg-system (internal/cnpgi/operator/manager.go: the
#     informer cache restricted to it, "so the plugin only needs namespaced
#     RBAC there") and replaces every ClusterRole / ClusterRoleBinding and
#     the leader-election Role with rbac.yaml's (Roles in cnpg-system);
#   - our PriorityClass (ruling I5), a memory request = limit, log level
#     info, no metrics listener (upstream's default "0").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream/plugin-barman-cloud-v0.16.0.yaml
  - rbac.yaml
images:
  - name: ghcr.io/cloudnative-pg/plugin-barman-cloud
    newTag: v0.16.0
    digest: sha256:6404a416718bd7aad943c67a25a7bb20d0558b43edfeab0bf167f013ca435882
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata: {name: plugin-barman-cloud-5kkd8f288d, namespace: cnpg-system}
  - target: {kind: "ClusterRole|ClusterRoleBinding"}
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: {name: unused}
  - target: {kind: "Role|RoleBinding", name: "barman-plugin-leader-election-role|barman-plugin-leader-election-rolebinding"}
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata: {name: unused}
  - target: {kind: Deployment, name: barman-cloud}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - operator
          - --server-cert=/server/tls.crt
          - --server-key=/server/tls.key
          - --client-cert=/client/tls.crt
          - --server-address=:9090
          - --leader-elect
          - --log-level=info
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: SIDECAR_IMAGE
            value: ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.16.0@sha256:c669259e20ed1e11fad821f735c396c19d929985aa05b9544b13ecc8b5a386d0
          - name: WATCH_NAMESPACE
            value: cnpg-system
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          limits: {memory: 256Mi}
          requests: {memory: 256Mi}
      - op: add
        path: /spec/template/spec/priorityClassName
        value: portcullis-core
