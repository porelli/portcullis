# The CloudNativePG operator's RBAC (plan Task 23, review I2), applied by
# ./portcullis (ha_install_cnpg, server-side) before the chart, which runs
# with rbac.create: false. The rules are the vendored chart's (0.29.2,
# config.clusterWide false: its Role in cnpg-system and its cluster-wide
# rules), with one change: the chart lets the operator get / patch EVERY
# mutating / validating webhook configuration (to inject its CA bundle);
# here only its own two, by resourceNames (their names carry the namespace
# suffix: ENABLE_WEBHOOK_NAMESPACE_SUFFIX). tests/k8s_hardening.py
# check_cnpg holds the Role equal to the chart's and the ClusterRole to
# exactly these rules; e2e-k3s checks `auth can-i` live.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portcullis-cnpg-operator
  labels:
    app.kubernetes.io/managed-by: portcullis
    app.kubernetes.io/name: cloudnative-pg
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  resourceNames:
  - cnpg-mutating-webhook-configuration-cnpg-system
  verbs:
  - get
  - patch
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingwebhookconfigurations
  resourceNames:
  - cnpg-validating-webhook-configuration-cnpg-system
  verbs:
  - get
  - patch
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusterimagecatalogs
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portcullis-cnpg-operator
  labels:
    app.kubernetes.io/managed-by: portcullis
    app.kubernetes.io/name: cloudnative-pg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portcullis-cnpg-operator
subjects:
- kind: ServiceAccount
  name: cnpg-cloudnative-pg
  namespace: cnpg-system
---
