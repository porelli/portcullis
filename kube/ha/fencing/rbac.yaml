# The fencing identities' rights, narrowed from the SNR CSV's
# clusterPermissions (review lesson Task 23 I2; fix round 1, user ruling
# "Patch SNR, drop NHC"; tests/k8s_hardening.py check_ha_infra holds them
# to this and to a subset of the CSV's). Our SNR image (snr-patch/) caches
# one Secret only: its peers' certificate in portcullis-fencing, by name.
#   - SNR's manager (a Deployment pinned to the primary site's non-small
#     nodes): Nodes read and patched (its taints only: RBAC can't narrow
#     fields, portcullis-node-labels refuses any other change), no Node
#     create / delete, no pod or VolumeAttachment deletion (the
#     OutOfServiceTaint strategy: the taint makes Kubernetes delete them);
#     its DaemonSet and its certificate Secret written in portcullis-fencing
#     only, by name (create can't be named); no Secret anywhere else;
#   - SNR's agents (the DaemonSet on every node) have their OWN
#     ServiceAccount (agent-daemonset.yaml.tmpl): Nodes read and updated —
#     by the admission policy portcullis-node-labels only its own Node's
#     annotations —, SelfNodeRemediations read; in portcullis-fencing only
#     its peers' pods and one Secret, the peers' certificate, by name (get /
#     list / watch with the patched cache's metadata.name field selector;
#     fix round 2, review M5: the patch scopes the agent's pod cache too);
#   - no Node Healthcheck (nodeadm creates the SelfNodeRemediations: its
#     Role in the chart, templates/nodeadm.yaml);
#   - pods in portcullis-fencing: only these shapes (admission.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portcullis-snr
  labels: {app.kubernetes.io/managed-by: portcullis}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [self-node-remediation.medik8s.io]
    resources: [selfnoderemediationconfigs, selfnoderemediations, selfnoderemediationtemplates]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [self-node-remediation.medik8s.io]
    resources: [selfnoderemediationconfigs/finalizers, selfnoderemediations/finalizers, selfnoderemediationtemplates/finalizers]
    verbs: [update]
  - apiGroups: [self-node-remediation.medik8s.io]
    resources: [selfnoderemediationconfigs/status, selfnoderemediations/status, selfnoderemediationtemplates/status]
    verbs: [get, patch, update]
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portcullis-snr
  labels: {app.kubernetes.io/managed-by: portcullis}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: portcullis-snr}
subjects:
  - {kind: ServiceAccount, name: self-node-remediation-controller-manager, namespace: portcullis-fencing}
---
# SNR manager's writes in its own namespace, by name where RBAC allows.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portcullis-snr
  namespace: portcullis-fencing
  labels: {app.kubernetes.io/managed-by: portcullis}
rules:
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [create]
  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: [self-node-remediation-ds]
    verbs: [get, update, patch, delete]
  - apiGroups: [apps]
    resources: [daemonsets/finalizers]
    resourceNames: [self-node-remediation-ds]
    verbs: [update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [self-node-remediation-certificates]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portcullis-snr
  namespace: portcullis-fencing
  labels: {app.kubernetes.io/managed-by: portcullis}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: portcullis-snr}
subjects:
  - {kind: ServiceAccount, name: self-node-remediation-controller-manager, namespace: portcullis-fencing}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-node-remediation-agent
  namespace: portcullis-fencing
  labels: {app.kubernetes.io/managed-by: portcullis}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portcullis-snr-agent
  labels: {app.kubernetes.io/managed-by: portcullis}
rules:
  # No Secret or pod right here: the peers' certificate and the peer pods
  # are the Role below (our SNR caches both in portcullis-fencing only).
  # Its own Node's annotations only (portcullis-node-labels judges it).
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, update]
  - apiGroups: [self-node-remediation.medik8s.io]
    resources: [selfnoderemediations, selfnoderemediationconfigs, selfnoderemediationtemplates]
    verbs: [get, list, watch]
  - apiGroups: [self-node-remediation.medik8s.io]
    resources: [selfnoderemediations/status]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portcullis-snr-agent
  labels: {app.kubernetes.io/managed-by: portcullis}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: portcullis-snr-agent}
subjects:
  - {kind: ServiceAccount, name: self-node-remediation-agent, namespace: portcullis-fencing}
---
# The agent's one Secret: its peers' certificate, by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portcullis-snr-agent
  namespace: portcullis-fencing
  labels: {app.kubernetes.io/managed-by: portcullis}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [self-node-remediation-certificates]
    verbs: [get, list, watch]
  # Its peers: the agent pods (internal/peers lists them by label).
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portcullis-snr-agent
  namespace: portcullis-fencing
  labels: {app.kubernetes.io/managed-by: portcullis}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: portcullis-snr-agent}
subjects:
  - {kind: ServiceAccount, name: self-node-remediation-agent, namespace: portcullis-fencing}
