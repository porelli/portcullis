# The two managers: our PriorityClass (ruling I5); pinned to the primary
# site's non-small nodes (their cluster-wide rights never on an edge or
# small node); the agent image by digest (SNR copies
# SELF_NODE_REMEDIATION_IMAGE into its DaemonSet) and SNR's agent template
# from the ConfigMap snr-install (the agents' own ServiceAccount), and the
# throwaway webhook serving certificate ha_install_fencing makes (Secret
# fencing-webhook-cert; no webhook configuration is registered, the servers
# only have to start).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-node-remediation-controller-manager
  namespace: portcullis-fencing
spec:
  template:
    spec:
      priorityClassName: portcullis-core
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: portcullis.io/site, operator: In, values: [main]}
                  - {key: portcullis.io/class, operator: NotIn, values: [small]}
      containers:
        - name: manager
          env:
            - name: SELF_NODE_REMEDIATION_IMAGE
              value: quay.io/medik8s/self-node-remediation-operator:v0.13.0@sha256:9ad002dca9ea183c72e350f72e47aff7020397fd476b4a3ac4ebc3627412a5b0
          volumeMounts:
            - name: webhook-cert
              mountPath: /apiserver.local.config/certificates
              readOnly: true
            - name: install
              mountPath: /install/self-node-remediation-deamonset.yaml
              subPath: self-node-remediation-deamonset.yaml
              readOnly: true
      volumes:
        - name: webhook-cert
          secret:
            secretName: fencing-webhook-cert
            items: [{key: tls.crt, path: apiserver.crt}, {key: tls.key, path: apiserver.key}]
        - name: install
          configMap:
            name: snr-install
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-healthcheck-controller-manager
  namespace: portcullis-fencing
spec:
  template:
    spec:
      priorityClassName: portcullis-core
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: portcullis.io/site, operator: In, values: [main]}
                  - {key: portcullis.io/class, operator: NotIn, values: [small]}
      containers:
        - name: manager
          volumeMounts:
            - name: webhook-cert
              mountPath: /apiserver.local.config/certificates
              readOnly: true
      volumes:
        - name: webhook-cert
          secret:
            secretName: fencing-webhook-cert
            items: [{key: tls.crt, path: apiserver.crt}, {key: tls.key, path: apiserver.key}]
