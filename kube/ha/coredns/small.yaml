# portcullis-dns-small (plan Task 25, controller ruling 3; fix round 2,
# re-review M-c; Task 28: edge nodes): k3s v1.37.2+k3s1's CoreDNS on each
# small node at the primary site (main), tolerating the small taint — k3s
# re-applies its own coredns.yaml at every start and its tolerations list
# with it, so the small nodes get our DaemonSet, which k3s never touches —
# and on EVERY node outside main (small or not): k3s's Deployment is
# required at main, so without it an edge pod's lookups crossed sites to
# main's CoreDNS (and, with a main node lost, hit its dead endpoint until
# it left; with main unreachable, failed). With PreferSameNode an edge pod
# asks its own node's CoreDNS, whose upstream is that node's resolv.conf
# (dnsPolicy Default) and whose kubernetes plugin reads the API over the
# mesh. The two node sets are one required node affinity of two terms
# (ORed): site main AND class small, or a site label that isn't main (a
# node without a site label — not labelled yet — gets none). Applied by
# ha.sh ha_coredns in HA only, removed with HA off; tests/k8s_hardening.py
# holds its shape:
#   - k3s's image (rancher/mirrored-coredns-coredns:1.14.7), pinned by its
#     index digest; its user 65532 (the image's nonroot);
#   - restricted: runAsNonRoot, RuntimeDefault seccomp, no escalation,
#     read-only root, drop ALL plus NET_BIND_SERVICE only — it binds :53,
#     and the image's /coredns carries the file capability
#     cap_net_bind_service (found live: without it in the bounding set the
#     exec itself fails, "operation not permitted");
#   - its own ServiceAccount portcullis-dns (Task 28 fix round 1, review M6:
#     the pod now runs on edge nodes too) whose ClusterRole reads only what
#     CoreDNS v1.14.7's kubernetes plugin watches with k3s's Corefile
#     (`pods insecure`): services and endpointslices (list / watch) and
#     namespaces (its namespace informer always runs,
#     plugin/kubernetes/controller.go:201-213); never pods (the pod informer
#     starts only with `pods verified`, kubernetes.go:304) or endpoints —
#     k3s's system:coredns would also let a compromised edge node read every
#     pod spec in the cluster; k3s's ConfigMaps coredns (Corefile,
#     NodeHosts) and coredns-custom, read-only;
#   - labelled k8s-app=kube-dns so Service kube-dns selects it (with
#     PreferSameNode, a small node's pods ask this one).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: portcullis-dns-small
  namespace: kube-system
  labels: {app.kubernetes.io/managed-by: portcullis}
spec:
  selector:
    matchLabels: {portcullis.io/component: dns-small}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {portcullis.io/component: dns-small, k8s-app: kube-dns}
    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: portcullis-dns
      automountServiceAccountToken: true
      dnsPolicy: Default
      nodeSelector: {kubernetes.io/os: linux}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: portcullis.io/site, operator: In, values: [main]}
                  - {key: portcullis.io/class, operator: In, values: [small]}
              - matchExpressions:
                  - {key: portcullis.io/site, operator: Exists}
                  - {key: portcullis.io/site, operator: NotIn, values: [main]}
      tolerations:
        - {key: portcullis.io/small, operator: Exists, effect: NoSchedule}
        - {key: CriticalAddonsOnly, operator: Exists}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: coredns
          image: docker.io/rancher/mirrored-coredns-coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - {containerPort: 53, name: dns, protocol: UDP}
            - {containerPort: 53, name: dns-tcp, protocol: TCP}
            - {containerPort: 9153, name: metrics, protocol: TCP}
          resources:
            limits: {memory: 170Mi}
            requests: {cpu: 100m, memory: 70Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: ["ALL"], add: ["NET_BIND_SERVICE"]}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /ready, port: 8181}
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - {name: config-volume, mountPath: /etc/coredns, readOnly: true}
            - {name: custom-config-volume, mountPath: /etc/coredns/custom, readOnly: true}
      volumes:
        - name: config-volume
          configMap:
            name: coredns
            items: [{key: Corefile, path: Corefile}, {key: NodeHosts, path: NodeHosts}]
        - name: custom-config-volume
          configMap: {name: coredns-custom, optional: true}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portcullis-dns
  namespace: kube-system
  labels: {app.kubernetes.io/managed-by: portcullis}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portcullis-dns
  labels: {app.kubernetes.io/managed-by: portcullis}
rules:
  - apiGroups: [""]
    resources: [services, namespaces]
    verbs: [list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portcullis-dns
  labels: {app.kubernetes.io/managed-by: portcullis}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: portcullis-dns}
subjects: [{kind: ServiceAccount, name: portcullis-dns, namespace: kube-system}]
---
# Both CoreDNS sets (k3s's Deployment and this DaemonSet) by k8s-app.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns
  namespace: kube-system
  labels: {app.kubernetes.io/managed-by: portcullis}
spec:
  minAvailable: 1
  selector:
    matchLabels: {k8s-app: kube-dns}
