# The provisioner's helper pod (it adds the hostPath under
# /var/lib/portcullis-storage and runs setup.sh / teardown.sh): uid 0 with
# CAP_CHOWN, CAP_DAC_OVERRIDE and CAP_FOWNER only — the runtime's other 11
# default capabilities dropped by name (the provisioner refuses
# capabilities.add without --allow-unsafe-helper-pod-template, never used),
# no new privileges, RuntimeDefault, read-only root, no token. The image is
# the CLI's pinned PORTCULLIS_HELPER_IMAGE (tests compare them).
apiVersion: v1
kind: Pod
metadata:
  name: helper-pod
  labels:
    portcullis.io/storage-helper: "true"
spec:
  automountServiceAccountToken: false
  priorityClassName: system-node-critical
  tolerations:
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: helper-pod
      image: docker.io/library/alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          memory: 32Mi
        requests:
          memory: 32Mi
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["AUDIT_WRITE", "FSETID", "KILL", "MKNOD", "NET_BIND_SERVICE", "NET_RAW", "SETFCAP", "SETGID", "SETPCAP", "SETUID", "SYS_CHROOT"]
