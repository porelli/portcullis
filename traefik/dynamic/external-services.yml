#       rule: "Host(`wiki.{{ env "PORTCULLIS_DOMAIN" }}`)"
#       entryPoints:
#         - websecure
#       tls:
#         options: protected
#       middlewares:
#         - client-headers
#         - security-headers
#       service: wiki
#
#   services:
#     wiki:
#       loadBalancer:
#         servers:
#           - url: "http://10.0.1.50:8080"

# Uncomment and modify the above to add non-Docker services.
