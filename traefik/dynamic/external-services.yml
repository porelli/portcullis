# File provider for non-Docker services (VMs, bare metal, external hosts).
# Add entries here for services that can't use Docker labels.
#
# Traefik will watch this file for changes — edits take effect immediately.
#
# Example: route wiki.portcullis.example.com to an external server
#
# http:
