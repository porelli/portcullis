# TLS options (tracked, static: `./portcullis config apply` never writes
# this file, and the Hub has no write access under traefik/). Contract §5
# "TLS tier per host".
#
# The Hub picks one per app router (all routers of a host share it), from
# the instance's compiled sign-in template and the certificate methods
# that are switched on (policy.Tier). Exactly these four options:
#
# protected:     RequireAndVerifyClientCert — a YubiKey certificate or the TLS
#                handshake fails. certs/ca-chain-yubikey.crt holds pki_int
#                ALONE, no root: Go trusts every caFiles certificate as an
#                anchor and uses the intermediates the client sends, and a
#                browser .p12 sends pki_file + root, so a root here would
#                admit browser certificates.
#                Used by auth.method: mtls apps and templates where every
#                alternative has yubikey_cert.
# protected-any: RequireAndVerifyClientCert — a YubiKey or browser certificate
#                (certs/ca-chain.crt = root + pki_int + pki_file).
#                Used by templates where every alternative has a certificate
#                method and at least one accepts browser_cert.
# authaware:     VerifyClientCertIfGiven    — either kind optional, verified if
#                present (certs/ca-chain.crt).
#                Used by templates where some alternative has a certificate,
#                and by every core router (auth, hub, people, the portal, the
#                consoles, enroll-invite, directory, mcp).
# public:        no clientAuth              — no certificate requested.
#                Used by everything else.
#
# A public exception turns protected / protected-any into authaware for all
# of the app's routers (policy.HostTier). Which method a presented
# certificate counts as is decided by its issuer (group-gate, Keycloak).
# Traefik's ./certs:/certs:ro mount carries both chain files (pki setup).

tls:
  options:
    protected:
      clientAuth:
        caFiles:
          - /certs/ca-chain-yubikey.crt
        clientAuthType: RequireAndVerifyClientCert
      minVersion: VersionTLS12
      sniStrict: false

    protected-any:
      clientAuth:
        caFiles:
          - /certs/ca-chain.crt
        clientAuthType: RequireAndVerifyClientCert
      minVersion: VersionTLS12
      sniStrict: false

    authaware:
      clientAuth:
        caFiles:
          - /certs/ca-chain.crt
        clientAuthType: VerifyClientCertIfGiven
      minVersion: VersionTLS12
      sniStrict: false

    public:
      minVersion: VersionTLS12
      sniStrict: false
