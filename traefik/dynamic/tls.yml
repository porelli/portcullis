# TLS options (tracked, static: `./portcullis config apply` never writes
# this file, and the Hub has no write access under traefik/). Contract §5
# "TLS tier per host".
#
# The Hub picks one per app router (all routers of a host share it), from
# the instance's compiled sign-in template and the certificate methods
# that are switched on. Core routers (auth, hub, people, the portal, the
# consoles, enroll, directory, mcp) always use authaware.
#
# protected:     RequireAndVerifyClientCert — a YubiKey certificate (root + pki_int
#                only: certs/ca-chain-yubikey.crt) or the TLS handshake fails;
#                a browser certificate never passes it
# protected-any: RequireAndVerifyClientCert — a YubiKey or browser certificate
#                (certs/ca-chain.crt = root + pki_int + pki_file)
# authaware:     VerifyClientCertIfGiven    — either kind optional, verified if present
# public:        no clientAuth              — no client cert requested

tls:
  options:
    protected:
      clientAuth:
        caFiles:
          - /certs/ca-chain-yubikey.crt
        clientAuthType: RequireAndVerifyClientCert
      minVersion: VersionTLS12
      sniStrict: false

    protected-any:
      clientAuth:
        caFiles:
          - /certs/ca-chain.crt
        clientAuthType: RequireAndVerifyClientCert
      minVersion: VersionTLS12
      sniStrict: false

    authaware:
      clientAuth:
        caFiles:
          - /certs/ca-chain.crt
        clientAuthType: VerifyClientCertIfGiven
      minVersion: VersionTLS12
      sniStrict: false

    public:
      minVersion: VersionTLS12
      sniStrict: false
