# Shared middleware definitions.
# Assign to routers via label: traefik.http.routers.<name>.middlewares=client-headers@file
#
# Traefik's passTLSClientCert middleware passes the presented YubiKey or
# browser certificate (and its info) to backends in the
# X-Forwarded-Tls-Client-Cert(-Info) headers.
#
# Spoofing: the websecure entrypoint deletes client-supplied
# X-Forwarded-Tls-Client-Cert(-Info) headers (no forwardedHeaders.trustedIPs)
# and their aliases (aliasHeadersStrategy=delete), so after these
# middlewares the headers only ever describe a certificate Traefik verified.
# Never add forwardedHeaders.insecure / trustedIPs on websecure: the
# certificate headers' integrity depends on Traefik deleting client copies.
#
# Attribute headers (X-Forwarded-Attr-*, contract §5): a headers middleware
# can only delete headers by exact name, and the field names are the Hub's.
# Client-sent copies are deleted by the forwardAuth middlewares instead —
# portcullis-auth, portcullis-auth-console, portcullis-groups and
# portcullis-public-guard all set authResponseHeadersRegex
# ^X-Forwarded-Attr-, and Traefik removes every request header matching it
# before copying the auth server's (only group-gate's / returns any). The
# entrypoints' aliasHeadersStrategy=delete drops `_` aliases.

http:
  middlewares:
    # Client-supplied address / scheme headers Traefik itself doesn't
    # manage, deleted on every router of websecure and vpnsecure (the
    # entrypoints' http.middlewares: they run first, also for the Hub's and
    # the templates' routers). Traefik replaces X-Forwarded-For / -Host /
    # -Proto / -Port / -Server and X-Real-Ip from the connection (on
    # vpnsecure: wg's PROXY v2 source, the tunnel address) because no
    # entrypoint trusts forwarded headers; these others it passed through
    # untouched (a client's `Forwarded: for=…` reached backends). An empty
    # value deletes the header. CI asserts every one, on both entrypoints.
    strip-client-forwarded:
      headers:
        customRequestHeaders:
          Forwarded: ""
          Forwarded-For: ""
          X-Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Scheme: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Url-Scheme: ""
          X-Original-Forwarded-For: ""
          X-Client-Ip: ""
          True-Client-Ip: ""
          Cf-Connecting-Ip: ""
          Fastly-Client-Ip: ""
          X-Cluster-Client-Ip: ""

    # Passes the presented certificate's details as headers to backends.
    # Backends receive:
    #   X-Forwarded-Tls-Client-Cert:      the certificates themselves (base64
    #                                     DER without BEGIN/END lines, set
    #                                     raw, comma-separated, leaf first)
    #   X-Forwarded-Tls-Client-Cert-Info: Structured info (subject, issuer, serial, etc.)
    # pem: true because group-gate decides a certificate's kind (YubiKey or
    # browser) and user from the leaf itself (its signature verified against
    # each CA, its CN parsed), never from the Info text: Traefik doesn't
    # escape `"`, `;` or `,` there, so a crafted CN could fake an Issuer.
    # Every gated router (core's and the templates') uses this middleware
    # before portcullis-groups, and forwardAuth passes the request headers on.
    client-headers:
      passTLSClientCert:
        pem: true
        info:
          notAfter: true
          notBefore: true
          sans: true
          serialNumber: true
          subject:
            commonName: true
            country: true
            organization: true
            organizationalUnit: true
          issuer:
            commonName: true

    # The same headers (now identical to client-headers): the name the
    # Keycloak (`traefik` x509 lookup provider) and people routers use for
    # the PEM they read.
    client-cert-pem:
      passTLSClientCert:
        pem: true
        info:
          notAfter: true
          notBefore: true
          sans: true
          serialNumber: true
          subject:
            commonName: true
            country: true
            organization: true
            organizationalUnit: true
          issuer:
            commonName: true

    # Rate limiting for public-facing endpoints (login, enrollment).
    # Allows 50 requests per second average, burst of 100.
    rate-limit:
      rateLimit:
        average: 50
        burst: 100

    # Stricter rate limit for auth endpoints (login, token).
    # Allows 10 requests per second average, burst of 20.
    rate-limit-auth:
      rateLimit:
        average: 10
        burst: 20

    # Security headers for all responses
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customRequestHeaders:
          X-Forwarded-Proto: https
