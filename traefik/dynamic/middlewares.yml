# Shared middleware definitions.
# Assign to routers via label: traefik.http.routers.<name>.middlewares=client-headers@file
#
# Traefik's passTLSClientCert middleware extracts client cert info and passes
# it to backends via the X-Forwarded-Tls-Client-Cert-Info header.
#
# Spoofing: the websecure entrypoint deletes client-supplied
# X-Forwarded-Tls-Client-Cert(-Info) headers (no forwardedHeaders.trustedIPs)
# and their aliases (aliasHeadersStrategy=delete), so after these
# middlewares the headers only ever describe a cert Traefik verified.
#
# Attribute headers (X-Forwarded-Attr-*, contract §5): a headers middleware
# can only delete headers by exact name, and the field names are the Hub's.
# Client-sent copies are deleted by the forwardAuth middlewares instead —
# portcullis-auth, portcullis-auth-console, portcullis-groups, portcullis-self
# and portcullis-public-guard all set authResponseHeadersRegex
# ^X-Forwarded-Attr-, and Traefik removes every request header matching it
# before copying the auth server's (only group-gate's /, /authenticated
# return any). The entrypoints' aliasHeadersStrategy=delete drops `_` aliases.

http:
  middlewares:
    # Passes client certificate details as headers to backends.
    # Backends receive:
    #   X-Forwarded-Tls-Client-Cert:      PEM bodies, comma-separated (client-cert-pem only)
    #   X-Forwarded-Tls-Client-Cert-Info: Structured info (subject, issuer, serial, etc.)
    client-headers:
      passTLSClientCert:
        pem: false
        info:
          notAfter: true
          notBefore: true
          sans: true
          serialNumber: true
          subject:
            commonName: true
            country: true
            organization: true
            organizationalUnit: true
          issuer:
            commonName: true

    # Same, plus the full cert as comma-separated PEM bodies in
    # X-Forwarded-Tls-Client-Cert (the format Keycloak's `traefik` x509
    # lookup provider reads). For auth.<domain> (X.509 login) and
    # enroll.<domain>/self (renewal of the presented cert's key) only.
    client-cert-pem:
      passTLSClientCert:
        pem: true
        info:
          notAfter: true
          notBefore: true
          sans: true
          serialNumber: true
          subject:
            commonName: true
            country: true
            organization: true
            organizationalUnit: true
          issuer:
            commonName: true

    # Rate limiting for public-facing endpoints (login, enrollment).
    # Allows 50 requests per second average, burst of 100.
    rate-limit:
      rateLimit:
        average: 50
        burst: 100

    # Stricter rate limit for auth endpoints (login, token).
    # Allows 10 requests per second average, burst of 20.
    rate-limit-auth:
      rateLimit:
        average: 10
        burst: 20

    # Security headers for all responses
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customRequestHeaders:
          X-Forwarded-Proto: https
